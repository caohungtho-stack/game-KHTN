ao tuổi.\nD. Giáo viên. Theo đáp án của ngân hàng: chọn B. Tất cả mọi người. Bảo vệ môi trường là trách nhiệm của cơ quan, tổ chức, cộng đồng và từng cá nhân. Không chỉ giao trách nhiệm cho nhà nước hoặc lực lượng chuyên môn."}],"totalForms":141,"sourceQuestionCount":null},"9":{"grade":9,"unitLabel":"Bài","shortName":"KHTN 9","description":"Vật lý – Hóa học – Sinh học","subjects":[{"name":"Vật lý","key":"physics","short":"Lý","range":"Bài 1–17","count":17},{"name":"Hóa học","key":"chemistry","short":"Hóa","range":"Bài 18–35","count":18},{"name":"Sinh học","key":"biology","short":"Sinh","range":"Bài 36–51","count":16}],"lessons":[{"number":1,"title":"NHẬN BIẾT DỤNG CỤ, HÓA CHẤT VÀ THUYẾT TRÌNH KHOA HỌC","subject":"Vật lý","intro":["Bài chủ yếu kiểm tra lựa chọn dụng cụ đúng, an toàn thí nghiệm và cấu trúc báo cáo khoa học."],"forms":[{"title":"Dạng 1. Chọn dụng cụ theo mục đích","tip":"Ghép từ khóa chức năng: phát hiện dòng cảm ứng → điện kế; tách hai chất lỏng không hòa tan → phễu chiết; hứng ảnh thật → màn; đọc góc quang học → bảng chia độ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Một hỗn hợp gồm dầu ăn và nước đã phân thành hai lớp. Dụng cụ phù hợp nhất để tách riêng hai chất lỏng là gì?\nA. Bát sứ.\nB. Bình cầu.\nC. Phễu chiết.\nD. Lưới tản nhiệt.","solution":"Hai chất lỏng không hòa tan và phân lớp ⇒ dùng phễu chiết. Không chọn phễu lọc vì lọc dùng cho rắn không tan trong lỏng.","trap":"Nhầm phễu thủy tinh dùng lọc với phễu chiết dùng tách hai lớp lỏng.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 2. Xử lí tình huống an toàn","tip":"Ưu tiên phương án không tiếp xúc trực tiếp, không nếm/ngửi, không tự ý pha trộn và báo người phụ trách. Với laser: tuyệt đối không chiếu vào mắt.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 [TH]. Một học sinh phát hiện một lọ hóa chất không có nhãn trong phòng thí nghiệm. Cách xử lí an toàn nhất là gì?\nA. Ngửi trực tiếp để đoán tên hóa chất.\nB. Nếm một lượng rất nhỏ để nhận biết.\nC. Trộn với hóa chất khác để quan sát phản ứng.\nD. Không tự ý sử dụng và báo ngay cho giáo viên hoặc người phụ trách.","solution":"Không sử dụng, không thử nhận biết; báo ngay giáo viên hoặc người phụ trách. Loại ngay các phương án “ngửi”, “nếm”, “trộn thử”.","trap":"Phương án có vẻ nhanh nhưng yêu cầu tiếp xúc trực tiếp với hóa chất luôn là bẫy.","extra":[],"exampleQuestionNumber":25},{"title":"Dạng 3. Xác định phần của báo cáo khoa học","tip":"Từ khóa: phương pháp = quy trình/dụng cụ/xử lí dữ liệu; kết quả = bảng, biểu đồ, số liệu; thảo luận = giải thích, so sánh; kết luận = phát hiện chính.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. Trong báo cáo nghiên cứu, nhóm học sinh phân tích ý nghĩa số liệu và so sánh kết quả với nghiên cứu khác. Nội dung này thuộc phần nào?\nA. Tiêu đề.\nB. Tóm tắt.\nC. Thảo luận.\nD. Tài liệu tham khảo.","solution":"Có “phân tích” và “so sánh” ⇒ phần Thảo luận.","trap":"Đừng chọn Kết quả nếu câu hỏi đã yêu cầu giải thích ý nghĩa số liệu.","extra":[],"exampleQuestionNumber":27}],"subjectKey":"physics","shortSubject":"Lý","slug":"bai-1","summary":"Bài chủ yếu kiểm tra lựa chọn dụng cụ đúng, an toàn thí nghiệm và cấu trúc báo cáo khoa học.","searchText":"NHẬN BIẾT DỤNG CỤ, HÓA CHẤT VÀ THUYẾT TRÌNH KHOA HỌC Bài chủ yếu kiểm tra lựa chọn dụng cụ đúng, an toàn thí nghiệm và cấu trúc báo cáo khoa học. Dạng 1. Chọn dụng cụ theo mục đích Ghép từ khóa chức năng: phát hiện dòng cảm ứng → điện kế; tách hai chất lỏng không hòa tan → phễu chiết; hứng ảnh thật → màn; đọc góc quang học → bảng chia độ. Theo Câu 19: Hỗn hợp dầu ăn và nước đã phân lớp, chọn dụng cụ tách. Hai chất lỏng không hòa tan và phân lớp ⇒ dùng phễu chiết. Không chọn phễu lọc vì lọc dùng cho rắn không tan trong lỏng. Nhầm phễu thủy tinh dùng lọc với phễu chiết dùng tách hai lớp lỏng.  Dạng 2. Xử lí tình huống an toàn Ưu tiên phương án không tiếp xúc trực tiếp, không nếm/ngửi, không tự ý pha trộn và báo người phụ trách. Với laser: tuyệt đối không chiếu vào mắt. Theo Câu 25: Phát hiện lọ hóa chất không nhãn. Không sử dụng, không thử nhận biết; báo ngay giáo viên hoặc người phụ trách. Loại ngay các phương án “ngửi”, “nếm”, “trộn thử”. Phương án có vẻ nhanh nhưng yêu cầu tiếp xúc trực tiếp với hóa chất luôn là bẫy.  Dạng 3. Xác định phần của báo cáo khoa học Từ khóa: phương pháp = quy trình/dụng cụ/xử lí dữ liệu; kết quả = bảng, biểu đồ, số liệu; thảo luận = giải thích, so sánh; kết luận = phát hiện chính. Theo Câu 27: Phân tích ý nghĩa số liệu và so sánh với nghiên cứu khác thuộc phần nào? Có “phân tích” và “so sánh” ⇒ phần Thảo luận. Đừng chọn Kết quả nếu câu hỏi đã yêu cầu giải thích ý nghĩa số liệu. "},{"number":2,"title":"ĐỘNG NĂNG – THẾ NĂNG","subject":"Vật lý","intro":["Trọng tâm là công thức, tỉ lệ biến thiên và chọn mốc thế năng."],"forms":[{"title":"Dạng 1. Tính động năng","tip":"Đổi đúng đơn vị kg, m/s rồi thay Wđ = 1/2mv². Bình phương tốc độ trước.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 26 [TH]. Một quả bóng có khối lượng 0,5 kg chuyển động với tốc độ 4 m/s. Động năng của quả bóng bằng bao nhiêu?\nA. 1 J.\nB. 2 J.\nC. 8 J.\nD. 4 J.","solution":"Wđ = 1/2·0,5·4² = 4 J.","trap":"Quên bình phương v hoặc quên hệ số 1/2.","extra":[],"exampleQuestionNumber":26},{"title":"Dạng 2. So sánh động năng bằng tỉ số","tip":"Dùng Wđ2/Wđ1 = (m2/m1)(v2/v1)²; không cần tính từng giá trị.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Một vật tăng tốc độ từ v lên 3v, khối lượng không đổi. Động năng của vật sau đó bằng bao nhiêu lần động năng ban đầu?\nA. 3 lần.\nB. 6 lần.\nC. 9 lần.\nD. 12 lần.","solution":"Wđ sau/Wđ đầu = 3² = 9 ⇒ tăng 9 lần.","trap":"Tốc độ tăng k lần thì động năng tăng k² lần, không phải k lần.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 3. Tính thế năng trọng trường","tip":"Chọn đúng mốc; h là độ cao so với mốc. Dùng g = 10 N/kg nếu đề cho.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 [TH]. Một vật có khối lượng 2 kg ở độ cao 3 m so với mặt đất. Lấy g = 10 N/kg và chọn mặt đất làm mốc thế năng. Thế năng trọng trường của vật là bao nhiêu?\nA. 20 J.\nB. 60 J.\nC. 30 J.\nD. 90 J.","solution":"Wt = 2·10·3 = 60 J.","trap":"Nhầm khối lượng m với trọng lượng P. Nếu dùng Wt=Ph thì P=mg.","extra":[],"exampleQuestionNumber":25},{"title":"Dạng 4. So sánh thế năng","tip":"Cùng mốc và cùng g: Wt tỉ lệ với m·h. Cùng m thì chỉ so h; cùng h thì chỉ so m.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Hai vật có cùng khối lượng. Vật A ở độ cao 2 m, vật B ở độ cao 5 m so với cùng một mốc. So sánh thế năng trọng trường của hai vật.\nA. Thế năng của A gấp 2,5 lần thế năng của B.\nB. Thế năng của hai vật bằng nhau.\nC. Thế năng của B gấp 5 lần thế năng của A.\nD. Thế năng của B gấp 2,5 lần thế năng của A.","solution":"WtB/WtA = 5/2 = 2,5 ⇒ vật B có thế năng gấp 2,5 lần.","trap":"Thế năng phụ thuộc mốc chọn; không nói “thế năng tuyệt đối”.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 5. Bài biến đổi đồng thời m và v","tip":"Nhân các hệ số: m tăng a lần, v giảm b lần ⇒ Wđ đổi a·b² lần, với b là tỉ số v mới/v cũ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 30 [TH]. Một vật có khối lượng tăng gấp bốn lần, đồng thời tốc độ giảm còn một nửa. Động năng của vật thay đổi thế nào?\nA. Tăng gấp bốn lần.\nB. Giảm còn một nửa.\nC. Tăng gấp đôi.\nD. Không thay đổi.","solution":"Wđ mới/Wđ cũ = 4·(1/2)² = 1 ⇒ không đổi.","trap":"Không cộng phần trăm thay đổi của m và v.","extra":[],"exampleQuestionNumber":30}],"subjectKey":"physics","shortSubject":"Lý","slug":"bai-2","summary":"Trọng tâm là công thức, tỉ lệ biến thiên và chọn mốc thế năng.","searchText":"ĐỘNG NĂNG – THẾ NĂNG Trọng tâm là công thức, tỉ lệ biến thiên và chọn mốc thế năng. Dạng 1. Tính động năng Đổi đúng đơn vị kg, m/s rồi thay Wđ = 1/2mv². Bình phương tốc độ trước. Theo Câu 26: m = 0,5 kg, v = 4 m/s. Wđ = 1/2·0,5·4² = 4 J. Quên bình phương v hoặc quên hệ số 1/2.  Dạng 2. So sánh động năng bằng tỉ số Dùng Wđ2/Wđ1 = (m2/m1)(v2/v1)²; không cần tính từng giá trị. Theo Câu 20: Tốc độ tăng từ v lên 3v, m không đổi. Wđ sau/Wđ đầu = 3² = 9 ⇒ tăng 9 lần. Tốc độ tăng k lần thì động năng tăng k² lần, không phải k lần.  Dạng 3. Tính thế năng trọng trường Chọn đúng mốc; h là độ cao so với mốc. Dùng g = 10 N/kg nếu đề cho. Theo Câu 25: m = 2 kg, h = 3 m, g = 10 N/kg. Wt = 2·10·3 = 60 J. Nhầm khối lượng m với trọng lượng P. Nếu dùng Wt=Ph thì P=mg.  Dạng 4. So sánh thế năng Cùng mốc và cùng g: Wt tỉ lệ với m·h. Cùng m thì chỉ so h; cùng h thì chỉ so m. Theo Câu 22: Hai vật cùng m, ở 2 m và 5 m. WtB/WtA = 5/2 = 2,5 ⇒ vật B có thế năng gấp 2,5 lần. Thế năng phụ thuộc mốc chọn; không nói “thế năng tuyệt đối”.  Dạng 5. Bài biến đổi đồng thời m và v Nhân các hệ số: m tăng a lần, v giảm b lần ⇒ Wđ đổi a·b² lần, với b là tỉ số v mới/v cũ. Theo Câu 30: m tăng 4 lần, v giảm còn 1/2. Wđ mới/Wđ cũ = 4·(1/2)² = 1 ⇒ không đổi. Không cộng phần trăm thay đổi của m và v. "},{"number":3,"title":"CƠ NĂNG","subject":"Vật lý","intro":["Dùng tổng động năng và thế năng; bảo toàn khi bỏ qua ma sát và sức cản."],"forms":[{"title":"Dạng 1. Tính cơ năng tại một vị trí","tip":"Tính riêng Wđ và Wt rồi cộng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Một vật có khối lượng 2 kg chuyển động với tốc độ 3 m/s ở độ cao 5 m. Lấy g = 10 m/s². Cơ năng của vật là bao nhiêu?\nA. 118 J.\nB. 91 J.\nC. 109 J.\nD. 100 J.","solution":"Wđ=9 J; Wt=100 J ⇒ W=109 J.","trap":"Không lấy hiệu Wđ−Wt.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 2. Nhận biết chuyển hóa khi vật đi lên hoặc đi xuống","tip":"Đi lên: v giảm ⇒ Wđ giảm, h tăng ⇒ Wt tăng. Đi xuống: ngược lại. Nếu bỏ qua cản, cơ năng không đổi.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Một con lắc chuyển động từ vị trí biên xuống vị trí cân bằng. Bỏ qua ma sát. Sự chuyển hóa năng lượng diễn ra như thế nào?\nA. Thế năng giảm, động năng tăng, cơ năng không đổi.\nB. Thế năng và động năng đều giảm.\nC. Động năng không đổi, thế năng tăng.\nD. Thế năng tăng, động năng giảm, cơ năng tăng.","solution":"Độ cao giảm ⇒ thế năng giảm; tốc độ tăng ⇒ động năng tăng; cơ năng không đổi.","trap":"Không kết luận cơ năng tăng chỉ vì động năng tăng.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 3. Vị trí cực đại – cực tiểu","tip":"Ở vị trí cao nhất của vật ném thẳng đứng: v=0 ⇒ Wđ=0, Wt lớn nhất. Ở vị trí thấp nhất của con lắc: Wđ lớn nhất.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Một quả bóng được ném thẳng đứng lên cao. Bỏ qua sức cản không khí. Ở vị trí cao nhất, nhận xét nào đúng?\nA. Động năng lớn nhất, thế năng bằng 0.\nB. Động năng và thế năng đều bằng 0.\nC. Cơ năng tăng lên vì vật ở cao hơn.\nD. Động năng bằng 0, thế năng lớn nhất và cơ năng không đổi.","solution":"Chọn “động năng bằng 0, thế năng lớn nhất, cơ năng không đổi”.","trap":"Tốc độ bằng 0 tại một thời điểm không có nghĩa cơ năng bằng 0.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 4. Cơ năng khi có ma sát","tip":"Cơ năng giảm vì chuyển hóa sang nhiệt năng, âm năng hoặc biến dạng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. Một quả bóng nảy lên thấp hơn độ cao ban đầu sau mỗi lần chạm đất. Nguyên nhân phù hợp nhất là gì?\nA. Khối lượng của bóng giảm nhanh sau mỗi lần nảy.\nB. Thế năng của bóng tự sinh thêm.\nC. Một phần cơ năng chuyển hóa thành nhiệt năng và âm năng.\nD. Gia tốc trọng trường tăng sau mỗi lần nảy.","solution":"Một phần cơ năng chuyển thành nhiệt và âm nên độ cao sau giảm.","trap":"Năng lượng không mất đi; chỉ cơ năng giảm.","extra":[],"exampleQuestionNumber":27}],"subjectKey":"physics","shortSubject":"Lý","slug":"bai-3","summary":"Dùng tổng động năng và thế năng; bảo toàn khi bỏ qua ma sát và sức cản.","searchText":"CƠ NĂNG Dùng tổng động năng và thế năng; bảo toàn khi bỏ qua ma sát và sức cản. Dạng 1. Tính cơ năng tại một vị trí Tính riêng Wđ và Wt rồi cộng. Theo Câu 19: m=2 kg, v=3 m/s, h=5 m, g=10. Wđ=9 J; Wt=100 J ⇒ W=109 J. Không lấy hiệu Wđ−Wt.  Dạng 2. Nhận biết chuyển hóa khi vật đi lên hoặc đi xuống Đi lên: v giảm ⇒ Wđ giảm, h tăng ⇒ Wt tăng. Đi xuống: ngược lại. Nếu bỏ qua cản, cơ năng không đổi. Theo Câu 21: Con lắc từ biên xuống cân bằng. Độ cao giảm ⇒ thế năng giảm; tốc độ tăng ⇒ động năng tăng; cơ năng không đổi. Không kết luận cơ năng tăng chỉ vì động năng tăng.  Dạng 3. Vị trí cực đại – cực tiểu Ở vị trí cao nhất của vật ném thẳng đứng: v=0 ⇒ Wđ=0, Wt lớn nhất. Ở vị trí thấp nhất của con lắc: Wđ lớn nhất. Theo Câu 20: Quả bóng ở vị trí cao nhất. Chọn “động năng bằng 0, thế năng lớn nhất, cơ năng không đổi”. Tốc độ bằng 0 tại một thời điểm không có nghĩa cơ năng bằng 0.  Dạng 4. Cơ năng khi có ma sát Cơ năng giảm vì chuyển hóa sang nhiệt năng, âm năng hoặc biến dạng. Theo Câu 27: Bóng nảy thấp dần. Một phần cơ năng chuyển thành nhiệt và âm nên độ cao sau giảm. Năng lượng không mất đi; chỉ cơ năng giảm. "},{"number":4,"title":"CÔNG VÀ CÔNG SUẤT","subject":"Vật lý","intro":["Trọng tâm là điều kiện có công, công A=Fs, công suất P=A/t và hiệu suất."],"forms":[{"title":"Dạng 1. Nhận biết có hay không có công cơ học","tip":"Có lực nhưng vật không dịch chuyển, hoặc lực vuông góc chuyển dời ⇒ công của lực bằng 0.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Một người xách túi đi đều trên đường nằm ngang. Công của lực nâng túi theo phương thẳng đứng bằng bao nhiêu?\nA. Bằng trọng lượng của túi\nB. Bằng quãng đường người đi\nC. Lớn hơn 0\nD. Bằng 0","solution":"Chuyển dời ngang, lực nâng thẳng đứng ⇒ vuông góc ⇒ công bằng 0.","trap":"Đừng nhầm “người mệt” với “lực thực hiện công cơ học”.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 2. Tính công khi lực cùng hướng","tip":"Nhân trực tiếp F·s, đơn vị N·m = J.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Một lực kéo 50 N làm vật dịch chuyển 4 m theo hướng của lực. Công của lực kéo bằng bao nhiêu?\nA. 12,5 J\nB. 54 J\nC. 200 J\nD. 400 J","solution":"A=50·4=200 J.","trap":"Không chia F cho s.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 3. Tính công suất","tip":"P=A/t; đổi phút, giờ sang giây nếu cần kết quả W.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 26 [TH]. Một máy nâng vật có trọng lượng 500 N lên độ cao 10 m trong 25 s. Công suất trung bình của máy là bao nhiêu?\nA. 20 W\nB. 50 W\nC. 5 000 W\nD. 200 W","solution":"A=500·10=5000 J; P=5000/25=200 W.","trap":"Trong bài nâng thẳng đứng, lực nâng tối thiểu bằng trọng lượng khi chuyển động đều.","extra":[],"exampleQuestionNumber":26},{"title":"Dạng 4. Tính công từ công suất","tip":"A=P·t. Đổi kW→W hoặc giữ kW·h nếu hỏi kWh.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 [TH]. Một động cơ có công suất 1,5 kW hoạt động trong 20 s. Công do động cơ thực hiện là bao nhiêu?\nA. 75 J\nB. 30 kJ\nC. 3 kJ\nD. 300 kJ","solution":"P=1500 W ⇒ A=1500·20=30000 J=30 kJ.","trap":"Không nhân 1,5 trực tiếp với 20 rồi ghi J.","extra":[],"exampleQuestionNumber":25},{"title":"Dạng 5. So sánh công suất hai máy","tip":"Cùng công: máy làm nhanh hơn có P lớn hơn. Khác công, khác thời gian: tính A/t hoặc so tỉ số.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Máy A thực hiện công 1 200 J trong 10 s, máy B thực hiện công 900 J trong 5 s. Máy nào có công suất lớn hơn?\nA. Máy B\nB. Máy A\nC. Hai máy bằng nhau\nD. Không xác định được","solution":"PA=120 W; PB=180 W ⇒ máy B lớn hơn.","trap":"Không chỉ so công hoặc chỉ so thời gian.","extra":[],"exampleQuestionNumber":23},{"title":"Dạng 6. Hiệu suất","tip":"Công có ích = H·năng lượng vào. Bài tính đầu vào thì chia cho H.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 28 [TH]. Một động cơ có hiệu suất 25%, nhận vào 2 000 J năng lượng. Công có ích mà động cơ tạo ra là bao nhiêu?\nA. 8 000 J\nB. 1 500 J\nC. 500 J\nD. 50 J","solution":"Aích=0,25·2000=500 J.","trap":"Hiệu suất phải đổi từ % sang số thập phân.","extra":[],"exampleQuestionNumber":28}],"subjectKey":"physics","shortSubject":"Lý","slug":"bai-4","summary":"Trọng tâm là điều kiện có công, công A=Fs, công suất P=A/t và hiệu suất.","searchText":"CÔNG VÀ CÔNG SUẤT Trọng tâm là điều kiện có công, công A=Fs, công suất P=A/t và hiệu suất. Dạng 1. Nhận biết có hay không có công cơ học Có lực nhưng vật không dịch chuyển, hoặc lực vuông góc chuyển dời ⇒ công của lực bằng 0. Theo Câu 21: Xách túi đi đều trên đường ngang, xét lực nâng thẳng đứng. Chuyển dời ngang, lực nâng thẳng đứng ⇒ vuông góc ⇒ công bằng 0. Đừng nhầm “người mệt” với “lực thực hiện công cơ học”.  Dạng 2. Tính công khi lực cùng hướng Nhân trực tiếp F·s, đơn vị N·m = J. Theo Câu 19: F=50 N, s=4 m. A=50·4=200 J. Không chia F cho s.  Dạng 3. Tính công suất P=A/t; đổi phút, giờ sang giây nếu cần kết quả W. Theo Câu 26: Nâng vật P=500 N lên h=10 m trong 25 s. A=500·10=5000 J; P=5000/25=200 W. Trong bài nâng thẳng đứng, lực nâng tối thiểu bằng trọng lượng khi chuyển động đều.  Dạng 4. Tính công từ công suất A=P·t. Đổi kW→W hoặc giữ kW·h nếu hỏi kWh. Theo Câu 25: P=1,5 kW, t=20 s. P=1500 W ⇒ A=1500·20=30000 J=30 kJ. Không nhân 1,5 trực tiếp với 20 rồi ghi J.  Dạng 5. So sánh công suất hai máy Cùng công: máy làm nhanh hơn có P lớn hơn. Khác công, khác thời gian: tính A/t hoặc so tỉ số. Theo Câu 23: A thực hiện 1200 J/10 s; B thực hiện 900 J/5 s. PA=120 W; PB=180 W ⇒ máy B lớn hơn. Không chỉ so công hoặc chỉ so thời gian.  Dạng 6. Hiệu suất Công có ích = H·năng lượng vào. Bài tính đầu vào thì chia cho H. Theo Câu 28: H=25%, năng lượng vào 2000 J. Aích=0,25·2000=500 J. Hiệu suất phải đổi từ % sang số thập phân. "},{"number":5,"title":"KHÚC XẠ ÁNH SÁNG","subject":"Vật lý","intro":["Dùng chiết suất, định luật khúc xạ và quy tắc lệch gần/xa pháp tuyến."],"forms":[{"title":"Dạng 1. Tính chiết suất hoặc tốc độ ánh sáng","tip":"Dùng tam giác công thức n=c/v; suy ra v=c/n.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Tốc độ ánh sáng trong một môi trường là 2,0.10^8 m/s. Lấy c = 3,0.10^8 m/s. Chiết suất của môi trường bằng bao nhiêu?\nA. 0,67.\nB. 1,5.\nC. 1,0.\nD. 2,0.","solution":"n=c/v=1,5.","trap":"Chiết suất không có đơn vị và thường ≥1.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 2. Dự đoán hướng lệch tia","tip":"So n₂ với n₁: n₂>n₁ ⇒ r<i, gần pháp tuyến; n₂<n₁ ⇒ r>i, xa pháp tuyến.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 29 [TH]. Hai môi trường có chiết suất lần lượt là n1 = 1,2 và n2 = 1,6. Ánh sáng truyền từ môi trường 1 sang môi trường 2 theo phương xiên. Nhận xét nào đúng?\nA. Tốc độ ánh sáng giảm và tia lệch gần pháp tuyến.\nB. Tốc độ ánh sáng tăng và tia lệch xa pháp tuyến.\nC. Tốc độ ánh sáng không đổi và tia truyền thẳng.\nD. Tốc độ ánh sáng tăng và tia lệch gần pháp tuyến.","solution":"Tốc độ giảm vì n tăng; tia lệch gần pháp tuyến.","trap":"Không dùng từ “nặng hơn/nhẹ hơn” thay cho so sánh chiết suất.","extra":[],"exampleQuestionNumber":29},{"title":"Dạng 3. Tính sin góc khúc xạ","tip":"Biến đổi sin r = n₁sin i/n₂. Trắc nghiệm thường chỉ hỏi sin r nên không cần bấm arcsin.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 [TH]. Một tia sáng đi từ không khí vào thủy tinh với i = 30°, nkhông khí ≈ 1 và nthủy tinh = 1,5. Giá trị sin r gần nhất là bao nhiêu?\nA. 0,33.\nB. 0,50.\nC. 0,67.\nD. 0,75.","solution":"sin r = 1·0,5/1,5 ≈ 0,33.","trap":"Đừng thay góc theo độ trực tiếp vào công thức; phải dùng sin i.","extra":[],"exampleQuestionNumber":25},{"title":"Dạng 4. Tính chiết suất từ hai góc","tip":"Nếu từ không khí: n≈sin i/sin r.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 30 [TH]. Tia sáng truyền từ không khí vào một chất lỏng với i = 45° và r = 30°. Lấy n không khí ≈ 1. Chiết suất của chất lỏng gần nhất với giá trị nào?\nA. 1,00.\nB. 1,41.\nC. 1,20.\nD. 1,73.","solution":"n≈sin45°/sin30°≈0,707/0,5≈1,41.","trap":"Góc đo với pháp tuyến, không đo với mặt phân cách.","extra":[],"exampleQuestionNumber":30},{"title":"Dạng 5. Tia tới theo pháp tuyến","tip":"i=0° ⇒ r=0°, tia không đổi hướng dù tốc độ thay đổi.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. Một tia sáng truyền đúng theo pháp tuyến từ không khí vào thủy tinh. Kết luận nào đúng?\nA. Tia sáng bị lệch ra xa pháp tuyến.\nB. Tia sáng bị phản xạ hoàn toàn.\nC. Tia sáng không bị đổi hướng.\nD. Tia sáng truyền dọc theo mặt phân cách.","solution":"Chọn “không bị đổi hướng”.","trap":"Không nói “không có khúc xạ”; vẫn đổi tốc độ, chỉ không đổi phương.","extra":[],"exampleQuestionNumber":27}],"subjectKey":"physics","shortSubject":"Lý","slug":"bai-5","summary":"Dùng chiết suất, định luật khúc xạ và quy tắc lệch gần/xa pháp tuyến.","searchText":"KHÚC XẠ ÁNH SÁNG Dùng chiết suất, định luật khúc xạ và quy tắc lệch gần/xa pháp tuyến. Dạng 1. Tính chiết suất hoặc tốc độ ánh sáng Dùng tam giác công thức n=c/v; suy ra v=c/n. Theo Câu 22: v=2,0×10⁸ m/s, c=3,0×10⁸ m/s. n=c/v=1,5. Chiết suất không có đơn vị và thường ≥1.  Dạng 2. Dự đoán hướng lệch tia So n₂ với n₁: n₂>n₁ ⇒ r<i, gần pháp tuyến; n₂<n₁ ⇒ r>i, xa pháp tuyến. Theo Câu 29: n₁=1,2 sang n₂=1,6. Tốc độ giảm vì n tăng; tia lệch gần pháp tuyến. Không dùng từ “nặng hơn/nhẹ hơn” thay cho so sánh chiết suất.  Dạng 3. Tính sin góc khúc xạ Biến đổi sin r = n₁sin i/n₂. Trắc nghiệm thường chỉ hỏi sin r nên không cần bấm arcsin. Theo Câu 25: Không khí→thủy tinh, i=30°, n₂=1,5. sin r = 1·0,5/1,5 ≈ 0,33. Đừng thay góc theo độ trực tiếp vào công thức; phải dùng sin i.  Dạng 4. Tính chiết suất từ hai góc Nếu từ không khí: n≈sin i/sin r. Theo Câu 30: i=45°, r=30°. n≈sin45°/sin30°≈0,707/0,5≈1,41. Góc đo với pháp tuyến, không đo với mặt phân cách.  Dạng 5. Tia tới theo pháp tuyến i=0° ⇒ r=0°, tia không đổi hướng dù tốc độ thay đổi. Theo Câu 27: Tia truyền đúng pháp tuyến từ không khí vào thủy tinh. Chọn “không bị đổi hướng”. Không nói “không có khúc xạ”; vẫn đổi tốc độ, chỉ không đổi phương. "},{"number":6,"title":"PHẢN XẠ TOÀN PHẦN","subject":"Vật lý","intro":["Xác định đúng chiều truyền và so sánh góc tới với góc giới hạn."],"forms":[{"title":"Dạng 1. Kiểm tra có thể xảy ra phản xạ toàn phần","tip":"Bước 1 phải kiểm tra n₁>n₂. Nếu đi từ chiết suất nhỏ sang lớn thì loại ngay.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 28 [TH]. Vì sao ánh sáng truyền từ không khí vào thủy tinh không thể xảy ra phản xạ toàn phần?\nA. Vì ánh sáng truyền từ môi trường có chiết suất nhỏ sang môi trường có chiết suất lớn.\nB. Vì thủy tinh không phản xạ ánh sáng.\nC. Vì không khí hấp thụ hết ánh sáng.\nD. Vì góc tới trong không khí luôn bằng 0°.","solution":"n không khí < n thủy tinh ⇒ không thể phản xạ toàn phần.","trap":"Chỉ so góc tới mà quên điều kiện chiều truyền.","extra":[],"exampleQuestionNumber":28},{"title":"Dạng 2. Tính góc giới hạn","tip":"Tính sin i_gh=n₂/n₁; nếu cần góc mới bấm arcsin.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Ánh sáng truyền từ nước có chiết suất 1,33 ra không khí. Góc giới hạn gần nhất với giá trị nào?\nA. 32°.\nB. 42°.\nC. 49°.\nD. 60°.","solution":"sin i_gh=1/1,33≈0,752 ⇒ i_gh≈49°.","trap":"Tỉ số phải nhỏ hơn 1; nếu ra >1 là đảo n₁,n₂.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 3. So góc tới với góc giới hạn","tip":"Sau khi đủ điều kiện n₁>n₂: i>i_gh ⇒ phản xạ toàn phần; i<i_gh ⇒ có tia khúc xạ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Một tia sáng truyền từ thủy tinh ra không khí với góc tới 50°. Biết góc giới hạn khoảng 42°. Hiện tượng xảy ra là gì?\nA. Tia sáng truyền thẳng sang không khí.\nB. Có tia khúc xạ nằm sát pháp tuyến.\nC. Phản xạ toàn phần.\nD. Không có tia phản xạ.","solution":"50°>42° ⇒ phản xạ toàn phần.","trap":"Tại i=i_gh, theo các câu chi tiết của nguồn, tia khúc xạ nằm dọc mặt phân cách.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 4. Cáp quang","tip":"Từ khóa: lõi có n lớn hơn vỏ; ánh sáng phản xạ toàn phần liên tiếp; i nhỏ hơn i_gh gây rò sang vỏ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 29 [TH]. Một tia sáng trong sợi quang tới mặt phân cách lõi - vỏ với góc tới nhỏ hơn góc giới hạn. Hệ quả nào dễ xảy ra nhất?\nA. Ánh sáng tiếp tục được giữ hoàn toàn trong lõi.\nB. Một phần ánh sáng truyền sang lớp vỏ, làm tăng hao phí tín hiệu.\nC. Ánh sáng bị đổi thành dòng điện.\nD. Tốc độ ánh sáng tăng vô hạn.","solution":"Không đủ phản xạ toàn phần ⇒ một phần truyền sang vỏ, tăng hao phí tín hiệu.","trap":"Nhầm “góc tới nhỏ” với “dễ phản xạ toàn phần”.","extra":[],"exampleQuestionNumber":29}],"subjectKey":"physics","shortSubject":"Lý","slug":"bai-6","summary":"Xác định đúng chiều truyền và so sánh góc tới với góc giới hạn.","searchText":"PHẢN XẠ TOÀN PHẦN Xác định đúng chiều truyền và so sánh góc tới với góc giới hạn. Dạng 1. Kiểm tra có thể xảy ra phản xạ toàn phần Bước 1 phải kiểm tra n₁>n₂. Nếu đi từ chiết suất nhỏ sang lớn thì loại ngay. Theo Câu 28: Không khí vào thủy tinh. n không khí < n thủy tinh ⇒ không thể phản xạ toàn phần. Chỉ so góc tới mà quên điều kiện chiều truyền.  Dạng 2. Tính góc giới hạn Tính sin i_gh=n₂/n₁; nếu cần góc mới bấm arcsin. Theo Câu 20: Nước n=1,33 ra không khí n=1. sin i_gh=1/1,33≈0,752 ⇒ i_gh≈49°. Tỉ số phải nhỏ hơn 1; nếu ra >1 là đảo n₁,n₂.  Dạng 3. So góc tới với góc giới hạn Sau khi đủ điều kiện n₁>n₂: i>i_gh ⇒ phản xạ toàn phần; i<i_gh ⇒ có tia khúc xạ. Theo Câu 21: Thủy tinh ra không khí, i=50°, i_gh≈42°. 50°>42° ⇒ phản xạ toàn phần. Tại i=i_gh, theo các câu chi tiết của nguồn, tia khúc xạ nằm dọc mặt phân cách.  Dạng 4. Cáp quang Từ khóa: lõi có n lớn hơn vỏ; ánh sáng phản xạ toàn phần liên tiếp; i nhỏ hơn i_gh gây rò sang vỏ. Theo Câu 29: Tia trong lõi tới mặt phân cách với i<i_gh. Không đủ phản xạ toàn phần ⇒ một phần truyền sang vỏ, tăng hao phí tín hiệu. Nhầm “góc tới nhỏ” với “dễ phản xạ toàn phần”. "},{"number":7,"title":"LĂNG KÍNH","subject":"Vật lý","intro":["Bài chủ yếu là hướng lệch, tán sắc và màu sắc của vật dưới ánh sáng màu."],"forms":[{"title":"Dạng 1. Hướng lệch của tia qua lăng kính","tip":"Tia ló thường lệch về phía đáy lăng kính. Góc chiết quang tăng thì độ lệch thường tăng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Khi tăng góc chiết quang của lăng kính trong cùng điều kiện chiếu sáng, độ lệch của tia ló thường\nA. giảm về 0.\nB. không đổi.\nC. tăng.\nD. luôn bằng 90°.","solution":"Độ lệch của tia ló thường tăng.","trap":"Không nhầm tia lệch về đỉnh.","extra":[],"exampleQuestionNumber":23},{"title":"Dạng 2. Tán sắc ánh sáng trắng","tip":"Ánh sáng trắng gồm nhiều màu; đỏ lệch ít nhất, tím lệch nhiều nhất. Ánh sáng đơn sắc chỉ bị lệch, không tách màu.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Một tia laser đỏ đi qua lăng kính. Hiện tượng quan sát được phù hợp nhất là\nA. tia sáng tách thành đủ các màu cầu vồng.\nB. tia sáng chỉ bị lệch mà không bị tách thành nhiều màu.\nC. tia sáng không bị khúc xạ.\nD. tia sáng bị hấp thụ hoàn toàn.","solution":"Laser đỏ là đơn sắc ⇒ chỉ bị lệch, không tách thành cầu vồng.","trap":"Lăng kính không tự phát ra màu.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 3. Màu của vật dưới ánh sáng màu","tip":"Vật chỉ sáng màu khi nguồn có thành phần màu mà vật phản xạ. Giấy trắng phản xạ màu đang chiếu; vật đen hấp thụ phần lớn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 26 [TH]. Một vật màu đỏ đặt dưới ánh sáng trắng phản xạ ánh sáng đỏ tới mắt. Nếu đặt vật trong phòng chỉ có ánh sáng xanh lam, vật sẽ có xu hướng\nA. vẫn đỏ rực như cũ.\nB. trắng sáng.\nC. tối hoặc gần đen.\nD. chuyển thành màu tím.","solution":"Nguồn không có đỏ để vật phản xạ ⇒ vật tối hoặc gần đen.","trap":"Không mặc định vật luôn giữ màu như dưới ánh sáng trắng.","extra":[],"exampleQuestionNumber":26}],"subjectKey":"physics","shortSubject":"Lý","slug":"bai-7","summary":"Bài chủ yếu là hướng lệch, tán sắc và màu sắc của vật dưới ánh sáng màu.","searchText":"LĂNG KÍNH Bài chủ yếu là hướng lệch, tán sắc và màu sắc của vật dưới ánh sáng màu. Dạng 1. Hướng lệch của tia qua lăng kính Tia ló thường lệch về phía đáy lăng kính. Góc chiết quang tăng thì độ lệch thường tăng. Theo Câu 23: Tăng góc chiết quang trong cùng điều kiện. Độ lệch của tia ló thường tăng. Không nhầm tia lệch về đỉnh.  Dạng 2. Tán sắc ánh sáng trắng Ánh sáng trắng gồm nhiều màu; đỏ lệch ít nhất, tím lệch nhiều nhất. Ánh sáng đơn sắc chỉ bị lệch, không tách màu. Theo Câu 22: Laser đỏ qua lăng kính. Laser đỏ là đơn sắc ⇒ chỉ bị lệch, không tách thành cầu vồng. Lăng kính không tự phát ra màu.  Dạng 3. Màu của vật dưới ánh sáng màu Vật chỉ sáng màu khi nguồn có thành phần màu mà vật phản xạ. Giấy trắng phản xạ màu đang chiếu; vật đen hấp thụ phần lớn. Theo Câu 26: Vật đỏ đặt trong ánh sáng xanh lam. Nguồn không có đỏ để vật phản xạ ⇒ vật tối hoặc gần đen. Không mặc định vật luôn giữ màu như dưới ánh sáng trắng. "},{"number":8,"title":"THẤU KÍNH","subject":"Vật lý","intro":["Dùng các tia đặc biệt và bảng vị trí vật – tính chất ảnh."],"forms":[{"title":"Dạng 1. Nhận biết thấu kính và tia đặc biệt","tip":"Hội tụ: giữa dày; phân kì: giữa mỏng. Tia qua quang tâm truyền thẳng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24 [TH]. Một tia tới song song trục chính của thấu kính phân kì có tia ló\nA. vuông góc với trục chính.\nB. đi qua tiêu điểm ảnh ở phía sau thấu kính.\nC. đi thẳng không đổi hướng trong mọi trường hợp.\nD. có đường kéo dài đi qua tiêu điểm vật.","solution":"Tia ló phân kì; đường kéo dài của tia ló đi qua tiêu điểm vật.","trap":"Không vẽ tia ló đi qua tiêu điểm phía sau như thấu kính hội tụ.","extra":[],"exampleQuestionNumber":24},{"title":"Dạng 2. Bảng nhanh ảnh của thấu kính hội tụ","tip":"d>2f: ảnh thật nhỏ giữa F–2F; d=2f: ảnh thật bằng vật ở 2F; f<d<2f: ảnh thật lớn ngoài 2F; d<f: ảnh ảo cùng chiều lớn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Một vật đặt giữa F và 2F của thấu kính hội tụ. Ảnh tạo thành là\nA. ảnh ảo, cùng chiều, nhỏ hơn vật.\nB. ảnh ảo, ngược chiều, bằng vật.\nC. ảnh thật, cùng chiều, nhỏ hơn vật.\nD. ảnh thật, ngược chiều, lớn hơn vật và nằm ngoài 2F.","solution":"Ảnh thật, ngược chiều, lớn hơn vật, nằm ngoài 2F.","trap":"Không chỉ nhớ “ngoài f cho ảnh thật” mà quên kích thước và vị trí.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 3. Nhận biết ảnh thật – ảnh ảo","tip":"Hứng được trên màn ⇒ ảnh thật. Không hứng được, cùng chiều và phóng đại qua hội tụ ⇒ ảnh ảo, vật trong f.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 28 [TH]. Một người nhìn qua thấu kính thấy ảnh cùng chiều và lớn hơn vật, không hứng được trên màn. Vật đang ở\nA. ngoài 2F của thấu kính hội tụ.\nB. trước thấu kính phân kì rất xa.\nC. đúng tại 2F của thấu kính hội tụ.\nD. trong khoảng tiêu cự của thấu kính hội tụ.","solution":"Vật nằm trong khoảng tiêu cự của thấu kính hội tụ.","trap":"Ảnh ảo không hứng được trên màn.","extra":[],"exampleQuestionNumber":28},{"title":"Dạng 4. Dịch vật và sự dịch chuyển của ảnh","tip":"Vật từ xa tiến gần thấu kính nhưng còn ngoài 2F: ảnh thật đi xa thấu kính và lớn dần.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 [TH]. Khi dịch vật từ rất xa lại gần thấu kính hội tụ nhưng vẫn ở ngoài 2F, ảnh thật sẽ\nA. dịch ra xa thấu kính và lớn dần.\nB. dịch sát thấu kính và nhỏ dần.\nC. luôn đứng yên tại F.\nD. chuyển ngay thành ảnh ảo.","solution":"Ảnh dịch ra xa thấu kính, kích thước tăng.","trap":"Không áp dụng qua điểm F; khi qua F tính chất ảnh đổi.","extra":[],"exampleQuestionNumber":25},{"title":"Dạng 5. Che một phần thấu kính","tip":"Mỗi phần thấu kính đều nhận tia từ mọi điểm vật ⇒ ảnh vẫn đủ hình nhưng tối hơn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Khi che một nửa thấu kính hội tụ đang tạo ảnh rõ trên màn, ảnh trên màn sẽ\nA. biến thành ảnh ảo.\nB. đảo từ ngược chiều thành cùng chiều.\nC. vẫn đủ hình nhưng tối hơn.\nD. mất hoàn toàn một nửa hình.","solution":"Ảnh vẫn đầy đủ, cường độ sáng giảm.","trap":"Không chọn “mất nửa ảnh”.","extra":[],"exampleQuestionNumber":23}],"subjectKey":"physics","shortSubject":"Lý","slug":"bai-8","summary":"Dùng các tia đặc biệt và bảng vị trí vật – tính chất ảnh.","searchText":"THẤU KÍNH Dùng các tia đặc biệt và bảng vị trí vật – tính chất ảnh. Dạng 1. Nhận biết thấu kính và tia đặc biệt Hội tụ: giữa dày; phân kì: giữa mỏng. Tia qua quang tâm truyền thẳng. Theo Câu 24: Tia song song trục chính qua thấu kính phân kì. Tia ló phân kì; đường kéo dài của tia ló đi qua tiêu điểm vật. Không vẽ tia ló đi qua tiêu điểm phía sau như thấu kính hội tụ.  Dạng 2. Bảng nhanh ảnh của thấu kính hội tụ d>2f: ảnh thật nhỏ giữa F–2F; d=2f: ảnh thật bằng vật ở 2F; f<d<2f: ảnh thật lớn ngoài 2F; d<f: ảnh ảo cùng chiều lớn. Theo Câu 20: Vật giữa F và 2F. Ảnh thật, ngược chiều, lớn hơn vật, nằm ngoài 2F. Không chỉ nhớ “ngoài f cho ảnh thật” mà quên kích thước và vị trí.  Dạng 3. Nhận biết ảnh thật – ảnh ảo Hứng được trên màn ⇒ ảnh thật. Không hứng được, cùng chiều và phóng đại qua hội tụ ⇒ ảnh ảo, vật trong f. Theo Câu 28: Thấy ảnh cùng chiều, lớn hơn, không hứng được. Vật nằm trong khoảng tiêu cự của thấu kính hội tụ. Ảnh ảo không hứng được trên màn.  Dạng 4. Dịch vật và sự dịch chuyển của ảnh Vật từ xa tiến gần thấu kính nhưng còn ngoài 2F: ảnh thật đi xa thấu kính và lớn dần. Theo Câu 25: Dịch vật từ rất xa lại gần nhưng vẫn ngoài 2F. Ảnh dịch ra xa thấu kính, kích thước tăng. Không áp dụng qua điểm F; khi qua F tính chất ảnh đổi.  Dạng 5. Che một phần thấu kính Mỗi phần thấu kính đều nhận tia từ mọi điểm vật ⇒ ảnh vẫn đủ hình nhưng tối hơn. Theo Câu 23: Che nửa thấu kính đang tạo ảnh rõ. Ảnh vẫn đầy đủ, cường độ sáng giảm. Không chọn “mất nửa ảnh”. "},{"number":9,"title":"THỰC HÀNH ĐO TIÊU CỰ THẤU KÍNH HỘI TỤ","subject":"Vật lý","intro":["Theo phương pháp Silbermann trong nguồn: điều chỉnh ảnh rõ và gần bằng vật, khi đó d≈d′≈2f."],"forms":[{"title":"Dạng 1. Tính tiêu cự theo Silbermann","tip":"Cộng d và d′ rồi chia 4. Nếu d=d′ thì f=d/2.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Đo được d = 24 cm và d' = 24 cm khi ảnh bằng vật. Tiêu cự gần đúng là\nA. 24 cm.\nB. 48 cm.\nC. 12 cm.\nD. 6 cm.","solution":"f=(24+24)/4=12 cm.","trap":"Không lấy f=d+d′ hoặc f=d·d′.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 2. Tính giá trị trung bình","tip":"Cộng các kết quả, chia số lần đo; giữ số chữ số hợp lí.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Ba lần đo tiêu cự cho 10,0 cm; 10,4 cm; 9,8 cm. Giá trị trung bình gần nhất là\nA. 30,2 cm.\nB. 9,0 cm.\nC. 10,8 cm.\nD. 10,1 cm.","solution":"f̄=(10,0+10,4+9,8)/3≈10,1 cm.","trap":"Không cộng ba giá trị rồi quên chia 3.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 3. Xử lí sai số thực hành","tip":"Ảnh mờ: dịch nhẹ màn/thấu kính; số liệu lệch lớn: đo lại, kiểm tra thẳng trục và cách đọc thước; mắt vuông góc vạch chia.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24 [TH]. Kết quả các lần đo chênh lệch rất lớn. Nguyên nhân có thể là\nA. tiêu cự thay đổi hoàn toàn sau mỗi lần đo.\nB. màn chắn luôn tạo ảnh ảo.\nC. thấu kính không làm lệch ánh sáng.\nD. ảnh chưa được lấy nét chính xác hoặc đọc thước sai.","solution":"Nguyên nhân hợp lí: ảnh chưa nét hoặc đọc thước sai.","trap":"Không tự sửa số đo để khớp giá trị ghi trên thấu kính.","extra":[],"exampleQuestionNumber":24}],"subjectKey":"physics","shortSubject":"Lý","slug":"bai-9","summary":"Theo phương pháp Silbermann trong nguồn: điều chỉnh ảnh rõ và gần bằng vật, khi đó d≈d′≈2f.","searchText":"THỰC HÀNH ĐO TIÊU CỰ THẤU KÍNH HỘI TỤ Theo phương pháp Silbermann trong nguồn: điều chỉnh ảnh rõ và gần bằng vật, khi đó d≈d′≈2f. Dạng 1. Tính tiêu cự theo Silbermann Cộng d và d′ rồi chia 4. Nếu d=d′ thì f=d/2. Theo Câu 19: d=d′=24 cm. f=(24+24)/4=12 cm. Không lấy f=d+d′ hoặc f=d·d′.  Dạng 2. Tính giá trị trung bình Cộng các kết quả, chia số lần đo; giữ số chữ số hợp lí. Theo Câu 20: 10,0; 10,4; 9,8 cm. f̄=(10,0+10,4+9,8)/3≈10,1 cm. Không cộng ba giá trị rồi quên chia 3.  Dạng 3. Xử lí sai số thực hành Ảnh mờ: dịch nhẹ màn/thấu kính; số liệu lệch lớn: đo lại, kiểm tra thẳng trục và cách đọc thước; mắt vuông góc vạch chia. Theo Câu 24: Các lần đo chênh lệch rất lớn. Nguyên nhân hợp lí: ảnh chưa nét hoặc đọc thước sai. Không tự sửa số đo để khớp giá trị ghi trên thấu kính. "},{"number":10,"title":"KÍNH LÚP – BÀI TẬP THẤU KÍNH","subject":"Vật lý","intro":["Kính lúp là thấu kính hội tụ tiêu cự ngắn, vật đặt trong tiêu cự để có ảnh ảo cùng chiều, lớn hơn."],"forms":[{"title":"Dạng 1. Tính số bội giác","tip":"Chia 25 cho tiêu cự tính bằng cm.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Kính lúp có tiêu cự 5 cm. Số bội giác gần đúng là\nA. 25×.\nB. 2×.\nC. 5×.\nD. 10×.","solution":"G=25/5=5×.","trap":"Không dùng f theo mét trong công thức của nguồn.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 2. Tính tiêu cự từ số ghi trên kính","tip":"Dùng f=25/G.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Kính lúp ghi 10× có tiêu cự gần đúng là\nA. 10 cm.\nB. 25 cm.\nC. 0,4 cm.\nD. 2,5 cm.","solution":"f=25/10=2,5 cm.","trap":"Dấu × là số bội giác, không phải đơn vị chiều dài.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 3. So sánh hai kính lúp","tip":"G tỉ lệ nghịch f; kính tiêu cự ngắn hơn phóng đại góc lớn hơn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 29 [TH]. Một kính lúp f = 2 cm và một kính f = 5 cm. Tỉ số bội giác G2cm/G5cm là\nA. 2,5.\nB. 0,4.\nC. 7.\nD. 10.","solution":"G₂/G₅=(25/2)/(25/5)=5/2=2,5.","trap":"Không so độ dày bằng mắt thay cho tiêu cự.","extra":[],"exampleQuestionNumber":29},{"title":"Dạng 4. Nhận biết chế độ kính lúp","tip":"Vật phải đặt d<f. Nếu d>f, ảnh có thể là ảnh thật ngược chiều và không còn chế độ kính lúp.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Đặt vật cách kính lúp 3 cm, kính có f = 5 cm. Ảnh thu được là\nA. không có ảnh.\nB. ảnh ảo, cùng chiều và lớn hơn vật.\nC. ảnh thật, ngược chiều và nhỏ hơn vật.\nD. ảnh thật, cùng chiều và bằng vật.","solution":"d<f ⇒ ảnh ảo, cùng chiều, lớn hơn vật.","trap":"Không hứng ảnh kính lúp trên màn.","extra":[],"exampleQuestionNumber":22}],"subjectKey":"physics","shortSubject":"Lý","slug":"bai-10","summary":"Kính lúp là thấu kính hội tụ tiêu cự ngắn, vật đặt trong tiêu cự để có ảnh ảo cùng chiều, lớn hơn.","searchText":"KÍNH LÚP – BÀI TẬP THẤU KÍNH Kính lúp là thấu kính hội tụ tiêu cự ngắn, vật đặt trong tiêu cự để có ảnh ảo cùng chiều, lớn hơn. Dạng 1. Tính số bội giác Chia 25 cho tiêu cự tính bằng cm. Theo Câu 19: f=5 cm. G=25/5=5×. Không dùng f theo mét trong công thức của nguồn.  Dạng 2. Tính tiêu cự từ số ghi trên kính Dùng f=25/G. Theo Câu 20: Kính ghi 10×. f=25/10=2,5 cm. Dấu × là số bội giác, không phải đơn vị chiều dài.  Dạng 3. So sánh hai kính lúp G tỉ lệ nghịch f; kính tiêu cự ngắn hơn phóng đại góc lớn hơn. Theo Câu 29: f=2 cm và 5 cm. G₂/G₅=(25/2)/(25/5)=5/2=2,5. Không so độ dày bằng mắt thay cho tiêu cự.  Dạng 4. Nhận biết chế độ kính lúp Vật phải đặt d<f. Nếu d>f, ảnh có thể là ảnh thật ngược chiều và không còn chế độ kính lúp. Theo Câu 22: d=3 cm, f=5 cm. d<f ⇒ ảnh ảo, cùng chiều, lớn hơn vật. Không hứng ảnh kính lúp trên màn. "},{"number":11,"title":"ĐIỆN TRỞ – ĐỊNH LUẬT OHM","subject":"Vật lý","intro":["Các bài toán xoay quanh tam giác U–I–R và quan hệ tỉ lệ."],"forms":[{"title":"Dạng 1. Tính I, U hoặc R","tip":"Che đại lượng cần tìm trong tam giác U=IR.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Đặt U = 6 V vào điện trở R = 3 Ω. Cường độ dòng điện là\nA. 18 A.\nB. 0,5 A.\nC. 2 A.\nD. 9 A.","solution":"I=6/3=2 A.","trap":"Không đảo U/R thành R/U.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 2. Quan hệ tỉ lệ","tip":"R không đổi: I∝U. U không đổi: I∝1/R.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Giữ U = 12 V, tăng R từ 6 Ω lên 12 Ω thì I\nA. không đổi.\nB. giảm bốn lần.\nC. giảm một nửa.\nD. tăng gấp đôi.","solution":"R gấp đôi ⇒ I giảm một nửa.","trap":"Không kết luận I tăng theo R.","extra":[],"exampleQuestionNumber":23},{"title":"Dạng 3. So sánh hai điện trở cùng U","tip":"I₁/I₂=R₂/R₁. Điện trở nhỏ hơn có dòng lớn hơn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24 [TH]. Hai điện trở R1 = 5 Ω, R2 = 10 Ω cùng mắc riêng vào nguồn 10 V. So sánh dòng điện\nA. I1 = 4I2.\nB. I2 = 2I1.\nC. I1 = I2.\nD. I1 = 2I2.","solution":"I1/I2=10/5=2 ⇒ I1=2I2.","trap":"Tỉ số dòng điện đảo ngược tỉ số điện trở.","extra":[],"exampleQuestionNumber":24},{"title":"Dạng 4. Đồ thị I–U","tip":"Độ dốc k=I/U=1/R. Đường dốc hơn ⇒ R nhỏ hơn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. Đồ thị I–U của dây A dốc hơn dây B. Kết luận phù hợp là\nA. không thể liên hệ độ dốc với điện trở.\nB. điện trở dây A lớn hơn dây B.\nC. điện trở dây A nhỏ hơn dây B.\nD. hai điện trở bằng nhau.","solution":"1/RA>1/RB ⇒ RA<RB.","trap":"Đừng lấy độ dốc là R; trong đồ thị I theo U, độ dốc là 1/R.","extra":[],"exampleQuestionNumber":27},{"title":"Dạng 5. Kiểm tra giới hạn dụng cụ đo","tip":"Tính dòng dự kiến rồi so với giới hạn ampe kế.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 [TH]. Một ampe kế có giới hạn 1\nA. Mạch dự kiến có U = 12 V, R = 10 Ω. Nhận xét đúng là A. dòng 1,2 A vượt giới hạn đo.\nB. dòng 0,83 A an toàn.\nC. dòng 12 A an toàn.\nD. dòng 0,12 A vượt giới hạn.","solution":"I=1,2 A>1 A ⇒ vượt giới hạn đo.","trap":"Không chọn thang đo nhỏ hơn giá trị dự kiến.","extra":[],"exampleQuestionNumber":25}],"subjectKey":"physics","shortSubject":"Lý","slug":"bai-11","summary":"Các bài toán xoay quanh tam giác U–I–R và quan hệ tỉ lệ.","searchText":"ĐIỆN TRỞ – ĐỊNH LUẬT OHM Các bài toán xoay quanh tam giác U–I–R và quan hệ tỉ lệ. Dạng 1. Tính I, U hoặc R Che đại lượng cần tìm trong tam giác U=IR. Theo Câu 19: U=6 V, R=3 Ω. I=6/3=2 A. Không đảo U/R thành R/U.  Dạng 2. Quan hệ tỉ lệ R không đổi: I∝U. U không đổi: I∝1/R. Theo Câu 23: U=12 V, R tăng từ 6 lên 12 Ω. R gấp đôi ⇒ I giảm một nửa. Không kết luận I tăng theo R.  Dạng 3. So sánh hai điện trở cùng U I₁/I₂=R₂/R₁. Điện trở nhỏ hơn có dòng lớn hơn. Theo Câu 24: R1=5 Ω, R2=10 Ω cùng U. I1/I2=10/5=2 ⇒ I1=2I2. Tỉ số dòng điện đảo ngược tỉ số điện trở.  Dạng 4. Đồ thị I–U Độ dốc k=I/U=1/R. Đường dốc hơn ⇒ R nhỏ hơn. Theo Câu 27: Đồ thị dây A dốc hơn B. 1/RA>1/RB ⇒ RA<RB. Đừng lấy độ dốc là R; trong đồ thị I theo U, độ dốc là 1/R.  Dạng 5. Kiểm tra giới hạn dụng cụ đo Tính dòng dự kiến rồi so với giới hạn ampe kế. Theo Câu 25: U=12 V, R=10 Ω, giới hạn 1 A. I=1,2 A>1 A ⇒ vượt giới hạn đo. Không chọn thang đo nhỏ hơn giá trị dự kiến. "},{"number":12,"title":"ĐOẠN MẠCH NỐI TIẾP – SONG SONG","subject":"Vật lý","intro":["Nhận dạng cách mắc trước, sau đó mới dùng công thức tương ứng."],"forms":[{"title":"Dạng 1. Tính Rtđ nối tiếp","tip":"Cộng trực tiếp các điện trở.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Hai điện trở 4 Ω và 6 Ω mắc nối tiếp. Điện trở tương đương là\nA. 24 Ω.\nB. 1 Ω.\nC. 10 Ω.\nD. 2,4 Ω.","solution":"Rtđ=4+6=10 Ω.","trap":"Nối tiếp không dùng tích chia tổng.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 2. Tính Rtđ song song hai điện trở","tip":"Dùng Rtđ=R1R2/(R1+R2); kiểm tra kết quả phải nhỏ hơn điện trở nhỏ nhất.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Hai điện trở 6 Ω và 3 Ω mắc song song. Điện trở tương đương là\nA. 3 Ω.\nB. 9 Ω.\nC. 18 Ω.\nD. 2 Ω.","solution":"Rtđ=6·3/(6+3)=2 Ω.","trap":"Nếu kết quả lớn hơn 3 Ω là sai.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 3. Mạch nối tiếp đầy đủ","tip":"Tính Rtđ rồi I=U/Rtđ; hiệu điện thế từng điện trở Ui=IRi.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Ba điện trở 2 Ω, 3 Ω, 5 Ω nối tiếp với nguồn 20 V. Cường độ dòng điện là\nA. 10 A.\nB. 4 A.\nC. 2 A.\nD. 1 A.","solution":"Rtđ=10 Ω ⇒ I=20/10=2 A.","trap":"Dòng qua mọi điện trở nối tiếp là như nhau.","extra":[],"exampleQuestionNumber":23},{"title":"Dạng 4. Mạch song song đầy đủ","tip":"Mỗi nhánh có cùng U; tính I từng nhánh rồi cộng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Hai nhánh song song R1 = 6 Ω, R2 = 3 Ω đặt vào U = 6 V. Dòng mạch chính là\nA. 2 A.\nB. 3 A.\nC. 6 A.\nD. 1 A.","solution":"I1=1 A; I2=2 A ⇒ I=3 A.","trap":"Không chia U cho tổng R1+R2 trong mạch song song.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 5. Tỉ số U trong nối tiếp","tip":"Vì I chung: U2/U1=R2/R1.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 [TH]. Trong mạch nối tiếp R1 = 3 Ω, R2 = 9 Ω. Tỉ số U2/U1 bằng\nA. 3.\nB. 1.\nC. 12.\nD. 1/3.","solution":"U2/U1=9/3=3.","trap":"Tỉ số hiệu điện thế cùng chiều với tỉ số điện trở.","extra":[],"exampleQuestionNumber":25},{"title":"Dạng 6. Tỉ số I trong song song","tip":"Vì U chung: I1/I2=R2/R1.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 26 [TH]. Trong mạch song song R1 = 4 Ω, R2 = 8 Ω. Tỉ số I1/I2 bằng\nA. 4.\nB. 2.\nC. 1/2.\nD. 1.","solution":"I1/I2=8/4=2.","trap":"Tỉ số dòng đảo tỉ số điện trở.","extra":[],"exampleQuestionNumber":26},{"title":"Dạng 7. Mạch hỗn hợp đơn giản","tip":"Rút gọn nhóm song song trước, rồi cộng với phần nối tiếp.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 28 [TH]. Mạch gồm R1 = 5 Ω nối tiếp với bộ R2 = R3 = 10 Ω mắc song song. Điện trở tương đương là\nA. 15 Ω.\nB. 5 Ω.\nC. 25 Ω.\nD. 10 Ω.","solution":"R23=10/2=5 Ω ⇒ Rtđ=5+5=10 Ω.","trap":"Không cộng cả ba điện trở ngay.","extra":[],"exampleQuestionNumber":28}],"subjectKey":"physics","shortSubject":"Lý","slug":"bai-12","summary":"Nhận dạng cách mắc trước, sau đó mới dùng công thức tương ứng.","searchText":"ĐOẠN MẠCH NỐI TIẾP – SONG SONG Nhận dạng cách mắc trước, sau đó mới dùng công thức tương ứng. Dạng 1. Tính Rtđ nối tiếp Cộng trực tiếp các điện trở. Theo Câu 19: 4 Ω và 6 Ω nối tiếp. Rtđ=4+6=10 Ω. Nối tiếp không dùng tích chia tổng.  Dạng 2. Tính Rtđ song song hai điện trở Dùng Rtđ=R1R2/(R1+R2); kiểm tra kết quả phải nhỏ hơn điện trở nhỏ nhất. Theo Câu 20: 6 Ω song song 3 Ω. Rtđ=6·3/(6+3)=2 Ω. Nếu kết quả lớn hơn 3 Ω là sai.  Dạng 3. Mạch nối tiếp đầy đủ Tính Rtđ rồi I=U/Rtđ; hiệu điện thế từng điện trở Ui=IRi. Theo Câu 23: 2 Ω, 3 Ω, 5 Ω nối tiếp với 20 V. Rtđ=10 Ω ⇒ I=20/10=2 A. Dòng qua mọi điện trở nối tiếp là như nhau.  Dạng 4. Mạch song song đầy đủ Mỗi nhánh có cùng U; tính I từng nhánh rồi cộng. Theo Câu 22: R1=6 Ω, R2=3 Ω, U=6 V. I1=1 A; I2=2 A ⇒ I=3 A. Không chia U cho tổng R1+R2 trong mạch song song.  Dạng 5. Tỉ số U trong nối tiếp Vì I chung: U2/U1=R2/R1. Theo Câu 25: R1=3 Ω, R2=9 Ω. U2/U1=9/3=3. Tỉ số hiệu điện thế cùng chiều với tỉ số điện trở.  Dạng 6. Tỉ số I trong song song Vì U chung: I1/I2=R2/R1. Theo Câu 26: R1=4 Ω, R2=8 Ω. I1/I2=8/4=2. Tỉ số dòng đảo tỉ số điện trở.  Dạng 7. Mạch hỗn hợp đơn giản Rút gọn nhóm song song trước, rồi cộng với phần nối tiếp. Theo Câu 28: R1=5 Ω nối tiếp với R2=R3=10 Ω song song. R23=10/2=5 Ω ⇒ Rtđ=5+5=10 Ω. Không cộng cả ba điện trở ngay. "},{"number":13,"title":"NĂNG LƯỢNG DÒNG ĐIỆN – CÔNG SUẤT ĐIỆN","subject":"Vật lý","intro":["Chọn công thức công suất phù hợp dữ kiện và thống nhất đơn vị thời gian."],"forms":[{"title":"Dạng 1. Tính công suất điện","tip":"Có U,I dùng P=UI; có I,R dùng I²R; có U,R dùng U²/R.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Điện trở 10 Ω có dòng 2 A chạy qua. Công suất tỏa nhiệt là\nA. 20 W.\nB. 5 W.\nC. 40 W.\nD. 400 W.","solution":"P=I²R=4·10=40 W.","trap":"Chọn công thức tránh phải tính thêm đại lượng trung gian.","extra":[],"exampleQuestionNumber":23},{"title":"Dạng 2. Điện năng theo kWh","tip":"Đổi P sang kW và t sang giờ; A(kWh)=P(kW)t(h).","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Ấm điện 1000 W dùng trong 10 phút. Điện năng tiêu thụ là\nA. 10 kWh.\nB. 1,0 kWh.\nC. 0,0167 kWh.\nD. 0,167 kWh.","solution":"P=1 kW; t=1/6 h ⇒ A≈0,167 kWh.","trap":"Không dùng phút trực tiếp với kW để ghi kWh.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 3. Tính tiền điện","tip":"Tiền = số kWh·đơn giá.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Một gia đình dùng 120 kWh trong tháng, giá giả định 2000 đồng/kWh. Tiền điện phần này là\nA. 122 000 đồng.\nB. 240 000 đồng.\nC. 60 000 đồng.\nD. 2 400 000 đồng.","solution":"Tiền=120·2000=240000 đồng.","trap":"Không đổi kWh sang J khi chỉ tính hóa đơn.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 4. So sánh điện năng hai thiết bị","tip":"Cùng thời gian: A tỉ lệ P. Khác thời gian: so P·t.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 [TH]. Hai bóng 60 W và 10 W hoạt động cùng 4 giờ. Bóng 60 W tiêu thụ điện năng\nA. gấp 6 lần bóng 10 W.\nB. chỉ gấp 2 lần.\nC. gấp 4 lần.\nD. bằng nhau.","solution":"A60/A10=60/10=6.","trap":"Không chỉ nhìn thời gian nếu hai thời gian khác nhau.","extra":[],"exampleQuestionNumber":25},{"title":"Dạng 5. Công suất khi thay đổi điện áp, R không đổi","tip":"P=U²/R ⇒ điện áp giảm k lần thì công suất giảm k² lần.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. Một thiết bị ghi 220 V – 1000 W nhưng dùng ở 110 V, coi R không đổi. Công suất thực gần bằng\nA. 1000 W.\nB. 2000 W.\nC. 250 W.\nD. 500 W.","solution":"U giảm 1/2 ⇒ P còn 1/4 =250 W.","trap":"Không kết luận công suất giảm một nửa.","extra":[],"exampleQuestionNumber":27},{"title":"Dạng 6. Hiệu suất thiết bị điện","tip":"H=Pích/Pvào hoặc Aích/Avào.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 26 [TH]. Máy có công suất có ích 800 W, công suất điện vào 1000 W. Hiệu suất là\nA. 20%.\nB. 80%.\nC. 125%.\nD. 8%.","solution":"H=800/1000·100%=80%.","trap":"Hiệu suất không vượt 100% trong mô hình thông thường.","extra":[],"exampleQuestionNumber":26}],"subjectKey":"physics","shortSubject":"Lý","slug":"bai-13","summary":"Chọn công thức công suất phù hợp dữ kiện và thống nhất đơn vị thời gian.","searchText":"NĂNG LƯỢNG DÒNG ĐIỆN – CÔNG SUẤT ĐIỆN Chọn công thức công suất phù hợp dữ kiện và thống nhất đơn vị thời gian. Dạng 1. Tính công suất điện Có U,I dùng P=UI; có I,R dùng I²R; có U,R dùng U²/R. Theo Câu 23: R=10 Ω, I=2 A. P=I²R=4·10=40 W. Chọn công thức tránh phải tính thêm đại lượng trung gian.  Dạng 2. Điện năng theo kWh Đổi P sang kW và t sang giờ; A(kWh)=P(kW)t(h). Theo Câu 20: Ấm 1000 W dùng 10 phút. P=1 kW; t=1/6 h ⇒ A≈0,167 kWh. Không dùng phút trực tiếp với kW để ghi kWh.  Dạng 3. Tính tiền điện Tiền = số kWh·đơn giá. Theo Câu 22: 120 kWh, 2000 đồng/kWh. Tiền=120·2000=240000 đồng. Không đổi kWh sang J khi chỉ tính hóa đơn.  Dạng 4. So sánh điện năng hai thiết bị Cùng thời gian: A tỉ lệ P. Khác thời gian: so P·t. Theo Câu 25: Bóng 60 W và 10 W cùng 4 giờ. A60/A10=60/10=6. Không chỉ nhìn thời gian nếu hai thời gian khác nhau.  Dạng 5. Công suất khi thay đổi điện áp, R không đổi P=U²/R ⇒ điện áp giảm k lần thì công suất giảm k² lần. Theo Câu 27: Thiết bị 1000 W ở 220 V, dùng 110 V. U giảm 1/2 ⇒ P còn 1/4 =250 W. Không kết luận công suất giảm một nửa.  Dạng 6. Hiệu suất thiết bị điện H=Pích/Pvào hoặc Aích/Avào. Theo Câu 26: Pích=800 W, Pvào=1000 W. H=800/1000·100%=80%. Hiệu suất không vượt 100% trong mô hình thông thường. "},{"number":14,"title":"CẢM ỨNG ĐIỆN TỪ – TẠO DÒNG ĐIỆN XOAY CHIỀU","subject":"Vật lý","intro":["Từ khóa quyết định là từ thông qua cuộn dây kín phải biến đổi."],"forms":[{"title":"Dạng 1. Nhận biết có dòng cảm ứng","tip":"Hỏi: mạch có kín không? từ thông có đổi không? Nếu cả hai có ⇒ xuất hiện dòng cảm ứng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Nam châm và cuộn dây cùng chuyển động với cùng vận tốc, không đổi vị trí tương đối. Dòng cảm ứng\nA. đổi chiều liên tục.\nB. chỉ phụ thuộc khối lượng nam châm.\nC. luôn rất lớn.\nD. không xuất hiện nếu từ thông không đổi.","solution":"Từ thông không đổi ⇒ không có dòng cảm ứng.","trap":"Có chuyển động chưa đủ; phải có chuyển động tương đối hoặc thay đổi góc/độ lớn từ trường.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 2. Xác định chiều thay đổi dòng cảm ứng","tip":"Đảo chiều chuyển động hoặc đảo cực nam châm ⇒ chiều dòng cảm ứng đổi.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Đưa cực Bắc nam châm vào cuộn dây thấy điện kế lệch phải. Kéo nam châm ra thì điện kế sẽ\nA. vẫn lệch phải như cũ.\nB. không bao giờ lệch.\nC. lệch theo chiều ngược lại.\nD. chỉ tăng nhiệt độ.","solution":"Kéo ra làm biến thiên từ thông ngược ⇒ điện kế lệch chiều ngược lại.","trap":"Không cần xác định tuyệt đối trái/phải nếu đề chỉ hỏi đổi chiều.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 3. Tần số máy phát","tip":"Nếu mỗi vòng tạo một chu kì: f = số vòng/giây. Tốc độ quay tăng k lần thì f tăng k lần.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Một máy phát quay 25 vòng mỗi giây và tạo một chu kì mỗi vòng. Tần số là\nA. 50 Hz.\nB. 25 Hz.\nC. 0,04 Hz.\nD. 625 Hz.","solution":"f=25 Hz.","trap":"Không nhân 2 nếu đề đã nói một chu kì mỗi vòng.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 4. Cách tăng suất điện động cảm ứng","tip":"Tăng tốc độ biến thiên từ thông, tăng số vòng dây, dùng nam châm mạnh hơn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 26 [TH]. Thay cuộn 100 vòng bằng cuộn 500 vòng, cùng tốc độ biến thiên từ thông mỗi vòng. Suất điện động cảm ứng dự kiến\nA. không đổi.\nB. tăng khoảng 5 lần.\nC. bằng 0.\nD. giảm 5 lần.","solution":"Cùng biến thiên mỗi vòng ⇒ suất điện động tăng khoảng 5 lần.","trap":"Giữ nam châm đứng yên lâu hơn không làm tăng dòng cảm ứng.","extra":[],"exampleQuestionNumber":26}],"subjectKey":"physics","shortSubject":"Lý","slug":"bai-14","summary":"Từ khóa quyết định là từ thông qua cuộn dây kín phải biến đổi.","searchText":"CẢM ỨNG ĐIỆN TỪ – TẠO DÒNG ĐIỆN XOAY CHIỀU Từ khóa quyết định là từ thông qua cuộn dây kín phải biến đổi. Dạng 1. Nhận biết có dòng cảm ứng Hỏi: mạch có kín không? từ thông có đổi không? Nếu cả hai có ⇒ xuất hiện dòng cảm ứng. Theo Câu 20: Nam châm và cuộn dây cùng chuyển động, vị trí tương đối không đổi. Từ thông không đổi ⇒ không có dòng cảm ứng. Có chuyển động chưa đủ; phải có chuyển động tương đối hoặc thay đổi góc/độ lớn từ trường.  Dạng 2. Xác định chiều thay đổi dòng cảm ứng Đảo chiều chuyển động hoặc đảo cực nam châm ⇒ chiều dòng cảm ứng đổi. Theo Câu 19: Đưa nam châm vào làm điện kế lệch phải, kéo ra. Kéo ra làm biến thiên từ thông ngược ⇒ điện kế lệch chiều ngược lại. Không cần xác định tuyệt đối trái/phải nếu đề chỉ hỏi đổi chiều.  Dạng 3. Tần số máy phát Nếu mỗi vòng tạo một chu kì: f = số vòng/giây. Tốc độ quay tăng k lần thì f tăng k lần. Theo Câu 22: 25 vòng/s, một chu kì mỗi vòng. f=25 Hz. Không nhân 2 nếu đề đã nói một chu kì mỗi vòng.  Dạng 4. Cách tăng suất điện động cảm ứng Tăng tốc độ biến thiên từ thông, tăng số vòng dây, dùng nam châm mạnh hơn. Theo Câu 26: Thay cuộn 100 vòng bằng 500 vòng. Cùng biến thiên mỗi vòng ⇒ suất điện động tăng khoảng 5 lần. Giữ nam châm đứng yên lâu hơn không làm tăng dòng cảm ứng. "},{"number":15,"title":"TÁC DỤNG CỦA DÒNG ĐIỆN XOAY CHIỀU","subject":"Vật lý","intro":["Dùng từ khóa thiết bị để nhận ra tác dụng nhiệt, phát sáng, từ hoặc sinh lí."],"forms":[{"title":"Dạng 1. Ghép thiết bị với tác dụng dòng điện","tip":"Bếp, bàn là, mayso → nhiệt; đèn → phát sáng; động cơ, biến áp → từ; điện giật → sinh lí.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. Máy sấy tóc vừa thổi gió vừa tạo hơi nóng nhờ\nA. chỉ tác dụng phát sáng.\nB. chỉ tác dụng hóa học.\nC. tác dụng từ ở động cơ và tác dụng nhiệt ở dây đốt.\nD. không dùng dòng điện xoay chiều.","solution":"Động cơ quạt dùng tác dụng từ; dây đốt dùng tác dụng nhiệt.","trap":"Một thiết bị có thể dùng đồng thời nhiều tác dụng.","extra":[],"exampleQuestionNumber":27},{"title":"Dạng 2. An toàn điện","tip":"Thứ tự ưu tiên: ngắt nguồn an toàn; không dùng tay trần/nước; kiểm tra không còn điện; dùng bảo vệ đúng định mức.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Ổ cắm bị nóng và có mùi khét. Cách xử lí đúng là\nA. ngắt điện, kiểm tra tiếp xúc và thay phần hỏng.\nB. tiếp tục sử dụng đến khi tự nguội.\nC. đổ nước vào ổ cắm.\nD. tăng cầu chì lên mức rất lớn.","solution":"Ngắt điện, kiểm tra tiếp xúc và thay phần hỏng.","trap":"Không tăng dòng định mức cầu chì để “đỡ ngắt”.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 3. Giải thích nguy cơ điện giật","tip":"Dòng qua cơ thể phụ thuộc hiệu điện thế và điện trở; da ướt làm R giảm nên I tăng. Chim trên một dây có hai chân gần cùng điện thế nên dòng nhỏ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24 [TH]. Chim đậu trên một dây điện cao thế thường không bị giật mạnh vì\nA. cơ thể chim không dẫn điện.\nB. dây cao thế không có điện.\nC. chim tạo ra điện áp ngược.\nD. hai chân gần như cùng điện thế nên dòng qua cơ thể rất nhỏ.","solution":"Hai chân gần như cùng điện thế ⇒ hiệu điện thế qua cơ thể rất nhỏ ⇒ dòng rất nhỏ.","trap":"Không nói cơ thể chim là chất cách điện.","extra":[],"exampleQuestionNumber":24}],"subjectKey":"physics","shortSubject":"Lý","slug":"bai-15","summary":"Dùng từ khóa thiết bị để nhận ra tác dụng nhiệt, phát sáng, từ hoặc sinh lí.","searchText":"TÁC DỤNG CỦA DÒNG ĐIỆN XOAY CHIỀU Dùng từ khóa thiết bị để nhận ra tác dụng nhiệt, phát sáng, từ hoặc sinh lí. Dạng 1. Ghép thiết bị với tác dụng dòng điện Bếp, bàn là, mayso → nhiệt; đèn → phát sáng; động cơ, biến áp → từ; điện giật → sinh lí. Theo Câu 27: Máy sấy tóc vừa thổi gió vừa tạo nóng. Động cơ quạt dùng tác dụng từ; dây đốt dùng tác dụng nhiệt. Một thiết bị có thể dùng đồng thời nhiều tác dụng.  Dạng 2. An toàn điện Thứ tự ưu tiên: ngắt nguồn an toàn; không dùng tay trần/nước; kiểm tra không còn điện; dùng bảo vệ đúng định mức. Theo Câu 21: Ổ cắm nóng và có mùi khét. Ngắt điện, kiểm tra tiếp xúc và thay phần hỏng. Không tăng dòng định mức cầu chì để “đỡ ngắt”.  Dạng 3. Giải thích nguy cơ điện giật Dòng qua cơ thể phụ thuộc hiệu điện thế và điện trở; da ướt làm R giảm nên I tăng. Chim trên một dây có hai chân gần cùng điện thế nên dòng nhỏ. Theo Câu 24: Chim đậu trên một dây cao thế. Hai chân gần như cùng điện thế ⇒ hiệu điện thế qua cơ thể rất nhỏ ⇒ dòng rất nhỏ. Không nói cơ thể chim là chất cách điện. "},{"number":16,"title":"VÒNG NĂNG LƯỢNG TRÊN TRÁI ĐẤT – NĂNG LƯỢNG HÓA THẠCH","subject":"Vật lý","intro":["Bài chủ yếu yêu cầu nhận diện chuỗi chuyển hóa và đánh giá tác động theo vòng đời."],"forms":[{"title":"Dạng 1. Sắp xếp chuỗi chuyển hóa năng lượng","tip":"Xác định nguồn đầu: Mặt Trời → quang năng; cây quang hợp → hóa năng; nhiệt điện → hóa năng→nhiệt→cơ→điện.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Nhà máy nhiệt điện than biến đổi năng lượng theo chuỗi chính\nA. điện năng → hóa năng → quang năng.\nB. cơ năng → hóa năng → nhiệt năng.\nC. quang năng → điện năng trực tiếp.\nD. hóa năng → nhiệt năng → cơ năng → điện năng.","solution":"Hóa năng nhiên liệu → nhiệt năng → cơ năng tuabin → điện năng.","trap":"Không bỏ qua bước cơ năng của tuabin.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 2. Đánh giá giải pháp và tác động","tip":"Ưu tiên phương án xét cả khai thác, vận chuyển, sử dụng, chất thải; giảm tiêu thụ và tăng hiệu suất luôn có lợi.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 30 [TH]. Một chính sách đánh giá đúng cả vòng đời năng lượng cần tính\nA. chỉ giá mua ban đầu.\nB. khai thác, vận chuyển, sử dụng và xử lí chất thải.\nC. chỉ khối lượng thiết bị.\nD. chỉ màu sắc nhiên liệu.","solution":"Phải tính khai thác, vận chuyển, sử dụng và xử lí chất thải.","trap":"Không chỉ xét giá mua hoặc phát thải tại nơi sử dụng.","extra":[],"exampleQuestionNumber":30}],"subjectKey":"physics","shortSubject":"Lý","slug":"bai-16","summary":"Bài chủ yếu yêu cầu nhận diện chuỗi chuyển hóa và đánh giá tác động theo vòng đời.","searchText":"VÒNG NĂNG LƯỢNG TRÊN TRÁI ĐẤT – NĂNG LƯỢNG HÓA THẠCH Bài chủ yếu yêu cầu nhận diện chuỗi chuyển hóa và đánh giá tác động theo vòng đời. Dạng 1. Sắp xếp chuỗi chuyển hóa năng lượng Xác định nguồn đầu: Mặt Trời → quang năng; cây quang hợp → hóa năng; nhiệt điện → hóa năng→nhiệt→cơ→điện. Theo Câu 20: Nhà máy nhiệt điện than. Hóa năng nhiên liệu → nhiệt năng → cơ năng tuabin → điện năng. Không bỏ qua bước cơ năng của tuabin.  Dạng 2. Đánh giá giải pháp và tác động Ưu tiên phương án xét cả khai thác, vận chuyển, sử dụng, chất thải; giảm tiêu thụ và tăng hiệu suất luôn có lợi. Theo Câu 30: Chính sách đánh giá đúng vòng đời năng lượng. Phải tính khai thác, vận chuyển, sử dụng và xử lí chất thải. Không chỉ xét giá mua hoặc phát thải tại nơi sử dụng. "},{"number":17,"title":"MỘT SỐ DẠNG NĂNG LƯỢNG TÁI TẠO","subject":"Vật lý","intro":["Dùng điều kiện tự nhiên, dạng năng lượng đầu vào và yêu cầu cân bằng hệ thống để chọn phương án."],"forms":[{"title":"Dạng 1. Chọn nguồn tái tạo phù hợp điều kiện","tip":"Nhiều nắng → mặt trời; gió ổn định → điện gió; dòng nước/độ cao → thủy điện; chất thải hữu cơ → biogas; vùng địa nhiệt → nhiệt trong đất.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Khu vực nhiều nắng, mái rộng và nhu cầu điện ban ngày cao phù hợp nhất với\nA. nhiệt điện than nhỏ.\nB. máy phát dầu chạy liên tục.\nC. điện mặt trời áp mái.\nD. không dùng nguồn nào.","solution":"Phù hợp nhất là điện mặt trời áp mái.","trap":"Không chọn nguồn chỉ vì “sạch” mà bỏ qua điều kiện địa phương.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 2. Xử lí tính không ổn định của gió và mặt trời","tip":"Giải pháp: lưu trữ, nguồn linh hoạt, dự báo, quản lí phụ tải và phối hợp nhiều nguồn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 28 [TH]. Khi nhu cầu điện đạt đỉnh sau hoàng hôn, hệ thống nhiều điện mặt trời cần\nA. chỉ tăng sản lượng mặt trời ban đêm không có đèn.\nB. ngắt tất cả hộ dân.\nC. không cần kế hoạch.\nD. lưu trữ, điều chỉnh phụ tải hoặc nguồn linh hoạt.","solution":"Cần lưu trữ, điều chỉnh phụ tải hoặc nguồn linh hoạt.","trap":"Tăng diện tích pin không giải quyết việc ban đêm không có bức xạ Mặt Trời.","extra":[],"exampleQuestionNumber":28}],"subjectKey":"physics","shortSubject":"Lý","slug":"bai-17","summary":"Dùng điều kiện tự nhiên, dạng năng lượng đầu vào và yêu cầu cân bằng hệ thống để chọn phương án.","searchText":"MỘT SỐ DẠNG NĂNG LƯỢNG TÁI TẠO Dùng điều kiện tự nhiên, dạng năng lượng đầu vào và yêu cầu cân bằng hệ thống để chọn phương án. Dạng 1. Chọn nguồn tái tạo phù hợp điều kiện Nhiều nắng → mặt trời; gió ổn định → điện gió; dòng nước/độ cao → thủy điện; chất thải hữu cơ → biogas; vùng địa nhiệt → nhiệt trong đất. Theo Câu 19: Mái rộng, nhiều nắng, nhu cầu điện ban ngày cao. Phù hợp nhất là điện mặt trời áp mái. Không chọn nguồn chỉ vì “sạch” mà bỏ qua điều kiện địa phương.  Dạng 2. Xử lí tính không ổn định của gió và mặt trời Giải pháp: lưu trữ, nguồn linh hoạt, dự báo, quản lí phụ tải và phối hợp nhiều nguồn. Theo Câu 28: Nhu cầu đạt đỉnh sau hoàng hôn trong hệ thống nhiều điện mặt trời. Cần lưu trữ, điều chỉnh phụ tải hoặc nguồn linh hoạt. Tăng diện tích pin không giải quyết việc ban đêm không có bức xạ Mặt Trời. "},{"number":18,"title":"TÍNH CHẤT CHUNG CỦA KIM LOẠI","subject":"Hóa học","intro":["Dạng toán chủ yếu: kim loại tác dụng phi kim, axit; xác định chất giới hạn; tính muối, khí H₂ và tìm kim loại từ khối lượng muối."],"forms":[{"title":"Dạng 1. Kim loại tác dụng chlorine – tính khối lượng muối","tip":"Đổi kim loại ra mol, viết đúng công thức chloride rồi dùng tỉ lệ 1 mol kim loại tạo 1 mol muối.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Cho 5,4 gam Al tác dụng hết với khí Cl2 (dư), thu được m gam muối. Giá trị của m là\nA. 26,7.\nB. 12,5.\nC. 25,0.\nD. 19,6.","solution":"nAl=5,4/27=0,20 mol. 2Al+3Cl₂→2AlCl₃ nên nAlCl₃=0,20 mol. m=0,20·133,5=26,7 g.","trap":"Không lấy nAlCl₃=3/2 nAl; hệ số 3/2 là của Cl₂ so với Al.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 2. Hai chất đều cho khối lượng – tìm chất giới hạn","tip":"Tính n/hệ số của từng chất. Chất có giá trị nhỏ hơn là chất giới hạn; tính sản phẩm theo chất đó.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Cho 1 gam sodium tác dụng với 1 gam chlorine. Sau phản ứng thu được\nA. 1 gam NaCl.\nB. 1,5 gam NaCl.\nC. 1,65 gam NaCl.\nD. 2 gam NaCl.","solution":"2Na+Cl₂→2NaCl. nNa/2=(1/23)/2=0,02174; nCl₂/1=1/71=0,01408 ⇒ Cl₂ giới hạn. nNaCl=2·1/71=0,02817 mol ⇒ m≈1,65 g.","trap":"Không cộng 1+1=2 g vì Na còn dư sau phản ứng.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 3. Kim loại + HCl – tính khối lượng muối khan","tip":"Với Fe tạo FeCl₂ trong HCl loãng: nFe=nFeCl₂. Tính muối trực tiếp từ mol kim loại.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Hòa tan hoàn toàn 8,4 gam Fe vào dung dịch HCl dư, thu được dung dịch X và khí Y. Cô cạn dung dịch X thu được m gam muối khan. Giá trị của m là\nA. 12,70.\nB. 19,05.\nC. 16,25.\nD. 24,375.","solution":"nFe=8,4/56=0,15 mol ⇒ nFeCl₂=0,15 mol. mFeCl₂=0,15·127=19,05 g.","trap":"Fe tác dụng HCl tạo FeCl₂, không phải FeCl₃.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 4. Từ khối lượng muối suy ra khối lượng kim loại","tip":"Tính mol muối trước; số mol kim loại bằng số mol muối chloride đơn kim loại.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. Hòa tan m gam Fe bằng dung dịch HCl vừa đủ, thu được dung dịch Y. Cô cạn dung dịch Y thu được 25,4 gam muối khan. Vậy giá trị của m là\nA. 16,8.\nB. 6,5.\nC. 11,2.\nD. 5,6.","solution":"nFeCl₂=25,4/127=0,20 mol ⇒ nFe=0,20 mol ⇒ mFe=11,2 g.","trap":"Không dùng phần trăm Fe trong muối nếu có thể chia mol trực tiếp.","extra":[],"exampleQuestionNumber":27},{"title":"Dạng 5. Tìm kim loại từ khối lượng chloride","tip":"Lấy mCl=m muối−m kim loại. Từ hóa trị suy ra n kim loại rồi tính M=m/n.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Cho 5,6 gam kim loại M hoá trị III tác dụng với Cl2 dư, thu được 16,25 gam muối. Kim loại M là\nA. Mg.\nB. Al.\nC. Fe.\nD. Cr.","solution":"mCl=10,65 g ⇒ nCl=10,65/35,5=0,30 mol. MCl₃ nên nM=0,30/3=0,10 mol. M=5,6/0,10=56 ⇒ Fe.","trap":"Phải chia số mol Cl cho hóa trị 3.","extra":[],"exampleQuestionNumber":23},{"title":"Dạng 6. Kim loại + axit – tính thể tích H₂","tip":"Với Zn hoặc Fe hóa trị II: nH₂=n kim loại. Sau đó V=n·24,79.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 29 [TH]. Hòa tan hoàn toàn 6,5 gam Zn bằng dung dịch H2SO4 loãng, thu được V lít H2 (đkc). Giá trị của V là\nA. 2,479.\nB. 9,916.\nC. 7,7185.\nD. 4,958.","solution":"nZn=6,5/65=0,10 mol ⇒ nH₂=0,10 mol ⇒ V=2,479 L.","trap":"Không dùng 22,4 L/mol vì ngân hàng đang quy ước 24,79 L/mol.","extra":[],"exampleQuestionNumber":29},{"title":"Dạng 7. Kim loại + Cl₂ khi cả hai có thể giới hạn","tip":"Viết hệ số, so sánh n/hệ số. Sản phẩm tính theo chất giới hạn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 26 [TH]. Cho 56 gam sắt tác dụng với 56 gam khí chlorine. Sau phản ứng thu được một lượng muối chloride là\nA. 162,5 gam.\nB. 85,44 gam.\nC. 112 gam.\nD. 127 gam.","solution":"2Fe+3Cl₂→2FeCl₃. nFe=1 mol; nCl₂=56/71=0,7887 mol. Cl₂ giới hạn. nFeCl₃=2/3·0,7887=0,5258 mol ⇒ m≈85,44 g.","trap":"Không mặc định Fe phản ứng hết chỉ vì khối lượng hai chất bằng nhau.","extra":[],"exampleQuestionNumber":26},{"title":"Dạng 8. Nhận biết hóa trị khác nhau của Fe qua chuỗi phản ứng","tip":"Fe tác dụng Cl₂ tạo FeCl₃; Fe tác dụng HCl tạo FeCl₂. Fe kim loại còn có thể khử Fe³⁺ về Fe²⁺.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 [TH]. Cho kim loại M tác dụng với Cl2 được muối X; cho kim loại M tác dụng với dung dịch HCl được muối Y. Nếu cho kim loại M tác dụng với dung dịch muối X ta cũng được muối Y. Kim loại M có thể là\nA. Fe.\nB. Zn.\nC. Al.\nD. Mg.","solution":"Fe phù hợp: Fe+Cl₂→FeCl₃; Fe+HCl→FeCl₂; Fe+2FeCl₃→3FeCl₂.","trap":"Đây là dạng suy luận hóa trị, không cần tính số mol.","extra":[],"exampleQuestionNumber":25}],"subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-18","summary":"Dạng toán chủ yếu: kim loại tác dụng phi kim, axit; xác định chất giới hạn; tính muối, khí H₂ và tìm kim loại từ khối lượng muối.","searchText":"TÍNH CHẤT CHUNG CỦA KIM LOẠI Dạng toán chủ yếu: kim loại tác dụng phi kim, axit; xác định chất giới hạn; tính muối, khí H₂ và tìm kim loại từ khối lượng muối. Dạng 1. Kim loại tác dụng chlorine – tính khối lượng muối Đổi kim loại ra mol, viết đúng công thức chloride rồi dùng tỉ lệ 1 mol kim loại tạo 1 mol muối. Theo Câu 20: 5,4 g Al tác dụng Cl₂ dư. nAl=5,4/27=0,20 mol. 2Al+3Cl₂→2AlCl₃ nên nAlCl₃=0,20 mol. m=0,20·133,5=26,7 g. Không lấy nAlCl₃=3/2 nAl; hệ số 3/2 là của Cl₂ so với Al.  Dạng 2. Hai chất đều cho khối lượng – tìm chất giới hạn Tính n/hệ số của từng chất. Chất có giá trị nhỏ hơn là chất giới hạn; tính sản phẩm theo chất đó. Theo Câu 19: 1 g Na tác dụng với 1 g Cl₂. 2Na+Cl₂→2NaCl. nNa/2=(1/23)/2=0,02174; nCl₂/1=1/71=0,01408 ⇒ Cl₂ giới hạn. nNaCl=2·1/71=0,02817 mol ⇒ m≈1,65 g. Không cộng 1+1=2 g vì Na còn dư sau phản ứng.  Dạng 3. Kim loại + HCl – tính khối lượng muối khan Với Fe tạo FeCl₂ trong HCl loãng: nFe=nFeCl₂. Tính muối trực tiếp từ mol kim loại. Theo Câu 22: Hòa tan 8,4 g Fe bằng HCl dư rồi cô cạn. nFe=8,4/56=0,15 mol ⇒ nFeCl₂=0,15 mol. mFeCl₂=0,15·127=19,05 g. Fe tác dụng HCl tạo FeCl₂, không phải FeCl₃.  Dạng 4. Từ khối lượng muối suy ra khối lượng kim loại Tính mol muối trước; số mol kim loại bằng số mol muối chloride đơn kim loại. Theo Câu 27: Cô cạn thu 25,4 g FeCl₂. nFeCl₂=25,4/127=0,20 mol ⇒ nFe=0,20 mol ⇒ mFe=11,2 g. Không dùng phần trăm Fe trong muối nếu có thể chia mol trực tiếp.  Dạng 5. Tìm kim loại từ khối lượng chloride Lấy mCl=m muối−m kim loại. Từ hóa trị suy ra n kim loại rồi tính M=m/n. Theo Câu 23: 5,6 g M hóa trị III tạo 16,25 g MCl₃. mCl=10,65 g ⇒ nCl=10,65/35,5=0,30 mol. MCl₃ nên nM=0,30/3=0,10 mol. M=5,6/0,10=56 ⇒ Fe. Phải chia số mol Cl cho hóa trị 3.  Dạng 6. Kim loại + axit – tính thể tích H₂ Với Zn hoặc Fe hóa trị II: nH₂=n kim loại. Sau đó V=n·24,79. Theo Câu 29: 6,5 g Zn tác dụng H₂SO₄ loãng. nZn=6,5/65=0,10 mol ⇒ nH₂=0,10 mol ⇒ V=2,479 L. Không dùng 22,4 L/mol vì ngân hàng đang quy ước 24,79 L/mol.  Dạng 7. Kim loại + Cl₂ khi cả hai có thể giới hạn Viết hệ số, so sánh n/hệ số. Sản phẩm tính theo chất giới hạn. Theo Câu 26: 56 g Fe và 56 g Cl₂. 2Fe+3Cl₂→2FeCl₃. nFe=1 mol; nCl₂=56/71=0,7887 mol. Cl₂ giới hạn. nFeCl₃=2/3·0,7887=0,5258 mol ⇒ m≈85,44 g. Không mặc định Fe phản ứng hết chỉ vì khối lượng hai chất bằng nhau.  Dạng 8. Nhận biết hóa trị khác nhau của Fe qua chuỗi phản ứng Fe tác dụng Cl₂ tạo FeCl₃; Fe tác dụng HCl tạo FeCl₂. Fe kim loại còn có thể khử Fe³⁺ về Fe²⁺. Theo Câu 25: M + Cl₂ tạo X; M + HCl tạo Y; M + dung dịch X cũng tạo Y. Fe phù hợp: Fe+Cl₂→FeCl₃; Fe+HCl→FeCl₂; Fe+2FeCl₃→3FeCl₂. Đây là dạng suy luận hóa trị, không cần tính số mol. "},{"number":19,"title":"DÃY HOẠT ĐỘNG HÓA HỌC","subject":"Hóa học","intro":["Trọng tâm là dự đoán phản ứng thế, sắp xếp mức độ hoạt động, làm sạch kim loại, tính chất rắn sau phản ứng và biến thiên khối lượng."],"forms":[{"title":"Dạng 1. Chọn phản ứng kim loại – dung dịch muối","tip":"So vị trí hai kim loại. Kim loại tự do phải đứng trước kim loại trong muối.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 6 [NB]. Kim loại Fe phản ứng được với dung dịch\nA. MgSO4.\nB. CuSO4.\nC. ZnSO4.\nD. Al2(SO4)3.","solution":"Fe đứng trước Cu nên Fe+CuSO₄→FeSO₄+Cu. Các muối Mg, Zn, Al không bị Fe đẩy.","trap":"Na, K, Ca trong dung dịch nước thường phản ứng với nước trước; không áp dụng máy móc quy tắc đẩy kim loại.","extra":[],"exampleQuestionNumber":6},{"title":"Dạng 2. Làm sạch kim loại bị lẫn tạp chất","tip":"Chọn dung dịch chỉ hòa tan tạp chất hoặc khiến tạp chất bị thay thế, nhưng không làm mất kim loại cần giữ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 15 [NB]. Để làm sạch mẫu chì bị lẫn kẽm, người ta ngâm mẫu chì này vào một lượng dư dung dịch\nA. CuCl2.\nB. Na2CO3.\nC. Pb(NO3)2.\nD. ZnSO4.","solution":"Ngâm trong Pb(NO₃)₂ dư: Zn+Pb²⁺→Zn²⁺+Pb; Zn bị loại, Pb không phản ứng với ion Pb²⁺.","trap":"Không chọn CuCl₂ vì cả Zn và Pb đều có thể phản ứng, làm thay đổi mẫu.","extra":[],"exampleQuestionNumber":15},{"title":"Dạng 3. Kim loại đẩy Cu²⁺ – tính khối lượng kim loại phản ứng","tip":"Với Fe+Cu²⁺ tỉ lệ 1:1. Từ mCu suy ra nCu rồi suy ra nFe.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Cho m gam Fe tác dụng hết với dung dịch CuSO4 dư, thu được 19,2 gam Cu. Giá trị của m là\nA. 11,2.\nB. 8,4.\nC. 14,0.\nD. 16,8.","solution":"nCu=19,2/64=0,30 mol ⇒ nFe=0,30 mol ⇒ mFe=16,8 g.","trap":"Dùng nguyên tử khối theo chương trình nguồn: Cu=64, Fe=56.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 4. Tính khối lượng chất rắn thu được khi kim loại phản ứng hết","tip":"Nếu dung dịch muối dư và kim loại ban đầu phản ứng hết, chất rắn cuối thường là kim loại mới sinh ra.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24 [TH]. Cho 6,5 gam bột Zn vào dung dịch CuSO4 dư, sau phản ứng hoàn toàn thu được m gam chất rắn. Giá trị của m là\nA. 5,6.\nB. 12,9.\nC. 3,2.\nD. 6,4.","solution":"nZn=0,10 mol ⇒ nCu=0,10 mol ⇒ m chất rắn=mCu=6,4 g.","trap":"Không cộng khối lượng Zn ban đầu vì Zn đã tan hết.","extra":[],"exampleQuestionNumber":24},{"title":"Dạng 5. Khối lượng thanh kim loại tăng hay giảm","tip":"So khối lượng mol kim loại bám và kim loại tan theo cùng số mol phản ứng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 [TH]. Cho một lá Fe vào dung dịch CuSO4, sau một thời gian lấy lá sắt ra, khối lượng dung dịch thay đổi như thế nào?\nA. Giảm so với ban đầu.\nB. Tăng gấp đôi so với ban đầu.\nC. Tăng so với ban đầu.\nD. Không tăng, không giảm so với ban đầu.","solution":"Mỗi 1 mol Fe tan mất 56 g, đồng thời 1 mol Cu bám 64 g ⇒ thanh tăng 8 g/mol; dung dịch giảm tương ứng.","trap":"Câu hỏi hỏi khối lượng dung dịch thì chiều biến thiên ngược với thanh kim loại.","extra":[],"exampleQuestionNumber":25},{"title":"Dạng 6. Dùng nồng độ dung dịch để tính kim loại tạo thành","tip":"Tính n ion kim loại=CₘV. Nếu kim loại cho dư, ion muối phản ứng hết.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. Cho bột nhôm dư vào 100 mL dung dịch CuSO4 0,2M đến khi phản ứng xảy ra hoàn toàn, thu được m gam Cu. Giá trị của m là\nA. 1,92.\nB. 0,32.\nC. 1,28.\nD. 0,64.","solution":"nCu²⁺=0,1·0,2=0,02 mol ⇒ nCu=0,02 mol ⇒ mCu=1,28 g.","trap":"Tỉ lệ 2Al:3Cu²⁺ chỉ cần dùng khi hỏi lượng Al; lượng Cu bằng lượng Cu²⁺ ban đầu.","extra":[],"exampleQuestionNumber":27},{"title":"Dạng 7. Chất rắn gồm kim loại mới và kim loại dư","tip":"Tính lượng kim loại mới sinh ra, lượng kim loại ban đầu đã phản ứng, rồi lấy: m rắn=m mới+m dư.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 30 [TH]. Cho 2,24 gam bột sắt vào 200 mL dung dịch CuSO4 0,05M. Sau khi các phản ứng xảy ra hoàn toàn, thu được dung dịch X và m gam chất rắn Y. Giá trị của m là\nA. 2,32.\nB. 0,64.\nC. 1,68.\nD. 3,84.","solution":"nFe ban đầu=0,04; nCu²⁺=0,01. Cu²⁺ hết, Fe phản ứng 0,01 mol (=0,56 g), Fe dư=1,68 g; Cu=0,64 g. m rắn=2,32 g.","trap":"Không chỉ tính Cu vì Fe còn dư.","extra":[],"exampleQuestionNumber":30},{"title":"Dạng 8. Tìm lượng kim loại ban đầu khi chất rắn cuối gồm sản phẩm và phần dư","tip":"Từ lượng ion trong dung dịch suy ra kim loại đã phản ứng và kim loại mới. Dùng khối lượng chất rắn cuối để tìm phần kim loại dư.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 28 [TH]. Cho m gam nhôm vào 200 mL dung dịch Fe(NO3)2 0,2M đến khi phản ứng xảy ra hoàn toàn, thu được 4,49 gam chất rắn. Giá trị của m là\nA. 0,72.\nB. 5,4.\nC. 2,25.\nD. 2,97.","solution":"nFe²⁺=0,04 mol ⇒ mFe tạo thành=2,24 g; Al đã phản ứng=(2/3)·0,04·27=0,72 g. Al dư=4,49−2,24=2,25 g. mAl ban đầu=2,25+0,72=2,97 g.","trap":"Chất rắn 4,49 g lớn hơn Fe tối đa nên chắc chắn có Al dư.","extra":[],"exampleQuestionNumber":28},{"title":"Dạng 9. Xác định dung dịch làm khối lượng chất rắn tăng","tip":"Xét khối lượng kim loại bám so với kim loại tan. Zn bị Ag⁺ thay thế cho độ tăng lớn nhất vì 1 mol Zn tạo 2 mol Ag.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Khi cho mẫu Zn vào bình đựng dung dịch X, thì thấy khối lượng chất rắn trong bình từ từ tăng lên. Dung dịch X là\nA. Fe(NO3)3.\nB. Cu(NO3)2.\nC. AgNO3.\nD. KNO3.","solution":"Zn+2AgNO₃→Zn(NO₃)₂+2Ag. 65 g Zn tan, 216 g Ag bám ⇒ chất rắn tăng. Chọn AgNO₃.","trap":"Với Cu²⁺: 65 g Zn tan nhưng chỉ 64 g Cu bám nên khối lượng giảm nhẹ.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 10. Sắp xếp kim loại từ dữ kiện phản ứng","tip":"“A đẩy B khỏi muối” ⇒ A mạnh hơn B. “Tan trong HCl” ⇒ đứng trước H; “không tan” ⇒ đứng sau H.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 26 [TH]. Có 4 kim loại X, Y, Z, T đứng sau Mg trong dãy hoạt động hóa học. Biết Z và T tan trong dung dịch HCl, X và Y không tan trong dung dịch HCl, Z đẩy được T trong dung dịch muối T; X đẩy được Y trong dung dịch muối Y. Thứ tự hoạt động hóa học của kim loại tăng dần như sau:\nA. T, Z, X, Y.\nB. Y, X, T, Z.\nC. Z, T, X, Y.\nD. Z, T, Y, X.","solution":"Trong từng nhóm: Z>T>H>X>Y. Theo chiều tăng dần: Y<X<T<Z.","trap":"Tách dữ kiện thành các bất đẳng thức rồi ghép, không suy đoán theo tên X,Y,Z,T.","extra":[],"exampleQuestionNumber":26}],"subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-19","summary":"Trọng tâm là dự đoán phản ứng thế, sắp xếp mức độ hoạt động, làm sạch kim loại, tính chất rắn sau phản ứng và biến thiên khối lượng.","searchText":"DÃY HOẠT ĐỘNG HÓA HỌC Trọng tâm là dự đoán phản ứng thế, sắp xếp mức độ hoạt động, làm sạch kim loại, tính chất rắn sau phản ứng và biến thiên khối lượng. Dạng 1. Chọn phản ứng kim loại – dung dịch muối So vị trí hai kim loại. Kim loại tự do phải đứng trước kim loại trong muối. Theo Câu 6: Fe có phản ứng với CuSO₄ không? Fe đứng trước Cu nên Fe+CuSO₄→FeSO₄+Cu. Các muối Mg, Zn, Al không bị Fe đẩy. Na, K, Ca trong dung dịch nước thường phản ứng với nước trước; không áp dụng máy móc quy tắc đẩy kim loại.  Dạng 2. Làm sạch kim loại bị lẫn tạp chất Chọn dung dịch chỉ hòa tan tạp chất hoặc khiến tạp chất bị thay thế, nhưng không làm mất kim loại cần giữ. Theo Câu 15: Làm sạch Pb bị lẫn Zn. Ngâm trong Pb(NO₃)₂ dư: Zn+Pb²⁺→Zn²⁺+Pb; Zn bị loại, Pb không phản ứng với ion Pb²⁺. Không chọn CuCl₂ vì cả Zn và Pb đều có thể phản ứng, làm thay đổi mẫu.  Dạng 3. Kim loại đẩy Cu²⁺ – tính khối lượng kim loại phản ứng Với Fe+Cu²⁺ tỉ lệ 1:1. Từ mCu suy ra nCu rồi suy ra nFe. Theo Câu 20: Thu 19,2 g Cu khi cho Fe vào CuSO₄ dư. nCu=19,2/64=0,30 mol ⇒ nFe=0,30 mol ⇒ mFe=16,8 g. Dùng nguyên tử khối theo chương trình nguồn: Cu=64, Fe=56.  Dạng 4. Tính khối lượng chất rắn thu được khi kim loại phản ứng hết Nếu dung dịch muối dư và kim loại ban đầu phản ứng hết, chất rắn cuối thường là kim loại mới sinh ra. Theo Câu 24: 6,5 g Zn cho vào CuSO₄ dư. nZn=0,10 mol ⇒ nCu=0,10 mol ⇒ m chất rắn=mCu=6,4 g. Không cộng khối lượng Zn ban đầu vì Zn đã tan hết.  Dạng 5. Khối lượng thanh kim loại tăng hay giảm So khối lượng mol kim loại bám và kim loại tan theo cùng số mol phản ứng. Theo Câu 25: Fe nhúng vào CuSO₄. Mỗi 1 mol Fe tan mất 56 g, đồng thời 1 mol Cu bám 64 g ⇒ thanh tăng 8 g/mol; dung dịch giảm tương ứng. Câu hỏi hỏi khối lượng dung dịch thì chiều biến thiên ngược với thanh kim loại.  Dạng 6. Dùng nồng độ dung dịch để tính kim loại tạo thành Tính n ion kim loại=CₘV. Nếu kim loại cho dư, ion muối phản ứng hết. Theo Câu 27: Al dư vào 100 mL CuSO₄ 0,2 M. nCu²⁺=0,1·0,2=0,02 mol ⇒ nCu=0,02 mol ⇒ mCu=1,28 g. Tỉ lệ 2Al:3Cu²⁺ chỉ cần dùng khi hỏi lượng Al; lượng Cu bằng lượng Cu²⁺ ban đầu.  Dạng 7. Chất rắn gồm kim loại mới và kim loại dư Tính lượng kim loại mới sinh ra, lượng kim loại ban đầu đã phản ứng, rồi lấy: m rắn=m mới+m dư. Theo Câu 30: 2,24 g Fe vào 200 mL CuSO₄ 0,05 M. nFe ban đầu=0,04; nCu²⁺=0,01. Cu²⁺ hết, Fe phản ứng 0,01 mol (=0,56 g), Fe dư=1,68 g; Cu=0,64 g. m rắn=2,32 g. Không chỉ tính Cu vì Fe còn dư.  Dạng 8. Tìm lượng kim loại ban đầu khi chất rắn cuối gồm sản phẩm và phần dư Từ lượng ion trong dung dịch suy ra kim loại đã phản ứng và kim loại mới. Dùng khối lượng chất rắn cuối để tìm phần kim loại dư. Theo Câu 28: Al vào 200 mL Fe(NO₃)₂ 0,2 M, thu 4,49 g chất rắn. nFe²⁺=0,04 mol ⇒ mFe tạo thành=2,24 g; Al đã phản ứng=(2/3)·0,04·27=0,72 g. Al dư=4,49−2,24=2,25 g. mAl ban đầu=2,25+0,72=2,97 g. Chất rắn 4,49 g lớn hơn Fe tối đa nên chắc chắn có Al dư.  Dạng 9. Xác định dung dịch làm khối lượng chất rắn tăng Xét khối lượng kim loại bám so với kim loại tan. Zn bị Ag⁺ thay thế cho độ tăng lớn nhất vì 1 mol Zn tạo 2 mol Ag. Theo Câu 19: Cho Zn vào dung dịch nào thì khối lượng chất rắn tăng? Zn+2AgNO₃→Zn(NO₃)₂+2Ag. 65 g Zn tan, 216 g Ag bám ⇒ chất rắn tăng. Chọn AgNO₃. Với Cu²⁺: 65 g Zn tan nhưng chỉ 64 g Cu bám nên khối lượng giảm nhẹ.  Dạng 10. Sắp xếp kim loại từ dữ kiện phản ứng “A đẩy B khỏi muối” ⇒ A mạnh hơn B. “Tan trong HCl” ⇒ đứng trước H; “không tan” ⇒ đứng sau H. Theo Câu 26: Z,T tan trong HCl; Z đẩy T. X,Y không tan; X đẩy Y. Trong từng nhóm: Z>T>H>X>Y. Theo chiều tăng dần: Y<X<T<Z. Tách dữ kiện thành các bất đẳng thức rồi ghép, không suy đoán theo tên X,Y,Z,T. "},{"number":20,"title":"TÁCH KIM LOẠI VÀ VIỆC SỬ DỤNG HỢP KIM","subject":"Hóa học","intro":["Các dạng định lượng gồm: chọn phương pháp điều chế, khử oxide, tính quặng, tính công thức hợp kim và chuỗi khử oxide – hòa tan kim loại."],"forms":[{"title":"Dạng 1. Chọn phương pháp điều chế kim loại","tip":"Nhìn vị trí kim loại: K, Na, Ca, Mg, Al dùng điện phân nóng chảy; Fe, Zn, Cu có thể nhiệt luyện; Cu, Ag, Au có thể thủy luyện.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24 [TH]. Cho các kim
