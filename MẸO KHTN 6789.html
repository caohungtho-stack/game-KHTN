","solution":"Hóa thạch sâu hơn thường cổ hơn.","trap":"Không áp dụng nguyên tắc lớp sâu hơn khi địa tầng đã bị đảo lộn.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 6. Các đại địa chất","tip":"Cổ sinh: sinh vật biển, cá và sự lên cạn; Trung sinh: bò sát; Tân sinh: động vật có vú và chim.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 17 [NB]. Đại Trung sinh thường được gọi là thời đại của\nA. bò sát.\nB. vi khuẩn duy nhất.\nC. động vật có vú.\nD. người.","solution":"Chọn Đại Trung sinh.","trap":"Không chọn Đại Tân sinh.","extra":[],"exampleQuestionNumber":17},{"title":"Dạng 7. Tuyệt chủng hàng loạt","tip":"Tuyệt chủng làm mất nhiều nhóm nhưng có thể mở ổ sinh thái cho nhóm sống sót bức xạ thích nghi.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Một vụ tuyệt chủng hàng loạt có thể\nA. tạo sự sống đầu tiên ngay.\nB. dừng tiến hóa vĩnh viễn.\nC. mở ra ổ sinh thái và thúc đẩy bức xạ thích nghi của nhóm sống sót.\nD. không ảnh hưởng hệ sinh thái.","solution":"Các nhóm sống sót có thể đa dạng hóa khi ổ sinh thái trống xuất hiện.","trap":"Không kết luận tiến hóa dừng vĩnh viễn.","extra":[],"exampleQuestionNumber":23}],"subjectKey":"biology","shortSubject":"Sinh","slug":"bai-51","summary":"Tiến hóa hóa học → tiền sinh học → sinh học.","searchText":"SỰ PHÁT SINH VÀ PHÁT TRIỂN SỰ SỐNG TRÊN TRÁI ĐẤT Tiến hóa hóa học → tiền sinh học → sinh học. Dạng 1. Ba giai đoạn phát sinh sự sống Tiến hóa hóa học → tiền sinh học → sinh học. Hình thành chất hữu cơ từ chất vô cơ thuộc giai đoạn nào? Tiến hóa hóa học. Không gọi việc tạo amino acid đơn giản là đã tạo tế bào sống.  Dạng 2. Ý nghĩa thí nghiệm Miller–Urey Thí nghiệm cho thấy chất hữu cơ đơn giản có thể hình thành trong điều kiện mô phỏng Trái Đất nguyên thủy. Miller–Urey tạo amino acid. Kết luận chỉ hỗ trợ tiến hóa hóa học, chưa tạo ra sự sống hoàn chỉnh. Không coi amino acid là tế bào tự sao chép.  Dạng 3. Dạng sống đầu tiên và oxygen Nguồn nêu dạng sống đầu tiên có khả năng là tế bào đơn giản, nhân sơ, dị dưỡng kị khí; quang hợp về sau làm tăng oxygen. Oxygen khí quyển tăng. Tạo điều kiện cho hô hấp hiếu khí và tầng ozone. Không cho rằng khí quyển nguyên thủy giàu oxygen tự do.  Dạng 4. Thuyết nội cộng sinh Ti thể và lục lạp có DNA vòng, ribosome riêng và phân chia tương tự vi khuẩn. Cần chọn bằng chứng ủng hộ nội cộng sinh. Chọn đặc điểm DNA vòng và ribosome riêng. Không dùng sự có mặt của màng tế bào chung làm bằng chứng đặc trưng.  Dạng 5. Xác định tuổi hóa thạch Lớp sâu hơn thường cổ hơn nếu không bị đảo lộn; định tuổi phóng xạ dựa tốc độ phân rã isotope. Hai hóa thạch ở các lớp địa chất nguyên vẹn, một ở sâu hơn. Hóa thạch sâu hơn thường cổ hơn. Không áp dụng nguyên tắc lớp sâu hơn khi địa tầng đã bị đảo lộn.  Dạng 6. Các đại địa chất Cổ sinh: sinh vật biển, cá và sự lên cạn; Trung sinh: bò sát; Tân sinh: động vật có vú và chim. Hỏi “thời đại của bò sát”. Chọn Đại Trung sinh. Không chọn Đại Tân sinh.  Dạng 7. Tuyệt chủng hàng loạt Tuyệt chủng làm mất nhiều nhóm nhưng có thể mở ổ sinh thái cho nhóm sống sót bức xạ thích nghi. Sau một vụ tuyệt chủng hàng loạt. Các nhóm sống sót có thể đa dạng hóa khi ổ sinh thái trống xuất hiện. Không kết luận tiến hóa dừng vĩnh viễn. "}],"totalForms":271,"sourceQuestionCount":null}},"totals":{"grades":4,"units":195,"forms":703}}</script>
  <script>
    (() => {
      "use strict";

      // Dùng bộ nhớ tạm nếu trình duyệt chặn localStorage (chế độ riêng tư,
      // chính sách bảo mật hoặc một số cách mở tệp HTML cục bộ).
      const localStorage = (() => {
        const memory = new Map();
        const fallback = {
          getItem: key => memory.has(key) ? memory.get(key) : null,
          setItem: (key, value) => memory.set(key, String(value)),
          removeItem: key => memory.delete(key),
          clear: () => memory.clear(),
          key: index => [...memory.keys()][index] ?? null,
          get length() { return memory.size; }
        };

        try {
          const nativeStorage = window.localStorage;
          const testKey = "__khtn_storage_test__";
          nativeStorage.setItem(testKey, "1");
          nativeStorage.removeItem(testKey);
          return nativeStorage;
        } catch {
          return fallback;
        }
      })();

      const DATA = JSON.parse(document.getElementById("appData").textContent);
      const gradeKeys = ["6", "7", "8", "9"];
      const gradeColors = { "6":"#5f6673", "7":"#7254a3", "8":"#b45f06", "9":"#1769aa" };
      const subjectOrder = ["general", "chemistry", "physics", "biology", "earth"];
      const universalSubjects = [
        { key: "general", name: "Kĩ năng chung", short: "Chung" },
        { key: "chemistry", name: "Hóa học", short: "Hóa" },
        { key: "physics", name: "Vật lý", short: "Lý" },
        { key: "biology", name: "Sinh học", short: "Sinh" },
        { key: "earth", name: "Trái Đất và bầu trời", short: "Vũ trụ" }
      ];

      const els = {
        gradeStrip: document.getElementById("gradeStrip"),
        progressLabel: document.getElementById("progressLabel"),
        progressCount: document.getElementById("progressCount"),
        progressBar: document.getElementById("progressBar"),
        filters: document.getElementById("subjectFilters"),
        nav: document.getElementById("lessonNav"),
        content: document.getElementById("contentInner"),
        main: document.getElementById("mainContent"),
        search: document.getElementById("searchInput"),
        scope: document.getElementById("scopeSelect"),
        mobileScope: document.getElementById("mobileScopeSelect"),
        home: document.getElementById("homeButton"),
        font: document.getElementById("fontButton"),
        theme: document.getElementById("themeButton"),
        menu: document.getElementById("menuButton"),
        sidebar: document.getElementById("sidebar"),
        backdrop: document.getElementById("backdrop"),
        toast: document.getElementById("toast")
      };

      const storage = {
        theme: "khtn-6-9-theme-v1",
        font: "khtn-6-9-font-v1",
        currentGrade: "khtn-6-9-current-grade-v1",
        lastUnit: grade => `khtn-6-9-last-${grade}-v1`,
        complete: grade => `khtn-6-9-complete-${grade}-v1`,
        favorite: grade => `khtn-6-9-favorite-${grade}-v1`,
        selfTest: "khtn-6-9-self-test-v1"
      };

      const state = {
        grade: localStorage.getItem(storage.currentGrade) || "9",
        unit: null,
        subject: "all",
        query: "",
        searchScope: "current",
        selfTest: localStorage.getItem(storage.selfTest) === "true",
        allOpen: false,
        completed: {},
        favorites: {}
      };

      gradeKeys.forEach(grade => {
        state.completed[grade] = readSet(storage.complete(grade));
        state.favorites[grade] = readSet(storage.favorite(grade));
      });

      function readSet(key) {
        try {
          const value = JSON.parse(localStorage.getItem(key) || "[]");
          return new Set(Array.isArray(value) ? value.map(Number) : []);
        } catch {
          return new Set();
        }
      }

      function saveSet(key, set) {
        localStorage.setItem(key, JSON.stringify([...set]));
      }

      function gradeData(grade = state.grade) {
        return DATA.grades[grade];
      }

      function escapeHTML(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function normalize(value) {
        return String(value ?? "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/đ/g, "d")
          .replace(/Đ/g, "D")
          .toLowerCase();
      }

      function matchesSearch(grade, lesson, rawQuery) {
        const query = normalize(rawQuery).trim().replace(/\s+/g, " ");
        if (!query) return true;

        // Các truy vấn số được hiểu là số bài/chủ đề, tránh trường hợp
        // tìm “1” rồi khớp với mọi câu hỏi có chứa chữ số 1.
        const gradeUnit = query.match(/^(?:khtn|lop)\s*([6-9])\s*(?:bai|chu de|chu de so)?\s*(\d+)$/);
        if (gradeUnit) {
          return grade === gradeUnit[1] && lesson.number === Number(gradeUnit[2]);
        }

        const unitOnly = query.match(/^(?:bai|bai so|chu de|chu de so)?\s*(\d+)$/);
        if (unitOnly) return lesson.number === Number(unitOnly[1]);

        return normalize(lesson.searchText || `${lesson.title} ${lesson.summary}`).includes(query);
      }

      function titleCaseIfUpper(value) {
        const text = String(value || "");
        if (!text || text !== text.toLocaleUpperCase("vi-VN")) return text;
        return text.toLocaleLowerCase("vi-VN")
          .replace(/(^|[\s–—\-.(])([\p{L}])/gu, (_, a, b) => a + b.toLocaleUpperCase("vi-VN"));
      }

      function unitName(grade, lesson, includeGrade = false) {
        const meta = DATA.grades[grade];
        const prefix = includeGrade ? `Lớp ${grade} • ` : "";
        return `${prefix}${meta.unitLabel} ${lesson.number}. ${titleCaseIfUpper(lesson.title)}`;
      }

      function getLesson(grade, number) {
        return DATA.grades[grade].lessons.find(item => item.number === number);
      }

      function subjectMeta(grade, key) {
        return DATA.grades[grade].subjects.find(item => item.key === key)
          || { name: key, key, short: key, count: 0 };
      }

      function switchGrade(grade, keepView = false) {
        if (!DATA.grades[grade]) return;
        state.grade = grade;
        state.subject = "all";
        localStorage.setItem(storage.currentGrade, grade);
        renderGradeControls();
        renderSidebar();

        if (!keepView) {
          state.unit = null;
          if (state.query.trim()) renderSearchResults();
          else renderWelcome();
        }
      }

      function renderGradeControls() {
        els.gradeStrip.innerHTML = gradeKeys.map(grade => `
          <button class="grade-button" type="button" data-grade="${grade}" aria-pressed="${grade === state.grade}">
            Lớp ${grade}
          </button>
        `).join("");

        els.gradeStrip.querySelectorAll("[data-grade]").forEach(button => {
          button.addEventListener("click", () => switchGrade(button.dataset.grade));
        });

        const data = gradeData();
        const visibleSubjects = state.searchScope === "all" ? universalSubjects : data.subjects;
        els.filters.innerHTML = `
          <button class="filter-button" type="button" data-filter="all" aria-pressed="${state.subject === "all"}">Tất cả</button>
          ${visibleSubjects.map(subject => `
            <button class="filter-button" type="button" data-filter="${subject.key}" aria-pressed="${state.subject === subject.key}">
              ${escapeHTML(subject.short || subject.name)}
            </button>
          `).join("")}
        `;

        els.filters.querySelectorAll("[data-filter]").forEach(button => {
          button.addEventListener("click", () => {
            state.subject = button.dataset.filter;
            renderGradeControls();
            renderSidebar();
            if (state.query.trim()) renderSearchResults();
          });
        });

        els.scope.value = state.searchScope;
        els.mobileScope.value = state.searchScope;
        updateProgress();
      }

      function filteredCurrentLessons() {
        const data = gradeData();
        return data.lessons.filter(lesson => {
          const subjectMatch = state.subject === "all" || lesson.subjectKey === state.subject;
          return subjectMatch && matchesSearch(state.grade, lesson, state.query);
        });
      }

      function renderSidebar() {
        if (state.searchScope === "all" && state.query.trim()) {
          const results = globalSearch();
          if (!results.length) {
            els.nav.innerHTML = `<div class="empty">Không tìm thấy nội dung phù hợp trong lớp 6–9.</div>`;
            return;
          }
          const groups = gradeKeys.map(grade => ({
            grade,
            items: results.filter(item => item.grade === grade)
          })).filter(group => group.items.length);

          els.nav.innerHTML = groups.map(group => `
            <section class="nav-section">
              <h2 class="nav-heading"><span>KHTN ${group.grade}</span><span>${group.items.length} kết quả</span></h2>
              <div class="nav-list">
                ${group.items.map(({lesson}) => lessonLink(group.grade, lesson, true)).join("")}
              </div>
            </section>
          `).join("");
        } else {
          const visible = filteredCurrentLessons();
          if (!visible.length) {
            els.nav.innerHTML = `<div class="empty">Không tìm thấy bài hoặc chủ đề phù hợp.</div>`;
            return;
          }

          // Giữ đúng thứ tự chương/bài của từng khối thay vì dùng một
          // thứ tự môn cố định cho cả bốn lớp.
          const groups = gradeData().subjects.map(meta => ({
            key: meta.key,
            meta,
            lessons: visible.filter(lesson => lesson.subjectKey === meta.key)
          })).filter(group => group.lessons.length);

          els.nav.innerHTML = groups.map(group => `
            <section class="nav-section">
              <h2 class="nav-heading"><span>${escapeHTML(group.meta.name)}</span><span>${group.lessons.length}</span></h2>
              <div class="nav-list">
                ${group.lessons.map(lesson => lessonLink(state.grade, lesson, false)).join("")}
              </div>
            </section>
          `).join("");
        }

        els.nav.querySelectorAll("[data-open-grade][data-open-unit]").forEach(button => {
          button.addEventListener("click", () => {
            const grade = button.dataset.openGrade;
            const unit = Number(button.dataset.openUnit);
            if (state.grade !== grade) {
              state.grade = grade;
              state.subject = "all";
              localStorage.setItem(storage.currentGrade, grade);
              renderGradeControls();
            }
            openLesson(grade, unit);
          });
        });
      }

      function lessonLink(grade, lesson, showGrade) {
        const current = state.grade === grade && state.unit === lesson.number;
        const complete = state.completed[grade].has(lesson.number);
        return `
          <button class="lesson-link ${complete ? "is-complete" : ""}" type="button"
            data-open-grade="${grade}" data-open-unit="${lesson.number}" data-subject="${lesson.subjectKey}"
            ${current ? 'aria-current="page"' : ""}>
            <span class="lesson-number">${showGrade ? `${grade}.${lesson.number}` : lesson.number}</span>
            <span class="lesson-title">${escapeHTML(unitName(grade, lesson, false))}</span>
            <span class="lesson-status">${complete ? "✓" : ""}</span>
          </button>
        `;
      }

      function globalSearch() {
        if (!state.query.trim()) return [];
        const results = [];
        gradeKeys.forEach(grade => {
          DATA.grades[grade].lessons.forEach(lesson => {
            const subjectMatch = state.subject === "all" || lesson.subjectKey === state.subject;
            if (subjectMatch && matchesSearch(grade, lesson, state.query)) {
              results.push({ grade, lesson });
            }
          });
        });
        return results;
      }

      function updateProgress() {
        const data = gradeData();
        const count = state.completed[state.grade].size;
        const total = data.lessons.length;
        els.progressLabel.textContent = `Tiến độ KHTN ${state.grade}`;
        els.progressCount.textContent = `${count}/${total} ${data.unitLabel.toLocaleLowerCase("vi-VN")}`;
        els.progressBar.style.width = `${Math.round(count / total * 100)}%`;
      }

      function renderWelcome() {
        state.unit = null;
        updateHash("tong-quan");
        renderSidebar();

        const last = Number(localStorage.getItem(storage.lastUnit(state.grade)) || 1);
        const safeLast = getLesson(state.grade, last) ? last : 1;
        const current = gradeData();

        els.content.innerHTML = `
          <section class="welcome">
            <div class="hero">
              <span class="eyebrow">Bộ học tập hợp nhất • Chạy độc lập</span>
              <h1>Mẹo giải nhanh<br>KHTN lớp 6 đến lớp 9</h1>
              <p>
                Một tệp duy nhất chứa toàn bộ bốn app đã xây dựng. Chọn lớp, môn và bài cần học;
                nội dung gốc của từng khối được giữ riêng để không trộn kiến thức.
              </p>
              <div class="hero-actions">
                <button class="primary-button" type="button" data-continue>
                  Tiếp tục KHTN ${state.grade} • ${current.unitLabel} ${safeLast}
                </button>
                <button class="soft-button" type="button" data-open-grade-card="${state.grade}">
                  Mở danh sách lớp ${state.grade}
                </button>
              </div>
            </div>

            <div class="stats">
              <div class="stat-card"><div class="stat-value">${DATA.totals.grades}</div><div class="stat-label">Khối lớp trong một app</div></div>
              <div class="stat-card"><div class="stat-value">${DATA.totals.units}</div><div class="stat-label">Bài và chủ đề</div></div>
              <div class="stat-card"><div class="stat-value">${DATA.totals.forms}</div><div class="stat-label">Dạng mẹo giải nhanh</div></div>
              <div class="stat-card"><div class="stat-value">${gradeKeys.reduce((sum,g)=>sum+state.completed[g].size,0)}</div><div class="stat-label">Nội dung đã đánh dấu học</div></div>
            </div>

            <div class="grade-grid">
              ${gradeKeys.map(grade => {
                const data = DATA.grades[grade];
                const completed = state.completed[grade].size;
                return `
                  <article class="grade-card" style="--grade-color:${gradeColors[grade]}">
                    <div class="grade-number">${grade}</div>
                    <h2>Khoa học tự nhiên ${grade}</h2>
                    <p>${escapeHTML(data.description)}</p>
                    <button class="soft-button" type="button" data-grade-card="${grade}">Mở KHTN ${grade}</button>
                    <div class="grade-meta">${data.lessons.length} ${data.unitLabel.toLocaleLowerCase("vi-VN")} • ${data.totalForms} dạng • Đã học ${completed}</div>
                  </article>
                `;
              }).join("")}
            </div>
          </section>
        `;

        els.content.querySelector("[data-continue]").addEventListener("click", () => openLesson(state.grade, safeLast));
        els.content.querySelector("[data-open-grade-card]").addEventListener("click", () => {
          openSidebar();
        });
        els.content.querySelectorAll("[data-grade-card]").forEach(button => {
          button.addEventListener("click", () => {
            switchGrade(button.dataset.grade);
            openSidebar();
          });
        });

        document.title = "KHTN 6–9 | Mẹo Giải Nhanh Hợp Nhất";
        els.main.focus({preventScroll:true});
      }

      function answerBlock(kind, label, text, hideable = false) {
        if (!text) return "";
        const hidden = hideable && state.selfTest ? "is-hidden" : "";
        return `
          <div class="answer-block ${kind} ${hidden}">
            <span class="answer-label">${label}</span>
            <div class="answer-text">${escapeHTML(text)}</div>
            ${hideable ? '<button class="reveal-button" type="button">Hiện nội dung</button>' : ""}
          </div>
        `;
      }

      function renderLesson(grade, number) {
        const data = DATA.grades[grade];
        const lesson = getLesson(grade, number);
        if (!lesson) return renderWelcome();

        state.grade = grade;
        state.unit = number;
        localStorage.setItem(storage.currentGrade, grade);
        localStorage.setItem(storage.lastUnit(grade), String(number));
        renderGradeControls();
        renderSidebar();
        updateHash(`lop-${grade}-bai-${number}`);

        const index = data.lessons.findIndex(item => item.number === number);
        const previous = index > 0 ? data.lessons[index - 1] : null;
        const next = index < data.lessons.length - 1 ? data.lessons[index + 1] : null;
        const complete = state.completed[grade].has(number);
        const favorite = state.favorites[grade].has(number);
        const unitLower = data.unitLabel.toLocaleLowerCase("vi-VN");
        const subject = subjectMeta(grade, lesson.subjectKey);

        els.content.innerHTML = `
          <article class="lesson-view">
            <div class="breadcrumb">
              <button type="button" data-home>Tổng quan</button>
              <span>›</span><span>KHTN ${grade}</span>
              <span>›</span><span>${escapeHTML(subject.name)}</span>
              <span>›</span><strong>${data.unitLabel} ${number}</strong>
            </div>

            <header class="lesson-hero ${lesson.subjectKey}">
              <div class="lesson-meta">
                <span class="badge">KHTN ${grade}</span>
                <span class="badge">${escapeHTML(subject.name)}</span>
                <span class="badge neutral">${data.unitLabel} ${number}/${data.lessons.length}</span>
                <span class="badge neutral">${lesson.forms.length} dạng</span>
              </div>
              <h1 class="lesson-heading">${escapeHTML(unitName(grade, lesson, false))}</h1>
              <p class="lesson-summary">${escapeHTML(lesson.summary || lesson.intro?.[0] || "")}</p>
              <div class="lesson-actions">
                <button id="completeButton" class="soft-button" type="button" aria-pressed="${complete}">${complete ? "✓ Đã học" : "Đánh dấu đã học"}</button>
                <button id="favoriteButton" class="soft-button" type="button" aria-pressed="${favorite}">${favorite ? "★ Đã lưu" : `☆ Lưu ${unitLower}`}</button>
                <button id="printButton" class="soft-button" type="button">In nội dung này</button>
              </div>
            </header>

            <div class="study-toolbar">
              <div class="toolbar-group">
                <span class="toolbar-label">Hiển thị</span>
                <button id="toggleAll" class="tool-button" type="button">Mở tất cả</button>
                <button id="selfTest" class="tool-button" type="button" aria-pressed="${state.selfTest}">Tự luyện: ${state.selfTest ? "Bật" : "Tắt"}</button>
              </div>
              <div class="toolbar-group">
                <span class="toolbar-label">Điều hướng</span>
                <button class="tool-button" type="button" data-prev ${previous ? "" : "disabled"}>← Trước</button>
                <button class="tool-button" type="button" data-next ${next ? "" : "disabled"}>Sau →</button>
              </div>
            </div>

            <section class="overview-grid">
              <div class="overview-card">
                <h2 class="section-label">Trọng tâm</h2>
                <p>${escapeHTML(lesson.summary || "")}</p>
              </div>
              <div class="overview-card">
                <h2 class="section-label">Mẹo đầu bài</h2>
                <ol class="quick-list">
                  ${lesson.forms.slice(0,3).map((form,i)=>`<li><span>${i+1}</span><div>${escapeHTML(form.tip || form.title)}</div></li>`).join("")}
                </ol>
              </div>
            </section>

            <section>
              <div class="forms-head">
                <h2>Các dạng và mẹo giải nhanh</h2>
                <p>Nhấn vào từng dạng để xem câu hỏi ví dụ, cách giải và bẫy.</p>
              </div>
              <div class="forms-list">
                ${lesson.forms.map((form,i)=>`
                  <details class="form-card" ${i===0 ? "open" : ""}>
                    <summary>
                      <span class="form-index">${String(i+1).padStart(2,"0")}</span>
                      <span class="form-title">${escapeHTML(form.title)}</span>
                      <span class="chevron">⌄</span>
                    </summary>
                    <div class="form-body">
                      ${answerBlock("tip","Mẹo giải nhanh",form.tip)}
                      ${answerBlock("example","Câu hỏi ví dụ",form.example,true)}
                      ${answerBlock("solution","Cách giải nhanh",form.solution,true)}
                      ${answerBlock("trap","Bẫy thường gặp",form.trap)}
                      ${(form.extra || []).map(item=>answerBlock("example","Ghi chú",item)).join("")}
                    </div>
                  </details>
                `).join("")}
              </div>
            </section>

            <nav class="lesson-pagination">
              ${previous ? `<button class="nav-card" type="button" data-prev><small>← ${data.unitLabel} trước</small><strong>${escapeHTML(unitName(grade,previous,false))}</strong></button>` : "<div></div>"}
              ${next ? `<button class="nav-card next" type="button" data-next><small>${data.unitLabel} sau →</small><strong>${escapeHTML(unitName(grade,next,false))}</strong></button>` : "<div></div>"}
            </nav>
          </article>
        `;

        els.content.querySelector("[data-home]").addEventListener("click", goHome);

        document.getElementById("completeButton").addEventListener("click", () => {
          const set = state.completed[grade];
          if (set.has(number)) {
            set.delete(number);
            showToast(`Đã bỏ đánh dấu ${data.unitLabel.toLocaleLowerCase("vi-VN")} ${number} của lớp ${grade}.`);
          } else {
            set.add(number);
            showToast(`Đã đánh dấu học xong ${data.unitLabel.toLocaleLowerCase("vi-VN")} ${number} của lớp ${grade}.`);
          }
          saveSet(storage.complete(grade), set);
          updateProgress();
          renderLesson(grade, number);
        });

        document.getElementById("favoriteButton").addEventListener("click", () => {
          const set = state.favorites[grade];
          if (set.has(number)) set.delete(number); else set.add(number);
          saveSet(storage.favorite(grade), set);
          renderLesson(grade, number);
        });

        document.getElementById("printButton").addEventListener("click", () => window.print());

        const toggleAll = document.getElementById("toggleAll");
        toggleAll.addEventListener("click", () => {
          state.allOpen = !state.allOpen;
          els.content.querySelectorAll(".form-card").forEach(card => card.open = state.allOpen);
          toggleAll.textContent = state.allOpen ? "Thu gọn tất cả" : "Mở tất cả";
        });

        document.getElementById("selfTest").addEventListener("click", () => {
          state.selfTest = !state.selfTest;
          localStorage.setItem(storage.selfTest, String(state.selfTest));
          renderLesson(grade, number);
          showToast(state.selfTest ? "Đã bật chế độ tự luyện." : "Đã tắt chế độ tự luyện.");
        });

        els.content.querySelectorAll(".reveal-button").forEach(button => {
          button.addEventListener("click", event => {
            event.currentTarget.closest(".answer-block").classList.remove("is-hidden");
            event.currentTarget.remove();
          });
        });

        els.content.querySelectorAll("[data-prev]").forEach(button => {
          button.addEventListener("click", () => previous && openLesson(grade, previous.number));
        });
        els.content.querySelectorAll("[data-next]").forEach(button => {
          button.addEventListener("click", () => next && openLesson(grade, next.number));
        });

        document.title = `${data.unitLabel} ${number} | KHTN ${grade} | Mẹo Giải Nhanh`;
        els.main.focus({preventScroll:true});
        window.scrollTo({top:0, behavior:"smooth"});
      }

      function renderSearchResults() {
        const results = state.searchScope === "all"
          ? globalSearch()
          : filteredCurrentLessons().map(lesson => ({grade: state.grade, lesson}));

        const query = state.query.trim();
        els.content.innerHTML = `
          <section class="search-results">
            <div class="search-results-head">
              <h1>Kết quả tìm kiếm</h1>
              <p>${results.length} kết quả cho “${escapeHTML(query)}” trong ${state.searchScope === "all" ? "toàn bộ lớp 6–9" : `KHTN ${state.grade}`}.</p>
            </div>
            ${results.length ? `
              <div class="search-result-grid">
                ${results.slice(0,100).map(({grade,lesson})=>`
                  <button class="search-card" type="button" data-result-grade="${grade}" data-result-unit="${lesson.number}">
                    <span class="search-grade" style="background:${gradeColors[grade]}">${grade}</span>
                    <span>
                      <h3>${escapeHTML(unitName(grade,lesson,true))}</h3>
                      <p>${escapeHTML(lesson.summary || "")}</p>
                    </span>
                    <span class="search-subject">${escapeHTML(lesson.subject || subjectMeta(grade,lesson.subjectKey).name)}</span>
                  </button>
                `).join("")}
              </div>
            ` : `<div class="empty">Không tìm thấy nội dung phù hợp. Hãy thử từ khóa ngắn hơn.</div>`}
          </section>
        `;

        els.content.querySelectorAll("[data-result-grade]").forEach(button => {
          button.addEventListener("click", () => {
            openLesson(button.dataset.resultGrade, Number(button.dataset.resultUnit));
          });
        });

        document.title = `Tìm “${query}” | KHTN 6–9`;
      }

      function openLesson(grade, number) {
        if (!getLesson(grade, number)) return;
        state.grade = grade;
        state.subject = "all";
        localStorage.setItem(storage.currentGrade, grade);
        renderLesson(grade, number);
        closeSidebar();
      }

      function updateHash(value) {
        const desired = `#${value}`;
        if (location.hash !== desired) history.replaceState(null, "", desired);
      }

      function handleHash() {
        const match = location.hash.match(/^#lop-(6|7|8|9)-bai-(\d+)$/);
        if (match && getLesson(match[1], Number(match[2]))) {
          openLesson(match[1], Number(match[2]));
        } else {
          renderWelcome();
        }
      }

      function goHome() {
        state.query = "";
        state.subject = "all";
        state.unit = null;
        els.search.value = "";
        renderGradeControls();
        renderWelcome();
      }

      function showToast(message) {
        els.toast.textContent = message;
        els.toast.classList.add("visible");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => els.toast.classList.remove("visible"), 2200);
      }

      function applyTheme(theme) {
        const value = theme === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = value;
        localStorage.setItem(storage.theme, value);
        document.querySelector('meta[name="theme-color"]').content = value === "dark" ? "#0d1621" : "#123a63";
      }

      function cycleFont() {
        const values = [0.94, 1, 1.08, 1.16];
        const current = Number(localStorage.getItem(storage.font) || 1);
        const index = values.findIndex(value => Math.abs(value - current) < .01);
        const next = values[(index + 1) % values.length];
        document.documentElement.style.setProperty("--font-scale", next);
        localStorage.setItem(storage.font, String(next));
        showToast(`Cỡ chữ: ${Math.round(next*100)}%.`);
      }

      function openSidebar() {
        if (window.innerWidth > 840) {
          els.nav.scrollTo({ top: 0, behavior: "smooth" });
          showToast("Danh sách lớp, môn và bài nằm ở cột bên trái.");
          return;
        }

        els.sidebar.classList.add("open");
        els.backdrop.classList.add("visible");
        els.menu.setAttribute("aria-expanded","true");
        document.body.style.overflow = "hidden";
      }

      function closeSidebar() {
        els.sidebar.classList.remove("open");
        els.backdrop.classList.remove("visible");
        els.menu.setAttribute("aria-expanded","false");
        document.body.style.overflow = "";
      }

      els.search.addEventListener("input", event => {
        state.query = event.target.value;
        renderSidebar();
        if (state.query.trim()) renderSearchResults();
        else if (state.unit) renderLesson(state.grade, state.unit);
        else renderWelcome();
      });

      function changeSearchScope(value) {
        state.searchScope = value === "all" ? "all" : "current";
        state.subject = "all";
        els.scope.value = state.searchScope;
        els.mobileScope.value = state.searchScope;
        renderGradeControls();
        renderSidebar();
        if (state.query.trim()) renderSearchResults();
      }

      els.scope.addEventListener("change", event => changeSearchScope(event.target.value));
      els.mobileScope.addEventListener("change", event => changeSearchScope(event.target.value));

      els.home.addEventListener("click", goHome);
      els.font.addEventListener("click", cycleFont);
      els.theme.addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
      els.menu.addEventListener("click", () => els.sidebar.classList.contains("open") ? closeSidebar() : openSidebar());
      els.backdrop.addEventListener("click", closeSidebar);

      document.addEventListener("keydown", event => {
        const tag = document.activeElement?.tagName?.toLowerCase();
        const typing = tag === "input" || tag === "textarea" || tag === "select";

        if (event.key === "/" && !typing) {
          event.preventDefault();
          els.search.focus();
        }

        if (event.key === "Escape") {
          if (els.sidebar.classList.contains("open")) closeSidebar();
          if (els.search.value) {
            els.search.value = "";
            state.query = "";
            renderSidebar();
            state.unit ? renderLesson(state.grade,state.unit) : renderWelcome();
          }
        }

        if (!typing && state.unit && document.querySelector(".lesson-view")) {
          const data = gradeData();
          const index = data.lessons.findIndex(item => item.number === state.unit);
          if (event.key === "ArrowLeft" && index > 0) openLesson(state.grade,data.lessons[index-1].number);
          if (event.key === "ArrowRight" && index < data.lessons.length-1) openLesson(state.grade,data.lessons[index+1].number);
        }
      });

      window.addEventListener("hashchange", handleHash);
      window.addEventListener("resize", () => { if (window.innerWidth > 840) closeSidebar(); });

      const preferredTheme = localStorage.getItem(storage.theme)
        || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      applyTheme(preferredTheme);

      const scale = Number(localStorage.getItem(storage.font) || 1);
      document.documentElement.style.setProperty("--font-scale", scale);

      renderGradeControls();
      handleHash();
    })();
  </script>
</body>
</html>
