<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Ứng dụng hợp nhất mẹo giải nhanh Khoa học tự nhiên lớp 6, 7, 8 và 9.">
  <meta name="theme-color" content="#123a63">
  <title>KHTN 6–9 | Mẹo Giải Nhanh Hợp Nhất</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3f7;
      --surface: #ffffff;
      --surface-2: #f6f9fc;
      --surface-3: #eaf0f6;
      --text: #182235;
      --muted: #627184;
      --line: #d6e0ea;
      --line-strong: #b9c8d8;
      --primary: #123a63;
      --primary-2: #1e628f;
      --primary-soft: #e6f1f8;
      --focus: #f5a623;
      --success: #187548;
      --danger: #a33d35;
      --general: #626d7a;
      --general-soft: #edf1f4;
      --chemistry: #b45f06;
      --chemistry-soft: #fff0df;
      --physics: #1769aa;
      --physics-soft: #e5f1fb;
      --biology: #2c7a3f;
      --biology-soft: #e7f5e9;
      --earth: #7254a3;
      --earth-soft: #eee8f8;
      --tip: #1769aa;
      --example: #7048a8;
      --solution: #24734b;
      --trap: #b0443b;
      --shadow-sm: 0 2px 9px rgba(24, 43, 66, .08);
      --shadow-md: 0 15px 38px rgba(20, 42, 68, .14);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --sidebar-width: 340px;
      --header-height: 76px;
      --font-scale: 1;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d1621;
      --surface: #152130;
      --surface-2: #1b2939;
      --surface-3: #233246;
      --text: #edf4fb;
      --muted: #adb9c7;
      --line: #314258;
      --line-strong: #455970;
      --primary: #8bc7f0;
      --primary-2: #70b9e8;
      --primary-soft: #18344a;
      --focus: #ffd166;
      --success: #68d39b;
      --danger: #ff9d96;
      --general: #c4cbd5;
      --general-soft: #303846;
      --chemistry: #ffb868;
      --chemistry-soft: #4a321d;
      --physics: #77bced;
      --physics-soft: #18364d;
      --biology: #7bd88f;
      --biology-soft: #1e4128;
      --earth: #c3a4f0;
      --earth-soft: #35274d;
      --tip: #79c3f3;
      --example: #c4a4ef;
      --solution: #86d5a5;
      --trap: #ff9d96;
      --shadow-sm: 0 2px 9px rgba(0,0,0,.2);
      --shadow-md: 0 18px 44px rgba(0,0,0,.3);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      font-size: calc(16px * var(--font-scale));
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(23,105,170,.11), transparent 32rem),
        radial-gradient(circle at 100% 22%, rgba(44,122,63,.09), transparent 30rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.58;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }
    button { color: inherit; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0,0,0,0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      min-height: var(--header-height);
      display: grid;
      grid-template-columns: minmax(260px, var(--sidebar-width)) minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 91%, transparent);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 49px;
      height: 49px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: #fff;
      font-weight: 900;
      letter-spacing: -.05em;
      background: conic-gradient(from 30deg, #1769aa, #2c7a3f, #b45f06, #7254a3, #1769aa);
      box-shadow: var(--shadow-sm);
    }

    .brand-copy { min-width: 0; }
    .brand-title { margin: 0; font-size: 1.02rem; line-height: 1.15; font-weight: 850; letter-spacing: -.02em; }
    .brand-subtitle { margin: 4px 0 0; color: var(--muted); font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .search-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 136px;
      gap: 8px;
      width: min(820px, 100%);
      justify-self: center;
    }

    .search-wrap { position: relative; }
    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      width: 20px;
      height: 20px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .search-input, .scope-select {
      width: 100%;
      min-height: 47px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-2);
      color: var(--text);
    }

    .search-input { padding: 10px 14px 10px 44px; }
    .scope-select { padding: 8px 10px; font-size: .8rem; font-weight: 750; }

    .search-input:hover, .search-input:focus,
    .scope-select:hover, .scope-select:focus {
      border-color: var(--primary-2);
      background: var(--surface);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary-2) 12%, transparent);
      outline: none;
    }

    .header-actions { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }

    .icon-button, .soft-button, .primary-button, .filter-button, .grade-button, .tool-button {
      border: 1px solid var(--line);
      background: var(--surface);
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
    }

    .icon-button:hover, .soft-button:hover, .filter-button:hover, .grade-button:hover, .tool-button:hover {
      border-color: var(--line-strong);
      background: var(--surface-2);
    }

    .icon-button:active, .soft-button:active, .primary-button:active, .filter-button:active, .grade-button:active, .tool-button:active {
      transform: translateY(1px);
    }

    .icon-button {
      width: 44px;
      height: 44px;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 13px;
    }

    .icon-button svg { width: 21px; height: 21px; }

    .soft-button, .primary-button {
      min-height: 43px;
      padding: 8px 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 12px;
      font-weight: 760;
    }

    .primary-button {
      color: var(--surface);
      border-color: transparent;
      background: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    html[data-theme="dark"] .primary-button { color: #0d1621; }
    .primary-button:hover { background: var(--primary-2); }

    .mobile-menu { display: none; }

    .app-layout {
      min-height: calc(100vh - var(--header-height));
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: var(--header-height);
      align-self: start;
      height: calc(100vh - var(--header-height));
      overflow: hidden;
      border-right: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 95%, transparent);
    }

    .sidebar-inner {
      height: 100%;
      display: grid;
      grid-template-rows: auto auto auto auto minmax(0, 1fr) auto;
    }

    .grade-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      padding: 13px 12px 10px;
      border-bottom: 1px solid var(--line);
    }

    .grade-button {
      min-height: 44px;
      border-radius: 12px;
      color: var(--muted);
      font-weight: 880;
    }

    .grade-button[aria-pressed="true"] {
      color: var(--text);
      border-color: var(--primary-2);
      background: var(--primary-soft);
      box-shadow: var(--shadow-sm);
    }

    .progress-panel {
      padding: 12px 15px;
      border-bottom: 1px solid var(--line);
    }

    .progress-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .progress-label { font-size: .8rem; font-weight: 850; }
    .progress-count { color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums; }
    .progress-track { height: 8px; overflow: hidden; border-radius: 999px; background: var(--surface-3); }
    .progress-bar { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--chemistry), var(--physics), var(--biology), var(--earth)); transition: width .25s ease; }

    .mobile-search-scope {
      display: none;
      padding: 9px 11px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .mobile-search-scope label {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: .74rem;
      font-weight: 820;
    }

    .mobile-scope-select {
      width: 100%;
      min-height: 38px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      background: var(--surface-2);
      font-size: .77rem;
      font-weight: 720;
    }

    .subject-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 11px;
      border-bottom: 1px solid var(--line);
    }

    .filter-button {
      min-height: 34px;
      padding: 5px 9px;
      border-radius: 9px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 820;
    }

    .filter-button[aria-pressed="true"] {
      color: var(--text);
      border-color: var(--line-strong);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .lesson-nav {
      overflow-y: auto;
      padding: 9px 10px 25px;
      scrollbar-width: thin;
      scrollbar-color: var(--line-strong) transparent;
    }

    .nav-section + .nav-section { margin-top: 14px; }

    .nav-heading {
      position: sticky;
      top: -9px;
      z-index: 3;
      margin: 0 0 6px;
      padding: 8px 7px 6px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      backdrop-filter: blur(10px);
      font-size: .74rem;
      font-weight: 880;
      text-transform: uppercase;
      letter-spacing: .055em;
    }

    .nav-list { display: grid; gap: 4px; }

    .lesson-link {
      width: 100%;
      min-height: 50px;
      display: grid;
      grid-template-columns: 39px minmax(0, 1fr) 18px;
      align-items: center;
      gap: 9px;
      padding: 7px 8px;
      border: 1px solid transparent;
      border-radius: 13px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .lesson-link:hover { background: var(--surface-2); border-color: var(--line); }
    .lesson-link[aria-current="page"] { background: var(--surface); border-color: var(--line-strong); box-shadow: var(--shadow-sm); }

    .lesson-number {
      width: 37px;
      height: 37px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: var(--muted);
      background: var(--surface-3);
      font-size: .78rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .lesson-title {
      min-width: 0;
      font-size: .79rem;
      font-weight: 730;
      line-height: 1.32;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .lesson-status {
      width: 16px;
      height: 16px;
      display: grid;
      place-items: center;
      border: 1.5px solid var(--line-strong);
      border-radius: 50%;
      color: transparent;
      font-size: .62rem;
      font-weight: 900;
    }

    .lesson-link.is-complete .lesson-status {
      color: #fff;
      border-color: var(--success);
      background: var(--success);
    }

    .lesson-link[data-subject="general"][aria-current="page"] .lesson-number { color: var(--general); background: var(--general-soft); }
    .lesson-link[data-subject="chemistry"][aria-current="page"] .lesson-number { color: var(--chemistry); background: var(--chemistry-soft); }
    .lesson-link[data-subject="physics"][aria-current="page"] .lesson-number { color: var(--physics); background: var(--physics-soft); }
    .lesson-link[data-subject="biology"][aria-current="page"] .lesson-number { color: var(--biology); background: var(--biology-soft); }
    .lesson-link[data-subject="earth"][aria-current="page"] .lesson-number { color: var(--earth); background: var(--earth-soft); }

    .sidebar-note {
      padding: 10px 14px 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      background: var(--surface);
      font-size: .71rem;
      line-height: 1.42;
    }

    .content-area {
      min-width: 0;
      padding: 28px clamp(18px, 3.5vw, 52px) 72px;
    }

    .content-inner { width: min(100%, 1100px); margin-inline: auto; }

    .welcome, .lesson-view, .search-results { animation: fade-in .2s ease both; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

    .welcome { display: grid; gap: 20px; }

    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(25px, 4vw, 48px);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-md);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      right: -160px;
      top: -210px;
      border-radius: 50%;
      background: conic-gradient(from 80deg, var(--physics), var(--biology), var(--chemistry), var(--earth), var(--physics));
      opacity: .075;
    }

    .eyebrow {
      position: relative;
      z-index: 1;
      display: inline-flex;
      margin-bottom: 11px;
      color: var(--primary-2);
      font-size: .78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .hero h1 {
      position: relative;
      z-index: 1;
      max-width: 850px;
      margin: 0;
      font-size: clamp(2.15rem, 5.6vw, 4.6rem);
      line-height: 1.02;
      letter-spacing: -.052em;
    }

    .hero p {
      position: relative;
      z-index: 1;
      max-width: 830px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 1.01rem;
    }

    .hero-actions { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 9px; margin-top: 24px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .stat-card, .grade-card, .overview-card, .search-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .stat-card { padding: 18px; }
    .stat-value { font-size: 1.7rem; font-weight: 920; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
    .stat-label { color: var(--muted); font-size: .79rem; font-weight: 720; }

    .grade-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .grade-card {
      position: relative;
      overflow: hidden;
      min-height: 200px;
      padding: 22px;
    }

    .grade-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 5px;
      background: var(--grade-color, var(--primary));
    }

    .grade-number {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: #fff;
      background: var(--grade-color, var(--primary));
      font-size: 1.2rem;
      font-weight: 930;
    }

    .grade-card h2 { margin: 14px 0 5px; font-size: 1.15rem; }
    .grade-card p { margin: 0 0 17px; color: var(--muted); font-size: .83rem; }
    .grade-meta { margin-top: 13px; color: var(--muted); font-size: .74rem; font-weight: 760; }

    .breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; color: var(--muted); font-size: .77rem; font-weight: 730; }
    .breadcrumb button { padding: 0; border: 0; background: transparent; color: var(--primary-2); font-weight: 850; cursor: pointer; }

    .lesson-view { display: grid; gap: 18px; }

    .lesson-hero {
      position: relative;
      overflow: hidden;
      padding: clamp(23px, 3.3vw, 36px);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-md);
      color: var(--primary);
    }

    .lesson-hero::after {
      content: "";
      position: absolute;
      right: -55px;
      bottom: -95px;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: currentColor;
      opacity: .055;
    }

    .lesson-hero.general { color: var(--general); }
    .lesson-hero.chemistry { color: var(--chemistry); }
    .lesson-hero.physics { color: var(--physics); }
    .lesson-hero.biology { color: var(--biology); }
    .lesson-hero.earth { color: var(--earth); }

    .lesson-meta { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 11px; }
    .badge {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border: 1px solid color-mix(in srgb, currentColor 28%, transparent);
      border-radius: 999px;
      color: currentColor;
      background: color-mix(in srgb, currentColor 12%, transparent);
      font-size: .73rem;
      font-weight: 850;
    }
    .badge.neutral { color: var(--muted); border-color: var(--line); background: var(--surface-2); }

    .lesson-heading {
      position: relative;
      z-index: 1;
      max-width: 930px;
      margin: 0;
      color: var(--text);
      font-size: clamp(1.7rem, 4vw, 3.2rem);
      line-height: 1.09;
      letter-spacing: -.038em;
    }

    .lesson-summary {
      position: relative;
      z-index: 1;
      max-width: 890px;
      margin: 15px 0 0;
      color: var(--muted);
      font-size: .97rem;
    }

    .lesson-actions { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 21px; }
    .lesson-actions .soft-button[aria-pressed="true"] { color: var(--success); border-color: color-mix(in srgb, var(--success) 48%, var(--line)); background: color-mix(in srgb, var(--success) 11%, var(--surface)); }

    .study-toolbar {
      position: sticky;
      top: calc(var(--header-height) + 8px);
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: color-mix(in srgb, var(--surface) 91%, transparent);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-sm);
    }

    .toolbar-group { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .toolbar-label { color: var(--muted); font-size: .74rem; font-weight: 850; }
    .tool-button { min-height: 36px; padding: 6px 10px; border-radius: 10px; font-size: .76rem; font-weight: 760; }
    .tool-button[aria-pressed="true"] { color: var(--primary-2); border-color: var(--primary-2); background: var(--primary-soft); }

    .overview-grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 14px; }
    .overview-card { padding: 20px; }
    .section-label { margin: 0 0 9px; color: var(--muted); font-size: .74rem; font-weight: 900; text-transform: uppercase; letter-spacing: .075em; }
    .overview-card p { margin: 0; }

    .quick-list { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .quick-list li { display: grid; grid-template-columns: 23px minmax(0,1fr); gap: 9px; color: var(--muted); font-size: .86rem; }
    .quick-list span { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 7px; color: var(--primary-2); background: var(--primary-soft); font-size: .68rem; font-weight: 900; }

    .forms-head { margin-top: 2px; }
    .forms-head h2 { margin: 0; font-size: 1.42rem; letter-spacing: -.025em; }
    .forms-head p { margin: 3px 0 0; color: var(--muted); font-size: .82rem; }

    .forms-list { display: grid; gap: 11px; }

    .form-card {
      overflow: clip;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .form-card[open] { border-color: var(--line-strong); box-shadow: var(--shadow-md); }
    .form-card summary {
      min-height: 65px;
      display: grid;
      grid-template-columns: 38px minmax(0,1fr) 28px;
      align-items: center;
      gap: 11px;
      padding: 11px 15px;
      list-style: none;
      cursor: pointer;
    }
    .form-card summary::-webkit-details-marker { display: none; }

    .form-index { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; color: var(--primary-2); background: var(--primary-soft); font-size: .79rem; font-weight: 900; }
    .form-title { font-size: .95rem; font-weight: 830; line-height: 1.38; }
    .chevron { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); background: var(--surface-2); transition: transform .17s ease; }
    .form-card[open] .chevron { transform: rotate(180deg); }

    .form-body { display: grid; gap: 10px; padding: 0 15px 15px 64px; border-top: 1px solid var(--line); }

    .answer-block {
      margin-top: 10px;
      padding: 13px 14px 13px 15px;
      border: 1px solid var(--line);
      border-left: 4px solid currentColor;
      border-radius: 12px;
      background: var(--surface-2);
    }

    .answer-block.tip { color: var(--tip); }
    .answer-block.example { color: var(--example); }
    .answer-block.solution { color: var(--solution); }
    .answer-block.trap { color: var(--trap); }
    .answer-label { display: block; margin-bottom: 4px; color: currentColor; font-size: .72rem; font-weight: 900; text-transform: uppercase; letter-spacing: .055em; }
    .answer-text { color: var(--text); white-space: pre-line; font-size: .91rem; line-height: 1.62; overflow-wrap: anywhere; }
    .answer-block.is-hidden .answer-text { filter: blur(7px); user-select: none; }
    .reveal-button { display: none; margin-top: 9px; min-height: 33px; padding: 5px 10px; border: 1px solid currentColor; border-radius: 9px; background: transparent; color: currentColor; font-size: .73rem; font-weight: 820; cursor: pointer; }
    .answer-block.is-hidden .reveal-button { display: inline-flex; }

    .lesson-pagination { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
    .nav-card {
      min-height: 82px;
      display: grid;
      align-content: center;
      gap: 2px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      text-align: left;
      cursor: pointer;
    }
    .nav-card.next { text-align: right; }
    .nav-card:hover { border-color: var(--primary-2); box-shadow: var(--shadow-sm); }
    .nav-card small { color: var(--muted); font-size: .7rem; font-weight: 850; text-transform: uppercase; letter-spacing: .055em; }
    .nav-card strong { font-size: .83rem; line-height: 1.35; }

    .search-results { display: grid; gap: 16px; }
    .search-results-head { padding: 22px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); }
    .search-results-head h1 { margin: 0; font-size: 1.65rem; }
    .search-results-head p { margin: 7px 0 0; color: var(--muted); }
    .search-result-grid { display: grid; gap: 9px; }
    .search-card { width: 100%; display: grid; grid-template-columns: 56px minmax(0,1fr) auto; align-items: center; gap: 13px; padding: 13px; text-align: left; cursor: pointer; }
    .search-card:hover { border-color: var(--primary-2); box-shadow: var(--shadow-md); }
    .search-grade { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 15px; color: #fff; background: var(--primary); font-weight: 920; }
    .search-card h3 { margin: 0; font-size: .94rem; line-height: 1.35; }
    .search-card p { margin: 4px 0 0; color: var(--muted); font-size: .78rem; line-height: 1.42; }
    .search-subject { color: var(--muted); font-size: .72rem; font-weight: 820; }

    .empty { padding: 30px 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: var(--radius-md); background: var(--surface); }

    .toast {
      position: fixed;
      z-index: 100;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      max-width: min(92vw, 480px);
      padding: 11px 15px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: var(--text);
      color: var(--surface);
      box-shadow: var(--shadow-md);
      font-size: .8rem;
      font-weight: 760;
      transform: translate(-50%, 120px);
      opacity: 0;
      pointer-events: none;
      transition: transform .22s ease, opacity .22s ease;
    }
    .toast.visible { transform: translate(-50%,0); opacity: 1; }

    .backdrop { position: fixed; z-index: 60; inset: 0; display: none; background: rgba(6,15,26,.52); backdrop-filter: blur(3px); }
    .backdrop.visible { display: block; }

    @media (max-width: 1120px) {
      :root { --sidebar-width: 292px; }
      .app-header { grid-template-columns: auto minmax(0,1fr) auto; }
      .brand-copy { display: none; }
      .grade-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .overview-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 840px) {
      :root { --header-height: 68px; }
      .app-header { grid-template-columns: auto minmax(0,1fr) auto; gap: 8px; padding: 9px 11px; }
      .brand { display: none; }
      .mobile-menu { display: grid; }
      .search-panel { grid-template-columns: minmax(0,1fr) 112px; }
      .search-input, .scope-select { min-height: 44px; }
      .header-actions .desktop-only { display: none; }
      .app-layout { display: block; }

      .sidebar {
        position: fixed;
        z-index: 70;
        top: 0;
        left: 0;
        width: min(90vw, 370px);
        height: 100dvh;
        border-right: 1px solid var(--line-strong);
        box-shadow: var(--shadow-md);
        transform: translateX(-105%);
        transition: transform .22s ease;
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-inner { padding-top: max(7px, env(safe-area-inset-top)); }
      .content-area { padding: 20px 14px 64px; }
      .study-toolbar { top: calc(var(--header-height) + 6px); }
      .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }

    @media (max-width: 570px) {
      .search-panel { grid-template-columns: 1fr; }
      .scope-select { display: none; }
      .mobile-search-scope { display: block; }
      .grade-grid { grid-template-columns: 1fr; }
      .hero h1 { font-size: 2.25rem; }
      .lesson-heading { font-size: 1.7rem; }
      .lesson-actions { display: grid; grid-template-columns: 1fr 1fr; }
      .lesson-actions button { width: 100%; }
      .study-toolbar { align-items: stretch; }
      .toolbar-group { width: 100%; justify-content: space-between; }
      .form-card summary { grid-template-columns: 34px minmax(0,1fr) 24px; padding: 10px 11px; }
      .form-index { width: 33px; height: 33px; }
      .form-body { padding: 0 11px 12px; }
      .lesson-pagination { grid-template-columns: 1fr; }
      .nav-card.next { text-align: left; }
      .search-card { grid-template-columns: 48px minmax(0,1fr); }
      .search-grade { width: 46px; height: 46px; }
      .search-subject { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }

    @media print {
      :root { --bg:#fff; --surface:#fff; --surface-2:#fff; --text:#000; --muted:#333; --line:#bbb; }
      body { background:#fff; }
      .app-header, .sidebar, .study-toolbar, .lesson-actions, .lesson-pagination, .breadcrumb, .toast { display:none !important; }
      .app-layout { display:block; }
      .content-area { padding:0; }
      .lesson-hero, .overview-card, .form-card { box-shadow:none; break-inside:avoid; }
      .form-card { margin:10px 0; }
      .form-card > .form-body { display:grid !important; }
      .chevron { display:none; }
      .answer-block.is-hidden .answer-text { filter:none; }
      .reveal-button { display:none !important; }
    }
  </style>
</head>

  <script id="appData" type="application/json">{"grades":{"6":{"grade":6,"unitLabel":"Bài","shortName":"KHTN 6","description":"Kĩ năng – Hóa học – Sinh học – Vật lý – Trái Đất và bầu trời","subjects":[{"key":"general","name":"Kĩ năng và đo lường","short":"Chung","range":"Bài 1–8","count":8},{"key":"chemistry","name":"Hóa học","short":"Hóa","range":"Bài 9–17","count":9},{"key":"biology","name":"Sinh học","short":"Sinh","range":"Bài 18–39","count":22},{"key":"physics","name":"Vật lý","short":"Lý","range":"Bài 40–51","count":12},{"key":"earth","name":"Trái Đất và bầu trời","short":"Vũ trụ","range":"Bài 52–55","count":4}],"lessons":[{"number":1,"title":"Giới thiệu về Khoa học tự nhiên","subject":"Kĩ năng và đo lường","subjectKey":"general","shortSubject":"Chung","slug":"bai-1","summary":"Phân biệt các lĩnh vực Khoa học tự nhiên và quy trình quan sát – đo – phân tích – kết luận.","intro":["Phân biệt các lĩnh vực Khoa học tự nhiên và quy trình quan sát – đo – phân tích – kết luận."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Phân biệt các lĩnh vực Khoa học tự nhiên và quy trình quan sát – đo – phân tích – kết luận.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Khoa học tự nhiên nghiên cứu đối tượng nào sau đây?\nA. Các tác phẩm văn học và nghệ thuật\nB. Hoạt động mua bán trên thị trường\nC. Các sự vật, hiện tượng và quy luật của thế giới tự nhiên\nD. Các sự kiện lịch sử của xã hội loài người","solution":"Đáp án theo ngân hàng: C. Các sự vật, hiện tượng và quy luật của thế giới tự nhiên. Phương án C phù hợp với kiến thức trọng tâm của bài: Phân biệt các lĩnh vực Khoa học tự nhiên và quy trình quan sát – đo – phân tích – kết luận.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không lấy cảm tính hoặc kết quả mong muốn thay cho số liệu thực nghiệm.","extra":[]},{"title":"Dạng 2. Nhận diện kĩ năng quan sát và đo","tip":"Khi đề mô tả theo dõi hiện tượng rồi ghi kích thước theo thời gian, chọn đồng thời kĩ năng quan sát và đo.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Một nhóm học sinh theo dõi sự nảy mầm của hạt đậu trong 7 ngày và ghi chiều dài mầm mỗi ngày. Nhóm đã sử dụng chủ yếu những kĩ năng nào?\nA. Quan sát và đo\nB. Mô phỏng và kể chuyện\nC. Tranh luận và ghi nhớ\nD. Phân loại và dự đoán","solution":"Đáp án theo ngân hàng: A. Quan sát và đo. Phương án A phù hợp với kiến thức trọng tâm của bài: Phân biệt các lĩnh vực Khoa học tự nhiên và quy trình quan sát – đo – phân tích – kết luận.","trap":"Không thấy số liệu rồi mặc định đây là bài tính; câu hỏi đang yêu cầu xác định kĩ năng nghiên cứu.","extra":[]},{"title":"Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất","tip":"Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Phân biệt các lĩnh vực Khoa học tự nhiên và quy trình quan sát – đo – phân tích – kết luận.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Một nhà khoa học nghiên cứu thành phần của nước biển. Nghiên cứu này thuộc lĩnh vực nào?\nA. Thiên văn học\nB. Vật lí thiên văn\nC. Hóa học\nD. Sinh học","solution":"Đáp án theo ngân hàng: C. Hóa học. Phương án C phù hợp với kiến thức trọng tâm của bài: Phân biệt các lĩnh vực Khoa học tự nhiên và quy trình quan sát – đo – phân tích – kết luận.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không lấy cảm tính hoặc kết quả mong muốn thay cho số liệu thực nghiệm.","extra":[]}],"searchText":"Giới thiệu về Khoa học tự nhiên Phân biệt các lĩnh vực Khoa học tự nhiên và quy trình quan sát – đo – phân tích – kết luận. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Phân biệt các lĩnh vực Khoa học tự nhiên và quy trình quan sát – đo – phân tích – kết luận. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Khoa học tự nhiên nghiên cứu đối tượng nào sau đây?\nA. Các tác phẩm văn học và nghệ thuật\nB. Hoạt động mua bán trên thị trường\nC. Các sự vật, hiện tượng và quy luật của thế giới tự nhiên\nD. Các sự kiện lịch sử của xã hội loài người Đáp án theo ngân hàng: C. Các sự vật, hiện tượng và quy luật của thế giới tự nhiên. Phương án C phù hợp với kiến thức trọng tâm của bài: Phân biệt các lĩnh vực Khoa học tự nhiên và quy trình quan sát – đo – phân tích – kết luận. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không lấy cảm tính hoặc kết quả mong muốn thay cho số liệu thực nghiệm. Dạng 2. Nhận diện kĩ năng quan sát và đo Khi đề mô tả theo dõi hiện tượng rồi ghi kích thước theo thời gian, chọn đồng thời kĩ năng quan sát và đo. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Một nhóm học sinh theo dõi sự nảy mầm của hạt đậu trong 7 ngày và ghi chiều dài mầm mỗi ngày. Nhóm đã sử dụng chủ yếu những kĩ năng nào?\nA. Quan sát và đo\nB. Mô phỏng và kể chuyện\nC. Tranh luận và ghi nhớ\nD. Phân loại và dự đoán Đáp án theo ngân hàng: A. Quan sát và đo. Phương án A phù hợp với kiến thức trọng tâm của bài: Phân biệt các lĩnh vực Khoa học tự nhiên và quy trình quan sát – đo – phân tích – kết luận. Không thấy số liệu rồi mặc định đây là bài tính; câu hỏi đang yêu cầu xác định kĩ năng nghiên cứu. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Phân biệt các lĩnh vực Khoa học tự nhiên và quy trình quan sát – đo – phân tích – kết luận. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Một nhà khoa học nghiên cứu thành phần của nước biển. Nghiên cứu này thuộc lĩnh vực nào?\nA. Thiên văn học\nB. Vật lí thiên văn\nC. Hóa học\nD. Sinh học Đáp án theo ngân hàng: C. Hóa học. Phương án C phù hợp với kiến thức trọng tâm của bài: Phân biệt các lĩnh vực Khoa học tự nhiên và quy trình quan sát – đo – phân tích – kết luận. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không lấy cảm tính hoặc kết quả mong muốn thay cho số liệu thực nghiệm."},{"number":2,"title":"An toàn trong phòng thực hành","subject":"Kĩ năng và đo lường","subjectKey":"general","shortSubject":"Chung","slug":"bai-2","summary":"Nhận diện nguy cơ, dùng đúng đồ bảo hộ và xử lí sự cố theo hướng dẫn của giáo viên.","intro":["Nhận diện nguy cơ, dùng đúng đồ bảo hộ và xử lí sự cố theo hướng dẫn của giáo viên."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Nhận diện nguy cơ, dùng đúng đồ bảo hộ và xử lí sự cố theo hướng dẫn của giáo viên.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Việc đầu tiên cần làm trước khi tiến hành thí nghiệm là gì?\nA. Bật tất cả thiết bị điện\nB. Tự ý lấy mọi hóa chất cần dùng\nC. Nếm thử mẫu vật\nD. Đọc kĩ hướng dẫn và nhận biết các nguy cơ","solution":"Đáp án theo ngân hàng: D. Đọc kĩ hướng dẫn và nhận biết các nguy cơ. Phương án D phù hợp với kiến thức trọng tâm của bài: Nhận diện nguy cơ, dùng đúng đồ bảo hộ và xử lí sự cố theo hướng dẫn của giáo viên.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không tự ý nếm, ngửi sát, chạm tay hoặc xử lí hóa chất và mảnh kính bằng tay trần.","extra":[]},{"title":"Dạng 2. Giải thích hiện tượng và tình huống","tip":"Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Nhận diện nguy cơ, dùng đúng đồ bảo hộ và xử lí sự cố theo hướng dẫn của giáo viên.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Một bạn làm vỡ cốc thủy tinh. Cách xử lí an toàn nhất là gì?\nA. Đá mảnh vỡ xuống gầm bàn\nB. Báo giáo viên, dùng chổi và hót rác chuyên dụng để thu gom\nC. Dùng khăn giấy mỏng bóp chặt mảnh vỡ\nD. Dùng tay nhặt từng mảnh","solution":"Đáp án theo ngân hàng: B. Báo giáo viên, dùng chổi và hót rác chuyên dụng để thu gom. Phương án B phù hợp với kiến thức trọng tâm của bài: Nhận diện nguy cơ, dùng đúng đồ bảo hộ và xử lí sự cố theo hướng dẫn của giáo viên." hóa chất và mảnh kính bằng tay trần. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Nhận diện nguy cơ, dùng đúng đồ bảo hộ và xử lí sự cố theo hướng dẫn của giáo viên. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Một bạn làm vỡ cốc thủy tinh. Cách xử lí an toàn nhất là gì?\nA. Đá mảnh vỡ xuống gầm bàn\nB. Báo giáo viên, dùng chổi và hót rác chuyên dụng để thu gom\nC. Dùng khăn giấy mỏng bóp chặt mảnh vỡ\nD. Dùng tay nhặt từng mảnh Đáp án theo ngân hàng: B. Báo giáo viên, dùng chổi và hót rác chuyên dụng để thu gom. Phương án B phù hợp với kiến thức trọng tâm của bài: Nhận diện nguy cơ, dùng đúng đồ bảo hộ và xử lí sự cố theo hướng dẫn của giáo viên. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không tự ý nếm, ngửi sát, chạm tay hoặc xử lí hóa chất và mảnh kính bằng tay trần. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Nhận diện nguy cơ, dùng đúng đồ bảo hộ và xử lí sự cố theo hướng dẫn của giáo viên. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Trong thí nghiệm cần đun nóng dung dịch, học sinh đeo kính bảo hộ để làm gì?\nA. Giúp nhìn màu đẹp hơn\nB. Làm dung dịch sôi nhanh hơn\nC. Thay thế việc dùng kẹp ống nghiệm\nD. Bảo vệ mắt khỏi giọt chất lỏng bắn ra Đáp án theo ngân hàng: D. Bảo vệ mắt khỏi giọt chất lỏng bắn ra. Phương án D phù hợp với kiến thức trọng tâm của bài: Nhận diện nguy cơ, dùng đúng đồ bảo hộ và xử lí sự cố theo hướng dẫn của giáo viên. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không tự ý nếm, ngửi sát, chạm tay hoặc xử lí hóa chất và mảnh kính bằng tay trần."},{"number":3,"title":"Sử dụng kính lúp","subject":"Kĩ năng và đo lường","subjectKey":"general","shortSubject":"Chung","slug":"bai-3","summary":"Kính lúp tạo ảnh lớn hơn của vật nhỏ; đặt kính gần mắt rồi điều chỉnh khoả thực tế. Kính lúp tạo ảnh lớn hơn của vật nhỏ; đặt kính gần mắt rồi điều chỉnh khoảng cách đến vật.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Vì sao không nên nhìn trực tiếp Mặt Trời qua kính lúp?\nA. Ánh sáng hội tụ có thể gây tổn thương mắt\nB. Mặt Trời sẽ đổi hướng chuyển động\nC. Kính sẽ tăng khối lượng\nD. Kính sẽ đo sai nhiệt độ","solution":"Đáp án theo ngân hàng: A. Ánh sáng hội tụ có thể gây tổn thương mắt. Phương án A phù hợp với kiến thức trọng tâm của bài: Kính lúp tạo ảnh lớn hơn của vật nhỏ; đặt kính gần mắt rồi điều chỉnh khoảng cách đến vật.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không dùng kính lúp nhìn Mặt Trời hoặc hội tụ ánh sáng vào vật dễ cháy.","extra":[]}],"searchText":"Sử dụng kính lúp Kính lúp tạo ảnh lớn hơn của vật nhỏ; đặt kính gần mắt rồi điều chỉnh khoảng cách đến vật. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Kính lúp tạo ảnh lớn hơn của vật nhỏ; đặt kính gần mắt rồi điều chỉnh khoảng cách đến vật. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Kính lúp dùng để làm gì?\nA. Quan sát vật nhỏ với ảnh lớn hơn\nB. Đo khối lượng của vật\nC. Quan sát các hành tinh rất xa\nD. Đo nhiệt độ Đáp án theo ngân hàng: A. Quan sát vật nhỏ với ảnh lớn hơn. Phương án A phù hợp với kiến thức trọng tâm của bài: Kính lúp tạo ảnh lớn hơn của vật nhỏ; đặt kính gần mắt rồi điều chỉnh khoảng cách đến vật. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không dùng kính lúp nhìn Mặt Trời hoặc hội tụ ánh sáng vào vật dễ cháy. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Kính lúp tạo ảnh lớn hơn của vật nhỏ; đặt kính gần mắt rồi điều chỉnh khoảng cách đến vật. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Minh nhìn chữ qua kính lúp nhưng ảnh mờ. Cách điều chỉnh phù hợp là gì?\nA. Đưa kính ra  tượng nào?\nA. Nhiệt độ của chất\nB. Các vật rất nhỏ không nhìn rõ bằng mắt thường\nC. Các hành tinh ở rất xa\nD. Khối lượng của vật","solution":"Đáp án theo ngân hàng: B. Các vật rất nhỏ không nhìn rõ bằng mắt thường. Phương án B phù hợp với kiến thức trọng tâm của bài: Kính hiển vi quan sát vật rất nhỏ; độ phóng đại tổng bằng thị kính nhân vật kính.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Luôn bắt đầu bằng vật kính nhỏ và chỉ dùng ốc vi cấp khi chuyển sang vật kính lớn.","extra":[]},{"title":"Dạng 2. Tính nhanh hoặc đọc số liệu","tip":"Viết công thức hoặc phép đổi đơn vị trước khi nhìn đáp án. Kính hiển vi quan sát vật rất nhỏ; độ phóng đại tổng bằng thị kính nhân vật kính.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Thị kính 10x kết hợp vật kính 40x cho tổng độ phóng đại bao nhiêu?\nA. 50 lần\nB. 4 000 lần\nC. 40 lần\nD. 400 lần","solution":"Đáp án theo ngân hàng: D. 400 lần. Độ phóng đại tổng = 10 × 40 = 400 lần.","trap":"Kiểm tra đơn vị, phép trừ hoặc hệ số trước khi chọn. Luôn bắt đầu bằng vật kính nhỏ và chỉ dùng ốc vi cấp khi chuyển sang vật kính lớn.","extra":[]},{"title":"Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất","tip":"Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Kính hiển vi quan sát vật rất nhỏ; độ phóng đại tổng bằng thị kính nhân vật kính.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Muốn đưa một tế bào ở rìa trường nhìn vào giữa, cần làm gì?\nA. Tăng nhiệt độ mẫu\nB. Di chuyển tiêu bản nhẹ theo hướng phù hợp\nC. Đổi thị kính liên tục\nD. Di chuyển cả kính hiển vi","solution":"Đáp án theo ngân hàng: B. Di chuyển tiêu bản nhẹ theo hướng phù hợp. Phương án B phù hợp với kiến thức trọng tâm của bài: Kính hiển vi quan sát vật rất nhỏ; độ phóng đại tổng bằng thị kính nhân vật kính.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Luôn bắt đầu bằng vật kính nhỏ và chỉ dùng ốc vi cấp khi chuyển sang vật kính lớn.","extra":[]}],"searchText":"Sử dụng kính hiển vi quang học Kính hiển vi quan sát vật rất nhỏ; độ phóng đại tổng bằng thị kính nhân vật kính. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Kính hiển vi quan sát vật rất nhỏ; độ phóng đại tổng bằng thị kính nhân vật kính. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Kính hiển vi quang học dùng để quan sát đối tượng nào?\nA. Nhiệt độ của chất\nB. Các vật rất nhỏ không nhìn rõ bằng mắt thường\nC. Các hành tinh ở rất xa\nD. Khối lượng của vật Đáp án theo ngân hàng: B. Các vật rất nhỏ không nhìn rõ bằng mắt thường. Phương án B phù hợp với kiến thức trọng tâm của bài: Kính hiển vi quan sát vật rất nhỏ; độ phóng đại tổng bằng thị kính nhân vật kính. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Luôn bắt đầu bằng vật kính nhỏ và chỉ dùng ốc vi cấp khi chuyển sang vật kính lớn. Dạng 2. Tính nhanh hoặc đọc số liệu Viết công thức hoặc phép đổi đơn vị trước khi nhìn đáp án. Kính hiển vi quan sát vật rất nhỏ; độ phóng đại tổng bằng thị kính nhân vật kính. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Thị kính 10x kết hợp vật kính 40x cho tổng độ phóng đại bao nhiêu?\nA. 50 lần\nB. 4 000 lần\nC. 40 lần\nD. 400 lần Đáp án theo ngân hàng: D. 400 lần. Độ phóng đại tổng = 10 × 40 = 400 lần. Kiểm tra đơn vị, phép trừ hoặc hệ số trước khi chọn. Luôn bắt đầu bằng vật kính nhỏ và chỉ dùng ốc vi cấp khi chuyển sang vật kính lớn. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Kính hiển vi quan sát vật rất nhỏ; độ phóng đại tổng bằng thị kính nhân vật kính. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Muốn đưa một tế bào ở rìa trường nhìn vào giữa, cần làm gì?\nA. Tăng nhiệt độ mẫu\nB. Di chuyển tiêu bản nhẹ theo hướng phù hợp\nC. Đổi thị kính liên tục\nD. Di chuyển cả kính hiển vi Đáp án theo ngân hàng: B. Di chuyển tiêu bản nhẹ theo hướng phù hợp. Phương án B phù hợp với kiến thức trọng tâm của bài: Kính hiển vi quan sát vật rất nhỏ; độ phóng đại tổng bằng thị kính nhân vật kính. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Luôn bắt đầu bằng vật kính nhỏ và chỉ dùng ốc vi cấp khi chuyển sang vật kính lớn."},{"number":5,"title":"Đo chiều dài","subject":"Kĩ năng và đo lường","subjectKey":"general","shortSubject":"Chung","slug":"bai-5","summary":"Chọn thước theo giới hạn đo và độ chia nhỏ nhất; đặt mắt vuông góc và ghi đủ đơn vị.","intro":["Chọn thước theo giới hạn đo và độ chia nhỏ nhất; đặt mắt vuông góc và ghi đủ đơn vị."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Chọn thước theo giới hạn đo và độ chia nhỏ nhất; đặt mắt vuông góc và ghi đủ đơn vị.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Đơn vị cơ bản đo chiều dài trong hệ SI là gì?\nA. Kilôgam (kg)\nB. Giây (s)\nC. Mét (m)\nD. Lít (L)","solution":"Đáp án theo ngân hàng: C. Mét (m). Phương án C phù hợp với kiến thức trọng tâm của bài: Chọn thước theo giới hạn đo và độ chia nhỏ nhất; đặt mắt vuông góc và ghi đủ đơn vị.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Nếu đầu vật không ở vạch 0, chiều dài bằng số cuối trừ số đầu.","extra":[]},{"title":"Dạng 2. Giải thích hiện tượng và tình huống","tip":"Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Chọn thước theo giới hạn đo và độ chia nhỏ nhất; đặt mắt vuông góc và ghi đủ đơn vị.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Một thước có giới hạn đo 30 cm và độ chia nhỏ nhất 1 mm. Thước phù hợp nhất để đo vật nào?\nA. Chiều dài bút chì 15 cm\nB. Chiều dài sân bóng 100 m\nC. Khoảng cách 2 km\nD. Chiều dài lớp học 8 m","solution":"Đáp án theo ngân hàng: A. Chiều dài bút chì 15 cm. Phương án A phù hợp với kiến thức trọng tâm của bài: Chọn th  bấm đồng hồ.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Bấm muộn lúc bắt đầu hoặc sớm lúc kết thúc làm thời gian đo nhỏ hơn thực tế.","extra":[]},{"title":"Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất","tip":"Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Đơn vị SI là giây; đo nhiều lần và hạn chế sai số phản ứng khi bấm đồng hồ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Người bấm đồng hồ chậm khi vận động viên xuất phát. Kết quả đo sẽ có xu hướng thế nào?\nA. Nhỏ hơn thời gian thực\nB. Luôn đúng tuyệt đối\nC. Lớn hơn thời gian thực\nD. Không có đơn vị","solution":"Đáp án theo ngân hàng: A. Nhỏ hơn thời gian thực. Bấm bắt đầu chậm làm mất một phần thời gian đầu, nên khoảng thời gian ghi được nhỏ hơn thời gian thực.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Bấm muộn lúc bắt đầu hoặc sớm lúc kết thúc làm thời gian đo nhỏ hơn thực tế.","extra":[]}],"searchText":"Đo thời gian Đơn vị SI là giây; đo nhiều lần và hạn chế sai số phản ứng khi bấm đồng hồ. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Đơn vị SI là giây; đo nhiều lần và hạn chế sai số phản ứng khi bấm đồng hồ. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Đơn vị cơ bản đo thời gian trong hệ SI là gì?\nA. Giây (s)\nB. Độ C (°C)\nC. Kilôgam (kg)\nD. Mét (m) Đáp án theo ngân hàng: A. Giây (s). Phương án A phù hợp với kiến thức trọng tâm của bài: Đơn vị SI là giây; đo nhiều lần và hạn chế sai số phản ứng khi bấm đồng hồ. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Bấm muộn lúc bắt đầu hoặc sớm lúc kết thúc làm thời gian đo nhỏ hơn thực tế. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Đơn vị SI là giây; đo nhiều lần và hạn chế sai số phản ứng khi bấm đồng hồ. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Một bạn chạy hết 100 m trong 15,2 s. Đại lượng 15,2 s biểu thị gì?\nA. Nhiệt độ không khí\nB. Khối lượng người chạy\nC. Khoảng thời gian chạy\nD. Chiều dài đường chạy Đáp án theo ngân hàng: C. Khoảng thời gian chạy. Phương án C phù hợp với kiến thức trọng tâm của bài: Đơn vị SI là giây; đo nhiều lần và hạn chế sai số phản ứng khi bấm đồng hồ. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Bấm muộn lúc bắt đầu hoặc sớm lúc kết thúc làm thời gian đo nhỏ hơn thực tế. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Đơn vị SI là giây; đo nhiều lần và hạn chế sai số phản ứng khi bấm đồng hồ. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Người bấm đồng hồ chậm khi vận động viên xuất phát. Kết quả đo sẽ có xu hướng thế nào?\nA. Nhỏ hơn thời gian thực\nB. Luôn đúng tuyệt đối\nC. Lớn hơn thời gian thực\nD. Không có đơn vị Đáp án theo ngân hàng: A. Nhỏ hơn thời gian thực. Bấm bắt đầu chậm làm mất một phần thời gian đầu, nên khoảng thời gian ghi được nhỏ hơn thời gian thực. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Bấm muộn lúc bắt đầu hoặc sớm lúc kết thúc làm thời gian đo nhỏ hơn thực tế."},{"number":8,"title":"Đo nhiệt độ","subject":"Kĩ năng và đo lường","subjectKey":"general","shortSubject":"Chung","slug":"bai-8","summary":"Chọn nhiệt kế có giới hạn đo phù hợp, đặt đúng vị trí và chờ số chỉ ổn định.","intro":["Chọn nhiệt kế có giới hạn đo phù hợp, đặt đúng vị trí và chờ số chỉ ổn định."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Chọn nhiệt kế có giới hạn đo phù hợp, đặt đúng vị trí và chờ số chỉ ổn định.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Đại lượng cho biết mức độ nóng hay lạnh của vật là gì?\nA. Khối lượng\nB. Nhiệt độ\nC. Chiều dài\nD. Thời gian","solution":"Đáp án theo ngân hàng: B. Nhiệt độ. Phương án B phù hợp với kiến thức trọng tâm của bài: Chọn nhiệt kế có giới hạn đo phù hợp, đặt đúng vị trí và chờ số chỉ ổn định.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không dùng nhiệt kế có giới hạn đo thấp hơn nhiệt độ dự kiến.","extra":[]},{"title":"Dạng 2. Giải thích hiện tượng và tình huống","tip":"Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Chọn nhiệt kế có giới hạn đo phù hợp, đặt đúng vị trí và chờ số chỉ ổn định.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Muốn đo nhiệt độ nước khoảng 80°C, nên chọn nhiệt kế nào?\nA. Nhiệt kế y tế chỉ đến khoảng 42°C\nB. Thước đo chiều dài\nC. Nhiệt kế có giới hạn đo 50°C\nD. Nhiệt kế có giới hạn đo lớn hơn 80°C","solution":"Đáp án theo ngân hàng: D. Nhiệt kế có giới hạn đo lớn hơn 80°C. Phương án D phù hợp với kiến thức trọng tâm của bài: Chọn nhiệt kế có giới hạn đo phù hợp, đặt đúng vị trí và chờ số chỉ ổn định.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không dùng nhiệt kế có giới hạn đo thấp hơn nhiệt độ dự kiến.","extra":[]},{"title":"Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất","tip":"Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Chọn nhiệt kế có giới hạn đo phù hợp, đặt đúng vị trí và chờ số chỉ ổn định.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Khi đo nhiệt độ cơ thể bằng nhiệt kế điện tử, vì sao cần chờ tín hiệu báo?\nA. Để cơ thể nguội về 0°C\nB. Để cảm biến đạt giá trị ổn định\nC. Để đổi đơn vị sang mét\nD. Để nhiệt kế tăng khối lượng","solution":"Đáp án theo ngân hàng: B. Để cảm biến đạt giá trị ổn định. Phương án B phù hợp với kiến thức trọng tâm của bài: Chọn nhiệt kế có giới hạn đo phù hợp, đặt đúng vị trí và chờ số chỉ ổn định.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không dùng nhiệt kế có giới hạn đo thấp hơn nhiệt độ dự kiến.","extra":[]}],"searchText":"Đo nhiệt độ Chọn nhiệt kế có giới hạn đo phù hợp, đặt đúng vị trí và chờ số chỉ ổn định. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Chọn nhiệt kế có giới hạn đo phù hợp, đặt đúng vị trí và chờ số chỉ ổn định. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Đại lượng cho biết mức độ nóng hay lạnh của vật là gì?\nA. Khối lượng\nB. Nhiệt độ\nC. Chiều dài\nD. Thời gian Đáp án theo ngân hàng: B. Nhiệt độ. Phương án B phù hợp với kiến thức trọng tâm của bài: Chọn nhiệt kế có giới hạn đo phù hợp, đặt đúng vị trí và chờ số chỉ ổn định. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không dùng nhiệt kế có giới hạn đo thấp hơn nhiệt độ dự kiến. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Chọn nhiệt kế có giới hạn đo phù hợp, đặt đúng vị trí và chờ số chỉ ổn định. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Muốn đo nhiệt độ nước khoảng 80°C, nên chọn nhiệt kế nào?\nA. Nhiệt kế y tế chỉ đến khoảng 42°C\nB. Thước đo chiều dài\nC. Nhiệt kế có giới hạn đo 50°C\nD. Nhiệt kế có giới hạn đo lớn hơn 80°C Đáp án theo ngân hàng: D. Nhiệt kế có giới hạn đo lớn hơn 80°C. Phương án D phù hợp với kiến thức trọng tâm của bài: Chọn nhiệt kế có giới hạn đo phù hợp, đặt đúng vị trí và chờ số chỉ ổn định. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không dùng nhiệt kế có giới hạn đo thấp hơn nhiệt độ dự kiến. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Chọn nhiệt kế có giới hạn đo phù hợp, đặt đúng vị trí và chờ số chỉ ổn định. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Khi đo nhiệt độ cơ thể bằng nhiệt kế điện tử, vì sao cần chờ tín hiệu báo?\nA. Để cơ thể nguội về 0°C\nB. Để cảm biến đạt giá trị ổn định\nC. Để đổi đơn vị sang mét\nD. Để nhiệt kế tăng khối lượng Đáp án theo ngân hàng: B. Để cảm biến đạt giá trị ổn định. Phương án B phù hợp với kiến thức trọng tâm của bài: Chọn nhiệt kế có giới hạn đo phù hợp, đặt đúng vị trí và chờ số chỉ ổn định. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không dùng nhiệt kế có giới hạn đo thấp hơn nhiệt độ dự kiến."},{"number":9,"title":"Sự đa dạng của chất","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-9","summary":"Vật thể được tạo nên từ chất; lựa chọn chất dựa vào tính chất và mục đích sử dụng.","intro":["Vật thể được tạo nên từ chất; lựa chọn chất dựa vào tính chất và mục đích sử dụng."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Vật thể được tạo nên từ chất; lựa chọn chất dựa vào tính chất và mục đích sử dụng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Chất là gì?\nA. Một lực tác dụng\nB. Một đơn vị thời gian\nC. Thành phần tạo nên vật thể\nD. Một loại dụng cụ đo","solution":"Đáp án theo ngân hàng: C. Thành phần tạo nên vật thể. Phương án C phù hợp với kiến thức trọng tâm của bài: Vật thể được tạo nên từ chất; lựa chọn chất dựa vào tính chất và mục đích sử dụng.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không nhầm vật thể với chất cấu tạo nên vật thể.","extra":[]},{"title":"Dạng 2. Giải thích hiện tượng và tình huống","tip":"Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Vật thể được tạo nên từ chất; lựa chọn chất dựa vào tính chất và mục đích sử dụng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Một chiếc nồi có thân bằng nhôm và quai bằng nhựa. Vì sao dùng hai chất khác nhau?\nA. Nhôm dẫn nhiệt tốt, nhựa dẫn nhiệt kém giúp cầm an toàn hơn\nB. Hai chất có tính chất hoàn toàn giống nhau\nC. Nhựa dẫn nhiệt tốt hơn nhôm\nD. Nhôm không chịu được nhiệt","solution":"Đáp án theo ngân hàng: A. Nhôm dẫn nhiệt tốt, nhựa dẫn nhiệt kém giúp cầm an toàn hơn. Phương án A phù hợp với kiến thức trọng tâm của bài: Vật thể được tạo nên từ chất; lựa chọn chất dựa vào tính chất và mục đích sử dụng.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không nhầm vật thể với chất cấu tạo nên vật thể.","extra":[]},{"title":"Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất","tip":"Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Vật thể được tạo nên từ chất; lựa chọn chất dựa vào tính chất và mục đích sử dụng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Chọn chất làm cửa sổ cần vừa trong suốt vừa cứng. Chất phù hợp là gì?\nA. Đất sét ướt\nB. Than đá\nC. Thủy tinh\nD. Bông","solution":"Đáp án theo ngân hàng: C. Thủy tinh. Phương án C phù hợp với kiến thức trọng tâm của bài: Vật thể được tạo nên từ chất; lựa chọn chất dựa vào tính chất và mục đích sử dụng.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không nhầm vật thể với chất cấu tạo nên vật thể.","extra":[]}],"searchText":"Sự đa dạng của chất Vật thể được tạo nên từ chất; lựa chọn chất dựa vào tính chất và mục đích sử dụng. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Vật thể được tạo nên từ chất; lựa chọn chất dựa vào tính chất và mục đích sử dụng. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Chất là gì?\nA. Một lực tác dụng\nB. Một đơn vị thời gian\nC. Thành phần tạo nên vật thể\nD. Một loại dụng cụ đo Đáp án theo ngân hàng: C. Thành phần tạo nên vật thể. Phương án C phù hợp với kiến thức trọng tâm của bài: Vật thể được tạo nên từ chất; lựa chọn chất dựa vào tính chất và mục đích sử dụng. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không nhầm vật thể với chất cấu tạo nên vật thể. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Vật thể được tạo nên từ chất; lựa chọn chất dựa vào tính chất và mục đích sử dụng. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Một chiếc nồi có thân bằng nhôm và quai bằng nhựa. Vì sao dùng hai chất khác nhau?\nA. Nhôm dẫn nhiệt tốt, nhựa dẫn nhiệt kém giúp cầm an toàn hơn\nB. Hai chất có tính chất hoàn toàn giống nhau\nC. Nhựa dẫn nhiệt tốt hơn nhôm\nD. Nhôm không chịu được nhiệt Đáp án theo ngân hàng: A. Nhôm dẫn nhiệt tốt, nhựa dẫn nhiệt kém giúp cầm an toàn hơn. Phương án A phù hợp với kiến thức trọng tâm của bài: Vật thể được tạo nên từ chất; lựa chọn chất dựa vào tính chất và mục đích sử dụng. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không nhầm vật thể với chất cấu tạo nên vật thể. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Vật thể được tạo nên từ chất; lựa chọn chất dựa vào tính chất và mục đích sử dụng. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Chọn chất làm cửa sổ cần vừa trong suốt vừa cứng. Chất phù hợp là gì?\nA. Đất sét ướt\nB. Than đá\nC. Thủy tinh\nD. Bông Đáp án theo ngân hàng: C. Thủy tinh. Phương án C phù hợp với kiến thức trọng tâm của bài: Vật thể được tạo nên từ chất; lựa chọn chất dựa vào tính chất và mục đích sử dụng. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không nhầm vật thể với chất cấu tạo nên vật thể."},{"number":10,"title":"Các thể của chất và sự chuyển thể","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-10","summary":"Rắn có hình dạng và thể tích xác định; lỏng có thể tích xác định; khí không có cả hai.","intro":["Rắn có hình dạng và thể tích xác định; lỏng có thể tích xác định; khí không có cả hai."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Rắn có hình dạng và thể tích xác định; lỏng có thể tích xác định; khí không có cả hai.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Chất rắn có đặc điểm nào?\nA. Luôn lan tỏa khắp bình\nB. Có thể tích xác định nhưng không có hình dạng xác định\nC. Không có hình dạng và thể tích xác định\nD. Có hình dạng và thể tích xác định","solution":"Đáp án theo ngân hàng: D. Có hình dạng và thể tích xác định. Phương án D phù hợp với kiến thức trọng tâm của bài: Rắn có hình dạng và thể tích xác định; lỏng có thể tích xác định; khí không có cả hai.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Phân biệt nóng chảy, đông đặc, bay hơi, ngưng tụ và sự nở của nước khi đông.","extra":[]},{"title":"Dạng 2. Giải thích hiện tượng và tình huống","tip":"Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Rắn có hình dạng và thể tích xác định; lỏng có thể tích xác định; khí không có cả hai.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Quần áo phơi ngày nắng có gió khô nhanh hơn ngày ẩm lặng gió vì sao?\nA. Nước đông đặc nhanh hơn\nB. Nhiệt độ cao và gió làm nước bay hơi nhanh hơn\nC. Vải tự phát nhiệt\nD. Không khí biến thành nước","solution":"Đáp án theo ngân hàng: B. Nhiệt độ cao và gió làm nước bay hơi nhanh hơn. Phương án B phù hợp với kiến thức trọng tâm của bài: Rắn có hình dạng và thể tích xác định; lỏng có thể tích xác định; khí không có cả hai.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Phân biệt nóng chảy, đông đặc, bay hơi, ngưng tụ và sự nở của nước khi đông.","extra":[]},{"title":"Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất","tip":"Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Rắn có hình dạng và thể tích xác định; lỏng có thể tích xác định; khí không có cả hai.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Một chai nước đầy để trong ngăn đá dễ bị nứt vì sao?\nA. Không khí biến thành kim loại\nB. Nước co lại hoàn toàn\nC. Chai nóng chảy\nD. Nước nở ra khi đông đặc","solution":"Đáp án theo ngân hàng: D. Nước nở ra khi đông đặc. Phương án D phù hợp với kiến thức trọng tâm của bài: Rắn có hình dạng và thể tích xác định; lỏng có thể tích xác định; khí không có cả hai.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Phân biệt nóng chảy, đông đặc, bay hơi, ngưng tụ và sự nở của nước khi đông.","extra":[]}],"searchText":"Các thể của chất và sự chuyển thể Rắn có hình dạng và thể tích xác định; lỏng có thể tích xác định; khí không có cả hai. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Rắn có hình dạng và thể tích xác định; lỏng có thể tích xác định; khí không có cả hai. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Chất rắn có đặc điểm nào?\nA. Luôn lan tỏa khắp bình\nB. Có thể tích xác định nhưng không có hình dạng xác định\nC. Không có hình dạng và thể tích xác định\nD. Có hình dạng và thể tích xác định Đáp án theo ngân hàng: D. Có hình dạng và thể tích xác định. Phương án D phù hợp với kiến thức trọng tâm của bài: Rắn có hình dạng và thể tích xác định; lỏng có thể tích xác định; khí không có cả hai. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Phân biệt nóng chảy, đông đặc, bay hơi, ngưng tụ và sự nở của nước khi đông. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Rắn có hình dạng và thể tích xác định; lỏng có thể tích xác định; khí không có cả hai. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Quần áo phơi ngày nắng có gió khô nhanh hơn ngày ẩm lặng gió vì sao?\nA. Nước đông đặc nhanh hơn\nB. Nhiệt độ cao và gió làm nước bay hơi nhanh hơn\nC. Vải tự phát nhiệt\nD. Không khí biến thành nước Đáp án theo ngân hàng: B. Nhiệt độ cao và gió làm nước bay hơi nhanh hơn. Phương án B phù hợp với kiến thức trọng tâm của bài: Rắn có hình dạng và thể tích xác định; lỏng có thể tích xác định; khí không có cả hai. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Phân biệt nóng chảy, đông đặc, bay hơi, ngưng tụ và sự nở của nước khi đông. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Rắn có hình dạng và thể tích xác định; lỏng có thể tích xác định; khí không có cả hai. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Một chai nước đầy để trong ngăn đá dễ bị nứt vì sao?\nA. Không khí biến thành kim loại\nB. Nước co lại hoàn toàn\nC. Chai nóng chảy\nD. Nước nở ra khi đông đặc Đáp án theo ngân hàng: D. Nước nở ra khi đông đặc. Phương án D phù hợp với kiến thức trọng tâm của bài: Rắn có hình dạng và thể tích xác định; lỏng có thể tích xác định; khí không có cả hai. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Phân biệt nóng chảy, đông đặc, bay hơi, ngưng tụ và sự nở của nước khi đông."},{"number":11,"title":"Oxygen. Không khí","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-11","summary":"Oxygen duy trì hô hấp và sự cháy; không khí là hỗn hợp có nitrogen, oxygen và khí khác.","intro":["Oxygen duy trì hô hấp và sự cháy; không khí là hỗn hợp có nitrogen, oxygen và khí khác."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Oxygen duy trì hô hấp và sự cháy; không khí là hỗn hợp có nitrogen, oxygen và khí khác.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Oxygen ở điều kiện thường tồn tại ở thể nào?\nA. Khí\nB. Lỏng\nC. Plasma\nD. Rắn","solution":"Đáp án theo ngân hàng: A. Khí. Phương án A phù hợp với kiến thức trọng tâm của bài: Oxygen duy trì hô hấp và sự cháy; không khí là hỗn hợp có nitrogen, oxygen và khí khác.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không nói oxygen là nhiên liệu; oxygen chỉ là chất duy trì sự cháy.","extra":[]},{"title":"Dạng 2. Giải thích hiện tượng và tình huống","tip":"Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Oxygen duy trì hô hấp và sự cháy; không khí là hỗn hợp có nitrogen, oxygen và khí khác.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Ngọn nến đang cháy được úp bằng cốc kín, sau một lúc tắt. Nguyên nhân chính là gì?\nA. Nitrogen cháy hết\nB. Cốc làm sáp đông đặc\nC. Oxygen trong cốc giảm xuống không đủ duy trì sự cháy\nD. Nến hết khối lượng ngay lập tức","solution":"Đáp án theo ngân hàng: C. Oxygen trong cốc giảm xuống không đủ duy trì sự cháy. Phương án C phù hợp với kiến thức trọng tâm của bài: Oxygen duy trì hô hấp và sự cháy; không khí là hỗn hợp có nitrogen, oxygen và khí khác.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không nói oxygen là nhiên liệu; oxygen chỉ là chất duy trì sự cháy.","extra":[]},{"title":"Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất","tip":"Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Oxygen duy trì hô hấp và sự cháy; không khí là hỗn hợp có nitrogen, oxygen và khí khác.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Cây xanh góp phần cải thiện không khí như thế nào?\nA. Hấp thụ carbon dioxide và giải phóng oxygen khi quang hợp\nB. Hấp thụ toàn bộ oxygen\nC. Tạo ra khói bụi\nD. Làm nitrogen cháy","solution":"Đáp án theo ngân hàng: A. Hấp thụ carbon dioxide và giải phóng oxygen khi quang hợp. Phương án A phù hợp với kiến thức trọng tâm của bài: Oxygen duy trì hô hấp và sự cháy; không khí là hỗn hợp có nitrogen, oxygen và khí khác.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không nói oxygen là nhiên liệu; oxygen chỉ là chất duy trì sự cháy.","extra":[]}],"searchText":"Oxygen. Không khí Oxygen duy trì hô hấp và sự cháy; không khí là hỗn hợp có nitrogen, oxygen và khí khác. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Oxygen duy trì hô hấp và sự cháy; không khí là hỗn hợp có nitrogen, oxygen và khí khác. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Oxygen ở điều kiện thường tồn tại ở thể nào?\nA. Khí\nB. Lỏng\nC. Plasma\nD. Rắn Đáp án theo ngân hàng: A. Khí. Phương án A phù hợp với kiến thức trọng tâm của bài: Oxygen duy trì hô hấp và sự cháy; không khí là hỗn hợp có nitrogen, oxygen và khí khác. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không nói oxygen là nhiên liệu; oxygen chỉ là chất duy trì sự cháy. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Oxygen duy trì hô hấp và sự cháy; không khí là hỗn hợp có nitrogen, oxygen và khí khác. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Ngọn nến đang cháy được úp bằng cốc kín, sau một lúc tắt. Nguyên nhân chính là gì?\nA. Nitrogen cháy hết\nB. Cốc làm sáp đông đặc\nC. Oxygen trong cốc giảm xuống không đủ duy trì sự cháy\nD. Nến hết khối lượng ngay lập tức Đáp án theo ngân hàng: C. Oxygen trong cốc giảm xuống không đủ duy trì sự cháy. Phương án C phù hợp với kiến thức trọng tâm của bài: Oxygen duy trì hô hấp và sự cháy; không khí là hỗn hợp có nitrogen, oxygen và khí khác. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không nói oxygen là nhiên liệu; oxygen chỉ là chất duy trì sự cháy. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Oxygen duy trì hô hấp và sự cháy; không khí là hỗn hợp có nitrogen, oxygen và khí khác. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Cây xanh góp phần cải thiện không khí như thế nào?\nA. Hấp thụ carbon dioxide và giải
