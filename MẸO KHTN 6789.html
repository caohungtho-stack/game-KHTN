 19 (Thông hiểu): Nồi nấu có thân kim loại và tay cầm bằng nhựa. Cách chọn vật liệu này dựa vào điều gì?\nA. Kim loại không chịu được nhiệt\nB. Nhựa dẫn nhiệt tốt hơn kim loại\nC. Cả hai vật liệu có tính chất giống nhau\nD. Kim loại dẫn nhiệt tốt, nhựa dẫn nhiệt kém","solution":"Đáp án theo ngân hàng: D. Kim loại dẫn nhiệt tốt, nhựa dẫn nhiệt kém. Phương án D phù hợp với kiến thức trọng tâm của bài: Chọn vật liệu theo độ bền, dẫn nhiệt, dẫn điện, cách nhiệt, độ trong suốt và khả năng tái chế.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Một đồ vật có thể phối hợp nhiều vật liệu vì mỗi bộ phận cần tính chất khác nhau.","extra":[]},{"title":"Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất","tip":"Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Chọn vật liệu theo độ bền, dẫn nhiệt, dẫn điện, cách nhiệt, độ trong suốt và khả năng tái chế.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Vì sao dây điện không làm toàn bộ bằng đồng trần?\nA. Nhựa làm dòng điện mạnh hơn\nB. Cần lớp cách điện để tránh điện giật và chập mạch\nC. Đồng không dẫn điện\nD. Vỏ nhựa dùng để tăng khối lượng","solution":"Đáp án theo ngân hàng: B. Cần lớp cách điện để tránh điện giật và chập mạch. Phương án B phù hợp với kiến thức trọng tâm của bài: Chọn vật liệu theo độ bền, dẫn nhiệt, dẫn điện, cách nhiệt, độ trong suốt và khả năng tái chế.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Một đồ vật có thể phối hợp nhiều vật liệu vì mỗi bộ phận cần tính chất khác nhau.","extra":[]}],"searchText":"Một số vật liệu Chọn vật liệu theo độ bền, dẫn nhiệt, dẫn điện, cách nhiệt, độ trong suốt và khả năng tái chế. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Chọn vật liệu theo độ bền, dẫn nhiệt, dẫn điện, cách nhiệt, độ trong suốt và khả năng tái chế. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Vật liệu là gì?\nA. Mọi vật sống trong tự nhiên\nB. Chất hoặc hỗn hợp được dùng để làm ra đồ vật, công trình\nC. Dụng cụ chỉ dùng để đo thời gian\nD. Một loại năng lượng Đáp án theo ngân hàng: B. Chất hoặc hỗn hợp được dùng để làm ra đồ vật, công trình. Phương án B phù hợp với kiến thức trọng tâm của bài: Chọn vật liệu theo độ bền, dẫn nhiệt, dẫn điện, cách nhiệt, độ trong suốt và khả năng tái chế. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Một đồ vật có thể phối hợp nhiều vật liệu vì mỗi bộ phận cần tính chất khác nhau. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Chọn vật liệu theo độ bền, dẫn nhiệt, dẫn điện, cách nhiệt, độ trong suốt và khả năng tái chế. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Nồi nấu có thân kim loại và tay cầm bằng nhựa. Cách chọn vật liệu này dựa vào điều gì?\nA. Kim loại không chịu được nhiệt\nB. Nhựa dẫn nhiệt tốt hơn kim loại\nC. Cả hai vật liệu có tính chất giống nhau\nD. Kim loại dẫn nhiệt tốt, nhựa dẫn nhiệt kém Đáp án theo ngân hàng: D. Kim loại dẫn nhiệt tốt, nhựa dẫn nhiệt kém. Phương án D phù hợp với kiến thức trọng tâm của bài: Chọn vật liệu theo độ bền, dẫn nhiệt, dẫn điện, cách nhiệt, độ trong suốt và khả năng tái chế. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Một đồ vật có thể phối hợp nhiều vật liệu vì mỗi bộ phận cần tính chất khác nhau. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Chọn vật liệu theo độ bền, dẫn nhiệt, dẫn điện, cách nhiệt, độ trong suốt và khả năng tái chế. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Vì sao dây điện không làm toàn bộ bằng đồng trần?\nA. Nhựa làm dòng điện mạnh hơn\nB. Cần lớp cách điện để tránh điện giật và chập mạch\nC. Đồng không dẫn điện\nD. Vỏ nhựa dùng để tăng khối lượng Đáp án theo ngân hàng: B. Cần lớp cách điện để tránh điện giật và chập mạch. Phương án B phù hợp với kiến thức trọng tâm của bài: Chọn vật liệu theo độ bền, dẫn nhiệt, dẫn điện, cách nhiệt, độ trong suốt và khả năng tái chế. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Một đồ vật có thể phối hợp nhiều vật liệu vì mỗi bộ phận cần tính chất khác nhau."},{"number":13,"title":"Một số nguyên liệu","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-13","summary":"Nguyên liệu là đầu vào để sản xuất; tái chế giúp giảm khai thác tài nguyên và chất thải.","intro":["Nguyên liệu là đầu vào để sản xuất; tái chế giúp giảm khai thác tài nguyên và chất thải."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Nguyên liệu là đầu vào để sản xuất; tái chế giúp giảm khai thác tài nguyên và chất thải.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Nguyên liệu là gì?\nA. Sản phẩm đã hoàn thiện để sử dụng ngay\nB. Một loại dụng cụ đo\nC. Vật liệu ban đầu được dùng để sản xuất ra sản phẩm hoặc vật liệu khác\nD. Một dạng năng lượng","solution":"Đáp án theo ngân hàng: C. Vật liệu ban đầu được dùng để sản xuất ra sản phẩm hoặc vật liệu khác. Phương án C phù hợp với kiến thức trọng tâm của bài: Nguyên liệu là đầu vào để sản xuất; tái chế giúp giảm khai thác tài nguyên và chất thải.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không nhầm nguyên liệu ban đầu với sản phẩm đã hoàn thiện.","extra":[]},{"title":"Dạng 2. Giải thích hiện tượng và tình huống","tip":"Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Nguyên liệu là đầu vào để sản xuất; tái chế giúp giảm khai thác tài nguyên và chất thải.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Một nhà máy dùng giấy tái chế thay một phần bột gỗ mới. Lợi ích chính là gì?\nA. Giảm nhu cầu khai thác gỗ và giảm chất thải\nB. Làm nguyên liệu mất hoàn toàn giá trị\nC. Tăng khai thác rừng\nD. Làm giấy không thể sử dụng","solution":"Đáp án theo ngân hàng: A. Giảm nhu cầu khai thác gỗ và giảm chất thải. Phương án A phù hợp với kiến thức trọng tâm của bài: Nguyên liệu là đầu vào để sản xuất; tái chế giúp giảm khai thác tài nguyên và chất thải.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không nhầm nguyên liệu ban đầu với sản phẩm đã hoàn thiện.","extra":[]},{"title":"Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất","tip":"Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Nguyên liệu là đầu vào để sản xuất; tái chế giúp giảm khai thác tài nguyên và chất thải.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Tại sao quặng kim loại cần được chế biến trước khi dùng?\nA. Chế biến chỉ làm tăng màu sắc\nB. Quặng là sản phẩm hoàn thiện\nC. Kim loại thường nằm lẫn với đất đá và các chất khác\nD. Quặng luôn là kim loại tinh khiết 100%","solution":"Đáp án theo ngân hàng: C. Kim loại thường nằm lẫn với đất đá và các chất khác. Phương án C phù hợp với kiến thức trọng tâm của bài: Nguyên liệu là đầu vào để sản xuất; tái chế giúp giảm khai thác tài nguyên và chất thải.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không nhầm nguyên liệu ban đầu với sản phẩm đã hoàn thiện.","extra":[]}],"searchText":"Một số nguyên liệu Nguyên liệu là đầu vào để sản xuất; tái chế giúp giảm khai thác tài nguyên và chất thải. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Nguyên liệu là đầu vào để sản xuất; tái chế giúp giảm khai thác tài nguyên và chất thải. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Nguyên liệu là gì?\nA. Sản phẩm đã hoàn thiện để sử dụng ngay\nB. Một loại dụng cụ đo\nC. Vật liệu ban đầu được dùng để sản xuất ra sản phẩm hoặc vật liệu khác\nD. Một dạng năng lượng Đáp án theo ngân hàng: C. Vật liệu ban đầu được dùng để sản xuất ra sản phẩm hoặc vật liệu khác. Phương án C phù hợp với kiến thức trọng tâm của bài: Nguyên liệu là đầu vào để sản xuất; tái chế giúp giảm khai thác tài nguyên và chất thải. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không nhầm nguyên liệu ban đầu với sản phẩm đã hoàn thiện. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Nguyên liệu là đầu vào để sản xuất; tái chế giúp giảm khai thác tài nguyên và chất thải. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Một nhà máy dùng giấy tái chế thay một phần bột gỗ mới. Lợi ích chính là gì?\nA. Giảm nhu cầu khai thác gỗ và giảm chất thải\nB. Làm nguyên liệu mất hoàn toàn giá trị\nC. Tăng khai thác rừng\nD. Làm giấy không thể sử dụng Đáp án theo ngân hàng: A. Giảm nhu cầu khai thác gỗ và giảm chất thải. Phương án A phù hợp với kiến thức trọng tâm của bài: Nguyên liệu là đầu vào để sản xuất; tái chế giúp giảm khai thác tài nguyên và chất thải. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không nhầm nguyên liệu ban đầu với sản phẩm đã hoàn thiện. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Nguyên liệu là đầu vào để sản xuất; tái chế giúp giảm khai thác tài nguyên và chất thải. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Tại sao quặng kim loại cần được chế biến trước khi dùng?\nA. Chế biến chỉ làm tăng màu sắc\nB. Quặng là sản phẩm hoàn thiện\nC. Kim loại thường nằm lẫn với đất đá và các chất khác\nD. Quặng luôn là kim loại tinh khiết 100% Đáp án theo ngân hàng: C. Kim loại thường nằm lẫn với đất đá và các chất khác. Phương án C phù hợp với kiến thức trọng tâm của bài: Nguyên liệu là đầu vào để sản xuất; tái chế giúp giảm khai thác tài nguyên và chất thải. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không nhầm nguyên liệu ban đầu với sản phẩm đã hoàn thiện."},{"number":14,"title":"Một số nhiên liệu","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-14","summary":"Nhiên liệu cháy tỏa năng lượng; cháy đủ oxygen sạch và hiệu quả hơn cháy thiếu oxygen.","intro":["Nhiên liệu cháy tỏa năng lượng; cháy đủ oxygen sạch và hiệu quả hơn cháy thiếu oxygen."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Nhiên liệu cháy tỏa năng lượng; cháy đủ oxygen sạch và hiệu quả hơn cháy thiếu oxygen.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Nhiên liệu là gì?\nA. Mọi chất lỏng\nB. Mọi kim loại\nC. Một dụng cụ đo nhiệt độ\nD. Chất cháy được và khi cháy tỏa năng lượng có ích","solution":"Đáp án theo ngân hàng: D. Chất cháy được và khi cháy tỏa năng lượng có ích. Phương án D phù hợp với kiến thức trọng tâm của bài: Nhiên liệu cháy tỏa năng lượng; cháy đủ oxygen sạch và hiệu quả hơn cháy thiếu oxygen.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Ngọn lửa vàng và muội đen thường báo hiệu cháy không hoàn toàn.","extra":[]},{"title":"Dạng 2. Giải thích hiện tượng và tình huống","tip":"Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Nhiên liệu cháy tỏa năng lượng; cháy đủ oxygen sạch và hiệu quả hơn cháy thiếu oxygen.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Bếp gas cháy ngọn lửa vàng và có muội đen. Nguyên nhân có thể là gì?\nA. Có quá nhiều oxygen nên không cháy\nB. Thiếu không khí làm gas cháy không hoàn toàn\nC. Bếp không có nhiên liệu\nD. Gas đã biến thành nước","solution":"Đáp án theo ngân hàng: B. Thiếu không khí làm gas cháy không hoàn toàn. Phương án B phù hợp với kiến thức trọng tâm của bài: Nhiên liệu cháy tỏa năng lượng; cháy đủ oxygen sạch và hiệu quả hơn cháy thiếu oxygen.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Ngọn lửa vàng và muội đen thường báo hiệu cháy không hoàn toàn.","extra":[]},{"title":"Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất","tip":"Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Nhiên liệu cháy tỏa năng lượng; cháy đủ oxygen sạch và hiệu quả hơn cháy thiếu oxygen.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Giữa than đá và năng lượng mặt trời, nguồn nào gây phát thải carbon dioxide trực tiếp khi sử dụng nhiều hơn?\nA. Năng lượng mặt trời\nB. Không nguồn nào\nC. Hai nguồn luôn như nhau\nD. Than đá","solution":"Đáp án theo ngân hàng: D. Than đá. Phương án D phù hợp với kiến thức trọng tâm của bài: Nhiên liệu cháy tỏa năng lượng; cháy đủ oxygen sạch và hiệu quả hơn cháy thiếu oxygen.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Ngọn lửa vàng và muội đen thường báo hiệu cháy không hoàn toàn.","extra":[]}],"searchText":"Một số nhiên liệu Nhiên liệu cháy tỏa năng lượng; cháy đủ oxygen sạch và hiệu quả hơn cháy thiếu oxygen. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Nhiên liệu cháy tỏa năng lượng; cháy đủ oxygen sạch và hiệu quả hơn cháy thiếu oxygen. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Nhiên liệu là gì?\nA. Mọi chất lỏng\nB. Mọi kim loại\nC. Một dụng cụ đo nhiệt độ\nD. Chất cháy được và khi cháy tỏa năng lượng có ích Đáp án theo ngân hàng: D. Chất cháy được và khi cháy tỏa năng lượng có ích. Phương án D phù hợp với kiến thức trọng tâm của bài: Nhiên liệu cháy tỏa năng lượng; cháy đủ oxygen sạch và hiệu quả hơn cháy thiếu oxygen. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Ngọn lửa vàng và muội đen thường báo hiệu cháy không hoàn toàn. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Nhiên liệu cháy tỏa năng lượng; cháy đủ oxygen sạch và hiệu quả hơn cháy thiếu oxygen. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Bếp gas cháy ngọn lửa vàng và có muội đen. Nguyên nhân có thể là gì?\nA. Có quá nhiều oxygen nên không cháy\nB. Thiếu không khí làm gas cháy không hoàn toàn\nC. Bếp không có nhiên liệu\nD. Gas đã biến thành nước Đáp án theo ngân hàng: B. Thiếu không khí làm gas cháy không hoàn toàn. Phương án B phù hợp với kiến thức trọng tâm của bài: Nhiên liệu cháy tỏa năng lượng; cháy đủ oxygen sạch và hiệu quả hơn cháy thiếu oxygen. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Ngọn lửa vàng và muội đen thường báo hiệu cháy không hoàn toàn. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Nhiên liệu cháy tỏa năng lượng; cháy đủ oxygen sạch và hiệu quả hơn cháy thiếu oxygen. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Giữa than đá và năng lượng mặt trời, nguồn nào gây phát thải carbon dioxide trực tiếp khi sử dụng nhiều hơn?\nA. Năng lượng mặt trời\nB. Không nguồn nào\nC. Hai nguồn luôn như nhau\nD. Than đá Đáp án theo ngân hàng: D. Than đá. Phương án D phù hợp với kiến thức trọng tâm của bài: Nhiên liệu cháy tỏa năng lượng; cháy đủ oxygen sạch và hiệu quả hơn cháy thiếu oxygen. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Ngọn lửa vàng và muội đen thường báo hiệu cháy không hoàn toàn."},{"number":15,"title":"Một số lương thực, thực phẩm","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-15","summary":"Bữa ăn cần cân đối tinh bột, protein, lipid, vitamin, khoáng chất, chất xơ và nước.","intro":["Bữa ăn cần cân đối tinh bột, protein, lipid, vitamin, khoáng chất, chất xơ và nước."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Bữa ăn cần cân đối tinh bột, protein, lipid, vitamin, khoáng chất, chất xơ  hòa khi không tan thêm chất. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Hỗn hợp đục hoặc tách lớp không phải dung dịch đồng nhất. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Hỗn hợp gồm nhiều chất; dung dịch là hỗn hợp đồng nhất; bão hòa khi không tan thêm chất. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Cho thêm đường vào cốc nước đến khi đường không tan nữa. Dung dịch lúc này là gì?\nA. Hỗn hợp khí\nB. Nhũ tương\nC. Chất tinh khiết\nD. Dung dịch bão hòa Đáp án theo ngân hàng: D. Dung dịch bão hòa. Phương án D phù hợp với kiến thức trọng tâm của bài: Hỗn hợp gồm nhiều chất; dung dịch là hỗn hợp đồng nhất; bão hòa khi không tan thêm chất. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Hỗn hợp đục hoặc tách lớp không phải dung dịch đồng nhất. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Hỗn hợp gồm nhiều chất; dung dịch là hỗn hợp đồng nhất; bão hòa khi không tan thêm chất. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Khi dầu ăn được lắc mạnh với nước, hỗn hợp đục rồi tách lớp. Điều này cho thấy gì?\nA. Nước là chất rắn\nB. Dầu không tan trong nước và tạo nhũ tương tạm thời\nC. Hai chất tạo chất tinh khiết\nD. Dầu tan hoàn toàn Đáp án theo ngân hàng: B. Dầu không tan trong nước và tạo nhũ tương tạm thời. Phương án B phù hợp với kiến thức trọng tâm của bài: Hỗn hợp gồm nhiều chất; dung dịch là hỗn hợp đồng nhất; bão hòa khi không tan thêm chất. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Hỗn hợp đục hoặc tách lớp không phải dung dịch đồng nhất."},{"number":17,"title":"Tách chất khỏi hỗn hợp","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-17","summary":"Tách chất dựa vào khác biệt kích thước hạt, độ tan, nhiệt độ sôi, khối lượng riêng Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Hỗn hợp gồm cát và muối. Quy trình phù hợp để tách riêng là gì?\nA. Thêm nước hòa tan muối, lọc cát rồi cô cạn dịch lọc\nB. Chỉ rây một lần\nC. Đun khô hỗn hợp ngay để cát bay hơi\nD. Dùng nam châm hút muối Đáp án theo ngân hàng: A. Thêm nước hòa tan muối, lọc cát rồi cô cạn dịch lọc. Phương án A phù hợp với kiến thức trọng tâm của bài: Tách chất dựa vào khác biệt kích thước hạt, độ tan, nhiệt độ sôi, khối lượng riêng hoặc từ tính. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Chọn phương pháp theo tính chất khác nhau của các thành phần, không chọn tùy ý. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Tách chất dựa vào khác biệt kích thước hạt, độ tan, nhiệt độ sôi, khối lượng riêng hoặc từ tính. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Hỗn hợp đậu xanh và bột mì có kích thước hạt khác nhau. Cách tách phù hợp là gì?\nA. Chưng cất\nB. Cô cạn\nC. Rây\nD. Dùng giấy lọc với nước mà không cần thiết Đáp án theo ngân hàng: C. Rây. Phương án C phù hợp với kiến thức trọng tâm của bài: Tách chất dựa vào khác biệt kích thước hạt, độ tan, nhiệt độ sôi, khối lượng riêng hoặc từ tính. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Chọn phương pháp theo tính chất khác nhau của các thành phần, không chọn tùy ý."},{"number":18,"title":"Tế bào – Đơn vị cơ bản của sự sống","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-18","summary":"Tế bào là đơn vị cấu tạo và chức năng cơ bản của cơ thể sống.","intro":["Tế bào là đơn vị cấu tạo và chức năng cơ bản của cơ thể sống."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Tế bào là đơn vị cấu tạo và chức năng cơ bản của cơ thể sống.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Đơ biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Màng kiểm soát trao đổi, tế bào chất là nơi diễn ra hoạt động, nhân chứa vật chất di truyền. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Ba thành phần cơ bản thường có ở tế bào là gì?\nA. Màng tế bào, tế bào chất và vật chất di truyền hoặc nhân\nB. Tim, phổi và dạ dày\nC. Xương, cơ và da\nD. Rễ, thân và lá Đáp án theo ngân hàng: A. Màng tế bào, tế bào chất và vật chất di truyền hoặc nhân. Phương án A phù hợp với kiến thức trọng tâm của bài: Màng kiểm soát trao đổi, tế bào chất là nơi diễn ra hoạt động, nhân chứa vật chất di truyền. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Tế bào thực vật có thành tế bào, lục lạp và không bào lớn; không phải mọi tế bào đều có lục lạp. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Màng kiểm soát trao đổi, tế bào chất là nơi diễn ra hoạt động, nhân chứa vật chất di truyền. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Tế bào lá có nhiều lục lạp hơn tế bào rễ vì sao?\nA. Rễ quang hợp mạnh hơn\nB. Tế bào lá không có nhân\nC. Lá nhận ánh sáng và là nơi quang hợp chủ yếu\nD. Lục lạp giúp rễ hút khoáng Đáp án theo ngân hàng: C. Lá nhận ánh sáng và là nơi quang hợp chủ yếu. Phương án C phù hợp với kiến thức trọng tâm của bài: Màng kiểm soát trao đổi, tế bào chất là nơi diễn ra hoạt động, nhân chứa vật chất di truyền. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Tế bào thực vật có thành tế bào, lục lạp và không bào lớn; không phải mọi tế bào đều có lục lạp. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Màng kiểm soát trao đổi, tế bào chất là nơi diễn ra hoạt động, nhân chứa vật chất di truyền. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Vì sao tế bào biểu bì hành không có nhiều lục lạp?\nA. Củ hành nằm dưới đất, tế bào biểu bì không quang hợp mạnh\nB. Lục lạp chỉ có ở động vật\nC. Nhân ngăn lục lạp hình thành\nD. Tế bào hành không phải tế bào thực vật Đáp án theo ngân hàng: A. Củ hành nằm dưới đất, tế bào biểu bì không quang hợp mạnh. Phương án A phù hợp với kiến thức trọng tâm của bài: Màng kiểm soát trao đổi, tế bào chất là nơi diễn ra hoạt động, nhân chứa vật chất di truyền. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Tế bào thực vật có thành tế bào, lục lạp và không bào lớn; không phải mọi tế bào đều có lục lạp."},{"number":20,"title":"Sự lớn lên và sinh sản của tế bào","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-20","summary":"Cơ thể lớn lên nhờ tế bào tăng kích thước và tăng số lượng qua phân chia.","intro":["Cơ thể lớn lên nhờ tế bào tăng kích thước và tăng số lượng qua phân chia."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Cơ thể lớn lên nhờ tế bào tăng kích thước và tăng số lượng qua phân chia.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Tế bào lớn lên nhờ quá trình nào?\nA. Ngừng mọi hoạt động\nB. Trao đổi chất và tổng hợp các thành phần mới\nC. Không nhận chất từ môi trường\nD. Mất dần tế bào chất","solution":"Đáp án theo ngân hàng: B. Trao đổi chất và tổng hợp các thành phần mới. Phương án B phù hợp với kiến thức trọng tâm của bài: Cơ thể lớn lên nhờ tế bào tăng kích thước và tăng số lượng qua phân chia.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Phân chia mất kiểm soát có thể tạo khối u; tế bào không lớn vô hạn.","extra":[]},{"title":"Dạng 2. Giải thích hiện tượng và tình huống","tip":"Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Cơ thể lớn lên nhờ tế bào tăng kích thước và tăng số lượng qua phân chia.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thô tế bào chất Đáp án theo ngân hàng: B. Trao đổi chất và tổng hợp các thành phần mới. Phương án B phù hợp với kiến thức trọng tâm của bài: Cơ thể lớn lên nhờ tế bào tăng kích thước và tăng số lượng qua phân chia. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Phân chia mất kiểm soát có thể tạo khối u; tế bào không lớn vô hạn. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Cơ thể lớn lên nhờ tế bào tăng kích thước và tăng số lượng qua phân chia. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Một em bé lớn lên nhưng kích thước phần lớn tế bào không tăng vô hạn. Cơ thể lớn lên chủ yếu bằng cách nào?\nA. Chỉ hấp thụ nước\nB. Mỗi tế bào lớn bằng cả cơ thể\nC. Không có tế bào mới\nD. Tăng số lượng tế bào qua phân chia cùng với tế bào lớn lên Đáp án theo ngân hàng: D. Tăng số lượng tế bào qua phân chia cùng với tế bào lớn lên. Phương án D phù hợp với kiến thức trọng tâm của bài: Cơ thể lớn lên nhờ tế bào tăng kích thước và tăng số lượng qua phân chia. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Phân chia mất kiểm soát có thể tạo khối u; tế bào không lớn vô hạn. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Cơ thể lớn lên nhờ tế bào tăng kích thước và tăng số lượng qua phân chia. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Một khối u có thể hình thành khi nào?\nA. Nước trong cơ thể bay hơi\nB. Tế bào phân chia mất kiểm soát\nC. Tế bào ngừng phân chia hoàn toàn\nD. Mọi tế bào co lại Đáp án theo ngân hàng: B. Tế bào phân chia mất kiểm soát. Phương án B phù hợp với kiến thức trọng tâm của bài: Cơ thể lớn lên nhờ tế bào tăng kích thước và tăng số lượng qua phân chia. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Phân chia mất kiểm soát có thể tạo khối u; tế bào không lớn vô hạn."},{"numb ác hoạt động sống.","extra":[]}],"searchText":"Cơ thể sinh vật Cơ thể sống có trao đổi chất, sinh trưởng, sinh sản, cảm ứng và vận động thích hợp. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Cơ thể sống có trao đổi chất, sinh trưởng, sinh sản, cảm ứng và vận động thích hợp. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Cơ thể sinh vật là gì?\nA. Một dụng cụ đo\nB. Một chất tinh khiết\nC. Một vật thể không sống\nD. Một cá thể sống thực hiện các hoạt động sống Đáp án theo ngân hàng: D. Một cá thể sống thực hiện các hoạt động sống. Phương án D phù hợp với kiến thức trọng tâm của bài: Cơ thể sống có trao đổi chất, sinh trưởng, sinh sản, cảm ứng và vận động thích hợp. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Đơn bào và đa bào đều là cơ thể sống nếu thực hiện được các hoạt động sống. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Cơ thể sống có trao đổi chất, sinh trưởng, sinh sản, cảm ứng và vận động thích hợp. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Một sinh vật chỉ có một tế bào nhưng bơi, bắt mồi và sinh sản. Sinh vật đó thuộc nhóm nào?\nA. Vật không sống\nB. Cơ thể đơn bào\nC. Hệ cơ quan\nD. Cơ thể đa bào Đáp án theo ngân hàng: B. Cơ thể đơn bào. Phương án B phù hợp với kiến thức trọng tâm của bài: Cơ thể sống có trao đổi chất, sinh trưởng, sinh sản, cảm ứng và vận động thích hợp. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Đơn bào và đa bào đều là cơ thể sống nếu thực hiện được các hoạt động sống. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Cơ thể sống có trao đổi chất, sinh trưởng, sinh sản, cảm ứng và vận động thích hợp. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Trùng roi hướng về phía ánh sáng thể hiện gì?\nA. Khả năng tạo mô\nB. Khả năng tạo xương\nC. Khả năng đông đặc\nD. Khả năng cảm ứng Đáp án theo ngân hàng: D. Khả năng cảm ứng. Phương án D phù hợp với kiến thức trọng tâm của bài: Cơ thể sống có trao đổi chất, sinh trưởng, sinh sản, cảm ứng và vận động thích hợp. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Đơn bào và đa bào đều là cơ thể sống nếu thực hiện được các hoạt động sống."},{"number":23,"title":"Tổ chức cơ thể đa bào","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-23","summary":"Trật tự tổ chức: tế bào → mô → cơ quan → hệ cơ quan → cơ thể.","intro":["Trật tự tổ chức: tế bào → mô → cơ quan → hệ cơ quan → cơ thể."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Trật tự tổ chức: tế bào → mô → cơ quan → hệ cơ quan → cơ thể.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Cấp tổ chức nhỏ nhất trong cơ thể đa bào là gì?\nA. Tế bào\nB. Cơ quan\nC. Mô\nD. Hệ cơ quan","solution":"Đáp án theo ngân hàng: A. Tế bào. Phương án A phù hợp với kiến thức trọng tâm của bài: Trật tự tổ chức: tế bào → mô → cơ quan → hệ cơ quan → cơ thể.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không đảo cấp tổ chức; một cơ quan thường gồm nhiều loại mô phối hợp.","extra":[]},{"title":"Dạng 2. Giải thích hiện tượng và tình huống","tip":"Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Trật tự tổ chức: tế bào → mô → cơ quan → hệ cơ quan → cơ thể.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Tim gồm mô cơ, mô thần kinh và mô liên kết. Điều này minh họa điều gì?\nA. Tim chỉ là một tế bào\nB. Mô luôn gồm nhiều cơ quan\nC. Một cơ quan được cấu tạo từ nhiều loại mô\nD. Hệ tuần hoàn chỉ có một mô","solution":"Đáp án theo ngân hàng: C. Một cơ quan được cấu tạo từ nhiều loại mô. Phương án C phù hợp với kiến thức trọng tâm của bài: Trật tự tổ chức: tế bào → mô → cơ quan → hệ cơ quan → cơ thể.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không đảo cấp tổ chức; một cơ quan thường gồm nhiều loại mô phối hợp.","extra":[]},{"title":"Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất","tip":"Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Trật tự tổ chức: tế bào → mô → cơ quan → hệ cơ quan → cơ thể.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Nếu mô cơ không co được, hoạt động nào bị ảnh hưởng rõ nhất?\nA. Vận động của cơ thể\nB. Tạo hạt\nC. Quang hợp của lá\nD. Hấp thụ nước ở rễ","solution":"Đáp án theo ngân hàng: A. Vận động của cơ thể. Phương án A phù hợp với kiến thức trọng tâm của bài: Trật tự tổ chức: tế bào → mô → cơ quan → hệ cơ quan → cơ thể.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không đảo cấp tổ chức; một cơ quan thường gồm nhiều loại mô phối hợp.","extra":[]}],"searchText":"Tổ chức cơ thể đa bào Trật tự tổ chức: tế bào → mô → cơ quan → hệ cơ quan → cơ thể. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Trật tự tổ chức: tế bào → mô → cơ quan → hệ cơ quan → cơ thể. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Cấp tổ chức nhỏ nhất trong cơ thể đa bào là gì?\nA. Tế bào\nB. Cơ quan\nC. Mô\nD. Hệ cơ quan Đáp án theo ngân hàng: A. Tế bào. Phương án A phù hợp với kiến thức trọng tâm của bài: Trật tự tổ chức: tế bào → mô → cơ quan → hệ cơ quan → cơ thể. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không đảo cấp tổ chức; một cơ quan thường gồm nhiều loại mô phối hợp. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Trật tự tổ chức: tế bào → mô → cơ quan → hệ cơ quan → cơ thể. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Tim gồm mô cơ, mô thần kinh và mô liên kết. Điều này minh họa điều gì?\nA. Tim chỉ là một tế bào\nB. Mô luôn gồm nhiều cơ quan\nC. Một cơ quan được cấu tạo từ nhiều loại mô\nD. Hệ tuần hoàn chỉ có một mô Đáp án theo ngân hàng: C. Một cơ quan được cấu tạo từ nhiều loại mô. Phương án C phù hợp với kiến thức trọng tâm của bài: Trật tự tổ chức: tế bào → mô → cơ quan → hệ cơ quan → cơ thể. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không đảo cấp tổ chức; một cơ quan thường gồm nhiều loại mô phối hợp. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Trật tự tổ chức: tế bào → mô → cơ quan → hệ cơ quan → cơ thể. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Nếu mô cơ không co được, hoạt động nào bị ảnh hưởng rõ nhất?\nA. Vận động của cơ thể\nB. Tạo hạt\nC. Quang hợp của lá\nD. Hấp thụ nước ở rễ Đáp án theo ngân hàng: A. Vận động của cơ thể. Phương án A phù hợp với kiến thức trọng tâm của bài: Trật tự tổ chức: tế bào → mô → cơ quan → hệ cơ quan → cơ thể. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không đảo cấp tổ chức; một cơ quan thường gồm nhiều loại mô phối hợp."},{"number":24,"title":"Thực hành: Quan sát và mô tả cơ thể đơn bào, cơ thể đa bào","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-24","summary":"Dùng kính hiển vi cho cơ thể đơn bào; kính lúp hoặc mắt thường cho mẫu đa bào lớn.","intro":["Dùng kính hiển vi cho cơ thể đơn bào; kính lúp hoặc mắt thường cho mẫu đa bào lớn."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Dùng kính hiển vi cho cơ thể đơn bào; kính lúp hoặc mắt thường cho mẫu đa bào lớn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Dụng cụ dùng quan sát cơ thể đơn bào trong nước ao là gì?\nA. Nhiệt kế\nB. Kính hiển vi\nC. Thước dây\nD. Cân","solution":"Đáp án theo ngân hàng: B. Kính hiển vi. Phương án B phù hợp với kiến thức trọng tâm của bài: Dùng kính hiển vi cho cơ thể đơn bào; kính lúp hoặc mắt thường cho mẫu đa bào lớn.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Quan sát vật kính nhỏ trước để dễ tìm và theo dõi toàn bộ mẫu.","extra":[]},{"title":"Dạng 2. Giải thích hiện tượng và tình huống","tip":"Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Dùng kính hiển vi cho cơ thể đơn bào; kính lúp hoặc mắt thường cho mẫu đa bào lớn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Quan sát một sinh vật trong giọt nước, chỉ thấy một tế bào tự di chuyển và lấy thức ăn. Kết luận nào đúng?\nA. Đó là một mô\nB. Đó là vật không sống\nC. Đó là hệ cơ quan\nD. Đó là cơ thể đơn bào","solution":"Đáp án theo ngân hàng: D. Đó là cơ thể đơn bào. Phương án D phù hợp với kiến thức trọng tâm của bài: Dùng kính hiển vi cho cơ thể đơn bào; kính lúp hoặc mắt thường cho mẫu đa bào lớn.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Quan sát vật kính nhỏ trước để dễ tìm và theo dõi toàn bộ mẫu.","extra":[]},{"title":"Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất","tip":"Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Dùng kính hiển vi cho cơ thể đơn bào; kính lúp hoặc mắt thường cho mẫu đa bào lớn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Tại sao cần quan sát mẫu ở vật kính nhỏ trước?\nA. Để đo khối lượng\nB. Dễ tìm sinh vật và theo dõi toàn bộ chuyển động\nC. Để mẫu tự lớn lên\nD. Để không cần nguồn sáng","solution":"Đáp án theo ngân hàng: B. Dễ tìm sinh vật và theo dõi toàn bộ chuyển động. Phương án B phù hợp với kiến thức trọng tâm của bài: Dùng kính hiển vi cho cơ thể đơn bào; kính lúp hoặc mắt thường cho mẫu đa bào lớn.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Quan sát vật kính nhỏ trước để dễ tìm và theo dõi toàn bộ mẫu.","extra":[]}],"searchText":"Thực hành: Quan sát và mô tả cơ thể đơn bào, cơ thể đa bào Dùng kính hiển vi cho cơ thể đơn bào; kính lúp hoặc mắt thường cho mẫu đa bào lớn. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Dùng kính hiển vi cho cơ thể đơn bào; kính lúp hoặc mắt thường cho mẫu đa bào lớn. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Dụng cụ dùng quan sát cơ thể đơn bào trong nước ao là gì?\nA. Nhiệt kế\nB. Kính hiển vi\nC. Thước dây\nD. Cân Đáp án theo ngân hàng: B. Kính hiển vi. Phương án B phù hợp với kiến thức trọng tâm của bài: Dùng kính hiển vi cho cơ thể đơn bào; kính lúp hoặc mắt thường cho mẫu đa bào lớn. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Quan sát vật kính nhỏ trước để dễ tìm và theo dõi toàn bộ mẫu. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Dùng kính hiển vi cho cơ thể đơn bào; kính lúp hoặc mắt thường cho mẫu đa bào lớn. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Quan sát một sinh vật trong giọt nước, chỉ thấy một tế bào tự di chuyển và lấy thức ăn. Kết luận nào đúng?\nA. Đó là một mô\nB. Đó là vật không sống\nC. Đó là hệ cơ quan\nD. Đó là cơ thể đơn bào Đáp án theo ngân hàng: D. Đó là cơ thể đơn bào. Phương án D phù hợp với kiến thức trọng tâm của bài: Dùng kính hiển vi cho cơ thể đơn bào; kính lúp hoặc mắt thường cho mẫu đa bào lớn. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Quan sát vật kính nhỏ trước để dễ tìm và theo dõi toàn bộ mẫu. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Dùng kính hiển vi cho cơ thể đơn bào; kính lúp hoặc mắt thường cho mẫu đa bào lớn. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Tại sao cần quan sát mẫu ở vật kính nhỏ trước?\nA. Để đo khối lượng\nB. Dễ tìm sinh vật và theo dõi toàn bộ chuyển động\nC. Để mẫu tự lớn lên\nD. Để không cần nguồn sáng Đáp án theo ngân hàng: B. Dễ tìm sinh vật và theo dõi toàn bộ chuyển động. Phương án B phù hợp với kiến thức trọng tâm của bài: Dùng kính hiển vi cho cơ thể đơn bào; kính lúp hoặc mắt thường cho mẫu đa bào lớn. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Quan sát vật kính nhỏ trước để dễ tìm và theo dõi toàn bộ mẫu."},{"number":25,"title":"Hệ thống phân loại sinh vật","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-25","summary":"Phân loại dựa vào đặc điểm chung; các bậc giúp sắp xếp sinh vật khoa học và thống nhất.","intro":["Phân loại dựa vào đặc điểm chung; các bậc giúp sắp xếp sinh vật khoa học và thống nhất."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Phân loại dựa vào đặc điểm chung; các bậc giúp sắp xếp sinh vật khoa học và thống nhất.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Phân loại sinh vật là gì?\nA. Đo khối lượng sinh vật\nB. Thay đổi môi trường sống\nC. Sắp xếp sinh vật vào các nhóm dựa trên đặc điểm chung\nD. Tạo ra loài mới","solution":"Đáp án theo ngân hàng: C. Sắp xếp sinh vật vào các nhóm dựa trên đặc điểm chung. Phương án C phù hợp với kiến thức trọng tâm của bài: Phân loại dựa vào đặc điểm chung; các bậc giúp sắp xếp sinh vật khoa học và thống nhất.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không xếp sinh vật chỉ theo nơi sống hoặc hình dạng bề ngoài.","extra":[]},{"title":"Dạng 2. Giải thích hiện tượng và tình huống","tip":"Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Phân loại dựa vào đặc điểm chung; các bậc giúp sắp xếp sinh vật khoa học và thống nhất.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Cá voi sống dưới nước nhưng được xếp vào lớp Thú vì sao?\nA. o do chênh lệch nồng độ. Phương án D phù hợp với kiến thức trọng tâm của bài: Nguyên sinh vật là sinh vật nhân thực, phần lớn đơn bào và sống ở môi trường nước hoặc ẩm. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không nhầm bọt khí và hạt bụi với nguyên sinh vật đang chuyển động."},{"number":31,"title":"Thực hành: Quan sát nguyên sinh vật","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-31","summary":"Mẫu nước ao hoặc nước ngâm rơm có thể chứa nguyên sinh vật; quan sát từ vật kính nhỏ.","intro":["Mẫu nước ao hoặc nước ngâm rơm có thể chứa nguyên sinh vật; quan sát từ vật kính nhỏ."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Mẫu nước ao hoặc nước ngâm rơm có thể chứa nguyên sinh vật; quan sát từ vật kính nhỏ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Mẫu thường dùng quan sát nguyên sinh vật là gì?\nA. Nước ao hoặc nước ngâm rơm\nB. Dầu ăn tinh khiết\nC. Cát khô\nD. Nước cất mới","solution":"Đáp án theo ngân hàng: A. Nước ao hoặc nước ngâm rơm. Phương án A phù hợp với kiến thức trọng tâm của bài: Mẫu nước ao hoặc nước ngâm rơm có thể chứa nguyên sinh vật; quan sát từ vật kính nhỏ.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Chuyển động do dòng nước không đủ để kết luận vật thể là sinh vật.","extra":[]},{"title":"Dạng 2. Giải thích hiện tượng và tình huống","tip":"Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Mẫu nước ao hoặc nước ngâm rơm có thể chứa nguyên sinh vật; quan sát từ vật kính nhỏ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Trong trường nhìn thấy vật thể tròn, đứng yên và viền đen. Có thể đó là gì?\nA. Trùng roi chắc chắn\nB. Amip chắc chắn\nC. Bọt khí\nD. Trùng giày chắc chắn","solution":"Đáp án theo ngân hàng: C. Bọt khí. Phương án C phù hợp với kiến thức trọng t át và chụp ảnh tại chỗ. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Quan sát ngoài thiên nhiên cần kế hoạch, ghi chép, bảo đảm an toàn và hạn chế làm hại sinh vật. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Quan sát thấy động vật có ba đôi chân, một đôi râu và hai cánh. Thuộc nhóm nào?\nA. Côn trùng\nB. Hình nhện\nC. Giáp xác\nD. Thú Đáp án theo ngân hàng: A. Côn trùng. Phương án A phù hợp với kiến thức trọng tâm của bài: Quan sát ngoài thiên nhiên cần kế hoạch, ghi chép, bảo đảm an toàn và hạn chế làm hại sinh vật. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không bắt hoặc thu mẫu quá mức khi có thể quan sát và chụp ảnh tại chỗ. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Quan sát ngoài thiên nhiên cần kế hoạch, ghi chép, bảo đảm an toàn và hạn chế làm hại sinh vật. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Một bạn bắt ếch mang về làm mẫu dù không cần thiết. Hành động này không phù hợp vì sao?\nA. Ếch không phải động vật\nB. Không thể quan sát ếch ngoài trời\nC. Gây tổn thương sinh vật và ảnh hưởng quần thể\nD. Bắt mẫu luôn cần thiết Đáp án theo ngân hàng: C. Gây tổn thương sinh vật và ảnh hưởng quần thể. Phương án C phù hợp với kiến thức trọng tâm của bài: Quan sát ngoài thiên nhiên cần kế hoạch, ghi chép, bảo đảm an toàn và hạn chế làm hại sinh vật. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không bắt hoặc thu mẫu quá mức khi có thể quan sát và chụp ảnh tại chỗ."},{"number":38,"title":"Đa dạng sinh học","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-38","summary":"Đa dạng sinh học gồm đa dạng gene, loài và hệ sinh thái; bảo tồn phải gắn với sinh cảnh.","intro":["Đa dạng sinh học gồm đa dạng gene, loài và hệ sinh thái; bảo tồn phải gắn với sinh cảnh." ng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Khảo sát ngoài thiên nhiên cần cùng đơn vị diện tích, cùng thời gian và phương pháp ghi nhận. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Bước đầu của một chuyến tìm hiểu sinh vật là gì?\nA. Xác định mục tiêu và lập kế hoạch\nB. Không cần địa điểm\nC. Bỏ qua an toàn\nD. Thu mẫu ngay Đáp án theo ngân hàng: A. Xác định mục tiêu và lập kế hoạch. Phương án A phù hợp với kiến thức trọng tâm của bài: Khảo sát ngoài thiên nhiên cần cùng đơn vị diện tích, cùng thời gian và phương pháp ghi nhận. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không so trực tiếp số lượng từ các ô khảo sát có diện tích khác nhau. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Khảo sát ngoài thiên nhiên cần cùng đơn vị diện tích, cùng thời gian và phương pháp ghi nhận. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Hai nhóm đếm cây trong ô có diện tích khác nhau. Muốn so sánh, cần làm gì?\nA. So số tuyệt đối ngay\nB. Chỉ so màu cây\nC. Quy đổi số cây trên cùng đơn vị diện tích\nD. Bỏ diện tích Đáp án theo ngân hàng: C. Quy đổi số cây trên cùng đơn vị diện tích. Muốn so sánh mật độ, phải quy số cá thể về cùng một đơn vị diện tích. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không so trực tiếp số lượng từ các ô khảo sát có diện tích khác nhau. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Khảo sát ngoài thiên nhiên cần cùng đơn vị diện tích, cùng thời gian và phương pháp ghi nhận. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Thu quá nhiều mẫu côn trùng có thể gây hậu quả gì?\nA. Ảnh hưởng quần thể và hệ sinh thái\nB. Tạo loài mới\nC. Không ảnh hưởng\nD. Tăng số lượng côn trùng Đáp án theo ngân hàng: A. Ảnh hưởng quần thể và hệ sinh thái. Phương án A phù hợp với kiến thức trọng tâm của bài: Khảo sát ngoài thiên nhiên cần cùng đơn vị diện tích, cùng thời gian và phương pháp ghi nhận. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không so trực tiếp số lượng từ các ô khảo sát có diện tích khác nhau."},{"number":40,"title":"Lực là gì?","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-40","summary":"Lực là tác dụng đẩy hoặc kéo, có thể làm đổi chuyển động hoặc làm vật biến dạng.","intro":["Lực là tác dụng đẩy hoặc kéo, có thể làm đổi chuyển động hoặc làm vật biến dạng."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Lực là tác dụng đẩy hoặc kéo, có thể làm đổi chuyển động hoặc làm vật biến dạng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Lực là gì?\nA. Nhiệt độ của vật\nB. Tác dụng đẩy hoặc kéo của vật này lên vật khác\nC. Thời gian chuyển động\nD. Khối lượng của vật","solution":"Đáp án theo ngân hàng: B. Tác dụng đẩy hoặc kéo của vật này lên vật khác. Phương án B phù hợp với kiến thức trọng tâm của bài: Lực là tác dụng đẩy hoặc kéo, có thể làm đổi chuyển động hoặc làm vật biến dạng.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Phân biệt lực tiếp xúc với lực không tiếp xúc như lực từ và lực hấp dẫn.","extra":[]},{"title":"Dạng 2. Giải thích hiện tượng và tình huống","tip":"Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Lực là tác dụng đẩy hoặc kéo, có thể làm đổi chuyển động hoặc làm vật biến dạng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Một cầu thủ đá quả bóng đang đứng yên. Tác dụng chính của lực đá là gì?\nA. Làm bóng tăng khối lượng\nB. Làm bóng đổi thành chất khác\nC. Làm thời gian dừng lại\nD. Làm bóng bắt đầu chuyển động","solution":"Đáp án theo ngân hàng: D. Làm bóng bắt đầu chuyển động. Phương án D phù hợp với kiến thức trọng tâm của bài: Lực là tác dụng đẩy hoặc kéo, có thể làm đổi chuyển động hoặc làm vật biến dạng.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Phân biệt lực tiếp xúc với lực không tiếp xúc như lực từ và lực hấp dẫn.","extra":[]},{"title":"Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất","tip":"Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Lực là tác dụng đẩy hoặc kéo, có thể làm đổi chuyển động hoặc làm vật biến dạng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Nam châm hút ghim giấy dù chưa chạm. Đây là bằng chứng của loại lực nào?\nA. Lực ma sát trượt\nB. Lực không tiếp xúc\nC. Lực tiếp xúc\nD. Lực cản nước","solution":"Đáp án theo ngân hàng: B. Lực không tiếp xúc. Phương án B phù hợp với kiến thức trọng tâm của bài: Lực là tác dụng đẩy hoặc kéo, có thể làm đổi chuyển động hoặc làm vật biến dạng.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Phân biệt lực tiếp xúc với lực không tiếp xúc như lực từ và lực hấp dẫn.","extra":[]}],"searchText":"Lực là gì? Lực là tác dụng đẩy hoặc kéo, có thể làm đổi chuyển động hoặc làm vật biến dạng. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Lực là tác dụng đẩy hoặc kéo, có thể làm đổi chuyển động hoặc làm vật biến dạng. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Lực là gì?\nA. Nhiệt độ của vật\nB. Tác dụng đẩy hoặc kéo của vật này lên vật khác\nC. Thời gian chuyển động\nD. Khối lượng của vật Đáp án theo ngân hàng: B. Tác dụng đẩy hoặc kéo của vật này lên vật khác. Phương án B phù hợp với kiến thức trọng tâm của bài: Lực là tác dụng đẩy hoặc kéo, có thể làm đổi chuyển động hoặc làm vật biến dạng. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Phân biệt lực tiếp xúc với lực không tiếp xúc như lực từ và lực hấp dẫn. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Lực là tác dụng đẩy hoặc kéo, có thể làm đổi chuyển động hoặc làm vật biến dạng. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Một cầu thủ đá quả bóng đang đứng yên. Tác dụng chính của lực đá là gì?\nA. Làm bóng tăng khối lượng\nB. Làm bóng đổi thành chất khác\nC. Làm thời gian dừng lại\nD. Làm bóng bắt đầu chuyển động Đáp án theo ngân hàng: D. Làm bóng bắt đầu chuyển động. Phương án D phù hợp với kiến thức trọng tâm của bài: Lực là tác dụng đẩy hoặc kéo, có thể làm đổi chuyển động hoặc làm vật biến dạng. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Phân biệt lực tiếp xúc với lực không tiếp xúc như lực từ và lực hấp dẫn. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Lực là tác dụng đẩy hoặc kéo, có thể làm đổi chuyển động hoặc làm vật biến dạng. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Nam châm hút ghim giấy dù chưa chạm. Đây là bằng chứng của loại lực nào?\nA. Lực ma sát trượt\nB. Lực không tiếp xúc\nC. Lực tiếp xúc\nD. Lực cản nước Đáp án theo ngân hàng: B. Lực không tiếp xúc. Phương án B phù hợp với kiến thức trọng tâm của bài: Lực là tác dụng đẩy hoặc kéo, có thể làm đổi chuyển động hoặc làm vật biến dạng. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Phân biệt lực tiếp xúc với lực không tiếp xúc như lực từ và lực hấp dẫn."},{"number":41,"title":"Biểu diễn lực","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-41","summary":"Lực biểu diễn bằng mũi tên: gốc là điểm đặt, phương và chiều là hướng, độ dài biểu thị độ lớn.","intro":["Lực biểu diễn bằng mũi tên: gốc là điểm đặt, phương và chiều là hướng, độ dài biểu thị độ lớn."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Lực biểu diễn bằng mũi tên: gốc là điểm đặt, phương và chiều là hướng, độ dài biểu thị độ lớn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Lực được biểu diễn bằng hình gì?\nA. Hình vuông\nB. Dấu chấm\nC. Mũi tên\nD. Hình tròn","solution":"Đáp án theo ngân hàng: C. Mũi tên. Phương án C phù hợp với kiến thức trọng tâm của bài: Lực biểu diễn bằng mũi tên: gốc là điểm đặt, phương và chiều là hướng, độ dài biểu thị độ lớn.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không vẽ hai lực cân bằng khác độ dài hoặc cùng chiều.","extra":[]},{"title":"Dạng 2. Tính nhanh hoặc đọc số liệu","tip":"Viết công thức hoặc phép đổi đơn vị trước khi nhìn đáp án. Lực biểu diễn bằng mũi tên: gốc là điểm đặt, phương và chiều là hướng, độ dài biểu thị độ lớn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Một lực 8 N kéo vật sang phải, tỉ xích 1 cm ứng 4 N. Mũi tên cần dài và hướng thế nào?\nA. Dài 2 cm, hướng sang phải\nB. Dài 4 cm, hướng sang trái\nC. Dài 0,5 cm, hướng xuống\nD. Dài 8 cm, hướng lên","solution":"Đáp án theo ngân hàng: A. Dài 2 cm, hướng sang phải. Tỉ xích 1 cm ứng với 4 N nên lực 8 N được biểu diễn bằng mũi tên dài 8/4 = 2 cm.","trap":"Kiểm tra đơn vị, phép trừ hoặc hệ số trước khi chọn. Không vẽ hai lực cân bằng khác độ dài hoặc cùng chiều.","extra":[]},{"title":"Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất","tip":"Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Lực biểu diễn bằng mũi tên: gốc là điểm đặt, phương và chiều là hướng, độ dài biểu thị độ lớn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Hai lực cân bằng tác dụng lên vật cần được vẽ thế nào?\nA. Cùng chiều và khác độ dài\nB. Vuông góc và bằng nhau\nC. Cùng phương, ngược chiều và dài bằng nhau\nD. Không có điểm đặt","solution":"Đáp án theo ngân hàng: C. Cùng phương, ngược chiều và dài bằng nhau. Phương án C phù hợp với kiến thức trọng tâm của bài: Lực biểu diễn bằng mũi tên: gốc là điểm đặt, phương và chiều là hướng, độ dài biểu thị độ lớn.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không vẽ hai lực cân bằng khác độ dài hoặc cùng chiều.","extra":[]}],"searchText":"Biểu diễn lực Lực biểu diễn bằng mũi tên: gốc là điểm đặt, phương và chiều là hướng, độ dài biểu thị độ lớn. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Lực biểu diễn bằng mũi tên: gốc là điểm đặt, phương và chiều là hướng, độ dài biểu thị độ lớn. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Lực được biểu diễn bằng hình gì?\nA. Hình vuông\nB. Dấu chấm\nC. Mũi tên\nD. Hình tròn Đáp án theo ngân hàng: C. Mũi tên. Phương án C phù hợp với kiến thức trọng tâm của bài: Lực biểu diễn bằng mũi tên: gốc là điểm đặt, phương và chiều là hướng, độ dài biểu thị độ lớn. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không vẽ hai lực cân bằng khác độ dài hoặc cùng chiều. Dạng 2. Tính nhanh hoặc đọc số liệu Viết công thức hoặc phép đổi đơn vị trước khi nhìn đáp án. Lực biểu diễn bằng mũi tên: gốc là điểm đặt, phương và chiều là hướng, độ dài biểu thị độ lớn. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Một lực 8 N kéo vật sang phải, tỉ xích 1 cm ứng 4 N. Mũi tên cần dài và hướng thế nào?\nA. Dài 2 cm, hướng sang phải\nB. Dài 4 cm, hướng sang trái\nC. Dài 0,5 cm, hướng xuống\nD. Dài 8 cm, hướng lên Đáp án theo ngân hàng: A. Dài 2 cm, hướng sang phải. Tỉ xích 1 cm ứng với 4 N nên lực 8 N được biểu diễn bằng mũi tên dài 8/4 = 2 cm. Kiểm tra đơn vị, phép trừ hoặc hệ số trước khi chọn. Không vẽ hai lực cân bằng khác độ dài hoặc cùng chiều. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Lực biểu diễn bằng mũi tên: gốc là điểm đặt, phương và chiều là hướng, độ dài biểu thị độ lớn. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Hai lực cân bằng tác dụng lên vật cần được vẽ thế nào?\nA. Cùng chiều và khác độ dài\nB. Vuông góc và bằng nhau\nC. Cùng phương, ngược chiều và dài bằng nhau\nD. Không có điểm đặt Đáp án theo ngân hàng: C. Cùng phương, ngược chiều và dài bằng nhau. Phương án C phù hợp với kiến thức trọng tâm của bài: Lực biểu diễn bằng mũi tên: gốc là điểm đặt, phương và chiều là hướng, độ dài biểu thị độ lớn. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không vẽ hai lực cân bằng khác độ dài hoặc cùng chiều."},{"number":42,"title":"Biến dạng của lò xo","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-42","summary":"Độ biến dạng của lò xo bằng chiều dài sau biến dạng trừ chiều dài tự nhiên.","intro":["Độ biến dạng của lò xo bằng chiều dài sau biến dạng trừ chiều dài tự nhiên."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Độ biến dạng của lò xo bằng chiều dài sau biến dạng trừ chiều dài tự nhiên.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Biến dạng là gì?\nA. Sự đổi chất\nB. Sự thay đổi khối lượng\nC. Sự đổi thời gian\nD. Sự thay đổi hình dạng hoặc kích thước của vật","solution":"Đáp án theo ngân hàng: D. Sự thay đổi hình dạng hoặc kích thước của vật. Phương án D phù hợp với kiến thức trọng tâm của bài: Độ biến dạng của lò xo bằng chiều dài sau biến dạng trừ chiều dài tự nhiên.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không treo vật quá giới hạn đàn hồi vì lò xo có thể không trở lại hình dạng ban đầu.","extra":[]},{"title":"Dạng 2. Tính nhanh hoặc đọc số liệu","tip":"Viết công thức hoặc phép đổi đơn vị trước khi nhìn đáp án. Độ biến dạng của lò xo bằng chiều dài sau biến dạng trừ chiều dài tự nhiên.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Lò xo dài tự nhiên 10 cm, khi treo vật dài 14 cm. Độ dãn là bao nhiêu?\nA. 14 cm\nB. 4 cm\nC. 10 cm\nD. 24 cm","solution":"Đáp án theo ngân hàng: B. 4 cm. Độ dãn Δl = l − l₀ = 14 − 10 = 4 cm.","trap":"Kiểm tra đơn vị, phép trừ hoặc hệ số trước khi chọn. Không treo vật quá giới hạn đàn hồi vì lò xo có thể không trở lại hình dạng ban đầu.","extra":[]},{"title":"Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất","tip":"Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Độ biến dạng của lò xo bằng chiều dài sau biến dạng trừ chiều dài tự nhiên.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Lò xo cứng hơn sẽ dãn thế nào dưới cùng lực?\nA. Nhiều hơn\nB. Luôn bằng 0\nC. Đứt chắc chắn\nD. Ít hơn","solution":"Đáp án theo ngân hàng: D. Ít hơn. Phương án D phù hợp với kiến thức trọng tâm của bài: Độ biến dạng của lò xo bằng chiều dài sau biến dạng trừ chiều dài tự nhiên.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không treo vật quá giới hạn đàn hồi vì lò xo có thể không trở lại hình dạng ban đầu.","extra":[]}],"searchText":"Biến dạng của lò xo Độ biến dạng của lò xo bằng chiều dài sau biến dạng trừ chiều dài tự nhiên. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Độ biến dạng của lò xo bằng chiều dài sau biến dạng trừ chiều dài tự nhiên. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Biến dạng là gì?\nA. Sự đổi chất\nB. Sự thay đổi khối lượng\nC. Sự đổi thời gian\nD. Sự thay đổi hình dạng hoặc kích thước của vật Đáp án theo ngân hàng: D. Sự thay đổi hình dạng hoặc kích thước của vật. Phương án D phù hợp với kiến thức trọng tâm của bài: Độ biến dạng của lò xo bằng chiều dài sau biến dạng trừ chiều dài tự nhiên. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không treo vật quá giới hạn đàn hồi vì lò xo có thể không trở lại hình dạng ban đầu. Dạng 2. Tính nhanh hoặc đọc số liệu Viết công thức hoặc phép đổi đơn vị trước khi nhìn đáp án. Độ biến dạng của lò xo bằng chiều dài sau biến dạng trừ chiều dài tự nhiên. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Lò xo dài tự nhiên 10 cm, khi treo vật dài 14 cm. Độ dãn là bao nhiêu?\nA. 14 cm\nB. 4 cm\nC. 10 cm\nD. 24 cm Đáp án theo ngân hàng: B. 4 cm. Độ dãn Δl = l − l₀ = 14 − 10 = 4 cm. Kiểm tra đơn vị, phép trừ hoặc hệ số trước khi chọn. Không treo vật quá giới hạn đàn hồi vì lò xo có thể không trở lại hình dạng ban đầu. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Độ biến dạng của lò xo bằng chiều dài sau biến dạng trừ chiều dài tự nhiên. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Lò xo cứng hơn sẽ dãn thế nào dưới cùng lực?\nA. Nhiều hơn\nB. Luôn bằng 0\nC. Đứt chắc chắn\nD. Ít hơn Đáp án theo ngân hàng: D. Ít hơn. Phương án D phù hợp với kiến thức trọng tâm của bài: Độ biến dạng của lò xo bằng chiều dài sau biến dạng trừ chiều dài tự nhiên. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không treo vật quá giới hạn đàn hồi vì lò xo có thể không trở lại hình dạng ban đầu."},{"number":43,"title":"Trọng lượng, lực hấp dẫn","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-43","summary":"Khối lượng đo bằng kg; trọng lượng là lực, đo bằng N và gần mặt đất P ≈ 10m.","intro":["Khối lượng đo bằng kg; trọng lượng là lực, đo bằng N và gần mặt đất P ≈ 10m."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Khối lượng đo bằng kg; trọng lượng là lực, đo bằng N và gần mặt đất P ≈ 10m.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Lực hấp dẫn là gì?\nA. Lực hút giữa các vật có khối lượng\nB. Lực đẩy của lò xo\nC. Lực chỉ xuất hiện khi tiếp xúc\nD. Lực ma sát","solution":"Đáp án theo ngân hàng: A. Lực hút giữa các vật có khối lượng. Phương án A phù hợp với kiến thức trọng tâm của bài: Khối lượng đo bằng kg; trọng lượng là lực, đo bằng N và gần mặt đất P ≈ 10m.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Câu nói chuyển động trong nước\nD. Vật đứng yên trên bàn Đáp án theo ngân hàng: C. Vật chuyển động trong nước. Phương án C phù hợp với kiến thức trọng tâm của bài: Vật chuyển động trong nước chịu lực cản; hình thuôn và diện tích cản nhỏ giúp giảm lực cản. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Chở quá tải làm thuyền chìm sâu, tăng lực cản và nguy cơ mất an toàn. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Vật chuyển động trong nước chịu lực cản; hình thuôn và diện tích cản nhỏ giúp giảm lực cản. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Người bơi thu gọn đầu và tay thành tư thế mũi tên khi lao nước. Mục đích là gì?\nA. Giảm diện tích cản và lực cản nước\nB. Tăng lực cản\nC. Giảm trọng lượng\nD. Tạo lực từ Đáp án theo ngân hàng: A. Giảm diện tích cản và lực cản nước. Phương án A phù hợp với kiến thức trọng tâm của bài: Vật chuyển động trong nước chịu lực cản; hình thuôn và diện tích cản nhỏ giúp giảm lực cản. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Chở quá tải làm thuyền chìm sâu, tăng lực cản và nguy cơ mất an toàn. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Vật chuyển động trong nước chịu lực cản; hình thuôn và diện tích cản nhỏ giúp giảm lực cản. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Thuyền chở quá nhiều hàng chìm sâu hơn và có thể tốn nhiên liệu hơn vì sao?\nA. Trọng lượng giảm\nB. Động cơ tự yếu đi không liên quan\nC. Diện tích tiếp xúc và lực cản nước tăng\nD. Nước không cản thuyền Đáp án theo ngân hàng: C. Diện tích tiếp xúc và lực cản nước tăng. Phương án C phù hợp với kiến thức trọng tâm của bài: Vật chuyển động trong nước chịu lực cản; hình thuôn và diện tích cản nhỏ giúp giảm lực cản. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Chở quá tải l ển hóa năng lượng là sự biến đổi giữa các dạng; tổng năng lượng được bảo toàn. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Chuyển hóa năng lượng là sự biến đổi giữa các dạng; tổng năng lượng được bảo toàn. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Chuyển hóa năng lượng là gì?\nA. Sự đổi đơn vị\nB. Sự biến đổi từ dạng năng lượng này sang dạng khác\nC. Sự mất hoàn toàn năng lượng\nD. Sự thay đổi khối lượng Đáp án theo ngân hàng: B. Sự biến đổi từ dạng năng lượng này sang dạng khác. Phương án B phù hợp với kiến thức trọng tâm của bài: Chuyển hóa năng lượng là sự biến đổi giữa các dạng; tổng năng lượng được bảo toàn. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Thiết bị thường tạo cả năng lượng có ích và nhiệt năng không mong muốn. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Chuyển hóa năng lượng là sự biến đổi giữa các dạng; tổng năng lượng được bảo toàn. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Đèn pin dùng pin phát sáng. Chuỗi chuyển hóa đúng là gì?\nA. Quang năng → hóa năng → điện năng\nB. Nhiệt năng → thế năng → khối lượng\nC. Động năng → hóa năng duy nhất\nD. Hóa năng → điện năng → quang năng và nhiệt năng Đáp án theo ngân hàng: D. Hóa năng → điện năng → quang năng và nhiệt năng. Phương án D phù hợp với kiến thức trọng tâm của bài: Chuyển hóa năng lượng là sự biến đổi giữa các dạng; tổng năng lượng được bảo toàn. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Thiết bị thường tạo cả năng lượng có ích và nhiệt năng không mong muốn. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Chuyển hóa năng lượng là sự biến đổi giữa các dạng; tổng năng lượng được bảo toàn. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Cây gỗ cháy trong bếp. Hóa năng chuyển thành gì?\nA. Không chuyển hóa\nB. Nhiệt năng và quang năng\nC. Chỉ điện năng\nD. Chỉ thế năng Đáp án theo ngân hàng: B. Nhiệt năng và quang năng. Phương án B phù hợp với kiến thức trọng tâm của bài: Chuyển hóa năng lượng là sự biến đổi giữa các dạng; tổng năng lượng được bảo toàn. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Thiết bị thường tạo cả năng lượng có ích và nhiệt năng không mong muốn."},{"number":49,"title":"Năng lượng hao phí","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-49","summary":"Năng lượng hao phí là phần chuyển sang dạng không phục vụ mục đích chính; hiệu quả cao nghĩa là hao phí ít.","intro":["Năng lượng hao phí là phần chuyển sang dạng không phục vụ mục đích chính; hiệu quả cao nghĩa là hao phí ít."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Năng lượng hao phí là phần chuyển sang dạng không phục vụ mục đích chính; hiệu quả cao nghĩa là hao phí ít.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Năng lượng hao phí là gì?\nA. Khối lượng bị mất\nB. Năng lượng có ích duy nhất\nC. Phần năng lượng chuyển thành dạng không mong muốn cho mục đích sử dụng\nD. Năng lượng biến mất hoàn toàn","solution":"Đáp án theo ngân hàng: C. Phần năng lượng chuyển thành dạng không mong muốn cho mục đích sử dụng. Phương án C phù hợp với kiến thức trọng tâm của bài: Năng lượng hao phí là phần chuyển sang dạng không phục vụ mục đích chính; hiệu quả cao nghĩa là hao phí ít.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không coi năng lượng hao phí là biến mất; nó thường tỏa ra môi trường dưới dạng nhiệt hoặc âm.","extra":[]},{"title":"Dạng 2. Giải thích hiện tượng và tình huống","tip":"Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Năng lượng hao phí là phần chuyển sang dạng không phục vụ mục đích chính; hiệu quả cao nghĩa là hao phí ít.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Bóng đèn nhận 100 J điện năng, tạo 20 J ánh sáng có ích. Năng lượng còn lại chủ yếu là gì?\nA. 80 J chuyển thành nhiệt và dạng hao phí khác\nB. 120 J ánh sáng\nC. 100 J khối lượng\nD. 20 J bị mất hoàn toàn","solution":"Đáp án theo ngân hàng: A. 80 J chuyển thành nhiệt và dạng hao phí khác. Phần còn lại là 100 − 20 = 80 J, chủ yếu chuyển thành nhiệt và các dạng hao phí khác.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không coi năng lượng hao phí là biến mất; nó thường tỏa ra môi trường dưới dạng nhiệt hoặc âm.","extra":[]},{"title":"Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất","tip":"Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Năng lượng hao phí là phần chuyển sang dạng không phục vụ mục đích chính; hiệu quả cao nghĩa là hao phí ít.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Hai đèn cùng độ sáng, đèn A 10 W và đèn B 60 W. Đèn nào hiệu quả hơn về điện năng?\nA. Hai đèn như nhau vì cùng sáng\nB. Đèn B\nC. Đèn A\nD. Không thể nói gì về công suất","solution":"Đáp án theo ngân hàng: C. Đèn A. Phương án C phù hợp với kiến thức trọng tâm của bài: Năng lượng hao phí là phần chuyển sang dạng không phục vụ mục đích chính; hiệu quả cao nghĩa là hao phí ít.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không coi năng lượng hao phí là biến mất; nó thường tỏa ra môi trường dưới dạng nhiệt hoặc âm.","extra":[]}],"searchText":"Năng lượng hao phí Năng lượng hao phí là phần chuyển sang dạng không phục vụ mục đích chính; hiệu quả cao nghĩa là hao phí ít. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Năng lượng hao phí là phần chuyển sang dạng không phục vụ mục đích chính; hiệu quả cao nghĩa là hao phí ít. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Năng lượng hao phí là gì?\nA. Khối lượng bị mất\nB. Năng lượng có ích duy nhất\nC. Phần năng lượng chuyển thành dạng không mong muốn cho mục đích sử dụng\nD. Năng lượng biến mất hoàn toàn Đáp án theo ngân hàng: C. Phần năng lượng chuyển thành dạng không mong muốn cho mục đích sử dụng. Phương án C phù hợp với kiến thức trọng tâm của bài: Năng lượng hao phí là phần chuyển sang dạng không phục vụ mục đích chính; hiệu quả cao nghĩa là hao phí ít. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không coi năng lượng hao phí là biến mất; nó thường tỏa ra môi trường dưới dạng nhiệt hoặc âm. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Năng lượng hao phí là phần chuyển sang dạng không phục vụ mục đích chính; hiệu quả cao nghĩa là hao phí ít. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Bóng đèn nhận 100 J điện năng, tạo 20 J ánh sáng có ích. Năng lượng còn lại chủ yếu là gì?\nA. 80 J chuyển thành nhiệt và dạng hao phí khác\nB. 120 J ánh sáng\nC. 100 J khối lượng\nD. 20 J bị mất hoàn toàn Đáp án theo ngân hàng: A. 80 J chuyển thành nhiệt và dạng hao phí khác. Phần còn lại là 100 − 20 = 80 J, chủ yếu chuyển thành nhiệt và các dạng hao phí khác. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không coi năng lượng hao phí là biến mất; nó thường tỏa ra môi trường dưới dạng nhiệt hoặc âm. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Năng lượng hao phí là phần chuyển sang dạng không phục vụ mục đích chính; hiệu quả cao nghĩa là hao phí ít. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Hai đèn cùng độ sáng, đèn A 10 W và đèn B 60 W. Đèn nào hiệu quả hơn về điện năng?\nA. Hai đèn như nhau vì cùng sáng\nB. Đèn B\nC. Đèn A\nD. Không thể nói gì về công suất Đáp án theo ngân hàng: C. Đèn A. Phương án C phù hợp với kiến thức trọng tâm của bài: Năng lượng hao phí là phần chuyển sang dạng không phục vụ mục đích chính; hiệu quả cao nghĩa là hao phí ít. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không coi năng lượng hao phí là biến mất; nó thường tỏa ra môi trường dưới dạng nhiệt hoặc âm."},{"number":50,"title":"Năng lượng tái tạo","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-50","summary":"Năng lượng Mặt Trời, gió, nước và sinh khối có thể tái tạo nếu khai thác bền vững.","intro":["Năng lượng Mặt Trời, gió, nước và sinh khối có thể tái tạo nếu khai thác bền vững."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Năng lượng Mặt Trời, gió, nước và sinh khối có thể tái tạo nếu khai thác bền vững.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Năng lượng tái tạo là gì?\nA. Chỉ dầu mỏ\nB. Nguồn cạn kiệt không thể phục hồi\nC. Chỉ than đá\nD. Nguồn năng lượng được bổ sung tự nhiên trong thời gian tương đối ngắn","solution":"Đáp án theo ngân hàng: D. Nguồn năng lượng được bổ sung tự nhiên trong thời gian tương đối ngắn. Phương án D phù hợp với kiến thức trọng tâm của bài: Năng lượng Mặt Trời, gió, nước và sinh khối có thể tái tạo nếu khai thác bền vững.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Tái tạo không có nghĩa là không gây tác động môi trường hoặc có thể khai thác vô hạn.","extra":[]},{"title":"Dạng 2. Giải thích hiện tượng và tình huống","tip":"Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Năng lượng Mặt Trời, gió, nước và sinh khối có thể tái tạo nếu khai thác bền vững.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Một vùng nhiều nắng quanh năm phù hợp phát triển nguồn nào?\nA. Dầu mỏ\nB. Điện mặt trời\nC. Khí đốt\nD. Điện than","solution":"Đáp án theo ngân hàng: B. Điện mặt trời. Phương án B phù hợp với kiến thức trọng tâm của ều hòa mở cửa liên tục làm tốn điện vì sao?\nA. Cửa làm giảm khối lượng phòng\nB. Điều hòa không truyền nhiệt\nC. Không khí lạnh thoát ra và nhiệt bên ngoài vào\nD. Máy tạo thêm điện Đáp án theo ngân hàng: C. Không khí lạnh thoát ra và nhiệt bên ngoài vào. Phương án C phù hợp với kiến thức trọng tâm của bài: Tiết kiệm năng lượng là giảm lãng phí nhưng vẫn đáp ứng nhu cầu bằng thiết bị và thói quen hợp lí. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không đánh đồng tiết kiệm với ngừng sử dụng hoàn toàn. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Tiết kiệm năng lượng là giảm lãng phí nhưng vẫn đáp ứng nhu cầu bằng thiết bị và thói quen hợp lí. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Nồi áp suất có thể tiết kiệm năng lượng vì sao?\nA. Nấu nhanh hơn và giảm thời gian cấp nhiệt\nB. Mở nắp liên tục\nC. Làm thức ăn không chín\nD. Tăng bay hơi Đáp án theo ngân hàng: A. Nấu nhanh hơn và giảm thời gian cấp nhiệt. Phương án A phù hợp với kiến thức trọng tâm của bài: Tiết kiệm năng lượng là giảm lãng phí nhưng vẫn đáp ứng nhu cầu bằng thiết bị và thói quen hợp lí. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không đánh đồng tiết kiệm với ngừng sử dụng hoàn toàn."},{"number":52,"title":"Chuyển động nhìn thấy của Mặt Trời. Thiên thể","subject":"Trái Đất và bầu trời","subjectKey":"earth","shortSubject":"Vũ trụ","slug":"bai-52","summary":"Mặt Trời biểu kiến mọc Đông, lặn Tây do Trái Đất tự quay; hành tinh phản xạ ánh sáng Mặt Trời.","intro":["Mặt Trời biểu kiến mọc Đông, lặn Tây do Trái Đất tự quay; hành tinh phản xạ ánh sáng Mặt Trời."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Mặt Trời biểu kiến mọc Đông, lặn Tây do Trái Đất tự quay; hành tinh phản xạ ánh sáng Mặt Trời.","example":"Đề bài tham khảo từ n hủ yếu”, “đúng nhất”, “không”. Bóng đổ ngược hướng với nguồn sáng và chuyển đổi trong ngày. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Mặt Trời biểu kiến mọc Đông, lặn Tây do Trái Đất tự quay; hành tinh phản xạ ánh sáng Mặt Trời. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Sao Kim sáng trên bầu trời nhưng không phải ngôi sao. Vì sao?\nA. Sao Kim là vệ tinh của Trái Đất\nB. Sao Kim là hành tinh phản xạ ánh sáng Mặt Trời\nC. Sao Kim là thiên hà\nD. Sao Kim tự phát sáng mạnh hơn Mặt Trời Đáp án theo ngân hàng: B. Sao Kim là hành tinh phản xạ ánh sáng Mặt Trời. Phương án B phù hợp với kiến thức trọng tâm của bài: Mặt Trời biểu kiến mọc Đông, lặn Tây do Trái Đất tự quay; hành tinh phản xạ ánh sáng Mặt Trời. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Bóng đổ ngược hướng với nguồn sáng và chuyển đổi trong ngày."},{"number":53,"title":"Mặt Trăng","subject":"Trái Đất và bầu trời","subjectKey":"earth","shortSubject":"Vũ trụ","slug":"bai-53","summary":"Mặt Trăng là vệ tinh tự nhiên; pha trăng do phần được chiếu sáng nhìn thấy thay đổi.","intro":["Mặt Trăng là vệ tinh tự nhiên; pha trăng do phần được chiếu sáng nhìn thấy thay đổi."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Mặt Trăng là vệ tinh tự nhiên; pha trăng do phần được chiếu sáng nhìn thấy thay đổi.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Mặt Trăng là gì đối với Trái Đất?\nA. Thiên hà\nB. Hành tinh\nC. Vệ tinh tự nhiên\nD. Ngôi sao","solution":"Đáp án theo ngân hàng: C. Vệ tinh tự nhiên. Phương án C phù hợp với kiến thức trọng tâm của bài: Mặt Trăng là vệ tinh tự nhiên; pha trăng do phần được chiếu sáng nhìn thấy thay đổi.","trap":"Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Pha trăng không do bóng Trái Đất, trừ hiện tượng nguyệt thực.","ext Thông hiểu): Thứ tự đúng của bốn hành tinh đầu tiên từ Mặt Trời là gì?\nA. Sao Hỏa → Trái Đất → Sao Kim → Sao Thủy\nB. Sao Thủy → Sao Kim → Trái Đất → Sao Hỏa\nC. Sao Kim → Sao Thủy → Sao Hỏa → Trái Đất\nD. Trái Đất → Sao Kim → Sao Thủy → Sao Hỏa Đáp án theo ngân hàng: B. Sao Thủy → Sao Kim → Trái Đất → Sao Hỏa. Phương án B phù hợp với kiến thức trọng tâm của bài: Hệ Mặt Trời gồm Mặt Trời và các thiên thể chuyển động quanh nó; hành tinh sắp theo khoảng cách. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Sao băng là vệt sáng khi vật thể nhỏ đi vào khí quyển, không phải một ngôi sao rơi. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Hệ Mặt Trời gồm Mặt Trời và các thiên thể chuyển động quanh nó; hành tinh sắp theo khoảng cách. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Nếu một vật thể nhỏ đi vào khí quyển Trái Đất và phát sáng, hiện tượng gọi là gì?\nA. Nhật thực\nB. Hành tinh mới\nC. Nguyệt thực\nD. Sao băng Đáp án theo ngân hàng: D. Sao băng. Phương án D phù hợp với kiến thức trọng tâm của bài: Hệ Mặt Trời gồm Mặt Trời và các thiên thể chuyển động quanh nó; hành tinh sắp theo khoảng cách. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Sao băng là vệt sáng khi vật thể nhỏ đi vào khí quyển, không phải một ngôi sao rơi."},{"number":55,"title":"Ngân Hà","subject":"Trái Đất và bầu trời","subjectKey":"earth","shortSubject":"Vũ trụ","slug":"bai-55","summary":"Ngân Hà là thiên hà chứa Hệ Mặt Trời; lực hấp dẫn giữ các sao chuyển động quanh tâm thiên hà.","intro":["Ngân Hà là thiên hà chứa Hệ Mặt Trời; lực hấp dẫn giữ các sao chuyển động quanh tâm thiên hà."],"forms":[{"title":"Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm","tip":"Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Ngân Hà là thiên hà chứa Hệ Mặt Trời; lực hấp dẫn giữ các sao chuyển động quanh tâm thiên hà.","example":"Đề b
