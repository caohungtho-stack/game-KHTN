 8,5 gam sodium nitrate (NaNO3). Nồng độ mol của dung dịch là\nA. 0,2M.\nB. 0,3M.\nC. 0,4M.\nD. 0,5M. Theo đáp án của ngân hàng: chọn D. 0,5M. nNaNO3 = 8,5/85 = 0,1 mol; V = 0,2 L; CM = 0,5 M. Không để thể tích ở đơn vị mL khi thay vào công thức. Dạng 3. Tính độ tan Khối lượng đã tan = khối lượng cho vào − khối lượng còn lại; S = m tan/m nước × 100. Đề bài tham khảo từ ngân hàng:\nCâu 22: Ở nhiệt độ 25 oC, khi cho 12 gam muối X vào 20 gam nước, khuấy kĩ thì còn lại 5 gam muối không tan. Tính độ tan của muối X.\nA. 35\nB. 36\nC. 37\nD. 38 Theo đáp án của ngân hàng: chọn A. 35 m tan = 12 − 5 = 7 g; S = 7/20 × 100 = 35 g/100 g nước. Không dùng toàn bộ khối lượng chất rắn ban đầu nếu còn chất không tan."},{"number":5,"title":"ĐỊNH LUẬT BẢO TOÀN KHỐI LƯỢNG VÀ PHƯƠNG TRÌNH HÓA HỌC.","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-5","summary":"Bảo toàn khối lượng và phương trình hóa học","intro":["Bảo toàn khối lượng và phương trình hóa học"],"forms":[{"title":"Dạng 1. Áp dụng định luật bảo toàn khối lượng","tip":"Tổng khối lượng chất tham gia bằng tổng khối lượng sản phẩm trong hệ kín.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 10: Lưu huỳnh cháy theo sơ đồ phản ứng sau: Sulfur + khí oxygen → sulfur dioxide Nếu đốt cháy 48 gam sulfur và thu được 96 gam sulfur dioxide thì khối lượng oxygen đã tham gia vào phản ứng là:\nA. 40 gam\nB. 44 gam\nC. 48 gam\nD. 52 gam","solution":"Theo đáp án của ngân hàng: chọn C. 48 gam mO2 = 96 − 48 = 48 g.","trap":"Nếu khí thoát ra mà chỉ cân phần chất rắn hoặc dung dịch còn lại thì khối lượng đo được có thể giảm.","extra":[]},{"title":"Dạng 2. Cân bằng phương trình hóa học","tip":"Đặt hệ số nguyên tối giản sao cho số nguyên tử mỗi nguyên tố ở hai vế bằng nhau.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 13: Phương trình đúng của phosphorus cháy trong không khí, biết sản phẩm tạo thành là P2O5\nA. P + O2 → P2O5\nB. 4P + 5O2 → 2P2O5\nC. P + 2O2 → P2O5\nD. P + O2 → P2O3","solution":"Theo đáp án của ngân hàng: chọn B. 4P + 5O2 → 2P2O5 Đặt hệ số nguyên tối giản sao cho số nguyên tử mỗi nguyên tố ở hai vế bằng nhau.","trap":"Không được thay đổi chỉ số trong công thức hóa học của chất.","extra":[]},{"title":"Dạng 3. Tính hiệu suất phản ứng","tip":"H% = lượng thực tế/lượng lí thuyết × 100%; phải tính lượng lí thuyết theo phương trình trước.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20: Trộn 10,8 gam bột nhôm (alminium) với bột lưu huỳnh (sulfur) dư. Cho hỗn hợp vào ống nghiệm và đun nóng để phản ứng xảy ra thu được 25,5 gam Al2S3. Tính hiệu suất phản ứng ?\nA. 85%\nB. 80%\nC. 90%\nD. 92%","solution":"Theo đáp án của ngân hàng: chọn A. 85% Từ 10,8 g Al suy ra lượng Al2S3 lí thuyết; so với 25,5 g thực tế để được 85%.","trap":"Không lấy lượng chất phản ứng ban đầu chia trực tiếp cho sản phẩm thực tế.","extra":[]}],"searchText":"ĐỊNH LUẬT BẢO TOÀN KHỐI LƯỢNG VÀ PHƯƠNG TRÌNH HÓA HỌC. Bảo toàn khối lượng và phương trình hóa học Dạng 1. Áp dụng định luật bảo toàn khối lượng Tổng khối lượng chất tham gia bằng tổng khối lượng sản phẩm trong hệ kín. Đề bài tham khảo từ ngân hàng:\nCâu 10: Lưu huỳnh cháy theo sơ đồ phản ứng sau: Sulfur + khí oxygen → sulfur dioxide Nếu đốt cháy 48 gam sulfur và thu được 96 gam sulfur dioxide thì khối lượng oxygen đã tham gia vào phản ứng là:\nA. 40 gam\nB. 44 gam\nC. 48 gam\nD. 52 gam Theo đáp án của ngân hàng: chọn C. 48 gam mO2 = 96 − 48 = 48 g. Nếu khí thoát ra mà chỉ cân phần chất rắn hoặc dung dịch còn lại thì khối lượng đo được có thể giảm. Dạng 2. Cân bằng phương trình hóa học Đặt hệ số nguyên tối giản sao cho số nguyên tử mỗi nguyên tố ở hai vế bằng nhau. Đề bài tham khảo từ ngân hàng:\nCâu 13: Phương trình đúng của phosphorus cháy trong không khí, biết sản phẩm tạo thành là P2O5\nA. P + O2 → P2O5\nB. 4P + 5O2 → 2P2O5\nC. P + 2O2 → P2O5\nD. P + O2 → P2O3 Theo đáp án của ngân hàng: chọn B. 4P + 5O2 → 2P2O5 Đặt hệ số nguyên tối giản sao cho số nguyên tử mỗi nguyên tố ở hai vế bằng nhau. Không được thay đổi chỉ số trong công thức hóa học của chất. Dạng 3. Tính hiệu suất phản ứng H% = lượng thực tế/lượng lí thuyết × 100%; phải tính lượng lí thuyết theo phương trình trước. Đề bài tham khảo từ ngân hàng:\nCâu 20: Trộn 10,8 gam bột nhôm (alminium) với bột lưu huỳnh (sulfur) dư. Cho hỗn hợp vào ống nghiệm và đun nóng để phản ứng xảy ra thu được 25,5 gam Al2S3. Tính hiệu suất phản ứng ?\nA. 85%\nB. 80%\nC. 90%\nD. 92% Theo đáp án của ngân hàng: chọn A. 85% Từ 10,8 g Al suy ra lượng Al2S3 lí thuyết; so với 25,5 g thực tế để được 85%. Không lấy lượng chất phản ứng ban đầu chia trực tiếp cho sản phẩm thực tế."},{"number":6,"title":"TÍNH THEO PHƯƠNG TRÌNH HÓA HỌC.","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-6","summary":"Tính toán theo phương trình hóa học","intro":["Tính toán theo phương trình hóa học"],"forms":[{"title":"Dạng 1. Tính thể tích khí theo phương trình","tip":"Quy trình: cân bằng phương trình → đổi dữ kiện về mol → dùng tỉ lệ hệ số → đổi sang thể tích.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1: Để đốt cháy hết 3,1 gam P cần dùng V lít khí oxygen (đktc), biết phản ứng sinh ra chất rắn là P2O5. Giá trị của V là\nA. 1,4 lít.\nB. 2,24 lít.\nC. 3,36 lít.\nD. 2,8 lít.","solution":"Theo đáp án của ngân hàng: chọn D. 2,8 lít. 4P + 5O2 → 2P2O5; nP = 3,1/31 = 0,1 mol; nO2 = 0,125 mol; V = 2,8 L theo 22,4 L/mol của câu nguồn.","trap":"Không bỏ bước cân bằng phương trình.","extra":[]},{"title":"Dạng 2. Xác định chất dư – chất hết","tip":"Tính n/hệ số của từng chất; giá trị nhỏ hơn quyết định chất giới hạn, chất kia còn dư.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 14: Cho 8,45g zinc (Zn) tác dụng với 5,376 lít khí Chlorine (đktc). Hỏi chất nào sau phản ứng còn dư\nA. Zn.\nB. Clo.\nC. Cả 2 chất.\nD. Không có chất dư","solution":"Theo đáp án của ngân hàng: chọn B. Clo. Tính n/hệ số của từng chất; giá trị nhỏ hơn quyết định chất giới hạn, chất kia còn dư.","trap":"Không so sánh trực tiếp khối lượng hoặc số mol khi hệ số khác nhau.","extra":[]},{"title":"Dạng 3. Tính lượng chất từ tỉ lệ mol","tip":"Đọc tỉ lệ hệ số trực tiếp từ phương trình đã cân bằng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 15: Cho phương trình hóa học: 2Al + 6HCl → 2AlCl3 + 3H2. Để thu được 6,72 lít khí H2 ở đktc cần bao nhiêu mol Al\nA. 0,3 mol.\nB. 0,1 mol.\nC. 0,2 mol.\nD. 0,5 mol.","solution":"Theo đáp án của ngân hàng: chọn C. 0,2 mol. 2Al tạo 3H2; 6,72 L H2 ở đktc tương ứng 0,3 mol, nên nAl = 0,2 mol.","trap":"Không dùng tỉ lệ khối lượng thay cho tỉ lệ mol.","extra":[]}],"searchText":"TÍNH THEO PHƯƠNG TRÌNH HÓA HỌC. Tính toán theo phương trình hóa học Dạng 1. Tính thể tích khí theo phương trình Quy trình: cân bằng phương trình → đổi dữ kiện về mol → dùng tỉ lệ hệ số → đổi sang thể tích. Đề bài tham khảo từ ngân hàng:\nCâu 1: Để đốt cháy hết 3,1 gam P cần dùng V lít khí oxygen (đktc), biết phản ứng sinh ra chất rắn là P2O5. Giá trị của V là\nA. 1,4 lít.\nB. 2,24 lít.\nC. 3,36 lít.\nD. 2,8 lít. Theo đáp án của ngân hàng: chọn D. 2,8 lít. 4P + 5O2 → 2P2O5; nP = 3,1/31 = 0,1 mol; nO2 = 0,125 mol; V = 2,8 L theo 22,4 L/mol của câu nguồn. Không bỏ bước cân bằng phương trình. Dạng 2. Xác định chất dư – chất hết Tính n/hệ số của từng chất; giá trị nhỏ hơn quyết định chất giới hạn, chất kia còn dư. Đề bài tham khảo từ ngân hàng:\nCâu 14: Cho 8,45g zinc (Zn) tác dụng với 5,376 lít khí Chlorine (đktc). Hỏi chất nào sau phản ứng còn dư\nA. Zn.\nB. Clo.\nC. Cả 2 chất.\nD. Không có chất dư Theo đáp án của ngân hàng: chọn B. Clo. Tính n/hệ số của từng chất; giá trị nhỏ hơn quyết định chất giới hạn, chất kia còn dư. Không so sánh trực tiếp khối lượng hoặc số mol khi hệ số khác nhau. Dạng 3. Tính lượng chất từ tỉ lệ mol Đọc tỉ lệ hệ số trực tiếp từ phương trình đã cân bằng. Đề bài tham khảo từ ngân hàng:\nCâu 15: Cho phương trình hóa học: 2Al + 6HCl → 2AlCl3 + 3H2. Để thu được 6,72 lít khí H2 ở đktc cần bao nhiêu mol Al\nA. 0,3 mol.\nB. 0,1 mol.\nC. 0,2 mol.\nD. 0,5 mol. Theo đáp án của ngân hàng: chọn C. 0,2 mol. 2Al tạo 3H2; 6,72 L H2 ở đktc tương ứng 0,3 mol, nên nAl = 0,2 mol. Không dùng tỉ lệ khối lượng thay cho tỉ lệ mol."},{"number":7,"title":"TỐC ĐỘ PHẢN ỨNG VÀ CHẤT XÚC TÁC.","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-7","summary":"Tốc độ phản ứng và chất xúc tác","intro":["Tốc độ phản ứng và chất xúc tác"],"forms":[{"title":"Dạng 1. Ảnh hưởng của diện tích tiếp xúc","tip":"Cùng khối lượng, chất rắn dạng bột có diện tích tiếp xúc lớn hơn nên phản ứng nhanh hơn dạng hạt.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 15: So sánh tốc độ của 2 phản ứng sau (thực hiện ở cùng nhiệt độ, khối lượng Zn sử dụng là như nhau) . Zn (bột) + dung dịch CuSO4 1M (1) Zn (hạt) + dung dịch CuSO4 1M (2) Kết quả thu được là .\nA. (1) nhanh hơn (2).\nB. (2) nhanh hơn (1).\nC. như nhau.\nD. ban đầu như nhau, sau đó (2) nhanh hơn(1).","solution":"Theo đáp án của ngân hàng: chọn A. (1) nhanh hơn (2). Cùng khối lượng, chất rắn dạng bột có diện tích tiếp xúc lớn hơn nên phản ứng nhanh hơn dạng hạt.","trap":"Không nhầm diện tích tiếp xúc với nồng độ.","extra":[]},{"title":"Dạng 2. Ảnh hưởng của nhiệt độ","tip":"Giảm nhiệt độ thường làm các phản ứng hóa học và sinh hóa chậm lại, nên thực phẩm lâu hỏng hơn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 17: Khi “bảo quản thực phẩm trong tủ lạnh để giữ thực phẩm tươi lâu hơn” là đã tác động vào yếu tố gì để làm chậm tốc độ phản ứng?\nA. Nồng độ.\nB. Nhiệt độ.\nC. Nguyên liệu.\nD. Hóa chất.","solution":"Theo đáp án của ngân hàng: chọn B. Nhiệt độ. Giảm nhiệt độ thường làm các phản ứng hóa học và sinh hóa chậm lại, nên thực phẩm lâu hỏng hơn.","trap":"Không nói tủ lạnh làm phản ứng dừng hoàn toàn.","extra":[]},{"title":"Dạng 3. Vai trò của chất xúc tác","tip":"Chất xúc tác làm tăng tốc độ phản ứng và không bị tiêu hao sau phản ứng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19: Trong quá trình sản xuất sulfuric acid có giai đoạn tổng hợp sulfur trioxide (SO3). Phản ứng xảy ra như sau: 2SO2 + O2 → 2SO3. Khi có mặt vanadium(V) oxide thì phản ứng xảy ra nhanh hơn. Vanadium(V) oxide đóng vai trò gì trong phản ứng tổng hợp sulfur trioxide?\nA. Chất phản ứng.\nB. Sản phẩm\nC. Chất xúc tác.\nD. Không đóng vai trò gì","solution":"Theo đáp án của ngân hàng: chọn C. Chất xúc tác. Chất xúc tác làm tăng tốc độ phản ứng và không bị tiêu hao sau phản ứng.","trap":"Không đưa chất xúc tác vào phương trình như một chất phản ứng hoặc sản phẩm.","extra":[]}],"searchText":"TỐC ĐỘ PHẢN ỨNG VÀ CHẤT XÚC TÁC. Tốc độ phản ứng và chất xúc tác Dạng 1. Ảnh hưởng của diện tích tiếp xúc Cùng khối lượng, chất rắn dạng bột có diện tích tiếp xúc lớn hơn nên phản ứng nhanh hơn dạng hạt. Đề bài tham khảo từ ngân hàng:\nCâu 15: So sánh tốc độ của 2 phản ứng sau (thực hiện ở cùng nhiệt độ, khối lượng Zn sử dụng là như nhau) . Zn (bột) + dung dịch CuSO4 1M (1) Zn (hạt) + dung dịch CuSO4 1M (2) Kết quả thu được là .\nA. (1) nhanh hơn (2).\nB. (2) nhanh hơn (1).\nC. như nhau.\nD. ban đầu như nhau, sau đó (2) nhanh hơn(1). Theo đáp án của ngân hàng: chọn A. (1) nhanh hơn (2). Cùng khối lượng, chất rắn dạng bột có diện tích tiếp xúc lớn hơn nên phản ứng nhanh hơn dạng hạt. Không nhầm diện tích tiếp xúc với nồng độ. Dạng 2. Ảnh hưởng của nhiệt độ Giảm nhiệt độ thường làm các phản ứng hóa học và sinh hóa chậm lại, nên thực phẩm lâu hỏng hơn. Đề bài tham khảo từ ngân hàng:\nCâu 17: Khi “bảo quản thực phẩm trong tủ lạnh để giữ thực phẩm tươi lâu hơn” là đã tác động vào yếu tố gì để làm chậm tốc độ phản ứng?\nA. Nồng độ.\nB. Nhiệt độ.\nC. Nguyên liệu.\nD. Hóa chất. Theo đáp án của ngân hàng: chọn B. Nhiệt độ. Giảm nhiệt độ thường làm các phản ứng hóa học và sinh hóa chậm lại, nên thực phẩm lâu hỏng hơn. Không nói tủ lạnh làm phản ứng dừng hoàn toàn. Dạng 3. Vai trò của chất xúc tác Chất xúc tác làm tăng tốc độ phản ứng và không bị tiêu hao sau phản ứng. Đề bài tham khảo từ ngân hàng:\nCâu 19: Trong quá trình sản xuất sulfuric acid có giai đoạn tổng hợp sulfur trioxide (SO3). Phản ứng xảy ra như sau: 2SO2 + O2 → 2SO3. Khi có mặt vanadium(V) oxide thì phản ứng xảy ra nhanh hơn. Vanadium(V) oxide đóng vai trò gì trong phản ứng tổng hợp sulfur trioxide?\nA. Chất phản ứng.\nB. Sản phẩm\nC. Chất xúc tác.\nD. Không đóng vai trò gì Theo đáp án của ngân hàng: chọn C. Chất xúc tác. Chất xúc tác làm tăng tốc độ phản ứng và không bị tiêu hao sau phản ứng. Không đưa chất xúc tác vào phương trình như một chất phản ứng hoặc sản phẩm."},{"number":8,"title":"ACID.","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-8","summary":"Acid: nhận biết, tính chất và ứng dụng","intro":["Acid: nhận biết, tính chất và ứng dụng"],"forms":[{"title":"Dạng 1. Nhận biết acid bằng chất chỉ thị","tip":"Dung dịch acid làm quỳ tím hóa đỏ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 2: Acid là những chất làm cho quỳ tím chuyển sang màu nào trong số các màu sau đây?\nA. Xanh.\nB. Đỏ.\nC. Tím.\nD. Vàng.","solution":"Theo đáp án của ngân hàng: chọn B. Đỏ. Dung dịch acid làm quỳ tím hóa đỏ.","trap":"Không dùng quỳ tím để phân biệt hai acid khác nhau.","extra":[]},{"title":"Dạng 2. Nhận biết cấu tạo và ion đặc trưng","tip":"Acid có nguyên tử hydrogen liên kết với gốc acid và khi tan trong nước tạo ion H+.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 7: Điền vào chỗ trống: \"Acid là những ... trong phân tử có nguyên tử ... liên kết với gốc acid. Khi tan trong nước, acid tạo ra ion ...\"\nA. Đơn chất, hydrogen, OH−\nB. Hợp chất, hydroxide, H+\nC. Đơn chất, hydroxide, OH−\nD. Hợp chất, hydrogen, H+","solution":"Theo đáp án của ngân hàng: chọn D. Hợp chất, hydrogen, H+ Acid có nguyên tử hydrogen liên kết với gốc acid và khi tan trong nước tạo ion H+.","trap":"Không coi mọi hợp chất chứa H đều là acid.","extra":[]},{"title":"Dạng 3. Kim loại tác dụng với acid","tip":"Kim loại đứng trước H tác dụng với acid loãng thích hợp tạo muối và khí H2; tính theo phương trình.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 4: Cho 5,6 g sắt tác dụng với hydrochloric acid dư, sau phản ứng thể tích khí H2 thu được (ở đktc):\nA. 1,24 lít.\nB. 2,479 lít.\nC. 12,4 lít.\nD. 24,79 lít.","solution":"Theo đáp án của ngân hàng: chọn B. 2,479 lít. Fe + 2HCl → FeCl2 + H2; nFe = 5,6/56 = 0,1 mol nên VH2 = 2,24 L theo đktc của câu nguồn.","trap":"Không áp dụng máy móc cho Cu, Ag hoặc acid có tính oxi hóa mạnh.","extra":[]}],"searchText":"ACID. Acid: nhận biết, tính chất và ứng dụng Dạng 1. Nhận biết acid bằng chất chỉ thị Dung dịch acid làm quỳ tím hóa đỏ. Đề bài tham khảo từ ngân hàng:\nCâu 2: Acid là những chất làm cho quỳ tím chuyển sang màu nào trong số các màu sau đây?\nA. Xanh.\nB. Đỏ.\nC. Tím.\nD. Vàng. Theo đáp án của ngân hàng: chọn B. Đỏ. Dung dịch acid làm quỳ tím hóa đỏ. Không dùng quỳ tím để phân biệt hai acid khác nhau. Dạng 2. Nhận biết cấu tạo và ion đặc trưng Acid có nguyên tử hydrogen liên kết với gốc acid và khi tan trong nước tạo ion H+. Đề bài tham khảo từ ngân hàng:\nCâu 7: Điền vào chỗ trống: \"Acid là những ... trong phân tử có nguyên tử ... liên kết với gốc acid. Khi tan trong nước, acid tạo ra ion ...\"\nA. Đơn chất, hydrogen, OH−\nB. Hợp chất, hydroxide, H+\nC. Đơn chất, hydroxide, OH−\nD. Hợp chất, hydrogen, H+ Theo đáp án của ngân hàng: chọn D. Hợp chất, hydrogen, H+ Acid có nguyên tử hydrogen liên kết với gốc acid và khi tan trong nước tạo ion H+. Không coi mọi hợp chất chứa H đều là acid. Dạng 3. Kim loại tác dụng với acid Kim loại đứng trước H tác dụng với acid loãng thích hợp tạo muối và khí H2; tính theo phương trình. Đề bài tham khảo từ ngân hàng:\nCâu 4: Cho 5,6 g sắt tác dụng với hydrochloric acid dư, sau phản ứng thể tích khí H2 thu được (ở đktc):\nA. 1,24 lít.\nB. 2,479 lít.\nC. 12,4 lít.\nD. 24,79 lít. Theo đáp án của ngân hàng: chọn B. 2,479 lít. Fe + 2HCl → FeCl2 + H2; nFe = 5,6/56 = 0,1 mol nên VH2 = 2,24 L theo đktc của câu nguồn. Không áp dụng máy móc cho Cu, Ag hoặc acid có tính oxi hóa mạnh."},{"number":9,"title":"BASE. THANG pH.","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-9","summary":"Base, thang pH và phản ứng trung hòa","intro":["Base, thang pH và phản ứng trung hòa"],"forms":[{"title":"Dạng 1. Đọc thang pH","tip":"pH < 7: acid; pH = 7: trung tính; pH > 7: base.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 4: Thang pH được dùng để:\nA. biểu thị độ acid của dung dịch.\nB. biểu thị độ base của dung dịch\nC. biểu thị độ acid, base của dung dịch.\nD. biểu thị độ mặn của dung dịch","solution":"Theo đáp án của ngân hàng: chọn C. biểu thị độ acid, base của dung dịch. pH < 7: acid; pH = 7: trung tính; pH > 7: base.","trap":"Không đánh đồng pH lớn với nồng độ base luôn lớn hơn trong mọi trường hợp.","extra":[]},{"title":"Dạng 2. Nhận biết môi trường dung dịch","tip":"Đối chiếu trực tiếp giá trị pH với mốc 7.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 11: Nếu pH = 7 thì dung dịch có môi trường:\nA. Trung tính\nB. Base\nC. Acid\nD. Muối","solution":"Theo đáp án của ngân hàng: chọn A. Trung tính Đối chiếu trực tiếp giá trị pH với mốc 7.","trap":"Không dùng màu quỳ khi đề đã cho pH rõ ràng.","extra":[]},{"title":"Dạng 3. Tính trung hòa acid – base","tip":"Đổi về mol H+ và OH−; so sánh lượng tương đương để xác định chất dư và môi trường sau phản ứng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 17: Cho 100ml dung dịch Ba(OH)2 0,1M vào 100ml dung dịch HCl 0,1M. Dung dịch thu được sau phản ứng:\nA. Làm quỳ tím hoá xanh.\nB. Làm quỳ tím hoá đỏ.\nC. Phản ứng được với magiê giải phóng khí hydrogen.\nD. Không làm đổi màu quỳ tím.","solution":"Theo đáp án của ngân hàng: chọn A. Làm quỳ tím hoá xanh. nBa(OH)2 = 0,01 mol tạo 0,02 mol OH−; nHCl = 0,01 mol nên OH− dư, dung dịch sau phản ứng có môi trường base.","trap":"Không chỉ so sánh số mol acid và base nếu acid/base nhiều nấc.","extra":[]}],"searchText":"BASE. THANG pH. Base, thang pH và phản ứng trung hòa Dạng 1. Đọc thang pH pH < 7: acid; pH = 7: trung tính; pH > 7: base. Đề bài tham khảo từ ngân hàng:\nCâu 4: Thang pH được dùng để:\nA. biểu thị độ acid của dung dịch.\nB. biểu thị độ base của dung dịch\nC. biểu thị độ acid, base của dung dịch.\nD. biểu thị độ mặn của dung dịch Theo đáp án của ngân hàng: chọn C. biểu thị độ acid, base của dung dịch. pH < 7: acid; pH = 7: trung tính; pH > 7: base. Không đánh đồng pH lớn với nồng độ base luôn lớn hơn trong mọi trường hợp. Dạng 2. Nhận biết môi trường dung dịch Đối chiếu trực tiếp giá trị pH với mốc 7. Đề bài tham khảo từ ngân hàng:\nCâu 11: Nếu pH = 7 thì dung dịch có môi trường:\nA. Trung tính\nB. Base\nC. Acid\nD. Muối Theo đáp án của ngân hàng: chọn A. Trung tính Đối chiếu trực tiếp giá trị pH với mốc 7. Không dùng màu quỳ khi đề đã cho pH rõ ràng. Dạng 3. Tính trung hòa acid – base Đổi về mol H+ và OH−; so sánh lượng tương đương để xác định chất dư và môi trường sau phản ứng. Đề bài tham khảo từ ngân hàng:\nCâu 17: Cho 100ml dung dịch Ba(OH)2 0,1M vào 100ml dung dịch HCl 0,1M. Dung dịch thu được sau phản ứng:\nA. Làm quỳ tím hoá xanh.\nB. Làm quỳ tím hoá đỏ.\nC. Phản ứng được với magiê giải phóng khí hydrogen.\nD. Không làm đổi màu quỳ tím. Theo đáp án của ngân hàng: chọn A. Làm quỳ tím hoá xanh. nBa(OH)2 = 0,01 mol tạo 0,02 mol OH−; nHCl = 0,01 mol nên OH− dư, dung dịch sau phản ứng có môi trường base. Không chỉ so sánh số mol acid và base nếu acid/base nhiều nấc."},{"number":10,"title":"OXIDE.","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-10","summary":"Oxide: phân loại và tính chất","intro":["Oxide: phân loại và tính chất"],"forms":[{"title":"Dạng 1. Nhận biết oxide","tip":"Oxide là hợp chất gồm hai nguyên tố, trong đó có oxygen.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1: Oxide là hợp chất tạo nên từ mấy nguyên tố?\nA. 1\nB. 2\nC. 3\nD. 4","solution":"Theo đáp án của ngân hàng: chọn B. 2 Oxide là hợp chất gồm hai nguyên tố, trong đó có oxygen.","trap":"Hợp chất chứa ba nguyên tố dù có O không phải oxide.","extra":[]},{"title":"Dạng 2. Phân loại oxide acid và oxide base","tip":"Oxide kim loại điển hình thường là oxide base; oxide phi kim điển hình thường là oxide acid.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 17: CaO là oxide:\nA. Oxide acid\nB. Oxit base\nC. Oxit trung tính\nD. Oxit lưỡng tính","solution":"Theo đáp án của ngân hàng: chọn B. Oxit base Oxide kim loại điển hình thường là oxide base; oxide phi kim điển hình thường là oxide acid.","trap":"Có ngoại lệ, nên cần dựa thêm vào khả năng phản ứng với acid/base.","extra":[]},{"title":"Dạng 3. Dự đoán môi trường khi oxide tác dụng với nước","tip":"Oxide base tan hoặc phản ứng với nước tạo base nên dung dịch có pH > 7.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24: Oxide nào sau đây khi tác dụng với nước tạo ra dung dịch có pH > 7 ?\nA. CO2.\nB. SO2.\nC. CaO\nD. P2O5.","solution":"Theo đáp án của ngân hàng: chọn C. CaO Oxide base tan hoặc phản ứng với nước tạo base nên dung dịch có pH > 7.","trap":"Không phải mọi oxide kim loại đều phản ứng với nước.","extra":[]}],"searchText":"OXIDE. Oxide: phân loại và tính chất Dạng 1. Nhận biết oxide Oxide là hợp chất gồm hai nguyên tố, trong đó có oxygen. Đề bài tham khảo từ ngân hàng:\nCâu 1: Oxide là hợp chất tạo nên từ mấy nguyên tố?\nA. 1\nB. 2\nC. 3\nD. 4 Theo đáp án của ngân hàng: chọn B. 2 Oxide là hợp chất gồm hai nguyên tố, trong đó có oxygen. Hợp chất chứa ba nguyên tố dù có O không phải oxide. Dạng 2. Phân loại oxide acid và oxide base Oxide kim loại điển hình thường là oxide base; oxide phi kim điển hình thường là oxide acid. Đề bài tham khảo từ ngân hàng:\nCâu 17: CaO là oxide:\nA. Oxide acid\nB. Oxit base\nC. Oxit trung tính\nD. Oxit lưỡng tính Theo đáp án của ngân hàng: chọn B. Oxit base Oxide kim loại điển hình thường là oxide base; oxide phi kim điển hình thường là oxide acid. Có ngoại lệ, nên cần dựa thêm vào khả năng phản ứng với acid/base. Dạng 3. Dự đoán môi trường khi oxide tác dụng với nước Oxide base tan hoặc phản ứng với nước tạo base nên dung dịch có pH > 7. Đề bài tham khảo từ ngân hàng:\nCâu 24: Oxide nào sau đây khi tác dụng với nước tạo ra dung dịch có pH > 7 ?\nA. CO2.\nB. SO2.\nC. CaO\nD. P2O5. Theo đáp án của ngân hàng: chọn C. CaO Oxide base tan hoặc phản ứng với nước tạo base nên dung dịch có pH > 7. Không phải mọi oxide kim loại đều phản ứng với nước."},{"number":11,"title":"MUỐI.","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-11","summary":"Muối và phản ứng trao đổi","intro":["Muối và phản ứng trao đổi"],"forms":[{"title":"Dạng 1. Nhận biết phản ứng tạo kết tủa","tip":"Tra bảng tính tan hoặc ghi nhớ ion tạo kết tủa; Fe3+ gặp OH− tạo Fe(OH)3 không tan.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1: Cho dung dịch KOH vào ống nghiệm đựng dung dịch FeCl3, hiện tượng quan sát được là:\nA. Có kết tủa trắng xanh.\nB. Có khí thoát ra.\nC. Có kết tủa đỏ nâu.\nD. Kết tủa màu trắng.","solution":"Theo đáp án của ngân hàng: chọn C. Có kết tủa đỏ nâu. Tra bảng tính tan hoặc ghi nhớ ion tạo kết tủa; Fe3+ gặp OH− tạo Fe(OH)3 không tan.","trap":"Màu kết tủa phụ thuộc chất, không phải mọi hydroxide đều trắng.","extra":[]},{"title":"Dạng 2. Muối carbonate tác dụng với acid","tip":"Muối carbonate + acid → muối mới + CO2 + H2O.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 5: Cho phương trình phản ứng: BaCO3 + 2HCl → BaCl2 + Y + H2O. Vậy Y là:\nA. CO\nB. H2\nC. Cl2\nD. CO2","solution":"Theo đáp án của ngân hàng: chọn D. CO2 Muối carbonate + acid → muối mới + CO2 + H2O.","trap":"Không bỏ sản phẩm nước khi viết phương trình.","extra":[]},{"title":"Dạng 3. Nhận biết muối tan và không tan","tip":"Dựa vào quy tắc tính tan; muối nitrate và phần lớn muối của Na+, K+, NH4+ tan.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 17: Muối nào sau đây là muối tan?\nA. NaCl\nB. Fe(OH)2\nC. FeCO3\nD. Al2(SO4)3","solution":"Theo đáp án của ngân hàng: chọn A. NaCl Dựa vào quy tắc tính tan; muối nitrate và phần lớn muối của Na+, K+, NH4+ tan.","trap":"Không suy đoán độ tan chỉ từ trạng thái hoặc màu sắc.","extra":[]}],"searchText":"MUỐI. Muối và phản ứng trao đổi Dạng 1. Nhận biết phản ứng tạo kết tủa Tra bảng tính tan hoặc ghi nhớ ion tạo kết tủa; Fe3+ gặp OH− tạo Fe(OH)3 không tan. Đề bài tham khảo từ ngân hàng:\nCâu 1: Cho dung dịch KOH vào ống nghiệm đựng dung dịch FeCl3, hiện tượng quan sát được là:\nA. Có kết tủa trắng xanh.\nB. Có khí thoát ra.\nC. Có kết tủa đỏ nâu.\nD. Kết tủa màu trắng. Theo đáp án của ngân hàng: chọn C. Có kết tủa đỏ nâu. Tra bảng tính tan hoặc ghi nhớ ion tạo kết tủa; Fe3+ gặp OH− tạo Fe(OH)3 không tan. Màu kết tủa phụ thuộc chất, không phải mọi hydroxide đều trắng. Dạng 2. Muối carbonate tác dụng với acid Muối carbonate + acid → muối mới + CO2 + H2O. Đề bài tham khảo từ ngân hàng:\nCâu 5: Cho phương trình phản ứng: BaCO3 + 2HCl → BaCl2 + Y + H2O. Vậy Y là:\nA. CO\nB. H2\nC. Cl2\nD. CO2 Theo đáp án của ngân hàng: chọn D. CO2 Muối carbonate + acid → muối mới + CO2 + H2O. Không bỏ sản phẩm nước khi viết phương trình. Dạng 3. Nhận biết muối tan và không tan Dựa vào quy tắc tính tan; muối nitrate và phần lớn muối của Na+, K+, NH4+ tan. Đề bài tham khảo từ ngân hàng:\nCâu 17: Muối nào sau đây là muối tan?\nA. NaCl\nB. Fe(OH)2\nC. FeCO3\nD. Al2(SO4)3 Theo đáp án của ngân hàng: chọn A. NaCl Dựa vào quy tắc tính tan; muối nitrate và phần lớn muối của Na+, K+, NH4+ tan. Không suy đoán độ tan chỉ từ trạng thái hoặc màu sắc."},{"number":12,"title":"PHÂN BÓN HÓA HỌC.","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-12","summary":"Phân bón hóa học","intro":["Phân bón hóa học"],"forms":[{"title":"Dạng 1. Phân loại phân đơn và phân kép","tip":"Phân đơn cung cấp chủ yếu một nguyên tố dinh dưỡng; NPK là hỗn hợp hoặc phân kép cung cấp N, P, K.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1: Phân bón nitrogen (đạm), phosphorus (lân), potassium (kali) (NPK) là hỗn hợp của\nA. NH4H2PO4, KNO3\nB. (NH4)3PO4, KNO3\nC. (NH4)2HPO4, NaNO3\nD. (NH4)2HPO4, KNO3","solution":"Theo đáp án của ngân hàng: chọn D. (NH4)2HPO4, KNO3 Phân đơn cung cấp chủ yếu một nguyên tố dinh dưỡng; NPK là hỗn hợp hoặc phân kép cung cấp N, P, K.","trap":"Không nhầm tên thương mại với thành phần dinh dưỡng.","extra":[]},{"title":"Dạng 2. Tính phần trăm nguyên tố dinh dưỡng","tip":"%N = tổng khối lượng N trong một mol chất / khối lượng mol phân bón × 100%.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 5: Phần trăm về khối lượng của nguyên tố N trong (NH4)2SO4 là\nA. 20%\nB. 21%\nC. 22%\nD. 23%","solution":"Theo đáp án của ngân hàng: chọn B. 21% M(NH4)2SO4 = 132; khối lượng N = 28; %N ≈ 21,2%.","trap":"Phải nhân số nguyên tử N trong công thức.","extra":[]},{"title":"Dạng 3. Nhận biết phân bón bằng phản ứng","tip":"Dùng phản ứng đặc trưng của NH4+, Cl− hoặc phosphate; chọn thuốc thử tạo khí, kết tủa hoặc hiện tượng khác nhau.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 10: Để nhận biết 3 chất rắn NH4NO3, Ca3(PO4)2, KCl người ta dùng dung dịch\nA. KOH\nB. NaOH\nC. Ba(OH)2\nD. Na2CO3","solution":"Theo đáp án của ngân hàng: chọn C. Ba(OH)2 Dùng phản ứng đặc trưng của NH4+, Cl− hoặc phosphate; chọn thuốc thử tạo khí, kết tủa hoặc hiện tượng khác nhau.","trap":"Không chọn thuốc thử tạo cùng một hiện tượng với tất cả mẫu.","extra":[]}],"searchText":"PHÂN BÓN HÓA HỌC. Phân bón hóa học Dạng 1. Phân loại phân đơn và phân kép Phân đơn cung cấp chủ yếu một nguyên tố dinh dưỡng; NPK là hỗn hợp hoặc phân kép cung cấp N, P, K. Đề bài tham khảo từ ngân hàng:\nCâu 1: Phân bón nitrogen (đạm), phosphorus (lân), potassium (kali) (NPK) là hỗn hợp của\nA. NH4H2PO4, KNO3\nB. (NH4)3PO4, KNO3\nC. (NH4)2HPO4, NaNO3\nD. (NH4)2HPO4, KNO3 Theo đáp án của ngân hàng: chọn D. (NH4)2HPO4, KNO3 Phân đơn cung cấp chủ yếu một nguyên tố dinh dưỡng; NPK là hỗn hợp hoặc phân kép cung cấp N, P, K. Không nhầm tên thương mại với thành phần dinh dưỡng. Dạng 2. Tính phần trăm nguyên tố dinh dưỡng %N = tổng khối lượng N trong một mol chất / khối lượng mol phân bón × 100%. Đề bài tham khảo từ ngân hàng:\nCâu 5: Phần trăm về khối lượng của nguyên tố N trong (NH4)2SO4 là\nA. 20%\nB. 21%\nC. 22%\nD. 23% Theo đáp án của ngân hàng: chọn B. 21% M(NH4)2SO4 = 132; khối lượng N = 28; %N ≈ 21,2%. Phải nhân số nguyên tử N trong công thức. Dạng 3. Nhận biết phân bón bằng phản ứng Dùng phản ứng đặc trưng của NH4+, Cl− hoặc phosphate; chọn thuốc thử tạo khí, kết tủa hoặc hiện tượng khác nhau. Đề bài tham khảo từ ngân hàng:\nCâu 10: Để nhận biết 3 chất rắn NH4NO3, Ca3(PO4)2, KCl người ta dùng dung dịch\nA. KOH\nB. NaOH\nC. Ba(OH)2\nD. Na2CO3 Theo đáp án của ngân hàng: chọn C. Ba(OH)2 Dùng phản ứng đặc trưng của NH4+, Cl− hoặc phosphate; chọn thuốc thử tạo khí, kết tủa hoặc hiện tượng khác nhau. Không chọn thuốc thử tạo cùng một hiện tượng với tất cả mẫu."},{"number":13,"title":"KHỐI LƯỢNG RIÊNG.","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-13","summary":"Khối lượng riêng và nhận biết chất","intro":["Khối lượng riêng và nhận biết chất"],"forms":[{"title":"Dạng 1. Công thức khối lượng riêng","tip":"D = m/V; m = D×V; V = m/D. Đổi đơn vị đồng nhất trước khi tính.","example":"Đề bài được chuẩn hóa từ câu nguồn có công thức bị lỗi hiển thị:\nCho m và V lần lượt là khối lượng và thể tích của một vật. Công thức nào xác định khối lượng riêng D của chất tạo thành vật?\nA. D = m × V\nB. D = m/V\nC. D = V/m\nD. D = m + V","solution":"Khối lượng riêng bằng khối lượng chia cho thể tích, nên chọn B: D = m/V.","trap":"Không nhầm khối lượng riêng với trọng lượng riêng.","extra":[]},{"title":"Dạng 2. Tính khối lượng từ thể tích","tip":"Tính thể tích hình học rồi dùng m = D×V.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 13: Tính khối lượng của một khối đá hoa cương dạng hình hộp chữ nhật có kích thước 2,0 m x 3,0 m x 1,5 m. Biết khối lượng riêng của đá hoa cương là ρ=2750kg/m3\nA. 2475 kg.\nB. 24750 kg.\nC. 275 kg.\nD. 2750 kg.","solution":"Theo đáp án của ngân hàng: chọn B. 24750 kg. V = 2×3×1,5 = 9 m3; m = 2750×9 = 24750 kg.","trap":"Không bỏ sót phép nhân ba kích thước của hình hộp.","extra":[]},{"title":"Dạng 3. Xác định khối lượng riêng vật không đều","tip":"Cần cân để đo khối lượng và bình chia độ để đo thể tích bằng độ dâng của nước.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 16: Để xác định khối lượng riêng của các viên sỏi, ba bạn Sử, Sen, Anh đưa ra ý kiến như sau: Sử: Mình chỉ cần một cái cân là đủ Sen: Theo mình, cần một bình chia độ mới đúng Anh: Sai bét, phải cần một cái cân và một bình chia độ mới xác định được chứ Theo em, ý kiến nào đúng\nA. Sử đúng.\nB. Sen đúng.\nC. Anh đúng.\nD. Cả ba bạn cùng sai","solution":"Theo đáp án của ngân hàng: chọn C. Anh đúng. Cần cân để đo khối lượng và bình chia độ để đo thể tích bằng độ dâng của nước.","trap":"Chỉ có cân hoặc chỉ có bình chia độ là chưa đủ.","extra":[]}],"searchText":"KHỐI LƯỢNG RIÊNG. Khối lượng riêng và nhận biết chất Dạng 1. Công thức khối lượng riêng D = m/V; m = D×V; V = m/D. Đổi đơn vị đồng nhất trước khi tính. Đề bài được chuẩn hóa từ câu nguồn có công thức bị lỗi hiển thị:\nCho m và V lần lượt là khối lượng và thể tích của một vật. Công thức nào xác định khối lượng riêng D của chất tạo thành vật?\nA. D = m × V\nB. D = m/V\nC. D = V/m\nD. D = m + V Khối lượng riêng bằng khối lượng chia cho thể tích, nên chọn B: D = m/V. Không nhầm khối lượng riêng với trọng lượng riêng. Dạng 2. Tính khối lượng từ thể tích Tính thể tích hình học rồi dùng m = D×V. Đề bài tham khảo từ ngân hàng:\nCâu 13: Tính khối lượng của một khối đá hoa cương dạng hình hộp chữ nhật có kích thước 2,0 m x 3,0 m x 1,5 m. Biết khối lượng riêng của đá hoa cương là ρ=2750kg/m3\nA. 2475 kg.\nB. 24750 kg.\nC. 275 kg.\nD. 2750 kg. Theo đáp án của ngân hàng: chọn B. 24750 kg. V = 2×3×1,5 = 9 m3; m = 2750×9 = 24750 kg. Không bỏ sót phép nhân ba kích thước của hình hộp. Dạng 3. Xác định khối lượng riêng vật không đều Cần cân để đo khối lượng và bình chia độ để đo thể tích bằng độ dâng của nước. Đề bài tham khảo từ ngân hàng:\nCâu 16: Để xác định khối lượng riêng của các viên sỏi, ba bạn Sử, Sen, Anh đưa ra ý kiến như sau: Sử: Mình chỉ cần một cái cân là đủ Sen: Theo mình, cần một bình chia độ mới đúng Anh: Sai bét, phải cần một cái cân và một bình chia độ mới xác định được chứ Theo em, ý kiến nào đúng\nA. Sử đúng.\nB. Sen đúng.\nC. Anh đúng.\nD. Cả ba bạn cùng sai Theo đáp án của ngân hàng: chọn C. Anh đúng. Cần cân để đo khối lượng và bình chia độ để đo thể tích bằng độ dâng của nước. Chỉ có cân hoặc chỉ có bình chia độ là chưa đủ."},{"number":14,"title":"THỰC HÀNH XÁC ĐỊNH KHỐI LƯỢNG RIÊNG.","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-14","summary":"Thực hành xác định khối lượng riêng","intro":["Thực hành xác định khối lượng riêng"],"forms":[{"title":"Dạng 1. Đo vật rắn có hình dạng đều","tip":"Đo khối lượng bằng cân; đo kích thước để tính thể tích; sau đó D = m/V.","example":"Đề bài thực hành bổ sung:\nMột khối hộp chữ nhật có khối lượng 540 g, kích thước 10 cm × 5 cm × 4 cm. Hãy nêu cách đo, tính thể tích và xác định khối lượng riêng.","solution":"V = 10×5×4 = 200 cm3; D = 540/200 = 2,7 g/cm3.","trap":"Phải ghi đơn vị và ước lượng sai số dụng cụ.","extra":[]},{"title":"Dạng 2. Đo vật rắn không thấm nước, hình dạng bất kì","tip":"Dùng cân đo m; dùng bình chia độ đo V1, nhúng chìm vật đo V2; thể tích vật V = V2−V1.","example":"Đề bài thực hành bổ sung:\nMột viên sỏi có khối lượng 75 g. Mực nước trong bình chia độ tăng từ 50 mL lên 80 mL khi thả chìm viên sỏi. Tính khối lượng riêng của viên sỏi.","solution":"V = 80−50 = 30 cm3; D = 75/30 = 2,5 g/cm3.","trap":"Loại bỏ bọt khí và đọc ngang mắt.","extra":[]},{"title":"Dạng 3. Đo khối lượng riêng chất lỏng","tip":"Cân bình rỗng m0, cân bình có chất lỏng m1, đo thể tích V; D = (m1−m0)/V.","example":"Đề bài thực hành bổ sung:\nBình rỗng nặng 80 g; bình chứa 100 mL dầu nặng 160 g. Hãy tính khối lượng riêng của dầu.","solution":"m dầu = 160−80 = 80 g; D = 80/100 = 0,8 g/mL = 800 kg/m3.","trap":"Không quên trừ khối lượng bình.","extra":[]}],"searchText":"THỰC HÀNH XÁC ĐỊNH KHỐI LƯỢNG RIÊNG. Thực hành xác định khối lượng riêng Dạng 1. Đo vật rắn có hình dạng đều Đo khối lượng bằng cân; đo kích thước để tính thể tích; sau đó D = m/V. Đề bài thực hành bổ sung:\nMột khối hộp chữ nhật có khối lượng 540 g, kích thước 10 cm × 5 cm × 4 cm. Hãy nêu cách đo, tính thể tích và xác định khối lượng riêng. V = 10×5×4 = 200 cm3; D = 540/200 = 2,7 g/cm3. Phải ghi đơn vị và ước lượng sai số dụng cụ. Dạng 2. Đo vật rắn không thấm nước, hình dạng bất kì Dùng cân đo m; dùng bình chia độ đo V1, nhúng chìm vật đo V2; thể tích vật V = V2−V1. Đề bài thực hành bổ sung:\nMột viên sỏi có khối lượng 75 g. Mực nước trong bình chia độ tăng từ 50 mL lên 80 mL khi thả chìm viên sỏi. Tính khối lượng riêng của viên sỏi. V = 80−50 = 30 cm3; D = 75/30 = 2,5 g/cm3. Loại bỏ bọt khí và đọc ngang mắt. Dạng 3. Đo khối lượng riêng chất lỏng Cân bình rỗng m0, cân bình có chất lỏng m1, đo thể tích V; D = (m1−m0)/V. Đề bài thực hành bổ sung:\nBình rỗng nặng 80 g; bình chứa 100 mL dầu nặng 160 g. Hãy tính khối lượng riêng của dầu. m dầu = 160−80 = 80 g; D = 80/100 = 0,8 g/mL = 800 kg/m3. Không quên trừ khối lượng bình."},{"number":15,"title":"ÁP SUẤT TRÊN MỘT BỀ MẶT.","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-15","summary":"Áp suất trên một bề mặt","intro":["Áp suất trên một bề mặt"],"forms":[{"title":"Dạng 1. Công thức áp suất","tip":"p = F/S; F là áp lực vuông góc bề mặt, S là diện tích bị ép.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 5: Công thức nào sau đây là công thức tính áp suất?\nA. p = F/S\nB. p = F.S\nC. p = P/S\nD. p = d.V","solution":"Theo đáp án của ngân hàng: chọn A. p = F/S p = F/S; F là áp lực vuông góc bề mặt, S là diện tích bị ép.","trap":"Phải đổi diện tích về m2 để ra Pa.","extra":[]},{"title":"Dạng 2. Tính áp suất của vật trên mặt sàn","tip":"Tính tổng trọng lượng làm áp lực rồi chia cho tổng diện tích tiếp xúc.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 12: Đặt một bao gạo 60kg lên một ghết 4 chân có khối lượng 4kg. Diện tích tiếp xúc với mặt đất của mỗi chân ghế là 8cm2. Áp suất mà gạo và ghế tác dụng lên mặt đất là:\nA. p = 20000N/m2\nB. p = 2000000N/m2\nC. p = 200000N/m2\nD. Là một giá trị khác","solution":"Theo đáp án của ngân hàng: chọn C. p = 200000N/m2 Tính tổng trọng lượng làm áp lực rồi chia cho tổng diện tích tiếp xúc.","trap":"Không chỉ lấy khối lượng của bao gạo mà bỏ khối lượng ghế.","extra":[]},{"title":"Dạng 3. Giải thích tăng – giảm áp suất","tip":"Cùng lực, diện tích càng nhỏ thì áp suất càng lớn; mũi đinh nhọn giúp dễ xuyên vào tường.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 18: Khi đóng đinh vào tường ta thường đóng mũi đinh vào tường mà không đóng mũ (tai) đinh vào? Tại sao vậy?\nA. Đóng mũi đinh vào tường để tăng áp lực tác dụng nên đinh dễ vào hơn.\nB. Mũi đinh có diện tích nhỏ nên với cùng áp lực thì có thể gây ra áp suất lớn nên đinh dễ vào hơn.\nC. Mũ đinh có diện tích lớn nên áp lực nhỏ vì vậy đinh khó vào hơn.\nD. Đóng mũi đinh vào tường là do thói quen còn đóng đầu nào cũng được.","solution":"Theo đáp án của ngân hàng: chọn B. Mũi đinh có diện tích nhỏ nên với cùng áp lực thì có thể gây ra áp suất lớn nên đinh dễ vào hơn. Cùng lực, diện tích càng nhỏ thì áp suất càng lớn; mũi đinh nhọn giúp dễ xuyên vào tường.","trap":"Không nói mũi đinh tạo lực lớn hơn nếu lực đóng giữ nguyên.","extra":[]}],"searchText":"ÁP SUẤT TRÊN MỘT BỀ MẶT. Áp suất trên một bề mặt Dạng 1. Công thức áp suất p = F/S; F là áp lực vuông góc bề mặt, S là diện tích bị ép. Đề bài tham khảo từ ngân hàng:\nCâu 5: Công thức nào sau đây là công thức tính áp suất?\nA. p = F/S\nB. p = F.S\nC. p = P/S\nD. p = d.V Theo đáp án của ngân hàng: chọn A. p = F/S p = F/S; F là áp lực vuông góc bề mặt, S là diện tích bị ép. Phải đổi diện tích về m2 để ra Pa. Dạng 2. Tính áp suất của vật trên mặt sàn Tính tổng trọng lượng làm áp lực rồi chia cho tổng diện tích tiếp xúc. Đề bài tham khảo từ ngân hàng:\nCâu 12: Đặt một bao gạo 60kg lên một ghết 4 chân có khối lượng 4kg. Diện tích tiếp xúc với mặt đất của mỗi chân ghế là 8cm2. Áp suất mà gạo và ghế tác dụng lên mặt đất là:\nA. p = 20000N/m2\nB. p = 2000000N/m2\nC. p = 200000N/m2\nD. Là một giá trị khác Theo đáp án của ngân hàng: chọn C. p = 200000N/m2 Tính tổng trọng lượng làm áp lực rồi chia cho tổng diện tích tiếp xúc. Không chỉ lấy khối lượng của bao gạo mà bỏ khối lượng ghế. Dạng 3. Giải thích tăng – giảm áp suất Cùng lực, diện tích càng nhỏ thì áp suất càng lớn; mũi đinh nhọn giúp dễ xuyên vào tường. Đề bài tham khảo từ ngân hàng:\nCâu 18: Khi đóng đinh vào tường ta thường đóng mũi đinh vào tường mà không đóng mũ (tai) đinh vào? Tại sao vậy?\nA. Đóng mũi đinh vào tường để tăng áp lực tác dụng nên đinh dễ vào hơn.\nB. Mũi đinh có diện tích nhỏ nên với cùng áp lực thì có thể gây ra áp suất lớn nên đinh dễ vào hơn.\nC. Mũ đinh có diện tích lớn nên áp lực nhỏ vì vậy đinh khó vào hơn.\nD. Đóng mũi đinh vào tường là do thói quen còn đóng đầu nào cũng được. Theo đáp án của ngân hàng: chọn B. Mũi đinh có diện tích nhỏ nên với cùng áp lực thì có thể gây ra áp suất lớn nên đinh dễ vào hơn. Cùng lực, diện tích càng nhỏ thì áp suất càng lớn; mũi đinh nhọn giúp dễ xuyên vào tường. Không nói mũi đinh tạo lực lớn hơn nếu lực đóng giữ nguyên."},{"number":16,"title":"ÁP SUẤT CHẤT LỎNG, ÁP SUẤT KHÍ QUYỂN.","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-16","summary":"Áp suất chất lỏng và áp suất khí quyển","intro":["Áp suất chất lỏng và áp suất khí quyển"],"forms":[{"title":"Dạng 1. Yếu tố ảnh hưởng áp suất chất lỏng","tip":"p = d×h; phụ thuộc trọng lượng riêng chất lỏng và độ sâu, không phụ thuộc hình dạng bình.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1: Áp suất mà chất lỏng tác dụng lên một điểm phụ thuộc:\nA. Khối lượng lớp chất lỏng phía trên\nB. Trọng lượng lớp chất lỏng phía trên\nC. Thể tích lớp chất lỏng phía trên\nD. Độ cao lớp chất lỏng phía trên","solution":"Theo đáp án của ngân hàng: chọn D. Độ cao lớp chất lỏng phía trên p = d×h; phụ thuộc trọng lượng riêng chất lỏng và độ sâu, không phụ thuộc hình dạng bình.","trap":"Không lấy chiều cao toàn bình nếu điểm xét không ở đáy.","extra":[]},{"title":"Dạng 2. Tính áp suất ở đáy hoặc một điểm","tip":"Xác định độ sâu h rồi dùng p = ρgh hoặc p = d h.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 13: Một bình hình trụ cao 1m đựng đầy nước. Biết khối lượng riêng của nước là 1000kg/m3. Áp suất của nước tác dụng lên đáy bình là:\nA. 10000Pa\nB. 400Pa\nC. 250Pa\nD. 25000Pa","solution":"Theo đáp án của ngân hàng: chọn A. 10000Pa p = 1000×10×1 = 10000 Pa.","trap":"Đổi cm sang m trước khi tính.","extra":[]},{"title":"Dạng 3. Nhận biết tác dụng của áp suất khí quyển","tip":"Khi hút bớt không khí bên trong, áp suất ngoài lớn hơn ép hộp bị bẹp.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 2: Hút bớt không khí trong một vỏ hộp đựng sữa bằng giấy, ta thấy vỏ hộp giấy bị bẹp lại vì:\nA. việc hút mạnh đã làm bẹp hộp.\nB. áp suất bên trong hộp tăng lên làm cho hộp bị biến dạng.\nC. áp suất bên trong hộp giảm, áp suất khí quyển ở bên ngoài hộp lớn hơn làm nó bẹp.\nD. khi hút mạnh làm yếu các thành hộp làm hộp bẹp đi.","solution":"Theo đáp án của ngân hàng: chọn C. áp suất bên trong hộp giảm, áp suất khí quyển ở bên ngoài hộp lớn hơn làm nó bẹp. Khi hút bớt không khí bên trong, áp suất ngoài lớn hơn ép hộp bị bẹp.","trap":"Không giải thích bằng lực hút bí ẩn; nguyên nhân là chênh lệch áp suất.","extra":[]}],"searchText":"ÁP SUẤT CHẤT LỎNG, ÁP SUẤT KHÍ QUYỂN. Áp suất chất lỏng và áp suất khí quyển Dạng 1. Yếu tố ảnh hưởng áp suất chất lỏng p = d×h; phụ thuộc trọng lượng riêng chất lỏng và độ sâu, không phụ thuộc hình dạng bình. Đề bài tham khảo từ ngân hàng:\nCâu 1: Áp suất mà chất lỏng tác dụng lên một điểm phụ thuộc:\nA. Khối lượng lớp chất lỏng phía trên\nB. Trọng lượng lớp chất lỏng phía trên\nC. Thể tích lớp chất lỏng phía trên\nD. Độ cao lớp chất lỏng phía trên Theo đáp án của ngân hàng: chọn D. Độ cao lớp chất lỏng phía trên p = d×h; phụ thuộc trọng lượng riêng chất lỏng và độ sâu, không phụ thuộc hình dạng bình. Không lấy chiều cao toàn bình nếu điểm xét không ở đáy. Dạng 2. Tính áp suất ở đáy hoặc một điểm Xác định độ sâu h rồi dùng p = ρgh hoặc p = d h. Đề bài tham khảo từ ngân hàng:\nCâu 13: Một bình hình trụ cao 1m đựng đầy nước. Biết khối lượng riêng của nước là 1000kg/m3. Áp suất của nước tác dụng lên đáy bình là:\nA. 10000Pa\nB. 400Pa\nC. 250Pa\nD. 25000Pa Theo đáp án của ngân hàng: chọn A. 10000Pa p = 1000×10×1 = 10000 Pa. Đổi cm sang m trước khi tính. Dạng 3. Nhận biết tác dụng của áp suất khí quyển Khi hút bớt không khí bên trong, áp suất ngoài lớn hơn ép hộp bị bẹp. Đề bài tham khảo từ ngân hàng:\nCâu 2: Hút bớt không khí trong một vỏ hộp đựng sữa bằng giấy, ta thấy vỏ hộp giấy bị bẹp lại vì:\nA. việc hút mạnh đã làm bẹp hộp.\nB. áp suất bên trong hộp tăng lên làm cho hộp bị biến dạng.\nC. áp suất bên trong hộp giảm, áp suất khí quyển ở bên ngoài hộp lớn hơn làm nó bẹp.\nD. khi hút mạnh làm yếu các thành hộp làm hộp bẹp đi. Theo đáp án của ngân hàng: chọn C. áp suất bên trong hộp giảm, áp suất khí quyển ở bên ngoài hộp lớn hơn làm nó bẹp. Khi hút bớt không khí bên trong, áp suất ngoài lớn hơn ép hộp bị bẹp. Không giải thích bằng lực hút bí ẩn; nguyên nhân là chênh lệch áp suất."},{"number":17,"title":"LỤC ĐẨY ARCHIMEDES.","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-17","summary":"Lực đẩy Archimedes","intro":["Lực đẩy Archimedes"],"forms":[{"title":"Dạng 1. Công thức lực đẩy Archimedes","tip":"FA = d×V phần chất lỏng bị chiếm chỗ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1: Công thức tính lực đẩy Archimedes là:\nA. FA =DV\nB. FA = Pvat\nC. FA = dV\nD. FA = d.h","solution":"Theo đáp án của ngân hàng: chọn C. FA = dV FA = d×V phần chất lỏng bị chiếm chỗ.","trap":"V là thể tích phần vật chìm, không luôn là toàn bộ vật.","extra":[]},{"title":"Dạng 2. Tính lực đẩy từ số chỉ lực kế","tip":"FA = P ngoài không khí − P biểu kiến trong chất lỏng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 11: Một quả cầu bằng sắt treo vào 1 lực kế ở ngoài không khí lực kế chỉ 1,7N. Nhúng chìm quả cầu vào nước thì lực kế chỉ 1,2N. Lực đẩy Archimedes có độ lớn là:\nA. 1,7N\nB. 1,2N\nC. 2,9N\nD. 0,5N","solution":"Theo đáp án của ngân hàng: chọn D. 0,5N FA = 1,7−1,2 = 0,5 N.","trap":"Không lấy tổng hai số chỉ.","extra":[]},{"title":"Dạng 3. Tính thể tích vật từ lực đẩy","tip":"Tính FA từ độ giảm số chỉ lực kế, rồi V = FA/d.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 18: Một vật móc vào 1 lực kế, ngoài không khí lực kế chỉ 2,13N. Khi nhúng chìm vật vào trong nước lực kế chỉ 1,83N. Biết trọng lượng riêng của nước là 10000N/m3. Thể tích của vật là:\nA. 213cm3\nB. 183cm3\nC. 30cm3\nD. 396cm3","solution":"Theo đáp án của ngân hàng: chọn C. 30cm3 FA = 2,13−1,83 = 0,30 N; V = 0,30/10000 = 3×10−5 m3 = 30 cm3.","trap":"Phải dùng trọng lượng riêng của chất lỏng, không dùng khối lượng riêng nếu chưa nhân g.","extra":[]}],"searchText":"LỤC ĐẨY ARCHIMEDES. Lực đẩy Archimedes Dạng 1. Công thức lực đẩy Archimedes FA = d×V phần chất lỏng bị chiếm chỗ. Đề bài tham khảo từ ngân hàng:\nCâu 1: Công thức tính lực đẩy Archimedes là:\nA. FA =DV\nB. FA = Pvat\nC. FA = dV\nD. FA = d.h Theo đáp án của ngân hàng: chọn C. FA = dV FA = d×V phần chất lỏng bị chiếm chỗ. V là thể tích phần vật chìm, không luôn là toàn bộ vật. Dạng 2. Tính lực đẩy từ số chỉ lực kế FA = P ngoài không khí − P biểu kiến trong chất lỏng. Đề bài tham khảo từ ngân hàng:\nCâu 11: Một quả cầu bằng sắt treo vào 1 lực kế ở ngoài không khí lực kế chỉ 1,7N. Nhúng chìm quả cầu vào nước thì lực kế chỉ 1,2N. Lực đẩy Archimedes có độ lớn là:\nA. 1,7N\nB. 1,2N\nC. 2,9N\nD. 0,5N Theo đáp án của ngân hàng: chọn D. 0,5N FA = 1,7−1,2 = 0,5 N. Không lấy tổng hai số chỉ. Dạng 3. Tính thể tích vật từ lực đẩy Tính FA từ độ giảm số chỉ lực kế, rồi V = FA/d. Đề bài tham khảo từ ngân hàng:\nCâu 18: Một vật móc vào 1 lực kế, ngoài không khí lực kế chỉ 2,13N. Khi nhúng chìm vật vào trong nước lực kế chỉ 1,83N. Biết trọng lượng riêng của nước là 10000N/m3. Thể tích của vật là:\nA. 213cm3\nB. 183cm3\nC. 30cm3\nD. 396cm3 Theo đáp án của ngân hàng: chọn C. 30cm3 FA = 2,13−1,83 = 0,30 N; V = 0,30/10000 = 3×10−5 m3 = 30 cm3. Phải dùng trọng lượng riêng của chất lỏng, không dùng khối lượng riêng nếu chưa nhân g."},{"number":18,"title":"TÁC DỤNG LÀM QUAY CỦA LỰC, MOMENT LỰC.","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-18","summary":"Moment lực và tác dụng làm quay","intro":["Moment lực và tác dụng làm quay"],"forms":[{"title":"Dạng 1. Công thức moment lực","tip":"M = F×d, trong đó d là cánh tay đòn vuông góc từ trục quay đến giá của lực.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 15: Công thức tính moment lực đối với một trục quay\nA. M=F.d\nB. M=F/d\nC. M=d/F\nD. M=2F.d","solution":"Theo đáp án của ngân hàng: chọn A. M=F.d M = F×d, trong đó d là cánh tay đòn vuông góc từ trục quay đến giá của lực.","trap":"Không dùng khoảng cách từ trục đến điểm đặt nếu không vuông góc.","extra":[]},{"title":"Dạng 2. Tính moment lực","tip":"Đổi cánh tay đòn sang mét rồi nhân với lực.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 11: Một lực có độ lớn 10 N tác dụng lên một vật rắn quay quanh một trục cố định, biết khoảng cách từ giá của lực đến trục quay là 20 cm. moment của lực tác dụng lên vật có giá trị là:\nA. 200 N.m.\nB. 200 N/m.\nC. 2 N.m.\nD. 2 N/m.","solution":"Theo đáp án của ngân hàng: chọn C. 2 N.m. d = 20 cm = 0,2 m; M = 10×0,2 = 2 N·m.","trap":"Không để cm trong phép tính N·m.","extra":[]},{"title":"Dạng 3. Điều kiện cân bằng quanh trục","tip":"Vật cân bằng khi tổng moment theo chiều kim đồng hồ bằng tổng moment ngược chiều.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22: Điều kiện cân bằng của một vật rắn có trục quay cố định là\nA. hợp lực tác dụng lên vật bằng 0.\nB. moment của trọng lực tác dụng lên vật bằng 0.\nC. tổng moment của các lực làm vật quay theo một chiều phải bằng tổng moment của các lực làm vật quay theo chiều ngược lại.\nD. giá của trọng lực tác dụng lên vật đi qua trục quay.","solution":"Theo đáp án của ngân hàng: chọn C. tổng moment của các lực làm vật quay theo một chiều phải bằng tổng moment của các lực làm vật quay theo chiều ngược lại. Vật cân bằng khi tổng moment theo chiều kim đồng hồ bằng tổng moment ngược chiều.","trap":"Không chỉ so sánh độ lớn lực mà bỏ cánh tay đòn.","extra":[]}],"searchText":"TÁC DỤNG LÀM QUAY CỦA LỰC, MOMENT LỰC. Moment lực và tác dụng làm quay Dạng 1. Công thức moment lực M = F×d, trong đó d là cánh tay đòn vuông góc từ trục quay đến giá của lực. Đề bài tham khảo từ ngân hàng:\nCâu 15: Công thức tính moment lực đối với một trục quay\nA. M=F.d\nB. M=F/d\nC. M=d/F\nD. M=2F.d Theo đáp án của ngân hàng: chọn A. M=F.d M = F×d, trong đó d là cánh tay đòn vuông góc từ trục quay đến giá của lực. Không dùng khoảng cách từ trục đến điểm đặt nếu không vuông góc. Dạng 2. Tính moment lực Đổi cánh tay đòn sang mét rồi nhân với lực. Đề bài tham khảo từ ngân hàng:\nCâu 11: Một lực có độ lớn 10 N tác dụng lên một vật rắn quay quanh một trục cố định, biết khoảng cách từ giá của lực đến trục quay là 20 cm. moment của lực tác dụng lên vật có giá trị là:\nA. 200 N.m.\nB. 200 N/m.\nC. 2 N.m.\nD. 2 N/m. Theo đáp án của ngân hàng: chọn C. 2 N.m. d = 20 cm = 0,2 m; M = 10×0,2 = 2 N·m. Không để cm trong phép tính N·m. Dạng 3. Điều kiện cân bằng quanh trục Vật cân bằng khi tổng moment theo chiều kim đồng hồ bằng tổng moment ngược chiều. Đề bài tham khảo từ ngân hàng:\nCâu 22: Điều kiện cân bằng của một vật rắn có trục quay cố định là\nA. hợp lực tác dụng lên vật bằng 0.\nB. moment của trọng lực tác dụng lên vật bằng 0.\nC. tổng moment của các lực làm vật quay theo một chiều phải bằng tổng moment của các lực làm vật quay theo chiều ngược lại.\nD. giá của trọng lực tác dụng lên vật đi qua trục quay. Theo đáp án của ngân hàng: chọn C. tổng moment của các lực làm vật quay theo một chiều phải bằng tổng moment của các lực làm vật quay theo chiều ngược lại. Vật cân bằng khi tổng moment theo chiều kim đồng hồ bằng tổng moment ngược chiều. Không chỉ so sánh độ lớn lực mà bỏ cánh tay đòn."},{"number":19,"title":"ĐÒN BẨY VÀ ỨNG DỤNG.","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-19","summary":"Đòn bẩy và ứng dụng","intro":["Đòn bẩy và ứng dụng"],"forms":[{"title":"Dạng 1. Điều kiện lợi về lực","tip":"Muốn lực nâng nhỏ hơn trọng lượng vật, cánh tay đòn của lực nâng phải lớn hơn cánh tay đòn của vật.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 10: họn từ thích hợp điền vào chỗ trống: Muốn lực nâng vật……… trọng lượng của vật thì phải làm cho khoảng cách từ điểm tựa tới điểm tác dụng của lực nâng……khoảng cách từ điểm tựa tới điểm tác dụng của trọng lượng vật.\nA. nhỏ hơn, lớn hơn\nB. nhỏ hơn, nhỏ hơn\nC. lớn hơn, lớn hơn\nD. lớn hơn, nhỏ hơn","solution":"Theo đáp án của ngân hàng: chọn A. nhỏ hơn, lớn hơn Muốn lực nâng nhỏ hơn trọng lượng vật, cánh tay đòn của lực nâng phải lớn hơn cánh tay đòn của vật.","trap":"Không nói đòn bẩy luôn cho lợi về lực.","extra":[]},{"title":"Dạng 2. Cân bằng đòn bẩy","tip":"Áp dụng F1×d1 = F2×d2.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 12: Cho đòn bẩy loại 1 có chiều dài OO1 < OO2. Hai lực tác dụng vào 2 đầu O1 và O2 lần lượt là F1 và F2. Để đòn bẩy cân bằng ta phải có:\nA. Lực F2 có độ lớn lớn hơn lực F1.\nB. Lực F2 CÓ độ lớn nhỏ hơn lực F1.\nC. Hai lực F1 và F2 có độ lớn như nhau.\nD. Không thể cân bằng được, vì OO1 đã nhỏ hơn OO2.","solution":"Theo đáp án của ngân hàng: chọn B. Lực F2 CÓ độ lớn nhỏ hơn lực F1. Áp dụng F1×d1 = F2×d2.","trap":"Đo khoảng cách từ điểm tựa đến giá của lực, không phải chiều dài toàn đòn bẩy.","extra":[]},{"title":"Dạng 3. Bài toán gánh cân bằng","tip":"Vật nặng hơn phải treo gần điểm tựa hơn để moment hai bên bằng nhau.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24: Một người gánh một gánh nước. Thùng thứ nhất nặng 20 kg, thùng thứ hai nặng 30 kg. Gọi điểm tiếp xúc giữa vai với đòn gánh là O, điểm treo thùng thứ nhất vào đòn gánh là O1, điểm treo thùng thứ hai vào đòn gánh là O2. Hỏi OO1 và OO2 có giá trị nào sau đây thì gánh nước cân bằng?\nA. OO1 = 90 cm, OO2 = 90 cm.\nB. OO1 = 90 cm, OO2 = 60 cm\nC. OO1 = 60 cm, OO2 = 90 cm.\nD. OO1 = 60 cm, OO2 = 120 cm","solution":"Theo đáp án của ngân hàng: chọn B. OO1 = 90 cm, OO2 = 60 cm Vật nặng hơn phải treo gần điểm tựa hơn để moment hai bên bằng nhau.","trap":"Không đặt hai thùng cách vai bằng nhau khi khối lượng khác nhau.","extra":[]}],"searchText":"ĐÒN BẨY VÀ ỨNG DỤNG. Đòn bẩy và ứng dụng Dạng 1. Điều kiện lợi về lực Muốn lực nâng nhỏ hơn trọng lượng vật, cánh tay đòn của lực nâng phải lớn hơn cánh tay đòn của vật. Đề bài tham khảo từ ngân hàng:\nCâu 10: họn từ thích hợp điền vào chỗ trống: Muốn lực nâng vật……… trọng lượng của vật thì phải làm cho khoảng cách từ điểm tựa tới điểm tác dụng của lực nâng……khoảng cách từ điểm tựa tới điểm tác dụng của trọng lượng vật.\nA. nhỏ hơn, lớn hơn\nB. nhỏ hơn, nhỏ hơn\nC. lớn hơn, lớn hơn\nD. lớn hơn, nhỏ hơn Theo đáp án của ngân hàng: chọn A. nhỏ hơn, lớn hơn Muốn lực nâng nhỏ hơn trọng lượng vật, cánh tay đòn của lực nâng phải lớn hơn cánh tay đòn của vật. Không nói đòn bẩy luôn cho lợi về lực. Dạng 2. Cân bằng đòn bẩy Áp dụng F1×d1 = F2×d2. Đề bài tham khảo từ ngân hàng:\nCâu 12: Cho đòn bẩy loại 1 có chiều dài OO1 < OO2. Hai lực tác dụng vào 2 đầu O1 và O2 lần lượt là F1 và F2. Để đòn bẩy cân bằng ta phải có:\nA. Lực F2 có độ lớn lớn hơn lực F1.\nB. Lực F2 CÓ độ lớn nhỏ hơn lực F1.\nC. Hai lực F1 và F2 có độ lớn như nhau.\nD. Không thể cân bằng được, vì OO1 đã nhỏ hơn OO2. Theo đáp án của ngân hàng: chọn B. Lực F2 CÓ độ lớn nhỏ hơn lực F1. Áp dụng F1×d1 = F2×d2. Đo khoảng cách từ điểm tựa đến giá của lực, không phải chiều dài toàn đòn bẩy. Dạng 3. Bài toán gánh cân bằng Vật nặng hơn phải treo gần điểm tựa hơn để moment hai bên bằng nhau. Đề bài tham khảo từ ngân hàng:\nCâu 24: Một người gánh một gánh nước. Thùng thứ nhất nặng 20 kg, thùng thứ hai nặng 30 kg. Gọi điểm tiếp xúc giữa vai với đòn gánh là O, điểm treo thùng thứ nhất vào đòn gánh là O1, điểm treo thùng thứ hai vào đòn gánh là O2. Hỏi OO1 và OO2 có giá trị nào sau đây thì gánh nước cân bằng?\nA. OO1 = 90 cm, OO2 = 90 cm.\nB. OO1 = 90 cm, OO2 = 60 cm\nC. OO1 = 60 cm, OO2 = 90 cm.\nD. OO1 = 60 cm, OO2 = 120 cm Theo đáp án của ngân hàng: chọn B. OO1 = 90 cm, OO2 = 60 cm Vật nặng hơn phải treo gần điểm tựa hơn để moment hai bên bằng nhau. Không đặt hai thùng cách vai bằng nhau khi khối lượng khác nhau."},{"number":20,"title":"HIỆN TƯỢNG NHIỄM ĐIỆN DO CỌ XÁT.","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-20","summary":"Nhiễm điện do cọ xát","intro":["Nhiễm điện do cọ xát"],"forms":[{"title":"Dạng 1. Tương tác giữa các điện tích","tip":"Vật nhiễm điện cùng loại đẩy nhau, khác loại hút nhau.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 7: Điền từ thích hợp vào chỗ trống. Các vật nhiễm điện ………… thì đẩy nhau, ………….. thì hút nhau\nA. Khác loại, cùng loại.\nB. Cùng loại, khác loại.\nC. Như nhau, khác nhau.\nD. Khác nhau, như nhau.","solution":"Theo đáp án của ngân hàng: chọn B. Cùng loại, khác loại. Vật nhiễm điện cùng loại đẩy nhau, khác loại hút nhau.","trap":"Vật nhiễm điện vẫn có thể hút vật trung hòa nhẹ do phân cực.","extra":[]},{"title":"Dạng 2. Nhận biết vật bị nhiễm điện","tip":"Vật nhiễm điện có thể hút các vật nhẹ hoặc làm sáng bút thử điện trong thí nghiệm phù hợp.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 6: Chọn câu trả lời đúng. Làm thế nào để biết một vật bị nhiễm điện?\nA. Đưa vật lại gần các vụn giấy, nếu vật hút các mẩu giấy thì kết luận vật bị nhiễm điện\nB. Đưa vật đến gần các vật khác đã bị nhiễm điện nếu chúng hút hay đẩy nhau thì kết luận vật nhiễm điện\nC. Đưa vật lại gần các vụn giấy nếu vật đẩy các mẩu giấy thì kết luận vật bị nhiễm điện\nD. Cả A và C đều đúng","solution":"Theo đáp án của ngân hàng: chọn B. Đưa vật đến gần các vật khác đã bị nhiễm điện nếu chúng hút hay đẩy nhau thì kết luận vật nhiễm điện Vật nhiễm điện có thể hút các vật nhẹ hoặc làm sáng bút thử điện trong thí nghiệm phù hợp.","trap":"Không kết luận chỉ vì vật nóng lên sau cọ xát.","extra":[]},{"title":"Dạng 3. Giải thích hiện tượng hút bụi","tip":"Cọ xát với không khí làm cánh quạt nhiễm điện và hút các hạt bụi nhẹ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 15: Sau một thời gian hoạt động, cánh quạt dính nhiều bụi vì:\nA. Cánh quạt cọ xát với không khí, bị nhiễm điện nên hút nhiều bụi.\nB. Cánh quạt bị ẩm nên hút nhiều bụi.\nC. Một số chất nhờn trong không khí đọng lại ở cánh quạt và hút nhiều bụi.\nD. Bụi có chất keo nên bám vào cánh quạt.","solution":"Theo đáp án của ngân hàng: chọn A. Cánh quạt cọ xát với không khí, bị nhiễm điện nên hút nhiều bụi. Cọ xát với không khí làm cánh quạt nhiễm điện và hút các hạt bụi nhẹ.","trap":"Không cho rằng bụi bám chỉ do lực hấp dẫn.","extra":[]}],"searchText":"HIỆN TƯỢNG NHIỄM ĐIỆN DO CỌ XÁT. Nhiễm điện do cọ xát Dạng 1. Tương tác giữa các điện tích Vật nhiễm điện cùng loại đẩy nhau, khác loại hút nhau. Đề bài tham khảo từ ngân hàng:\nCâu 7: Điền từ thích hợp vào chỗ trống. Các vật nhiễm điện ………… thì đẩy nhau, ………….. thì hút nhau\nA. Khác loại, cùng loại.\nB. Cùng loại, khác loại.\nC. Như nhau, khác nhau.\nD. Khác nhau, như nhau. Theo đáp án của ngân hàng: chọn B. Cùng loại, khác loại. Vật nhiễm điện cùng loại đẩy nhau, khác loại hút nhau. Vật nhiễm điện vẫn có thể hút vật trung hòa nhẹ do phân cực. Dạng 2. Nhận biết vật bị nhiễm điện Vật nhiễm điện có thể hút các vật nhẹ hoặc làm sáng bút thử điện trong thí nghiệm phù hợp. Đề bài tham khảo từ ngân hàng:\nCâu 6: Chọn câu trả lời đúng. Làm thế nào để biết một vật bị nhiễm điện?\nA. Đưa vật lại gần các vụn giấy, nếu vật hút các mẩu giấy thì kết luận vật bị nhiễm điện\nB. Đưa vật đến gần các vật khác đã bị nhiễm điện nếu chúng hút hay đẩy nhau thì kết luận vật nhiễm điện\nC. Đưa vật lại gần các vụn giấy nếu vật đẩy các mẩu giấy thì kết luận vật bị nhiễm điện\nD. Cả A và C đều đúng Theo đáp án của ngân hàng: chọn B. Đưa vật đến gần các vật khác đã bị nhiễm điện nếu chúng hút hay đẩy nhau thì kết luận vật nhiễm điện Vật nhiễm điện có thể hút các vật nhẹ hoặc làm sáng bút thử điện trong thí nghiệm phù hợp. Không kết luận chỉ vì vật nóng lên sau cọ xát. Dạng 3. Giải thích hiện tượng hút bụi Cọ xát với không khí làm cánh quạt nhiễm điện và hút các hạt bụi nhẹ. Đề bài tham khảo từ ngân hàng:\nCâu 15: Sau một thời gian hoạt động, cánh quạt dính nhiều bụi vì:\nA. Cánh quạt cọ xát với không khí, bị nhiễm điện nên hút nhiều bụi.\nB. Cánh quạt bị ẩm nên hút nhiều bụi.\nC. Một số chất nhờn trong không khí đọng lại ở cánh quạt và hút nhiều bụi.\nD. Bụi có chất keo nên bám vào cánh quạt. Theo đáp án của ngân hàng: chọn A. Cánh quạt cọ xát với không khí, bị nhiễm điện nên hút nhiều bụi. Cọ xát với không khí làm cánh quạt nhiễm điện và hút các hạt bụi nhẹ. Không cho rằng bụi bám chỉ do lực hấp dẫn."},{"number":21,"title":"DÒNG ĐIỆN, NGUỒN ĐIỆN.","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-21","summary":"Dòng điện và nguồn điện","intro":["Dòng điện và nguồn điện"],"forms":[{"title":"Dạng 1. Khái niệm dòng điện","tip":"Dòng điện là dòng các hạt mang điện dịch chuyển có hướng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 2: Điền từ thích hợp vào chỗ trống: Dòng điện là các……………dịch chuyển có hướng\nA. Electron.\nB. Ion âm.\nC. Điện tích.\nD. Cả A, B, C đều đúng.","solution":"Theo đáp án của ngân hàng: chọn D. Cả A, B, C đều đúng. Dòng điện là dòng các hạt mang điện dịch chuyển có hướng.","trap":"Không nói mọi chuyển động hỗn loạn của electron đều tạo dòng điện.","extra":[]},{"title":"Dạng 2. Nhận biết nguồn điện","tip":"Nguồn điện duy trì hiệu điện thế giữa hai cực và cung cấp năng lượng cho mạch.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 7: Thiết bị nào sau đây là nguồn điện?\nA. Quạt máy.\nB. Acquy.\nC. Bếp lửa.\nD. Đèn pin","solution":"Theo đáp án của ngân hàng: chọn B. Acquy. Nguồn điện duy trì hiệu điện thế giữa hai cực và cung cấp năng lượng cho mạch.","trap":"Không coi thiết bị tiêu thụ điện là nguồn điện.","extra":[]},{"title":"Dạng 3. Quy ước chiều dòng điện","tip":"Chiều dòng điện quy ước ở mạch ngoài đi từ cực dương qua thiết bị đến cực âm.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 10: Quy ước nào sau đây là đúng\nA. Chiều dòng điện là chiều đi từ cực âm của nguồn điện qua vật dẫn tới cực dương của nguồn điện\nB. Chiều dòng điện là chiều đi từ cực dương của nguồn qua vật dẫn tới cực âm của nguồn điện\nC. Cực dương của nguồn điện là cực xuất phát của các electron khi mắc nguồn với dụng cụ tiêu thụ điện thành mạch kín\nD. Cực âm của nguồn điện là cực đến của các electron khi mắc nguồn với dụng cụ tiêu thụ điện thành mạch kín","solution":"Theo đáp án của ngân hàng: chọn B. Chiều dòng điện là chiều đi từ cực dương của nguồn qua vật dẫn tới cực âm của nguồn điện Chiều dòng điện quy ước ở mạch ngoài đi từ cực dương qua thiết bị đến cực âm.","trap":"Chiều electron trong kim loại ngược với chiều dòng điện quy ước.","extra":[]}],"searchText":"DÒNG ĐIỆN, NGUỒN ĐIỆN. Dòng điện và nguồn điện Dạng 1. Khái niệm dòng điện Dòng điện là dòng các hạt mang điện dịch chuyển có hướng. Đề bài tham khảo từ ngân hàng:\nCâu 2: Điền từ thích hợp vào chỗ trống: Dòng điện là các……………dịch chuyển có hướng\nA. Electron.\nB. Ion âm.\nC. Điện tích.\nD. Cả A, B, C đều đúng. Theo đáp án của ngân hàng: chọn D. Cả A, B, C đều đúng. Dòng điện là dòng các hạt mang điện dịch chuyển có hướng. Không nói mọi chuyển động hỗn loạn của electron đều tạo dòng điện. Dạng 2. Nhận biết nguồn điện Nguồn điện duy trì hiệu điện thế giữa hai cực và cung cấp năng lượng cho mạch. Đề bài tham khảo từ ngân hàng:\nCâu 7: Thiết bị nào sau đây là nguồn điện?\nA. Quạt máy.\nB. Acquy.\nC. Bếp lửa.\nD. Đèn pin Theo đáp án của ngân hàng: chọn B. Acquy. Nguồn điện duy trì hiệu điện thế giữa hai cực và cung cấp năng lượng cho mạch. Không coi thiết bị tiêu thụ điện là nguồn điện. Dạng 3. Quy ước chiều dòng điện Chiều dòng điện quy ước ở mạch ngoài đi từ cực dương qua thiết bị đến cực âm. Đề bài tham khảo từ ngân hàng:\nCâu 10: Quy ước nào sau đây là đúng\nA. Chiều dòng điện là chiều đi từ cực âm của nguồn điện qua vật dẫn tới cực dương của nguồn điện\nB. Chiều dòng điện là chiều đi từ cực dương của nguồn qua vật dẫn tới cực âm của nguồn điện\nC. Cực dương của nguồn điện là cực xuất phát của các electron khi mắc nguồn với dụng cụ tiêu thụ điện thành mạch kín\nD. Cực âm của nguồn điện là cực đến của các electron khi mắc nguồn với dụng cụ tiêu thụ điện thành mạch kín Theo đáp án của ngân hàng: chọn B. Chiều dòng điện là chiều đi từ cực dương của nguồn qua vật dẫn tới cực âm của nguồn điện Chiều dòng điện quy ước ở mạch ngoài đi từ cực dương qua thiết bị đến cực âm. Chiều electron trong kim loại ngược với chiều dòng điện quy ước."},{"number":22,"title":"MẠCH ĐIỆN ĐƠN GIẢN.","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-22","summary":"Mạch điện đơn giản và thiết bị bảo vệ","intro":["Mạch điện đơn giản và thiết bị bảo vệ"],"forms":[{"title":"Dạng 1. Điều kiện để thiết bị hoạt động","tip":"Nguồn, dây dẫn, công tắc và thiết bị phải tạo thành mạch kín.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 8: Với các dụng cụ: pin, bóng đèn, dây nổi, công tắc, để bóng đèn phát sáng ta phải nối chúng lại với nhau thành một mạch kín, gọi là ?\nA. Công tắc.\nB. Cầu dao.\nC. Biến trở.\nD. Mạch điện","solution":"Theo đáp án của ngân hàng: chọn D. Mạch điện Nguồn, dây dẫn, công tắc và thiết bị phải tạo thành mạch kín.","trap":"Mạch có đủ linh kiện nhưng hở vẫn không có dòng điện.","extra":[]},{"title":"Dạng 2. Sơ đồ mạch điện","tip":"Dùng kí hiệu quy ước để biểu diễn nguồn, công tắc, đèn và dây nối; kiểm tra đường đi kín.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 15: Nhằm mô tả đơn giản một mạch điện và lắp mạch điện đúng yêu cầu, người ta sử dụng?\nA. Kí hiệu.\nB. Số đo.\nC. Công thức.\nD. Đáp án khác.","solution":"Theo đáp án của ngân hàng: chọn A. Kí hiệu. Dùng kí hiệu quy ước để biểu diễn nguồn, công tắc, đèn và dây nối; kiểm tra đường đi kín.","trap":"Không vẽ hình thiết bị thật thay cho kí hiệu khi đề yêu cầu sơ đồ.","extra":[]},{"title":"Dạng 3. Vai trò của cầu chì","tip":"Cầu chì tự ngắt khi dòng điện vượt mức an toàn nhờ dây chì nóng chảy.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 10: Cầu chì có tác dụng gì?\nA. Thay đổi dòng điện khi dòng điện đột ngột giảm quá mức.\nB. Bảo vệ các thiết bị điện khác trong mạch không bị hỏng khi dòng điện đột ngột tăng quá mức.\nC. Thay đổi dòng điện khi dòng điện đột ngột tăng quá mức.\nD. Bảo vệ các thiết bị điện khác trong mạch không bị hỏng khi dòng điện đột ngột giảm quá mức.","solution":"Theo đáp án của ngân hàng: chọn B. Bảo vệ các thiết bị điện khác trong mạch không bị hỏng khi dòng điện đột ngột tăng quá mức. Cầu chì tự ngắt khi dòng điện vượt mức an toàn nhờ dây chì nóng chảy.","trap":"Không thay dây chì bằng dây kim loại có tiết diện lớn tùy ý.","extra":[]}],"searchText":"MẠCH ĐIỆN ĐƠN GIẢN. Mạch điện đơn giản và thiết bị bảo vệ Dạng 1. Điều kiện để thiết bị hoạt động Nguồn, dây dẫn, công tắc và thiết bị phải tạo thành mạch kín. Đề bài tham khảo từ ngân hàng:\nCâu 8: Với các dụng cụ: pin, bóng đèn, dây nổi, công tắc, để bóng đèn phát sáng ta phải nối chúng lại với nhau thành một mạch kín, gọi là ?\nA. Công tắc.\nB. Cầu dao.\nC. Biến trở.\nD. Mạch điện Theo đáp án của ngân hàng: chọn D. Mạch điện Nguồn, dây dẫn, công tắc và thiết bị phải tạo thành mạch kín. Mạch có đủ linh kiện nhưng hở vẫn không có dòng điện. Dạng 2. Sơ đồ mạch điện Dùng kí hiệu quy ước để biểu diễn nguồn, công tắc, đèn và dây nối; kiểm tra đường đi kín. Đề bài tham khảo từ ngân hàng:\nCâu 15: Nhằm mô tả đơn giản một mạch điện và lắp mạch điện đúng yêu cầu, người ta sử dụng?\nA. Kí hiệu.\nB. Số đo.\nC. Công thức.\nD. Đáp án khác. Theo đáp án của ngân hàng: chọn A. Kí hiệu. Dùng kí hiệu quy ước để biểu diễn nguồn, công tắc, đèn và dây nối; kiểm tra đường đi kín. Không vẽ hình thiết bị thật thay cho kí hiệu khi đề yêu cầu sơ đồ. Dạng 3. Vai trò của cầu chì Cầu chì tự ngắt khi dòng điện vượt mức an toàn nhờ dây chì nóng chảy. Đề bài tham khảo từ ngân hàng:\nCâu 10: Cầu chì có tác dụng gì?\nA. Thay đổi dòng điện khi dòng điện đột ngột giảm quá mức.\nB. Bảo vệ các thiết bị điện khác trong mạch không bị hỏng khi dòng điện đột ngột tăng quá mức.\nC. Thay đổi dòng điện khi dòng điện đột ngột tăng quá mức.\nD. Bảo vệ các thiết bị điện khác trong mạch không bị hỏng khi dòng điện đột ngột giảm quá mức. Theo đáp án của ngân hàng: chọn B. Bảo vệ các thiết bị điện khác trong mạch không bị hỏng khi dòng điện đột ngột tăng quá mức. Cầu chì tự ngắt khi dòng điện vượt mức an toàn nhờ dây chì nóng chảy. Không thay dây chì bằng dây kim loại có tiết diện lớn tùy ý."},{"number":23,"title":"TÁC DỤNG CỦA DÒNG ĐIỆN.","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-23","summary":"Các tác dụng của dòng điện","intro":["Các tác dụng của dòng điện"],"forms":[{"title":"Dạng 1. Tác dụng nhiệt và phát sáng","tip":"Xét tác dụng chính của thiết bị: bàn là, bếp điện dùng nhiệt; đèn dùng phát sáng nhưng có thể đồng thời tỏa nhiệt.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 2: Hoạt động của dụng cụ nào dưới đây không dựa trên tác dụng nhiệt của dòng điện?\nA. Bàn là điện.\nB. Máy sấy tóc\nC. Đèn LED.\nD. Ấm điện đang đun nước","solution":"Theo đáp án của ngân hàng: chọn C. Đèn LED. Xét tác dụng chính của thiết bị: bàn là, bếp điện dùng nhiệt; đèn dùng phát sáng nhưng có thể đồng thời tỏa nhiệt.","trap":"Một thiết bị có thể biểu hiện nhiều tác dụng của dòng điện.","extra":[]},{"title":"Dạng 2. Tác dụng hóa học","tip":"Dòng điện qua dung dịch điện phân có thể làm chất bám lên điện cực.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 3: Khi cho dòng điện chạy qua dung dịch muối đồng, sau một thời gian thấy có một lớp đồng mỏng bám vào thỏi than nối với điện cực âm của nguồn điện. Có thể giải thích hiện tượng này dựa vào tác dụng nào của dòng điện?\nA. Tác dụng hóa học.\nB. Tác dụng sinh lí\nC. Tác dụng từ.\nD. Tác dụng từ và tác dụng hóa học","solution":"Theo đáp án của ngân hàng: chọn A. Tác dụng hóa học. Dòng điện qua dung dịch điện phân có thể làm chất bám lên điện cực.","trap":"Không nhầm lớp kim loại bám với tác dụng từ.","extra":[]},{"title":"Dạng 3. Tác dụng sinh lí","tip":"Dòng điện đi qua cơ thể có thể kích thích cơ và thần kinh, gây co cơ hoặc nguy hiểm.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 9: Khi tiến hành thí nghiệm cho dòng điện chạy qua đùi ếch thì đùi ếch co lại, đó là tác dụng nào của dòng điện?\nA. Tác dụng hóa học.\nB. Tác dụng từ.\nC. Tác dụng sinh lí.\nD. Tác dụng nhiệt.","solution":"Theo đáp án của ngân hàng: chọn C. Tác dụng sinh lí. Dòng điện đi qua cơ thể có thể kích thích cơ và thần kinh, gây co cơ hoặc nguy hiểm.","trap":"Không tự tiến hành thí nghiệm điện trên cơ thể người.","extra":[]}],"searchText":"TÁC DỤNG CỦA DÒNG ĐIỆN. Các tác dụng của dòng điện Dạng 1. Tác dụng nhiệt và phát sáng Xét tác dụng chính của thiết bị: bàn là, bếp điện dùng nhiệt; đèn dùng phát sáng nhưng có thể đồng thời tỏa nhiệt. Đề bài tham khảo từ ngân hàng:\nCâu 2: Hoạt động của dụng cụ nào dưới đây không dựa trên tác dụng nhiệt của dòng điện?\nA. Bàn là điện.\nB. Máy sấy tóc\nC. Đèn LED.\nD. Ấm điện đang đun nước Theo đáp án của ngân hàng: chọn C. Đèn LED. Xét tác dụng chính của thiết bị: bàn là, bếp điện dùng nhiệt; đèn dùng phát sáng nhưng có thể đồng thời tỏa nhiệt. Một thiết bị có thể biểu hiện nhiều tác dụng của dòng điện. Dạng 2. Tác dụng hóa học Dòng điện qua dung dịch điện phân có thể làm chất bám lên điện cực. Đề bài tham khảo từ ngân hàng:\nCâu 3: Khi cho dòng điện chạy qua dung dịch muối đồng, sau một thời gian thấy có một lớp đồng mỏng bám vào thỏi than nối với điện cực âm của nguồn điện. Có thể giải thích hiện tượng này dựa vào tác dụng nào của dòng điện?\nA. Tác dụng hóa học.\nB. Tác dụng sinh lí\nC. Tác dụng từ.\nD. Tác dụng từ và tác dụng hóa học Theo đáp án của ngân hàng: chọn A. Tác dụng hóa học. Dòng điện qua dung dịch điện phân có thể làm chất bám lên điện cực. Không nhầm lớp kim loại bám với tác dụng từ. Dạng 3. Tác dụng sinh lí Dòng điện đi qua cơ thể có thể kích thích cơ và thần kinh, gây co cơ hoặc nguy hiểm. Đề bài tham khảo từ ngân hàng:\nCâu 9: Khi tiến hành thí nghiệm cho dòng điện chạy qua đùi ếch thì đùi ếch co lại, đó là tác dụng nào của dòng điện?\nA. Tác dụng hóa học.\nB. Tác dụng từ.\nC. Tác dụng sinh lí.\nD. Tác dụng nhiệt. Theo đáp án của ngân hàng: chọn C. Tác dụng sinh lí. Dòng điện đi qua cơ thể có thể kích thích cơ và thần kinh, gây co cơ hoặc nguy hiểm. Không tự tiến hành thí nghiệm điện trên cơ thể người."},{"number":24,"title":"CƯỜNG ĐỘ DÒNG ĐIỆN VÀ HIỆU ĐIỆN THẾ.","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-24","summary":"Cường độ dòng điện và hiệu điện thế","intro":["Cường độ dòng điện và hiệu điện thế"],"forms":[{"title":"Dạng 1. Đại lượng, kí hiệu và đơn vị","tip":"Cường độ dòng điện kí hiệu I, đơn vị A; hiệu điện thế kí hiệu U, đơn vị V.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1: Cường độ dòng điện được kí hiệu là\nA. V\nB. A\nC. U\nD. I","solution":"Theo đáp án của ngân hàng: chọn D. I Cường độ dòng điện kí hiệu I, đơn vị A; hiệu điện thế kí hiệu U, đơn vị V.","trap":"Không nhầm ampe với vôn.","extra":[]},{"title":"Dạng 2. Mắc ampe kế và vôn kế","tip":"Ampe kế mắc nối tiếp; vôn kế mắc song song với hai điểm cần đo; nối đúng cực.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 4: Khi mắc ampe kế vào mạch điện thì cần chú ý điều gì sau đây?\nA. Chốt âm của ampe kế mắc vào cực dương của nguồn điện và chốt dương mắc với bóng đèn.\nB. Không được mắc trực tiếp hai chốt của ampe kế trực tiếp vào nguồn điện.\nC. Chốt dương của ampe kế mắc vào cực âm của nguồn điện và chốt âm mắc với bóng đèn.\nD. Mắc trực tiếp hai chốt của ampe kế vào hai cực của nguồn điện.","solution":"Theo đáp án của ngân hàng: chọn B. Không được mắc trực tiếp hai chốt của ampe kế trực tiếp vào nguồn điện. Ampe kế mắc nối tiếp; vôn kế mắc song song với hai điểm cần đo; nối đúng cực.","trap":"Mắc ampe kế trực tiếp vào hai cực nguồn có thể gây đoản mạch.","extra":[]},{"title":"Dạng 3. Đọc số chỉ dụng cụ","tip":"Giá trị mỗi khoảng = giới hạn đo/số khoảng; nhân với số khoảng kim chỉ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25: Dùng ampe kế có giới hạn đo 5A, trên mặt số được chia là 25 khoảng nhỏ nhất. Khi đo cường độ dòng điện trong mạch điện, kim chỉ thị chỉ ở khoảng thứ 16. Cường độ dòng điện đo được là:\nA. 32 A\nB. 0,32 A\nC. 1,6 A\nD. 3,2 A","solution":"Theo đáp án của ngân hàng: chọn D. 3,2 A Độ chia = 5/25 = 0,2 A; kim ở khoảng 16 nên I = 3,2 A.","trap":"Không lấy số vạch thay cho số khoảng.","extra":[]}],"searchText":"CƯỜNG ĐỘ DÒNG ĐIỆN VÀ HIỆU ĐIỆN THẾ. Cường độ dòng điện và hiệu điện thế Dạng 1. Đại lượng, kí hiệu và đơn vị Cường độ dòng điện kí hiệu I, đơn vị A; hiệu điện thế kí hiệu U, đơn vị V. Đề bài tham khảo từ ngân hàng:\nCâu 1: Cường độ dòng điện được kí hiệu là\nA. V\nB. A\nC. U\nD. I Theo đáp án của ngân hàng: chọn D. I Cường độ dòng điện kí hiệu I, đơn vị A; hiệu điện thế kí hiệu U, đơn vị V. Không nhầm ampe với vôn. Dạng 2. Mắc ampe kế và vôn kế Ampe kế mắc nối tiếp; vôn kế mắc song song với hai điểm cần đo; nối đúng cực. Đề bài tham khảo từ ngân hàng:\nCâu 4: Khi mắc ampe kế vào mạch điện thì cần chú ý điều gì sau đây?\nA. Chốt âm của ampe kế mắc vào cực dương của nguồn điện và chốt dương mắc với bóng đèn.\nB. Không được mắc trực tiếp hai chốt của ampe kế trực tiếp vào nguồn điện.\nC. Chốt dương của ampe kế mắc vào cực âm của nguồn điện và chốt âm mắc với bóng đèn.\nD. Mắc trực tiếp hai chốt của ampe kế vào hai cực của nguồn điện. Theo đáp án của ngân hàng: chọn B. Không được mắc trực tiếp hai chốt của ampe kế trực tiếp vào nguồn điện. Ampe kế mắc nối tiếp; vôn kế mắc song song với hai điểm cần đo; nối đúng cực. Mắc ampe kế trực tiếp vào hai cực nguồn có thể gây đoản mạch. Dạng 3. Đọc số chỉ dụng cụ Giá trị mỗi khoảng = giới hạn đo/số khoảng; nhân với số khoảng kim chỉ. Đề bài tham khảo từ ngân hàng:\nCâu 25: Dùng ampe kế có giới hạn đo 5A, trên mặt số được chia là 25 khoảng nhỏ nhất. Khi đo cường độ dòng điện trong mạch điện, kim chỉ thị chỉ ở khoảng thứ 16. Cường độ dòng điện đo được là:\nA. 32 A\nB. 0,32 A\nC. 1,6 A\nD. 3,2 A Theo đáp án của ngân hàng: chọn D. 3,2 A Độ chia = 5/25 = 0,2 A; kim ở khoảng 16 nên I = 3,2 A. Không lấy số vạch thay cho số khoảng."},{"number":25,"title":"THỰC HÀNH ĐO CƯỜNG ĐỘ DÒNG ĐIỆN VÀ HIỆU ĐIỆN THẾ.","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-25","summary":"Thực hành đo cường độ dòng điện và hiệu điện thế","intro":["Thực hành đo cường độ dòng điện và hiệu điện thế"],"forms":[{"title":"Dạng 1. Lắp ampe kế đo dòng điện","tip":"Ngắt nguồn, chọn giới hạn đo lớn, mắc ampe kế nối tiếp, nối đúng cực rồi mới đóng mạch.","example":"Đề bài thực hành bổ sung:\nHãy nêu các bước mắc ampe kế để đo dòng điện qua một bóng đèn dùng pin.","solution":"Mở công tắc; chọn thang đo; mắc ampe kế nối tiếp với đèn; cực (+) về phía cực dương nguồn; kiểm tra rồi đóng công tắc và đọc số.","trap":"Không đổi chốt đo khi mạch đang có điện.","extra":[]},{"title":"Dạng 2. Mắc vôn kế đo hiệu điện thế","tip":"Vôn kế mắc song song với hai đầu phần tử; chọn thang đo phù hợp và nối đúng cực.","example":"Đề bài thực hành bổ sung:\nHãy mô tả cách đo hiệu điện thế giữa hai đầu bóng đèn trong mạch.","solution":"Mắc hai chốt vôn kế song song với hai đầu đèn, cực (+) về phía cực dương nguồn, chọn giới hạn đo lớn hơn giá trị dự kiến rồi đọc số.","trap":"Không mắc vôn kế nối tiếp.","extra":[]},{"title":"Dạng 3. Ghi kết quả đo và sai số","tip":"Ghi giá trị kèm đơn vị và độ chia nhỏ nhất; đo lặp lại nếu cần.","example":"Đề bài thực hành bổ sung:\nAmpe kế có độ chia nhỏ nhất 0,02 A và kim chỉ đúng vạch 15 tính từ 0. Hãy ghi kết quả đo.","solution":"I = 15×0,02 = 0,30 A; ghi I = 0,30 A.","trap":"Không ghi quá nhiều chữ số vượt độ chính xác của dụng cụ.","extra":[]}],"searchText":"THỰC HÀNH ĐO CƯỜNG ĐỘ DÒNG ĐIỆN VÀ HIỆU ĐIỆN THẾ. Thực hành đo cường độ dòng điện và hiệu điện thế Dạng 1. Lắp ampe kế đo dòng điện Ngắt nguồn, chọn giới hạn đo lớn, mắc ampe kế nối tiếp, nối đúng cực rồi mới đóng mạch. Đề bài thực hành bổ sung:\nHãy nêu các bước mắc ampe kế để đo dòng điện qua một bóng đèn dùng pin. Mở công tắc; chọn thang đo; mắc ampe kế nối tiếp với đèn; cực (+) về phía cực dương nguồn; kiểm tra rồi đóng công tắc và đọc số. Không đổi chốt đo khi mạch đang có điện. Dạng 2. Mắc vôn kế đo hiệu điện thế Vôn kế mắc song song với hai đầu phần tử; chọn thang đo phù hợp và nối đúng cực. Đề bài thực hành bổ sung:\nHãy mô tả cách đo hiệu điện thế giữa hai đầu bóng đèn trong mạch. Mắc hai chốt vôn kế song song với hai đầu đèn, cực (+) về phía cực dương nguồn, chọn giới hạn đo lớn hơn giá trị dự kiến rồi đọc số. Không mắc vôn kế nối tiếp. Dạng 3. Ghi kết quả đo và sai số Ghi giá trị kèm đơn vị và độ chia nhỏ nhất; đo lặp lại nếu cần. Đề bài thực hành bổ sung:\nAmpe kế có độ chia nhỏ nhất 0,02 A và kim chỉ đúng vạch 15 tính từ 0. Hãy ghi kết quả đo. I = 15×0,02 = 0,30 A; ghi I = 0,30 A. Không ghi quá nhiều chữ số vượt độ chính xác của dụng cụ."},{"number":26,"title":"NĂNG LƯỢNG NHIỆT VÀ NỘI NĂNG.","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-26","summary":"Năng lượng nhiệt và nội năng","intro":["Năng lượng nhiệt và nội năng"],"forms":[{"title":"Dạng 1. Hai cách làm thay đổi nội năng","tip":"Nội năng thay đổi bằng truyền nhiệt hoặc thực hiện công.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 8: Có mấy cách làm thay đổi nhiệt năng của vật?\nA. 1\nB. 2\nC. 3\nD. 4","solution":"Theo đáp án của ngân hàng: chọn B. 2 Nội năng thay đổi bằng truyền nhiệt hoặc thực hiện công.","trap":"Không coi mọi thay đổi cơ năng đều là truyền nhiệt.","extra":[]},{"title":"Dạng 2. Trao đổi nhiệt giữa vật nóng và lạnh","tip":"Nhiệt truyền tự phát từ vật có nhiệt độ cao sang vật có nhiệt độ thấp cho đến cân bằng nhiệt.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 18: Nung nóng một cục sắt thả vào chậu nước lạnh, nước nóng lên, cục sắt nguội đi. Trong quá trình này có sự chuyển hóa năng lượng:\nA. Từ cơ năng sang nhiệt năng.\nB. Từ nhiệt năng sang nhiệt năng.\nC. Từ cơ năng sang cơ năng.\nD. Từ nhiệt năng sang cơ năng.","solution":"Theo đáp án của ngân hàng: chọn B. Từ nhiệt năng sang nhiệt năng. Nhiệt truyền tự phát từ vật có nhiệt độ cao sang vật có nhiệt độ thấp cho đến cân bằng nhiệt.","trap":"Không nói “vật lạnh truyền lạnh”.","extra":[]},{"title":"Dạng 3. Tính nhiệt lượng từ độ biến thiên nội năng","tip":"Nếu vật chỉ nhận nhiệt và không thực hiện công đáng kể thì Q = ΔU.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25: Một vật có nhiệt năng 200J, sau khi nung nóng nhiệt năng của nó là 400J. Hỏi nhiệt lượng mà vật nhận được là bao nhiêu?\nA. 600 J\nB. 200 J\nC. 100 J\nD. 400 J","solution":"Theo đáp án của ngân hàng: chọn B. 200 J Q = 400−200 = 200 J.","trap":"Phải xét dấu: nhận nhiệt Q dương, tỏa nhiệt Q âm theo quy ước.","extra":[]}],"searchText":"NĂNG LƯỢNG NHIỆT VÀ NỘI NĂNG. Năng lượng nhiệt và nội năng Dạng 1. Hai cách làm thay đổi nội năng Nội năng thay đổi bằng truyền nhiệt hoặc thực hiện công. Đề bài tham khảo từ ngân hàng:\nCâu 8: Có mấy cách làm thay đổi nhiệt năng của vật?\nA. 1\nB. 2\nC. 3\nD. 4 Theo đáp án của ngân hàng: chọn B. 2 Nội năng thay đổi bằng truyền nhiệt hoặc thực hiện công. Không coi mọi thay đổi cơ năng đều là truyền nhiệt. Dạng 2. Trao đổi nhiệt giữa vật nóng và lạnh Nhiệt truyền tự phát từ vật có nhiệt độ cao sang vật có nhiệt độ thấp cho đến cân bằng nhiệt. Đề bài tham khảo từ ngân hàng:\nCâu 18: Nung nóng một cục sắt thả vào chậu nước lạnh, nước nóng lên, cục sắt nguội đi. Trong quá trình này có sự chuyển hóa năng lượng:\nA. Từ cơ năng sang nhiệt năng.\nB. Từ nhiệt năng sang nhiệt năng.\nC. Từ cơ năng sang cơ năng.\nD. Từ nhiệt năng sang cơ năng. Theo đáp án của ngân hàng: chọn B. Từ nhiệt năng sang nhiệt năng. Nhiệt truyền tự phát từ vật có nhiệt độ cao sang vật có nhiệt độ thấp cho đến cân bằng nhiệt. Không nói “vật lạnh truyền lạnh”. Dạng 3. Tính nhiệt lượng từ độ biến thiên nội năng Nếu vật chỉ nhận nhiệt và không thực hiện công đáng kể thì Q = ΔU. Đề bài tham khảo từ ngân hàng:\nCâu 25: Một vật có nhi
