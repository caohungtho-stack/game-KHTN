loại: Na, Cu, Ag, Mg, K, Al, Fe, Zn. Có bao nhiêu kim loại điều chế được bằng phương pháp điện phân nóng chảy?\nA. 1.\nB. 4.\nC. 2.\nD. 3.","solution":"Na, Mg, K, Al ⇒ 4 kim loại.","trap":"Không chọn điện phân dung dịch cho Na, Mg, Al vì nước bị điện phân trước.","extra":[],"exampleQuestionNumber":24},{"title":"Dạng 2. CO khử oxide nào?","tip":"Ở mức KHTN 9, CO khử được oxide của kim loại đứng sau Al như Zn, Fe, Cu; không khử MgO, Al₂O₃.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Dẫn khí CO dư qua hỗn hợp bột gồm MgO, CuO, Al2O3 và FeO, nung nóng. Sau khi các phản ứng xảy ra hoàn toàn thu được hỗn hợp rắn Y. Số oxide kim loại trong Y là\nA. 3.\nB. 1.\nC. 2.\nD. 4.","solution":"CuO và FeO bị khử thành Cu, Fe; MgO và Al₂O₃ còn lại. Số oxide trong chất rắn cuối là 2.","trap":"Đề hỏi số oxide, không hỏi số kim loại.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 3. Tính quặng từ sản phẩm kim loại có hao hụt","tip":"Đi ngược: tính Fe trong sản phẩm → chia phần thu hồi → chia phần Fe trong quặng tinh → chia hàm lượng quặng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Để sản xuất được 2 triệu chiếc chảo gang có hàm lượng sắt là 95% thì cần dùng tối thiểu x tấn quặng magnetite chứa 80% Fe3O4. Biết rằng mỗi chiếc chảo gang nặng 3 kg và trong quá trình sản xuất lượng sắt bị hao hụt là 10%. Giá trị của x gần nhất với giá trị nào sau đây?\nA. 9856.\nB. 12576.\nC. 19945.\nD. 10932.","solution":"mFe sản phẩm=2·10⁶·3·0,95=5,7·10⁶ kg. Fe cần trước hao hụt=5,7·10⁶/0,90. Trong Fe₃O₄, %Fe=168/232. Quặng cần=[5,7·10⁶/0,90]/[(168/232)·0,80]≈10,932·10⁶ kg=10932 tấn.","trap":"Hao hụt 10% nghĩa là thu hồi 90%, nên phải chia 0,90.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 4. Tính lượng kim loại dùng để khử ion kim loại","tip":"Từ CₘV tính mol ion. Dùng tỉ lệ phương trình để tính kim loại khử.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Cho dần bột sắt vào 50 mL dung dịch CuSO4 0,2M, khuấy nhẹ cho tới khi dung dịch mất màu xanh. Lượng mạt sắt đã dùng là\nA. 0,056 gam.\nB. Đáp án khác.\nC. 0,56 gam.\nD. 5,6 gam.","solution":"nCu²⁺=0,05·0,2=0,01 mol. Fe+Cu²⁺→Fe²⁺+Cu tỉ lệ 1:1 ⇒ nFe=0,01 ⇒ mFe=0,56 g.","trap":"“Cho dần đến mất màu” nghĩa là dùng vừa đủ, không phải Fe dư nhiều.","extra":[],"exampleQuestionNumber":23},{"title":"Dạng 5. Xác định công thức hợp kim từ phần trăm khối lượng","tip":"Giả sử 100 g hợp kim, đổi khối lượng mỗi kim loại thành mol rồi chia cho số nhỏ nhất.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 [TH]. Một loại đồng thau có chứa 59,63% Cu và 40,37% Zn. Hợp kim này có cấu tạo tinh thể của hợp chất hoá học giữa đồng và kẽm. Công thức hoá học của hợp chất là\nA. Cu2Zn.\nB. Cu3Zn2.\nC. Cu2Zn3.\nD. CuZn2.","solution":"nCu=59,63/64≈0,9317; nZn=40,37/65≈0,6211. Tỉ lệ≈1,5:1=3:2 ⇒ Cu₃Zn₂.","trap":"Phần trăm khối lượng không phải tỉ lệ số nguyên tử.","extra":[],"exampleQuestionNumber":25},{"title":"Dạng 6. Làm sạch kim loại bằng dung dịch muối của chính nó","tip":"Chọn ion của kim loại cần giữ để các tạp chất mạnh hơn đẩy kim loại đó ra, còn kim loại nền không bị hòa tan.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Một mẫu kim loại thủy ngân có lẫn tạp chất kẽm, thiếc, chì. Để làm sạch các tạp chất này có thể cho mẫu thủy ngân trên tác dụng với lượng dư của dung dịch nào sau đây ?\nA. Hg(NO3)2.\nB. Sn(NO3)2.\nC. Zn(NO3)2.\nD. Pb(NO3)2.","solution":"Dùng Hg(NO₃)₂ dư: Zn, Sn, Pb đẩy Hg²⁺ thành Hg và bản thân tan; thủy ngân được giữ lại/tăng thêm.","trap":"Không chọn dung dịch muối của tạp chất vì có thể không loại được tất cả tạp chất.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 7. Chuỗi khử oxide bằng H₂ rồi hòa tan kim loại","tip":"Từ H₂ sinh ra khi kim loại tác dụng HCl suy ra mol kim loại; quay ngược phản ứng khử oxide để tính H₂O.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. Khử hoàn toàn một lượng Fe3O4 bằng H2 dư, thu được chất rắn X và m gam H2O. Hòa tan hết X trong dung dịch HCl dư, thu được 1,11555 lít khí H2 (đkc). Giá trị của m là\nA. 0,81.\nB. 0,72.\nC. 1,08.\nD. 1,35.","solution":"nH₂ sau=1,11555/24,79=0,045 mol ⇒ nFe=0,045 mol. Fe₃O₄+4H₂→3Fe+4H₂O nên nFe₃O₄=0,015; nH₂O=0,060 mol ⇒ mH₂O=1,08 g.","trap":"Hai lượng H₂ ở hai giai đoạn không bằng nhau; phải đi qua mol Fe trung gian.","extra":[],"exampleQuestionNumber":27},{"title":"Dạng 8. Đếm kim loại cơ bản trong các hợp kim","tip":"Nhớ: gang, thép carbon, inox có kim loại cơ bản Fe; đuy-ra có Al; đồng thau có Cu.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 28 [TH]. Cho các hợp kim: gang, thép carbon, inox, đuy – ra, đồng thau. Có bao nhiêu hợp kim có kim loại cơ bản là Fe?\nA. 4.\nB. 2.\nC. 1.\nD. 3.","solution":"Có 3 hợp kim nền Fe: gang, thép carbon, inox.","trap":"“Có chứa Fe” khác với “kim loại cơ bản là Fe”.","extra":[],"exampleQuestionNumber":28},{"title":"Dạng 9. Tính thành phần nguyên tố trong quặng/oxide  [Mở rộng thường gặp]","tip":"Tính % kim loại = tổng khối lượng nguyên tử kim loại/M oxide·100%. Đây là bước nền của bài quặng.","example":"Đề bài mở rộng:\nMagnetite có công thức hóa học Fe₃O₄. Cho nguyên tử khối Fe = 56 và O = 16. Hãy tính phần trăm khối lượng của nguyên tố sắt trong Fe₃O₄.","solution":"%Fe=3·56/(3·56+4·16)·100%=168/232·100%≈72,41%.","trap":"Không dùng 56/(56+64); trong Fe₃O₄ có 3 nguyên tử Fe.","extra":[]}],"subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-20","summary":"Các dạng định lượng gồm: chọn phương pháp điều chế, khử oxide, tính quặng, tính công thức hợp kim và chuỗi khử oxide – hòa tan kim loại.","searchText":"TÁCH KIM LOẠI VÀ VIỆC SỬ DỤNG HỢP KIM Các dạng định lượng gồm: chọn phương pháp điều chế, khử oxide, tính quặng, tính công thức hợp kim và chuỗi khử oxide – hòa tan kim loại. Dạng 1. Chọn phương pháp điều chế kim loại Nhìn vị trí kim loại: K, Na, Ca, Mg, Al dùng điện phân nóng chảy; Fe, Zn, Cu có thể nhiệt luyện; Cu, Ag, Au có thể thủy luyện. Theo Câu 24: Trong Na, Cu, Ag, Mg, K, Al, Fe, Zn có bao nhiêu kim loại điều chế bằng điện phân nóng chảy? Na, Mg, K, Al ⇒ 4 kim loại. Không chọn điện phân dung dịch cho Na, Mg, Al vì nước bị điện phân trước.  Dạng 2. CO khử oxide nào? Ở mức KHTN 9, CO khử được oxide của kim loại đứng sau Al như Zn, Fe, Cu; không khử MgO, Al₂O₃. Theo Câu 19: CO dư qua MgO, CuO, Al₂O₃, FeO. CuO và FeO bị khử thành Cu, Fe; MgO và Al₂O₃ còn lại. Số oxide trong chất rắn cuối là 2. Đề hỏi số oxide, không hỏi số kim loại.  Dạng 3. Tính quặng từ sản phẩm kim loại có hao hụt Đi ngược: tính Fe trong sản phẩm → chia phần thu hồi → chia phần Fe trong quặng tinh → chia hàm lượng quặng. Theo Câu 20: 2 triệu chảo, mỗi chảo 3 kg, gang chứa 95% Fe; hao hụt Fe 10%; quặng chứa 80% Fe₃O₄. mFe sản phẩm=2·10⁶·3·0,95=5,7·10⁶ kg. Fe cần trước hao hụt=5,7·10⁶/0,90. Trong Fe₃O₄, %Fe=168/232. Quặng cần=[5,7·10⁶/0,90]/[(168/232)·0,80]≈10,932·10⁶ kg=10932 tấn. Hao hụt 10% nghĩa là thu hồi 90%, nên phải chia 0,90.  Dạng 4. Tính lượng kim loại dùng để khử ion kim loại Từ CₘV tính mol ion. Dùng tỉ lệ phương trình để tính kim loại khử. Theo Câu 23: Cho Fe vào 50 mL CuSO₄ 0,2 M đến mất màu xanh. nCu²⁺=0,05·0,2=0,01 mol. Fe+Cu²⁺→Fe²⁺+Cu tỉ lệ 1:1 ⇒ nFe=0,01 ⇒ mFe=0,56 g. “Cho dần đến mất màu” nghĩa là dùng vừa đủ, không phải Fe dư nhiều.  Dạng 5. Xác định công thức hợp kim từ phần trăm khối lượng Giả sử 100 g hợp kim, đổi khối lượng mỗi kim loại thành mol rồi chia cho số nhỏ nhất. Theo Câu 25: Hợp kim chứa 59,63% Cu và 40,37% Zn. nCu=59,63/64≈0,9317; nZn=40,37/65≈0,6211. Tỉ lệ≈1,5:1=3:2 ⇒ Cu₃Zn₂. Phần trăm khối lượng không phải tỉ lệ số nguyên tử.  Dạng 6. Làm sạch kim loại bằng dung dịch muối của chính nó Chọn ion của kim loại cần giữ để các tạp chất mạnh hơn đẩy kim loại đó ra, còn kim loại nền không bị hòa tan. Theo Câu 22: Hg lẫn Zn, Sn, Pb. Dùng Hg(NO₃)₂ dư: Zn, Sn, Pb đẩy Hg²⁺ thành Hg và bản thân tan; thủy ngân được giữ lại/tăng thêm. Không chọn dung dịch muối của tạp chất vì có thể không loại được tất cả tạp chất.  Dạng 7. Chuỗi khử oxide bằng H₂ rồi hòa tan kim loại Từ H₂ sinh ra khi kim loại tác dụng HCl suy ra mol kim loại; quay ngược phản ứng khử oxide để tính H₂O. Theo Câu 27: Khử Fe₃O₄ bằng H₂; Fe thu được cho HCl tạo 1,11555 L H₂. nH₂ sau=1,11555/24,79=0,045 mol ⇒ nFe=0,045 mol. Fe₃O₄+4H₂→3Fe+4H₂O nên nFe₃O₄=0,015; nH₂O=0,060 mol ⇒ mH₂O=1,08 g. Hai lượng H₂ ở hai giai đoạn không bằng nhau; phải đi qua mol Fe trung gian.  Dạng 8. Đếm kim loại cơ bản trong các hợp kim Nhớ: gang, thép carbon, inox có kim loại cơ bản Fe; đuy-ra có Al; đồng thau có Cu. Theo Câu 28: Gang, thép carbon, inox, đuy-ra, đồng thau. Có 3 hợp kim nền Fe: gang, thép carbon, inox. “Có chứa Fe” khác với “kim loại cơ bản là Fe”.  Dạng 9. Tính thành phần nguyên tố trong quặng/oxide  [Mở rộng thường gặp] Tính % kim loại = tổng khối lượng nguyên tử kim loại/M oxide·100%. Đây là bước nền của bài quặng. Mở rộng: Tính phần trăm Fe trong Fe₃O₄. %Fe=3·56/(3·56+4·16)·100%=168/232·100%≈72,41%. Không dùng 56/(56+64); trong Fe₃O₄ có 3 nguyên tử Fe. "},{"number":21,"title":"SỰ KHÁC NHAU CƠ BẢN GIỮA PHI KIM VÀ KIM LOẠI","subject":"Hóa học","intro":["Dạng toán tập trung vào carbon khử oxide, đốt carbon, kim loại tác dụng chlorine, hiệu suất và nhận biết xu hướng nhường – nhận electron."],"forms":[{"title":"Dạng 1. Carbon khử CuO – tính lượng C","tip":"Theo C+2CuO→2Cu+CO₂, nC=1/2 nCuO.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Khối lượng C cần dùng để khử 16 gam CuO tạo thành CO2 là\nA. 2,1 gam.\nB. 3,6 gam.\nC. 2,2 gam.\nD. 1,2 gam.","solution":"nCuO=16/80=0,20 mol ⇒ nC=0,10 mol ⇒ mC=1,2 g.","trap":"Không dùng tỉ lệ 1:1 giữa C và CuO.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 2. Carbon khử oxide – tính kim loại thu được","tip":"Từ mol oxide suy ra mol kim loại theo chỉ số trong công thức. Nếu phản ứng hoàn toàn, số mol nguyên tử kim loại được bảo toàn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Khử hoàn toàn 4,46 gam PbO bằng C dư ở nhiệt độ cao, thu được khối lượng Pb là\nA. 5,15 gam.\nB. 2,56 gam.\nC. 4,14 gam.\nD. 3,36 gam.","solution":"M(PbO)=223; nPbO=4,46/223=0,020 mol ⇒ nPb=0,020 mol ⇒ mPb=4,14 g.","trap":"Không cần tính lượng carbon vì carbon dư.","extra":[],"exampleQuestionNumber":23},{"title":"Dạng 3. Đốt carbon – tính thể tích CO₂","tip":"C+O₂→CO₂ tỉ lệ mol 1:1. VCO₂=(mC/12)·24,79.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 28 [TH]. Đốt cháy 3,6 gam C bằng lượng dư khí oxygen, sau phản ứng thu được V lít khí CO2 ở điều kiện chuẩn. Giá trị của V là\nA. 4,948 lít.\nB. 6,40 lít.\nC. 2,479 lít.\nD. 7,437 lít.","solution":"nC=3,6/12=0,30 mol ⇒ nCO₂=0,30 ⇒ V=7,437 L.","trap":"“Thể tích tối đa” ngụ ý carbon cháy hoàn toàn thành CO₂, không tạo CO.","extra":[],"exampleQuestionNumber":28},{"title":"Dạng 4. Tìm kim loại hóa trị II từ chloride","tip":"MCl₂: mCl=m muối−mM; nM=nCl/2; M=mM/nM.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 [TH]. Cho 19,5 gam kim loại M hóa trị II tác dụng với khí chlorine dư thì thu được 40,8 gam muối. Kim loại M là\nA. Mg.\nB. Fe.\nC. Cu.\nD. Zn.","solution":"mCl=21,3 g ⇒ nCl=0,60 mol ⇒ nM=0,30 mol ⇒ M=19,5/0,30=65 ⇒ Zn.","trap":"Không lấy 21,3/71 vì trong muối dùng nguyên tử Cl, không phải phân tử Cl₂.","extra":[],"exampleQuestionNumber":25},{"title":"Dạng 5. Tìm kim loại hóa trị III từ chloride","tip":"MCl₃: nM=nCl/3.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 26 [TH]. Cho 10,8 gam kim loại M hóa trị III tác dụng với khí chlorine dư thì thu được 53,4 gam muối. Hãy xác định kim loại M?\nA. Mg.\nB. Al.\nC. Fe.\nD. Cr.","solution":"mCl=42,6 g ⇒ nCl=1,20 mol ⇒ nM=0,40 mol ⇒ M=10,8/0,40=27 ⇒ Al.","trap":"Nếu đáp án có Fe, nhớ Fe hóa trị III có M=56, không phù hợp phép tính.","extra":[],"exampleQuestionNumber":26},{"title":"Dạng 6. Hiệu suất phản ứng tạo muối","tip":"Tính khối lượng sản phẩm lí thuyết từ chất giới hạn, rồi H=m thực/m lí thuyết·100%.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. Đốt cháy 12 gam magnesium trong khí chlorine thu được 19 gam magnesium chloride. Hiệu suất của phản ứng trên là\nA. 25%.\nB. 30%.\nC. 40%.\nD. 35%.","solution":"nMg=12/24=0,50 mol ⇒ mMgCl₂ lí thuyết=0,50·95=47,5 g. H=19/47,5·100%=40%.","trap":"Không lấy 19/12; hiệu suất so với sản phẩm lí thuyết, không so với nguyên liệu.","extra":[],"exampleQuestionNumber":27},{"title":"Dạng 7. Đếm chất có xu hướng nhường hoặc nhận electron","tip":"Kim loại thường nhường electron. Phi kim mạnh như O₂, Cl₂, S thường nhận electron. Carbon có thể vừa oxi hóa vừa khử nên không xếp vào nhóm “chỉ” một xu hướng nếu đề hỏi chặt.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 29 [TH]. Cho các chất: K, Mg, C, Al, O2, Cl2, S. Có bao nhiêu chất chỉ có khả năng nhường electron trong các phản ứng hóa học?\nA. 3.\nB. 1.\nC. 4.\nD. 2.","solution":"K, Mg, Al là kim loại nên chỉ có xu hướng nhường electron trong phạm vi bài học ⇒ 3 chất.","trap":"Phân biệt “có khả năng nhận” với “chỉ có khả năng nhận”; từ “chỉ” làm thay đổi cách đếm.","extra":[],"exampleQuestionNumber":29},{"title":"Dạng 8. Suy luận ứng dụng từ tính chất của phi kim","tip":"Gắn từ khóa: kim cương–cứng; than chì–mềm, dẫn điện; than hoạt tính–hấp phụ; chlorine–tẩy, khử trùng; sulfur–lưu hóa cao su.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24 [TH]. Cho các ứng dụng dụng: Làm đồ trang sức, lưu hóa cao su, khử trùng nước sinh hoạt, mặt nạ phòng độc, ruột bút chì. Có bao nhiêu ứng dụng là của carbon?\nA. 1.\nB. 2.\nC. 4.\nD. 3.","solution":"Carbon: đồ trang sức (kim cương), mặt nạ phòng độc (than hoạt tính), ruột bút chì (than chì) ⇒ 3 ứng dụng.","trap":"Lưu hóa cao su thuộc sulfur; khử trùng nước thuộc chlorine.","extra":[],"exampleQuestionNumber":24}],"subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-21","summary":"Dạng toán tập trung vào carbon khử oxide, đốt carbon, kim loại tác dụng chlorine, hiệu suất và nhận biết xu hướng nhường – nhận electron.","searchText":"SỰ KHÁC NHAU CƠ BẢN GIỮA PHI KIM VÀ KIM LOẠI Dạng toán tập trung vào carbon khử oxide, đốt carbon, kim loại tác dụng chlorine, hiệu suất và nhận biết xu hướng nhường – nhận electron. Dạng 1. Carbon khử CuO – tính lượng C Theo C+2CuO→2Cu+CO₂, nC=1/2 nCuO. Theo Câu 19: Khử 16 g CuO tạo CO₂. nCuO=16/80=0,20 mol ⇒ nC=0,10 mol ⇒ mC=1,2 g. Không dùng tỉ lệ 1:1 giữa C và CuO.  Dạng 2. Carbon khử oxide – tính kim loại thu được Từ mol oxide suy ra mol kim loại theo chỉ số trong công thức. Nếu phản ứng hoàn toàn, số mol nguyên tử kim loại được bảo toàn. Theo Câu 23: Khử 4,46 g PbO bằng C dư. M(PbO)=223; nPbO=4,46/223=0,020 mol ⇒ nPb=0,020 mol ⇒ mPb=4,14 g. Không cần tính lượng carbon vì carbon dư.  Dạng 3. Đốt carbon – tính thể tích CO₂ C+O₂→CO₂ tỉ lệ mol 1:1. VCO₂=(mC/12)·24,79. Theo Câu 28: Đốt 3,6 g C bằng O₂ dư. nC=3,6/12=0,30 mol ⇒ nCO₂=0,30 ⇒ V=7,437 L. “Thể tích tối đa” ngụ ý carbon cháy hoàn toàn thành CO₂, không tạo CO.  Dạng 4. Tìm kim loại hóa trị II từ chloride MCl₂: mCl=m muối−mM; nM=nCl/2; M=mM/nM. Theo Câu 25: 19,5 g M tạo 40,8 g MCl₂. mCl=21,3 g ⇒ nCl=0,60 mol ⇒ nM=0,30 mol ⇒ M=19,5/0,30=65 ⇒ Zn. Không lấy 21,3/71 vì trong muối dùng nguyên tử Cl, không phải phân tử Cl₂.  Dạng 5. Tìm kim loại hóa trị III từ chloride MCl₃: nM=nCl/3. Theo Câu 26: 10,8 g M tạo 53,4 g muối. mCl=42,6 g ⇒ nCl=1,20 mol ⇒ nM=0,40 mol ⇒ M=10,8/0,40=27 ⇒ Al. Nếu đáp án có Fe, nhớ Fe hóa trị III có M=56, không phù hợp phép tính.  Dạng 6. Hiệu suất phản ứng tạo muối Tính khối lượng sản phẩm lí thuyết từ chất giới hạn, rồi H=m thực/m lí thuyết·100%. Theo Câu 27: 12 g Mg cháy trong Cl₂, thu 19 g MgCl₂. nMg=12/24=0,50 mol ⇒ mMgCl₂ lí thuyết=0,50·95=47,5 g. H=19/47,5·100%=40%. Không lấy 19/12; hiệu suất so với sản phẩm lí thuyết, không so với nguyên liệu.  Dạng 7. Đếm chất có xu hướng nhường hoặc nhận electron Kim loại thường nhường electron. Phi kim mạnh như O₂, Cl₂, S thường nhận electron. Carbon có thể vừa oxi hóa vừa khử nên không xếp vào nhóm “chỉ” một xu hướng nếu đề hỏi chặt. Theo Câu 29: K, Mg, C, Al, O₂, Cl₂, S – chất chỉ nhường electron? K, Mg, Al là kim loại nên chỉ có xu hướng nhường electron trong phạm vi bài học ⇒ 3 chất. Phân biệt “có khả năng nhận” với “chỉ có khả năng nhận”; từ “chỉ” làm thay đổi cách đếm.  Dạng 8. Suy luận ứng dụng từ tính chất của phi kim Gắn từ khóa: kim cương–cứng; than chì–mềm, dẫn điện; than hoạt tính–hấp phụ; chlorine–tẩy, khử trùng; sulfur–lưu hóa cao su. Theo Câu 24: Đồ trang sức, lưu hóa cao su, khử trùng nước, mặt nạ phòng độc, ruột bút chì – bao nhiêu ứng dụng của carbon? Carbon: đồ trang sức (kim cương), mặt nạ phòng độc (than hoạt tính), ruột bút chì (than chì) ⇒ 3 ứng dụng. Lưu hóa cao su thuộc sulfur; khử trùng nước thuộc chlorine. "},{"number":22,"title":"GIỚI THIỆU VỀ HỢP CHẤT HỮU CƠ","subject":"Hóa học","intro":["Trọng tâm gồm phân loại hợp chất hữu cơ, hydrocarbon và dẫn xuất; tính thành phần phần trăm; xác định công thức đơn giản nhất và công thức phân tử."],"forms":[{"title":"Dạng 1. Nhận biết hợp chất hữu cơ và các ngoại lệ","tip":"Gặp chất chứa C, kiểm tra nhóm ngoại lệ trước: CO, CO₂, H₂CO₃ và muối carbonate là vô cơ. Các chất như CH₄, CH₃Cl, C₂H₅OH, CH₃COONa được xếp hữu cơ trong phạm vi bài.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. Cho các chất: CO2, HCOOH, C2H6O, CH3COOH, CH3Cl, NaCl, K2CO3. Số hợp chất hữu cơ trong các chất trên là bao nhiêu?\nA. 3.\nB. 2.\nC. 4.\nD. 5.","solution":"Loại CO₂, NaCl và K₂CO₃. Còn HCOOH, C₂H₆O, CH₃COOH, CH₃Cl ⇒ có 4 hợp chất hữu cơ.","trap":"Không kết luận “cứ có carbon là hữu cơ”; phải loại các hợp chất carbon vô cơ được nêu trong bài.","extra":[],"exampleQuestionNumber":27},{"title":"Dạng 2. Phân biệt hydrocarbon và dẫn xuất hydrocarbon","tip":"Chỉ nhìn thành phần nguyên tố: có đúng C và H ⇒ hydrocarbon; xuất hiện thêm O, N, Cl, Br… ⇒ dẫn xuất.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 28 [TH]. Cho các chất: CH4, C2H6O, C2H4O2, C3H8, C2H2, C2H5Cl, C6H6. Số hợp chất thuộc loại hydrocarbon trong dãy trên là\nA. 5.\nB. 3.\nC. 2.\nD. 4.","solution":"Hydrocarbon là CH₄, C₃H₈, C₂H₂, C₆H₆ ⇒ có 4 chất.","trap":"Không dựa vào tên gọi hoặc trạng thái; chỉ cần kiểm tra các nguyên tố trong công thức.","extra":[],"exampleQuestionNumber":28},{"title":"Dạng 3. Xác định công thức phân tử từ khối lượng mol","tip":"Với các đáp án cho sẵn, tính nhanh M từng chất hoặc nhận dạng theo dãy quen thuộc. Hydrocarbon M=30 chỉ phù hợp C₂H₆.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Hydrocarbon X có khối lượng mol phân tử là 30 g/mol. X là\nA. CH4.\nB. C3H8.\nC. C2H4.\nD. C2H6.","solution":"M(C₂H₆)=2·12+6=30 ⇒ X=C₂H₆.","trap":"Phải bảo đảm chất được chọn đúng loại hydrocarbon, tức chỉ chứa C và H.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 4. Xác định công thức từ tỉ lệ khối lượng các nguyên tố","tip":"Chia khối lượng từng nguyên tố cho nguyên tử khối để ra tỉ lệ mol nguyên tử; rút gọn về số nguyên nhỏ nhất.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Chất hữu cơ X có khối lượng phân tử bằng 123 và khối lượng của C, H, O, N trong phân tử tỉ lệ với nhau theo thứ tự là 72 : 5 : 32 : 14. Công thức phân tử của X là\nA. C6H12ON.\nB. C6H14O2N.\nC. C6H5O2N.\nD. C6H6ON2.","solution":"72/12 : 5/1 : 32/16 : 14/14 = 6:5:2:1 ⇒ C₆H₅O₂N. M tính được đúng 123 nên đây là công thức phân tử.","trap":"Tỉ lệ khối lượng không phải tỉ lệ số nguyên tử; luôn phải chia cho nguyên tử khối.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 5. Tính phần trăm khối lượng nguyên tố","tip":"Tính M chất, lấy tổng khối lượng nguyên tố cần tìm trong một phân tử chia M rồi nhân 100%.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Thành phần phần trăm về khối lượng của các nguyên tố C, H, O trong C2H6O lần lượt là\nA. 34,8%; 13%; 52,2%.\nB. 52,2%; 13%; 34,8%.\nC. 52,2%; 34,8%; 13%.\nD. 13%; 34,8%; 52,2%.","solution":"M=46. %C=24/46=52,2%; %H=6/46=13,0%; %O=16/46=34,8%.","trap":"Tổng các phần trăm phải xấp xỉ 100%; đây là bước kiểm tra cực nhanh.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 6. Lập công thức đơn giản nhất từ phần trăm khối lượng","tip":"Giả sử 100 g chất, đổi phần trăm thành gam, chia cho nguyên tử khối rồi chia tất cả cho số nhỏ nhất.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 26 [TH]. Hợp chất X có thành phần phần trăm về khối lượng: C (85,8%) và H (14,2%). Công thức đơn giản nhất của X là\nA. CH4.\nB. CH2.\nC. C3H4.\nD. CH3.","solution":"85,8/12 : 14,2/1 = 7,15:14,2 ≈ 1:2 ⇒ công thức đơn giản nhất CH₂.","trap":"Công thức đơn giản nhất chưa chắc là công thức phân tử nếu đề chưa cho M.","extra":[],"exampleQuestionNumber":26},{"title":"Dạng 7. Xác định công thức từ sản phẩm cháy có nitrogen","tip":"Tính mol nguyên tử C, H, N từ CO₂, H₂O, N₂; chia cho số nhỏ nhất để tìm công thức đơn giản nhất, sau đó dùng tỉ khối để kiểm tra M.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Đốt cháy hoàn toàn 1,605 gam hợp chất hữu cơ X, thu được 4,62 gam CO2; 1,215 gam H2O và 185,925 mL N2 (đkc). Tỉ khối hơi của X so với không khí không vượt quá 4. Công thức phân tử của X là\nA. C2H5NO2.\nB. C4H9NO2.\nC. C7H9N.\nD. C6H7N.","solution":"nC=4,62/44=0,105; nH=2·1,215/18=0,135; nN=2·0,185925/24,79=0,015. Tỉ lệ=7:9:1 ⇒ C₇H₉N. M=107 và d≈107/29<4.","trap":"Thể tích N₂ cho mol phân tử N₂; phải nhân 2 để ra mol nguyên tử N.","extra":[],"exampleQuestionNumber":23},{"title":"Dạng 8. Tìm chất có phần trăm carbon lớn nhất","tip":"So tỉ số khối lượng C/M. Với cùng một nguyên tử C, chất có phân tử khối nhỏ hơn thường có %C lớn hơn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24 [TH]. Chất có phần trăm khối lượng carbon lớn nhất là\nA. CH2Cl2.\nB. CHCl3.\nC. CH3Cl.\nD. CH4.","solution":"Cả bốn chất đều có 1 C; CH₄ có M nhỏ nhất nên %C lớn nhất: 12/16=75%.","trap":"Không chỉ so số nguyên tử C; phải so với toàn bộ phân tử khối.","extra":[],"exampleQuestionNumber":24}],"subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-22","summary":"Trọng tâm gồm phân loại hợp chất hữu cơ, hydrocarbon và dẫn xuất; tính thành phần phần trăm; xác định công thức đơn giản nhất và công thức phân tử.","searchText":"GIỚI THIỆU VỀ HỢP CHẤT HỮU CƠ Trọng tâm gồm phân loại hợp chất hữu cơ, hydrocarbon và dẫn xuất; tính thành phần phần trăm; xác định công thức đơn giản nhất và công thức phân tử. Dạng 1. Nhận biết hợp chất hữu cơ và các ngoại lệ Gặp chất chứa C, kiểm tra nhóm ngoại lệ trước: CO, CO₂, H₂CO₃ và muối carbonate là vô cơ. Các chất như CH₄, CH₃Cl, C₂H₅OH, CH₃COONa được xếp hữu cơ trong phạm vi bài. Theo Câu 27: CO₂, HCOOH, C₂H₆O, CH₃COOH, CH₃Cl, NaCl, K₂CO₃. Có bao nhiêu hợp chất hữu cơ? Loại CO₂, NaCl và K₂CO₃. Còn HCOOH, C₂H₆O, CH₃COOH, CH₃Cl ⇒ có 4 hợp chất hữu cơ. Không kết luận “cứ có carbon là hữu cơ”; phải loại các hợp chất carbon vô cơ được nêu trong bài.  Dạng 2. Phân biệt hydrocarbon và dẫn xuất hydrocarbon Chỉ nhìn thành phần nguyên tố: có đúng C và H ⇒ hydrocarbon; xuất hiện thêm O, N, Cl, Br… ⇒ dẫn xuất. Theo Câu 28: CH₄, C₂H₆O, C₂H₄O₂, C₃H₈, C₂H₂, C₂H₅Cl, C₆H₆. Hydrocarbon là CH₄, C₃H₈, C₂H₂, C₆H₆ ⇒ có 4 chất. Không dựa vào tên gọi hoặc trạng thái; chỉ cần kiểm tra các nguyên tố trong công thức.  Dạng 3. Xác định công thức phân tử từ khối lượng mol Với các đáp án cho sẵn, tính nhanh M từng chất hoặc nhận dạng theo dãy quen thuộc. Hydrocarbon M=30 chỉ phù hợp C₂H₆. Theo Câu 20: Hydrocarbon X có M=30 g/mol. M(C₂H₆)=2·12+6=30 ⇒ X=C₂H₆. Phải bảo đảm chất được chọn đúng loại hydrocarbon, tức chỉ chứa C và H.  Dạng 4. Xác định công thức từ tỉ lệ khối lượng các nguyên tố Chia khối lượng từng nguyên tố cho nguyên tử khối để ra tỉ lệ mol nguyên tử; rút gọn về số nguyên nhỏ nhất. Theo Câu 19: mC:mH:mO:mN=72:5:32:14 và M=123. 72/12 : 5/1 : 32/16 : 14/14 = 6:5:2:1 ⇒ C₆H₅O₂N. M tính được đúng 123 nên đây là công thức phân tử. Tỉ lệ khối lượng không phải tỉ lệ số nguyên tử; luôn phải chia cho nguyên tử khối.  Dạng 5. Tính phần trăm khối lượng nguyên tố Tính M chất, lấy tổng khối lượng nguyên tố cần tìm trong một phân tử chia M rồi nhân 100%. Theo Câu 22: Tính %C, %H, %O trong C₂H₆O. M=46. %C=24/46=52,2%; %H=6/46=13,0%; %O=16/46=34,8%. Tổng các phần trăm phải xấp xỉ 100%; đây là bước kiểm tra cực nhanh.  Dạng 6. Lập công thức đơn giản nhất từ phần trăm khối lượng Giả sử 100 g chất, đổi phần trăm thành gam, chia cho nguyên tử khối rồi chia tất cả cho số nhỏ nhất. Theo Câu 26: X chứa 85,8% C và 14,2% H. 85,8/12 : 14,2/1 = 7,15:14,2 ≈ 1:2 ⇒ công thức đơn giản nhất CH₂. Công thức đơn giản nhất chưa chắc là công thức phân tử nếu đề chưa cho M.  Dạng 7. Xác định công thức từ sản phẩm cháy có nitrogen Tính mol nguyên tử C, H, N từ CO₂, H₂O, N₂; chia cho số nhỏ nhất để tìm công thức đơn giản nhất, sau đó dùng tỉ khối để kiểm tra M. Theo Câu 23: Đốt 1,605 g X thu 4,62 g CO₂; 1,215 g H₂O; 185,925 mL N₂ ở đkc; dX/kk≤4. nC=4,62/44=0,105; nH=2·1,215/18=0,135; nN=2·0,185925/24,79=0,015. Tỉ lệ=7:9:1 ⇒ C₇H₉N. M=107 và d≈107/29<4. Thể tích N₂ cho mol phân tử N₂; phải nhân 2 để ra mol nguyên tử N.  Dạng 8. Tìm chất có phần trăm carbon lớn nhất So tỉ số khối lượng C/M. Với cùng một nguyên tử C, chất có phân tử khối nhỏ hơn thường có %C lớn hơn. Theo Câu 24: CH₂Cl₂, CHCl₃, CH₃Cl, CH₄. Cả bốn chất đều có 1 C; CH₄ có M nhỏ nhất nên %C lớn nhất: 12/16=75%. Không chỉ so số nguyên tử C; phải so với toàn bộ phân tử khối. "},{"number":23,"title":"ALKANE (ANKAN)","subject":"Hóa học","intro":["Các câu tính toán tập trung vào công thức CₙH₂ₙ₊₂, tỉ khối, thành phần phần trăm, phản ứng cháy và hỗn hợp hai ankan liên tiếp."],"forms":[{"title":"Dạng 1. Xác định công thức ankan từ tỉ khối","tip":"Tính M trước, sau đó dùng n = (M − 2)/14. Nếu đáp án cho sẵn, so trực tiếp với dãy M: 16, 30, 44, 58, 72…","example":"Đề bài tham khảo từ ngân hàng:\nCâu 13 [NB]. Một hợp chất X có tỉ khối hơi đối với hydrogen bằng 22. Công thức phân tử đúng của X là\nA. C3H8.\nB. CH4\nC. C2H6.\nD. C4H10.","solution":"M(X) = 2·22 = 44. Với ankan: n = (44−2)/14 = 3 ⇒ X = C₃H₈. Khoanh ngay C₃H₈.","trap":"Chỉ nhân 2 khi so với H₂; nếu so với không khí phải nhân 29.","extra":[],"exampleQuestionNumber":13},{"title":"Dạng 2. Tính hoặc suy ra phần trăm khối lượng C, H","tip":"Với CₙH₂ₙ₊₂: %C = 12n/(14n+2)·100%; %H = (2n+2)/(14n+2)·100%. Trắc nghiệm nên thay đáp án thay vì giải phương trình dài.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Phần trăm khối lượng carbon trong alkane X là 83,33%. Công thức phân tử của X là\nA. C3H8.\nB. C10H22.\nC. C5H12.\nD. CH4.","solution":"Thử C₅H₁₂: %C = 60/72·100% = 83,33% ⇒ X = C₅H₁₂. Mẹo: %C của ankan tăng dần theo n; %H giảm dần.","trap":"Nhớ riêng CH₄: 75% C và 25% H.","extra":[],"exampleQuestionNumber":23},{"title":"Dạng 3. Xác định công thức hydrocarbon từ thể tích sản phẩm cháy","tip":"Với 1 thể tích CₓHᵧ cháy: tạo x thể tích CO₂ và y/2 thể tích hơi H₂O, nếu các khí đo cùng điều kiện.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Đốt cháy hoàn toàn 1 thể tích hydrocarbon Q, thu được 4 thể tích CO2 và 5 thể tích hơi nước (đo ở cùng điều kiện nhiệt độ và áp suất). Công thức phân tử của hydrocarbon Q là\nA. C3H8.\nB. C4H10.\nC. C3H6.\nD. C2H4.","solution":"x = 4; y/2 = 5 ⇒ y = 10 ⇒ Q = C₄H₁₀. Không cần cân bằng toàn bộ phương trình.","trap":"Chỉ dùng trực tiếp tỉ lệ thể tích khi các khí cùng nhiệt độ và áp suất.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 4. Tìm số nguyên tử C từ lượng CO₂","tip":"Đốt a mol CₓHᵧ thu b mol CO₂ thì x = b/a. Nếu đề chỉ cần chọn chất, không cần tính lượng H₂O.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Đốt cháy 0,5 mol hiđrocacbon X được H2O và 22 gam CO2. X là\nA. CH4.\nB. C6H6.\nC. C2H2.\nD. C2H4.","solution":"n(CO₂) = 22/44 = 0,5 mol ⇒ x = 0,5/0,5 = 1. Trong các phương án, chất có 1 C là CH₄.","trap":"Không suy ra y nếu đề không cho thêm dữ kiện; chỉ chọn trong các đáp án phù hợp.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 5. Tính nhanh O₂, CO₂ và không khí khi đốt methane","tip":"Học thuộc CH₄ + 2O₂ → CO₂ + 2H₂O. Cùng điều kiện: V(O₂)=2V(CH₄), V(CO₂)=V(CH₄). Nếu O₂ chiếm 1/5 không khí thì V(kk)=5V(O₂).","example":"Đề bài tham khảo từ ngân hàng:\nCâu 26 [TH]. Đốt cháy hoàn toàn 12,395 lít khí methane (đkc). Thể tích không khí (đkc) cần dùng là\nA. 540 lít.\nB. 123,95 lít.\nC. 743,7 lít.\nD. 317,85 lít.","solution":"V(O₂)=2·12,395=24,79 L; V(kk)=5·24,79=123,95 L. Không cần đổi sang mol.","trap":"Chỉ áp dụng hệ số 5 khi đề quy ước O₂ chiếm 1/5 thể tích không khí.","extra":[],"exampleQuestionNumber":26},{"title":"Dạng 6. Hỗn hợp hai ankan liên tiếp","tip":"Tính n(CO₂), n(H₂O). Có n(hỗn hợp ankan)=n(H₂O)−n(CO₂). Sau đó số C trung bình = n(CO₂)/n(hỗn hợp). Hai ankan nằm hai phía của giá trị trung bình.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Đốt cháy hoàn toàn hỗn hợp X gồm hai alkane kế tiếp trong dãy đồng đẳng, thu được 24,2 gam CO2 và 12,6 gam H2O. Công thức phân tử 2 alkane là\nA. CH4 và C2H6.\nB. C2H6 và C3H8.\nC. C3H8 và C4H10.\nD. C4H10 và C5H12","solution":"n(CO₂)=0,55; n(H₂O)=0,70 ⇒ n hỗn hợp=0,15. Số C trung bình=0,55/0,15=3,67 ⇒ hai ankan liên tiếp là C₃H₈ và C₄H₁₀.","trap":"Không lập hệ hai ẩn khi đề chỉ hỏi cặp ankan; số C trung bình là đường tắt.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 7. Xác định hydrocarbon từ tỉ lệ khối lượng CO₂ và H₂O","tip":"Với CₓHᵧ: m(CO₂):m(H₂O)=44x:9y. Trắc nghiệm nên thay từng đáp án vào biểu thức.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 29 [TH]. Nếu khi đốt cháy hoàn toàn hydrocarbon X mà khối lượng CO2 bằng 66,165% tổng khối lượng của CO2 và H2O. Công thức phân tử của X là\nA. C4H10.\nB. C5H12.\nC. C4H6.\nD. C6H6.","solution":"Thử C₄H₁₀: m(CO₂)=4·44=176; m(H₂O)=5·18=90. Tỉ lệ=176/(176+90)=66,165% ⇒ chọn C₄H₁₀.","trap":"Đề hỏi phần trăm khối lượng sản phẩm, không được dùng trực tiếp tỉ lệ mol.","extra":[],"exampleQuestionNumber":29},{"title":"Dạng 8. Nhìn hệ số sản phẩm để tìm X","tip":"Quy phương trình về 1 mol X. Hệ số CO₂ là số C; hai lần hệ số H₂O là số H.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. Cho phương trình hóa học: 2X + 7O2 4CO2 + 6H2O X là\nA. C6H6.\nB. C2H2.\nC. C2H6.\nD. C2H4.","solution":"Chia 2: X → 2CO₂ + 3H₂O ⇒ X có 2 C và 6 H ⇒ X=C₂H₆.","trap":"Không lấy hệ số 4 và 6 làm số nguyên tử khi phương trình đang viết cho 2 mol X.","extra":[],"exampleQuestionNumber":27}],"subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-23","summary":"Các câu tính toán tập trung vào công thức CₙH₂ₙ₊₂, tỉ khối, thành phần phần trăm, phản ứng cháy và hỗn hợp hai ankan liên tiếp.","searchText":"ALKANE (ANKAN) Các câu tính toán tập trung vào công thức CₙH₂ₙ₊₂, tỉ khối, thành phần phần trăm, phản ứng cháy và hỗn hợp hai ankan liên tiếp. Dạng 1. Xác định công thức ankan từ tỉ khối Tính M trước, sau đó dùng n = (M − 2)/14. Nếu đáp án cho sẵn, so trực tiếp với dãy M: 16, 30, 44, 58, 72… Theo Câu 13: X có dX/H₂ = 22. X là chất nào? M(X) = 2·22 = 44. Với ankan: n = (44−2)/14 = 3 ⇒ X = C₃H₈. Khoanh ngay C₃H₈. Chỉ nhân 2 khi so với H₂; nếu so với không khí phải nhân 29.  Dạng 2. Tính hoặc suy ra phần trăm khối lượng C, H Với CₙH₂ₙ₊₂: %C = 12n/(14n+2)·100%; %H = (2n+2)/(14n+2)·100%. Trắc nghiệm nên thay đáp án thay vì giải phương trình dài. Theo Câu 23: Ankan X có %C = 83,33%. Thử C₅H₁₂: %C = 60/72·100% = 83,33% ⇒ X = C₅H₁₂. Mẹo: %C của ankan tăng dần theo n; %H giảm dần. Nhớ riêng CH₄: 75% C và 25% H.  Dạng 3. Xác định công thức hydrocarbon từ thể tích sản phẩm cháy Với 1 thể tích CₓHᵧ cháy: tạo x thể tích CO₂ và y/2 thể tích hơi H₂O, nếu các khí đo cùng điều kiện. Theo Câu 22: 1 thể tích Q tạo 4 thể tích CO₂ và 5 thể tích hơi nước. x = 4; y/2 = 5 ⇒ y = 10 ⇒ Q = C₄H₁₀. Không cần cân bằng toàn bộ phương trình. Chỉ dùng trực tiếp tỉ lệ thể tích khi các khí cùng nhiệt độ và áp suất.  Dạng 4. Tìm số nguyên tử C từ lượng CO₂ Đốt a mol CₓHᵧ thu b mol CO₂ thì x = b/a. Nếu đề chỉ cần chọn chất, không cần tính lượng H₂O. Theo Câu 21: Đốt 0,5 mol X thu được 22 g CO₂. n(CO₂) = 22/44 = 0,5 mol ⇒ x = 0,5/0,5 = 1. Trong các phương án, chất có 1 C là CH₄. Không suy ra y nếu đề không cho thêm dữ kiện; chỉ chọn trong các đáp án phù hợp.  Dạng 5. Tính nhanh O₂, CO₂ và không khí khi đốt methane Học thuộc CH₄ + 2O₂ → CO₂ + 2H₂O. Cùng điều kiện: V(O₂)=2V(CH₄), V(CO₂)=V(CH₄). Nếu O₂ chiếm 1/5 không khí thì V(kk)=5V(O₂). Theo Câu 26: Đốt 12,395 L CH₄, tính thể tích không khí. V(O₂)=2·12,395=24,79 L; V(kk)=5·24,79=123,95 L. Không cần đổi sang mol. Chỉ áp dụng hệ số 5 khi đề quy ước O₂ chiếm 1/5 thể tích không khí.  Dạng 6. Hỗn hợp hai ankan liên tiếp Tính n(CO₂), n(H₂O). Có n(hỗn hợp ankan)=n(H₂O)−n(CO₂). Sau đó số C trung bình = n(CO₂)/n(hỗn hợp). Hai ankan nằm hai phía của giá trị trung bình. Theo Câu 19: Thu 24,2 g CO₂ và 12,6 g H₂O. n(CO₂)=0,55; n(H₂O)=0,70 ⇒ n hỗn hợp=0,15. Số C trung bình=0,55/0,15=3,67 ⇒ hai ankan liên tiếp là C₃H₈ và C₄H₁₀. Không lập hệ hai ẩn khi đề chỉ hỏi cặp ankan; số C trung bình là đường tắt.  Dạng 7. Xác định hydrocarbon từ tỉ lệ khối lượng CO₂ và H₂O Với CₓHᵧ: m(CO₂):m(H₂O)=44x:9y. Trắc nghiệm nên thay từng đáp án vào biểu thức. Theo Câu 29: m(CO₂) bằng 66,165% tổng m(CO₂)+m(H₂O). Thử C₄H₁₀: m(CO₂)=4·44=176; m(H₂O)=5·18=90. Tỉ lệ=176/(176+90)=66,165% ⇒ chọn C₄H₁₀. Đề hỏi phần trăm khối lượng sản phẩm, không được dùng trực tiếp tỉ lệ mol.  Dạng 8. Nhìn hệ số sản phẩm để tìm X Quy phương trình về 1 mol X. Hệ số CO₂ là số C; hai lần hệ số H₂O là số H. Theo Câu 27: 2X + 7O₂ → 4CO₂ + 6H₂O. Chia 2: X → 2CO₂ + 3H₂O ⇒ X có 2 C và 6 H ⇒ X=C₂H₆. Không lấy hệ số 4 và 6 làm số nguyên tử khi phương trình đang viết cho 2 mol X. "},{"number":24,"title":"ALKENE (ANKEN)","subject":"Hóa học","intro":["Trọng tâm là công thức CₙH₂ₙ, phản ứng cháy, cộng bromine và trùng hợp tạo polymer."],"forms":[{"title":"Dạng 1. Xác định anken từ tỉ khối","tip":"Tính M rồi chia 14. Dãy nhanh: C₂H₄ = 28; C₃H₆ = 42; C₄H₈ = 56; C₅H₁₀ = 70.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 17 [NB]. Khí X có tỉ khối so với hydrogenlà 14. Khí X là\nA. C2H4.\nB. C2H2.\nC. CH4.\nD. C2H6.","solution":"M(X)=28 ⇒ n=28/14=2 ⇒ X=C₂H₄.","trap":"Anken mạch hở bắt đầu từ n=2; không có CH₂.","extra":[],"exampleQuestionNumber":17},{"title":"Dạng 2. Nhận dạng anken qua sản phẩm cháy","tip":"Đốt anken luôn có n(CO₂)=n(H₂O). Trong đáp án, chọn hydrocarbon có H=2C.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Đốt cháy chất nào sau đây cho số mol CO2 bằng số mol H2O?\nA. C2H4.\nB. CH4.\nC. C2H2.\nD. C6H6.","solution":"C₂H₄ có H=2C ⇒ tạo 2CO₂ và 2H₂O. Khoanh C₂H₄.","trap":"Tỉ lệ 1:1 là tỉ lệ mol hoặc thể tích hơi cùng điều kiện, không phải tỉ lệ khối lượng.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 3. Tính lượng bromine hoặc anken phản ứng","tip":"Với anken có một liên kết đôi: n(anken)=n(Br₂). Tính mol chất đã biết, đổi sang đại lượng cần hỏi.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Khối lượng khí ethylene cần dùng để phản ứng hết 8 gam bromine trong dung dịch là\nA. 7 gam.\nB. 1,4 gam.\nC. 14 gam.\nD. 0,7 gam.","solution":"n(Br₂)=8/160=0,05 mol ⇒ n(C₂H₄)=0,05 ⇒ m=0,05·28=1,4 g.","trap":"Không dùng tỉ lệ khối lượng 1:1; chỉ tỉ lệ mol là 1:1.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 4. Bromine cho dưới dạng dung dịch mol","tip":"Tính n(Br₂)=Cₘ·V(L). Nếu vừa đủ với anken một nối đôi thì n(anken)=n(Br₂).","example":"Đề bài tham khảo từ ngân hàng:\nCâu 26 [TH]. Để phản ứng hết với 5,9496 lít khí ethylene (đkc) thì thể tích dung dịch bromine 1M cần dùng là:\nA. 0,48 lít.\nB. 0,24 lít.\nC. 0,75 lít.\nD. 0,12 lít.","solution":"n(C₂H₄)=5,9496/24,79=0,24 mol ⇒ n(Br₂)=0,24 ⇒ V dung dịch=0,24/1=0,24 L.","trap":"100 mL phải đổi thành 0,100 L trước khi nhân nồng độ.","extra":[],"exampleQuestionNumber":26},{"title":"Dạng 5. Tìm anken từ khối lượng sản phẩm cộng","tip":"Dùng bảo toàn khối lượng: m(Br₂)=m(sản phẩm)−m(anken). Sau đó n(anken)=n(Br₂), suy ra M.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. Cho 2,24 gam một alkene X tác dụng với dung dịch Br2 dư, thu được 8,64 gam sản phẩm cộng. Công thức phân tử của alkene là\nA. C3H6.\nB. C2H4.\nC. C4H8.\nD. C5H10.","solution":"m(Br₂)=6,40 g ⇒ n(Br₂)=0,04 mol ⇒ n anken=0,04. M=2,24/0,04=56 ⇒ n=56/14=4 ⇒ C₄H₈.","trap":"Sản phẩm cộng nặng hơn anken đúng bằng khối lượng bromine đã cộng.","extra":[],"exampleQuestionNumber":27},{"title":"Dạng 6. Trùng hợp anken – tính khối lượng polymer","tip":"Phản ứng trùng hợp không tạo sản phẩm phụ nên m polymer lí thuyết = m monomer đã phản ứng. Chỉ cần nhân độ tinh khiết và hiệu suất.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 29 [TH]. Từ 4 tấn C2H4 có chứa 30% tạp chất có thểđiều chế bao nhiêu tấn PE? (Biết hiệu suất phản ứng là 90%)\nA. 2,52.\nB. 3,6.\nC. 2,55.\nD. 2,8.","solution":"m C₂H₄ tinh khiết=4·70%=2,8 tấn. m PE=2,8·90%=2,52 tấn.","trap":"Không nhân hoặc chia hệ số trùng hợp n khi tính khối lượng.","extra":[],"exampleQuestionNumber":29},{"title":"Dạng 7. Hỗn hợp hydrocarbon – dùng số nguyên tử trung bình","tip":"Từ tổng mol hỗn hợp, tổng mol CO₂ và H₂O, tính C trung bình = nCO₂/nhh; H trung bình = 2nH₂O/nhh. Thử nhanh các cặp đáp án.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Đốt cháy hoàn toàn 7,437 lít (đkc) hỗn hợp gồm hai hydrocarbon X và Y (MY > MX), thu được 12,395 lít CO2 (đkc) và 10,8 gam H2O. Y là chất nào sau đây?\nA. C2H2.\nB. C4H8.\nC. CH4.\nD. C2H4.","solution":"n hỗn hợp=0,30; nCO₂=0,50; nH₂O=0,60. Trung bình C=1,67; H=4. Cặp CH₄ và C₂H₄ cùng có 4 H, cho C trung bình giữa 1 và 2. Chất nặng hơn Y là C₂H₄.","trap":"Ưu tiên thử đáp án khi chỉ có bốn cặp chất; nhanh hơn lập hệ tổng quát.","extra":[],"exampleQuestionNumber":20}],"subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-24","summary":"Trọng tâm là công thức CₙH₂ₙ, phản ứng cháy, cộng bromine và trùng hợp tạo polymer.","searchText":"ALKENE (ANKEN) Trọng tâm là công thức CₙH₂ₙ, phản ứng cháy, cộng bromine và trùng hợp tạo polymer. Dạng 1. Xác định anken từ tỉ khối Tính M rồi chia 14. Dãy nhanh: C₂H₄ = 28; C₃H₆ = 42; C₄H₈ = 56; C₅H₁₀ = 70. Theo Câu 17: dX/H₂ = 14. M(X)=28 ⇒ n=28/14=2 ⇒ X=C₂H₄. Anken mạch hở bắt đầu từ n=2; không có CH₂.  Dạng 2. Nhận dạng anken qua sản phẩm cháy Đốt anken luôn có n(CO₂)=n(H₂O). Trong đáp án, chọn hydrocarbon có H=2C. Theo Câu 21: Chất nào cháy cho số mol CO₂ bằng số mol H₂O? C₂H₄ có H=2C ⇒ tạo 2CO₂ và 2H₂O. Khoanh C₂H₄. Tỉ lệ 1:1 là tỉ lệ mol hoặc thể tích hơi cùng điều kiện, không phải tỉ lệ khối lượng.  Dạng 3. Tính lượng bromine hoặc anken phản ứng Với anken có một liên kết đôi: n(anken)=n(Br₂). Tính mol chất đã biết, đổi sang đại lượng cần hỏi. Theo Câu 22: Tính khối lượng C₂H₄ phản ứng hết với 8 g Br₂. n(Br₂)=8/160=0,05 mol ⇒ n(C₂H₄)=0,05 ⇒ m=0,05·28=1,4 g. Không dùng tỉ lệ khối lượng 1:1; chỉ tỉ lệ mol là 1:1.  Dạng 4. Bromine cho dưới dạng dung dịch mol Tính n(Br₂)=Cₘ·V(L). Nếu vừa đủ với anken một nối đôi thì n(anken)=n(Br₂). Theo Câu 26: 5,9496 L C₂H₄ ở đkc phản ứng với dung dịch Br₂ 1 M. n(C₂H₄)=5,9496/24,79=0,24 mol ⇒ n(Br₂)=0,24 ⇒ V dung dịch=0,24/1=0,24 L. 100 mL phải đổi thành 0,100 L trước khi nhân nồng độ.  Dạng 5. Tìm anken từ khối lượng sản phẩm cộng Dùng bảo toàn khối lượng: m(Br₂)=m(sản phẩm)−m(anken). Sau đó n(anken)=n(Br₂), suy ra M. Theo Câu 27: 2,24 g anken tạo 8,64 g sản phẩm cộng. m(Br₂)=6,40 g ⇒ n(Br₂)=0,04 mol ⇒ n anken=0,04. M=2,24/0,04=56 ⇒ n=56/14=4 ⇒ C₄H₈. Sản phẩm cộng nặng hơn anken đúng bằng khối lượng bromine đã cộng.  Dạng 6. Trùng hợp anken – tính khối lượng polymer Phản ứng trùng hợp không tạo sản phẩm phụ nên m polymer lí thuyết = m monomer đã phản ứng. Chỉ cần nhân độ tinh khiết và hiệu suất. Theo Câu 29: 4 tấn C₂H₄ chứa 30% tạp chất, hiệu suất tạo PE 90%. m C₂H₄ tinh khiết=4·70%=2,8 tấn. m PE=2,8·90%=2,52 tấn. Không nhân hoặc chia hệ số trùng hợp n khi tính khối lượng.  Dạng 7. Hỗn hợp hydrocarbon – dùng số nguyên tử trung bình Từ tổng mol hỗn hợp, tổng mol CO₂ và H₂O, tính C trung bình = nCO₂/nhh; H trung bình = 2nH₂O/nhh. Thử nhanh các cặp đáp án. Theo Câu 20: 7,437 L hỗn hợp cho 12,395 L CO₂ và 10,8 g H₂O. n hỗn hợp=0,30; nCO₂=0,50; nH₂O=0,60. Trung bình C=1,67; H=4. Cặp CH₄ và C₂H₄ cùng có 4 H, cho C trung bình giữa 1 và 2. Chất nặng hơn Y là C₂H₄. Ưu tiên thử đáp án khi chỉ có bốn cặp chất; nhanh hơn lập hệ tổng quát. "},{"number":25,"title":"NGUỒN NHIÊN LIỆU","subject":"Hóa học","intro":["Bài chỉ có hai dạng tính toán rõ: nhiệt lượng theo số mol và nhiệt lượng của nhiên liệu có độ tinh khiết."],"forms":[{"title":"Dạng 1. Tính nhiệt lượng theo số mol","tip":"Nhiệt lượng tỉ lệ thuận với số mol. Không cần viết phương trình nếu đề đã cho nhiệt tỏa ra của 1 mol.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Một mol khí ethylene cháy hoàn toàn tỏa ra một lượng nhiệt 1423 kJ. Vậy 0,2 mol ethylene cháy tỏa ra một lượng nhiệt Q là bao nhiêu kJ ?\nA. 264,8 kJ.\nB. 7115 kJ.\nC. 284,6 kJ.\nD. 246,8 kJ.","solution":"Q=0,2·1423=284,6 kJ.","trap":"Đọc kĩ đề hỏi nhiệt tỏa ra hay nhiệt cần cung cấp; dấu âm của enthalpy thường không dùng trong câu trắc nghiệm lớp 9.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 2. Nhiên liệu có phần trăm chất cháy","tip":"Tính khối lượng chất cháy tinh khiết trước, rồi đổi mol và nhân nhiệt lượng mol.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Biết 1 mol carbon khi cháy hoàn toàn tỏa ra một nhiệt lượng là 394 kJ. Tính nhiệt lượng tỏa ra khi đốt cháy 5 kg than chứa 90% carbon.\nA. 147750 kJ.\nB. 147570 kJ.\nC. 174750 kJ.\nD. 145770 kJ.","solution":"mC=5·90%=4,5 kg=4500 g; nC=4500/12=375 mol; Q=375·394=147750 kJ.","trap":"Phải đổi kg sang g trước khi chia cho M=12 g/mol.","extra":[],"exampleQuestionNumber":20}],"subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-25","summary":"Bài chỉ có hai dạng tính toán rõ: nhiệt lượng theo số mol và nhiệt lượng của nhiên liệu có độ tinh khiết.","searchText":"NGUỒN NHIÊN LIỆU Bài chỉ có hai dạng tính toán rõ: nhiệt lượng theo số mol và nhiệt lượng của nhiên liệu có độ tinh khiết. Dạng 1. Tính nhiệt lượng theo số mol Nhiệt lượng tỉ lệ thuận với số mol. Không cần viết phương trình nếu đề đã cho nhiệt tỏa ra của 1 mol. Theo Câu 19: 1 mol C₂H₄ cháy tỏa 1423 kJ. Tính Q của 0,2 mol. Q=0,2·1423=284,6 kJ. Đọc kĩ đề hỏi nhiệt tỏa ra hay nhiệt cần cung cấp; dấu âm của enthalpy thường không dùng trong câu trắc nghiệm lớp 9.  Dạng 2. Nhiên liệu có phần trăm chất cháy Tính khối lượng chất cháy tinh khiết trước, rồi đổi mol và nhân nhiệt lượng mol. Theo Câu 20: Đốt 5 kg than chứa 90% C; 1 mol C tỏa 394 kJ. mC=5·90%=4,5 kg=4500 g; nC=4500/12=375 mol; Q=375·394=147750 kJ. Phải đổi kg sang g trước khi chia cho M=12 g/mol. "},{"number":26,"title":"ETHYLIC ALCOHOL (RƯỢU ETYLIC)","subject":"Hóa học","intro":["Các dạng toán đa dạng: độ rượu, phản ứng cháy, lên men glucose, phản ứng với Na, xác định công thức phân tử và hỗn hợp alcohol."],"forms":[{"title":"Dạng 1. Tính độ rượu","tip":"Độ rượu là số mL ethanol nguyên chất trong 100 mL hỗn hợp. V ethanol nguyên chất = V dung dịch·độ/100.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Đốt cháy hoàn toàn 20 mL ethylic alcohol xo (D = 0,8 g/mL), dẫn sản phẩm khí thu được qua dung dịch nước vôi trong dư, thu được 60 gam kết tủa. Giá trị của x là\nA. 68,25.\nB. 25,86.\nC. 86,25.\nD. 25,68.","solution":"nCaCO₃=nCO₂=60/100=0,60 mol ⇒ n ethanol=0,30 mol ⇒ m ethanol=13,8 g ⇒ V ethanol=13,8/0,8=17,25 mL. x=17,25/20·100=86,25°.","trap":"Độ rượu là phần trăm thể tích, không phải phần trăm khối lượng.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 2. Xác định alcohol no đơn chức từ thể tích sản phẩm cháy","tip":"Với CₙH₂ₙ₊₂O: 1 mol tạo n mol CO₂ và n+1 mol H₂O. Tổng số mol sản phẩm = 2n+1.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Đốt cháy hoàn toàn 1 thể tích hơi alcohol no, đơn chức X, thu được CO2 và H2O có tổng thể tích gấp 5 lần thể tích hơi alcohol X đã dùng (ở cùng điều kiện). Vậy X là\nA. CH3OH.\nB. C3H7OH.\nC. C4H9OH.\nD. C2H5OH.","solution":"2n+1=5 ⇒ n=2 ⇒ alcohol là C₂H₅OH.","trap":"Chỉ dùng công thức 2n+1 khi sản phẩm gồm CO₂ và hơi H₂O đo cùng điều kiện.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 3. Tính O₂ hoặc không khí khi đốt ethanol","tip":"Học thuộc 1 mol ethanol cần 3 mol O₂. Nếu không khí chứa 1/5 O₂ thì V không khí = 5V(O₂).","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Thể tích khí oxygen (đkc) cần để đốt cháy 23 gam ethylic alcohol là\nA. 11,2 lít.\nB. 37,185 lít.\nC. 6,1975 lít.\nD. 24,79 lít.","solution":"n ethanol=23/46=0,50 mol ⇒ nO₂=1,50 mol ⇒ VO₂=1,50·24,79=37,185 L.","trap":"Nếu đề hỏi không khí, nhân thêm 5 sau khi đã tính thể tích O₂.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 4. Lên men glucose – liên hệ ethanol và CO₂","tip":"Trong phản ứng lên men, n(ethanol)=n(CO₂). Vì mỗi 1 mol glucose tạo 2 mol mỗi chất.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24 [TH]. Lên men rượu từ glucose sinh ra 4,958 lít khí carbon dioxide (đkc). Lượng natri cần lấy để tác dụng hết với lượng rượu sinh ra là\nA. 6,4 gam.\nB. 46 gam.\nC. 2,3 gam.\nD. 4,6 gam.","solution":"nCO₂=4,958/24,79=0,20 mol ⇒ n ethanol=0,20. Trong phản ứng với Na, nNa=n ethanol=0,20 ⇒ mNa=4,6 g.","trap":"Không dùng nH₂=n ethanol; thực tế nH₂ = 1/2 n ethanol.","extra":[],"exampleQuestionNumber":24},{"title":"Dạng 5. Xác định công thức hợp chất C, H, O từ sản phẩm cháy","tip":"Tính mol C từ CO₂, mol H từ 2nH₂O; lấy khối lượng O trong X bằng mX−mC−mH, rồi chia 16.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 [TH]. Đốt cháy hoàn toàn 9 gam hợp chất hữu cơ X chứa C, H và O, thu được 19,8 gam khí CO2 và 10,8 gam H2O. Công thức phân tử của X là\nA. C3H8O.\nB. C2H6O.\nC. C4H10O.\nD. CH4O.","solution":"nC=19,8/44=0,45; nH=2·10,8/18=1,20. mC=5,4 g; mH=1,2 g; mO=2,4 g ⇒ nO=0,15. Tỉ lệ 0,45:1,20:0,15=3:8:1 ⇒ C₃H₈O.","trap":"nH là mol nguyên tử H, bằng hai lần số mol nước.","extra":[],"exampleQuestionNumber":25},{"title":"Dạng 6. Tính thể tích ethanol từ lượng CO₂ lên men","tip":"Lên men: n ethanol=nCO₂. Sau đó m=n·46 và V=m/D.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 29 [TH]. Lên men rượu từ glucose, thu được 18,5925 lít khí CO2 (đkc). Thể tích rượu (D = 0,8 g/mL) thu được là\nA. 43,125 mL.\nB. 86,25 mL.\nC. 34,125 mL.\nD. 27,6 mL.","solution":"nCO₂=0,75 mol ⇒ n ethanol=0,75 ⇒ m=34,5 g ⇒ V=34,5/0,8=43,125 mL.","trap":"Khối lượng riêng g/mL cho thể tích mL; không đổi sang lít giữa chừng.","extra":[],"exampleQuestionNumber":29},{"title":"Dạng 7. Hỗn hợp alcohol no đơn chức – mẹo bảo toàn nguyên tố","tip":"Với hỗn hợp CₙH₂ₙ₊₂O: tổng mol alcohol = n(H₂O)−n(CO₂). Khối lượng hỗn hợp = 12nC + nH + 16nO, trong đó nO bằng tổng mol alcohol.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 30 [TH]. Đốt cháy hoàn toàn a gam hỗn hợp gồm CH3OH và C4H9OH, thu được 30,8 gam CO2 và 18 gam H2O. Giá trị a là\nA. 7,6.\nB. 15,2.\nC. 30,4.\nD. 16.","solution":"nCO₂=0,70; nH₂O=1,00 ⇒ n alcohol=0,30 ⇒ nO=0,30. m hỗn hợp=12·0,70 + 2·1,00 + 16·0,30 = 15,2 g.","trap":"Mẹo này tránh lập hệ hai alcohol.","extra":[],"exampleQuestionNumber":30}],"subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-26","summary":"Các dạng toán đa dạng: độ rượu, phản ứng cháy, lên men glucose, phản ứng với Na, xác định công thức phân tử và hỗn hợp alcohol.","searchText":"ETHYLIC ALCOHOL (RƯỢU ETYLIC) Các dạng toán đa dạng: độ rượu, phản ứng cháy, lên men glucose, phản ứng với Na, xác định công thức phân tử và hỗn hợp alcohol. Dạng 1. Tính độ rượu Độ rượu là số mL ethanol nguyên chất trong 100 mL hỗn hợp. V ethanol nguyên chất = V dung dịch·độ/100. Theo Câu 19: Đốt 20 mL rượu x°, D ethanol=0,8 g/mL, thu 60 g CaCO₃. nCaCO₃=nCO₂=60/100=0,60 mol ⇒ n ethanol=0,30 mol ⇒ m ethanol=13,8 g ⇒ V ethanol=13,8/0,8=17,25 mL. x=17,25/20·100=86,25°. Độ rượu là phần trăm thể tích, không phải phần trăm khối lượng.  Dạng 2. Xác định alcohol no đơn chức từ thể tích sản phẩm cháy Với CₙH₂ₙ₊₂O: 1 mol tạo n mol CO₂ và n+1 mol H₂O. Tổng số mol sản phẩm = 2n+1. Theo Câu 20: Tổng thể tích CO₂ và H₂O gấp 5 lần thể tích hơi alcohol. 2n+1=5 ⇒ n=2 ⇒ alcohol là C₂H₅OH. Chỉ dùng công thức 2n+1 khi sản phẩm gồm CO₂ và hơi H₂O đo cùng điều kiện.  Dạng 3. Tính O₂ hoặc không khí khi đốt ethanol Học thuộc 1 mol ethanol cần 3 mol O₂. Nếu không khí chứa 1/5 O₂ thì V không khí = 5V(O₂). Theo Câu 22: Đốt 23 g ethanol. n ethanol=23/46=0,50 mol ⇒ nO₂=1,50 mol ⇒ VO₂=1,50·24,79=37,185 L. Nếu đề hỏi không khí, nhân thêm 5 sau khi đã tính thể tích O₂.  Dạng 4. Lên men glucose – liên hệ ethanol và CO₂ Trong phản ứng lên men, n(ethanol)=n(CO₂). Vì mỗi 1 mol glucose tạo 2 mol mỗi chất. Theo Câu 24: Lên men thu 4,958 L CO₂ ở đkc. Tính Na phản ứng hết với ethanol tạo thành. nCO₂=4,958/24,79=0,20 mol ⇒ n ethanol=0,20. Trong phản ứng với Na, nNa=n ethanol=0,20 ⇒ mNa=4,6 g. Không dùng nH₂=n ethanol; thực tế nH₂ = 1/2 n ethanol.  Dạng 5. Xác định công thức hợp chất C, H, O từ sản phẩm cháy Tính mol C từ CO₂, mol H từ 2nH₂O; lấy khối lượng O trong X bằng mX−mC−mH, rồi chia 16. Theo Câu 25: 9 g X cho 19,8 g CO₂ và 10,8 g H₂O. nC=19,8/44=0,45; nH=2·10,8/18=1,20. mC=5,4 g; mH=1,2 g; mO=2,4 g ⇒ nO=0,15. Tỉ lệ 0,45:1,20:0,15=3:8:1 ⇒ C₃H₈O. nH là mol nguyên tử H, bằng hai lần số mol nước.  Dạng 6. Tính thể tích ethanol từ lượng CO₂ lên men Lên men: n ethanol=nCO₂. Sau đó m=n·46 và V=m/D. Theo Câu 29: Thu 18,5925 L CO₂, D ethanol=0,8 g/mL. nCO₂=0,75 mol ⇒ n ethanol=0,75 ⇒ m=34,5 g ⇒ V=34,5/0,8=43,125 mL. Khối lượng riêng g/mL cho thể tích mL; không đổi sang lít giữa chừng.  Dạng 7. Hỗn hợp alcohol no đơn chức – mẹo bảo toàn nguyên tố Với hỗn hợp CₙH₂ₙ₊₂O: tổng mol alcohol = n(H₂O)−n(CO₂). Khối lượng hỗn hợp = 12nC + nH + 16nO, trong đó nO bằng tổng mol alcohol. Theo Câu 30: Đốt hỗn hợp CH₃OH và C₄H₉OH thu 30,8 g CO₂ và 18 g H₂O. nCO₂=0,70; nH₂O=1,00 ⇒ n alcohol=0,30 ⇒ nO=0,30. m hỗn hợp=12·0,70 + 2·1,00 + 16·0,30 = 15,2 g. Mẹo này tránh lập hệ hai alcohol. "},{"number":27,"title":"ACETIC ACID (AXIT AXETIC)","subject":"Hóa học","intro":["Trọng tâm là phản ứng của CH₃COOH với kim loại, base, oxide base, carbonate và các bài nồng độ – trung hòa."],"forms":[{"title":"Dạng 1. Axit tác dụng carbonate – tính CO₂","tip":"Với CaCO₃: nCO₂=nCaCO₃. Với Na₂CO₃ cũng có tỉ lệ 1:1; với NaHCO₃, 1 mol axit tạo 1 mol CO₂.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Hòa tan 20 gam CaCO3 vào dung dịch CH3COOH dư. Thể tích CO2 thoát ra (đkc) là\nA. 3,7185 lít.\nB. 6,1975 lít.\nC. 4,958 lít.\nD. 2,479 lít.","solution":"nCaCO₃=20/100=0,20 mol ⇒ nCO₂=0,20 ⇒ V=0,20·24,79=4,958 L.","trap":"Không lấy hệ số 2 của axit để nhân vào mol CO₂.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 2. Axit tác dụng kim loại – tính H₂","tip":"Với Zn: 1 mol Zn tạo 1 mol H₂. Tính mol kim loại trước.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Hòa tan hoàn toàn 6,5 gam Zn vào dung dịch CH3COOH. Thể tích khí H2 thoát ra (đkc) là\nA. 3,7185 lít.\nB. 0,61975 lít.\nC. 2,479 lít.\nD. 1,2395 lít.","solution":"nZn=6,5/65=0,10 mol ⇒ nH₂=0,10 ⇒ V=2,479 L.","trap":"Chỉ kim loại đứng trước H mới đẩy được H₂ khỏi axit; Cu không phản ứng với CH₃COOH loãng.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 3. Trung hòa – tính thể tích dung dịch","tip":"CH₃COOH và NaOH phản ứng 1:1. Vì vậy CₐVₐ=C_bV_b nếu cả hai đều đơn chức.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Thể tích dung dịch NaOH 1M cần để trung hòa vừa đủ 200 gam dung dịch acetic acid 6% là\nA. 200 mL.\nB. 100 mL.\nC. 300 mL.\nD. 400 mL.","solution":"m axit=12 g ⇒ n=12/60=0,20 mol ⇒ nNaOH=0,20 ⇒ V=0,20 L=200 mL.","trap":"Với dữ kiện khối lượng dung dịch, phải tính khối lượng chất tan trước.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 4. Chuẩn độ – tìm nồng độ axit","tip":"Dùng n axit=n base; Cₐ=C_bV_b/Vₐ. Giữ cùng đơn vị thể tích để khỏi đổi mL sang L.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24 [TH]. Để trung hòa 10 mL dung dịch CH3COOH cần 15,2 mL dung dịch NaOH 0,2M. Vậy nồng độ của dung dịch CH3COOH là\nA. 0,05 M.\nB. 0,10 M.\nC. 0,215 M.\nD. 0,304 M.","solution":"Cₐ=0,2·15,2/10=0,304 M.","trap":"Chỉ được giữ mL khi lấy tỉ số thể tích; nếu tính mol riêng phải đổi sang L.","extra":[],"exampleQuestionNumber":24},{"title":"Dạng 5. Tính khối lượng muối","tip":"Từ mol axit suy ra mol muối 1:1, rồi nhân M muối. M(CH₃COONa)=82.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Cho 9 gam CH3COOH tác dụng vừa đủ với dung dịch NaOH, thu được dung dịch chứa m gam muối. Giá trị của m là\nA. 12,5.\nB. 12,3.\nC. 15,0.\nD. 8,2.","solution":"n axit=9/60=0,15 mol ⇒ n muối=0,15 ⇒ m=0,15·82=12,3 g.","trap":"Không dùng bảo toàn khối lượng chỉ với axit vì còn có NaOH tham gia.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 6. Tính khối lượng dung dịch axit từ oxide base","tip":"Viết tỉ lệ mol. Với CuO: 1 mol CuO cần 2 mol CH₃COOH. Sau đó đổi lượng axit nguyên chất sang khối lượng dung dịch bằng chia C%.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Hòa tan hoàn toàn 24 gam CuO vào dung dịch CH3COOH 10%. Khối lượng dung dịch CH3COOH cần dùng là\nA. 320 gam.\nB. 380 gam.\nC. 360 gam.\nD. 340 gam.","solution":"nCuO=24/80=0,30 ⇒ n axit=0,60 ⇒ m axit=36 g ⇒ m dung dịch=36/10%=360 g.","trap":"10% nghĩa là 0,10; bài tính ngược phải chia, không nhân.","extra":[],"exampleQuestionNumber":23},{"title":"Dạng 7. Xác định chất dư sau trung hòa","tip":"So sánh mol theo tỉ lệ 1:1. Chất có mol lớn hơn còn dư; dung dịch luôn có muối.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 26 [TH]. Cho dung dịch chứa 10 gam CH3COOH tác dụng với dung dịch chứa 10 gam KOH. Sau khi phản ứng hoàn toàn dung dịch chứa các chất tan là\nA. CH3COOK, CH3COOH và KOH.\nB. CH3COOK và KOH.\nC. CH3COOK và CH3COOH.\nD. CH3COOK.","solution":"n axit=10/60=0,1667; nKOH=10/56=0,1786 ⇒ axit hết, KOH dư. Chất tan: CH₃COOK và KOH.","trap":"Không so trực tiếp khối lượng vì M axit và M base khác nhau.","extra":[],"exampleQuestionNumber":26},{"title":"Dạng 8. Xác định axit đơn chức từ lượng NaOH","tip":"Axit đơn chức phản ứng NaOH 1:1. Từ mol NaOH suy ra mol axit, rồi M=m/n.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. Muốn trung hòa 6,72 gam một acid hữu cơ X cần dùng 200 gam dung dịch NaOH 2,24%. Công thức của X là\nA. CH3CH2COOH.\nB. HCOOH.\nC. CH3COOH.\nD. CH2=CHCOOH.","solution":"mNaOH=4,48 g ⇒ n=0,112 mol ⇒ n axit=0,112 ⇒ M=6,72/0,112=60 ⇒ CH₃COOH.","trap":"Chỉ dùng 1:1 vì các phương án đều là axit monocarboxylic đơn chức.","extra":[],"exampleQuestionNumber":27},{"title":"Dạng 9. Nồng độ muối sau phản ứng","tip":"Chọn một lượng dung dịch axit giả định, tính lượng NaOH vừa đủ, khối lượng muối và tổng khối lượng dung dịch sau phản ứng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 28 [TH]. Cho dung dịch acetic acid có nồng độ x% tác dụng vừa đủ với dung dịch NaOH 10%, thu được dung dịch muối có nồng độ 10,25%. Giá trị của x là\nA. 16.\nB. 13.\nC. 20.\nD. 15.","solution":"Chọn m dung dịch axit=A. m axit=xA/100; m dung dịch NaOH=xA/15. m muối=82xA/6000. Lập 82x/6000 ÷ (1+x/15)=0,1025 ⇒ x=15%.","trap":"Không trừ khối lượng nước vì phản ứng trung hòa không tạo khí hoặc kết tủa.","extra":[],"exampleQuestionNumber":28},{"title":"Dạng 10. Phần trăm thể tích trong giấm","tip":"V chất tan = V dung dịch·C% thể tích/100.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 29 [TH]. Giấm ăn được dùng phổ biến trong chế biến thực phẩm, có chứa acetic acid với hàm lượng 4 – 8% về thể tích. Một chai giấm ăn thể tích 500 mL có hàm lượng acetic acid là 5%, thể tích acetic acid có trong chai giấm ăn đó là\nA. 25 mL.\nB. 100 mL.\nC. 5 mL.\nD. 50 mL.","solution":"V axit=500·5%=25 mL.","trap":"Không dùng khối lượng riêng khi đề đã cho phần trăm thể tích.","extra":[],"exampleQuestionNumber":29}],"subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-27","summary":"Trọng tâm là phản ứng của CH₃COOH với kim loại, base, oxide base, carbonate và các bài nồng độ – trung hòa.","searchText":"ACETIC ACID (AXIT AXETIC) Trọng tâm là phản ứng của CH₃COOH với kim loại, base, oxide base, carbonate và các bài nồng độ – trung hòa. Dạng 1. Axit tác dụng carbonate – tính CO₂ Với CaCO₃: nCO₂=nCaCO₃. Với Na₂CO₃ cũng có tỉ lệ 1:1; với NaHCO₃, 1 mol axit tạo 1 mol CO₂. Theo Câu 19: Hòa tan 20 g CaCO₃ bằng CH₃COOH dư. nCaCO₃=20/100=0,20 mol ⇒ nCO₂=0,20 ⇒ V=0,20·24,79=4,958 L. Không lấy hệ số 2 của axit để nhân vào mol CO₂.  Dạng 2. Axit tác dụng kim loại – tính H₂ Với Zn: 1 mol Zn tạo 1 mol H₂. Tính mol kim loại trước. Theo Câu 20: Hòa tan 6,5 g Zn. nZn=6,5/65=0,10 mol ⇒ nH₂=0,10 ⇒ V=2,479 L. Chỉ kim loại đứng trước H mới đẩy được H₂ khỏi axit; Cu không phản ứng với CH₃COOH loãng.  Dạng 3. Trung hòa – tính thể tích dung dịch CH₃COOH và NaOH phản ứng 1:1. Vì vậy CₐVₐ=C_bV_b nếu cả hai đều đơn chức. Theo Câu 21: 200 g dung dịch CH₃COOH 6%, trung hòa bằng NaOH 1 M. m axit=12 g ⇒ n=12/60=0,20 mol ⇒ nNaOH=0,20 ⇒ V=0,20 L=200 mL. Với dữ kiện khối lượng dung dịch, phải tính khối lượng chất tan trước.  Dạng 4. Chuẩn độ – tìm nồng độ axit Dùng n axit=n base; Cₐ=C_bV_b/Vₐ. Giữ cùng đơn vị thể tích để khỏi đổi mL sang L. Theo Câu 24: 10 mL axit cần 15,2 mL NaOH 0,2 M. Cₐ=0,2·15,2/10=0,304 M. Chỉ được giữ mL khi lấy tỉ số thể tích; nếu tính mol riêng phải đổi sang L.  Dạng 5. Tính khối lượng muối Từ mol axit suy ra mol muối 1:1, rồi nhân M muối. M(CH₃COONa)=82. Theo Câu 22: 9 g CH₃COOH phản ứng vừa đủ NaOH. n axit=9/60=0,15 mol ⇒ n muối=0,15 ⇒ m=0,15·82=12,3 g. Không dùng bảo toàn khối lượng chỉ với axit vì còn có NaOH tham gia.  Dạng 6. Tính khối lượng dung dịch axit từ oxide base Viết tỉ lệ mol. Với CuO: 1 mol CuO cần 2 mol CH₃COOH. Sau đó đổi lượng axit nguyên chất sang khối lượng dung dịch bằng chia C%. Theo Câu 23: 24 g CuO phản ứng với dung dịch CH₃COOH 10%. nCuO=24/80=0,30 ⇒ n axit=0,60 ⇒ m axit=36 g ⇒ m dung dịch=36/10%=360 g. 10% nghĩa là 0,10; bài tính ngược phải chia, không nhân.  Dạng 7. Xác định chất dư sau trung hòa So sánh mol theo tỉ lệ 1:1. Chất có mol lớn hơn còn dư; dung dịch luôn có muối. Theo Câu 26: 10 g CH₃COOH và 10 g KOH. n axit=10/60=0,1667; nKOH=10/56=0,1786 ⇒ axit hết, KOH dư. Chất tan: CH₃COOK và KOH. Không so trực tiếp khối lượng vì M axit và M base khác nhau.  Dạng 8. Xác định axit đơn chức từ lượng NaOH Axit đơn chức phản ứng NaOH 1:1. Từ mol NaOH suy ra mol axit, rồi M=m/n. Theo Câu 27: 6,72 g axit X cần 200 g dung dịch NaOH 2,24%. mNaOH=4,48 g ⇒ n=0,112 mol ⇒ n axit=0,112 ⇒ M=6,72/0,112=60 ⇒ CH₃COOH. Chỉ dùng 1:1 vì các phương án đều là axit monocarboxylic đơn chức.  Dạng 9. Nồng độ muối sau phản ứng Chọn một lượng dung dịch axit giả định, tính lượng NaOH vừa đủ, khối lượng muối và tổng khối lượng dung dịch sau phản ứng. Theo Câu 28: Dung dịch axit x% vừa đủ NaOH 10%, thu dung dịch muối 10,25%. Chọn m dung dịch axit=A. m axit=xA/100; m dung dịch NaOH=xA/15. m muối=82xA/6000. Lập 82x/6000 ÷ (1+x/15)=0,1025 ⇒ x=15%. Không trừ khối lượng nước vì phản ứng trung hòa không tạo khí hoặc kết tủa.  Dạng 10. Phần trăm thể tích trong giấm V chất tan = V dung dịch·C% thể tích/100. Theo Câu 29: Chai giấm 500 mL chứa 5% acetic acid theo thể tích. V axit=500·5%=25 mL. Không dùng khối lượng riêng khi đề đã cho phần trăm thể tích. "},{"number":28,"title":"LIPID (CHẤT BÉO)","subject":"Hóa học","intro":["Các bài tính chủ yếu dựa vào tỉ lệ 1 mol triglyceride : 3 mol kiềm : 1 mol glycerol : 3 mol muối và bảo toàn khối lượng."],"forms":[{"title":"Dạng 1. Tính glycerol từ khối lượng chất béo","tip":"Tính mol chất béo rồi dùng tỉ lệ 1:1 với glycerol.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Đun nóng 4,45 gam chất béo (C17H35COO)3C3H5 với dung dịch NaOH. Khối lượng glycerol thu được là\nA. 0,75 gam.\nB. 1,2 gam.\nC. 2 gam.\nD. 0,46 gam.","solution":"M tristearin=890 ⇒ n=4,45/890=0,005 mol ⇒ n glycerol=0,005 ⇒ m=0,005·92=0,46 g.","trap":"Glycerol có M=92, không phải 62.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 2. Tính muối xà phòng từ chất béo xác định","tip":"1 mol triglyceride tạo 3 mol muối. Tính đúng M của muối Na hoặc K.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Xà phòng hóa hoàn toàn 178 gam chất béo X trong dung dịch KOH, thu được m gam muối Potassium steẩte (C17H35COOK). Giá trị của m là\nA. 211,6.\nB. 200,8.\nC. 193,2.\nD. 183,6.","solution":"n chất béo=178/890=0,20 mol ⇒ n muối=0,60 mol. M muối K=322 ⇒ m=193,2 g.","trap":"Muối potassium nặng hơn muối sodium; không dùng M của RCOONa cho RCOOK.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 3. Bảo toàn khối lượng để tìm chất béo hoặc muối","tip":"Nếu biết glycerol thì suy ra mol chất béo và mol NaOH. Sau đó dùng m trước=m sau.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Thủy phân hoàn toàn m gam chất béo bằng dung dịch NaOH, đun nóng thu được 9,2 gam glycerol và 91,8 gam muối. Giá trị của m là\nA. 101.\nB. 85.\nC. 93.\nD. 89.","solution":"n glycerol=0,10 ⇒ nNaOH=0,30 ⇒ mNaOH=12 g. m chất béo=9,2+91,8−12=89 g.","trap":"Không cộng trực tiếp glycerol và muối; phải trừ khối lượng kiềm đã tham gia.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 4. Tính muối khan bằng mẹo bảo toàn","tip":"m muối = m chất béo + m NaOH − m glycerol. Glycerol tính từ nNaOH/3.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. Xà phòng hóa hoàn toàn 17,8 gam chất béo X cần vừa đủ dung dịch chứa 0,06 mol NaOH. Cô cạn dung dịch sau phản ứng thu được m gam muối khan. Giá trị của m là\nA. 19,04.\nB. 14,68.\nC. 18,36.\nD. 19,12.","solution":"n glycerol=0,06/3=0,02 ⇒ m glycerol=1,84 g; mNaOH=2,4 g. m muối=17,8+2,4−1,84=18,36 g.","trap":"Cô cạn chỉ loại nước; muối khan vẫn được tính theo bảo toàn trên.","extra":[],"exampleQuestionNumber":27},{"title":"Dạng 5. Tính ngược lượng chất béo từ lượng xà phòng và hiệu suất","tip":"Tính lượng chất béo lí thuyết theo tỉ lệ mol, sau đó chia cho hiệu suất.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24 [TH]. Để điều chế được 2 tấn C17H33COONa dùng làm xà phòng, thì khối lượng chất béo (C17H33COO)3C3H5 đem dùng là bao nhiêu? Biết hiệu suất phản ứng là 84%.\nA. 3 tấn.\nB. 3,31 tấn.\nC. 2 tấn.\nD. 2,31 tấn.","solution":"M triolein=884; M sodium oleate=304. m chất béo lí thuyết=2·884/(3·304)=1,9386 tấn. m dùng=1,9386/0,84≈2,31 tấn.","trap":"Bài tính nguyên liệu đầu vào phải chia cho hiệu suất, không nhân.","extra":[],"exampleQuestionNumber":24},{"title":"Dạng 6. Tính phân tử khối chất béo","tip":"Cộng trực tiếp nguyên tử hoặc dùng M = M(glycerol)+3M(acid béo)−3M(H₂O).","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 [TH]. Một chất béo có công thức (C17H35COO)3C3H5 có khối lượng phân tử là\nA. 890 amu.\nB. 980 amu.\nC. 422 amu.\nD. 372 amu.","solution":"Đây là tristearin C₅₇H₁₁₀O₆ ⇒ M=57·12+110+6·16=890.","trap":"Phải trừ 3H₂O nếu tính từ glycerol và 3 acid béo.","extra":[],"exampleQuestionNumber":25},{"title":"Dạng 7. Tính khối lượng xà phòng thương phẩm","tip":"Tính khối lượng muối acid béo trước. Nếu muối chiếm p% xà phòng thì m xà phòng=m muối/p%.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 29 [TH]. Thủy phân hoàn toàn 89 gam chất béo bằng dung dịch NaOH để điều chế xà phòng thu được 9,2 gam glycerol. Khối lượng xà phòng thu được là (biết muối của acid béo chiếm 60% khối lượng xà phòng)\nA. 55,08 gam.\nB. 153 gam.\nC. 58,92 gam.\nD. 91,8 gam.","solution":"n chất béo=0,10 ⇒ mNaOH=12 g. m muối=89+12−9,2=91,8 g. m xà phòng=91,8/0,60=153 g.","trap":"“Muối chiếm 60%” nghĩa là khối lượng xà phòng lớn hơn khối lượng muối.","extra":[],"exampleQuestionNumber":29}],"subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-28","summary":"Các bài tính chủ yếu dựa vào tỉ lệ 1 mol triglyceride : 3 mol kiềm : 1 mol glycerol : 3 mol muối và bảo toàn khối lượng.","searchText":"LIPID (CHẤT BÉO) Các bài tính chủ yếu dựa vào tỉ lệ 1 mol triglyceride : 3 mol kiềm : 1 mol glycerol : 3 mol muối và bảo toàn khối lượng. Dạng 1. Tính glycerol từ khối lượng chất béo Tính mol chất béo rồi dùng tỉ lệ 1:1 với glycerol. Theo Câu 21: 4,45 g tristearin (C₁₇H₃₅COO)₃C₃H₅. M tristearin=890 ⇒ n=4,45/890=0,005 mol ⇒ n glycerol=0,005 ⇒ m=0,005·92=0,46 g. Glycerol có M=92, không phải 62.  Dạng 2. Tính muối xà phòng từ chất béo xác định 1 mol triglyceride tạo 3 mol muối. Tính đúng M của muối Na hoặc K. Theo Câu 19: 178 g tristearin tạo potassium stearate C₁₇H₃₅COOK. n chất béo=178/890=0,20 mol ⇒ n muối=0,60 mol. M muối K=322 ⇒ m=193,2 g. Muối potassium nặng hơn muối sodium; không dùng M của RCOONa cho RCOOK.  Dạng 3. Bảo toàn khối lượng để tìm chất béo hoặc muối Nếu biết glycerol thì suy ra mol chất béo và mol NaOH. Sau đó dùng m trước=m sau. Theo Câu 20: Thu 9,2 g glycerol và 91,8 g muối. n glycerol=0,10 ⇒ nNaOH=0,30 ⇒ mNaOH=12 g. m chất béo=9,2+91,8−12=89 g. Không cộng trực tiếp glycerol và muối; phải trừ khối lượng kiềm đã tham gia.  Dạng 4. Tính muối khan bằng mẹo bảo toàn m muối = m chất béo + m NaOH − m glycerol. Glycerol tính từ nNaOH/3. Theo Câu 27: 17,8 g chất béo dùng 0,06 mol NaOH. n glycerol=0,06/3=0,02 ⇒ m glycerol=1,84 g; mNaOH=2,4 g. m muối=17,8+2,4−1,84=18,36 g. Cô cạn chỉ loại nước; muối khan vẫn được tính theo bảo toàn trên.  Dạng 5. Tính ngược lượng chất béo từ lượng xà phòng và hiệu suất Tính lượng chất béo lí thuyết theo tỉ lệ mol, sau đó chia cho hiệu suất. Theo Câu 24: Cần 2 tấn sodium oleate, hiệu suất 84%. M triolein=884; M sodium oleate=304. m chất béo lí thuyết=2·884/(3·304)=1,9386 tấn. m dùng=1,9386/0,84≈2,31 tấn. Bài tính nguyên liệu đầu vào phải chia cho hiệu suất, không nhân.  Dạng 6. Tính phân tử khối chất béo Cộng trực tiếp nguyên tử hoặc dùng M = M(glycerol)+3M(acid béo)−3M(H₂O). Theo Câu 25: (C₁₇H₃₅COO)₃C₃H₅. Đây là tristearin C₅₇H₁₁₀O₆ ⇒ M=57·12+110+6·16=890. Phải trừ 3H₂O nếu tính từ glycerol và 3 acid béo.  Dạng 7. Tính khối lượng xà phòng thương phẩm Tính khối lượng muối acid béo trước. Nếu muối chiếm p% xà phòng thì m xà phòng=m muối/p%. Theo Câu 29: Từ 89 g chất béo thu 9,2 g glycerol; muối chiếm 60% xà phòng. n chất béo=0,10 ⇒ mNaOH=12 g. m muối=89+12−9,2=91,8 g. m xà phòng=91,8/0,60=153 g. “Muối chiếm 60%” nghĩa là khối lượng xà phòng lớn hơn khối lượng muối. "},{"number":29,"title":"CARBOHYDRATE – GLUCOSE VÀ SACCHAROSE","subject":"Hóa học","intro":["Các dạng trọng tâm: tinh chế theo hiệu suất, phản ứng tráng bạc, thủy phân saccharose, chuyển tinh bột thành glucose và bài dung dịch."],"forms":[{"title":"Dạng 1. Tinh chế saccharose có hiệu suất","tip":"Khối lượng sản phẩm = khối lượng nguyên liệu·% saccharose·hiệu suất.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Thông thường nước mía chứa 13% saccharose. Nếu tinh chế 1 tấn nước mía trên thì hàm lượng saccharose thu được là bao nhiêu? Biết hiệu suất tinh chế đạt 80%\nA. 105 kg.\nB. 110 kg.\nC. 104 kg.\nD. 114 kg.","solution":"m saccharose=1000·0,13·0,80=104 kg.","trap":"Đổi 1 tấn=1000 kg trước khi tính để khớp đơn vị đáp án.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 2. Phản ứng tráng bạc của glucose","tip":"1 mol glucose tạo 2 mol Ag. Mẹo khối lượng: 180 g glucose → 216 g Ag.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Đun nóng dung dịch chứa 18,0 gam glucose với lượng dư dung dịch AgNO3 trong NH3, đến khi phản ứng xảy ra hoàn toàn thu được m gam Ag. Giá trị của m là\nA. 32,4.\nB. 16,2.\nC. 10,8.\nD. 21,6.","solution":"n glucose=0,10 ⇒ nAg=0,20 ⇒ mAg=21,6 g.","trap":"Saccharose không tráng bạc trực tiếp; chỉ sau thủy phân mới tạo glucose và fructose có khả năng khử.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 3. Tìm nồng độ glucose từ lượng Ag","tip":"Từ mAg suy ra nAg, chia 2 để được n glucose, tính m glucose rồi chia khối lượng dung dịch.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 26 [TH]. Đun nóng 250 gam dung dịch glucose với dung dịch AgNO3 /NH3 thu được 15 gam Ag, nồng độ của dung dịch glucose là\nA. 15%.\nB. 5%.\nC. 30%.\nD. 10%.","solution":"nAg=15/108=0,1389 ⇒ n glucose=0,06944 ⇒ m glucose=12,5 g. C%=12,5/250·100=5%.","trap":"Không lấy nAg=n glucose.","extra":[],"exampleQuestionNumber":26},{"title":"Dạng 4. Thủy phân saccharose","tip":"Theo tỉ lệ khối lượng 342 g saccharose +18 g nước tạo 360 g hỗn hợp glucose và fructose. Mỗi loại sản phẩm có khối lượng bằng 180/342 lần saccharose.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Thuỷ phân hoàn toàn m gam saccharose thu được 270 gam hỗn hợp gồm glucose và fructose. Giá trị của m là\nA. 270,0.\nB. 256,5.\nC. 229,5.\nD. 243,0.","solution":"m saccharose=270·342/360=256,5 g.","trap":"Khối lượng sản phẩm lớn hơn saccharose do có nước tham gia phản ứng.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 5. Tinh bột thành glucose có độ tinh khiết và hiệu suất","tip":"Dùng hệ số 180/162=10/9. m glucose=m nguyên liệu·% tinh bột·10/9·H.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 [TH]. Nếu dùng một tấn khoai chứa 20% tinh bột để sản xuất glucose thì lượng glucose sẽ thu được là (hiệu suất là 70%)\nA. 155,56 kg.\nB. 160,5 kg.\nC. 150,64 kg.\nD. 165,6 kg.","solution":"m glucose=1000·0,20·10/9·0,70=155,56 kg.","trap":"Không dùng tỉ lệ 1:1 khối lượng; glucose nặng hơn mắt xích tinh bột vì cộng nước.","extra":[],"exampleQuestionNumber":25},{"title":"Dạng 6. Nhận dạng carbohydrate từ tỉ lệ khối lượng CO₂ và H₂O","tip":"Đổi khối lượng sản phẩm về mol. Với CₓHᵧO_z, nH₂O/nCO₂ = y/(2x). So tỉ lệ H:C của đáp án.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Khi đốt cháy một loại carbohydrate có công thức Cn(H2O)m, người ta thu được khối lượng H2O và CO2 theo tỉ lệ 33 : 88. Vậy carbohydrate là\nA. C12H22O11.\nB. C6H10O5.\nC. C6H12O6.\nD. (C6H10O5)n.","solution":"nH₂O:nCO₂=(33/18):(88/44)=11:12 ⇒ y/(2x)=11/12 ⇒ y/x=11/6. C₁₂H₂₂O₁₁ có 22/12=11/6 ⇒ chọn saccharose.","trap":"Không so trực tiếp 33:88 với số nguyên tử H:C.","extra":[],"exampleQuestionNumber":21}],"subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-29","summary":"Các dạng trọng tâm: tinh chế theo hiệu suất, phản ứng tráng bạc, thủy phân saccharose, chuyển tinh bột thành glucose và bài dung dịch.","searchText":"CARBOHYDRATE – GLUCOSE VÀ SACCHAROSE Các dạng trọng tâm: tinh chế theo hiệu suất, phản ứng tráng bạc, thủy phân saccharose, chuyển tinh bột thành glucose và bài dung dịch. Dạng 1. Tinh chế saccharose có hiệu suất Khối lượng sản phẩm = khối lượng nguyên liệu·% saccharose·hiệu suất. Theo Câu 19: 1 tấn nước mía chứa 13% saccharose, hiệu suất 80%. m saccharose=1000·0,13·0,80=104 kg. Đổi 1 tấn=1000 kg trước khi tính để khớp đơn vị đáp án.  Dạng 2. Phản ứng tráng bạc của glucose 1 mol glucose tạo 2 mol Ag. Mẹo khối lượng: 180 g glucose → 216 g Ag. Theo Câu 20: 18 g glucose phản ứng hoàn toàn. n glucose=0,10 ⇒ nAg=0,20 ⇒ mAg=21,6 g. Saccharose không tráng bạc trực tiếp; chỉ sau thủy phân mới tạo glucose và fructose có khả năng khử.  Dạng 3. Tìm nồng độ glucose từ lượng Ag Từ mAg suy ra nAg, chia 2 để được n glucose, tính m glucose rồi chia khối lượng dung dịch. Theo Câu 26: 250 g dung dịch tạo 15 g Ag. nAg=15/108=0,1389 ⇒ n glucose=0,06944 ⇒ m glucose=12,5 g. C%=12,5/250·100=5%. Không lấy nAg=n glucose.  Dạng 4. Thủy phân saccharose Theo tỉ lệ khối lượng 342 g saccharose +18 g nước tạo 360 g hỗn hợp glucose và fructose. Mỗi loại sản phẩm có khối lượng bằng 180/342 lần saccharose. Theo Câu 22: Thu 270 g hỗn hợp glucose và fructose. m saccharose=270·342/360=256,5 g. Khối lượng sản phẩm lớn hơn saccharose do có nước tham gia phản ứng.  Dạng 5. Tinh bột thành glucose có độ tinh khiết và hiệu suất Dùng hệ số 180/162=10/9. m glucose=m nguyên liệu·% tinh bột·10/9·H. Theo Câu 25: 1 tấn khoai chứa 20% tinh bột, hiệu suất 70%. m glucose=1000·0,20·10/9·0,70=155,56 kg. Không dùng tỉ lệ 1:1 khối lượng; glucose nặng hơn mắt xích tinh bột vì cộng nước.  Dạng 6. Nhận dạng carbohydrate từ tỉ lệ khối lượng CO₂ và H₂O Đổi khối lượng sản phẩm về mol. Với CₓHᵧO_z, nH₂O/nCO₂ = y/(2x). So tỉ lệ H:C của đáp án. Theo Câu 21: mH₂O:mCO₂=33:88. nH₂O:nCO₂=(33/18):(88/44)=11:12 ⇒ y/(2x)=11/12 ⇒ y/x=11/6. C₁₂H₂₂O₁₁ có 22/12=11/6 ⇒ chọn saccharose. Không so trực tiếp 33:88 với số nguyên tử H:C. "},{"number":30,"title":"TINH BỘT VÀ CELLULOSE","subject":"Hóa học","intro":["Dạng toán chủ yếu là chuỗi chuyển hóa tinh bột/cellulose → glucose → ethanol → acetic acid, kết hợp độ tinh khiết và hiệu suất nhiều giai đoạn."],"forms":[{"title":"Dạng 1. Thủy phân tinh bột hoặc cellulose thành glucose","tip":"Dùng tỉ lệ 162 → 180, tức nhân 10/9; sau đó nhân phần trăm tinh bột và hiệu suất.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Thủy phân 1 kg sắn chứa 20% tinh bột trong môi trường acid. Với hiệu suất phản ứng 85%, lượng glucose thu được là\nA. 200,8 gam.\nB. 188,89 gam.\nC. 192,5 gam.\nD. 261,43 gam.","solution":"m glucose=1000·0,20·180/162·0,85=188,89 g.","trap":"Nếu đề cho “bột gạo chứa 80% tinh bột”, phải nhân 0,80 trước.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 2. Sản xuất ethanol từ cellulose","tip":"Gộp hai phản ứng: 162 g cellulose → 180 g glucose → 92 g ethanol. Tính nguyên liệu ngược thì chia hiệu suất; nếu nguyên liệu chỉ chứa p% cellulose thì chia thêm p%.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Để sản xuất ethylic alcohol, người ta dùng nguyên liệu là mùn cưa và vỏ bào từ gỗ chứa 50% cellulose. Nếu muốn điều chế 1 tấn ethylic alcohol, hiệu suất quá trình là 70% thì khối lượng nguyên liệu cần dùng là\nA. 4200kg.\nB. 5301 kg.\nC. 5031 kg.\nD. 2000 kg.","solution":"Cellulose tinh khiết cần=1·162/92/0,70=2,5155 tấn. Nguyên liệu cần=2,5155/0,50=5,031 tấn.","trap":"Tính ngược nguyên liệu luôn cho kết quả lớn hơn sản phẩm.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 3. Tính nhanh ethanol từ tinh bột/cellulose","tip":"m ethanol = m polymer·92/162·H. Nếu có độ tinh khiết, nhân thêm phần tinh khiết.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 [TH]. Tiến hành sản xuất ethylic alcohol từ cellulose với hiệu suất của toàn bộ quá trình là 70%. Để sản xuất 2 tấn ethylic alcohol, khối lượng cellulose cần dùng là\nA. 5,031 tấn.\nB. 3,521 tấn.\nC. 2,515 tấn.\nD. 10,062 tấn.","solution":"m cellulose=2·162/92/0,70=5,031 tấn.","trap":"Không tách hai hiệu suất nếu đề chỉ cho một hiệu suất toàn quá trình.","extra":[],"exampleQuestionNumber":25},{"title":"Dạng 4. Chuỗi tinh bột → acetic acid","tip":"Gộp tỉ lệ: 162 g tinh bột → 120 g acetic acid. Tính lượng acid nguyên chất trong dung dịch trước.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 28 [TH]. Điều chế acetic acid từ tinh bột được thực hiện theo sơ đồ sau: Biết hiệu suất của cả quá trình trên bằng 60%. Khối lượng tinh bột cần dùng để điều chế được 120 kg dung dịch acetic acid 10% theo sơ đồ trên là\nA. 17,7 kg.\nB. 21,9 kg.\nC. 24,3 kg.\nD. 27,0 kg.","solution":"m acid=12 kg. m tinh bột lí thuyết=12·162/120=16,2 kg. m cần=16,2/0,60=27,0 kg.","trap":"Dung dịch 10% không có nghĩa là cần 120 kg acid.","extra":[],"exampleQuestionNumber":28},{"title":"Dạng 5. Chuỗi thủy phân – lên men – hấp thụ CO₂","tip":"Từ kết tủa CaCO₃ suy ra mol CO₂. Theo lí thuyết 1 mol mắt xích C₆H₁₀O₅ tạo 2 mol CO₂. Hiệu suất nối tiếp phải nhân nhau.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 30 [TH]. Thủy phân m gam tinh bột, sản phẩm thu được đem lên men để sản xuất ethylic alcohol, toàn bộ khí CO2 sinh ra cho qua dung dịch Ca(OH)2 dư, thu được 850 gam kết tủa. Biết hiệu suất giai đoạn thủy phân và lên men đều là 85%. Giá trị của m là\nA. 810,0.\nB. 952,9.\nC. 688,5.\nD. 497,4.","solution":"nCO₂=850/100=8,5 mol. n mắt xích ban đầu=8,5/[2·0,85²]=5,882 mol. m=5,882·162≈952,9 g.","trap":"Hai giai đoạn 85% cho hiệu suất chung 0,85·0,85, không phải 170%.","extra":[],"exampleQuestionNumber":30},{"title":"Dạng 6. Tính khối lượng glucose từ lượng tinh bột xác định","tip":"Khi hiệu suất 100%, chỉ nhân 10/9. Đây là phép tính cực nhanh.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. Thủy phân 324 gam tinh bột với hiệu suất của phản ứng đạt 75%, khối lượng glucose thu được là\nA. 250 gam.\nB. 300 gam.\nC. 270 gam.\nD. 360 gam.","solution":"m glucose=324·10/9·0,75=270 g.","trap":"Nếu đáp án có 360 g, đó là khối lượng lí thuyết trước khi nhân hiệu suất.","extra":[],"exampleQuestionNumber":27}],"subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-30","summary":"Dạng toán chủ yếu là chuỗi chuyển hóa tinh bột/cellulose → glucose → ethanol → acetic acid, kết hợp độ tinh khiết và hiệu suất nhiều giai đoạn.","searchText":"TINH BỘT VÀ CELLULOSE Dạng toán chủ yếu là chuỗi chuyển hóa tinh bột/cellulose → glucose → ethanol → acetic acid, kết hợp độ tinh khiết và hiệu suất nhiều giai đoạn. Dạng 1. Thủy phân tinh bột hoặc cellulose thành glucose Dùng tỉ lệ 162 → 180, tức nhân 10/9; sau đó nhân phần trăm tinh bột và hiệu suất. Theo Câu 22: 1 kg sắn chứa 20% tinh bột, hiệu suất 85%. m glucose=1000·0,20·180/162·0,85=188,89 g. Nếu đề cho “bột gạo chứa 80% tinh bột”, phải nhân 0,80 trước.  Dạng 2. Sản xuất ethanol từ cellulose Gộp hai phản ứng: 162 g cellulose → 180 g glucose → 92 g ethanol. Tính nguyên liệu ngược thì chia hiệu suất; nếu nguyên liệu chỉ chứa p% cellulose thì chia thêm p%. Theo Câu 19: Nguyên liệu gỗ chứa 50% cellulose, hiệu suất 70%, cần sản xuất 1 tấn ethanol. Cellulose tinh khiết cần=1·162/92/0,70=2,5155 tấn. Nguyên liệu cần=2,5155/0,50=5,031 tấn. Tính ngược nguyên liệu luôn cho kết quả lớn hơn sản phẩm.  Dạng 3. Tính nhanh ethanol từ tinh bột/cellulose m ethanol = m polymer·92/162·H. Nếu có độ tinh khiết, nhân thêm phần tinh khiết. Theo Câu 25: Hiệu suất toàn bộ 70%, sản xuất 2 tấn ethanol từ cellulose. m cellulose=2·162/92/0,70=5,031 tấn. Không tách hai hiệu suất nếu đề chỉ cho một hiệu suất toàn quá trình.  Dạng 4. Chuỗi tinh bột → acetic acid Gộp tỉ lệ: 162 g tinh bột → 120 g acetic acid. Tính lượng acid nguyên chất trong dung dịch trước. Theo Câu 28: Điều chế 120 kg dung dịch CH₃COOH 10%, hiệu suất toàn quá trình 60%. m acid=12 kg. m tinh bột lí thuyết=12·162/120=16,2 kg. m cần=16,2/0,60=27,0 kg. Dung dịch 10% không có nghĩa là cần 120 kg acid.  Dạng 5. Chuỗi thủy phân – lên men – hấp thụ CO₂ Từ kết tủa CaCO₃ suy ra mol CO₂. Theo lí thuyết 1 mol mắt xích C₆H₁₀O₅ tạo 2 mol CO₂. Hiệu suất nối tiếp phải nhân nhau. Theo Câu 30: Thu 850 g CaCO₃; hiệu suất thủy phân và lên men đều 85%. nCO₂=850/100=8,5 mol. n mắt xích ban đầu=8,5/[2·0,85²]=5,882 mol. m=5,882·162≈952,9 g. Hai giai đoạn 85% cho hiệu suất chung 0,85·0,85, không phải 170%.  Dạng 6. Tính khối lượng glucose từ lượng tinh bột xác định Khi hiệu suất 100%, chỉ nhân 10/9. Đây là phép tính cực nhanh. Theo Câu 27: Thủy phân 324 g tinh bột, hiệu suất 75%. m glucose=324·10/9·0,75=270 g. Nếu đáp án có 360 g, đó là khối lượng lí thuyết trước khi nhân hiệu suất. "},{"number":31,"title":"PROTEIN","subject":"Hóa học","intro":["Trong ngân hàng này không có bài toán định lượng mol – khối lượng. Các câu cần xử lí nhanh chủ yếu là đếm phát biểu và suy luận chuỗi biến đổi."],"forms":[{"title":"Dạng 1. Đếm số phát biểu đúng","tip":"Đánh dấu từng mệnh đề bằng từ khóa: “C,H,O,N”; “thủy phân → amino acid”; “đốt → mùi khét”; “iodine xanh tím” thuộc tinh bột, không thuộc protein.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 18 [NB]. Cho các phát biểu sau: (1) Thành phần nguyên tố chủ yếu của protein là C, H, O, N và một lượng nhỏ S, P, kim loại.. (2) Khi đun nóng protein trong dung dịch acid hoặc base, protein bị thủy phân sinh ra các amino acid. (3) Khi đun nóng mạnh hoặc đốt cháy, protein bị phân hủy tạo thành những chất bay hơi và có mùi khét. (4) Ứng dụng chính của protein là làm thức ăn, ngoài ra protein còn có các ứng dụng khác trong công nghiệp dệt (len, tơ tằm), da, mĩ nghệ (sừng, ngà) … (5) Dấu hiệu để nhận biết protein là làm dung dịch iodine đổi màu xanh. Số phát biểu đúng là\nA. 3.\nB. 4.\nC. 5.\nD. 2.","solution":"Các phát biểu (1), (2), (3), (4) đúng; phát biểu (5) sai vì iodine nhận biết tinh bột. Có 4 phát biểu đúng.","trap":"Không đọc cả đoạn theo cảm tính; tách từng mệnh đề và đối chiếu một từ khóa.","extra":[],"exampleQuestionNumber":18},{"title":"Dạng 2. Suy luận hiện tượng đông tụ – biến tính","tip":"Gặp nhiệt độ cao, acid hoặc một số hóa chất: ưu tiên đáp án “protein biến tính, kết tụ/đông tụ”.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Lòng trắng trứng đông lại khi đun nóng vì\nA. amino acid biến thành DNA.\nB. protein chuyển hoàn toàn thành glucose.\nC. protein bị biến tính và kết tụ.\nD. nước biến thành lipid.","solution":"Chọn “protein bị biến tính và kết tụ”. Đây là biến đổi cấu trúc protein, không phải tạo glucose hay DNA.","trap":"“Đông tụ” là hiện tượng; “thủy phân” tạo amino acid và cần điều kiện phản ứng khác.","extra":[],"exampleQuestionNumber":19}],"subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-31","summary":"Trong ngân hàng này không có bài toán định lượng mol – khối lượng. Các câu cần xử lí nhanh chủ yếu là đếm phát biểu và suy luận chuỗi biến đổi.","searchText":"PROTEIN Trong ngân hàng này không có bài toán định lượng mol – khối lượng. Các câu cần xử lí nhanh chủ yếu là đếm phát biểu và suy luận chuỗi biến đổi. Dạng 1. Đếm số phát biểu đúng Đánh dấu từng mệnh đề bằng từ khóa: “C,H,O,N”; “thủy phân → amino acid”; “đốt → mùi khét”; “iodine xanh tím” thu
