ượng trong Ngân Hà. Phương án A phù hợp với kiến thức trọng tâm của bài: Ngân Hà là thiên hà chứa Hệ Mặt Trời; lực hấp dẫn giữ các sao chuyển động quanh tâm thiên hà.","trap":"Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không nhầm Hệ Mặt Trời với toàn bộ Ngân Hà hoặc Ngân Hà với toàn vũ trụ.","extra":[]}],"searchText":"Ngân Hà Ngân Hà là thiên hà chứa Hệ Mặt Trời; lực hấp dẫn giữ các sao chuyển động quanh tâm thiên hà. Dạng 1. Nhận biết khái niệm, dụng cụ hoặc đặc điểm Gạch chân từ khóa định nghĩa hoặc đặc điểm. Chốt kiến thức: Ngân Hà là thiên hà chứa Hệ Mặt Trời; lực hấp dẫn giữ các sao chuyển động quanh tâm thiên hà. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Ngân Hà là gì?\nA. Thiên hà chứa Hệ Mặt Trời\nB. Một vệ tinh\nC. Một hành tinh\nD. Một ngôi sao Đáp án theo ngân hàng: A. Thiên hà chứa Hệ Mặt Trời. Phương án A phù hợp với kiến thức trọng tâm của bài: Ngân Hà là thiên hà chứa Hệ Mặt Trời; lực hấp dẫn giữ các sao chuyển động quanh tâm thiên hà. Không chọn phương án chỉ đúng một phần hoặc thuộc khái niệm gần giống. Không nhầm Hệ Mặt Trời với toàn bộ Ngân Hà hoặc Ngân Hà với toàn vũ trụ. Dạng 2. Giải thích hiện tượng và tình huống Tìm nguyên nhân trực tiếp và đối chiếu quan hệ cấu tạo – chức năng hoặc điều kiện – kết quả. Ngân Hà là thiên hà chứa Hệ Mặt Trời; lực hấp dẫn giữ các sao chuyển động quanh tâm thiên hà. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Tại sao Ngân Hà trông như dải sáng mờ thay vì thấy từng sao bằng mắt thường?\nA. Mặt Trời che mọi sao\nB. Không có sao trong Ngân Hà\nC. Rất nhiều sao xa và ánh sáng hòa vào nhau\nD. Ngân Hà là một đám mây trong khí quyển Đáp án theo ngân hàng: C. Rất nhiều sao xa và ánh sáng hòa vào nhau. Phương án C phù hợp với kiến thức trọng tâm của bài: Ngân Hà là thiên hà chứa Hệ Mặt Trời; lực hấp dẫn giữ các sao chuyển động quanh tâm thiên hà. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không nhầm Hệ Mặt Trời với toàn bộ Ngân Hà hoặc Ngân Hà với toàn vũ trụ. Dạng 3. Thông hiểu mở rộng và chọn phương án đúng nhất Loại các phương án trái quy tắc hoặc không phù hợp điều kiện thực tế. Ngân Hà là thiên hà chứa Hệ Mặt Trời; lực hấp dẫn giữ các sao chuyển động quanh tâm thiên hà. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Thông hiểu): Mặt Trời quay quanh tâm Ngân Hà. Điều gì giữ nó trên quỹ đạo?\nA. Lực hấp dẫn của khối lượng trong Ngân Hà\nB. Lực cản nước\nC. Lực đàn hồi\nD. Lực ma sát không khí Đáp án theo ngân hàng: A. Lực hấp dẫn của khối lượng trong Ngân Hà. Phương án A phù hợp với kiến thức trọng tâm của bài: Ngân Hà là thiên hà chứa Hệ Mặt Trời; lực hấp dẫn giữ các sao chuyển động quanh tâm thiên hà. Không suy luận theo cảm giác; bám sát dữ kiện và từ khóa “chủ yếu”, “đúng nhất”, “không”. Không nhầm Hệ Mặt Trời với toàn bộ Ngân Hà hoặc Ngân Hà với toàn vũ trụ."}],"totalForms":165,"sourceQuestionCount":1650},"7":{"grade":7,"unitLabel":"Chủ đề","shortName":"KHTN 7","description":"Kĩ năng KHTN – Hóa học – Vật lý – Sinh học","subjects":[{"name":"Kĩ năng KHTN","key":"general","short":"Chung","range":"Chủ đề 1","count":1},{"name":"Hóa học","key":"chemistry","short":"Hóa","range":"Chủ đề 2–7","count":6},{"name":"Vật lý","key":"physics","short":"Lý","range":"Chủ đề 8–20","count":13},{"name":"Sinh học","key":"biology","short":"Sinh","range":"Chủ đề 21–42","count":22}],"lessons":[{"number":1,"title":"PHƯƠNG PHÁP VÀ KĨ NĂNG HỌC TẬP MÔN KHOA HỌC TỰ NHIÊN","subject":"Kĩ năng KHTN","subjectKey":"general","shortSubject":"Chung","slug":"chu-de-1","summary":"Quy trình nghiên cứu khoa học và kĩ năng đo","intro":["Quy trình nghiên cứu khoa học và kĩ năng đo"],"forms":[{"title":"Dạng 1. Nhận biết đối tượng nghiên cứu của Khoa học tự nhiên","tip":"Khoa học tự nhiên tập trung vào sự vật, hiện tượng và quy luật của thế giới tự nhiên.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Khoa học tự nhiên nghiên cứu chủ yếu những gì?\nA. Các sự vật và hiện tượng tự nhiên\nB. Các sự kiện lịch sử\nC. Các tác phẩm văn học\nD. Các quy tắc ngữ pháp","solution":"Theo đáp án của ngân hàng: chọn A. Các sự vật và hiện tượng tự nhiên. Khoa học tự nhiên tập trung vào sự vật, hiện tượng và quy luật của thế giới tự nhiên.","trap":"Không chọn các đối tượng thuộc lịch sử, văn học hoặc ngôn ngữ.","extra":[]},{"title":"Dạng 2. Phân biệt kĩ năng quan sát với dự đoán và kết luận","tip":"Dùng giác quan hoặc dụng cụ để thu thập thông tin trực tiếp là kĩ năng quan sát.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Lan dùng kính lúp quan sát cánh kiến. Đây là kĩ năng nào?\nA. Dự đoán\nB. Liên kết\nC. Quan sát\nD. Kết luận","solution":"Theo đáp án của ngân hàng: chọn C. Quan sát. Dùng giác quan hoặc dụng cụ để thu thập thông tin trực tiếp là kĩ năng quan sát.","trap":"Dự đoán là nêu khả năng có thể xảy ra; kết luận phải dựa trên dữ liệu.","extra":[]},{"title":"Dạng 3. Xác định bước đầu tiên khi thiết kế nghiên cứu","tip":"Bắt đầu bằng câu hỏi hoặc vấn đề nghiên cứu, sau đó mới xây dựng giả thuyết và thí nghiệm.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Muốn nghiên cứu ảnh hưởng của ánh sáng đến cây đậu, việc đầu tiên cần làm là\nA. Đặt câu hỏi nghiên cứu\nB. Viết kết luận\nC. Báo cáo\nD. Công bố kết quả","solution":"Theo đáp án của ngân hàng: chọn A. Đặt câu hỏi nghiên cứu. Bắt đầu bằng câu hỏi hoặc vấn đề nghiên cứu, sau đó mới xây dựng giả thuyết và thí nghiệm.","trap":"Không viết kết luận hoặc báo cáo trước khi thu thập bằng chứng.","extra":[]}],"searchText":"PHƯƠNG PHÁP VÀ KĨ NĂNG HỌC TẬP MÔN KHOA HỌC TỰ NHIÊN Quy trình nghiên cứu khoa học và kĩ năng đo Dạng 1. Nhận biết đối tượng nghiên cứu của Khoa học tự nhiên Khoa học tự nhiên tập trung vào sự vật, hiện tượng và quy luật của thế giới tự nhiên. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Khoa học tự nhiên nghiên cứu chủ yếu những gì?\nA. Các sự vật và hiện tượng tự nhiên\nB. Các sự kiện lịch sử\nC. Các tác phẩm văn học\nD. Các quy tắc ngữ pháp Theo đáp án của ngân hàng: chọn A. Các sự vật và hiện tượng tự nhiên. Khoa học tự nhiên tập trung vào sự vật, hiện tượng và quy luật của thế giới tự nhiên. Không chọn các đối tượng thuộc lịch sử, văn học hoặc ngôn ngữ. Dạng 2. Phân biệt kĩ năng quan sát với dự đoán và kết luận Dùng giác quan hoặc dụng cụ để thu thập thông tin trực tiếp là kĩ năng quan sát. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Lan dùng kính lúp quan sát cánh kiến. Đây là kĩ năng nào?\nA. Dự đoán\nB. Liên kết\nC. Quan sát\nD. Kết luận Theo đáp án của ngân hàng: chọn C. Quan sát. Dùng giác quan hoặc dụng cụ để thu thập thông tin trực tiếp là kĩ năng quan sát. Dự đoán là nêu khả năng có thể xảy ra; kết luận phải dựa trên dữ liệu. Dạng 3. Xác định bước đầu tiên khi thiết kế nghiên cứu Bắt đầu bằng câu hỏi hoặc vấn đề nghiên cứu, sau đó mới xây dựng giả thuyết và thí nghiệm. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Muốn nghiên cứu ảnh hưởng của ánh sáng đến cây đậu, việc đầu tiên cần làm là\nA. Đặt câu hỏi nghiên cứu\nB. Viết kết luận\nC. Báo cáo\nD. Công bố kết quả Theo đáp án của ngân hàng: chọn A. Đặt câu hỏi nghiên cứu. Bắt đầu bằng câu hỏi hoặc vấn đề nghiên cứu, sau đó mới xây dựng giả thuyết và thí nghiệm. Không viết kết luận hoặc báo cáo trước khi thu thập bằng chứng."},{"number":2,"title":"NGUYÊN TỬ","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"chu-de-2","summary":"Cấu tạo nguyên tử và điện tích của nguyên tử","intro":["Cấu tạo nguyên tử và điện tích của nguyên tử"],"forms":[{"title":"Dạng 1. Nhận biết khái niệm nguyên tử","tip":"Nguyên tử là hạt rất nhỏ cấu tạo nên chất; gồm hạt nhân và lớp vỏ electron.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Nguyên tử là\nA. Hạt vô cùng nhỏ cấu tạo nên chất\nB. Tế bào\nC. Phân tử\nD. Hợp chất","solution":"Theo đáp án của ngân hàng: chọn A. Hạt vô cùng nhỏ cấu tạo nên chất. Nguyên tử là hạt rất nhỏ cấu tạo nên chất; gồm hạt nhân và lớp vỏ electron.","trap":"Không đồng nhất nguyên tử với phân tử hoặc tế bào.","extra":[]},{"title":"Dạng 2. Giải thích nguyên tử trung hòa điện","tip":"Nguyên tử trung hòa khi số proton dương bằng số electron âm.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao nguyên tử trung hòa về điện?\nA. Vì có neutron\nB. Vì có hạt nhân\nC. Vì số proton bằng số electron\nD. Vì rất nhỏ","solution":"Theo đáp án của ngân hàng: chọn C. Vì số proton bằng số electron. Nguyên tử trung hòa khi số proton dương bằng số electron âm.","trap":"Neutron không quyết định điện tích vì không mang điện.","extra":[]},{"title":"Dạng 3. Xác định điện tích từ số proton và electron","tip":"So sánh p và e: p=e trung hòa; p>e mang điện dương; p<e mang điện âm.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Nguyên tử X có 8 proton và 8 electron. Nhận xét đúng là\nA. Nguyên tử trung hòa\nB. Mang điện dương\nC. Mang điện âm\nD. Không tồn tại","solution":"Theo đáp án của ngân hàng: chọn A. Nguyên tử trung hòa. So sánh p và e: p=e trung hòa; p>e mang điện dương; p<e mang điện âm.","trap":"Không dùng số neutron để kết luận điện tích.","extra":[]}],"searchText":"NGUYÊN TỬ Cấu tạo nguyên tử và điện tích của nguyên tử Dạng 1. Nhận biết khái niệm nguyên tử Nguyên tử là hạt rất nhỏ cấu tạo nên chất; gồm hạt nhân và lớp vỏ electron. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Nguyên tử là\nA. Hạt vô cùng nhỏ cấu tạo nên chất\nB. Tế bào\nC. Phân tử\nD. Hợp chất Theo đáp án của ngân hàng: chọn A. Hạt vô cùng nhỏ cấu tạo nên chất. Nguyên tử là hạt rất nhỏ cấu tạo nên chất; gồm hạt nhân và lớp vỏ electron. Không đồng nhất nguyên tử với phân tử hoặc tế bào. Dạng 2. Giải thích nguyên tử trung hòa điện Nguyên tử trung hòa khi số proton dương bằng số electron âm. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao nguyên tử trung hòa về điện?\nA. Vì có neutron\nB. Vì có hạt nhân\nC. Vì số proton bằng số electron\nD. Vì rất nhỏ Theo đáp án của ngân hàng: chọn C. Vì số proton bằng số electron. Nguyên tử trung hòa khi số proton dương bằng số electron âm. Neutron không quyết định điện tích vì không mang điện. Dạng 3. Xác định điện tích từ số proton và electron So sánh p và e: p=e trung hòa; p>e mang điện dương; p<e mang điện âm. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Nguyên tử X có 8 proton và 8 electron. Nhận xét đúng là\nA. Nguyên tử trung hòa\nB. Mang điện dương\nC. Mang điện âm\nD. Không tồn tại Theo đáp án của ngân hàng: chọn A. Nguyên tử trung hòa. So sánh p và e: p=e trung hòa; p>e mang điện dương; p<e mang điện âm. Không dùng số neutron để kết luận điện tích."},{"number":3,"title":"NGUYÊN TỐ HÓA HỌC","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"chu-de-3","summary":"Nguyên tố hóa học và kí hiệu hóa học","intro":["Nguyên tố hóa học và kí hiệu hóa học"],"forms":[{"title":"Dạng 1. Nhận biết bản chất của nguyên tố hóa học","tip":"Các nguyên tử cùng nguyên tố phải có cùng số proton trong hạt nhân.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Nguyên tố hóa học là tập hợp các nguyên tử có cùng\nA. Số proton\nB. Số neutron\nC. Khối lượng\nD. Số lớp electron","solution":"Theo đáp án của ngân hàng: chọn A. Số proton. Các nguyên tử cùng nguyên tố phải có cùng số proton trong hạt nhân.","trap":"Số neutron có thể khác mà nguyên tố vẫn không đổi.","extra":[]},{"title":"Dạng 2. Giải thích vai trò quyết định của proton","tip":"Số proton là đại lượng đặc trưng xác định bản chất và số hiệu nguyên tử của nguyên tố.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao các nguyên tử có cùng số proton thuộc cùng một nguyên tố?\nA. Vì có cùng khối lượng\nB. Vì có cùng số neutron\nC. Vì proton quyết định bản chất nguyên tố\nD. Vì có cùng kích thước","solution":"Theo đáp án của ngân hàng: chọn C. Vì proton quyết định bản chất nguyên tố. Số proton là đại lượng đặc trưng xác định bản chất và số hiệu nguyên tử của nguyên tố.","trap":"Không dùng khối lượng hoặc số lớp electron để xác định duy nhất nguyên tố.","extra":[]},{"title":"Dạng 3. Xác định nguyên tố từ số proton","tip":"Đối chiếu số proton với số hiệu nguyên tử hoặc dữ liệu bảng tuần hoàn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một nguyên tử có 11 proton thuộc nguyên tố\nA. sodium (Na)\nB. oxygen (O)\nC. hydrogen (H)\nD. nitrogen (N)","solution":"Theo đáp án của ngân hàng: chọn A. sodium (Na). Đối chiếu số proton với số hiệu nguyên tử hoặc dữ liệu bảng tuần hoàn.","trap":"Không suy đoán nguyên tố chỉ từ tên hoặc trạng thái của chất.","extra":[]}],"searchText":"NGUYÊN TỐ HÓA HỌC Nguyên tố hóa học và kí hiệu hóa học Dạng 1. Nhận biết bản chất của nguyên tố hóa học Các nguyên tử cùng nguyên tố phải có cùng số proton trong hạt nhân. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Nguyên tố hóa học là tập hợp các nguyên tử có cùng\nA. Số proton\nB. Số neutron\nC. Khối lượng\nD. Số lớp electron Theo đáp án của ngân hàng: chọn A. Số proton. Các nguyên tử cùng nguyên tố phải có cùng số proton trong hạt nhân. Số neutron có thể khác mà nguyên tố vẫn không đổi. Dạng 2. Giải thích vai trò quyết định của proton Số proton là đại lượng đặc trưng xác định bản chất và số hiệu nguyên tử của nguyên tố. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao các nguyên tử có cùng số proton thuộc cùng một nguyên tố?\nA. Vì có cùng khối lượng\nB. Vì có cùng số neutron\nC. Vì proton quyết định bản chất nguyên tố\nD. Vì có cùng kích thước Theo đáp án của ngân hàng: chọn C. Vì proton quyết định bản chất nguyên tố. Số proton là đại lượng đặc trưng xác định bản chất và số hiệu nguyên tử của nguyên tố. Không dùng khối lượng hoặc số lớp electron để xác định duy nhất nguyên tố. Dạng 3. Xác định nguyên tố từ số proton Đối chiếu số proton với số hiệu nguyên tử hoặc dữ liệu bảng tuần hoàn. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một nguyên tử có 11 proton thuộc nguyên tố\nA. sodium (Na)\nB. oxygen (O)\nC. hydrogen (H)\nD. nitrogen (N) Theo đáp án của ngân hàng: chọn A. sodium (Na). Đối chiếu số proton với số hiệu nguyên tử hoặc dữ liệu bảng tuần hoàn. Không suy đoán nguyên tố chỉ từ tên hoặc trạng thái của chất."},{"number":4,"title":"SƠ LƯỢC VỀ BẢNG TUẦN HOÀN CÁC NGUYÊN TỐ HÓA HỌC","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"chu-de-4","summary":"Đọc bảng tuần hoàn và xác định chu kì, nhóm","intro":["Đọc bảng tuần hoàn và xác định chu kì, nhóm"],"forms":[{"title":"Dạng 1. Nhận biết nguyên tắc sắp xếp bảng tuần hoàn","tip":"Bảng tuần hoàn được sắp xếp theo chiều tăng dần của số proton, tức số hiệu nguyên tử.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Bảng tuần hoàn các nguyên tố hóa học được sắp xếp chủ yếu theo chiều tăng dần của đại lượng nào?\nA. Số proton trong hạt nhân\nB. Số neutron\nC. Nguyên tử khối\nD. Số lớp electron","solution":"Theo đáp án của ngân hàng: chọn A. Số proton trong hạt nhân. Bảng tuần hoàn được sắp xếp theo chiều tăng dần của số proton, tức số hiệu nguyên tử.","trap":"Không chọn số neutron hoặc nguyên tử khối làm nguyên tắc chính.","extra":[]},{"title":"Dạng 2. Xác định điểm chung của các nguyên tố cùng chu kì","tip":"Số thứ tự chu kì bằng số lớp electron của nguyên tử.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Hai nguyên tố nằm trong cùng một chu kì có điểm chung nào?\nA. Cùng số proton\nB. Cùng số electron lớp ngoài cùng\nC. Cùng số lớp electron\nD. Cùng nguyên tử khối","solution":"Theo đáp án của ngân hàng: chọn C. Cùng số lớp electron. Số thứ tự chu kì bằng số lớp electron của nguyên tử.","trap":"Cùng chu kì không có nghĩa là cùng số electron lớp ngoài cùng.","extra":[]},{"title":"Dạng 3. Xác định chu kì từ cấu tạo electron","tip":"Đếm số lớp electron đang có; nguyên tử có ba lớp electron thuộc chu kì 3.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Nguyên tử X có 3 lớp electron. Dựa vào cấu tạo nguyên tử, X thuộc chu kì nào?\nA. Chu kì 3\nB. Chu kì 1\nC. Chu kì 2\nD. Chu kì 4","solution":"Theo đáp án của ngân hàng: chọn A. Chu kì 3. Đếm số lớp electron đang có; nguyên tử có ba lớp electron thuộc chu kì 3.","trap":"Không dùng tổng số electron làm số thứ tự chu kì.","extra":[]}],"searchText":"SƠ LƯỢC VỀ BẢNG TUẦN HOÀN CÁC NGUYÊN TỐ HÓA HỌC Đọc bảng tuần hoàn và xác định chu kì, nhóm Dạng 1. Nhận biết nguyên tắc sắp xếp bảng tuần hoàn Bảng tuần hoàn được sắp xếp theo chiều tăng dần của số proton, tức số hiệu nguyên tử. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Bảng tuần hoàn các nguyên tố hóa học được sắp xếp chủ yếu theo chiều tăng dần của đại lượng nào?\nA. Số proton trong hạt nhân\nB. Số neutron\nC. Nguyên tử khối\nD. Số lớp electron Theo đáp án của ngân hàng: chọn A. Số proton trong hạt nhân. Bảng tuần hoàn được sắp xếp theo chiều tăng dần của số proton, tức số hiệu nguyên tử. Không chọn số neutron hoặc nguyên tử khối làm nguyên tắc chính. Dạng 2. Xác định điểm chung của các nguyên tố cùng chu kì Số thứ tự chu kì bằng số lớp electron của nguyên tử. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Hai nguyên tố nằm trong cùng một chu kì có điểm chung nào?\nA. Cùng số proton\nB. Cùng số electron lớp ngoài cùng\nC. Cùng số lớp electron\nD. Cùng nguyên tử khối Theo đáp án của ngân hàng: chọn C. Cùng số lớp electron. Số thứ tự chu kì bằng số lớp electron của nguyên tử. Cùng chu kì không có nghĩa là cùng số electron lớp ngoài cùng. Dạng 3. Xác định chu kì từ cấu tạo electron Đếm số lớp electron đang có; nguyên tử có ba lớp electron thuộc chu kì 3. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Nguyên tử X có 3 lớp electron. Dựa vào cấu tạo nguyên tử, X thuộc chu kì nào?\nA. Chu kì 3\nB. Chu kì 1\nC. Chu kì 2\nD. Chu kì 4 Theo đáp án của ngân hàng: chọn A. Chu kì 3. Đếm số lớp electron đang có; nguyên tử có ba lớp electron thuộc chu kì 3. Không dùng tổng số electron làm số thứ tự chu kì."},{"number":5,"title":"PHÂN TỬ – ĐƠN CHẤT – HỢP CHẤT","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"chu-de-5","summary":"Phân tử, đơn chất, hợp chất và khối lượng phân tử","intro":["Phân tử, đơn chất, hợp chất và khối lượng phân tử"],"forms":[{"title":"Dạng 1. Nhận biết phân tử","tip":"Phân tử gồm một hoặc nhiều nguyên tử liên kết với nhau và đại diện cho chất.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Phân tử là hạt đại diện cho chất và gồm\nA. một hoặc nhiều nguyên tử liên kết với nhau\nB. chỉ các proton\nC. chỉ các electron\nD. các hạt nhân đứng riêng lẻ","solution":"Theo đáp án của ngân hàng: chọn A. một hoặc nhiều nguyên tử liên kết với nhau. Phân tử gồm một hoặc nhiều nguyên tử liên kết với nhau và đại diện cho chất.","trap":"Không coi một tập hợp proton hoặc electron là phân tử.","extra":[]},{"title":"Dạng 2. Phân biệt đơn chất và hợp chất","tip":"Chất chỉ gồm một nguyên tố là đơn chất; gồm từ hai nguyên tố trở lên là hợp chất.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Oxygen và ozone đều là đơn chất của nguyên tố oxygen vì\nA. đều ở thể khí\nB. đều không màu\nC. chỉ được tạo nên từ nguyên tử oxygen\nD. có cùng số nguyên tử trong phân tử","solution":"Theo đáp án của ngân hàng: chọn C. chỉ được tạo nên từ nguyên tử oxygen. Chất chỉ gồm một nguyên tố là đơn chất; gồm từ hai nguyên tố trở lên là hợp chất.","trap":"Số nguyên tử trong phân tử không quyết định đơn chất hay hợp chất.","extra":[]},{"title":"Dạng 3. Tính khối lượng phân tử","tip":"Cộng khối lượng nguyên tử của tất cả nguyên tử theo chỉ số trong công thức.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Biết khối lượng nguyên tử tương đối của H là 1 và O là 16. Khối lượng phân tử của nước là\nA. 18 amu\nB. 17 amu\nC. 16 amu\nD. 34 amu","solution":"Theo đáp án của ngân hàng: chọn A. 18 amu. M(H₂O) = 2 × 1 + 16 = 18 amu.","trap":"Phải nhân khối lượng nguyên tử với số nguyên tử tương ứng.","extra":[]}],"searchText":"PHÂN TỬ – ĐƠN CHẤT – HỢP CHẤT Phân tử, đơn chất, hợp chất và khối lượng phân tử Dạng 1. Nhận biết phân tử Phân tử gồm một hoặc nhiều nguyên tử liên kết với nhau và đại diện cho chất. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Phân tử là hạt đại diện cho chất và gồm\nA. một hoặc nhiều nguyên tử liên kết với nhau\nB. chỉ các proton\nC. chỉ các electron\nD. các hạt nhân đứng riêng lẻ Theo đáp án của ngân hàng: chọn A. một hoặc nhiều nguyên tử liên kết với nhau. Phân tử gồm một hoặc nhiều nguyên tử liên kết với nhau và đại diện cho chất. Không coi một tập hợp proton hoặc electron là phân tử. Dạng 2. Phân biệt đơn chất và hợp chất Chất chỉ gồm một nguyên tố là đơn chất; gồm từ hai nguyên tố trở lên là hợp chất. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Oxygen và ozone đều là đơn chất của nguyên tố oxygen vì\nA. đều ở thể khí\nB. đều không màu\nC. chỉ được tạo nên từ nguyên tử oxygen\nD. có cùng số nguyên tử trong phân tử Theo đáp án của ngân hàng: chọn C. chỉ được tạo nên từ nguyên tử oxygen. Chất chỉ gồm một nguyên tố là đơn chất; gồm từ hai nguyên tố trở lên là hợp chất. Số nguyên tử trong phân tử không quyết định đơn chất hay hợp chất. Dạng 3. Tính khối lượng phân tử Cộng khối lượng nguyên tử của tất cả nguyên tử theo chỉ số trong công thức. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Biết khối lượng nguyên tử tương đối của H là 1 và O là 16. Khối lượng phân tử của nước là\nA. 18 amu\nB. 17 amu\nC. 16 amu\nD. 34 amu Theo đáp án của ngân hàng: chọn A. 18 amu. M(H₂O) = 2 × 1 + 16 = 18 amu. Phải nhân khối lượng nguyên tử với số nguyên tử tương ứng."},{"number":6,"title":"GIỚI THIỆU VỀ LIÊN KẾT HÓA HỌC","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"chu-de-6","summary":"Liên kết ion, liên kết cộng hóa trị và sự tạo ion","intro":["Liên kết ion, liên kết cộng hóa trị và sự tạo ion"],"forms":[{"title":"Dạng 1. Nhận biết đối tượng hình thành liên kết hóa học","tip":"Liên kết hóa học hình thành giữa các nguyên tử để tạo cấu trúc bền hơn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Liên kết hóa học được hình thành giữa\nA. các nguyên tử\nB. các tế bào\nC. các mô\nD. các cơ quan","solution":"Theo đáp án của ngân hàng: chọn A. các nguyên tử. Liên kết hóa học hình thành giữa các nguyên tử để tạo cấu trúc bền hơn.","trap":"Không chọn tế bào, mô hoặc cơ quan.","extra":[]},{"title":"Dạng 2. Giải thích sự tạo ion dương","tip":"Nguyên tử nhường electron sẽ có số proton lớn hơn số electron nên tạo ion dương.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao sodium dễ tạo ion dương Na⁺?\nA. Vì nhận thêm một electron\nB. Vì nhận thêm một proton\nC. Vì nhường một electron lớp ngoài cùng\nD. Vì mất một neutron","solution":"Theo đáp án của ngân hàng: chọn C. Vì nhường một electron lớp ngoài cùng. Nguyên tử nhường electron sẽ có số proton lớn hơn số electron nên tạo ion dương.","trap":"Nhường electron không làm mất proton hoặc neutron.","extra":[]},{"title":"Dạng 3. Xác định điện tích ion từ số electron trao đổi","tip":"Nhường n electron tạo ion n+; nhận n electron tạo ion n−.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Nguyên tử X nhường hai electron. Ion tạo thành của X mang điện tích\nA. 2⁺\nB. 2⁻\nC. 1⁺\nD. không mang điện","solution":"Theo đáp án của ngân hàng: chọn A. 2⁺. Nhường n electron tạo ion n+; nhận n electron tạo ion n−.","trap":"Không đảo dấu điện tích của ion.","extra":[]}],"searchText":"GIỚI THIỆU VỀ LIÊN KẾT HÓA HỌC Liên kết ion, liên kết cộng hóa trị và sự tạo ion Dạng 1. Nhận biết đối tượng hình thành liên kết hóa học Liên kết hóa học hình thành giữa các nguyên tử để tạo cấu trúc bền hơn. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Liên kết hóa học được hình thành giữa\nA. các nguyên tử\nB. các tế bào\nC. các mô\nD. các cơ quan Theo đáp án của ngân hàng: chọn A. các nguyên tử. Liên kết hóa học hình thành giữa các nguyên tử để tạo cấu trúc bền hơn. Không chọn tế bào, mô hoặc cơ quan. Dạng 2. Giải thích sự tạo ion dương Nguyên tử nhường electron sẽ có số proton lớn hơn số electron nên tạo ion dương. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao sodium dễ tạo ion dương Na⁺?\nA. Vì nhận thêm một electron\nB. Vì nhận thêm một proton\nC. Vì nhường một electron lớp ngoài cùng\nD. Vì mất một neutron Theo đáp án của ngân hàng: chọn C. Vì nhường một electron lớp ngoài cùng. Nguyên tử nhường electron sẽ có số proton lớn hơn số electron nên tạo ion dương. Nhường electron không làm mất proton hoặc neutron. Dạng 3. Xác định điện tích ion từ số electron trao đổi Nhường n electron tạo ion n+; nhận n electron tạo ion n−. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Nguyên tử X nhường hai electron. Ion tạo thành của X mang điện tích\nA. 2⁺\nB. 2⁻\nC. 1⁺\nD. không mang điện Theo đáp án của ngân hàng: chọn A. 2⁺. Nhường n electron tạo ion n+; nhận n electron tạo ion n−. Không đảo dấu điện tích của ion."},{"number":7,"title":"HÓA TRỊ VÀ CÔNG THỨC HÓA HỌC","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"chu-de-7","summary":"Hóa trị và lập công thức hóa học","intro":["Hóa trị và lập công thức hóa học"],"forms":[{"title":"Dạng 1. Nhận biết ý nghĩa của hóa trị","tip":"Hóa trị biểu thị khả năng liên kết của nguyên tử nguyên tố với nguyên tử khác.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Hóa trị của một nguyên tố biểu thị\nA. khả năng liên kết của nguyên tử nguyên tố đó với nguyên tử khác\nB. số neutron trong hạt nhân\nC. khối lượng riêng của chất\nD. nhiệt độ nóng chảy của nguyên tố","solution":"Theo đáp án của ngân hàng: chọn A. khả năng liên kết của nguyên tử nguyên tố đó với nguyên tử khác. Hóa trị biểu thị khả năng liên kết của nguyên tử nguyên tố với nguyên tử khác.","trap":"Hóa trị không phải số neutron, khối lượng riêng hoặc nhiệt độ nóng chảy.","extra":[]},{"title":"Dạng 2. Vận dụng quy tắc hóa trị","tip":"Trong AxBy, tích chỉ số và hóa trị của A bằng tích chỉ số và hóa trị của B.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Trong hợp chất H₂O, tổng hóa trị của hai nguyên tử hydrogen bằng hóa trị của một nguyên tử oxygen vì\nA. hydrogen và oxygen có cùng khối lượng\nB. oxygen có hai lớp electron\nC. công thức tuân theo quy tắc hóa trị\nD. phân tử nước trung hòa về khối lượng","solution":"Theo đáp án của ngân hàng: chọn C. công thức tuân theo quy tắc hóa trị. Trong AxBy, tích chỉ số và hóa trị của A bằng tích chỉ số và hóa trị của B.","trap":"Không cộng hóa trị hoặc đổi chỉ số tùy ý.","extra":[]},{"title":"Dạng 3. Lập công thức bằng phương pháp chéo hóa trị","tip":"Chéo hóa trị làm chỉ số rồi rút gọn về tỉ lệ nguyên tối giản.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Nguyên tố X hóa trị III kết hợp với oxygen hóa trị II. Công thức phù hợp của oxide là\nA. X₂O₃\nB. XO\nC. XO₂\nD. X₃O₂","solution":"Theo đáp án của ngân hàng: chọn A. X₂O₃. X hóa trị III, O hóa trị II → X₂O₃.","trap":"Không để chỉ số 1 và phải rút gọn nếu hai chỉ số có ước chung.","extra":[]}],"searchText":"HÓA TRỊ VÀ CÔNG THỨC HÓA HỌC Hóa trị và lập công thức hóa học Dạng 1. Nhận biết ý nghĩa của hóa trị Hóa trị biểu thị khả năng liên kết của nguyên tử nguyên tố với nguyên tử khác. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Hóa trị của một nguyên tố biểu thị\nA. khả năng liên kết của nguyên tử nguyên tố đó với nguyên tử khác\nB. số neutron trong hạt nhân\nC. khối lượng riêng của chất\nD. nhiệt độ nóng chảy của nguyên tố Theo đáp án của ngân hàng: chọn A. khả năng liên kết của nguyên tử nguyên tố đó với nguyên tử khác. Hóa trị biểu thị khả năng liên kết của nguyên tử nguyên tố với nguyên tử khác. Hóa trị không phải số neutron, khối lượng riêng hoặc nhiệt độ nóng chảy. Dạng 2. Vận dụng quy tắc hóa trị Trong AxBy, tích chỉ số và hóa trị của A bằng tích chỉ số và hóa trị của B. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Trong hợp chất H₂O, tổng hóa trị của hai nguyên tử hydrogen bằng hóa trị của một nguyên tử oxygen vì\nA. hydrogen và oxygen có cùng khối lượng\nB. oxygen có hai lớp electron\nC. công thức tuân theo quy tắc hóa trị\nD. phân tử nước trung hòa về khối lượng Theo đáp án của ngân hàng: chọn C. công thức tuân theo quy tắc hóa trị. Trong AxBy, tích chỉ số và hóa trị của A bằng tích chỉ số và hóa trị của B. Không cộng hóa trị hoặc đổi chỉ số tùy ý. Dạng 3. Lập công thức bằng phương pháp chéo hóa trị Chéo hóa trị làm chỉ số rồi rút gọn về tỉ lệ nguyên tối giản. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Nguyên tố X hóa trị III kết hợp với oxygen hóa trị II. Công thức phù hợp của oxide là\nA. X₂O₃\nB. XO\nC. XO₂\nD. X₃O₂ Theo đáp án của ngân hàng: chọn A. X₂O₃. X hóa trị III, O hóa trị II → X₂O₃. Không để chỉ số 1 và phải rút gọn nếu hai chỉ số có ước chung."},{"number":8,"title":"TỐC ĐỘ CHUYỂN ĐỘNG","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"chu-de-8","summary":"Tốc độ chuyển động và công thức v = s/t","intro":["Tốc độ chuyển động và công thức v = s/t"],"forms":[{"title":"Dạng 1. Nhận biết đại lượng tốc độ","tip":"Tốc độ cho biết mức độ nhanh hay chậm của chuyển động.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Đại lượng cho biết mức độ nhanh hay chậm của chuyển động là\nA. tốc độ\nB. quãng đường\nC. thời gian\nD. khối lượng","solution":"Theo đáp án của ngân hàng: chọn A. tốc độ. Tốc độ cho biết mức độ nhanh hay chậm của chuyển động.","trap":"Không nhầm tốc độ với quãng đường hoặc thời gian.","extra":[]},{"title":"Dạng 2. So sánh tốc độ khi cùng quãng đường","tip":"Cùng đi một quãng đường, vật mất ít thời gian hơn có tốc độ lớn hơn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Hai bạn cùng chạy 100 m. Bạn An hết 20 s, bạn Bình hết 25 s. Người chạy nhanh hơn là\nA. Bình vì thời gian lớn hơn\nB. hai bạn như nhau\nC. An vì thời gian nhỏ hơn\nD. không xác định được","solution":"Theo đáp án của ngân hàng: chọn C. An vì thời gian nhỏ hơn. Cùng đi một quãng đường, vật mất ít thời gian hơn có tốc độ lớn hơn.","trap":"Chỉ so thời gian trực tiếp khi quãng đường bằng nhau.","extra":[]},{"title":"Dạng 3. Tính tốc độ từ quãng đường và thời gian","tip":"Dùng v=s/t và giữ đơn vị đồng nhất trước khi chia.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một học sinh chạy 120 m trong 24 s. Tốc độ của học sinh là\nA. 5 m/s\nB. 4 m/s\nC. 6 m/s\nD. 10 m/s","solution":"Theo đáp án của ngân hàng: chọn A. 5 m/s. v = 120/24 = 5 m/s.","trap":"Không nhân quãng đường với thời gian.","extra":[]}],"searchText":"TỐC ĐỘ CHUYỂN ĐỘNG Tốc độ chuyển động và công thức v = s/t Dạng 1. Nhận biết đại lượng tốc độ Tốc độ cho biết mức độ nhanh hay chậm của chuyển động. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Đại lượng cho biết mức độ nhanh hay chậm của chuyển động là\nA. tốc độ\nB. quãng đường\nC. thời gian\nD. khối lượng Theo đáp án của ngân hàng: chọn A. tốc độ. Tốc độ cho biết mức độ nhanh hay chậm của chuyển động. Không nhầm tốc độ với quãng đường hoặc thời gian. Dạng 2. So sánh tốc độ khi cùng quãng đường Cùng đi một quãng đường, vật mất ít thời gian hơn có tốc độ lớn hơn. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Hai bạn cùng chạy 100 m. Bạn An hết 20 s, bạn Bình hết 25 s. Người chạy nhanh hơn là\nA. Bình vì thời gian lớn hơn\nB. hai bạn như nhau\nC. An vì thời gian nhỏ hơn\nD. không xác định được Theo đáp án của ngân hàng: chọn C. An vì thời gian nhỏ hơn. Cùng đi một quãng đường, vật mất ít thời gian hơn có tốc độ lớn hơn. Chỉ so thời gian trực tiếp khi quãng đường bằng nhau. Dạng 3. Tính tốc độ từ quãng đường và thời gian Dùng v=s/t và giữ đơn vị đồng nhất trước khi chia. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một học sinh chạy 120 m trong 24 s. Tốc độ của học sinh là\nA. 5 m/s\nB. 4 m/s\nC. 6 m/s\nD. 10 m/s Theo đáp án của ngân hàng: chọn A. 5 m/s. v = 120/24 = 5 m/s. Không nhân quãng đường với thời gian."},{"number":9,"title":"ĐO TỐC ĐỘ","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"chu-de-9","summary":"Đo tốc độ và hạn chế sai số","intro":["Đo tốc độ và hạn chế sai số"],"forms":[{"title":"Dạng 1. Xác định các đại lượng cần đo","tip":"Muốn đo tốc độ phải đo quãng đường đi được và thời gian chuyển động.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Muốn đo tốc độ của một vật chuyển động, cần xác định\nA. quãng đường và thời gian chuyển động\nB. khối lượng và thể tích\nC. nhiệt độ và khối lượng\nD. lực và diện tích","solution":"Theo đáp án của ngân hàng: chọn A. quãng đường và thời gian chuyển động. Muốn đo tốc độ phải đo quãng đường đi được và thời gian chuyển động.","trap":"Chỉ đo một trong hai đại lượng thì chưa tính được tốc độ.","extra":[]},{"title":"Dạng 2. Giải thích ưu điểm của cổng quang điện","tip":"Thiết bị tự động ghi thời điểm giúp giảm sai số phản ứng khi bấm đồng hồ bằng tay.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao cổng quang điện cho kết quả đo thời gian chính xác hơn thao tác bấm tay?\nA. Vì cổng quang điện đo được khối lượng\nB. Vì cổng quang điện làm vật chạy nhanh hơn\nC. Vì thiết bị tự động ghi thời điểm, giảm sai số phản ứng của người\nD. Vì không cần đo quãng đường","solution":"Theo đáp án của ngân hàng: chọn C. Vì thiết bị tự động ghi thời điểm, giảm sai số phản ứng của người. Thiết bị tự động ghi thời điểm giúp giảm sai số phản ứng khi bấm đồng hồ bằng tay.","trap":"Độ chính xác không chỉ phụ thuộc vào việc đọc nhiều chữ số.","extra":[]},{"title":"Dạng 3. Tính tốc độ từ số liệu đo","tip":"Thay đúng s và t vào v=s/t, ghi đơn vị theo dữ kiện.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một xe đồ chơi đi quãng đường 1,5 m trong 3,0 s. Tốc độ của xe là\nA. 0,5 m/s\nB. 2,0 m/s\nC. 4,5 m/s\nD. 5,0 m/s","solution":"Theo đáp án của ngân hàng: chọn A. 0,5 m/s. v = 1,5/3,0 = 0,5 m/s.","trap":"Không đổi 1,5 m thành 150 m.","extra":[]}],"searchText":"ĐO TỐC ĐỘ Đo tốc độ và hạn chế sai số Dạng 1. Xác định các đại lượng cần đo Muốn đo tốc độ phải đo quãng đường đi được và thời gian chuyển động. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Muốn đo tốc độ của một vật chuyển động, cần xác định\nA. quãng đường và thời gian chuyển động\nB. khối lượng và thể tích\nC. nhiệt độ và khối lượng\nD. lực và diện tích Theo đáp án của ngân hàng: chọn A. quãng đường và thời gian chuyển động. Muốn đo tốc độ phải đo quãng đường đi được và thời gian chuyển động. Chỉ đo một trong hai đại lượng thì chưa tính được tốc độ. Dạng 2. Giải thích ưu điểm của cổng quang điện Thiết bị tự động ghi thời điểm giúp giảm sai số phản ứng khi bấm đồng hồ bằng tay. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao cổng quang điện cho kết quả đo thời gian chính xác hơn thao tác bấm tay?\nA. Vì cổng quang điện đo được khối lượng\nB. Vì cổng quang điện làm vật chạy nhanh hơn\nC. Vì thiết bị tự động ghi thời điểm, giảm sai số phản ứng của người\nD. Vì không cần đo quãng đường Theo đáp án của ngân hàng: chọn C. Vì thiết bị tự động ghi thời điểm, giảm sai số phản ứng của người. Thiết bị tự động ghi thời điểm giúp giảm sai số phản ứng khi bấm đồng hồ bằng tay. Độ chính xác không chỉ phụ thuộc vào việc đọc nhiều chữ số. Dạng 3. Tính tốc độ từ số liệu đo Thay đúng s và t vào v=s/t, ghi đơn vị theo dữ kiện. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một xe đồ chơi đi quãng đường 1,5 m trong 3,0 s. Tốc độ của xe là\nA. 0,5 m/s\nB. 2,0 m/s\nC. 4,5 m/s\nD. 5,0 m/s Theo đáp án của ngân hàng: chọn A. 0,5 m/s. v = 1,5/3,0 = 0,5 m/s. Không đổi 1,5 m thành 150 m."},{"number":10,"title":"ĐỒ THỊ QUÃNG ĐƯỜNG - THỜI GIAN","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"chu-de-10","summary":"Đọc đồ thị quãng đường – thời gian","intro":["Đọc đồ thị quãng đường – thời gian"],"forms":[{"title":"Dạng 1. Nhận biết ý nghĩa trục và đại lượng trên đồ thị","tip":"Đồ thị s–t mô tả quãng đường thay đổi theo thời gian.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Đồ thị quãng đường – thời gian biểu diễn mối liên hệ giữa\nA. quãng đường đi được và thời gian chuyển động\nB. khối lượng và thể tích\nC. lực và diện tích\nD. nhiệt độ và thời gian","solution":"Theo đáp án của ngân hàng: chọn A. quãng đường đi được và thời gian chuyển động. Đồ thị s–t mô tả quãng đường thay đổi theo thời gian.","trap":"Không nhầm với đồ thị tốc độ – thời gian.","extra":[]},{"title":"Dạng 2. So sánh tốc độ bằng độ dốc","tip":"Trong cùng hệ trục, đường biểu diễn càng dốc thì tốc độ càng lớn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Trên cùng một đồ thị, đường của vật A dốc hơn đường của vật B. Kết luận đúng là\nA. A đi chậm hơn B\nB. hai vật cùng tốc độ\nC. A đi nhanh hơn B\nD. B đứng yên","solution":"Theo đáp án của ngân hàng: chọn C. A đi nhanh hơn B. Trong cùng hệ trục, đường biểu diễn càng dốc thì tốc độ càng lớn.","trap":"Phải so độ dốc, không chỉ so điểm cuối của đường.","extra":[]},{"title":"Dạng 3. Tính tốc độ từ một đoạn đồ thị","tip":"Lấy độ tăng quãng đường chia độ tăng thời gian trên cùng đoạn chuyển động.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Đồ thị cho biết một xe đi được 80 km trong 2 giờ. Tốc độ trung bình của xe là\nA. 40 km/h\nB. 80 km/h\nC. 160 km/h\nD. 20 km/h","solution":"Theo đáp án của ngân hàng: chọn A. 40 km/h. v = 80/2 = 40 km/h.","trap":"Không lấy tổng tọa độ hai điểm để chia.","extra":[]}],"searchText":"ĐỒ THỊ QUÃNG ĐƯỜNG - THỜI GIAN Đọc đồ thị quãng đường – thời gian Dạng 1. Nhận biết ý nghĩa trục và đại lượng trên đồ thị Đồ thị s–t mô tả quãng đường thay đổi theo thời gian. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Đồ thị quãng đường – thời gian biểu diễn mối liên hệ giữa\nA. quãng đường đi được và thời gian chuyển động\nB. khối lượng và thể tích\nC. lực và diện tích\nD. nhiệt độ và thời gian Theo đáp án của ngân hàng: chọn A. quãng đường đi được và thời gian chuyển động. Đồ thị s–t mô tả quãng đường thay đổi theo thời gian. Không nhầm với đồ thị tốc độ – thời gian. Dạng 2. So sánh tốc độ bằng độ dốc Trong cùng hệ trục, đường biểu diễn càng dốc thì tốc độ càng lớn. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Trên cùng một đồ thị, đường của vật A dốc hơn đường của vật B. Kết luận đúng là\nA. A đi chậm hơn B\nB. hai vật cùng tốc độ\nC. A đi nhanh hơn B\nD. B đứng yên Theo đáp án của ngân hàng: chọn C. A đi nhanh hơn B. Trong cùng hệ trục, đường biểu diễn càng dốc thì tốc độ càng lớn. Phải so độ dốc, không chỉ so điểm cuối của đường. Dạng 3. Tính tốc độ từ một đoạn đồ thị Lấy độ tăng quãng đường chia độ tăng thời gian trên cùng đoạn chuyển động. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Đồ thị cho biết một xe đi được 80 km trong 2 giờ. Tốc độ trung bình của xe là\nA. 40 km/h\nB. 80 km/h\nC. 160 km/h\nD. 20 km/h Theo đáp án của ngân hàng: chọn A. 40 km/h. v = 80/2 = 40 km/h. Không lấy tổng tọa độ hai điểm để chia."},{"number":11,"title":"THẢO LUẬN VỀ ẢNH HƯỞNG CỦA TỐC ĐỘ TRONG AN TOÀN GIAO THÔNG","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"chu-de-11","summary":"Tốc độ và an toàn giao thông","intro":["Tốc độ và an toàn giao thông"],"forms":[{"title":"Dạng 1. Liên hệ tốc độ với quãng đường phanh","tip":"Tốc độ càng lớn thì xe cần quãng đường và thời gian xử lí dài hơn để dừng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Tốc độ của phương tiện càng lớn thì quãng đường phanh thường\nA. càng dài\nB. càng ngắn\nC. không đổi\nD. bằng không","solution":"Theo đáp án của ngân hàng: chọn A. càng dài. Tốc độ càng lớn thì xe cần quãng đường và thời gian xử lí dài hơn để dừng.","trap":"Không cho rằng phanh tốt làm quãng đường phanh bằng không.","extra":[]},{"title":"Dạng 2. Giải thích khoảng cách an toàn","tip":"Khoảng cách an toàn tạo đủ thời gian phản ứng và quãng đường phanh khi xe trước dừng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao phải giữ khoảng cách an toàn với xe phía trước?\nA. Để tiết kiệm nhiên liệu\nB. Để nhìn biển số rõ hơn\nC. Để có đủ thời gian và quãng đường xử lí khi xe trước dừng\nD. Để tăng tốc dễ hơn","solution":"Theo đáp án của ngân hàng: chọn C. Để có đủ thời gian và quãng đường xử lí khi xe trước dừng. Khoảng cách an toàn tạo đủ thời gian phản ứng và quãng đường phanh khi xe trước dừng.","trap":"Không bám sát xe trước ngay cả khi đường vắng.","extra":[]},{"title":"Dạng 3. Xử lí khi điều kiện đường xấu","tip":"Mưa, sương mù hoặc đường trơn cần giảm tốc và tăng khoảng cách.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một xe đang chạy 60 km/h gặp mưa lớn. Hành động phù hợp nhất là\nA. giảm tốc và tăng khoảng cách với xe trước\nB. giữ nguyên tốc độ\nC. tăng tốc vượt nhanh\nD. đi sát xe trước","solution":"Theo đáp án của ngân hàng: chọn A. giảm tốc và tăng khoảng cách với xe trước. Mưa, sương mù hoặc đường trơn cần giảm tốc và tăng khoảng cách.","trap":"Không giữ nguyên tốc độ giới hạn tối đa khi điều kiện thực tế không an toàn.","extra":[]}],"searchText":"THẢO LUẬN VỀ ẢNH HƯỞNG CỦA TỐC ĐỘ TRONG AN TOÀN GIAO THÔNG Tốc độ và an toàn giao thông Dạng 1. Liên hệ tốc độ với quãng đường phanh Tốc độ càng lớn thì xe cần quãng đường và thời gian xử lí dài hơn để dừng. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Tốc độ của phương tiện càng lớn thì quãng đường phanh thường\nA. càng dài\nB. càng ngắn\nC. không đổi\nD. bằng không Theo đáp án của ngân hàng: chọn A. càng dài. Tốc độ càng lớn thì xe cần quãng đường và thời gian xử lí dài hơn để dừng. Không cho rằng phanh tốt làm quãng đường phanh bằng không. Dạng 2. Giải thích khoảng cách an toàn Khoảng cách an toàn tạo đủ thời gian phản ứng và quãng đường phanh khi xe trước dừng. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao phải giữ khoảng cách an toàn với xe phía trước?\nA. Để tiết kiệm nhiên liệu\nB. Để nhìn biển số rõ hơn\nC. Để có đủ thời gian và quãng đường xử lí khi xe trước dừng\nD. Để tăng tốc dễ hơn Theo đáp án của ngân hàng: chọn C. Để có đủ thời gian và quãng đường xử lí khi xe trước dừng. Khoảng cách an toàn tạo đủ thời gian phản ứng và quãng đường phanh khi xe trước dừng. Không bám sát xe trước ngay cả khi đường vắng. Dạng 3. Xử lí khi điều kiện đường xấu Mưa, sương mù hoặc đường trơn cần giảm tốc và tăng khoảng cách. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một xe đang chạy 60 km/h gặp mưa lớn. Hành động phù hợp nhất là\nA. giảm tốc và tăng khoảng cách với xe trước\nB. giữ nguyên tốc độ\nC. tăng tốc vượt nhanh\nD. đi sát xe trước Theo đáp án của ngân hàng: chọn A. giảm tốc và tăng khoảng cách với xe trước. Mưa, sương mù hoặc đường trơn cần giảm tốc và tăng khoảng cách. Không giữ nguyên tốc độ giới hạn tối đa khi điều kiện thực tế không an toàn."},{"number":12,"title":"SÓNG ÂM","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"chu-de-12","summary":"Nguồn âm, sự truyền âm và môi trường truyền âm","intro":["Nguồn âm, sự truyền âm và môi trường truyền âm"],"forms":[{"title":"Dạng 1. Nhận biết nguồn âm","tip":"Nguồn âm là vật đang dao động và phát ra âm.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Nguồn âm là vật\nA. dao động và phát ra âm\nB. đứng yên hoàn toàn\nC. chỉ có nhiệt độ cao\nD. chỉ chuyển động thẳng","solution":"Theo đáp án của ngân hàng: chọn A. dao động và phát ra âm. Nguồn âm là vật đang dao động và phát ra âm.","trap":"Vật đứng yên không phải nguồn âm tại thời điểm xét.","extra":[]},{"title":"Dạng 2. Giải thích vai trò của thùng đàn","tip":"Thùng đàn cùng dao động, làm vùng không khí dao động mạnh hơn nên âm nghe rõ hơn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao khi gảy đàn, dây đàn rung còn thùng đàn giúp âm nghe rõ hơn?\nA. Thùng đàn làm dây ngừng rung\nB. Thùng đàn hấp thụ hết âm\nC. Thùng đàn cùng dao động và làm âm phát ra mạnh hơn\nD. Thùng đàn làm âm truyền trong chân không","solution":"Theo đáp án của ngân hàng: chọn C. Thùng đàn cùng dao động và làm âm phát ra mạnh hơn. Thùng đàn cùng dao động, làm vùng không khí dao động mạnh hơn nên âm nghe rõ hơn.","trap":"Không nói thùng đàn tạo ra tần số hoàn toàn khác dây đàn.","extra":[]},{"title":"Dạng 3. Chọn thí nghiệm chứng minh âm truyền qua chất rắn","tip":"Tạo nguồn rung ở một đầu vật rắn và nghe ở đầu kia để kiểm chứng sự truyền âm.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một học sinh muốn chứng minh âm truyền qua chất rắn. Thí nghiệm phù hợp nhất là\nA. áp tai vào bàn rồi nhờ bạn gõ ở đầu kia\nB. nhìn bóng đèn sáng\nC. đặt vật trong chân không\nD. đo nhiệt độ mặt bàn","solution":"Theo đáp án của ngân hàng: chọn A. áp tai vào bàn rồi nhờ bạn gõ ở đầu kia. Tạo nguồn rung ở một đầu vật rắn và nghe ở đầu kia để kiểm chứng sự truyền âm.","trap":"Cần loại trừ khả năng chỉ nghe âm truyền qua không khí.","extra":[]}],"searchText":"SÓNG ÂM Nguồn âm, sự truyền âm và môi trường truyền âm Dạng 1. Nhận biết nguồn âm Nguồn âm là vật đang dao động và phát ra âm. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Nguồn âm là vật\nA. dao động và phát ra âm\nB. đứng yên hoàn toàn\nC. chỉ có nhiệt độ cao\nD. chỉ chuyển động thẳng Theo đáp án của ngân hàng: chọn A. dao động và phát ra âm. Nguồn âm là vật đang dao động và phát ra âm. Vật đứng yên không phải nguồn âm tại thời điểm xét. Dạng 2. Giải thích vai trò của thùng đàn Thùng đàn cùng dao động, làm vùng không khí dao động mạnh hơn nên âm nghe rõ hơn. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao khi gảy đàn, dây đàn rung còn thùng đàn giúp âm nghe rõ hơn?\nA. Thùng đàn làm dây ngừng rung\nB. Thùng đàn hấp thụ hết âm\nC. Thùng đàn cùng dao động và làm âm phát ra mạnh hơn\nD. Thùng đàn làm âm truyền trong chân không Theo đáp án của ngân hàng: chọn C. Thùng đàn cùng dao động và làm âm phát ra mạnh hơn. Thùng đàn cùng dao động, làm vùng không khí dao động mạnh hơn nên âm nghe rõ hơn. Không nói thùng đàn tạo ra tần số hoàn toàn khác dây đàn. Dạng 3. Chọn thí nghiệm chứng minh âm truyền qua chất rắn Tạo nguồn rung ở một đầu vật rắn và nghe ở đầu kia để kiểm chứng sự truyền âm. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một học sinh muốn chứng minh âm truyền qua chất rắn. Thí nghiệm phù hợp nhất là\nA. áp tai vào bàn rồi nhờ bạn gõ ở đầu kia\nB. nhìn bóng đèn sáng\nC. đặt vật trong chân không\nD. đo nhiệt độ mặt bàn Theo đáp án của ngân hàng: chọn A. áp tai vào bàn rồi nhờ bạn gõ ở đầu kia. Tạo nguồn rung ở một đầu vật rắn và nghe ở đầu kia để kiểm chứng sự truyền âm. Cần loại trừ khả năng chỉ nghe âm truyền qua không khí."},{"number":13,"title":"ĐỘ TO VÀ ĐỘ CAO CỦA ÂM","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"chu-de-13","summary":"Độ cao, độ to của âm và tần số","intro":["Độ cao, độ to của âm và tần số"],"forms":[{"title":"Dạng 1. Liên hệ độ cao với tần số","tip":"Tần số càng lớn thì âm càng cao; tần số càng nhỏ thì âm càng trầm.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Độ cao của âm phụ thuộc chủ yếu vào\nA. tần số dao động của nguồn âm\nB. biên độ dao động\nC. khoảng cách đến nguồn âm\nD. môi trường truyền âm","solution":"Theo đáp án của ngân hàng: chọn A. tần số dao động của nguồn âm. Tần số càng lớn thì âm càng cao; tần số càng nhỏ thì âm càng trầm.","trap":"Không nhầm độ cao với độ to.","extra":[]},{"title":"Dạng 2. Liên hệ độ to với biên độ","tip":"Biên độ dao động lớn hơn làm âm nghe to hơn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Khi gõ mạnh hơn vào mặt trống, âm nghe to hơn vì\nA. tần số giảm\nB. mặt trống không dao động\nC. biên độ dao động của mặt trống tăng\nD. âm truyền nhanh hơn","solution":"Theo đáp án của ngân hàng: chọn C. biên độ dao động của mặt trống tăng. Biên độ dao động lớn hơn làm âm nghe to hơn.","trap":"Gõ mạnh không nhất thiết làm tần số tăng.","extra":[]},{"title":"Dạng 3. Tính tần số dao động","tip":"Tần số f bằng số dao động N chia thời gian t.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một nguồn âm dao động 600 lần trong 3 giây. Tần số của nguồn âm là\nA. 200 Hz\nB. 600 Hz\nC. 1800 Hz\nD. 20 Hz","solution":"Theo đáp án của ngân hàng: chọn A. 200 Hz. f = 600/3 = 200 Hz.","trap":"Đơn vị hertz tương ứng dao động trong một giây.","extra":[]}],"searchText":"ĐỘ TO VÀ ĐỘ CAO CỦA ÂM Độ cao, độ to của âm và tần số Dạng 1. Liên hệ độ cao với tần số Tần số càng lớn thì âm càng cao; tần số càng nhỏ thì âm càng trầm. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Độ cao của âm phụ thuộc chủ yếu vào\nA. tần số dao động của nguồn âm\nB. biên độ dao động\nC. khoảng cách đến nguồn âm\nD. môi trường truyền âm Theo đáp án của ngân hàng: chọn A. tần số dao động của nguồn âm. Tần số càng lớn thì âm càng cao; tần số càng nhỏ thì âm càng trầm. Không nhầm độ cao với độ to. Dạng 2. Liên hệ độ to với biên độ Biên độ dao động lớn hơn làm âm nghe to hơn. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Khi gõ mạnh hơn vào mặt trống, âm nghe to hơn vì\nA. tần số giảm\nB. mặt trống không dao động\nC. biên độ dao động của mặt trống tăng\nD. âm truyền nhanh hơn Theo đáp án của ngân hàng: chọn C. biên độ dao động của mặt trống tăng. Biên độ dao động lớn hơn làm âm nghe to hơn. Gõ mạnh không nhất thiết làm tần số tăng. Dạng 3. Tính tần số dao động Tần số f bằng số dao động N chia thời gian t. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một nguồn âm dao động 600 lần trong 3 giây. Tần số của nguồn âm là\nA. 200 Hz\nB. 600 Hz\nC. 1800 Hz\nD. 20 Hz Theo đáp án của ngân hàng: chọn A. 200 Hz. f = 600/3 = 200 Hz. Đơn vị hertz tương ứng dao động trong một giây."},{"number":14,"title":"PHẢN XẠ ÂM, CHỐNG Ô NHIỄM TIẾNG ỒN","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"chu-de-14","summary":"Phản xạ âm và chống ô nhiễm tiếng ồn","intro":["Phản xạ âm và chống ô nhiễm tiếng ồn"],"forms":[{"title":"Dạng 1. Nhận biết phản xạ âm","tip":"Âm gặp vật cản rồi truyền trở lại môi trường cũ là âm phản xạ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Hiện tượng âm gặp vật cản rồi truyền trở lại môi trường cũ gọi là\nA. phản xạ âm\nB. khúc xạ ánh sáng\nC. nhiễu xạ ánh sáng\nD. truyền nhiệt","solution":"Theo đáp án của ngân hàng: chọn A. phản xạ âm. Âm gặp vật cản rồi truyền trở lại môi trường cũ là âm phản xạ.","trap":"Không nhầm phản xạ âm với nguồn âm phát lần thứ hai.","extra":[]},{"title":"Dạng 2. Giải thích tiếng vang trong phòng trống","tip":"Bề mặt cứng, phẳng phản xạ âm mạnh; rèm và đồ mềm hấp thụ âm tốt hơn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Phòng trống thường nghe vang hơn phòng có nhiều rèm và đồ đạc vì\nA. phòng trống không có không khí\nB. đồ đạc làm nguồn âm ngừng dao động\nC. các bề mặt cứng trong phòng trống phản xạ âm mạnh hơn\nD. rèm làm âm truyền nhanh hơn","solution":"Theo đáp án của ngân hàng: chọn C. các bề mặt cứng trong phòng trống phản xạ âm mạnh hơn. Bề mặt cứng, phẳng phản xạ âm mạnh; rèm và đồ mềm hấp thụ âm tốt hơn.","trap":"Không coi mọi phòng lớn đều có tiếng vang như nhau.","extra":[]},{"title":"Dạng 3. Đề xuất biện pháp giảm tiếng ồn","tip":"Kết hợp ngăn truyền âm, hấp thụ âm và tăng khoảng cách với nguồn ồn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một lớp học gần đường lớn thường xuyên bị tiếng xe làm ảnh hưởng. Giải pháp phù hợp nhất là\nA. lắp cửa kính kín, dùng rèm dày và trồng cây xanh\nB. mở toàn bộ cửa sổ\nC. đặt thêm loa trong lớp\nD. tháo rèm cửa","solution":"Theo đáp án của ngân hàng: chọn A. lắp cửa kính kín, dùng rèm dày và trồng cây xanh. Kết hợp ngăn truyền âm, hấp thụ âm và tăng khoảng cách với nguồn ồn.","trap":"Chỉ đóng cửa mỏng thường chưa đủ với tiếng ồn giao thông mạnh.","extra":[]}],"searchText":"PHẢN XẠ ÂM, CHỐNG Ô NHIỄM TIẾNG ỒN Phản xạ âm và chống ô nhiễm tiếng ồn Dạng 1. Nhận biết phản xạ âm Âm gặp vật cản rồi truyền trở lại môi trường cũ là âm phản xạ. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Hiện tượng âm gặp vật cản rồi truyền trở lại môi trường cũ gọi là\nA. phản xạ âm\nB. khúc xạ ánh sáng\nC. nhiễu xạ ánh sáng\nD. truyền nhiệt Theo đáp án của ngân hàng: chọn A. phản xạ âm. Âm gặp vật cản rồi truyền trở lại môi trường cũ là âm phản xạ. Không nhầm phản xạ âm với nguồn âm phát lần thứ hai. Dạng 2. Giải thích tiếng vang trong phòng trống Bề mặt cứng, phẳng phản xạ âm mạnh; rèm và đồ mềm hấp thụ âm tốt hơn. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Phòng trống thường nghe vang hơn phòng có nhiều rèm và đồ đạc vì\nA. phòng trống không có không khí\nB. đồ đạc làm nguồn âm ngừng dao động\nC. các bề mặt cứng trong phòng trống phản xạ âm mạnh hơn\nD. rèm làm âm truyền nhanh hơn Theo đáp án của ngân hàng: chọn C. các bề mặt cứng trong phòng trống phản xạ âm mạnh hơn. Bề mặt cứng, phẳng phản xạ âm mạnh; rèm và đồ mềm hấp thụ âm tốt hơn. Không coi mọi phòng lớn đều có tiếng vang như nhau. Dạng 3. Đề xuất biện pháp giảm tiếng ồn Kết hợp ngăn truyền âm, hấp thụ âm và tăng khoảng cách với nguồn ồn. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một lớp học gần đường lớn thường xuyên bị tiếng xe làm ảnh hưởng. Giải pháp phù hợp nhất là\nA. lắp cửa kính kín, dùng rèm dày và trồng cây xanh\nB. mở toàn bộ cửa sổ\nC. đặt thêm loa trong lớp\nD. tháo rèm cửa Theo đáp án của ngân hàng: chọn A. lắp cửa kính kín, dùng rèm dày và trồng cây xanh. Kết hợp ngăn truyền âm, hấp thụ âm và tăng khoảng cách với nguồn ồn. Chỉ đóng cửa mỏng thường chưa đủ với tiếng ồn giao thông mạnh."},{"number":15,"title":"NĂNG LƯỢNG ÁNH SÁNG. TIA SÁNG, VÙNG TỐI","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"chu-de-15","summary":"Năng lượng ánh sáng, tia sáng và bóng tối","intro":["Năng lượng ánh sáng, tia sáng và bóng tối"],"forms":[{"title":"Dạng 1. Nhận biết nguồn sáng","tip":"Nguồn sáng là vật tự phát ra ánh sáng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Vật tự phát ra ánh sáng được gọi là\nA. nguồn sáng\nB. vật chắn sáng\nC. gương phẳng\nD. màn chắn","solution":"Theo đáp án của ngân hàng: chọn A. nguồn sáng. Nguồn sáng là vật tự phát ra ánh sáng.","trap":"Vật chỉ phản xạ ánh sáng không phải nguồn sáng.","extra":[]},{"title":"Dạng 2. Điều kiện nhìn thấy một vật","tip":"Ta nhìn thấy khi có ánh sáng từ vật truyền vào mắt.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Ta không nhìn thấy quyển sách trong phòng tối vì\nA. quyển sách biến mất\nB. mắt ngừng hoạt động hoàn toàn\nC. không có ánh sáng từ sách truyền vào mắt\nD. sách hấp thụ âm thanh","solution":"Theo đáp án của ngân hàng: chọn C. không có ánh sáng từ sách truyền vào mắt. Ta nhìn thấy khi có ánh sáng từ vật truyền vào mắt.","trap":"Mắt mở trong phòng tối chưa đủ để nhìn thấy vật.","extra":[]},{"title":"Dạng 3. Tạo bóng rõ nét","tip":"Nguồn sáng nhỏ, vật cản và màn chắn đặt phù hợp tạo ranh giới bóng rõ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Muốn tạo bóng của một vật rõ nét trên màn, cách phù hợp nhất là dùng\nA. nguồn sáng nhỏ, vật cản và màn chắn\nB. nguồn sáng lớn đặt rất gần màn\nC. một vật trong suốt hoàn toàn\nD. không cần nguồn sáng","solution":"Theo đáp án của ngân hàng: chọn A. nguồn sáng nhỏ, vật cản và màn chắn. Nguồn sáng nhỏ, vật cản và màn chắn đặt phù hợp tạo ranh giới bóng rõ.","trap":"Nguồn sáng quá rộng làm vùng nửa tối lớn, bóng kém nét.","extra":[]}],"searchText":"NĂNG LƯỢNG ÁNH SÁNG. TIA SÁNG, VÙNG TỐI Năng lượng ánh sáng, tia sáng và bóng tối Dạng 1. Nhận biết nguồn sáng Nguồn sáng là vật tự phát ra ánh sáng. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Vật tự phát ra ánh sáng được gọi là\nA. nguồn sáng\nB. vật chắn sáng\nC. gương phẳng\nD. màn chắn Theo đáp án của ngân hàng: chọn A. nguồn sáng. Nguồn sáng là vật tự phát ra ánh sáng. Vật chỉ phản xạ ánh sáng không phải nguồn sáng. Dạng 2. Điều kiện nhìn thấy một vật Ta nhìn thấy khi có ánh sáng từ vật truyền vào mắt. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Ta không nhìn thấy quyển sách trong phòng tối vì\nA. quyển sách biến mất\nB. mắt ngừng hoạt động hoàn toàn\nC. không có ánh sáng từ sách truyền vào mắt\nD. sách hấp thụ âm thanh Theo đáp án của ngân hàng: chọn C. không có ánh sáng từ sách truyền vào mắt. Ta nhìn thấy khi có ánh sáng từ vật truyền vào mắt. Mắt mở trong phòng tối chưa đủ để nhìn thấy vật. Dạng 3. Tạo bóng rõ nét Nguồn sáng nhỏ, vật cản và màn chắn đặt phù hợp tạo ranh giới bóng rõ. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Muốn tạo bóng của một vật rõ nét trên màn, cách phù hợp nhất là dùng\nA. nguồn sáng nhỏ, vật cản và màn chắn\nB. nguồn sáng lớn đặt rất gần màn\nC. một vật trong suốt hoàn toàn\nD. không cần nguồn sáng Theo đáp án của ngân hàng: chọn A. nguồn sáng nhỏ, vật cản và màn chắn. Nguồn sáng nhỏ, vật cản và màn chắn đặt phù hợp tạo ranh giới bóng rõ. Nguồn sáng quá rộng làm vùng nửa tối lớn, bóng kém nét."},{"number":16,"title":"SỰ PHẢN XẠ ÁNH SÁNG","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"chu-de-16","summary":"Định luật phản xạ ánh sáng","intro":["Định luật phản xạ ánh sáng"],"forms":[{"title":"Dạng 1. Nhận biết hiện tượng phản xạ ánh sáng","tip":"Tia sáng gặp mặt chắn và hắt trở lại môi trường cũ là phản xạ ánh sáng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Hiện tượng tia sáng gặp mặt chắn rồi bị hắt trở lại môi trường cũ gọi là\nA. phản xạ ánh sáng\nB. khúc xạ ánh sáng\nC. tán sắc ánh sáng\nD. truyền nhiệt","solution":"Theo đáp án của ngân hàng: chọn A. phản xạ ánh sáng. Tia sáng gặp mặt chắn và hắt trở lại môi trường cũ là phản xạ ánh sáng.","trap":"Không nhầm với khúc xạ sang môi trường khác.","extra":[]},{"title":"Dạng 2. Phân biệt phản xạ khuếch tán và phản xạ gương","tip":"Bề mặt không nhẵn phản xạ ánh sáng theo nhiều hướng nên nhìn thấy từ nhiều vị trí.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Ta nhìn thấy trang sách từ nhiều hướng vì bề mặt giấy\nA. phản xạ đều toàn bộ ánh sáng\nB. không phản xạ ánh sáng\nC. phản xạ khuếch tán ánh sáng\nD. tự phát ra ánh sáng","solution":"Theo đáp án của ngân hàng: chọn C. phản xạ khuếch tán ánh sáng. Bề mặt không nhẵn phản xạ ánh sáng theo nhiều hướng nên nhìn thấy từ nhiều vị trí.","trap":"Phản xạ khuếch tán vẫn tuân theo định luật phản xạ tại từng điểm.","extra":[]},{"title":"Dạng 3. Tính góc phản xạ","tip":"Theo định luật phản xạ: góc phản xạ bằng góc tới, đều đo với pháp tuyến.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một tia sáng tới gương phẳng với góc tới 40°. Góc giữa tia phản xạ và pháp tuyến là\nA. 40°\nB. 50°\nC. 80°\nD. 20°","solution":"Theo đáp án của ngân hàng: chọn A. 40°. i = 40° nên r = 40°.","trap":"Không đo góc với mặt gương.","extra":[]}],"searchText":"SỰ PHẢN XẠ ÁNH SÁNG Định luật phản xạ ánh sáng Dạng 1. Nhận biết hiện tượng phản xạ ánh sáng Tia sáng gặp mặt chắn và hắt trở lại môi trường cũ là phản xạ ánh sáng. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Hiện tượng tia sáng gặp mặt chắn rồi bị hắt trở lại môi trường cũ gọi là\nA. phản xạ ánh sáng\nB. khúc xạ ánh sáng\nC. tán sắc ánh sáng\nD. truyền nhiệt Theo đáp án của ngân hàng: chọn A. phản xạ ánh sáng. Tia sáng gặp mặt chắn và hắt trở lại môi trường cũ là phản xạ ánh sáng. Không nhầm với khúc xạ sang môi trường khác. Dạng 2. Phân biệt phản xạ khuếch tán và phản xạ gương Bề mặt không nhẵn phản xạ ánh sáng theo nhiều hướng nên nhìn thấy từ nhiều vị trí. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Ta nhìn thấy trang sách từ nhiều hướng vì bề mặt giấy\nA. phản xạ đều toàn bộ ánh sáng\nB. không phản xạ ánh sáng\nC. phản xạ khuếch tán ánh sáng\nD. tự phát ra ánh sáng Theo đáp án của ngân hàng: chọn C. phản xạ khuếch tán ánh sáng. Bề mặt không nhẵn phản xạ ánh sáng theo nhiều hướng nên nhìn thấy từ nhiều vị trí. Phản xạ khuếch tán vẫn tuân theo định luật phản xạ tại từng điểm. Dạng 3. Tính góc phản xạ Theo định luật phản xạ: góc phản xạ bằng góc tới, đều đo với pháp tuyến. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một tia sáng tới gương phẳng với góc tới 40°. Góc giữa tia phản xạ và pháp tuyến là\nA. 40°\nB. 50°\nC. 80°\nD. 20° Theo đáp án của ngân hàng: chọn A. 40°. i = 40° nên r = 40°. Không đo góc với mặt gương."},{"number":17,"title":"ẢNH CỦA VẬT QUA GƯƠNG PHẲNG","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"chu-de-17","summary":"Ảnh của vật qua gương phẳng","intro":["Ảnh của vật qua gương phẳng"],"forms":[{"title":"Dạng 1. Nhận biết tính chất ảnh","tip":"Gương phẳng cho ảnh ảo, cùng chiều, bằng vật và đối xứng qua mặt gương.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Ảnh của một vật tạo bởi gương phẳng là\nA. ảnh ảo\nB. ảnh thật\nC. nguồn sáng\nD. bóng tối","solution":"Theo đáp án của ngân hàng: chọn A. ảnh ảo. Gương phẳng cho ảnh ảo, cùng chiều, bằng vật và đối xứng qua mặt gương.","trap":"Ảnh ảo không hứng được trên màn.","extra":[]},{"title":"Dạng 2. Giải thích vị trí ảnh sau gương","tip":"Mắt kéo dài các tia phản xạ về phía sau gương và nhận thấy chúng gặp nhau tại ảnh.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Ta có cảm giác ảnh nằm sau gương vì\nA. ánh sáng truyền xuyên qua gương rồi quay lại\nB. gương phát ra ánh sáng từ phía sau\nC. mắt kéo dài các tia phản xạ về phía sau gương\nD. vật nằm sau gương","solution":"Theo đáp án của ngân hàng: chọn C. mắt kéo dài các tia phản xạ về phía sau gương. Mắt kéo dài các tia phản xạ về phía sau gương và nhận thấy chúng gặp nhau tại ảnh.","trap":"Không có tia sáng thật truyền từ ảnh ảo ra mắt.","extra":[]},{"title":"Dạng 3. Tính khoảng cách vật – ảnh","tip":"Khoảng cách ảnh đến gương bằng khoảng cách vật đến gương, nên vật–ảnh bằng hai lần khoảng cách đến gương.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một cây bút cách gương phẳng 30 cm. Khoảng cách từ cây bút đến ảnh của nó là\nA. 60 cm\nB. 30 cm\nC. 15 cm\nD. 90 cm","solution":"Theo đáp án của ngân hàng: chọn A. 60 cm. d(vật–ảnh) = 30 + 30 = 60 cm.","trap":"Không lấy khoảng cách vật đến gương làm khoảng cách vật đến ảnh.","extra":[]}],"searchText":"ẢNH CỦA VẬT QUA GƯƠNG PHẲNG Ảnh của vật qua gương phẳng Dạng 1. Nhận biết tính chất ảnh Gương phẳng cho ảnh ảo, cùng chiều, bằng vật và đối xứng qua mặt gương. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Ảnh của một vật tạo bởi gương phẳng là\nA. ảnh ảo\nB. ảnh thật\nC. nguồn sáng\nD. bóng tối Theo đáp án của ngân hàng: chọn A. ảnh ảo. Gương phẳng cho ảnh ảo, cùng chiều, bằng vật và đối xứng qua mặt gương. Ảnh ảo không hứng được trên màn. Dạng 2. Giải thích vị trí ảnh sau gương Mắt kéo dài các tia phản xạ về phía sau gương và nhận thấy chúng gặp nhau tại ảnh. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Ta có cảm giác ảnh nằm sau gương vì\nA. ánh sáng truyền xuyên qua gương rồi quay lại\nB. gương phát ra ánh sáng từ phía sau\nC. mắt kéo dài các tia phản xạ về phía sau gương\nD. vật nằm sau gương Theo đáp án của ngân hàng: chọn C. mắt kéo dài các tia phản xạ về phía sau gương. Mắt kéo dài các tia phản xạ về phía sau gương và nhận thấy chúng gặp nhau tại ảnh. Không có tia sáng thật truyền từ ảnh ảo ra mắt. Dạng 3. Tính khoảng cách vật – ảnh Khoảng cách ảnh đến gương bằng khoảng cách vật đến gương, nên vật–ảnh bằng hai lần khoảng cách đến gương. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một cây bút cách gương phẳng 30 cm. Khoảng cách từ cây bút đến ảnh của nó là\nA. 60 cm\nB. 30 cm\nC. 15 cm\nD. 90 cm Theo đáp án của ngân hàng: chọn A. 60 cm. d(vật–ảnh) = 30 + 30 = 60 cm. Không lấy khoảng cách vật đến gương làm khoảng cách vật đến ảnh."},{"number":18,"title":"NAM CHÂM","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"chu-de-18","summary":"Nam châm và tương tác giữa các cực từ","intro":["Nam châm và tương tác giữa các cực từ"],"forms":[{"title":"Dạng 1. Nhận biết đặc tính của nam châm","tip":"Nam châm hút các vật liệu sắt từ như sắt và thép, mạnh nhất ở hai cực.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Nam châm là vật có khả năng\nA. hút các vật bằng sắt, thép\nB. hút mọi vật\nC. phát sáng\nD. phát ra âm","solution":"Theo đáp án của ngân hàng: chọn A. hút các vật bằng sắt, thép. Nam châm hút các vật liệu sắt từ như sắt và thép, mạnh nhất ở hai cực.","trap":"Không kết luận nam châm hút mọi kim loại.","extra":[]},{"title":"Dạng 2. Giải thích mạt sắt tập trung ở hai đầu","tip":"Lực từ và từ trường mạnh nhất ở vùng gần các cực nam châm.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao mạt sắt tập trung nhiều ở hai đầu nam châm?\nA. Hai đầu nam châm nhẹ hơn\nB. Mạt sắt tự phát sáng\nC. Lực từ mạnh nhất ở các cực\nD. Giữa nam châm không có vật chất","solution":"Theo đáp án của ngân hàng: chọn C. Lực từ mạnh nhất ở các cực. Lực từ và từ trường mạnh nhất ở vùng gần các cực nam châm.","trap":"Không cho rằng giữa nam châm hoàn toàn không có từ trường.","extra":[]},{"title":"Dạng 3. Phân biệt thanh nam châm với thanh sắt","tip":"Kiểm tra lực hút tại giữa thanh: nam châm hút mạnh ở cực nhưng rất yếu ở giữa.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Có hai thanh giống nhau, một thanh là nam châm, một thanh là sắt. Cách đơn giản để nhận biết là\nA. đưa đầu một thanh lần lượt lại gần giữa và đầu thanh kia để kiểm tra lực hút\nB. cân khối lượng hai thanh\nC. đo chiều dài hai thanh\nD. nhúng cả hai vào nước","solution":"Theo đáp án của ngân hàng: chọn A. đưa đầu một thanh lần lượt lại gần giữa và đầu thanh kia để kiểm tra lực hút. Kiểm tra lực hút tại giữa thanh: nam châm hút mạnh ở cực nhưng rất yếu ở giữa.","trap":"Hai thanh đều có thể hút nhau ở đầu nên chỉ thử đầu–đầu chưa đủ.","extra":[]}],"searchText":"NAM CHÂM Nam châm và tương tác giữa các cực từ Dạng 1. Nhận biết đặc tính của nam châm Nam châm hút các vật liệu sắt từ như sắt và thép, mạnh nhất ở hai cực. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Nam châm là vật có khả năng\nA. hút các vật bằng sắt, thép\nB. hút mọi vật\nC. phát sáng\nD. phát ra âm Theo đáp án của ngân hàng: chọn A. hút các vật bằng sắt, thép. Nam châm hút các vật liệu sắt từ như sắt và thép, mạnh nhất ở hai cực. Không kết luận nam châm hút mọi kim loại. Dạng 2. Giải thích mạt sắt tập trung ở hai đầu Lực từ và từ trường mạnh nhất ở vùng gần các cực nam châm. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao mạt sắt tập trung nhiều ở hai đầu nam châm?\nA. Hai đầu nam châm nhẹ hơn\nB. Mạt sắt tự phát sáng\nC. Lực từ mạnh nhất ở các cực\nD. Giữa nam châm không có vật chất Theo đáp án của ngân hàng: chọn C. Lực từ mạnh nhất ở các cực. Lực từ và từ trường mạnh nhất ở vùng gần các cực nam châm. Không cho rằng giữa nam châm hoàn toàn không có từ trường. Dạng 3. Phân biệt thanh nam châm với thanh sắt Kiểm tra lực hút tại giữa thanh: nam châm hút mạnh ở cực nhưng rất yếu ở giữa. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Có hai thanh giống nhau, một thanh là nam châm, một thanh là sắt. Cách đơn giản để nhận biết là\nA. đưa đầu một thanh lần lượt lại gần giữa và đầu thanh kia để kiểm tra lực hút\nB. cân khối lượng hai thanh\nC. đo chiều dài hai thanh\nD. nhúng cả hai vào nước Theo đáp án của ngân hàng: chọn A. đưa đầu một thanh lần lượt lại gần giữa và đầu thanh kia để kiểm tra lực hút. Kiểm tra lực hút tại giữa thanh: nam châm hút mạnh ở cực nhưng rất yếu ở giữa. Hai thanh đều có thể hút nhau ở đầu nên chỉ thử đầu–đầu chưa đủ."},{"number":19,"title":"TỪ TRƯỜNG","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"chu-de-19","summary":"Từ trường và chiều của kim nam châm","intro":["Từ trường và chiều của kim nam châm"],"forms":[{"title":"Dạng 1. Nhận biết từ trường","tip":"Từ trường là vùng không gian quanh nam châm hoặc dòng điện có khả năng tác dụng lực từ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Không gian xung quanh nam châm, nơi có lực từ tác dụng, được gọi là\nA. từ trường\nB. điện trường\nC. trọng trường\nD. chân không","solution":"Theo đáp án của ngân hàng: chọn A. từ trường. Từ trường là vùng không gian quanh nam châm hoặc dòng điện có khả năng tác dụng lực từ.","trap":"Không thể kết luận không có từ trường chỉ vì mắt không nhìn thấy.","extra":[]},{"title":"Dạng 2. Đánh giá độ mạnh của từ trường","tip":"Nơi mạt sắt hoặc đường sức từ dày hơn biểu thị từ trường mạnh hơn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao mạt sắt tập trung dày hơn gần hai cực nam châm?\nA. Hai cực có nhiệt độ cao hơn\nB. Mạt sắt nặng hơn ở hai đầu\nC. Từ trường gần hai cực mạnh hơn\nD. Giữa nam châm không có vật chất","solution":"Theo đáp án của ngân hàng: chọn C. Từ trường gần hai cực mạnh hơn. Nơi mạt sắt hoặc đường sức từ dày hơn biểu thị từ trường mạnh hơn.","trap":"Mật độ đường sức là cách biểu diễn, không phải các sợi vật chất thật.","extra":[]},{"title":"Dạng 3. Dự đoán hướng quay của kim nam châm","tip":"Cực cùng tên đẩy nhau, khác tên hút nhau; đầu Bắc của kim bị cực Bắc gần đó đẩy ra.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một kim nam châm nhỏ đặt gần cực Bắc của nam châm thẳng. Đầu Bắc của kim có xu hướng\nA. quay ra xa cực Bắc\nB. quay về phía cực Bắc\nC. không đổi hướng\nD. nằm vuông góc mọi lúc","solution":"Theo đáp án của ngân hàng: chọn A. quay ra xa cực Bắc. Cực cùng tên đẩy nhau, khác tên hút nhau; đầu Bắc của kim bị cực Bắc gần đó đẩy ra.","trap":"Phải xác định rõ đầu Bắc và đầu Nam của kim.","extra":[]}],"searchText":"TỪ TRƯỜNG Từ trường và chiều của kim nam châm Dạng 1. Nhận biết từ trường Từ trường là vùng không gian quanh nam châm hoặc dòng điện có khả năng tác dụng lực từ. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Không gian xung quanh nam châm, nơi có lực từ tác dụng, được gọi là\nA. từ trường\nB. điện trường\nC. trọng trường\nD. chân không Theo đáp án của ngân hàng: chọn A. từ trường. Từ trường là vùng không gian quanh nam châm hoặc dòng điện có khả năng tác dụng lực từ. Không thể kết luận không có từ trường chỉ vì mắt không nhìn thấy. Dạng 2. Đánh giá độ mạnh của từ trường Nơi mạt sắt hoặc đường sức từ dày hơn biểu thị từ trường mạnh hơn. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao mạt sắt tập trung dày hơn gần hai cực nam châm?\nA. Hai cực có nhiệt độ cao hơn\nB. Mạt sắt nặng hơn ở hai đầu\nC. Từ trường gần hai cực mạnh hơn\nD. Giữa nam châm không có vật chất Theo đáp án của ngân hàng: chọn C. Từ trường gần hai cực mạnh hơn. Nơi mạt sắt hoặc đường sức từ dày hơn biểu thị từ trường mạnh hơn. Mật độ đường sức là cách biểu diễn, không phải các sợi vật chất thật. Dạng 3. Dự đoán hướng quay của kim nam châm Cực cùng tên đẩy nhau, khác tên hút nhau; đầu Bắc của kim bị cực Bắc gần đó đẩy ra. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một kim nam châm nhỏ đặt gần cực Bắc của nam châm thẳng. Đầu Bắc của kim có xu hướng\nA. quay ra xa cực Bắc\nB. quay về phía cực Bắc\nC. không đổi hướng\nD. nằm vuông góc mọi lúc Theo đáp án của ngân hàng: chọn A. quay ra xa cực Bắc. Cực cùng tên đẩy nhau, khác tên hút nhau; đầu Bắc của kim bị cực Bắc gần đó đẩy ra. Phải xác định rõ đầu Bắc và đầu Nam của kim."},{"number":20,"title":"CHẾ TẠO NAM CHÂM ĐIỆN ĐƠN GIẢN","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"chu-de-20","summary":"Nam châm điện và cách tăng lực từ","intro":["Nam châm điện và cách tăng lực từ"],"forms":[{"title":"Dạng 1. Nhận biết cấu tạo nam châm điện","tip":"Nam châm điện gồm cuộn dây có dòng điện và thường có lõi sắt.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Nam châm điện được tạo thành chủ yếu từ\nA. cuộn dây dẫn có dòng điện chạy qua và lõi sắt\nB. một thanh nhựa và một bóng đèn\nC. một tấm kính và dây cao su\nD. một cốc nước và pin","solution":"Theo đáp án của ngân hàng: chọn A. cuộn dây dẫn có dòng điện chạy qua và lõi sắt. Nam châm điện gồm cuộn dây có dòng điện và thường có lõi sắt.","trap":"Cuộn dây không có dòng điện không tạo nam châm điện hoạt động.","extra":[]},{"title":"Dạng 2. Giải thích vai trò của lõi sắt","tip":"Lõi sắt bị từ hóa, làm từ trường của cuộn dây mạnh lên.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao lõi sắt làm nam châm điện mạnh hơn cuộn dây không lõi?\nA. Lõi sắt làm giảm số vòng dây\nB. Lõi sắt làm ngắt dòng điện\nC. Lõi sắt bị từ hóa và tăng cường từ trường của cuộn dây\nD. Lõi sắt làm pin nhẹ hơn","solution":"Theo đáp án của ngân hàng: chọn C. Lõi sắt bị từ hóa và tăng cường từ trường của cuộn dây. Lõi sắt bị từ hóa, làm từ trường của cuộn dây mạnh lên.","trap":"Không dùng lõi vật liệu bất kì và mong lực từ tăng như nhau.","extra":[]},{"title":"Dạng 3. Tăng lực hút của nam châm điện","tip":"Tăng số vòng dây, tăng dòng điện trong giới hạn an toàn và dùng lõi sắt phù hợp.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một mô hình nam châm điện hút quá ít kẹp giấy. Cách cải thiện phù hợp nhất là\nA. tăng số vòng dây và dùng lõi sắt\nB. thay lõi sắt bằng nhựa\nC. ngắt nguồn điện\nD. giảm số vòng dây","solution":"Theo đáp án của ngân hàng: chọn A. tăng số vòng dây và dùng lõi sắt. Tăng số vòng dây, tăng dòng điện trong giới hạn an toàn và dùng lõi sắt phù hợp.","trap":"Không tăng điện áp quá mức vì dây có thể nóng hoặc cháy.","extra":[]}],"searchText":"CHẾ TẠO NAM CHÂM ĐIỆN ĐƠN GIẢN Nam châm điện và cách tăng lực từ Dạng 1. Nhận biết cấu tạo nam châm điện Nam châm điện gồm cuộn dây có dòng điện và thường có lõi sắt. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Nam châm điện được tạo thành chủ yếu từ\nA. cuộn dây dẫn có dòng điện chạy qua và lõi sắt\nB. một thanh nhựa và một bóng đèn\nC. một tấm kính và dây cao su\nD. một cốc nước và pin Theo đáp án của ngân hàng: chọn A. cuộn dây dẫn có dòng điện chạy qua và lõi sắt. Nam châm điện gồm cuộn dây có dòng điện và thường có lõi sắt. Cuộn dây không có dòng điện không tạo nam châm điện hoạt động. Dạng 2. Giải thích vai trò của lõi sắt Lõi sắt bị từ hóa, làm từ trường của cuộn dây mạnh lên. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao lõi sắt làm nam châm điện mạnh hơn cuộn dây không lõi?\nA. Lõi sắt làm giảm số vòng dây\nB. Lõi sắt làm ngắt dòng điện\nC. Lõi sắt bị từ hóa và tăng cường từ trường của cuộn dây\nD. Lõi sắt làm pin nhẹ hơn Theo đáp án của ngân hàng: chọn C. Lõi sắt bị từ hóa và tăng cường từ trường của cuộn dây. Lõi sắt bị từ hóa, làm từ trường của cuộn dây mạnh lên. Không dùng lõi vật liệu bất kì và mong lực từ tăng như nhau. Dạng 3. Tăng lực hút của nam châm điện Tăng số vòng dây, tăng dòng điện trong giới hạn an toàn và dùng lõi sắt phù hợp. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một mô hình nam châm điện hút quá ít kẹp giấy. Cách cải thiện phù hợp nhất là\nA. tăng số vòng dây và dùng lõi sắt\nB. thay lõi sắt bằng nhựa\nC. ngắt nguồn điện\nD. giảm số vòng dây Theo đáp án của ngân hàng: chọn A. tăng số vòng dây và dùng lõi sắt. Tăng số vòng dây, tăng dòng điện trong giới hạn an toàn và dùng lõi sắt phù hợp. Không tăng điện áp quá mức vì dây có thể nóng hoặc cháy."},{"number":21,"title":"KHÁI QUÁT VỀ TRAO ĐỔI CHẤT VÀ CHUYỂN HÓA NĂNG LƯỢNG","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"chu-de-21","summary":"Trao đổi chất và chuyển hóa năng lượng","intro":["Trao đổi chất và chuyển hóa năng lượng"],"forms":[{"title":"Dạng 1. Nhận biết trao đổi chất","tip":"Sinh vật lấy chất từ môi trường, biến đổi để sử dụng và thải sản phẩm ra ngoài.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Trao đổi chất ở sinh vật là quá trình cơ thể\nA. lấy các chất từ môi trường, biến đổi và thải chất ra ngoài\nB. chỉ lấy oxygen\nC. chỉ thải chất cặn bã\nD. chỉ hấp thụ ánh sáng","solution":"Theo đáp án của ngân hàng: chọn A. lấy các chất từ môi trường, biến đổi và thải chất ra ngoài. Sinh vật lấy chất từ môi trường, biến đổi để sử dụng và thải sản phẩm ra ngoài.","trap":"Không chỉ tính quá trình thu nhận mà bỏ quá trình thải.","extra":[]},{"title":"Dạng 2. Giải thích mối liên hệ vật chất – năng lượng","tip":"Các phản ứng biến đổi vật chất luôn gắn với thu nhận, tích lũy hoặc giải phóng năng lượng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao trao đổi chất và chuyển hóa năng lượng luôn gắn liền với nhau?\nA. Vì mọi chất đều là năng lượng\nB. Vì sinh vật chỉ cần vật chất\nC. Vì biến đổi vật chất thường kèm theo thu nhận, tích lũy hoặc giải phóng năng lượng\nD. Vì năng lượng không liên quan đến hoạt động sống","solution":"Theo đáp án của ngân hàng: chọn C. Vì biến đổi vật chất thường kèm theo thu nhận, tích lũy hoặc giải phóng năng lượng. Các phản ứng biến đổi vật chất luôn gắn với thu nhận, tích lũy hoặc giải phóng năng lượng.","trap":"Không tách hoàn toàn trao đổi chất khỏi chuyển hóa năng lượng.","extra":[]},{"title":"Dạng 3. Vận dụng vào cây thiếu ánh sáng","tip":"Thiếu ánh sáng kéo dài làm quang hợp giảm, cây thiếu chất hữu cơ và năng lượng dự trữ.","example":"Đề bài tham khảo từ ngân hàng:\
