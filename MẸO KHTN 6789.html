p giảm, cây thiếu chất hữu cơ và năng lượng dự trữ. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một cây được đặt lâu ngày trong tối nhưng vẫn được tưới đủ nước. Hiện tượng phù hợp nhất là\nA. cây yếu dần do không quang hợp tạo đủ chất hữu cơ\nB. cây sinh trưởng nhanh hơn\nC. cây không cần hô hấp\nD. cây tạo nhiều oxygen hơn Theo đáp án của ngân hàng: chọn A. cây yếu dần do không quang hợp tạo đủ chất hữu cơ. Thiếu ánh sáng kéo dài làm quang hợp giảm, cây thiếu chất hữu cơ và năng lượng dự trữ. Tưới đủ nước không bù được thiếu ánh sáng."},{"number":22,"title":"QUANG HỢP Ở THỰC VẬT","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"chu-de-22","summary":"Quang hợp và vai trò của lá","intro":["Quang hợp và vai trò của lá"],"forms":[{"title":"Dạng 1. Nhận biết bản chất quang hợp","tip":"Thực vật dùng năng lượng ánh sáng để tổng hợp chất hữu cơ từ carbon dioxide và nước.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Quang hợp là quá trình thực vật sử dụng năng lượng ánh sáng để\nA. tổng hợp chất hữu cơ từ carbon dioxide và nước\nB. phân giải chất hữu cơ\nC. hấp thụ oxygen và thải carbon dioxide\nD. hấp thụ muối khoáng từ đất","solution":"Theo đáp án của ngân hàng: chọn A. tổng hợp chất hữu cơ từ carbon dioxide và nước. Thực vật dùng năng lượng ánh sáng để tổng hợp chất hữu cơ từ carbon dioxide và nước.","trap":"Không chọn hô hấp hoặc phân giải chất hữu cơ.","extra":[]},{"title":"Dạng 2. Giải thích đặc điểm lá phù hợp quang hợp","tip":"Lá rộng giúp thu ánh sáng; lá mỏng và có khí khổng giúp trao đổi khí thuận lợi.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao lá thường có bản rộng và mỏng?\nA. Để tăng khối lượng cây\nB. Để giảm hoàn toàn thoát hơi nước\nC. Để thu nhận ánh sáng và trao đổi khí thuận lợi\nD. Để chứa nhiều đất","solution":"Theo đáp án của ngân hàng: chọn C. Để thu nhận ánh sáng và trao đổi khí thuận lợi. Lá rộng giúp thu ánh sáng; lá mỏng và có khí khổng giúp trao đổi khí thuận lợi.","trap":"Không quy toàn bộ quang hợp chỉ cho kích thước lá.","extra":[]},{"title":"Dạng 3. Xác định yếu tố giới hạn quang hợp","tip":"Dù có ánh sáng, thiếu carbon dioxide vẫn làm tốc độ quang hợp giảm.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một chậu cây được đặt trong hộp kín, có ánh sáng nhưng không bổ sung carbon dioxide. Sau một thời gian, quang hợp giảm chủ yếu vì\nA. thiếu carbon dioxide\nB. thiếu oxygen\nC. thiếu nhiệt hoàn toàn\nD. thừa glucose","solution":"Theo đáp án của ngân hàng: chọn A. thiếu carbon dioxide. Dù có ánh sáng, thiếu carbon dioxide vẫn làm tốc độ quang hợp giảm.","trap":"Không cho rằng ánh sáng là yếu tố duy nhất.","extra":[]}],"searchText":"QUANG HỢP Ở THỰC VẬT Quang hợp và vai trò của lá Dạng 1. Nhận biết bản chất quang hợp Thực vật dùng năng lượng ánh sáng để tổng hợp chất hữu cơ từ carbon dioxide và nước. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Quang hợp là quá trình thực vật sử dụng năng lượng ánh sáng để\nA. tổng hợp chất hữu cơ từ carbon dioxide và nước\nB. phân giải chất hữu cơ\nC. hấp thụ oxygen và thải carbon dioxide\nD. hấp thụ muối khoáng từ đất Theo đáp án của ngân hàng: chọn A. tổng hợp chất hữu cơ từ carbon dioxide và nước. Thực vật dùng năng lượng ánh sáng để tổng hợp chất hữu cơ từ carbon dioxide và nước. Không chọn hô hấp hoặc phân giải chất hữu cơ. Dạng 2. Giải thích đặc điểm lá phù hợp quang hợp Lá rộng giúp thu ánh sáng; lá mỏng và có khí khổng giúp trao đổi khí thuận lợi. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao lá thường có bản rộng và mỏng?\nA. Để tăng khối lượng cây\nB. Để giảm hoàn toàn thoát hơi nước\nC. Để thu nhận ánh sáng và trao đổi khí thuận lợi\nD. Để chứa nhiều đất Theo đáp án của ngân hàng: chọn C. Để thu nhận ánh sáng và trao đổi khí thuận lợi. Lá rộng giúp thu ánh sáng; lá mỏng và có khí khổng giúp trao đổi khí thuận lợi. Không quy toàn bộ quang hợp chỉ cho kích thước lá. Dạng 3. Xác định yếu tố giới hạn quang hợp Dù có ánh sáng, thiếu carbon dioxide vẫn làm tốc độ quang hợp giảm. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một chậu cây được đặt trong hộp kín, có ánh sáng nhưng không bổ sung carbon dioxide. Sau một thời gian, quang hợp giảm chủ yếu vì\nA. thiếu carbon dioxide\nB. thiếu oxygen\nC. thiếu nhiệt hoàn toàn\nD. thừa glucose Theo đáp án của ngân hàng: chọn A. thiếu carbon dioxide. Dù có ánh sáng, thiếu carbon dioxide vẫn làm tốc độ quang hợp giảm. Không cho rằng ánh sáng là yếu tố duy nhất."},{"number":23,"title":"MỘT SỐ YẾU TỐ ẢNH HƯỞNG ĐẾN QUANG HỢP","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"chu-de-23","summary":"Các yếu tố ảnh hưởng đến quang hợp","intro":["Các yếu tố ảnh hưởng đến quang hợp"],"forms":[{"title":"Dạng 1. Nhận biết yếu tố ảnh hưởng trực tiếp","tip":"Ánh sáng, carbon dioxide, nước, nhiệt độ và dinh dưỡng đều có thể ảnh hưởng quang hợp.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Yếu tố nào sau đây ảnh hưởng trực tiếp đến cường độ quang hợp?\nA. Ánh sáng\nB. Âm thanh\nC. Từ trường\nD. Khối lượng của chậu","solution":"Theo đáp án của ngân hàng: chọn A. Ánh sáng. Ánh sáng, carbon dioxide, nước, nhiệt độ và dinh dưỡng đều có thể ảnh hưởng quang hợp.","trap":"Không chỉ học thuộc một yếu tố duy nhất.","extra":[]},{"title":"Dạng 2. Giải thích quy luật yếu tố giới hạn","tip":"Khi một yếu tố đã đủ, yếu tố khác trở thành giới hạn nên cường độ quang hợp không tăng mãi.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao cường độ quang hợp không tăng mãi khi tăng cường độ ánh sáng?\nA. Cây không cần ánh sáng\nB. Ánh sáng luôn phá hủy lá\nC. Đến một mức nhất định, các yếu tố khác trở thành yếu tố giới hạn\nD. Carbon dioxide tự biến mất hoàn toàn","solution":"Theo đáp án của ngân hàng: chọn C. Đến một mức nhất định, các yếu tố khác trở thành yếu tố giới hạn. Khi một yếu tố đã đủ, yếu tố khác trở thành giới hạn nên cường độ quang hợp không tăng mãi.","trap":"Không kéo dài đường tăng tuyến tính vô hạn.","extra":[]},{"title":"Dạng 3. Vận dụng mật độ trồng","tip":"Trồng quá dày làm lá che nhau; tỉa cây giúp tăng ánh sáng và thông thoáng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một ruộng rau được trồng quá dày, lá các cây che kín nhau. Biện pháp phù hợp nhất là\nA. Tỉa bớt cây để tăng khả năng nhận ánh sáng\nB. Che thêm lưới tối hoàn toàn\nC. Ngừng tưới nước\nD. Bịt kín khí khổng","solution":"Theo đáp án của ngân hàng: chọn A. Tỉa bớt cây để tăng khả năng nhận ánh sáng. Trồng quá dày làm lá che nhau; tỉa cây giúp tăng ánh sáng và thông thoáng.","trap":"Không tăng phân bón để thay thế hoàn toàn thiếu ánh sáng.","extra":[]}],"searchText":"MỘT SỐ YẾU TỐ ẢNH HƯỞNG ĐẾN QUANG HỢP Các yếu tố ảnh hưởng đến quang hợp Dạng 1. Nhận biết yếu tố ảnh hưởng trực tiếp Ánh sáng, carbon dioxide, nước, nhiệt độ và dinh dưỡng đều có thể ảnh hưởng quang hợp. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Yếu tố nào sau đây ảnh hưởng trực tiếp đến cường độ quang hợp?\nA. Ánh sáng\nB. Âm thanh\nC. Từ trường\nD. Khối lượng của chậu Theo đáp án của ngân hàng: chọn A. Ánh sáng. Ánh sáng, carbon dioxide, nước, nhiệt độ và dinh dưỡng đều có thể ảnh hưởng quang hợp. Không chỉ học thuộc một yếu tố duy nhất. Dạng 2. Giải thích quy luật yếu tố giới hạn Khi một yếu tố đã đủ, yếu tố khác trở thành giới hạn nên cường độ quang hợp không tăng mãi. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao cường độ quang hợp không tăng mãi khi tăng cường độ ánh sáng?\nA. Cây không cần ánh sáng\nB. Ánh sáng luôn phá hủy lá\nC. Đến một mức nhất định, các yếu tố khác trở thành yếu tố giới hạn\nD. Carbon dioxide tự biến mất hoàn toàn Theo đáp án của ngân hàng: chọn C. Đến một mức nhất định, các yếu tố khác trở thành yếu tố giới hạn. Khi một yếu tố đã đủ, yếu tố khác trở thành giới hạn nên cường độ quang hợp không tăng mãi. Không kéo dài đường tăng tuyến tính vô hạn. Dạng 3. Vận dụng mật độ trồng Trồng quá dày làm lá che nhau; tỉa cây giúp tăng ánh sáng và thông thoáng. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một ruộng rau được trồng quá dày, lá các cây che kín nhau. Biện pháp phù hợp nhất là\nA. Tỉa bớt cây để tăng khả năng nhận ánh sáng\nB. Che thêm lưới tối hoàn toàn\nC. Ngừng tưới nước\nD. Bịt kín khí khổng Theo đáp án của ngân hàng: chọn A. Tỉa bớt cây để tăng khả năng nhận ánh sáng. Trồng quá dày làm lá che nhau; tỉa cây giúp tăng ánh sáng và thông thoáng. Không tăng phân bón để thay thế hoàn toàn thiếu ánh sáng."},{"number":24,"title":"THỰC HÀNH: CHỨNG MINH QUANG HỢP Ở CÂY XANH","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"chu-de-24","summary":"Thực hành chứng minh quang hợp","intro":["Thực hành chứng minh quang hợp"],"forms":[{"title":"Dạng 1. Xác định sản phẩm khí trong thí nghiệm rong","tip":"Bọt khí xuất hiện khi rong quang hợp là oxygen.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Mục đích của thí nghiệm dùng rong đuôi chó dưới ánh sáng là chứng minh quang hợp\nA. tạo ra oxygen\nB. tiêu thụ hết nước\nC. tạo ra muối khoáng\nD. làm tăng nhiệt độ","solution":"Theo đáp án của ngân hàng: chọn A. tạo ra oxygen. Bọt khí xuất hiện khi rong quang hợp là oxygen.","trap":"Không kết luận khí là carbon dioxide.","extra":[]},{"title":"Dạng 2. Xác định vai trò của mẫu đối chứng","tip":"Mẫu sáng và mẫu tối giúp tách ảnh hưởng của ánh sáng đến sự tạo khí.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao phải đặt một cốc rong ở chỗ tối và một cốc ở chỗ sáng?\nA. Để hai cốc có nhiệt độ hoàn toàn khác nhau\nB. Để cốc tối tạo nhiều oxygen hơn\nC. Để so sánh sự tạo khí khi có và không có ánh sáng\nD. Để rong ở cốc sáng ngừng hô hấp","solution":"Theo đáp án của ngân hàng: chọn C. Để so sánh sự tạo khí khi có và không có ánh sáng. Mẫu sáng và mẫu tối giúp tách ảnh hưởng của ánh sáng đến sự tạo khí.","trap":"Hai mẫu phải giống nhau ở các điều kiện khác.","extra":[]},{"title":"Dạng 3. Xử lí khi thí nghiệm không thu được khí","tip":"Kiểm tra cường độ sáng, sức sống của rong, nhiệt độ và cách bố trí dụng cụ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Thí nghiệm rong đuôi chó không thu được khí dù đặt ngoài sáng. Nguyên nhân hợp lí nhất là\nA. cường độ sáng quá yếu hoặc cành rong không còn hoạt động tốt\nB. ống nghiệm có đầy nước\nC. rong được đặt dưới phễu\nD. cốc có nước sạch","solution":"Theo đáp án của ngân hàng: chọn A. cường độ sáng quá yếu hoặc cành rong không còn hoạt động tốt. Kiểm tra cường độ sáng, sức sống của rong, nhiệt độ và cách bố trí dụng cụ.","trap":"Không kết luận quang hợp không tạo oxygen chỉ từ một lần thất bại.","extra":[]}],"searchText":"THỰC HÀNH: CHỨNG MINH QUANG HỢP Ở CÂY XANH Thực hành chứng minh quang hợp Dạng 1. Xác định sản phẩm khí trong thí nghiệm rong Bọt khí xuất hiện khi rong quang hợp là oxygen. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Mục đích của thí nghiệm dùng rong đuôi chó dưới ánh sáng là chứng minh quang hợp\nA. tạo ra oxygen\nB. tiêu thụ hết nước\nC. tạo ra muối khoáng\nD. làm tăng nhiệt độ Theo đáp án của ngân hàng: chọn A. tạo ra oxygen. Bọt khí xuất hiện khi rong quang hợp là oxygen. Không kết luận khí là carbon dioxide. Dạng 2. Xác định vai trò của mẫu đối chứng Mẫu sáng và mẫu tối giúp tách ảnh hưởng của ánh sáng đến sự tạo khí. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao phải đặt một cốc rong ở chỗ tối và một cốc ở chỗ sáng?\nA. Để hai cốc có nhiệt độ hoàn toàn khác nhau\nB. Để cốc tối tạo nhiều oxygen hơn\nC. Để so sánh sự tạo khí khi có và không có ánh sáng\nD. Để rong ở cốc sáng ngừng hô hấp Theo đáp án của ngân hàng: chọn C. Để so sánh sự tạo khí khi có và không có ánh sáng. Mẫu sáng và mẫu tối giúp tách ảnh hưởng của ánh sáng đến sự tạo khí. Hai mẫu phải giống nhau ở các điều kiện khác. Dạng 3. Xử lí khi thí nghiệm không thu được khí Kiểm tra cường độ sáng, sức sống của rong, nhiệt độ và cách bố trí dụng cụ. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Thí nghiệm rong đuôi chó không thu được khí dù đặt ngoài sáng. Nguyên nhân hợp lí nhất là\nA. cường độ sáng quá yếu hoặc cành rong không còn hoạt động tốt\nB. ống nghiệm có đầy nước\nC. rong được đặt dưới phễu\nD. cốc có nước sạch Theo đáp án của ngân hàng: chọn A. cường độ sáng quá yếu hoặc cành rong không còn hoạt động tốt. Kiểm tra cường độ sáng, sức sống của rong, nhiệt độ và cách bố trí dụng cụ. Không kết luận quang hợp không tạo oxygen chỉ từ một lần thất bại."},{"number":25,"title":"HÔ HẤP TẾ BÀO","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"chu-de-25","summary":"Hô hấp tế bào và giải phóng năng lượng","intro":["Hô hấp tế bào và giải phóng năng lượng"],"forms":[{"title":"Dạng 1. Nhận biết hô hấp tế bào","tip":"Hô hấp tế bào phân giải chất hữu cơ, giải phóng năng lượng cho hoạt động sống.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Hô hấp tế bào là quá trình\nA. phân giải chất hữu cơ để giải phóng năng lượng\nB. tổng hợp chất hữu cơ từ carbon dioxide và nước\nC. hấp thụ muối khoáng từ đất\nD. vận chuyển nước trong cây","solution":"Theo đáp án của ngân hàng: chọn A. phân giải chất hữu cơ để giải phóng năng lượng. Hô hấp tế bào phân giải chất hữu cơ, giải phóng năng lượng cho hoạt động sống.","trap":"Không nhầm với trao đổi khí chỉ là lấy và thải khí.","extra":[]},{"title":"Dạng 2. Giải thích nhịp thở tăng khi vận động","tip":"Tế bào cơ cần nhiều oxygen và năng lượng hơn, đồng thời tạo nhiều carbon dioxide.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao khi vận động mạnh, nhịp thở tăng?\nA. Cơ thể cần ít oxygen hơn\nB. Tế bào ngừng hô hấp\nC. Tế bào cần nhiều oxygen để hô hấp và giải phóng thêm năng lượng\nD. Carbon dioxide không được tạo ra","solution":"Theo đáp án của ngân hàng: chọn C. Tế bào cần nhiều oxygen để hô hấp và giải phóng thêm năng lượng. Tế bào cơ cần nhiều oxygen và năng lượng hơn, đồng thời tạo nhiều carbon dioxide.","trap":"Nhịp thở tăng không chỉ để làm mát cơ thể.","extra":[]},{"title":"Dạng 3. Nhận biết carbon dioxide bằng nước vôi trong","tip":"Carbon dioxide làm nước vôi trong vẩn đục, chứng minh hạt nảy mầm thải CO₂.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một bình kín chứa hạt nảy mầm làm nước vôi trong bị vẩn đục. Điều này chứng tỏ hạt\nA. thải carbon dioxide khi hô hấp\nB. thải oxygen khi hô hấp\nC. không hô hấp\nD. hấp thụ carbon dioxide","solution":"Theo đáp án của ngân hàng: chọn A. thải carbon dioxide khi hô hấp. Carbon dioxide làm nước vôi trong vẩn đục, chứng minh hạt nảy mầm thải CO₂.","trap":"Phải có mẫu đối chứng và bình kín để kết luận đáng tin cậy.","extra":[]}],"searchText":"HÔ HẤP TẾ BÀO Hô hấp tế bào và giải phóng năng lượng Dạng 1. Nhận biết hô hấp tế bào Hô hấp tế bào phân giải chất hữu cơ, giải phóng năng lượng cho hoạt động sống. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Hô hấp tế bào là quá trình\nA. phân giải chất hữu cơ để giải phóng năng lượng\nB. tổng hợp chất hữu cơ từ carbon dioxide và nước\nC. hấp thụ muối khoáng từ đất\nD. vận chuyển nước trong cây Theo đáp án của ngân hàng: chọn A. phân giải chất hữu cơ để giải phóng năng lượng. Hô hấp tế bào phân giải chất hữu cơ, giải phóng năng lượng cho hoạt động sống. Không nhầm với trao đổi khí chỉ là lấy và thải khí. Dạng 2. Giải thích nhịp thở tăng khi vận động Tế bào cơ cần nhiều oxygen và năng lượng hơn, đồng thời tạo nhiều carbon dioxide. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao khi vận động mạnh, nhịp thở tăng?\nA. Cơ thể cần ít oxygen hơn\nB. Tế bào ngừng hô hấp\nC. Tế bào cần nhiều oxygen để hô hấp và giải phóng thêm năng lượng\nD. Carbon dioxide không được tạo ra Theo đáp án của ngân hàng: chọn C. Tế bào cần nhiều oxygen để hô hấp và giải phóng thêm năng lượng. Tế bào cơ cần nhiều oxygen và năng lượng hơn, đồng thời tạo nhiều carbon dioxide. Nhịp thở tăng không chỉ để làm mát cơ thể. Dạng 3. Nhận biết carbon dioxide bằng nước vôi trong Carbon dioxide làm nước vôi trong vẩn đục, chứng minh hạt nảy mầm thải CO₂. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một bình kín chứa hạt nảy mầm làm nước vôi trong bị vẩn đục. Điều này chứng tỏ hạt\nA. thải carbon dioxide khi hô hấp\nB. thải oxygen khi hô hấp\nC. không hô hấp\nD. hấp thụ carbon dioxide Theo đáp án của ngân hàng: chọn A. thải carbon dioxide khi hô hấp. Carbon dioxide làm nước vôi trong vẩn đục, chứng minh hạt nảy mầm thải CO₂. Phải có mẫu đối chứng và bình kín để kết luận đáng tin cậy."},{"number":26,"title":"MỘT SỐ YẾU TỐ ẢNH HƯỞNG ĐẾN HÔ HẤP TẾ BÀO","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"chu-de-26","summary":"Yếu tố ảnh hưởng đến hô hấp tế bào và bảo quản","intro":["Yếu tố ảnh hưởng đến hô hấp tế bào và bảo quản"],"forms":[{"title":"Dạng 1. Nhận biết yếu tố ảnh hưởng","tip":"Nhiệt độ, nước, oxygen và lượng chất hữu cơ ảnh hưởng tốc độ hô hấp.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Yếu tố nào sau đây ảnh hưởng trực tiếp đến hô hấp tế bào?\nA. Nhiệt độ\nB. Màu sắc của vật\nC. Âm thanh\nD. Hình dạng chậu","solution":"Theo đáp án của ngân hàng: chọn A. Nhiệt độ. Nhiệt độ, nước, oxygen và lượng chất hữu cơ ảnh hưởng tốc độ hô hấp.","trap":"Không coi hô hấp luôn có tốc độ cố định.","extra":[]},{"title":"Dạng 2. Giải thích bảo quản lạnh","tip":"Nhiệt độ thấp làm hoạt động enzyme và hô hấp chậm lại, nên rau quả lâu hỏng hơn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao rau quả để ở nhiệt độ phòng thường nhanh hỏng hơn khi để trong tủ lạnh?\nA. Tủ lạnh làm rau quả quang hợp mạnh hơn\nB. Nhiệt độ phòng không có oxygen\nC. Nhiệt độ thấp làm chậm hoạt động enzyme và giảm hô hấp\nD. Tủ lạnh làm rau quả mất hết nước ngay","solution":"Theo đáp án của ngân hàng: chọn C. Nhiệt độ thấp làm chậm hoạt động enzyme và giảm hô hấp. Nhiệt độ thấp làm hoạt động enzyme và hô hấp chậm lại, nên rau quả lâu hỏng hơn.","trap":"Tủ lạnh không làm hô hấp dừng hoàn toàn.","extra":[]},{"title":"Dạng 3. Xử lí kho hạt nóng và ẩm","tip":"Làm khô, thông gió và hạ nhiệt để giảm hô hấp, nấm mốc và hao hụt.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một kho thóc có nhiệt độ tăng dần và xuất hiện mùi ẩm. Biện pháp phù hợp nhất là\nA. Thông gió, làm khô và kiểm tra độ ẩm của thóc\nB. Đóng kín kho hơn\nC. Tưới thêm nước vào thóc\nD. Tăng nhiệt độ kho","solution":"Theo đáp án của ngân hàng: chọn A. Thông gió, làm khô và kiểm tra độ ẩm của thóc. Làm khô, thông gió và hạ nhiệt để giảm hô hấp, nấm mốc và hao hụt.","trap":"Không đóng kín hạt ẩm trong kho nóng.","extra":[]}],"searchText":"MỘT SỐ YẾU TỐ ẢNH HƯỞNG ĐẾN HÔ HẤP TẾ BÀO Yếu tố ảnh hưởng đến hô hấp tế bào và bảo quản Dạng 1. Nhận biết yếu tố ảnh hưởng Nhiệt độ, nước, oxygen và lượng chất hữu cơ ảnh hưởng tốc độ hô hấp. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Yếu tố nào sau đây ảnh hưởng trực tiếp đến hô hấp tế bào?\nA. Nhiệt độ\nB. Màu sắc của vật\nC. Âm thanh\nD. Hình dạng chậu Theo đáp án của ngân hàng: chọn A. Nhiệt độ. Nhiệt độ, nước, oxygen và lượng chất hữu cơ ảnh hưởng tốc độ hô hấp. Không coi hô hấp luôn có tốc độ cố định. Dạng 2. Giải thích bảo quản lạnh Nhiệt độ thấp làm hoạt động enzyme và hô hấp chậm lại, nên rau quả lâu hỏng hơn. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao rau quả để ở nhiệt độ phòng thường nhanh hỏng hơn khi để trong tủ lạnh?\nA. Tủ lạnh làm rau quả quang hợp mạnh hơn\nB. Nhiệt độ phòng không có oxygen\nC. Nhiệt độ thấp làm chậm hoạt động enzyme và giảm hô hấp\nD. Tủ lạnh làm rau quả mất hết nước ngay Theo đáp án của ngân hàng: chọn C. Nhiệt độ thấp làm chậm hoạt động enzyme và giảm hô hấp. Nhiệt độ thấp làm hoạt động enzyme và hô hấp chậm lại, nên rau quả lâu hỏng hơn. Tủ lạnh không làm hô hấp dừng hoàn toàn. Dạng 3. Xử lí kho hạt nóng và ẩm Làm khô, thông gió và hạ nhiệt để giảm hô hấp, nấm mốc và hao hụt. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một kho thóc có nhiệt độ tăng dần và xuất hiện mùi ẩm. Biện pháp phù hợp nhất là\nA. Thông gió, làm khô và kiểm tra độ ẩm của thóc\nB. Đóng kín kho hơn\nC. Tưới thêm nước vào thóc\nD. Tăng nhiệt độ kho Theo đáp án của ngân hàng: chọn A. Thông gió, làm khô và kiểm tra độ ẩm của thóc. Làm khô, thông gió và hạ nhiệt để giảm hô hấp, nấm mốc và hao hụt. Không đóng kín hạt ẩm trong kho nóng."},{"number":27,"title":"THỰC HÀNH: HÔ HẤP Ở THỰC VẬT","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"chu-de-27","summary":"Thực hành chứng minh hô hấp ở thực vật","intro":["Thực hành chứng minh hô hấp ở thực vật"],"forms":[{"title":"Dạng 1. Xác định mục tiêu thí nghiệm","tip":"Hạt nảy mầm hô hấp và thải carbon dioxide làm nước vôi trong vẩn đục.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Mục đích của thí nghiệm dùng hạt nảy mầm và nước vôi trong là chứng minh hạt hô hấp\nA. thải carbon dioxide\nB. thải oxygen\nC. hấp thụ carbon dioxide\nD. tạo tinh bột","solution":"Theo đáp án của ngân hàng: chọn A. thải carbon dioxide. Hạt nảy mầm hô hấp và thải carbon dioxide làm nước vôi trong vẩn đục.","trap":"Không dùng hạt đã chết làm mẫu thí nghiệm chính.","extra":[]},{"title":"Dạng 2. Giải thích vai trò chuông đối chứng","tip":"Đối chứng giúp xác định hiện tượng do hạt hô hấp chứ không do không khí hoặc dụng cụ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao cần có chuông đối chứng không chứa hạt nảy mầm?\nA. Để làm nước vôi vẩn đục nhanh hơn\nB. Để tăng độ ẩm cho hạt\nC. Để xác định sự vẩn đục của nước vôi do hạt hô hấp tạo CO₂\nD. Để cung cấp thêm oxygen","solution":"Theo đáp án của ngân hàng: chọn C. Để xác định sự vẩn đục của nước vôi do hạt hô hấp tạo CO₂. Đối chứng giúp xác định hiện tượng do hạt hô hấp chứ không do không khí hoặc dụng cụ.","trap":"Đối chứng phải khác đúng một yếu tố cần kiểm tra.","extra":[]},{"title":"Dạng 3. Phát hiện sai sót khi cả hai mẫu đều vẩn đục","tip":"Kiểm tra độ kín vì carbon dioxide ngoài không khí có thể lọt vào cả hai chuông.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Sau một giờ, cả hai cốc nước vôi trong ở chuông thí nghiệm và đối chứng đều vẩn đục. Sai sót có thể là\nA. chuông không kín nên CO₂ từ không khí lọt vào\nB. hạt nảy mầm hô hấp\nC. có dùng nước vôi trong\nD. đặt hai chuông cùng nơi","solution":"Theo đáp án của ngân hàng: chọn A. chuông không kín nên CO₂ từ không khí lọt vào. Kiểm tra độ kín vì carbon dioxide ngoài không khí có thể lọt vào cả hai chuông.","trap":"Không kết luận mẫu đối chứng cũng hô hấp như hạt.","extra":[]}],"searchText":"THỰC HÀNH: HÔ HẤP Ở THỰC VẬT Thực hành chứng minh hô hấp ở thực vật Dạng 1. Xác định mục tiêu thí nghiệm Hạt nảy mầm hô hấp và thải carbon dioxide làm nước vôi trong vẩn đục. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Mục đích của thí nghiệm dùng hạt nảy mầm và nước vôi trong là chứng minh hạt hô hấp\nA. thải carbon dioxide\nB. thải oxygen\nC. hấp thụ carbon dioxide\nD. tạo tinh bột Theo đáp án của ngân hàng: chọn A. thải carbon dioxide. Hạt nảy mầm hô hấp và thải carbon dioxide làm nước vôi trong vẩn đục. Không dùng hạt đã chết làm mẫu thí nghiệm chính. Dạng 2. Giải thích vai trò chuông đối chứng Đối chứng giúp xác định hiện tượng do hạt hô hấp chứ không do không khí hoặc dụng cụ. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao cần có chuông đối chứng không chứa hạt nảy mầm?\nA. Để làm nước vôi vẩn đục nhanh hơn\nB. Để tăng độ ẩm cho hạt\nC. Để xác định sự vẩn đục của nước vôi do hạt hô hấp tạo CO₂\nD. Để cung cấp thêm oxygen Theo đáp án của ngân hàng: chọn C. Để xác định sự vẩn đục của nước vôi do hạt hô hấp tạo CO₂. Đối chứng giúp xác định hiện tượng do hạt hô hấp chứ không do không khí hoặc dụng cụ. Đối chứng phải khác đúng một yếu tố cần kiểm tra. Dạng 3. Phát hiện sai sót khi cả hai mẫu đều vẩn đục Kiểm tra độ kín vì carbon dioxide ngoài không khí có thể lọt vào cả hai chuông. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Sau một giờ, cả hai cốc nước vôi trong ở chuông thí nghiệm và đối chứng đều vẩn đục. Sai sót có thể là\nA. chuông không kín nên CO₂ từ không khí lọt vào\nB. hạt nảy mầm hô hấp\nC. có dùng nước vôi trong\nD. đặt hai chuông cùng nơi Theo đáp án của ngân hàng: chọn A. chuông không kín nên CO₂ từ không khí lọt vào. Kiểm tra độ kín vì carbon dioxide ngoài không khí có thể lọt vào cả hai chuông. Không kết luận mẫu đối chứng cũng hô hấp như hạt."},{"number":28,"title":"TRAO ĐỔI KHÍ Ở SINH VẬT","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"chu-de-28","summary":"Trao đổi khí ở sinh vật","intro":["Trao đổi khí ở sinh vật"],"forms":[{"title":"Dạng 1. Nhận biết trao đổi khí","tip":"Sinh vật lấy khí cần thiết và thải khí sinh ra trong trao đổi chất.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Trao đổi khí ở sinh vật là quá trình\nA. lấy khí cần thiết từ môi trường và thải khí do cơ thể tạo ra\nB. chỉ hấp thụ nước\nC. chỉ vận chuyển chất dinh dưỡng\nD. chỉ thải chất rắn","solution":"Theo đáp án của ngân hàng: chọn A. lấy khí cần thiết từ môi trường và thải khí do cơ thể tạo ra. Sinh vật lấy khí cần thiết và thải khí sinh ra trong trao đổi chất.","trap":"Không đồng nhất trao đổi khí với toàn bộ hô hấp tế bào.","extra":[]},{"title":"Dạng 2. Giải thích đặc điểm bề mặt trao đổi khí","tip":"Bề mặt mỏng, ẩm và có diện tích lớn giúp khí hòa tan và khuếch tán nhanh.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao bề mặt trao đổi khí cần mỏng và ẩm?\nA. Để tăng khối lượng cơ thể\nB. Để ngăn mọi khí đi qua\nC. Để khí hòa tan và khuếch tán dễ dàng\nD. Để giữ nhiệt tuyệt đối","solution":"Theo đáp án của ngân hàng: chọn C. Để khí hòa tan và khuếch tán dễ dàng. Bề mặt mỏng, ẩm và có diện tích lớn giúp khí hòa tan và khuếch tán nhanh.","trap":"Bề mặt dày làm đường khuếch tán dài hơn.","extra":[]},{"title":"Dạng 3. Vận dụng vai trò của khí khổng","tip":"Bịt khí khổng làm trao đổi CO₂, O₂ và thoát hơi nước bị cản trở, cây suy yếu.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một chậu cây bị phủ kín hai mặt lá bằng lớp dầu mỏng. Sau một thời gian cây yếu đi chủ yếu vì\nA. khí khổng bị bịt, trao đổi khí bị cản trở\nB. rễ hấp thụ quá nhiều nước\nC. lá nhận quá nhiều carbon dioxide\nD. cây quang hợp mạnh hơn","solution":"Theo đáp án của ngân hàng: chọn A. khí khổng bị bịt, trao đổi khí bị cản trở. Bịt khí khổng làm trao đổi CO₂, O₂ và thoát hơi nước bị cản trở, cây suy yếu.","trap":"Không chỉ xét một mặt lá vì khí khổng có thể phân bố khác nhau.","extra":[]}],"searchText":"TRAO ĐỔI KHÍ Ở SINH VẬT Trao đổi khí ở sinh vật Dạng 1. Nhận biết trao đổi khí Sinh vật lấy khí cần thiết và thải khí sinh ra trong trao đổi chất. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Trao đổi khí ở sinh vật là quá trình\nA. lấy khí cần thiết từ môi trường và thải khí do cơ thể tạo ra\nB. chỉ hấp thụ nước\nC. chỉ vận chuyển chất dinh dưỡng\nD. chỉ thải chất rắn Theo đáp án của ngân hàng: chọn A. lấy khí cần thiết từ môi trường và thải khí do cơ thể tạo ra. Sinh vật lấy khí cần thiết và thải khí sinh ra trong trao đổi chất. Không đồng nhất trao đổi khí với toàn bộ hô hấp tế bào. Dạng 2. Giải thích đặc điểm bề mặt trao đổi khí Bề mặt mỏng, ẩm và có diện tích lớn giúp khí hòa tan và khuếch tán nhanh. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao bề mặt trao đổi khí cần mỏng và ẩm?\nA. Để tăng khối lượng cơ thể\nB. Để ngăn mọi khí đi qua\nC. Để khí hòa tan và khuếch tán dễ dàng\nD. Để giữ nhiệt tuyệt đối Theo đáp án của ngân hàng: chọn C. Để khí hòa tan và khuếch tán dễ dàng. Bề mặt mỏng, ẩm và có diện tích lớn giúp khí hòa tan và khuếch tán nhanh. Bề mặt dày làm đường khuếch tán dài hơn. Dạng 3. Vận dụng vai trò của khí khổng Bịt khí khổng làm trao đổi CO₂, O₂ và thoát hơi nước bị cản trở, cây suy yếu. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một chậu cây bị phủ kín hai mặt lá bằng lớp dầu mỏng. Sau một thời gian cây yếu đi chủ yếu vì\nA. khí khổng bị bịt, trao đổi khí bị cản trở\nB. rễ hấp thụ quá nhiều nước\nC. lá nhận quá nhiều carbon dioxide\nD. cây quang hợp mạnh hơn Theo đáp án của ngân hàng: chọn A. khí khổng bị bịt, trao đổi khí bị cản trở. Bịt khí khổng làm trao đổi CO₂, O₂ và thoát hơi nước bị cản trở, cây suy yếu. Không c ng phù hợp và bổ sung điện giải khi mất nhiều mồ hôi.","trap":"Không uống quá nhanh một lượng nước rất lớn.","extra":[]}],"searchText":"VAI TRÒ CỦA NƯỚC VÀ CHẤT DINH DƯỠNG ĐỐI VỚI SINH VẬT Vai trò của nước và chất dinh dưỡng Dạng 1. Nhận biết vai trò cấu tạo của nước Nước chiếm tỉ lệ lớn trong cơ thể và là môi trường cho nhiều phản ứng sống. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Nước là thành phần chiếm tỉ lệ lớn trong\nA. cơ thể sinh vật\nB. chỉ xương\nC. chỉ lông và tóc\nD. chỉ vỏ cây Theo đáp án của ngân hàng: chọn A. cơ thể sinh vật. Nước chiếm tỉ lệ lớn trong cơ thể và là môi trường cho nhiều phản ứng sống. Không coi nước chỉ có vai trò giải khát. Dạng 2. Giải thích nước là dấu hiệu quan trọng của sự sống Nước cần cho cấu trúc tế bào, vận chuyển chất và phản ứng sinh hóa. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao các nhà khoa học tìm kiếm nước khi tìm sự sống ngoài Trái Đất?\nA. Nước luôn chứa sinh vật\nB. Nước tạo ra ánh sáng\nC. Nước cần cho cấu trúc và nhiều hoạt động sống\nD. Nước thay thế mọi chất dinh dưỡng Theo đáp án của ngân hàng: chọn C. Nước cần cho cấu trúc và nhiều hoạt động sống. Nước cần cho cấu trúc tế bào, vận chuyển chất và phản ứng sinh hóa. Có nước chưa đủ để khẳng định chắc chắn có sự sống. Dạng 3. Bù nước sau vận động Uống từng lượng phù hợp và bổ sung điện giải khi mất nhiều mồ hôi. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một học sinh sau giờ thể dục ra nhiều mồ hôi. Lựa chọn phù hợp nhất là\nA. uống nước từng lượng phù hợp và bổ sung điện giải khi cần\nB. không uống nước\nC. chỉ ăn đồ ngọt\nD. uống thật nhiều trong một lần Theo đáp án của ngân hàng: chọn A. uống nước từng lượng phù hợp và bổ sung điện giải khi cần. Uống từng lượng phù hợp và bổ sung điện giải khi mất nhiều mồ hôi. Không uống quá nhanh một lượng nước rất lớn."},{"number":30,"title":"TRAO ĐỔI NƯỚC VÀ CHẤT DINH DƯỠNG Ở THỰC VẬT","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"chu-de-30","summary":"Hấp thụ và vận chuyển nước, khoáng ở thực vật","intro":["Hấp thụ và vận chuyển nước, khoáng ở thực vật"],"forms":[{"title":"Dạng 1. Xác định cơ quan hấp thụ nước và khoáng","tip":"Rễ, đặc biệt vùng lông hút, là nơi hấp thụ chủ yếu nước và ion khoáng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Ở thực vật, nước và chất khoáng được hấp thụ chủ yếu qua\nA. rễ\nB. lá\nC. hoa\nD. quả","solution":"Theo đáp án của ngân hàng: chọn A. rễ. Rễ, đặc biệt vùng lông hút, là nơi hấp thụ chủ yếu nước và ion khoáng.","trap":"Lá không phải cơ quan hấp thụ nước chính từ đất.","extra":[]},{"title":"Dạng 2. Giải thích cấu tạo lông hút","tip":"Lông hút nhiều, thành mỏng và tiếp xúc sát đất làm tăng diện tích hấp thụ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao lông hút thích hợp với chức năng hấp thụ nước và chất khoáng?\nA. Có lớp vỏ rất dày và không thấm nước\nB. Nằm trong mạch rây\nC. Có số lượng nhiều, thành mỏng và tiếp xúc trực tiếp với đất\nD. Chỉ xuất hiện ở lá","solution":"Theo đáp án của ngân hàng: chọn C. Có số lượng nhiều, thành mỏng và tiếp xúc trực tiếp với đất. Lông hút nhiều, thành mỏng và tiếp xúc sát đất làm tăng diện tích hấp thụ.","trap":"Không nhầm lông hút với mạch gỗ.","extra":[]},{"title":"Dạng 3. Chăm sóc cây sau chuyển chậu","tip":"Giữ ẩm vừa phải, đặt nơi mát và giảm thoát hơi nước trong lúc rễ phục hồi.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một cây bị đứt nhiều lông hút khi chuyển chậu. Biện pháp phù hợp là\nA. đặt cây nơi mát, giữ ẩm vừa phải để rễ phục hồi\nB. đặt ngay dưới nắng gắt\nC. bón phân đặc\nD. ngừng tưới hoàn toàn","solution":"Theo đáp án của ngân hàng: chọn A. đặt cây nơi mát, giữ ẩm vừa phải để rễ phục hồi. Giữ ẩm vừa phải, đặt nơi mát và giảm thoát hơi nước trong lúc rễ phục hồi.","trap":"Không tưới ngập gây thiếu oxygen cho rễ.","extra":[]}],"searchText":"TRAO ĐỔI NƯỚC VÀ CHẤT DINH DƯỠNG Ở THỰC VẬT Hấp thụ và vận chuyển nước, khoáng ở thực vật Dạng 1. Xác định cơ quan hấp thụ nước và khoáng Rễ, đặc biệt vùng lông hút, là nơi hấp thụ chủ yếu nước và ion khoáng. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Ở thực vật, nước và chất khoáng được hấp thụ chủ yếu qua\nA. rễ\nB. lá\nC. hoa\nD. quả Theo đáp án của ngân hàng: chọn A. rễ. Rễ, đặc biệt vùng lông hút, là nơi hấp thụ chủ yếu nước và ion khoáng. Lá không phải cơ quan hấp thụ nước chính từ đất. Dạng 2. Giải thích cấu tạo lông hút Lông hút nhiều, thành mỏng và tiếp xúc sát đất làm tăng diện tích hấp thụ. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao lông hút thích hợp với chức năng hấp thụ nước và chất khoáng?\nA. Có lớp vỏ rất dày và không thấm nước\nB. Nằm trong mạch rây\nC. Có số lượng nhiều, thành mỏng và tiếp xúc trực tiếp với đất\nD. Chỉ xuất hiện ở lá Theo đáp án của ngân hàng: chọn C. Có số lượng nhiều, thành mỏng và tiếp xúc trực tiếp với đất. Lông hút nhiều, thành mỏng và tiếp xúc sát đất làm tăng diện tích hấp thụ. Không nhầm lông hút với mạch gỗ. Dạng 3. Chăm sóc cây sau chuyển chậu Giữ ẩm vừa phải, đặt nơi mát và giảm thoát hơi nước trong lúc rễ phục hồi. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một cây bị đứt nhiều lông hút khi chuyển chậu. Biện pháp phù hợp là\nA. đặt cây nơi mát, giữ ẩm vừa phải để rễ phục hồi\nB. đặt ngay dưới nắng gắt\nC. bón phân đặc\nD. ngừng tưới hoàn toàn Theo đáp án của ngân hàng: chọn A. đặt cây nơi mát, giữ ẩm vừa phải để rễ phục hồi. Giữ ẩm vừa phải, đặt nơi mát và giảm thoát hơi nước trong lúc rễ phục hồi. Không tưới ngập gây thiếu oxygen cho rễ."},{"number":31,"title":"TRAO ĐỔI NƯỚC VÀ CHẤT DINH DƯỠNG Ở ĐỘNG VẬT","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"chu-de-31","summary":"Dinh dưỡng và nhu cầu nước ở động vật","intro":["Dinh dưỡng và nhu cầu nước ở động vật"],"forms":[{"title":"Dạng 1. Nhận biết nguồn dinh dưỡng","tip":"Động vật thu nhận chất dinh dưỡng chủ yếu qua thức ăn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Động vật thu nhận chất dinh dưỡng chủ yếu qua\nA. thức ăn\nB. ánh sáng\nC. đất\nD. từ trường","solution":"Theo đáp án của ngân hàng: chọn A. thức ăn. Động vật thu nhận chất dinh dưỡng chủ yếu qua thức ăn.","trap":"Oxygen là chất cần thiết nhưng không thay thế thức ăn.","extra":[]},{"title":"Dạng 2. Giải thích vai trò của tiêu hóa","tip":"Tiêu hóa biến chất lớn, phức tạp thành chất nhỏ, đơn giản để cơ thể hấp thụ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao thức ăn cần được tiêu hóa trước khi hấp thụ?\nA. Thức ăn không chứa năng lượng\nB. Cơ thể chỉ hấp thụ chất rắn lớn\nC. Nhiều chất trong thức ăn có kích thước lớn, cần biến đổi thành chất đơn giản\nD. Tiêu hóa làm mất toàn bộ chất dinh dưỡng","solution":"Theo đáp án của ngân hàng: chọn C. Nhiều chất trong thức ăn có kích thước lớn, cần biến đổi thành chất đơn giản. Tiêu hóa biến chất lớn, phức tạp thành chất nhỏ, đơn giản để cơ thể hấp thụ.","trap":"Không phải mọi chất trong thức ăn đều cần phân giải như nhau.","extra":[]},{"title":"Dạng 3. Tính nhu cầu nước tham khảo","tip":"Nhân mức nước theo kg với khối lượng cơ thể và đổi đơn vị nếu cần.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Theo mức tham khảo 40 mL nước/kg khối lượng cơ thể mỗi ngày, người nặng 50 kg cần khoảng\nA. 2 000 mL\nB. 1 000 mL\nC. 1 500 mL\nD. 3 000 mL","solution":"Theo đáp án của ngân hàng: chọn A. 2 000 mL. 40 mL/kg × 50 kg = 2 000 mL.","trap":"Đây là mức tham khảo; nhu cầu thực tế còn phụ thuộc hoạt động và môi trường.","extra":[]}],"searchText":"TRAO ĐỔI NƯỚC VÀ CHẤT DINH DƯỠNG Ở ĐỘNG VẬT Dinh dưỡng và nhu cầu nước ở động vật Dạng 1. Nhận biết nguồn dinh dưỡng Động vật thu nhận chất dinh dưỡng chủ yếu qua thức ăn. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Động vật thu nhận chất dinh dưỡng chủ yếu qua\nA. thức ăn\nB. ánh sáng\nC. đất\nD. từ trường Theo đáp án của ngân hàng: chọn A. thức ăn. Động vật thu nhận chất dinh dưỡng chủ yếu qua thức ăn. Oxygen là chất cần thiết nhưng không thay thế thức ăn. Dạng 2. Giải thích vai trò của tiêu hóa Tiêu hóa biến chất lớn, phức tạp thành chất nhỏ, đơn giản để cơ thể hấp thụ. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao thức ăn cần được tiêu hóa trước khi hấp thụ?\nA. Thức ăn không chứa năng lượng\nB. Cơ thể chỉ hấp thụ chất rắn lớn\nC. Nhiều chất trong thức ăn có kích thước lớn, cần biến đổi thành chất đơn giản\nD. Tiêu hóa làm mất toàn bộ chất dinh dưỡng Theo đáp án của ngân hàng: chọn C. Nhiều chất trong thức ăn có kích thước lớn, cần biến đổi thành chất đơn giản. Tiêu hóa biến chất lớn, phức tạp thành chất nhỏ, đơn giản để cơ thể hấp thụ. Không phải mọi chất trong thức ăn đều cần phân giải như nhau. Dạng 3. Tính nhu cầu nước tham khảo Nhân mức nước theo kg với khối lượng cơ thể và đổi đơn vị nếu cần. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Theo mức tham khảo 40 mL nước/kg khối lượng cơ thể mỗi ngày, người nặng 50 kg cần khoảng\nA. 2 000 mL\nB. 1 000 mL\nC. 1 500 mL\nD. 3 000 mL Theo đáp án của ngân hàng: chọn A. 2 000 mL. 40 mL/kg × 50 kg = 2 000 mL. Đây là mức tham khảo; nhu cầu thực tế còn phụ thuộc hoạt động và môi trường."},{"number":32,"title":"THỰC HÀNH: CHỨNG MINH THÂN VẬN CHUYỂN NƯỚC VÀ LÁ THOÁT HƠI NƯỚC","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"chu-de-32","summary":"Thực hành vận chuyển nước và thoát hơi nước","intro":["Thực hành vận chuyển nước và thoát hơi nước"],"forms":[{"title":"Dạng 1. Xác định mục tiêu thí nghiệm nước màu","tip":"Nước màu đi lên cành và hoa chứng minh thân vận chuyển nước.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Thí nghiệm cắm cành hoa trắng vào nước màu nhằm chứng minh\nA. thân vận chuyển nước\nB. lá quang hợp tạo tinh bột\nC. rễ hô hấp\nD. hoa thụ phấn","solution":"Theo đáp án của ngân hàng: chọn A. thân vận chuyển nước. Nước màu đi lên cành và hoa chứng minh thân vận chuyển nước.","trap":"Không kết luận màu tự sinh ra trong cánh hoa.","extra":[]},{"title":"Dạng 2. Giải thích đường vận chuyển trong thân","tip":"Mạch gỗ vận chuyển nước màu từ gốc lên các bộ phận phía trên.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao cánh hoa đổi màu khi cắm trong nước màu?\nA. Cánh hoa tự tạo chất màu\nB. Mạch rây hút màu từ không khí\nC. Nước màu được mạch gỗ vận chuyển lên hoa\nD. Hoa ngừng hô hấp","solution":"Theo đáp án của ngân hàng: chọn C. Nước màu được mạch gỗ vận chuyển lên hoa. Mạch gỗ vận chuyển nước màu từ gốc lên các bộ phận phía trên.","trap":"Không nhầm với mạch rây vận chuyển chủ yếu chất hữu cơ.","extra":[]},{"title":"Dạng 3. Xử lí thí nghiệm không đổi màu","tip":"Cắt lại gốc cành dưới nước, kiểm tra mạch dẫn và dùng cành còn tươi.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Cành hoa không đổi màu sau nhiều giờ. Nguyên nhân hợp lí nhất là\nA. gốc cành bị khô hoặc mạch dẫn bị tắc\nB. nước màu được vận chuyển tốt\nC. cành còn tươi\nD. cốc có đủ nước","solution":"Theo đáp án của ngân hàng: chọn A. gốc cành bị khô hoặc mạch dẫn bị tắc. Cắt lại gốc cành dưới nước, kiểm tra mạch dẫn và dùng cành còn tươi.","trap":"Không thêm quá nhiều màu làm thay đổi điều kiện thí nghiệm.","extra":[]}],"searchText":"THỰC HÀNH: CHỨNG MINH THÂN VẬN CHUYỂN NƯỚC VÀ LÁ THOÁT HƠI NƯỚC Thực hành vận chuyển nước và thoát hơi nước Dạng 1. Xác định mục tiêu thí nghiệm nước màu Nước màu đi lên cành và hoa chứng minh thân vận chuyển nước. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Thí nghiệm cắm cành hoa trắng vào nước màu nhằm chứng minh\nA. thân vận chuyển nước\nB. lá quang hợp tạo tinh bột\nC. rễ hô hấp\nD. hoa thụ phấn Theo đáp án của ngân hàng: chọn A. thân vận chuyển nước. Nước màu đi lên cành và hoa chứng minh thân vận chuyển nước. Không kết luận màu tự sinh ra trong cánh hoa. Dạng 2. Giải thích đường vận chuyển trong thân Mạch gỗ vận chuyển nước màu từ gốc lên các bộ phận phía trên. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao cánh hoa đổi màu khi cắm trong nước màu?\nA. Cánh hoa tự tạo chất màu\nB. Mạch rây hút màu từ không khí\nC. Nước màu được mạch gỗ vận chuyển lên hoa\nD. Hoa ngừng hô hấp Theo đáp án của ngân hàng: chọn C. Nước màu được mạch gỗ vận chuyển lên hoa. Mạch gỗ vận chuyển nước màu từ gốc lên các bộ phận phía trên. Không nhầm với mạch rây vận chuyển chủ yếu chất hữu cơ. Dạng 3. Xử lí thí nghiệm không đổi màu Cắt lại gốc cành dưới nước, kiểm tra mạch dẫn và dùng cành còn tươi. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Cành hoa không đổi màu sau nhiều giờ. Nguyên nhân hợp lí nhất là\nA. gốc cành bị khô hoặc mạch dẫn bị tắc\nB. nước màu được vận chuyển tốt\nC. cành còn tươi\nD. cốc có đủ nước Theo đáp án của ngân hàng: chọn A. gốc cành bị khô hoặc mạch dẫn bị tắc. Cắt lại gốc cành dưới nước, kiểm tra mạch dẫn và dùng cành còn tươi. Không thêm quá nhiều màu làm thay đổi điều kiện thí nghiệm."},{"number":33,"title":"CẢM ỨNG Ở SINH VẬT VÀ TẬP TÍNH Ở ĐỘNG VẬT","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"chu-de-33","summary":"Cảm ứng ở sinh vật và tập tính động vật","intro":["Cảm ứng ở sinh vật và tập tính động vật"],"forms":[{"title":"Dạng 1. Nhận biết cảm ứng","tip":"Cảm ứng là phản ứng của sinh vật trước kích thích từ môi trường.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Cảm ứng ở sinh vật là\nA. phản ứng của sinh vật đối với các kích thích đến từ môi trường\nB. sự tăng kích thước và khối lượng của cơ thể\nC. quá trình tạo ra cá thể mới\nD. quá trình phân giải chất hữu cơ","solution":"Theo đáp án của ngân hàng: chọn A. phản ứng của sinh vật đối với các kích thích đến từ môi trường. Cảm ứng là phản ứng của sinh vật trước kích thích từ môi trường.","trap":"Không phải mọi chuyển động đều là phản ứng cảm ứng.","extra":[]},{"title":"Dạng 2. Giải thích ý nghĩa của cảm ứng","tip":"Cảm ứng giúp sinh vật thích nghi nhanh với thay đổi và tăng khả năng sống sót.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao cảm ứng có ý nghĩa đối với sự tồn tại của sinh vật?\nA. Vì cảm ứng làm sinh vật luôn lớn nhanh\nB. Vì cảm ứng thay thế tất cả hoạt động sống khác\nC. Vì cảm ứng giúp sinh vật phản ứng phù hợp trước những thay đổi của môi trường\nD. Vì cảm ứng chỉ làm tăng khả năng sinh sản","solution":"Theo đáp án của ngân hàng: chọn C. Vì cảm ứng giúp sinh vật phản ứng phù hợp trước những thay đổi của môi trường. Cảm ứng giúp sinh vật thích nghi nhanh với thay đổi và tăng khả năng sống sót.","trap":"Không đồng nhất cảm ứng với tiến hóa qua nhiều thế hệ.","extra":[]},{"title":"Dạng 3. Nhận biết hướng sáng ở thực vật","tip":"Thân cây sinh trưởng hướng về phía có ánh sáng là hướng sáng dương.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một chậu cây đặt cạnh cửa sổ lâu ngày có thân nghiêng về phía cửa. Giải thích phù hợp nhất là\nA. thân cây phản ứng với ánh sáng và sinh trưởng về phía có ánh sáng\nB. rễ cây đẩy thân về phía cửa\nC. gió luôn làm thân cây nghiêng\nD. cây tránh nơi có ánh sáng","solution":"Theo đáp án của ngân hàng: chọn A. thân cây phản ứng với ánh sáng và sinh trưởng về phía có ánh sáng. Thân cây sinh trưởng hướng về phía có ánh sáng là hướng sáng dương.","trap":"Không cho rằng cây nghiêng do ánh sáng đẩy cơ học.","extra":[]}],"searchText":"CẢM ỨNG Ở SINH VẬT VÀ TẬP TÍNH Ở ĐỘNG VẬT Cảm ứng ở sinh vật và tập tính động vật Dạng 1. Nhận biết cảm ứng Cảm ứng là phản ứng của sinh vật trước kích thích từ môi trường. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Cảm ứng ở sinh vật là\nA. phản ứng của sinh vật đối với các kích thích đến từ môi trường\nB. sự tăng kích thước và khối lượng của cơ thể\nC. quá trình tạo ra cá thể mới\nD. quá trình phân giải chất hữu cơ Theo đáp án của ngân hàng: chọn A. phản ứng của sinh vật đối với các kích thích đến từ môi trường. Cảm ứng là phản ứng của sinh vật trước kích thích từ môi trường. Không phải mọi chuyển động đều là phản ứng cảm ứng. Dạng 2. Giải thích ý nghĩa của cảm ứng Cảm ứng giúp sinh vật thích nghi nhanh với thay đổi và tăng khả năng sống sót. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao cảm ứng có ý nghĩa đối với sự tồn tại của sinh vật?\nA. Vì cảm ứng làm sinh vật luôn lớn nhanh\nB. Vì cảm ứng thay thế tất cả hoạt động sống khác\nC. Vì cảm ứng giúp sinh vật phản ứng phù hợp trước những thay đổi của môi trường\nD. Vì cảm ứng chỉ làm tăng khả năng sinh sản Theo đáp án của ngân hàng: chọn C. Vì cảm ứng giúp sinh vật phản ứng phù hợp trước những thay đổi của môi trường. Cảm ứng giúp sinh vật thích nghi nhanh với thay đổi và tăng khả năng sống sót. Không đồng nhất cảm ứng với tiến hóa qua nhiều thế hệ. Dạng 3. Nhận biết hướng sáng ở thực vật Thân cây sinh trưởng hướng về phía có ánh sáng là hướng sáng dương. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một chậu cây đặt cạnh cửa sổ lâu ngày có thân nghiêng về phía cửa. Giải thích phù hợp nhất là\nA. thân cây phản ứng với ánh sáng và sinh trưởng về phía có ánh sáng\nB. rễ cây đẩy thân về phía cửa\nC. gió luôn làm thân cây nghiêng\nD. cây tránh nơi có ánh sáng Theo đáp án của ngân hàng: chọn A. thân cây phản ứng với ánh sáng và sinh trưởng về phía có ánh sáng. Thân cây sinh trưởng hướng về phía có ánh sáng là hướng sáng dương. Không cho rằng cây nghiêng do ánh sáng đẩy cơ học."},{"number":34,"title":"VẬN DỤNG HIỂU BIẾT VỀ CẢM ỨNG Ở SINH VẬT VÀO THỰC TIỄN","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"chu-de-34","summary":"Ứng dụng cảm ứng trong trồng trọt và chăn nuôi","intro":["Ứng dụng cảm ứng trong trồng trọt và chăn nuôi"],"forms":[{"title":"Dạng 1. Nhận biết ứng dụng cảm ứng tiếp xúc","tip":"Cây leo phản ứng khi tiếp xúc giá đỡ nên có thể làm giàn để cây vươn lên.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Trong trồng trọt, làm giàn cho cây thân leo là ứng dụng hiện tượng\nA. cảm ứng tiếp xúc\nB. cảm ứng với âm thanh\nC. cảm ứng với nhiệt độ\nD. cảm ứng với mùi","solution":"Theo đáp án của ngân hàng: chọn A. cảm ứng tiếp xúc. Cây leo phản ứng khi tiếp xúc giá đỡ nên có thể làm giàn để cây vươn lên.","trap":"Không nhầm với hướng sáng hoặc hướng nước.","extra":[]},{"title":"Dạng :"Dạng 2. Thiết kế đối chứng trong thí nghiệm hướng nước","tip":"Đối chứng cho phép so sánh khi nước phân bố đều với khi nước tập trung một phía.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao trong thí nghiệm hướng nước cần có chậu đối chứng?\nA. Để làm cây lớn nhanh hơn\nB. Để tăng số lượng mẫu vật\nC. Để so sánh ảnh hưởng của cách phân bố nước đến hướng mọc của rễ\nD. Để thay thế chậu thí nghiệm khi bị vỡ","solution":"Theo đáp án của ngân hàng: chọn C. Để so sánh ảnh hưởng của cách phân bố nước đến hướng mọc của rễ. Đối chứng cho phép so sánh khi nước phân bố đều với khi nước tập trung một phía.","trap":"Các chậu phải giống nhau về loại cây và điều kiện khác.","extra":[]},{"title":"Dạng 3. Rút kết luận từ hướng mọc của rễ","tip":"Rễ mọc lệch về phía nước chứng tỏ rễ có hướng nước dương.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Sau thí nghiệm hướng nước, rễ ở chậu thí nghiệm mọc lệch về phía cốc nước, còn rễ ở chậu đối chứng phân bố tương đối đều. Kết luận phù hợp là\nA. rễ cây có tính hướng nước\nB. thân cây có tính hướng sáng\nC. lá cây có tính hướng tiếp xúc\nD. cây không có cảm ứng","solution":"Theo đáp án của ngân hàng: chọn A. rễ cây có tính hướng nước. Rễ mọc lệch về phía nước chứng tỏ rễ có hướng nước dương.","trap":"Kết luận phải dựa trên sự khác biệt với mẫu đối chứng.","extra":[]}],"searchText":"THỰC HÀNH: CẢM ỨNG Ở SINH VẬT Thực hành khảo sát cảm ứng ở sinh vật Dạng 1. Xác định mục tiêu thực hành Thực hành nhằm quan sát phản ứng của sinh vật với kích thích như ánh sáng, nước hoặc tiếp xúc. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Mục tiêu của Bài 35 là thực hành tìm hiểu\nA. cảm ứng ở sinh vật\nB. quang hợp ở thực vật\nC. hô hấp tế bào\nD. sinh sản hữu tính Theo đáp án của ngân hàng: chọn A. cảm ứng ở sinh vật. Thực hành nhằm quan sát phản ứng của sinh vật với kích thích như ánh sáng, nước hoặc tiếp xúc. Không thay đổi nhiều yếu tố cùng lúc. Dạng 2. Thiết kế đối chứng trong thí nghiệm hướng nước Đối chứng cho phép so sánh khi nước phân bố đều với khi nước tập trung một phía. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao trong thí nghiệm hướng nước cần có chậu đối chứng?\nA. Để làm cây lớn nhanh hơn\nB. Để tăng số lượng mẫu vật\nC. Để so sánh ảnh hưởng của cách phân bố nước đến hướng mọc của rễ\nD. Để thay thế chậu thí nghiệm khi bị vỡ Theo đáp án của ngân hàng: chọn C. Để so sánh ảnh hưởng của cách phân bố nước đến hướng mọc của rễ. Đối chứng cho phép so sánh khi nước phân bố đều với khi nước tập trung một phía. Các chậu phải giống nhau về loại cây và điều kiện khác. Dạng 3. Rút kết luận từ hướng mọc của rễ Rễ mọc lệch về phía nước chứng tỏ rễ có hướng nước dương. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Sau thí nghiệm hướng nước, rễ ở chậu thí nghiệm mọc lệch về phía cốc nước, còn rễ ở chậu đối chứng phân bố tương đối đều. Kết luận phù hợp là\nA. rễ cây có tính hướng nước\nB. thân cây có tính hướng sáng\nC. lá cây có tính hướng tiếp xúc\nD. cây không có cảm ứng Theo đáp án của ngân hàng: chọn A. rễ cây có tính hướng nước. Rễ mọc lệch về phía nước chứng tỏ rễ có hướng nước dương. Kết luận phải dựa trên sự khác biệt với mẫu đối chứng."},{"number":36,"title":"KHÁI QUÁT VỀ SINH TRƯỞNG VÀ PHÁT TRIỂN Ở SINH VẬT","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"chu-de-36","summary":"Sinh trưởng và phát triển ở sinh vật","intro":["Sinh trưởng và phát triển ở sinh vật"],"forms":[{"title":"Dạng 1. Nhận biết sinh trưởng","tip":"Sinh trưởng là sự tăng kích thước và khối lượng của cơ thể.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Sinh trưởng ở sinh vật là sự\nA. tăng về kích thước và khối lượng của cơ thể\nB. thay đổi nơi sống\nC. phản ứng với kích thích\nD. tạo ra cá thể mới","solution":"Theo đáp án của ngân hàng: chọn A. tăng về kích thước và khối lượng của cơ thể. Sinh trưởng là sự tăng kích thước và khối lượng của cơ thể.","trap":"Không đồng nhất sinh trưởng với mọi thay đổi hình thái.","extra":[]},{"title":"Dạng 2. Giải thích biểu hiện tăng chiều cao","tip":"Thân cao lên là biểu hiện kích thước cơ thể tăng nên thuộc sinh trưởng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao thân cây cao lên được xem là sinh trưởng?\nA. Vì cây thay đổi môi trường sống\nB. Vì cây tạo ra hoa\nC. Vì kích thước cơ thể tăng lên\nD. Vì cây phản ứng với ánh sáng","solution":"Theo đáp án của ngân hàng: chọn C. Vì kích thước cơ thể tăng lên. Thân cao lên là biểu hiện kích thước cơ thể tăng nên thuộc sinh trưởng.","trap":"Sự xuất hiện cơ quan mới thường liên quan phát triển.","extra":[]},{"title":"Dạng 3. Phân loại số liệu tăng kích thước","tip":"So sánh kích thước hoặc khối lượng ở hai thời điểm để nhận biết sinh trưởng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một cây non cao từ 12 cm lên 20 cm sau hai tuần. Biểu hiện này chủ yếu là\nA. sinh trưởng\nB. sinh sản\nC. cảm ứng\nD. bài tiết","solution":"Theo đáp án của ngân hàng: chọn A. sinh trưởng. So sánh kích thước hoặc khối lượng ở hai thời điểm để nhận biết sinh trưởng.","trap":"Không cần có sinh sản mới gọi là sinh trưởng.","extra":[]}],"searchText":"KHÁI QUÁT VỀ SINH TRƯỞNG VÀ PHÁT TRIỂN Ở SINH VẬT Sinh trưởng và phát triển ở sinh vật Dạng 1. Nhận biết sinh trưởng Sinh trưởng là sự tăng kích thước và khối lượng của cơ thể. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Sinh trưởng ở sinh vật là sự\nA. tăng về kích thước và khối lượng của cơ thể\nB. thay đổi nơi sống\nC. phản ứng với kích thích\nD. tạo ra cá thể mới Theo đáp án của ngân hàng: chọn A. tăng về kích thước và khối lượng của cơ thể. Sinh trưởng là sự tăng kích thước và khối lượng của cơ thể. Không đồng nhất sinh trưởng với mọi thay đổi hình thái. Dạng 2. Giải thích biểu hiện tăng chiều cao Thân cao lên là biểu hiện kích thước cơ thể tăng nên thuộc sinh trưởng. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao thân cây cao lên được xem là sinh trưởng?\nA. Vì cây thay đổi môi trường sống\nB. Vì cây tạo ra hoa\nC. Vì kích thước cơ thể tăng lên\nD. Vì cây phản ứng với ánh sáng Theo đáp án của ngân hàng: chọn C. Vì kích thước cơ thể tăng lên. Thân cao lên là biểu hiện kích thước cơ thể tăng nên thuộc sinh trưởng. Sự xuất hiện cơ quan mới thường liên quan phát triển. Dạng 3. Phân loại số liệu tăng kích thước So sánh kích thước hoặc khối lượng ở hai thời điểm để nhận biết sinh trưởng. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một cây non cao từ 12 cm lên 20 cm sau hai tuần. Biểu hiện này chủ yếu là\nA. sinh trưởng\nB. sinh sản\nC. cảm ứng\nD. bài tiết Theo đáp án của ngân hàng: chọn A. sinh trưởng. So sánh kích thước hoặc khối lượng ở hai thời điểm để nhận biết sinh trưởng. Không cần có sinh sản mới gọi là sinh trưởng."},{"number":37,"title":"ỨNG DỤNG SINH TRƯỞNG VÀ PHÁT TRIỂN Ở SINH VẬT VÀO THỰC TIỄN","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"chu-de-37","summary":"Ứng dụng điều kiện sinh trưởng và phát triển","intro":["Ứng dụng điều kiện sinh trưởng và phát triển"],"forms":[{"title":"Dạng 1. Nhận biết nhiệt độ thuận lợi","tip":"Mỗi loài có khoảng nhiệt độ thích hợp để sinh trưởng và phát triển tốt.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Nhiệt độ môi trường thuận lợi đối với sinh vật là\nA. mức nhiệt thích hợp nhất cho sinh trưởng và phát triển\nB. mức nhiệt cao nhất mà sinh vật chịu được\nC. mức nhiệt thấp nhất mà sinh vật chịu được\nD. mọi mức nhiệt ngoài giới hạn sống","solution":"Theo đáp án của ngân hàng: chọn A. mức nhiệt thích hợp nhất cho sinh trưởng và phát triển. Mỗi loài có khoảng nhiệt độ thích hợp để sinh trưởng và phát triển tốt.","trap":"Nhiệt độ càng cao không phải lúc nào cũng càng tốt.","extra":[]},{"title":"Dạng 2. Giải thích tác động của nhiệt độ cực đoan","tip":"Nhiệt độ quá cao hoặc thấp làm enzyme và trao đổi chất hoạt động kém.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao nhiệt độ quá cao hoặc quá thấp đều có thể làm sinh vật chậm lớn?\nA. Vì sinh vật không cần nhiệt độ\nB. Vì nhiệt độ chỉ ảnh hưởng màu sắc\nC. Vì hoạt động enzyme và trao đổi chất bị rối loạn\nD. Vì mọi tế bào đều ngừng tồn tại ngay","solution":"Theo đáp án của ngân hàng: chọn C. Vì hoạt động enzyme và trao đổi chất bị rối loạn. Nhiệt độ quá cao hoặc thấp làm enzyme và trao đổi chất hoạt động kém.","trap":"Không chỉ xét nhiệt độ mà bỏ nước, ánh sáng và dinh dưỡng.","extra":[]},{"title":"Dạng 3. Ứng dụng nhà kính trong mùa rét","tip":"Che phủ hoặc nhà kính giúp duy trì nhiệt độ gần khoảng thích hợp.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một vườn rau sinh trưởng chậm trong mùa rét. Biện pháp phù hợp nhất là\nA. che phủ hoặc dùng nhà kính để giữ nhiệt thích hợp\nB. ngừng tưới nước\nC. tăng mật độ trồng\nD. che tối hoàn toàn","solution":"Theo đáp án của ngân hàng: chọn A. che phủ hoặc dùng nhà kính để giữ nhiệt thích hợp. Che phủ hoặc nhà kính giúp duy trì nhiệt độ gần khoảng thích hợp.","trap":"Cần thông gió để tránh quá nóng và ẩm bệnh.","extra":[]}],"searchText":"ỨNG DỤNG SINH TRƯỞNG VÀ PHÁT TRIỂN Ở SINH VẬT VÀO THỰC TIỄN Ứng dụng điều kiện sinh trưởng và phát triển Dạng 1. Nhận biết nhiệt độ thuận lợi Mỗi loài có khoảng nhiệt độ thích hợp để sinh trưởng và phát triển tốt. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Nhiệt độ môi trường thuận lợi đối với sinh vật là\nA. mức nhiệt thích hợp nhất cho sinh trưởng và phát triển\nB. mức nhiệt cao nhất mà sinh vật chịu được\nC. mức nhiệt thấp nhất mà sinh vật chịu được\nD. mọi mức nhiệt ngoài giới hạn sống Theo đáp án của ngân hàng: chọn A. mức nhiệt thích hợp nhất cho sinh trưởng và phát triển. Mỗi loài có khoảng nhiệt độ thích hợp để sinh trưởng và phát triển tốt. Nhiệt độ càng cao không phải lúc nào cũng càng tốt. Dạng 2. Giải thích tác động của nhiệt độ cực đoan Nhiệt độ quá cao hoặc thấp làm enzyme và trao đổi chất hoạt động kém. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao nhiệt độ quá cao hoặc quá thấp đều có thể làm sinh vật chậm lớn?\nA. Vì sinh vật không cần nhiệt độ\nB. Vì nhiệt độ chỉ ảnh hưởng màu sắc\nC. Vì hoạt động enzyme và trao đổi chất bị rối loạn\nD. Vì mọi tế bào đều ngừng tồn tại ngay Theo đáp án của ngân hàng: chọn C. Vì hoạt động enzyme và trao đổi chất bị rối loạn. Nhiệt độ quá cao hoặc thấp làm enzyme và trao đổi chất hoạt động kém. Không chỉ xét nhiệt độ mà bỏ nước, ánh sáng và dinh dưỡng. Dạng 3. Ứng dụng nhà kính trong mùa rét Che phủ hoặc nhà kính giúp duy trì nhiệt độ gần khoảng thích hợp. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một vườn rau sinh trưởng chậm trong mùa rét. Biện pháp phù hợp nhất là\nA. che phủ hoặc dùng nhà kính để giữ nhiệt thích hợp\nB. ngừng tưới nước\nC. tăng mật độ trồng\nD. che tối hoàn toàn Theo đáp án của ngân hàng: chọn A. che phủ hoặc dùng nhà kính để giữ nhiệt thích hợp. Che phủ hoặc nhà kính giúp duy trì nhiệt độ gần khoảng thích hợp. Cần thông gió để tránh quá nóng và ẩm bệnh."},{"number":38,"title":"THỰC HÀNH: QUAN SÁT, MÔ TẢ SỰ SINH TRƯỞNG VÀ PHÁT TRIỂN Ở MỘT SỐ SINH VẬT","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"chu-de-38","summary":"Thực hành quan sát sinh trưởng và phát triển","intro":["Thực hành quan sát sinh trưởng và phát triển"],"forms":[{"title":"Dạng 1. Xác định nội dung quan sát","tip":"Ghi lại thay đổi về kích thước, khối lượng và sự xuất hiện cơ quan mới theo thời gian.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Mục tiêu của Bài 38 là thực hành quan sát và mô tả\nA. sự sinh trưởng và phát triển ở một số sinh vật\nB. quang hợp ở thực vật\nC. hô hấp tế bào\nD. sinh sản vô tính","solution":"Theo đáp án của ngân hàng: chọn A. sự sinh trưởng và phát triển ở một số sinh vật. Ghi lại thay đổi về kích thước, khối lượng và sự xuất hiện cơ quan mới theo thời gian.","trap":"Không chỉ quan sát một thời điểm.","extra":[]},{"title":"Dạng 2. Kiểm soát biến trong thí nghiệm","tip":"Các mẫu cần giống nhau về điều kiện nền để sự khác biệt phản ánh yếu tố đang khảo sát.","example":"Đề bài tham khảo từ ngân hàng ?\nA. Vì đèn làm tăng lượng nước trong đất\nB. Vì đèn làm mất hormone của cây\nC. Vì đèn thay đổi thời gian chiếu sáng, tác động đến quá trình ra hoa\nD. Vì đèn làm rễ ngừng hoạt động","solution":"Theo đáp án của ngân hàng: chọn C. Vì đèn thay đổi thời gian chiếu sáng, tác động đến quá trình ra hoa. Thay đổi thời gian chiếu sáng tác động đến phản ứng quang chu kì và thời điểm ra hoa.","trap":"Không phải ánh sáng chỉ cung cấp năng lượng quang hợp.","extra":[]},{"title":"Dạng 3. Điều chỉnh sinh sản vật nuôi mùa đông","tip":"Bổ sung chiếu sáng hợp lí và khẩu phần phù hợp có thể hỗ trợ duy trì đẻ trứng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một đàn gà mái đẻ ít trứng vào mùa đông dù vẫn khỏe mạnh. Biện pháp phù hợp nhất là\nA. điều chỉnh thời gian chiếu sáng và khẩu phần hợp lí\nB. ngừng cho ăn\nC. giảm nhiệt độ chuồng\nD. tăng mật độ nuôi","solution":"Theo đáp án của ngân hàng: chọn A. điều chỉnh thời gian chiếu sáng và khẩu phần hợp lí. Bổ sung chiếu sáng hợp lí và khẩu phần phù hợp có thể hỗ trợ duy trì đẻ trứng.","trap":"Không kéo dài chiếu sáng quá mức hoặc bỏ qua sức khỏe vật nuôi.","extra":[]}],"searchText":"MỘT SỐ YẾU TỐ ẢNH HƯỞNG VÀ ĐIỀU HÒA, ĐIỀU KHIỂN SINH SẢN Ở SINH VẬT Yếu tố ảnh hưởng và điều khiển sinh sản Dạng 1. Nhận biết các nhóm yếu tố Sinh sản chịu tác động của môi trường và các yếu tố bên trong như hormone, tuổi và trạng thái cơ thể. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Sinh sản ở sinh vật chịu ảnh hưởng của\nA. yếu tố môi trường và yếu tố bên trong cơ thể\nB. chỉ màu sắc cơ thể\nC. chỉ kích thước cơ thể\nD. chỉ nơi sống Theo đáp án của ngân hàng: chọn A. yếu tố môi trường và yếu tố bên trong cơ thể. Sinh sản chịu tác động của môi trường và các yếu tố bên trong như hormone, tuổi và trạng thái cơ thể. Không coi sinh sản hoàn toàn độc lập với điều kiện sống. Dạng 2. Giải thích điều khiển ra hoa bằng ánh sáng Thay đổi thời gian chiếu sáng tác động đến phản ứng quang chu kì và thời điểm ra hoa. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao thắp đèn cho thanh long có thể giúp cây ra hoa trái vụ?\nA. Vì đèn làm tăng lượng nước trong đất\nB. Vì đèn làm mất hormone của cây\nC. Vì đèn thay đổi thời gian chiếu sáng, tác động đến quá trình ra hoa\nD. Vì đèn làm rễ ngừng hoạt động Theo đáp án của ngân hàng: chọn C. Vì đèn thay đổi thời gian chiếu sáng, tác động đến quá trình ra hoa. Thay đổi thời gian chiếu sáng tác động đến phản ứng quang chu kì và thời điểm ra hoa. Không phải ánh sáng chỉ cung cấp năng lượng quang hợp. Dạng 3. Điều chỉnh sinh sản vật nuôi mùa đông Bổ sung chiếu sáng hợp lí và khẩu phần phù hợp có thể hỗ trợ duy trì đẻ trứng. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một đàn gà mái đẻ ít trứng vào mùa đông dù vẫn khỏe mạnh. Biện pháp phù hợp nhất là\nA. điều chỉnh thời gian chiếu sáng và khẩu phần hợp lí\nB. ngừng cho ăn\nC. giảm nhiệt độ chuồng\nD. tăng mật độ nuôi Theo đáp án của ngân hàng: chọn A. điều chỉnh thời gian chiếu sáng và khẩu phần hợp lí. Bổ sung chiếu sáng hợp lí và khẩu phần phù hợp có thể hỗ trợ duy trì đẻ trứng. Không kéo dài chiếu sáng quá mức hoặc bỏ qua sức khỏe vật nuôi."},{"number":42,"title":"CƠ THỂ SINH VẬT LÀ MỘT THỂ THỐNG NHẤT","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"chu-de-42","summary":"Cơ thể sinh vật là một thể thống nhất","intro":["Cơ thể sinh vật là một thể thống nhất"],"forms":[{"title":"Dạng 1. Nhận biết vai trò của tế bào","tip":"Tế bào là đơn vị cấu trúc và chức năng cơ bản của cơ thể sống.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Tế bào được xem là\nA. đơn vị cấu trúc và chức năng cơ bản của cơ thể sống\nB. một cơ quan hoàn chỉnh\nC. một hệ cơ quan\nD. một mô","solution":"Theo đáp án của ngân hàng: chọn A. đơn vị cấu trúc và chức năng cơ bản của cơ thể sống. Tế bào là đơn vị cấu trúc và chức năng cơ bản của cơ thể sống.","trap":"Không coi mô hoặc cơ quan là đơn vị nhỏ nhất của sự sống.","extra":[]},{"title":"Dạng 2. Giải thích tế bào là đơn vị chức năng","tip":"Các hoạt động sống cơ bản như trao đổi chất và chuyển hóa năng lượng diễn ra trong tế bào.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao tế bào được xem là đơn vị chức năng của cơ thể sống?\nA. Vì tế bào chỉ có chức năng tạo hình dạng\nB. Vì tế bào không thực hiện trao đổi chất\nC. Vì các hoạt động sống cơ bản diễn ra ở tế bào\nD. Vì tế bào luôn hoạt động độc lập với cơ thể","solution":"Theo đáp án của ngân hàng: chọn C. Vì các hoạt động sống cơ bản diễn ra ở tế bào. Các hoạt động sống cơ bản như trao đổi chất và chuyển hóa năng lượng diễn ra trong tế bào.","trap":"Cơ quan hoạt động nhờ sự phối hợp của nhiều tế bào.","extra":[]},{"title":"Dạng 3. Phân tích mối liên hệ giữa các hệ cơ quan","tip":"Phổi giảm chức năng làm tế bào nhận ít oxygen, hô hấp tế bào giảm và cơ thể nhanh mệt.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một người bị suy giảm chức năng phổi thường nhanh mệt vì\nA. tế bào nhận ít oxygen nên giải phóng năng lượng giảm\nB. hệ tiêu hoá hoạt động quá mạnh\nC. cơ thể tạo quá nhiều chất hữu cơ\nD. tế bào không cần hô hấp","solution":"Theo đáp án của ngân hàng: chọn A. tế bào nhận ít oxygen nên giải phóng năng lượng giảm. Phổi giảm chức năng làm tế bào nhận ít oxygen, hô hấp tế bào giảm và cơ thể nhanh mệt.","trap":"Không xem từng hệ cơ quan hoạt động hoàn toàn độc lập.","extra":[]}],"searchText":"CƠ THỂ SINH VẬT LÀ MỘT THỂ THỐNG NHẤT Cơ thể sinh vật là một thể thống nhất Dạng 1. Nhận biết vai trò của tế bào Tế bào là đơn vị cấu trúc và chức năng cơ bản của cơ thể sống. Đề bài tham khảo từ ngân hàng:\nCâu 1 (Nhận biết): Tế bào được xem là\nA. đơn vị cấu trúc và chức năng cơ bản của cơ thể sống\nB. một cơ quan hoàn chỉnh\nC. một hệ cơ quan\nD. một mô Theo đáp án của ngân hàng: chọn A. đơn vị cấu trúc và chức năng cơ bản của cơ thể sống. Tế bào là đơn vị cấu trúc và chức năng cơ bản của cơ thể sống. Không coi mô hoặc cơ quan là đơn vị nhỏ nhất của sự sống. Dạng 2. Giải thích tế bào là đơn vị chức năng Các hoạt động sống cơ bản như trao đổi chất và chuyển hóa năng lượng diễn ra trong tế bào. Đề bài tham khảo từ ngân hàng:\nCâu 19 (Thông hiểu): Vì sao tế bào được xem là đơn vị chức năng của cơ thể sống?\nA. Vì tế bào chỉ có chức năng tạo hình dạng\nB. Vì tế bào không thực hiện trao đổi chất\nC. Vì các hoạt động sống cơ bản diễn ra ở tế bào\nD. Vì tế bào luôn hoạt động độc lập với cơ thể Theo đáp án của ngân hàng: chọn C. Vì các hoạt động sống cơ bản diễn ra ở tế bào. Các hoạt động sống cơ bản như trao đổi chất và chuyển hóa năng lượng diễn ra trong tế bào. Cơ quan hoạt động nhờ sự phối hợp của nhiều tế bào. Dạng 3. Phân tích mối liên hệ giữa các hệ cơ quan Phổi giảm chức năng làm tế bào nhận ít oxygen, hô hấp tế bào giảm và cơ thể nhanh mệt. Đề bài tham khảo từ ngân hàng:\nCâu 25 (Vận dụng): Một người bị suy giảm chức năng phổi thường nhanh mệt vì\nA. tế bào nhận ít oxygen nên giải phóng năng lượng giảm\nB. hệ tiêu hoá hoạt động quá mạnh\nC. cơ thể tạo quá nhiều chất hữu cơ\nD. tế bào không cần hô hấp Theo đáp án của ngân hàng: chọn A. tế bào nhận ít oxygen nên giải phóng năng lượng giảm. Phổi giảm chức năng làm tế bào nhận ít oxygen, hô hấp tế bào giảm và cơ thể nhanh mệt. Không xem từng hệ cơ quan hoạt động hoàn toàn độc lập."}],"totalForms":126,"sourceQuestionCount":1260},"8":{"grade":8,"unitLabel":"Bài","shortName":"KHTN 8","description":"Hóa học – Vật lý – Sinh học","subjects":[{"name":"Hóa học","key":"chemistry","short":"Hóa","range":"Bài 1–12","count":12},{"name":"Vật lý","key":"physics","short":"Lý","range":"Bài 13–29","count":17},{"name":"Sinh học","key":"biology","short":"Sinh","range":"Bài 30–47","count":18}],"lessons":[{"number":1,"title":"SỬ DỤNG MỘT SỐ HÓA CHẤT, THIẾT BỊ CƠ BẢN TRONG PHÒNG THÍ NGHIỆM.","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-1","summary":"An toàn và thiết bị phòng thí nghiệm","intro":["An toàn và thiết bị phòng thí nghiệm"],"forms":[{"title":"Dạng 1. Lấy và sử dụng hóa chất an toàn","tip":"Không dùng tay trực tiếp; chất rắn dạng bột lấy bằng thìa sạch, chất lỏng lấy bằng ống hút nhỏ giọt.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 12: Cách lấy hóa chất dạng bột ra khỏi lọ đựng hóa chất?\nA. Dùng panh, kẹp.\nB. Dùng tay\nC. Dùng thìa kim loại hoặc thủy tinh.\nD. Đổ trực tiếp","solution":"Theo đáp án của ngân hàng: chọn C. Dùng thìa kim loại hoặc thủy tinh. Không dùng tay trực tiếp; chất rắn dạng bột lấy bằng thìa sạch, chất lỏng lấy bằng ống hút nhỏ giọt.","trap":"Không đổ hóa chất thừa trở lại lọ vì dễ làm nhiễm bẩn hóa chất gốc.","extra":[]},{"title":"Dạng 2. Xử lí hóa chất sau thí nghiệm","tip":"Hóa chất thừa và chất thải phải xử lí theo hướng dẫn của giáo viên hoặc quy định phòng thí nghiệm.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 13: Xử lí hóa chất thừa sau khi dùng xong?\nA. Đổ ngược lại vào lọ hóa chất.\nB. Đổ ra ngoài thùng rác\nC. Xử lí theo hướng dẫn giáo viên.\nD. Có thể mang về tự thí nghiệm tại nhà","solution":"Theo đáp án của ngân hàng: chọn C. Xử lí theo hướng dẫn giáo viên. Hóa chất thừa và chất thải phải xử lí theo hướng dẫn của giáo viên hoặc quy định phòng thí nghiệm.","trap":"Không tự ý đổ ra bồn rửa, thùng rác hoặc mang về nhà.","extra":[]},{"title":"Dạng 3. Nhận biết chức năng thiết bị đo","tip":"Đọc đúng đại lượng mà thiết bị đo được; Joulemeter có thể đo dòng điện, điện áp, công suất và năng lượng điện.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 3: Joulemeter là gì?\nA. Thiết bị đo dòng điện, điện áp, công suất và năng lượng điện cung cấp cho mạch điện.\nB. Thiết bị đo điện áp\nC. Thiết bọ đo dòng điện\nD. Thiết bọ đo công suất và năng lượng điện cung cấp cho mạch điện","solution":"Theo đáp án của ngân hàng: chọn A. Thiết bị đo dòng điện, điện áp, công suất và năng lượng điện cung cấp cho mạch điện. Đọc đúng đại lượng mà thiết bị đo được; Joulemeter có thể đo dòng điện, điện áp, công suất và năng lượng điện.","trap":"Không nhầm Joulemeter với ampe kế hoặc vôn kế chỉ đo một đại lượng.","extra":[]}],"searchText":"SỬ DỤNG MỘT SỐ HÓA CHẤT, THIẾT BỊ CƠ BẢN TRONG PHÒNG THÍ NGHIỆM. An toàn và thiết bị phòng thí nghiệm Dạng 1. Lấy và sử dụng hóa chất an toàn Không dùng tay trực tiếp; chất rắn dạng bột lấy bằng thìa sạch, chất lỏng lấy bằng ống hút nhỏ giọt. Đề bài tham khảo từ ngân hàng:\nCâu 12: Cách lấy hóa chất dạng bột ra khỏi lọ đựng hóa chất?\nA. Dùng panh, kẹp.\nB. Dùng tay\nC. Dùng thìa kim loại hoặc thủy tinh.\nD. Đổ trực tiếp Theo đáp án của ngân hàng: chọn C. Dùng thìa kim loại hoặc thủy tinh. Không dùng tay trực tiếp; chất rắn dạng bột lấy bằng thìa sạch, chất lỏng lấy bằng ống hút nhỏ giọt. Không đổ hóa chất thừa trở lại lọ vì dễ làm nhiễm bẩn hóa chất gốc. Dạng 2. Xử lí hóa chất sau thí nghiệm Hóa chất thừa và chất thải phải xử lí theo hướng dẫn của giáo viên hoặc quy định phòng thí nghiệm. Đề bài tham khảo từ ngân hàng:\nCâu 13: Xử lí hóa chất thừa sau khi dùng xong?\nA. Đổ ngược lại vào lọ hóa chất.\nB. Đổ ra ngoài thùng rác\nC. Xử lí theo hướng dẫn giáo viên.\nD. Có thể mang về tự thí nghiệm tại nhà Theo đáp án của ngân hàng: chọn C. Xử lí theo hướng dẫn giáo viên. Hóa chất thừa và chất thải phải xử lí theo hướng dẫn của giáo viên hoặc quy định phòng thí nghiệm. Không tự ý đổ ra bồn rửa, thùng rác hoặc mang về nhà. Dạng 3. Nhận biết chức năng thiết bị đo Đọc đúng đại lượng mà thiết bị đo được; Joulemeter có thể đo dòng điện, điện áp, công suất và năng lượng điện. Đề bài tham khảo từ ngân hàng:\nCâu 3: Joulemeter là gì?\nA. Thiết bị đo dòng điện, điện áp, công suất và năng lượng điện cung cấp cho mạch điện.\nB. Thiết bị đo điện áp\nC. Thiết bọ đo dòng điện\nD. Thiết bọ đo công suất và năng lượng điện cung cấp cho mạch điện Theo đáp án của ngân hàng: chọn A. Thiết bị đo dòng điện, điện áp, công suất và năng lượng điện cung cấp cho mạch điện. Đọc đúng đại lượng mà thiết bị đo được; Joulemeter có thể đo dòng điện, điện áp, công suất và năng lượng điện. Không nhầm Joulemeter với ampe kế hoặc vôn kế chỉ đo một đại lượng."},{"number":2,"title":"PHẢN ỨNG HÓA HỌC","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-2","summary":"Nhận biết phản ứng hóa học và biến đổi năng lượng","intro":["Nhận biết phản ứng hóa học và biến đổi năng lượng"],"forms":[{"title":"Dạng 1. Phân biệt biến đổi vật lí và hóa học","tip":"Nếu không tạo chất mới thì là biến đổi vật lí; nếu xuất hiện chất có tính chất mới thì là biến đổi hóa học.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 8: Hòa tan đường vào nước là:\nA. Phản ứng hóa học.\nB. Phản ứng tỏa nhiệt.\nC. Phản ứng thu nhiệt.\nD. Sự biến đổi vật lí.","solution":"Theo đáp án của ngân hàng: chọn D. Sự biến đổi vật lí. Nếu không tạo chất mới thì là biến đổi vật lí; nếu xuất hiện chất có tính chất mới thì là biến đổi hóa học.","trap":"Thay đổi trạng thái hoặc hòa tan chưa đủ để kết luận có phản ứng hóa học.","extra":[]},{"title":"Dạng 2. Nhận biết dấu hiệu phản ứng","tip":"Dấu hiệu thường gặp: có khí thoát ra, kết tủa, đổi màu, phát sáng hoặc thay đổi nhiệt độ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21: Dấu hiệu nào giúp ta có khẳng định có phản ứng hoá học xảy ra?\nA. Có chất kết tủa (chất không tan).\nB. Có chất khí thoát ra (sủi bọt).\nC. Có sự thay đổi màu sắc.\nD. Một trong số các dấu hiệu trên.","solution":"Theo đáp án của ngân hàng: chọn D. Một trong số các dấu hiệu trên. Dấu hiệu thường gặp: có khí thoát ra, kết tủa, đổi màu, phát sáng hoặc thay đổi nhiệt độ.","trap":"Không coi mọi hiện tượng nóng lên hay tan ra đều chắc chắn là phản ứng nếu chưa xét chất mới.","extra":[]},{"title":"Dạng 3. Phân biệt phản ứng tỏa nhiệt và thu nhiệt","tip":"Cần cung cấp nhiệt liên tục để phản ứng xảy ra thường là phản ứng thu nhiệt; phản ứng làm môi trường nóng lên thường là tỏa nhiệt.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19: Quá trình nung đá vôi (thành phần chính là calcium carbonate: CaCO3) thành vôi sống (calcium oxide: CaO) và khí carbon dioxide (CO2) cần cung cấp năng lượng (dạng nhiệt). Đây là phản ứng gì?\nA. Tỏa nhiệt.\nB. Thu nhiệt.\nC. Vật lí.\nD. Vừa tảo nhiệt vừa thu nhiệt.","solution":"Theo đáp án của ngân hàng: chọn B. Thu nhiệt. Cần cung cấp nhiệt liên tục để phản ứng xảy ra thường là phản ứng thu nhiệt; phản ứng làm môi trường nóng lên thường là tỏa nhiệt.","trap":"Không đồng nhất phản ứng phân hủy với phản ứng tỏa nhiệt.","extra":[]}],"searchText":"PHẢN ỨNG HÓA HỌC Nhận biết phản ứng hóa học và biến đổi năng lượng Dạng 1. Phân biệt biến đổi vật lí và hóa học Nếu không tạo chất mới thì là biến đổi vật lí; nếu xuất hiện chất có tính chất mới thì là biến đổi hóa học. Đề bài tham khảo từ ngân hàng:\nCâu 8: Hòa tan đường vào nước là:\nA. Phản ứng hóa học.\nB. Phản ứng tỏa nhiệt.\nC. Phản ứng thu nhiệt.\nD. Sự biến đổi vật lí. Theo đáp án của ngân hàng: chọn D. Sự biến đổi vật lí. Nếu không tạo chất mới thì là biến đổi vật lí; nếu xuất hiện chất có tính chất mới thì là biến đổi hóa học. Thay đổi trạng thái hoặc hòa tan chưa đủ để kết luận có phản ứng hóa học. Dạng 2. Nhận biết dấu hiệu phản ứng Dấu hiệu thường gặp: có khí thoát ra, kết tủa, đổi màu, phát sáng hoặc thay đổi nhiệt độ. Đề bài tham khảo từ ngân hàng:\nCâu 21: Dấu hiệu nào giúp ta có khẳng định có phản ứng hoá học xảy ra?\nA. Có chất kết tủa (chất không tan).\nB. Có chất khí thoát ra (sủi bọt).\nC. Có sự thay đổi màu sắc.\nD. Một trong số các dấu hiệu trên. Theo đáp án của ngân hàng: chọn D. Một trong số các dấu hiệu trên. Dấu hiệu thường gặp: có khí thoát ra, kết tủa, đổi màu, phát sáng hoặc thay đổi nhiệt độ. Không coi mọi hiện tượng nóng lên hay tan ra đều chắc chắn là phản ứng nếu chưa xét chất mới. Dạng 3. Phân biệt phản ứng tỏa nhiệt và thu nhiệt Cần cung cấp nhiệt liên tục để phản ứng xảy ra thường là phản ứng thu nhiệt; phản ứng làm môi trường nóng lên thường là tỏa nhiệt. Đề bài tham khảo từ ngân hàng:\nCâu 19: Quá trình nung đá vôi (thành phần chính là calcium carbonate: CaCO3) thành vôi sống (calcium oxide: CaO) và khí carbon dioxide (CO2) cần cung cấp năng lượng (dạng nhiệt). Đây là phản ứng gì?\nA. Tỏa nhiệt.\nB. Thu nhiệt.\nC. Vật lí.\nD. Vừa tảo nhiệt vừa thu nhiệt. Theo đáp án của ngân hàng: chọn B. Thu nhiệt. Cần cung cấp nhiệt liên tục để phản ứng xảy ra thường là phản ứng thu nhiệt; phản ứng làm môi trường nóng lên thường là tỏa nhiệt. Không đồng nhất phản ứng phân hủy với phản ứng tỏa nhiệt."},{"number":3,"title":"MOL VÀ TỈ KHỐI CHẤT KHÍ","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-3","summary":"Mol, thể tích mol và tỉ khối chất khí","intro":["Mol, thể tích mol và tỉ khối chất khí"],"forms":[{"title":"Dạng 1. Đổi giữa số mol và thể tích khí","tip":"Ở điều kiện chuẩn dùng V = n × 24,79 L/mol theo quy ước của nguồn; đọc đúng điều kiện đề bài.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 2: Ở 25 oC và 1 bar, 1,5 mol khí chiếm thể tích bao nhiêu?\nA. 31.587 l.\nB. 35,187 l.\nC. 38,175 l.\nD. 37,185 l","solution":"Theo đáp án của ngân hàng: chọn D. 37,185 l Tính V = 1,5 × 24,79 = 37,185 L.","trap":"Không dùng 22,4 L/mol khi đề nêu 25 °C và 1 bar hoặc điều kiện chuẩn theo sách mới.","extra":[]},{"title":"Dạng 2. Tính khối lượng mol từ tỉ khối","tip":"Dùng dA/B = MA/MB và dB/kk = MB/29; nhân các tỉ số để tìm MA.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 16: Cho tỉ khối của khí A đối với khí B là 2,125 và tỉ khối của khí B đối với không khí là 0,5. Khối lượng mol của khí A là:\nA. 33\nB. 34\nC. 68\nD. 34,5","solution":"Theo đáp án của ngân hàng: chọn B. 34 MA = dA/B × dB/kk × 29 = 2,125 × 0,5 × 29 ≈ 30,8 g/mol; đối chiếu phương án và quy ước nguồn.","trap":"Không đảo tử số và mẫu số của tỉ khối.","extra":[]},{"title":"Dạng 3. Chọn cách thu khí theo khối lượng riêng","tip":"Khí nhẹ hơn không khí thường thu bằng bình úp; khí nặng hơn không khí thường thu bằng bình đứng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 18: Có thể thu khí N2 bằng cách nào\nA. Đặt đứng bình.\nB. Đặt úp bình.\nC. Đặt ngang bình.\nD. Cách nào cũng được.","solution":"Theo đáp án của ngân hàng: chọn B. Đặt úp bình. Khí nhẹ hơn không khí thường thu bằng bình úp; khí nặng hơn không khí thường thu bằng bình đứng.","trap":"Còn phải xét độ tan và phản ứng của khí với không khí hoặc nước.","extra":[]}],"searchText":"MOL VÀ TỈ KHỐI CHẤT KHÍ Mol, thể tích mol và tỉ khối chất khí Dạng 1. Đổi giữa số mol và thể tích khí Ở điều kiện chuẩn dùng V = n × 24,79 L/mol theo quy ước của nguồn; đọc đúng điều kiện đề bài. Đề bài tham khảo từ ngân hàng:\nCâu 2: Ở 25 oC và 1 bar, 1,5 mol khí chiếm thể tích bao nhiêu?\nA. 31.587 l.\nB. 35,187 l.\nC. 38,175 l.\nD. 37,185 l Theo đáp án của ngân hàng: chọn D. 37,185 l Tính V = 1,5 × 24,79 = 37,185 L. Không dùng 22,4 L/mol khi đề nêu 25 °C và 1 bar hoặc điều kiện chuẩn theo sách mới. Dạng 2. Tính khối lượng mol từ tỉ khối Dùng dA/B = MA/MB và dB/kk = MB/29; nhân các tỉ số để tìm MA. Đề bài tham khảo từ ngân hàng:\nCâu 16: Cho tỉ khối của khí A đối với khí B là 2,125 và tỉ khối của khí B đối với không khí là 0,5. Khối lượng mol của khí A là:\nA. 33\nB. 34\nC. 68\nD. 34,5 Theo đáp án của ngân hàng: chọn B. 34 MA = dA/B × dB/kk × 29 = 2,125 × 0,5 × 29 ≈ 30,8 g/mol; đối chiếu phương án và quy ước nguồn. Không đảo tử số và mẫu số của tỉ khối. Dạng 3. Chọn cách thu khí theo khối lượng riêng Khí nhẹ hơn không khí thường thu bằng bình úp; khí nặng hơn không khí thường thu bằng bình đứng. Đề bài tham khảo từ ngân hàng:\nCâu 18: Có thể thu khí N2 bằng cách nào\nA. Đặt đứng bình.\nB. Đặt úp bình.\nC. Đặt ngang bình.\nD. Cách nào cũng được. Theo đáp án của ngân hàng: chọn B. Đặt úp bình. Khí nhẹ hơn không khí thường thu bằng bình úp; khí nặng hơn không khí thường thu bằng bình đứng. Còn phải xét độ tan và phản ứng của khí với không khí hoặc nước."},{"number":4,"title":"DUNG DỊCH VÀ NỒNG ĐỘ.","subject":"Hóa học","subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-4","summary":"Dung dịch, độ tan và nồng độ","intro":["Dung dịch, độ tan và nồng độ"],"forms":[{"title":"Dạng 1. Tính nồng độ phần trăm","tip":"C% = m chất tan / m dung dịch × 100%; suy ra m dung dịch = m chất tan × 100/C%.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 5: Hòa tan 40g đường với nước được dung dịch đường 20%. Tính khối lượng dung dịch đường thu được\nA. 150 gam.\nB. 170 gam.\nC. 200 gam.\nD. 250 gam.","solution":"Theo đáp án của ngân hàng: chọn C. 200 gam. m dung dịch = 40 × 100/20 = 200 g.","trap":"Không lấy khối lượng nước làm khối lượng dung dịch.","extra":[]},{"title":"Dạng 2. Tính nồng độ mol","tip":"Đổi thể tích sang lít rồi dùng CM = n/V; số mol n = m/M.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 13: Trong 200 ml dung dịch có hòa tan 8,5 gam sodium nitrate (NaNO3). Nồng độ mol của dung dịch là\nA. 0,2M.\nB. 0,3M.\nC. 0,4M.\nD. 0,5M.","solution":"Theo đáp án của ngân hàng: chọn D. 0,5M. nNaNO3 = 8,5/85 = 0,1 mol; V = 0,2 L; CM = 0,5 M.","trap":"Không để thể tích ở đơn vị mL khi thay vào công thức.","extra":[]},{"title":"Dạng 3. Tính độ tan","tip":"Khối lượng đã tan = khối lượng cho vào − khối lượng còn lại; S = m tan/m nước × 100.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22: Ở nhiệt độ 25 oC, khi cho 12 gam muối X vào 20 gam nước, khuấy kĩ thì còn lại 5 gam muối không tan. Tính độ tan của muối X.\nA. 35\nB. 36\nC. 37\nD. 38","solution":"Theo đáp án của ngân hàng: chọn A. 35 m tan = 12 − 5 = 7 g; S = 7/20 × 100 = 35 g/100 g nước.","trap":"Không dùng toàn bộ khối lượng chất rắn ban đầu nếu còn chất không tan.","extra":[]}],"searchText":"DUNG DỊCH VÀ NỒNG ĐỘ. Dung dịch, độ tan và nồng độ Dạng 1. Tính nồng độ phần trăm C% = m chất tan / m dung dịch × 100%; suy ra m dung dịch = m chất tan × 100/C%. Đề bài tham khảo từ ngân hàng:\nCâu 5: Hòa tan 40g đường với nước được dung dịch đường 20%. Tính khối lượng dung dịch đường thu được\nA. 150 gam.\nB. 170 gam.\nC. 200 gam.\nD. 250 gam. Theo đáp án của ngân hàng: chọn C. 200 gam. m dung dịch = 40 × 100/20 = 200 g. Không lấy khối lượng nước làm khối lượng dung dịch. Dạng 2. Tính nồng độ mol Đổi thể tích sang lít rồi dùng CM = n/V; số mol n = m/M. Đề bài tham khảo từ ngân hàng:\nCâu 13: Trong 200 ml dung dịch có hòa tan
