ộc tinh bột, không thuộc protein. Theo Câu 18 có 5 phát biểu về thành phần, thủy phân, phân hủy nhiệt, ứng dụng và nhận biết. Các phát biểu (1), (2), (3), (4) đúng; phát biểu (5) sai vì iodine nhận biết tinh bột. Có 4 phát biểu đúng. Không đọc cả đoạn theo cảm tính; tách từng mệnh đề và đối chiếu một từ khóa.  Dạng 2. Suy luận hiện tượng đông tụ – biến tính Gặp nhiệt độ cao, acid hoặc một số hóa chất: ưu tiên đáp án “protein biến tính, kết tụ/đông tụ”. Theo Câu 19: Lòng trắng trứng đông lại khi đun nóng. Chọn “protein bị biến tính và kết tụ”. Đây là biến đổi cấu trúc protein, không phải tạo glucose hay DNA. “Đông tụ” là hiện tượng; “thủy phân” tạo amino acid và cần điều kiện phản ứng khác. "},{"number":32,"title":"POLYMER","subject":"Hóa học","intro":["Bài toán tập trung vào hệ số trùng hợp, mắt xích và hiệu suất chuyển monomer thành polymer."],"forms":[{"title":"Dạng 1. Tính hệ số trùng hợp","tip":"Lấy phân tử khối polymer chia phân tử khối một mắt xích.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 16 [NB]. Polyethylene có khối lượng phân tử 14000 amu. Hệ số trùng hợp n là\nA. 300\nB. 200\nC. 100\nD. 500","solution":"n=14000/28=500.","trap":"Không lấy M của cả đoạn mạch minh họa; chỉ dùng một mắt xích lặp lại nhỏ nhất.","extra":[],"exampleQuestionNumber":16},{"title":"Dạng 2. Hệ số polymer hóa PVC","tip":"M mắt xích PVC = 2·12+3·1+35,5=62,5.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 17 [NB]. Khối lượng phân tử trung bình của PVC là 750000. Hệ số polime hóa của PVC là bao nhiêu?\nA. 12000.\nB. 13000.\nC. 15000.\nD. 10000.","solution":"n=750000/62,5=12000.","trap":"Nếu dùng Cl=35,5 mới khớp dữ kiện; không làm tròn Cl thành 36.","extra":[],"exampleQuestionNumber":17},{"title":"Dạng 3. Khối lượng polymer từ monomer và hiệu suất","tip":"Vì trùng hợp cộng không tách chất nhỏ, khối lượng bảo toàn. m polymer=m monomer tinh khiết·H.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Trùng hợp 0,5 tấn ethylene với hiệu suất 90% thì khối lượng polyethylene thu được là\nA. 0,5 tấn.\nB. 5 tấn.\nC. 0,45 tấn.\nD. 4,5 tấn.","solution":"mPE=0,5·0,90=0,45 tấn.","trap":"Hệ số trùng hợp không ảnh hưởng tổng khối lượng polymer.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 4. Tính ngược lượng monomer","tip":"m monomer cần = m polymer yêu cầu/H.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Để thu được 1 tấn PVC thì khối lượng vinyl chloride cần dùng là (hiệu suất phản ứng là 90%)\nA. 0,9 tấn.\nB. 0,1 tấn.\nC. 1 tấn.\nD. 1,11 tấn.","solution":"m vinyl chloride=1/0,90=1,11 tấn.","trap":"Bài tính nguyên liệu đầu vào phải chia hiệu suất.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 5. Monomer là khí – đổi thể tích rồi tính polymer","tip":"Đổi V khí thành mol, tính khối lượng monomer, rồi nhân hiệu suất. Không cần dùng n polymer.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Trùng hợp 2,479 lít C2H4 (đkc), nếu hiệu suất phản ứng là 80% thì khối lượng polymer thu được là bao nhiêu? Biết hệ số trùng hợp là 500.\nA. 2,80 gam.\nB. 3,36 gam.\nC. 2,24 gam.\nD. 4,48 gam.","solution":"nC₂H₄=2,479/24,79=0,10 mol ⇒ m monomer=2,8 g ⇒ m polymer=2,8·0,80=2,24 g.","trap":"Dữ kiện hệ số trùng hợp 500 là dữ kiện gây nhiễu đối với câu hỏi khối lượng.","extra":[],"exampleQuestionNumber":21}],"subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-32","summary":"Bài toán tập trung vào hệ số trùng hợp, mắt xích và hiệu suất chuyển monomer thành polymer.","searchText":"POLYMER Bài toán tập trung vào hệ số trùng hợp, mắt xích và hiệu suất chuyển monomer thành polymer. Dạng 1. Tính hệ số trùng hợp Lấy phân tử khối polymer chia phân tử khối một mắt xích. Theo Câu 16: PE có M=14000. n=14000/28=500. Không lấy M của cả đoạn mạch minh họa; chỉ dùng một mắt xích lặp lại nhỏ nhất.  Dạng 2. Hệ số polymer hóa PVC M mắt xích PVC = 2·12+3·1+35,5=62,5. Theo Câu 17: M trung bình PVC=750000. n=750000/62,5=12000. Nếu dùng Cl=35,5 mới khớp dữ kiện; không làm tròn Cl thành 36.  Dạng 3. Khối lượng polymer từ monomer và hiệu suất Vì trùng hợp cộng không tách chất nhỏ, khối lượng bảo toàn. m polymer=m monomer tinh khiết·H. Theo Câu 19: Trùng hợp 0,5 tấn ethylene, hiệu suất 90%. mPE=0,5·0,90=0,45 tấn. Hệ số trùng hợp không ảnh hưởng tổng khối lượng polymer.  Dạng 4. Tính ngược lượng monomer m monomer cần = m polymer yêu cầu/H. Theo Câu 20: Cần 1 tấn PVC, hiệu suất 90%. m vinyl chloride=1/0,90=1,11 tấn. Bài tính nguyên liệu đầu vào phải chia hiệu suất.  Dạng 5. Monomer là khí – đổi thể tích rồi tính polymer Đổi V khí thành mol, tính khối lượng monomer, rồi nhân hiệu suất. Không cần dùng n polymer. Theo Câu 21: 2,479 L C₂H₄, hiệu suất 80%, hệ số trùng hợp 500. nC₂H₄=2,479/24,79=0,10 mol ⇒ m monomer=2,8 g ⇒ m polymer=2,8·0,80=2,24 g. Dữ kiện hệ số trùng hợp 500 là dữ kiện gây nhiễu đối với câu hỏi khối lượng. "},{"number":33,"title":"HÓA HỌC VỎ TRÁI ĐẤT VÀ KHAI THÁC TÀI NGUYÊN","subject":"Hóa học","intro":["Nguồn chủ yếu là câu hỏi định tính. Dạng số gần nhất là hàm lượng chất có ích trước và sau tuyển quặng."],"forms":[{"title":"Dạng 1. Nhận biết mục tiêu của tuyển quặng","tip":"Tuyển quặng làm tăng hàm lượng chất có ích và giảm phần tạp chất; không làm tăng lượng chất có ích nếu không có quá trình bổ sung.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24 [TH]. Quặng có 20% chất có ích, sau tuyển đạt 60%. Mục tiêu của tuyển quặng đã đạt là\nA. tăng tổng khối lượng quặng nguyên khai.\nB. biến chất có ích thành tạp chất.\nC. làm mất hoàn toàn khoáng vật.\nD. tăng hàm lượng chất có ích.","solution":"Mục tiêu đạt được là tăng hàm lượng chất có ích. Chọn đáp án nói về “làm giàu quặng”, không chọn “tăng tổng khối lượng quặng”.","trap":"Phần trăm tăng không đồng nghĩa khối lượng chất có ích tự tăng.","extra":[],"exampleQuestionNumber":24},{"title":"Dạng 2. Tính khối lượng quặng tinh sau tuyển  [Mở rộng thường gặp]","tip":"Nếu giả sử không thất thoát chất có ích, dùng m₁w₁=m₂w₂.","example":"Đề bài mở rộng:\nMột mỏ có 100 kg quặng ban đầu chứa 20% khoáng vật có ích. Sau quá trình tuyển quặng, hàm lượng khoáng vật có ích trong quặng tinh đạt 60%. Giả sử toàn bộ khoáng vật có ích được thu hồi, hãy tính khối lượng quặng tinh thu được và khối lượng tạp chất đã loại bỏ.","solution":"Khối lượng chất có ích=100·20%=20 kg. m quặng tinh=20/60%=33,33 kg. Phần loại bỏ=66,67 kg.","trap":"Đây là dạng mở rộng thường gặp; câu nguồn chỉ hỏi mục tiêu định tính.","extra":[]}],"subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-33","summary":"Nguồn chủ yếu là câu hỏi định tính. Dạng số gần nhất là hàm lượng chất có ích trước và sau tuyển quặng.","searchText":"HÓA HỌC VỎ TRÁI ĐẤT VÀ KHAI THÁC TÀI NGUYÊN Nguồn chủ yếu là câu hỏi định tính. Dạng số gần nhất là hàm lượng chất có ích trước và sau tuyển quặng. Dạng 1. Nhận biết mục tiêu của tuyển quặng Tuyển quặng làm tăng hàm lượng chất có ích và giảm phần tạp chất; không làm tăng lượng chất có ích nếu không có quá trình bổ sung. Theo Câu 24: Quặng từ 20% chất có ích được tuyển lên 60%. Mục tiêu đạt được là tăng hàm lượng chất có ích. Chọn đáp án nói về “làm giàu quặng”, không chọn “tăng tổng khối lượng quặng”. Phần trăm tăng không đồng nghĩa khối lượng chất có ích tự tăng.  Dạng 2. Tính khối lượng quặng tinh sau tuyển  [Mở rộng thường gặp] Nếu giả sử không thất thoát chất có ích, dùng m₁w₁=m₂w₂. Mở rộng từ dữ kiện 20% → 60%: Có 100 kg quặng ban đầu, hỏi khối lượng quặng tinh. Khối lượng chất có ích=100·20%=20 kg. m quặng tinh=20/60%=33,33 kg. Phần loại bỏ=66,67 kg. Đây là dạng mở rộng thường gặp; câu nguồn chỉ hỏi mục tiêu định tính. "},{"number":34,"title":"KHAI THÁC ĐÁ VÔI – CÔNG NGHIỆP SILICATE","subject":"Hóa học","intro":["Dạng tính cơ bản dựa trên phản ứng nhiệt phân CaCO₃ và các phản ứng CO₂ với nước vôi."],"forms":[{"title":"Dạng 1. Tính nhanh sản phẩm nung đá vôi","tip":"Học thuộc tỉ lệ 100 : 56 : 44. Từ CaCO₃ nhân 0,56 để ra CaO; nhân 0,44 để ra CO₂.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Nung 100 kg CaCO₃ tinh khiết, theo lí thuyết thu được khoảng 56 kg CaO. Khối lượng còn lại chủ yếu thoát ra dưới dạng\nA. Cl₂.\nB. O₂.\nC. CO₂.\nD. H₂.","solution":"Khối lượng còn lại=100−56=44 kg, thoát ra dưới dạng CO₂.","trap":"Khối lượng không mất đi; phần giảm của chất rắn là khí CO₂ thoát ra.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 2. Đá vôi có tạp chất hoặc hiệu suất  [Mở rộng thường gặp]","tip":"mCaO thực tế = m mẫu·%CaCO₃·56/100·H. Bài tính ngược thì chia các hệ số phần trăm.","example":"Đề bài mở rộng:\nNung 200 kg đá vôi chứa 80% CaCO₃ theo phản ứng CaCO₃ → CaO + CO₂. Hiệu suất phản ứng đạt 90%. Cho M(CaCO₃) = 100 g/mol và M(CaO) = 56 g/mol. Hãy tính khối lượng CaO thực tế thu được.","solution":"mCaO=200·0,80·0,56·0,90=80,64 kg.","trap":"Đây là dạng mở rộng; ngân hàng hiện chỉ cho trường hợp CaCO₃ tinh khiết.","extra":[]},{"title":"Dạng 3. CO₂ qua nước vôi trong  [Mở rộng thường gặp]","tip":"CO₂ vừa đủ: nCaCO₃=nCO₂. CO₂ dư có thể hòa tan kết tủa tạo Ca(HCO₃)₂.","example":"Đề bài mở rộng:\nDẫn 2,479 L khí CO₂ ở điều kiện chuẩn vào dung dịch Ca(OH)₂ dư. Biết thể tích mol khí ở điều kiện này là 24,79 L/mol và phản ứng xảy ra hoàn toàn. Hãy tính khối lượng kết tủa CaCO₃ thu được.","solution":"nCO₂=0,10 mol ⇒ nCaCO₃=0,10 ⇒ m kết tủa=10 g.","trap":"Chỉ dùng tỉ lệ 1:1 khi Ca(OH)₂ dư và CO₂ không dư đến mức hòa tan kết tủa.","extra":[]}],"subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-34","summary":"Dạng tính cơ bản dựa trên phản ứng nhiệt phân CaCO₃ và các phản ứng CO₂ với nước vôi.","searchText":"KHAI THÁC ĐÁ VÔI – CÔNG NGHIỆP SILICATE Dạng tính cơ bản dựa trên phản ứng nhiệt phân CaCO₃ và các phản ứng CO₂ với nước vôi. Dạng 1. Tính nhanh sản phẩm nung đá vôi Học thuộc tỉ lệ 100 : 56 : 44. Từ CaCO₃ nhân 0,56 để ra CaO; nhân 0,44 để ra CO₂. Theo Câu 19: Nung 100 kg CaCO₃ tinh khiết thu khoảng 56 kg CaO. Khối lượng còn lại=100−56=44 kg, thoát ra dưới dạng CO₂. Khối lượng không mất đi; phần giảm của chất rắn là khí CO₂ thoát ra.  Dạng 2. Đá vôi có tạp chất hoặc hiệu suất  [Mở rộng thường gặp] mCaO thực tế = m mẫu·%CaCO₃·56/100·H. Bài tính ngược thì chia các hệ số phần trăm. Mở rộng: Nung 200 kg đá vôi chứa 80% CaCO₃, hiệu suất 90%. mCaO=200·0,80·0,56·0,90=80,64 kg. Đây là dạng mở rộng; ngân hàng hiện chỉ cho trường hợp CaCO₃ tinh khiết.  Dạng 3. CO₂ qua nước vôi trong  [Mở rộng thường gặp] CO₂ vừa đủ: nCaCO₃=nCO₂. CO₂ dư có thể hòa tan kết tủa tạo Ca(HCO₃)₂. Mở rộng: Dẫn 2,479 L CO₂ ở đkc vào Ca(OH)₂ dư. nCO₂=0,10 mol ⇒ nCaCO₃=0,10 ⇒ m kết tủa=10 g. Chỉ dùng tỉ lệ 1:1 khi Ca(OH)₂ dư và CO₂ không dư đến mức hòa tan kết tủa. "},{"number":35,"title":"NGUỒN CARBON – CHU TRÌNH CARBON – ẤM LÊN TOÀN CẦU","subject":"Hóa học","intro":["Phần này gần như không có hóa toán phức tạp; dạng số chính là cân bằng phát thải – hấp thụ và tổng dấu chân carbon."],"forms":[{"title":"Dạng 1. Cân bằng phát thải ròng","tip":"Chọn một chiều quy ước: phát thải là dương, hấp thụ là âm. Lấy phát thải trừ hấp thụ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Một khu rừng hấp thụ 100 tấn CO₂ nhưng cháy giải phóng 150 tấn. Cân bằng ròng là\nA. hấp thụ 250 tấn.\nB. hấp thụ 50 tấn.\nC. phát thải 50 tấn CO₂.\nD. không đổi.","solution":"Phát thải ròng=150−100=50 tấn CO₂. Chọn “phát thải 50 tấn”.","trap":"Không cộng 100+150 vì hai dòng carbon ngược chiều.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 2. Tổng dấu chân carbon của một hoạt động  [Mở rộng thường gặp]","tip":"Cộng phát thải ở các giai đoạn: sản xuất, vận chuyển, sử dụng và xử lí cuối vòng đời; sau đó trừ phần hấp thụ hoặc bù trừ đáng tin cậy.","example":"Đề bài mở rộng:\nMột sản phẩm phát thải 40 kg CO₂e trong giai đoạn sản xuất, 15 kg CO₂e khi vận chuyển và 20 kg CO₂e trong quá trình sử dụng. Hoạt động tái chế cuối vòng đời giúp tránh phát thải 5 kg CO₂e. Hãy tính dấu chân carbon ròng của sản phẩm.","solution":"Dấu chân ròng=40+15+20−5=70 kg CO₂e.","trap":"Chỉ trừ khoản “tránh phát thải/bù trừ” khi đề cho rõ và có cùng đơn vị CO₂e.","extra":[]}],"subjectKey":"chemistry","shortSubject":"Hóa","slug":"bai-35","summary":"Phần này gần như không có hóa toán phức tạp; dạng số chính là cân bằng phát thải – hấp thụ và tổng dấu chân carbon.","searchText":"NGUỒN CARBON – CHU TRÌNH CARBON – ẤM LÊN TOÀN CẦU Phần này gần như không có hóa toán phức tạp; dạng số chính là cân bằng phát thải – hấp thụ và tổng dấu chân carbon. Dạng 1. Cân bằng phát thải ròng Chọn một chiều quy ước: phát thải là dương, hấp thụ là âm. Lấy phát thải trừ hấp thụ. Theo Câu 19: Rừng hấp thụ 100 tấn CO₂ nhưng cháy giải phóng 150 tấn. Phát thải ròng=150−100=50 tấn CO₂. Chọn “phát thải 50 tấn”. Không cộng 100+150 vì hai dòng carbon ngược chiều.  Dạng 2. Tổng dấu chân carbon của một hoạt động  [Mở rộng thường gặp] Cộng phát thải ở các giai đoạn: sản xuất, vận chuyển, sử dụng và xử lí cuối vòng đời; sau đó trừ phần hấp thụ hoặc bù trừ đáng tin cậy. Mở rộng từ Câu 23: Sản xuất 40 kg CO₂e, vận chuyển 15, sử dụng 20, tái chế giúp tránh 5. Dấu chân ròng=40+15+20−5=70 kg CO₂e. Chỉ trừ khoản “tránh phát thải/bù trừ” khi đề cho rõ và có cùng đơn vị CO₂e. "},{"number":36,"title":"KHÁI QUÁT VỀ DI TRUYỀN HỌC","subject":"Sinh học","intro":[],"forms":[{"title":"Dạng 1. Phân biệt di truyền và biến dị","tip":"“Giống thế hệ trước” → di truyền; “khác nhau giữa con và bố mẹ hoặc giữa các con” → biến dị.","example":"Đề bài:\nTrong một gia đình, các người con đều có một số đặc điểm giống bố mẹ nhưng vẫn khác nhau về chiều cao, khuôn mặt hoặc màu tóc. Hãy chỉ ra biểu hiện nào là hiện tượng di truyền và biểu hiện nào là hiện tượng biến dị.","solution":"Đặc điểm được truyền là di truyền; khác biệt giữa các cá thể là biến dị.","trap":"Không coi biến dị chỉ do môi trường; nguồn nêu cả biến dị di truyền và tương tác gene–môi trường.","extra":[]},{"title":"Dạng 2. Phân biệt gene – allele – kiểu gene – kiểu hình","tip":"Gene là đoạn DNA; allele là các dạng của cùng gene; kiểu gene là tổ hợp allele; kiểu hình là biểu hiện quan sát được.","example":"Đề bài:\nỞ một loài cây, gene quy định màu hoa có hai allele A và a; allele A trội hoàn toàn so với a. Một cây có kiểu gene Aa và biểu hiện hoa đỏ. Hãy xác định trong tình huống này đâu là gene, đâu là allele, đâu là kiểu gene và đâu là kiểu hình.","solution":"Aa là kiểu gene; A và a là hai allele; hoa đỏ là kiểu hình.","trap":"Không gọi A và a là hai gene khác nhau trong cùng bài toán một tính trạng.","extra":[]},{"title":"Dạng 3. Nhận biết đồng hợp và dị hợp","tip":"Hai chữ giống nhau → đồng hợp; hai chữ khác nhau → dị hợp.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24 [TH]. Nếu A trội hoàn toàn, hai kiểu gene có cùng kiểu hình trội là\nA. Aa và aa.\nB. AA và aa.\nC. chỉ aa.\nD. AA và Aa.","solution":"AA đồng hợp trội; Aa dị hợp; aa đồng hợp lặn.","trap":"Đồng hợp không đồng nghĩa với kiểu hình trội; aa là đồng hợp lặn.","extra":[],"exampleQuestionNumber":24},{"title":"Dạng 4. Xác định giao tử","tip":"Mỗi giao tử chỉ nhận một allele của cặp gene.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Cá thể Aa tạo hai loại giao tử đối với gene A/a là\nA. A và a.\nB. chỉ A.\nC. chỉ a.\nD. AA và aa.","solution":"Aa tạo A và a; AA chỉ tạo A.","trap":"Không viết giao tử AA hoặc aa trong bài xét một gene.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 5. Kiểu gene của kiểu hình trội và lặn","tip":"Trội hoàn toàn: kiểu hình trội có thể AA hoặc Aa; kiểu hình lặn chỉ aa.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Nếu A trội hoàn toàn so với a, kiểu hình lặn có kiểu gene\nA. AA hoặc Aa.\nB. AA.\nC. aa.\nD. Aa.","solution":"Chọn ngay kiểu gene aa.","trap":"Kiểu hình trội chưa đủ để kết luận chắc chắn AA.","extra":[],"exampleQuestionNumber":23}],"subjectKey":"biology","shortSubject":"Sinh","slug":"bai-36","summary":"“Giống thế hệ trước” → di truyền; “khác nhau giữa con và bố mẹ hoặc giữa các con” → biến dị.","searchText":"KHÁI QUÁT VỀ DI TRUYỀN HỌC “Giống thế hệ trước” → di truyền; “khác nhau giữa con và bố mẹ hoặc giữa các con” → biến dị. Dạng 1. Phân biệt di truyền và biến dị “Giống thế hệ trước” → di truyền; “khác nhau giữa con và bố mẹ hoặc giữa các con” → biến dị. Con mang một số đặc điểm của bố mẹ nhưng anh chị em vẫn khác nhau. Đặc điểm được truyền là di truyền; khác biệt giữa các cá thể là biến dị. Không coi biến dị chỉ do môi trường; nguồn nêu cả biến dị di truyền và tương tác gene–môi trường.  Dạng 2. Phân biệt gene – allele – kiểu gene – kiểu hình Gene là đoạn DNA; allele là các dạng của cùng gene; kiểu gene là tổ hợp allele; kiểu hình là biểu hiện quan sát được. Cá thể Aa có hoa đỏ khi A trội hoàn toàn. Aa là kiểu gene; A và a là hai allele; hoa đỏ là kiểu hình. Không gọi A và a là hai gene khác nhau trong cùng bài toán một tính trạng.  Dạng 3. Nhận biết đồng hợp và dị hợp Hai chữ giống nhau → đồng hợp; hai chữ khác nhau → dị hợp. AA, Aa và aa. AA đồng hợp trội; Aa dị hợp; aa đồng hợp lặn. Đồng hợp không đồng nghĩa với kiểu hình trội; aa là đồng hợp lặn.  Dạng 4. Xác định giao tử Mỗi giao tử chỉ nhận một allele của cặp gene. Cá thể Aa và cá thể AA tạo giao tử nào? Aa tạo A và a; AA chỉ tạo A. Không viết giao tử AA hoặc aa trong bài xét một gene.  Dạng 5. Kiểu gene của kiểu hình trội và lặn Trội hoàn toàn: kiểu hình trội có thể AA hoặc Aa; kiểu hình lặn chỉ aa. Một cá thể biểu hiện tính trạng lặn. Chọn ngay kiểu gene aa. Kiểu hình trội chưa đủ để kết luận chắc chắn AA. "},{"number":37,"title":"CÁC QUY LUẬT DI TRUYỀN CỦA MENDEL","subject":"Sinh học","intro":[],"forms":[{"title":"Dạng 1. Lai hai dòng thuần chủng","tip":"AA × aa → F1 đồng loạt Aa; nếu A trội hoàn toàn thì 100% kiểu hình trội.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Lai aa × aa. Kiểu gene đời con là\nA. 100% aa.\nB. 1 AA : 1 aa.\nC. 3 Aa : 1 aa.\nD. 100% Aa.","solution":"Giao tử A và a; F1: 100% Aa, 100% trội.","trap":"Không cho F1 xuất hiện AA hoặc aa.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 2. Lai một cặp gene dị hợp","tip":"Aa × Aa: kiểu gene 1AA : 2Aa : 1aa; kiểu hình 3 trội : 1 lặn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Trong phép lai Aa × Aa, xác suất con dị hợp là\nA. 1/4.\nB. 3/4.\nC. 1/2.\nD. 1.","solution":"Tỉ lệ aa = 1/4 = 25%.","trap":"Không nhầm 1:2:1 là tỉ lệ kiểu hình.","extra":[],"exampleQuestionNumber":23},{"title":"Dạng 3. Lai phân tích một cặp gene","tip":"Cá thể trội chưa rõ kiểu gene lai với aa: 100% trội → có khả năng AA; 1 trội:1 lặn → Aa.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24 [TH]. Một cây hoa đỏ chưa rõ kiểu gene lai với cây hoa trắng aa cho cả đỏ và trắng. Cây đỏ là\nA. aa.\nB. không có allele A.\nC. AA.\nD. Aa.","solution":"Cây đỏ phải là Aa.","trap":"Lai phân tích luôn dùng cá thể đồng hợp lặn.","extra":[],"exampleQuestionNumber":24},{"title":"Dạng 4. Phép lai Aa × aa","tip":"Aa cho A,a; aa chỉ cho a → đời con 1Aa : 1aa, kiểu hình 1 trội : 1 lặn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 7 [NB]. Cho Aa × Aa, tỉ lệ kiểu hình khi trội hoàn toàn là\nA. 100% lặn.\nB. 1 trội : 1 lặn.\nC. 3 trội : 1 lặn.\nD. 1 trội : 3 lặn.","solution":"50% trội và 50% lặn.","trap":"Không dùng tỉ lệ 3:1; tỉ lệ đó thuộc Aa × Aa.","extra":[],"exampleQuestionNumber":7},{"title":"Dạng 5. Giao tử của cơ thể AaBb","tip":"Khi phân li độc lập, ghép mỗi allele của gene A/a với mỗi allele của gene B/b.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 26 [TH]. Cơ thể AaBb tạo giao tử ab với xác suất, nếu phân li độc lập, là\nA. 1/2.\nB. 1/4.\nC. 1/8.\nD. 1.","solution":"AB, Ab, aB, ab; mỗi loại 1/4.","trap":"Không viết Aa, Bb là giao tử.","extra":[],"exampleQuestionNumber":26},{"title":"Dạng 6. Lai phân tích hai cặp gene","tip":"AaBb × aabb, phân li độc lập → bốn kiểu hình theo tỉ lệ 1:1:1:1.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. Phép lai AaBb × aabb là lai phân tích hai cặp gene. Nếu phân li độc lập, tỉ lệ kiểu hình dự kiến là\nA. 3 : 1.\nB. 100% trội cả hai.\nC. 1 : 1 : 1 : 1.\nD. 9 : 3 : 3 : 1.","solution":"Bốn giao tử của AaBb kết hợp với ab → bốn tổ hợp bằng nhau.","trap":"Nếu kết quả lệch rõ 1:1:1:1, có thể nghĩ đến liên kết gene.","extra":[],"exampleQuestionNumber":27}],"subjectKey":"biology","shortSubject":"Sinh","slug":"bai-37","summary":"AA × aa → F1 đồng loạt Aa; nếu A trội hoàn toàn thì 100% kiểu hình trội.","searchText":"CÁC QUY LUẬT DI TRUYỀN CỦA MENDEL AA × aa → F1 đồng loạt Aa; nếu A trội hoàn toàn thì 100% kiểu hình trội. Dạng 1. Lai hai dòng thuần chủng AA × aa → F1 đồng loạt Aa; nếu A trội hoàn toàn thì 100% kiểu hình trội. P: AA × aa. Giao tử A và a; F1: 100% Aa, 100% trội. Không cho F1 xuất hiện AA hoặc aa.  Dạng 2. Lai một cặp gene dị hợp Aa × Aa: kiểu gene 1AA : 2Aa : 1aa; kiểu hình 3 trội : 1 lặn. Xác suất con aa trong phép lai Aa × Aa. Tỉ lệ aa = 1/4 = 25%. Không nhầm 1:2:1 là tỉ lệ kiểu hình.  Dạng 3. Lai phân tích một cặp gene Cá thể trội chưa rõ kiểu gene lai với aa: 100% trội → có khả năng AA; 1 trội:1 lặn → Aa. Cây đỏ lai cây trắng aa cho cả đỏ và trắng. Cây đỏ phải là Aa. Lai phân tích luôn dùng cá thể đồng hợp lặn.  Dạng 4. Phép lai Aa × aa Aa cho A,a; aa chỉ cho a → đời con 1Aa : 1aa, kiểu hình 1 trội : 1 lặn. A trội hoàn toàn, lai Aa × aa. 50% trội và 50% lặn. Không dùng tỉ lệ 3:1; tỉ lệ đó thuộc Aa × Aa.  Dạng 5. Giao tử của cơ thể AaBb Khi phân li độc lập, ghép mỗi allele của gene A/a với mỗi allele của gene B/b. Cơ thể AaBb tạo giao tử. AB, Ab, aB, ab; mỗi loại 1/4. Không viết Aa, Bb là giao tử.  Dạng 6. Lai phân tích hai cặp gene AaBb × aabb, phân li độc lập → bốn kiểu hình theo tỉ lệ 1:1:1:1. Lai phân tích cơ thể AaBb. Bốn giao tử của AaBb kết hợp với ab → bốn tổ hợp bằng nhau. Nếu kết quả lệch rõ 1:1:1:1, có thể nghĩ đến liên kết gene. "},{"number":38,"title":"NUCLEIC ACID VÀ GENE","subject":"Sinh học","intro":[],"forms":[{"title":"Dạng 1. Phân biệt DNA và RNA","tip":"DNA: deoxyribose, T, thường hai mạch; RNA: ribose, U, thường một mạch.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 29 [TH]. Một phân tử có base U nhưng không có T nhiều khả năng là\nA. RNA.\nB. protein.\nC. polysaccharide.\nD. DNA.","solution":"Nhận dạng là RNA.","trap":"Cả DNA và RNA đều gồm nucleotide; không nói RNA không có phosphate.","extra":[],"exampleQuestionNumber":29},{"title":"Dạng 2. Viết mạch DNA bổ sung","tip":"A–T, G–C; hai mạch ngược chiều.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Nếu một mạch DNA có 5'-A G C T-3', mạch bổ sung ngược chiều là\nA. 3'-U C G A-5'.\nB. 5'-A G C T-3'.\nC. 3'-T C G A-5'.\nD. 5'-T C G A-3'.","solution":"Mạch bổ sung: 3'-T C G A-5'.","trap":"Không thay T bằng U khi đang viết DNA.","extra":[],"exampleQuestionNumber":23},{"title":"Dạng 3. Tính tỉ lệ base trong DNA","tip":"DNA hai mạch: %A=%T; %G=%C; tổng 100%.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Một DNA có A = 30%. Tỉ lệ G là\nA. 20%.\nB. 10%.\nC. 30%.\nD. 40%.","solution":"T=30%; còn G+C=40% nên G=C=20%.","trap":"Không cho G=40%; 40% là tổng G+C.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 4. Tính số nucleotide bổ sung","tip":"Số A bằng số T; số G bằng số C trong toàn phân tử DNA.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Đoạn DNA có 1000 nucleotide, trong đó A = 200. Số T là\nA. 300.\nB. 200.\nC. 400.\nD. 800.","solution":"T=200.","trap":"Không lấy T=800; phần còn lại còn gồm cả G và C.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 5. So sánh độ bền A–T và G–C","tip":"Cặp A–T có 2 liên kết hydrogen; G–C có 3, nên đoạn giàu G–C bền hơn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 30 [TH]. Độ bền đoạn DNA giàu G–C thường cao hơn đoạn giàu A–T vì\nA. G–C là liên kết peptide.\nB. cặp G–C có ba liên kết hydrogen.\nC. G–C không có liên kết.\nD. A–T có bốn liên kết.","solution":"Chọn đoạn giàu G–C có độ bền cao hơn.","trap":"Không nhầm số liên kết: A–T là 2, G–C là 3.","extra":[],"exampleQuestionNumber":30}],"subjectKey":"biology","shortSubject":"Sinh","slug":"bai-38","summary":"DNA: deoxyribose, T, thường hai mạch; RNA: ribose, U, thường một mạch.","searchText":"NUCLEIC ACID VÀ GENE DNA: deoxyribose, T, thường hai mạch; RNA: ribose, U, thường một mạch. Dạng 1. Phân biệt DNA và RNA DNA: deoxyribose, T, thường hai mạch; RNA: ribose, U, thường một mạch. Phân tử có U nhưng không có T. Nhận dạng là RNA. Cả DNA và RNA đều gồm nucleotide; không nói RNA không có phosphate.  Dạng 2. Viết mạch DNA bổ sung A–T, G–C; hai mạch ngược chiều. Mạch 5'-A G C T-3'. Mạch bổ sung: 3'-T C G A-5'. Không thay T bằng U khi đang viết DNA.  Dạng 3. Tính tỉ lệ base trong DNA DNA hai mạch: %A=%T; %G=%C; tổng 100%. DNA có A=30%. T=30%; còn G+C=40% nên G=C=20%. Không cho G=40%; 40% là tổng G+C.  Dạng 4. Tính số nucleotide bổ sung Số A bằng số T; số G bằng số C trong toàn phân tử DNA. Đoạn DNA có 1000 nucleotide, A=200. T=200. Không lấy T=800; phần còn lại còn gồm cả G và C.  Dạng 5. So sánh độ bền A–T và G–C Cặp A–T có 2 liên kết hydrogen; G–C có 3, nên đoạn giàu G–C bền hơn. Hai đoạn DNA cùng độ dài, một đoạn giàu G–C. Chọn đoạn giàu G–C có độ bền cao hơn. Không nhầm số liên kết: A–T là 2, G–C là 3. "},{"number":39,"title":"TÁI BẢN DNA VÀ PHIÊN MÃ TẠO RNA","subject":"Sinh học","intro":[],"forms":[{"title":"Dạng 1. Số phân tử DNA sau tái bản","tip":"Từ một phân tử, sau k lần tái bản hoàn toàn có 2ᵏ phân tử DNA.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Một DNA tái bản liên tiếp hai lần, giả sử hoàn toàn, tạo\nA. 4 phân tử DNA.\nB. 2 phân tử.\nC. 6 phân tử.\nD. 8 phân tử.","solution":"Số DNA con = 2² = 4.","trap":"Không cộng 2 mỗi lần; số phân tử tăng theo lũy thừa hai.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 2. Nguyên tắc bán bảo tồn","tip":"Mỗi DNA con gồm một mạch cũ và một mạch mới.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 3 [NB]. Nguyên tắc bán bảo tồn nghĩa là mỗi DNA con có\nA. hai mạch hoàn toàn cũ.\nB. hai mạch hoàn toàn mới trong mọi phân tử.\nC. một mạch cũ và một mạch mới.\nD. một mạch protein.","solution":"Tạo hai DNA con, mỗi phân tử giữ một mạch của DNA mẹ.","trap":"Không chọn hai mạch hoàn toàn mới.","extra":[],"exampleQuestionNumber":3},{"title":"Dạng 3. Phiên mã từ mạch khuôn","tip":"Đọc mạch khuôn 3'→5', viết mRNA 5'→3'; A→U, T→A, G→C, C→G.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Mạch khuôn DNA có trình tự 3'-T A C G-5'. mRNA được tổng hợp là\nA. 3'-A U G C-5'.\nB. 5'-U A C G-3'.\nC. 5'-A U G C-3'.\nD. 5'-T A C G-3'.","solution":"mRNA: 5'-A U G C-3'.","trap":"Không dùng T trong mRNA.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 4. Tính số nucleotide RNA từ mạch khuôn","tip":"Số U trên RNA bằng số A trên mạch khuôn; A_RNA=T_khuôn; C_RNA=G_khuôn; G_RNA=C_khuôn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24 [TH]. Mạch khuôn DNA có A = 20, T = 30, G = 10, C = 40 nucleotide. RNA tạo ra có số U là\nA. 30.\nB. 10.\nC. 40.\nD. 20.","solution":"RNA có U=20.","trap":"Không dùng quan hệ A=T của DNA toàn phân tử cho riêng một mạch khuôn.","extra":[],"exampleQuestionNumber":24},{"title":"Dạng 5. Phân biệt mạch mã hóa và mRNA","tip":"mRNA giống mạch mã hóa về trình tự, chỉ thay T bằng U và cùng chiều 5'→3'.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 [TH]. Một đoạn mRNA có trình tự giống mạch mã hóa DNA ngoại trừ\nA. U thay cho T.\nB. C thay cho G.\nC. không có phosphate.\nD. G thay cho A.","solution":"mRNA tương ứng 5'-A U G C-3'.","trap":"Mạch khuôn mới là mạch bổ sung với mRNA.","extra":[],"exampleQuestionNumber":25}],"subjectKey":"biology","shortSubject":"Sinh","slug":"bai-39","summary":"Từ một phân tử, sau k lần tái bản hoàn toàn có 2ᵏ phân tử DNA.","searchText":"TÁI BẢN DNA VÀ PHIÊN MÃ TẠO RNA Từ một phân tử, sau k lần tái bản hoàn toàn có 2ᵏ phân tử DNA. Dạng 1. Số phân tử DNA sau tái bản Từ một phân tử, sau k lần tái bản hoàn toàn có 2ᵏ phân tử DNA. Một DNA tái bản liên tiếp hai lần. Số DNA con = 2² = 4. Không cộng 2 mỗi lần; số phân tử tăng theo lũy thừa hai.  Dạng 2. Nguyên tắc bán bảo tồn Mỗi DNA con gồm một mạch cũ và một mạch mới. DNA mẹ tái bản một lần. Tạo hai DNA con, mỗi phân tử giữ một mạch của DNA mẹ. Không chọn hai mạch hoàn toàn mới.  Dạng 3. Phiên mã từ mạch khuôn Đọc mạch khuôn 3'→5', viết mRNA 5'→3'; A→U, T→A, G→C, C→G. Mạch khuôn 3'-T A C G-5'. mRNA: 5'-A U G C-3'. Không dùng T trong mRNA.  Dạng 4. Tính số nucleotide RNA từ mạch khuôn Số U trên RNA bằng số A trên mạch khuôn; A_RNA=T_khuôn; C_RNA=G_khuôn; G_RNA=C_khuôn. Mạch khuôn có A=20, T=30, G=10, C=40. RNA có U=20. Không dùng quan hệ A=T của DNA toàn phân tử cho riêng một mạch khuôn.  Dạng 5. Phân biệt mạch mã hóa và mRNA mRNA giống mạch mã hóa về trình tự, chỉ thay T bằng U và cùng chiều 5'→3'. Mạch mã hóa DNA có 5'-A T G C-3'. mRNA tương ứng 5'-A U G C-3'. Mạch khuôn mới là mạch bổ sung với mRNA. "},{"number":40,"title":"DỊCH MÃ VÀ MỐI QUAN HỆ TỪ GENE ĐẾN TÍNH TRẠNG","subject":"Sinh học","intro":[],"forms":[{"title":"Dạng 1. Nhận biết codon mở đầu và kết thúc","tip":"AUG là codon mở đầu phổ biến; UAA, UAG, UGA là codon kết thúc.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. mRNA có codon AUG-GCU-UAA. Chuỗi dịch mã gồm\nA. không có amino acid.\nB. ba amino acid gồm cả UAA.\nC. methionine, alanine rồi kết thúc.\nD. chỉ alanine.","solution":"Dịch mã Met–Ala rồi dừng; UAA không mã hóa amino acid.","trap":"Không tính codon kết thúc thành một amino acid.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 2. Ghép codon với anticodon","tip":"Codon mRNA viết 5'→3'; anticodon tRNA bổ sung và ngược chiều.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. tRNA có anticodon 3'-UAC-5' sẽ bắt cặp với codon\nA. 3'-AUG-5'.\nB. 5'-AUG-3'.\nC. 5'-UAC-3'.\nD. 5'-ATG-3'.","solution":"Codon tương ứng 5'-AUG-3'.","trap":"Không viết DNA với T trong bài codon–anticodon RNA.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 3. Tính số amino acid từ vùng mã hóa","tip":"Mỗi codon gồm 3 nucleotide. Nếu đề nói không tính codon kết thúc, số amino acid = số nucleotide/3.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. mRNA dài 300 nucleotide trong vùng mã hóa, không tính codon kết thúc, có thể mã hóa khoảng\nA. 900 amino acid.\nB. 50 amino acid.\nC. 100 amino acid.\nD. 300 amino acid.","solution":"Số amino acid ≈ 300/3 = 100.","trap":"Phải đọc điều kiện có hay không tính codon kết thúc.","extra":[],"exampleQuestionNumber":27},{"title":"Dạng 4. Mối quan hệ gene – tính trạng","tip":"Chuỗi chốt: gene → RNA → protein → tính trạng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 [TH]. Protein enzyme bị biến đổi vùng hoạt động có thể làm tính trạng thay đổi vì\nA. hoạt tính phản ứng sinh hóa bị ảnh hưởng.\nB. enzyme chỉ là lipid.\nC. DNA biến thành RNA.\nD. môi trường không liên quan.","solution":"Hoạt tính phản ứng sinh hóa có thể thay đổi, kéo theo thay đổi tính trạng.","trap":"Không nói gene tác động trực tiếp lên tính trạng mà bỏ qua sản phẩm chức năng.","extra":[],"exampleQuestionNumber":25},{"title":"Dạng 5. Codon kết thúc xuất hiện sớm","tip":"Codon stop sớm làm chuỗi polypeptide ngắn hơn bình thường.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 28 [TH]. Một codon kết thúc xuất hiện sớm do đột biến có thể tạo\nA. thêm chromosome.\nB. protein dài gấp đôi chắc chắn.\nC. DNA dài hơn.\nD. protein ngắn hơn bình thường.","solution":"Ribosome dừng sớm → protein ngắn.","trap":"Không kết luận protein dài hơn.","extra":[],"exampleQuestionNumber":28}],"subjectKey":"biology","shortSubject":"Sinh","slug":"bai-40","summary":"AUG là codon mở đầu phổ biến; UAA, UAG, UGA là codon kết thúc.","searchText":"DỊCH MÃ VÀ MỐI QUAN HỆ TỪ GENE ĐẾN TÍNH TRẠNG AUG là codon mở đầu phổ biến; UAA, UAG, UGA là codon kết thúc. Dạng 1. Nhận biết codon mở đầu và kết thúc AUG là codon mở đầu phổ biến; UAA, UAG, UGA là codon kết thúc. mRNA: AUG–GCU–UAA. Dịch mã Met–Ala rồi dừng; UAA không mã hóa amino acid. Không tính codon kết thúc thành một amino acid.  Dạng 2. Ghép codon với anticodon Codon mRNA viết 5'→3'; anticodon tRNA bổ sung và ngược chiều. Anticodon 3'-UAC-5'. Codon tương ứng 5'-AUG-3'. Không viết DNA với T trong bài codon–anticodon RNA.  Dạng 3. Tính số amino acid từ vùng mã hóa Mỗi codon gồm 3 nucleotide. Nếu đề nói không tính codon kết thúc, số amino acid = số nucleotide/3. Vùng mã hóa mRNA dài 300 nucleotide, không tính codon kết thúc. Số amino acid ≈ 300/3 = 100. Phải đọc điều kiện có hay không tính codon kết thúc.  Dạng 4. Mối quan hệ gene – tính trạng Chuỗi chốt: gene → RNA → protein → tính trạng. Gene enzyme bị biến đổi vùng hoạt động. Hoạt tính phản ứng sinh hóa có thể thay đổi, kéo theo thay đổi tính trạng. Không nói gene tác động trực tiếp lên tính trạng mà bỏ qua sản phẩm chức năng.  Dạng 5. Codon kết thúc xuất hiện sớm Codon stop sớm làm chuỗi polypeptide ngắn hơn bình thường. Đột biến tạo UAA ở giữa vùng mã hóa. Ribosome dừng sớm → protein ngắn. Không kết luận protein dài hơn. "},{"number":41,"title":"ĐỘT BIẾN GENE","subject":"Sinh học","intro":[],"forms":[{"title":"Dạng 1. Nhận dạng đột biến điểm","tip":"Thay thế: đổi một cặp; mất: giảm nucleotide; thêm: tăng nucleotide.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 3 [NB]. Đột biến thay thế là\nA. đảo đoạn chromosome.\nB. mất cả chromosome.\nC. một cặp nucleotide được thay bằng cặp khác.\nD. thêm nhiều chromosome.","solution":"Đó là đột biến thay thế.","trap":"Không gọi thay thế nucleotide là đột biến nhiễm sắc thể.","extra":[],"exampleQuestionNumber":3},{"title":"Dạng 2. Phân biệt đồng nghĩa – sai nghĩa – vô nghĩa","tip":"Không đổi amino acid → đồng nghĩa; đổi amino acid → sai nghĩa; tạo codon stop → vô nghĩa.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Một codon UAU mã hóa tyrosine đổi thành UAA. Đây là\nA. đột biến đồng nghĩa.\nB. đột biến không đổi codon.\nC. đột biến vô nghĩa tạo tín hiệu kết thúc.\nD. đột biến tăng chromosome.","solution":"UAA là codon kết thúc → đột biến vô nghĩa.","trap":"Không gọi là đồng nghĩa chỉ vì thay một nucleotide.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 3. Đột biến dịch khung","tip":"Thêm hoặc mất nucleotide không theo bội số 3 trong vùng mã hóa → đổi khung đọc từ vị trí đột biến.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Thêm một nucleotide gần đầu vùng mã hóa thường nghiêm trọng vì\nA. không ảnh hưởng mRNA.\nB. luôn có lợi.\nC. chỉ đổi một amino acid cuối.\nD. có thể làm dịch khung nhiều codon phía sau.","solution":"Nhiều codon phía sau có thể thay đổi → hậu quả thường mạnh.","trap":"Thay thế một nucleotide không làm dịch khung.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 4. Khả năng di truyền của đột biến","tip":"Đột biến ở tế bào sinh dục hoặc tiền thân giao tử có thể truyền; đột biến soma thường chỉ ảnh hưởng dòng tế bào đó.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Cặp song sinh cùng gene nhưng chỉ một người mắc ung thư da do phơi UV nhiều. Điều này gợi ý\nA. ung thư luôn di truyền trực tiếp.\nB. gene của họ chắc chắn khác hoàn toàn.\nC. môi trường có thể làm tăng đột biến soma.\nD. UV không ảnh hưởng DNA.","solution":"Đây là đột biến soma, thường không truyền qua sinh sản hữu tính.","trap":"Không khẳng định mọi đột biến đều truyền cho con.","extra":[],"exampleQuestionNumber":23},{"title":"Dạng 5. Đánh giá lợi – hại của đột biến","tip":"Tác động có thể có hại, trung tính hoặc có lợi; giá trị phụ thuộc môi trường.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Một đột biến có lợi trong môi trường này có thể bất lợi trong môi trường khác vì\nA. đột biến luôn có tác dụng cố định.\nB. giá trị thích nghi phụ thuộc điều kiện môi trường.\nC. môi trường không ảnh hưởng chọn lọc.\nD. gene không biểu hiện.","solution":"Kết luận giá trị thích nghi phụ thuộc điều kiện môi trường.","trap":"Không coi đột biến luôn xấu hoặc luôn tốt.","extra":[],"exampleQuestionNumber":22}],"subjectKey":"biology","shortSubject":"Sinh","slug":"bai-41","summary":"Thay thế: đổi một cặp; mất: giảm nucleotide; thêm: tăng nucleotide.","searchText":"ĐỘT BIẾN GENE Thay thế: đổi một cặp; mất: giảm nucleotide; thêm: tăng nucleotide. Dạng 1. Nhận dạng đột biến điểm Thay thế: đổi một cặp; mất: giảm nucleotide; thêm: tăng nucleotide. Một cặp nucleotide được thay bằng cặp khác. Đó là đột biến thay thế. Không gọi thay thế nucleotide là đột biến nhiễm sắc thể.  Dạng 2. Phân biệt đồng nghĩa – sai nghĩa – vô nghĩa Không đổi amino acid → đồng nghĩa; đổi amino acid → sai nghĩa; tạo codon stop → vô nghĩa. Codon UAU đổi thành UAA. UAA là codon kết thúc → đột biến vô nghĩa. Không gọi là đồng nghĩa chỉ vì thay một nucleotide.  Dạng 3. Đột biến dịch khung Thêm hoặc mất nucleotide không theo bội số 3 trong vùng mã hóa → đổi khung đọc từ vị trí đột biến. Thêm một nucleotide gần đầu vùng mã hóa. Nhiều codon phía sau có thể thay đổi → hậu quả thường mạnh. Thay thế một nucleotide không làm dịch khung.  Dạng 4. Khả năng di truyền của đột biến Đột biến ở tế bào sinh dục hoặc tiền thân giao tử có thể truyền; đột biến soma thường chỉ ảnh hưởng dòng tế bào đó. Đột biến xảy ra trong tế bào da do tia UV. Đây là đột biến soma, thường không truyền qua sinh sản hữu tính. Không khẳng định mọi đột biến đều truyền cho con.  Dạng 5. Đánh giá lợi – hại của đột biến Tác động có thể có hại, trung tính hoặc có lợi; giá trị phụ thuộc môi trường. Một allele giúp sống tốt ở môi trường A nhưng bất lợi ở môi trường B. Kết luận giá trị thích nghi phụ thuộc điều kiện môi trường. Không coi đột biến luôn xấu hoặc luôn tốt. "},{"number":42,"title":"NHIỄM SẮC THỂ VÀ BỘ NHIỄM SẮC THỂ","subject":"Sinh học","intro":[],"forms":[{"title":"Dạng 1. Tính số nhiễm sắc thể từ 2n và n","tip":"Tế bào sinh dưỡng thường 2n; giao tử thường n=2n/2.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Một loài có 2n = 18. Giao tử bình thường có\nA. 8 nhiễm sắc thể.\nB. 18 nhiễm sắc thể.\nC. 36 nhiễm sắc thể.\nD. 9 nhiễm sắc thể.","solution":"Tế bào sinh dưỡng có 18; giao tử có 9 nhiễm sắc thể.","trap":"Không gọi 18 là số cặp; số cặp là 9.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 2. Phân biệt nhiễm sắc thể và chromatid sau nhân đôi","tip":"Sau nhân đôi, số nhiễm sắc thể không đổi; mỗi nhiễm sắc thể kép gồm hai chromatid.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Một tế bào người ở kì giữa nguyên phân có 46 chromosome kép, số chromatid là\nA. 23.\nB. 92.\nC. 184.\nD. 46.","solution":"Số chromatid = 46×2 = 92.","trap":"Không kết luận có 92 nhiễm sắc thể ở kì giữa.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 3. Từ nhiễm sắc thể đơn sang kép","tip":"Nhân đôi biến mỗi nhiễm sắc thể đơn thành một nhiễm sắc thể kép gồm hai chromatid.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 28 [TH]. Một tế bào có 8 chromosome ở trạng thái đơn. Sau nhân đôi, nó có\nA. 4 chromosome.\nB. 8 chromatid.\nC. 16 chromosome kép.\nD. 8 chromosome kép gồm 16 chromatid.","solution":"Sau nhân đôi: 8 nhiễm sắc thể kép, 16 chromatid.","trap":"Số nhiễm sắc thể không tăng gấp đôi.","extra":[],"exampleQuestionNumber":28},{"title":"Dạng 4. Cặp nhiễm sắc thể tương đồng và chromatid chị em","tip":"Tương đồng: một chiếc từ bố, một từ mẹ, có gene ở locus tương ứng; chromatid chị em là hai bản sao của cùng một nhiễm sắc thể.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Hai chromosome tương đồng khác chromatid chị em ở chỗ\nA. không mang gene tương ứng.\nB. chúng luôn giống hệt về trình tự.\nC. một chiếc từ bố, một chiếc từ mẹ và có thể mang allele khác nhau.\nD. chúng là cùng một chromosome sau nhân đôi.","solution":"Chọn nhận xét: một chiếc từ bố, một chiếc từ mẹ.","trap":"Không gọi hai chromatid chị em là một cặp tương đồng.","extra":[],"exampleQuestionNumber":23},{"title":"Dạng 5. Nhận biết karyotype","tip":"Karyotype phát hiện bất thường số lượng hoặc cấu trúc lớn của nhiễm sắc thể.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24 [TH]. Sắp xếp karyotype giúp phát hiện\nA. mọi đột biến điểm nhỏ chắc chắn.\nB. mức glucose máu.\nC. tần số tim.\nD. bất thường số lượng hoặc cấu trúc chromosome lớn.","solution":"Dùng karyotype.","trap":"Karyotype không phù hợp để phát hiện mọi thay thế một nucleotide.","extra":[],"exampleQuestionNumber":24}],"subjectKey":"biology","shortSubject":"Sinh","slug":"bai-42","summary":"Tế bào sinh dưỡng thường 2n; giao tử thường n=2n/2.","searchText":"NHIỄM SẮC THỂ VÀ BỘ NHIỄM SẮC THỂ Tế bào sinh dưỡng thường 2n; giao tử thường n=2n/2. Dạng 1. Tính số nhiễm sắc thể từ 2n và n Tế bào sinh dưỡng thường 2n; giao tử thường n=2n/2. Loài có 2n=18. Tế bào sinh dưỡng có 18; giao tử có 9 nhiễm sắc thể. Không gọi 18 là số cặp; số cặp là 9.  Dạng 2. Phân biệt nhiễm sắc thể và chromatid sau nhân đôi Sau nhân đôi, số nhiễm sắc thể không đổi; mỗi nhiễm sắc thể kép gồm hai chromatid. Tế bào người ở kì giữa nguyên phân có 46 nhiễm sắc thể kép. Số chromatid = 46×2 = 92. Không kết luận có 92 nhiễm sắc thể ở kì giữa.  Dạng 3. Từ nhiễm sắc thể đơn sang kép Nhân đôi biến mỗi nhiễm sắc thể đơn thành một nhiễm sắc thể kép gồm hai chromatid. Tế bào có 8 nhiễm sắc thể đơn. Sau nhân đôi: 8 nhiễm sắc thể kép, 16 chromatid. Số nhiễm sắc thể không tăng gấp đôi.  Dạng 4. Cặp nhiễm sắc thể tương đồng và chromatid chị em Tương đồng: một chiếc từ bố, một từ mẹ, có gene ở locus tương ứng; chromatid chị em là hai bản sao của cùng một nhiễm sắc thể. Hai nhiễm sắc thể tương đồng có thể mang allele khác nhau. Chọn nhận xét: một chiếc từ bố, một chiếc từ mẹ. Không gọi hai chromatid chị em là một cặp tương đồng.  Dạng 5. Nhận biết karyotype Karyotype phát hiện bất thường số lượng hoặc cấu trúc lớn của nhiễm sắc thể. Cần phát hiện tam nhiễm chromosome 21. Dùng karyotype. Karyotype không phù hợp để phát hiện mọi thay thế một nucleotide. "},{"number":43,"title":"NGUYÊN PHÂN VÀ GIẢM PHÂN","subject":"Sinh học","intro":[],"forms":[{"title":"Dạng 1. Số tế bào sau nguyên phân","tip":"Một tế bào nguyên phân k lần tạo 2ᵏ tế bào; N tế bào ban đầu tạo N×2ᵏ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Một tế bào nguyên phân liên tiếp 3 lần tạo số tế bào con là\nA. 8.\nB. 3.\nC. 9.\nD. 6.","solution":"Số tế bào con = 2³ = 8.","trap":"Không lấy 3×2=6.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 2. Số nhiễm sắc thể ở tế bào con nguyên phân","tip":"Nguyên phân giữ nguyên bộ nhiễm sắc thể: tế bào mẹ 2n → mỗi tế bào con 2n.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Một tế bào 2n = 8 nguyên phân một lần tạo mỗi tế bào con có\nA. 2 chromosome.\nB. 4 chromosome.\nC. 8 chromosome.\nD. 16 chromosome.","solution":"Mỗi tế bào con có 8 nhiễm sắc thể.","trap":"Không giảm còn n; giảm một nửa là đặc trưng của giảm phân.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 3. Số nhiễm sắc thể trong giao tử","tip":"Giảm phân bình thường: tế bào 2n → giao tử n.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Một tế bào 2n = 8 giảm phân bình thường tạo giao tử có\nA. 8 chromosome.\nB. 16 chromosome.\nC. 2 chromosome.\nD. 4 chromosome.","solution":"Giao tử có n=4 nhiễm sắc thể.","trap":"Không lấy 8/4 vì giảm phân tạo bốn tế bào.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 4. Kì sau nguyên phân","tip":"Ở kì sau, chromatid tách nhau và mỗi chromatid được tính là một nhiễm sắc thể đơn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. Một tế bào 2n = 10 ở kì sau nguyên phân có tổng chromosome đang phân li trong cả tế bào là\nA. 5 chromosome.\nB. 40 chromosome kép.\nC. 20 chromosome đơn.\nD. 10 chromosome kép.","solution":"Trong cả tế bào có 20 nhiễm sắc thể đơn đang phân li.","trap":"Không ghi 10 nhiễm sắc thể kép ở kì sau.","extra":[],"exampleQuestionNumber":27},{"title":"Dạng 5. Sau giảm phân I","tip":"Sau giảm phân I, số nhiễm sắc thể giảm còn n nhưng vẫn ở trạng thái kép.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 28 [TH]. Một tế bào 2n = 6 sau giảm phân I tạo mỗi tế bào có\nA. 3 chromosome đơn không nhân đôi.\nB. 6 chromosome đơn.\nC. 12 chromosome kép.\nD. 3 chromosome kép.","solution":"Mỗi tế bào có 3 nhiễm sắc thể kép.","trap":"Không gọi là 3 nhiễm sắc thể đơn.","extra":[],"exampleQuestionNumber":28},{"title":"Dạng 6. So sánh vai trò nguyên phân và giảm phân","tip":"Nguyên phân: sinh trưởng, thay thế, sinh sản vô tính; giảm phân: tạo tế bào đơn bội, tạo biến dị tổ hợp.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25 [TH]. Vết thương da lành nhờ\nA. nguyên phân tăng số tế bào.\nB. phiên mã duy nhất.\nC. giảm phân tạo giao tử.\nD. thụ tinh.","solution":"Chọn nguyên phân làm tăng số tế bào.","trap":"Không dùng giảm phân để giải thích sửa chữa mô.","extra":[],"exampleQuestionNumber":25}],"subjectKey":"biology","shortSubject":"Sinh","slug":"bai-43","summary":"Một tế bào nguyên phân k lần tạo 2ᵏ tế bào; N tế bào ban đầu tạo N×2ᵏ.","searchText":"NGUYÊN PHÂN VÀ GIẢM PHÂN Một tế bào nguyên phân k lần tạo 2ᵏ tế bào; N tế bào ban đầu tạo N×2ᵏ. Dạng 1. Số tế bào sau nguyên phân Một tế bào nguyên phân k lần tạo 2ᵏ tế bào; N tế bào ban đầu tạo N×2ᵏ. Một tế bào nguyên phân liên tiếp 3 lần. Số tế bào con = 2³ = 8. Không lấy 3×2=6.  Dạng 2. Số nhiễm sắc thể ở tế bào con nguyên phân Nguyên phân giữ nguyên bộ nhiễm sắc thể: tế bào mẹ 2n → mỗi tế bào con 2n. Tế bào 2n=8 nguyên phân một lần. Mỗi tế bào con có 8 nhiễm sắc thể. Không giảm còn n; giảm một nửa là đặc trưng của giảm phân.  Dạng 3. Số nhiễm sắc thể trong giao tử Giảm phân bình thường: tế bào 2n → giao tử n. Loài có 2n=8. Giao tử có n=4 nhiễm sắc thể. Không lấy 8/4 vì giảm phân tạo bốn tế bào.  Dạng 4. Kì sau nguyên phân Ở kì sau, chromatid tách nhau và mỗi chromatid được tính là một nhiễm sắc thể đơn. Tế bào 2n=10 ở kì sau nguyên phân. Trong cả tế bào có 20 nhiễm sắc thể đơn đang phân li. Không ghi 10 nhiễm sắc thể kép ở kì sau.  Dạng 5. Sau giảm phân I Sau giảm phân I, số nhiễm sắc thể giảm còn n nhưng vẫn ở trạng thái kép. Tế bào 2n=6 sau giảm phân I. Mỗi tế bào có 3 nhiễm sắc thể kép. Không gọi là 3 nhiễm sắc thể đơn.  Dạng 6. So sánh vai trò nguyên phân và giảm phân Nguyên phân: sinh trưởng, thay thế, sinh sản vô tính; giảm phân: tạo tế bào đơn bội, tạo biến dị tổ hợp. Vết thương da lành. Chọn nguyên phân làm tăng số tế bào. Không dùng giảm phân để giải thích sửa chữa mô. "},{"number":44,"title":"NHIỄM SẮC THỂ GIỚI TÍNH VÀ CƠ CHẾ XÁC ĐỊNH GIỚI TÍNH","subject":"Sinh học","intro":[],"forms":[{"title":"Dạng 1. Xác định giới tính ở người","tip":"Trứng luôn mang X; tinh trùng mang X hoặc Y. X+X→XX; X+Y→XY.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 8 [NB]. Tinh trùng mang Y thụ tinh với trứng X tạo hợp tử\nA. YY.\nB. XO.\nC. XX, giới nữ.\nD. XY, phát triển theo giới nam.","solution":"Hợp tử XY, phát triển theo giới nam.","trap":"Không quy trách nhiệm giới tính con cho người mẹ.","extra":[],"exampleQuestionNumber":8},{"title":"Dạng 2. Xác suất sinh con trai hoặc con gái","tip":"Theo mô hình đơn giản, mỗi lần thụ tinh độc lập: trai 1/2, gái 1/2.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Một gia đình đã có ba con gái. Xác suất lần sau là con trai vẫn khoảng\nA. 1.\nB. 1/8.\nC. 0.\nD. 1/2.","solution":"Vẫn là 1/2.","trap":"Không lấy 1/16 hoặc cho rằng lần sau chắc chắn là con trai.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 3. Đường truyền nhiễm sắc thể X và Y","tip":"Mẹ truyền X cho mọi con; cha truyền X cho con gái và Y cho con trai.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 14 [NB]. Gene trên chromosome Y truyền từ\nA. cha cho mọi con gái.\nB. cha cho con trai.\nC. mẹ cho con trai.\nD. mẹ cho con gái.","solution":"Gợi ý gene nằm trên chromosome Y.","trap":"Cha không truyền chromosome X cho con trai.","extra":[],"exampleQuestionNumber":14},{"title":"Dạng 4. Gene lặn liên kết X ở nam","tip":"Nam chỉ có một X nên allele lặn trên X dễ biểu hiện; con trai nhận X từ mẹ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24 [TH]. Nam mắc tính trạng lặn liên kết X nhận allele gây bệnh từ\nA. không ai.\nB. cha qua chromosome Y.\nC. cả cha và mẹ bắt buộc.\nD. mẹ qua chromosome X.","solution":"Từ mẹ qua chromosome X.","trap":"Không chọn cha; cha truyền Y cho con trai.","extra":[],"exampleQuestionNumber":24},{"title":"Dạng 5. Các hệ xác định giới tính khác","tip":"Không phải mọi loài đều XX–XY; nguồn còn nêu hệ ZW và ảnh hưởng nhiệt độ ở một số loài.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 29 [TH]. Ở loài có hệ ZW, giới cái có thể là ZW. Điều này cho thấy\nA. cơ chế xác định giới tính đa dạng giữa loài.\nB. chromosome giới tính không có vai trò.\nC. giới tính chỉ do môi trường.\nD. mọi loài dùng XY.","solution":"Kết luận cơ chế xác định giới tính đa dạng giữa các loài.","trap":"Không áp dụng máy móc hệ người cho mọi sinh vật.","extra":[],"exampleQuestionNumber":29}],"subjectKey":"biology","shortSubject":"Sinh","slug":"bai-44","summary":"Trứng luôn mang X; tinh trùng mang X hoặc Y. X+X→XX; X+Y→XY.","searchText":"NHIỄM SẮC THỂ GIỚI TÍNH VÀ CƠ CHẾ XÁC ĐỊNH GIỚI TÍNH Trứng luôn mang X; tinh trùng mang X hoặc Y. X+X→XX; X+Y→XY. Dạng 1. Xác định giới tính ở người Trứng luôn mang X; tinh trùng mang X hoặc Y. X+X→XX; X+Y→XY. Tinh trùng Y thụ tinh với trứng X. Hợp tử XY, phát triển theo giới nam. Không quy trách nhiệm giới tính con cho người mẹ.  Dạng 2. Xác suất sinh con trai hoặc con gái Theo mô hình đơn giản, mỗi lần thụ tinh độc lập: trai 1/2, gái 1/2. Gia đình đã có ba con gái, hỏi xác suất lần sau là con trai. Vẫn là 1/2. Không lấy 1/16 hoặc cho rằng lần sau chắc chắn là con trai.  Dạng 3. Đường truyền nhiễm sắc thể X và Y Mẹ truyền X cho mọi con; cha truyền X cho con gái và Y cho con trai. Tính trạng chỉ truyền từ cha cho con trai. Gợi ý gene nằm trên chromosome Y. Cha không truyền chromosome X cho con trai.  Dạng 4. Gene lặn liên kết X ở nam Nam chỉ có một X nên allele lặn trên X dễ biểu hiện; con trai nhận X từ mẹ. Nam mắc tính trạng lặn liên kết X nhận allele bệnh từ ai? Từ mẹ qua chromosome X. Không chọn cha; cha truyền Y cho con trai.  Dạng 5. Các hệ xác định giới tính khác Không phải mọi loài đều XX–XY; nguồn còn nêu hệ ZW và ảnh hưởng nhiệt độ ở một số loài. Loài có giới cái ZW. Kết luận cơ chế xác định giới tính đa dạng giữa các loài. Không áp dụng máy móc hệ người cho mọi sinh vật. "},{"number":45,"title":"DI TRUYỀN LIÊN KẾT","subject":"Sinh học","intro":[],"forms":[{"title":"Dạng 1. Giao tử khi liên kết hoàn toàn cùng chiều","tip":"AB/ab liên kết hoàn toàn chỉ cho hai giao tử bố mẹ AB và ab.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Cơ thể AB/ab liên kết hoàn toàn tạo các giao tử\nA. AB, Ab, aB, ab bằng nhau.\nB. chỉ AB.\nC. AB và ab.\nD. Ab và aB.","solution":"Giao tử: AB và ab.","trap":"Không cho bốn loại bằng nhau như phân li độc lập.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 2. Giao tử khi liên kết hoàn toàn đối","tip":"Ab/aB liên kết hoàn toàn cho Ab và aB.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Cơ thể AB/ab liên kết hoàn toàn tạo các giao tử\nA. AB, Ab, aB, ab bằng nhau.\nB. chỉ AB.\nC. AB và ab.\nD. Ab và aB.","solution":"Giao tử: Ab và aB.","trap":"Không đổi thành AB và ab.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 3. Tính tần số hoán vị gene","tip":"Tần số hoán vị = tổng tỉ lệ giao tử hoặc con tái tổ hợp; không vượt quá 50%.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Phép lai phân tích cho 80% kiểu hình bố mẹ và 20% tái tổ hợp. Tần số hoán vị là\nA. 20%.\nB. 80%.\nC. 40%.\nD. 10%.","solution":"Tần số hoán vị f=20%.","trap":"Không chia đôi khi đề hỏi tổng tần số hoán vị.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 4. Tỉ lệ từng loại giao tử khi biết f","tip":"Mỗi loại tái tổ hợp = f/2; tổng bố mẹ = 100%-f, mỗi loại bố mẹ thường bằng nhau.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24 [TH]. Cơ thể AB/ab có hoán vị 20%. Tỉ lệ giao tử tái tổ hợp Ab và aB tổng cộng là\nA. 80%.\nB. 40%.\nC. 10% mỗi loại bố mẹ.\nD. 20%.","solution":"Ab=aB=10%; AB=ab=40%.","trap":"Không cho mỗi loại tái tổ hợp 20%.","extra":[],"exampleQuestionNumber":24},{"title":"Dạng 5. Khoảng cách bản đồ gene","tip":"1 cM xấp xỉ 1% tần số hoán vị.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 26 [TH]. Hai gene cách nhau 12 cM dự kiến có tần số hoán vị khoảng\nA. 50%.\nB. 12%.\nC. 24%.\nD. 6%.","solution":"Tần số hoán vị dự kiến khoảng 12%.","trap":"Tần số gần 50% không chứng minh chắc chắn gene ở cùng chromosome.","extra":[],"exampleQuestionNumber":26},{"title":"Dạng 6. Suy luận vị trí tương đối","tip":"Tần số hoán vị càng nhỏ → gene càng gần; càng lớn → gene càng xa.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Hai gene có tần số hoán vị 5% so với cặp 20%. Cặp gene 5%\nA. chắc chắn trên chromosome khác nhau.\nB. nằm gần nhau hơn.\nC. không có liên kết.\nD. nằm xa nhau hơn.","solution":"Cặp 5% nằm gần nhau hơn.","trap":"Không kết luận 5% là phân li độc lập.","extra":[],"exampleQuestionNumber":22}],"subjectKey":"biology","shortSubject":"Sinh","slug":"bai-45","summary":"AB/ab liên kết hoàn toàn chỉ cho hai giao tử bố mẹ AB và ab.","searchText":"DI TRUYỀN LIÊN KẾT AB/ab liên kết hoàn toàn chỉ cho hai giao tử bố mẹ AB và ab. Dạng 1. Giao tử khi liên kết hoàn toàn cùng chiều AB/ab liên kết hoàn toàn chỉ cho hai giao tử bố mẹ AB và ab. Cơ thể AB/ab. Giao tử: AB và ab. Không cho bốn loại bằng nhau như phân li độc lập.  Dạng 2. Giao tử khi liên kết hoàn toàn đối Ab/aB liên kết hoàn toàn cho Ab và aB. Cơ thể Ab/aB. Giao tử: Ab và aB. Không đổi thành AB và ab.  Dạng 3. Tính tần số hoán vị gene Tần số hoán vị = tổng tỉ lệ giao tử hoặc con tái tổ hợp; không vượt quá 50%. Lai phân tích cho 20% kiểu hình tái tổ hợp. Tần số hoán vị f=20%. Không chia đôi khi đề hỏi tổng tần số hoán vị.  Dạng 4. Tỉ lệ từng loại giao tử khi biết f Mỗi loại tái tổ hợp = f/2; tổng bố mẹ = 100%-f, mỗi loại bố mẹ thường bằng nhau. AB/ab có f=20%. Ab=aB=10%; AB=ab=40%. Không cho mỗi loại tái tổ hợp 20%.  Dạng 5. Khoảng cách bản đồ gene 1 cM xấp xỉ 1% tần số hoán vị. Hai gene cách nhau 12 cM. Tần số hoán vị dự kiến khoảng 12%. Tần số gần 50% không chứng minh chắc chắn gene ở cùng chromosome.  Dạng 6. Suy luận vị trí tương đối Tần số hoán vị càng nhỏ → gene càng gần; càng lớn → gene càng xa. So cặp gene f=5% với cặp f=20%. Cặp 5% nằm gần nhau hơn. Không kết luận 5% là phân li độc lập. "},{"number":46,"title":"ĐỘT BIẾN NHIỄM SẮC THỂ","subject":"Sinh học","intro":[],"forms":[{"title":"Dạng 1. Nhận dạng đột biến cấu trúc","tip":"Mất đoạn: thiếu; lặp đoạn: thêm bản sao; đảo đoạn: quay 180°; chuyển đoạn: chuyển vị trí.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 5 [NB]. Đảo đoạn là\nA. một đoạn chromosome bị đứt, quay 180 độ rồi gắn lại.\nB. một đoạn được nhân đôi.\nC. một chromosome bị mất.\nD. hai chromosome tương đồng không phân li.","solution":"Đó là đảo đoạn.","trap":"Không gọi đảo đoạn là đột biến gene.","extra":[],"exampleQuestionNumber":5},{"title":"Dạng 2. Tính thể tam nhiễm và đơn nhiễm","tip":"Tam nhiễm = 2n+1; đơn nhiễm = 2n-1.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Một loài 2n = 14. Thể tam nhiễm có số chromosome là\nA. 28.\nB. 13.\nC. 15.\nD. 21.","solution":"2n+1=15 nhiễm sắc thể.","trap":"Không nhầm tam nhiễm với thể tam bội 3n.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 3. Tính thể đa bội","tip":"Tam bội =3n; tứ bội=4n.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Một loài có n = 7. Thể tứ bội có số chromosome là\nA. 28.\nB. 21.\nC. 8.\nD. 14.","solution":"4n=28 nhiễm sắc thể.","trap":"Không dùng 2n+2 cho thể tứ bội.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 4. Không phân li và giao tử bất thường","tip":"Một cặp không phân li trong giảm phân có thể tạo giao tử n+1 và n-1.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Giao tử n + 1 thụ tinh với giao tử n bình thường tạo hợp tử\nA. 2n - 1.\nB. 3n.\nC. 2n + 1.\nD. n.","solution":"Hợp tử 2n+1, thuộc thể tam nhiễm.","trap":"Không cho hợp tử 3n.","extra":[],"exampleQuestionNumber":23},{"title":"Dạng 5. Nhận biết hội chứng từ bộ nhiễm sắc thể","tip":"Down: tam nhiễm 21; Turner: XO; Klinefelter: XXY.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 16 [NB]. Hội chứng Turner có bộ chromosome giới tính\nA. XYY.\nB. XXY.\nC. XXX.\nD. XO.","solution":"Nhận dạng hội chứng Turner.","trap":"Không nhầm XO với XXY.","extra":[],"exampleQuestionNumber":16},{"title":"Dạng 6. Chọn phương pháp phát hiện","tip":"Karyotype phát hiện lệch bội hoặc biến đổi cấu trúc lớn; không phát hiện đáng tin cậy đột biến điểm nhỏ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 30 [TH]. Xét nghiệm karyotype phù hợp để phát hiện\nA. nồng độ protein máu.\nB. tam nhiễm hoặc chuyển đoạn lớn.\nC. hoạt tính enzyme nhỏ.\nD. mọi thay thế một nucleotide.","solution":"Chọn xét nghiệm karyotype.","trap":"Không dùng karyotype để khẳng định mọi thay thế nucleotide.","extra":[],"exampleQuestionNumber":30}],"subjectKey":"biology","shortSubject":"Sinh","slug":"bai-46","summary":"Mất đoạn: thiếu; lặp đoạn: thêm bản sao; đảo đoạn: quay 180°; chuyển đoạn: chuyển vị trí.","searchText":"ĐỘT BIẾN NHIỄM SẮC THỂ Mất đoạn: thiếu; lặp đoạn: thêm bản sao; đảo đoạn: quay 180°; chuyển đoạn: chuyển vị trí. Dạng 1. Nhận dạng đột biến cấu trúc Mất đoạn: thiếu; lặp đoạn: thêm bản sao; đảo đoạn: quay 180°; chuyển đoạn: chuyển vị trí. Một đoạn chromosome bị đứt, quay 180° rồi gắn lại. Đó là đảo đoạn. Không gọi đảo đoạn là đột biến gene.  Dạng 2. Tính thể tam nhiễm và đơn nhiễm Tam nhiễm = 2n+1; đơn nhiễm = 2n-1. Loài 2n=14, hỏi thể tam nhiễm. 2n+1=15 nhiễm sắc thể. Không nhầm tam nhiễm với thể tam bội 3n.  Dạng 3. Tính thể đa bội Tam bội =3n; tứ bội=4n. Loài có n=7, hỏi thể tứ bội. 4n=28 nhiễm sắc thể. Không dùng 2n+2 cho thể tứ bội.  Dạng 4. Không phân li và giao tử bất thường Một cặp không phân li trong giảm phân có thể tạo giao tử n+1 và n-1. Giao tử n+1 thụ tinh với giao tử n. Hợp tử 2n+1, thuộc thể tam nhiễm. Không cho hợp tử 3n.  Dạng 5. Nhận biết hội chứng từ bộ nhiễm sắc thể Down: tam nhiễm 21; Turner: XO; Klinefelter: XXY. Bộ chromosome giới tính XO. Nhận dạng hội chứng Turner. Không nhầm XO với XXY.  Dạng 6. Chọn phương pháp phát hiện Karyotype phát hiện lệch bội hoặc biến đổi cấu trúc lớn; không phát hiện đáng tin cậy đột biến điểm nhỏ. Cần phát hiện tam nhiễm hoặc chuyển đoạn lớn. Chọn xét nghiệm karyotype. Không dùng karyotype để khẳng định mọi thay thế nucleotide. "},{"number":47,"title":"DI TRUYỀN HỌC VỚI CON NGƯỜI","subject":"Sinh học","intro":[],"forms":[{"title":"Dạng 1. Đọc kí hiệu phả hệ","tip":"Vuông: nam; tròn: nữ; tô đen: cá thể biểu hiện tính trạng.","example":"Đề bài:\nTrong một sơ đồ phả hệ, một cá thể được kí hiệu bằng hình vuông tô đen. Hãy cho biết giới tính của cá thể và trạng thái biểu hiện của tính trạng đang được nghiên cứu.","solution":"Đó là nam biểu hiện tính trạng đang xét.","trap":"Không hiểu tô đen là cá thể đã chết.","extra":[]},{"title":"Dạng 2. Bệnh lặn trên nhiễm sắc thể thường","tip":"Bố mẹ không bệnh sinh con bệnh aa → cả hai thường là dị hợp Aa.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Nếu cả bố và mẹ đều Aa, nguy cơ mỗi con mắc bệnh aa là\nA. 75%.\nB. 100%.\nC. 50%.\nD. 25%.","solution":"Nguy cơ mỗi con mắc bệnh aa = 1/4 = 25%.","trap":"Mỗi lần sinh là một sự kiện độc lập.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 3. Di truyền liên kết X","tip":"Con trai nhận X từ mẹ và Y từ cha; allele bệnh lặn trên X của con trai đến từ mẹ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Một phụ nữ mang allele bệnh lặn liên kết X, chồng bình thường. Con trai có nguy cơ nhận allele bệnh từ\nA. mẹ.\nB. không ai.\nC. cha qua Y.\nD. cả hai bắt buộc.","solution":"Con trai có nguy cơ nhận allele bệnh từ mẹ.","trap":"Không cho cha truyền X bệnh cho con trai.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 4. Nhận biết di truyền Y và ti thể","tip":"Y: cha → con trai; ti thể: mẹ → cả con trai và con gái.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 26 [TH]. Tính trạng chỉ truyền từ cha cho con trai gợi ý gene nằm trên\nA. DNA ti thể.\nB. chromosome Y.\nC. chromosome thường lặn.\nD. chromosome X.","solution":"Gợi ý gene trên chromosome Y.","trap":"Không nhầm với DNA ti thể.","extra":[],"exampleQuestionNumber":26},{"title":"Dạng 5. Sàng lọc và chẩn đoán","tip":"Sàng lọc dương tính chỉ cho biết nguy cơ; cần xét nghiệm chẩn đoán và tư vấn chuyên môn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 28 [TH]. Sàng lọc dương tính chưa phải chẩn đoán xác định, cần\nA. kết luận chắc chắn ngay.\nB. không cần kiểm tra lại.\nC. tự điều trị.\nD. xét nghiệm chẩn đoán và tư vấn chuyên môn.","solution":"Không kết luận bệnh chắc chắn; thực hiện bước chẩn đoán phù hợp.","trap":"Không tự điều trị hoặc bỏ qua tư vấn.","extra":[],"exampleQuestionNumber":28},{"title":"Dạng 6. Đạo đức và bảo mật","tip":"Thông tin gene phải được bảo mật, có đồng thuận và không dùng để phân biệt đối xử.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 17 [NB]. Thông tin di truyền cá nhân cần được\nA. bảo mật và sử dụng có đồng thuận.\nB. bán tự do.\nC. dùng để phân biệt đối xử.\nD. công khai bắt buộc.","solution":"Cần đồng thuận, bảo mật và mục đích rõ ràng.","trap":"Không công khai danh tính hoặc ép buộc xét nghiệm.","extra":[],"exampleQuestionNumber":17}],"subjectKey":"biology","shortSubject":"Sinh","slug":"bai-47","summary":"Vuông: nam; tròn: nữ; tô đen: cá thể biểu hiện tính trạng.","searchText":"DI TRUYỀN HỌC VỚI CON NGƯỜI Vuông: nam; tròn: nữ; tô đen: cá thể biểu hiện tính trạng. Dạng 1. Đọc kí hiệu phả hệ Vuông: nam; tròn: nữ; tô đen: cá thể biểu hiện tính trạng. Một hình vuông tô đen. Đó là nam biểu hiện tính trạng đang xét. Không hiểu tô đen là cá thể đã chết.  Dạng 2. Bệnh lặn trên nhiễm sắc thể thường Bố mẹ không bệnh sinh con bệnh aa → cả hai thường là dị hợp Aa. Bố mẹ Aa × Aa. Nguy cơ mỗi con mắc bệnh aa = 1/4 = 25%. Mỗi lần sinh là một sự kiện độc lập.  Dạng 3. Di truyền liên kết X Con trai nhận X từ mẹ và Y từ cha; allele bệnh lặn trên X của con trai đến từ mẹ. Mẹ mang allele bệnh, cha bình thường. Con trai có nguy cơ nhận allele bệnh từ mẹ. Không cho cha truyền X bệnh cho con trai.  Dạng 4. Nhận biết di truyền Y và ti thể Y: cha → con trai; ti thể: mẹ → cả con trai và con gái. Tính trạng chỉ truyền từ cha cho con trai. Gợi ý gene trên chromosome Y. Không nhầm với DNA ti thể.  Dạng 5. Sàng lọc và chẩn đoán Sàng lọc dương tính chỉ cho biết nguy cơ; cần xét nghiệm chẩn đoán và tư vấn chuyên môn. Kết quả sàng lọc trước sinh dương tính. Không kết luận bệnh chắc chắn; thực hiện bước chẩn đoán phù hợp. Không tự điều trị hoặc bỏ qua tư vấn.  Dạng 6. Đạo đức và bảo mật Thông tin gene phải được bảo mật, có đồng thuận và không dùng để phân biệt đối xử. Dữ liệu di truyền cá nhân dùng trong nghiên cứu. Cần đồng thuận, bảo mật và mục đích rõ ràng. Không công khai danh tính hoặc ép buộc xét nghiệm. "},{"number":48,"title":"ỨNG DỤNG CÔNG NGHỆ DI TRUYỀN VÀO ĐỜI SỐNG","subject":"Sinh học","intro":[],"forms":[{"title":"Dạng 1. Quy trình DNA tái tổ hợp","tip":"Enzyme cắt giới hạn cắt DNA; ligase nối đoạn gene vào vector; vector đưa gene vào tế bào nhận.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Muốn sản xuất protein người trong vi khuẩn, bước phù hợp là\nA. chỉ trộn protein với vi khuẩn.\nB. không cần gene.\nC. ghép gene người vào vector rồi đưa vào vi khuẩn.\nD. đưa cả chromosome người vào đá.","solution":"Ghép gene người vào plasmid rồi đưa vào vi khuẩn.","trap":"Không đưa cả chromosome người vào vi khuẩn.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 2. Nhận biết PCR","tip":"PCR khuếch đại đoạn DNA mục tiêu qua nhiều chu kì.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. PCR cần mẫu DNA rất ít nhưng vẫn phân tích được vì\nA. không cần nucleotide.\nB. PCR tạo protein thay DNA.\nC. mẫu tự lớn lên.\nD. DNA mục tiêu được khuếch đại qua nhiều chu kì.","solution":"Dùng PCR để tăng số bản sao DNA mục tiêu.","trap":"PCR không trực tiếp tạo protein.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 3. Nhận biết điện di DNA","tip":"Điện di phân tách các đoạn DNA theo kích thước và điện tích, tạo mẫu băng để so sánh.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Mẫu hiện trường có DNA lẫn nhiều người. Phân tích cần\nA. tách, khuếch đại marker và so sánh thống kê cẩn thận.\nB. kết luận từ một đặc điểm mắt.\nC. bỏ đối chứng.\nD. không cần chuỗi bảo quản mẫu.","solution":"Khuếch đại marker rồi điện di và so sánh.","trap":"Không kết luận từ một đặc điểm hình thái như màu mắt.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 4. Nuôi cấy mô thực vật","tip":"Ưu điểm: nhân nhanh cây giống; hạn chế: đa dạng di truyền thấp và cùng mẫn cảm bệnh.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 24 [TH]. Nuôi cấy mô từ một cây ưu tú tạo nhiều cây giống nhau nhưng có hạn chế\nA. mọi cây khác nhau hoàn toàn.\nB. không thể nhân nhanh.\nC. không cần vô trùng.\nD. đa dạng di truyền thấp và nguy cơ cùng mẫn cảm bệnh.","solution":"Tạo nhiều cây gần giống nhau về di truyền.","trap":"Không cho rằng mọi cây tạo ra hoàn toàn khác nhau.","extra":[],"exampleQuestionNumber":24},{"title":"Dạng 5. Chỉnh sửa soma và phôi","tip":"Chỉnh sửa tế bào soma thường không truyền cho thế hệ sau; chỉnh sửa phôi có thể di truyền.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Chỉnh sửa tế bào soma để điều trị bệnh khác chỉnh sửa phôi ở chỗ\nA. phôi không tạo cơ thể.\nB. cả hai luôn giống nhau.\nC. thay đổi soma không truyền cho thế hệ sau, còn phôi có thể di truyền.\nD. soma không có DNA.","solution":"Điểm khác chính là khả năng truyền thay đổi cho đời sau.","trap":"Không coi hai trường hợp có hệ quả đạo đức giống hệt nhau.","extra":[],"exampleQuestionNumber":23},{"title":"Dạng 6. Đánh giá GMO và an toàn sinh học","tip":"Đánh giá theo đặc tính cụ thể, bằng chứng an toàn và quản lí rủi ro; không đánh giá chỉ dựa vào tên công nghệ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Cây biến đổi gene kháng sâu có thể giảm thuốc trừ sâu nhưng cần\nA. không đánh giá môi trường.\nB. theo dõi kháng sâu, sinh thái và sử dụng có quản lí.\nC. coi rủi ro bằng 0.\nD. trồng độc canh vô hạn.","solution":"Vẫn cần theo dõi kháng sâu, sinh thái và sử dụng có quản lí.","trap":"Không coi rủi ro bằng 0.","extra":[],"exampleQuestionNumber":22}],"subjectKey":"biology","shortSubject":"Sinh","slug":"bai-48","summary":"Enzyme cắt giới hạn cắt DNA; ligase nối đoạn gene vào vector; vector đưa gene vào tế bào nhận.","searchText":"ỨNG DỤNG CÔNG NGHỆ DI TRUYỀN VÀO ĐỜI SỐNG Enzyme cắt giới hạn cắt DNA; ligase nối đoạn gene vào vector; vector đưa gene vào tế bào nhận. Dạng 1. Quy trình DNA tái tổ hợp Enzyme cắt giới hạn cắt DNA; ligase nối đoạn gene vào vector; vector đưa gene vào tế bào nhận. Muốn sản xuất protein người trong vi khuẩn. Ghép gene người vào plasmid rồi đưa vào vi khuẩn. Không đưa cả chromosome người vào vi khuẩn.  Dạng 2. Nhận biết PCR PCR khuếch đại đoạn DNA mục tiêu qua nhiều chu kì. Mẫu DNA hiện trường rất ít nhưng cần phân tích. Dùng PCR để tăng số bản sao DNA mục tiêu. PCR không trực tiếp tạo protein.  Dạng 3. Nhận biết điện di DNA Điện di phân tách các đoạn DNA theo kích thước và điện tích, tạo mẫu băng để so sánh. Cần so sánh marker DNA trong pháp y. Khuếch đại marker rồi điện di và so sánh. Không kết luận từ một đặc điểm hình thái như màu mắt.  Dạng 4. Nuôi cấy mô thực vật Ưu điểm: nhân nhanh cây giống; hạn chế: đa dạng di truyền thấp và cùng mẫn cảm bệnh. Nuôi cấy mô từ một cây ưu tú. Tạo nhiều cây gần giống nhau về di truyền. Không cho rằng mọi cây tạo ra hoàn toàn khác nhau.  Dạng 5. Chỉnh sửa soma và phôi Chỉnh sửa tế bào soma thường không truyền cho thế hệ sau; chỉnh sửa phôi có thể di truyền. So sánh điều trị gene ở tế bào soma với chỉnh sửa phôi. Điểm khác chính là khả năng truyền thay đổi cho đời sau. Không coi hai trường hợp có hệ quả đạo đức giống hệt nhau.  Dạng 6. Đánh giá GMO và an toàn sinh học Đánh giá theo đặc tính cụ thể, bằng chứng an toàn và quản lí rủi ro; không đánh giá chỉ dựa vào tên công nghệ. Cây kháng sâu giúp giảm thuốc trừ sâu. Vẫn cần theo dõi kháng sâu, sinh thái và sử dụng có quản lí. Không coi rủi ro bằng 0. "},{"number":49,"title":"KHÁI NIỆM TIẾN HÓA VÀ CÁC HÌNH THỨC CHỌN LỌC","subject":"Sinh học","intro":[],"forms":[{"title":"Dạng 1. Phân biệt tiến hóa và biến đổi cá thể","tip":"Tiến hóa là biến đổi đặc điểm di truyền của quần thể qua thế hệ, không phải sự lớn lên hay tập luyện của một cá thể.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 28 [TH]. Cá thể lực lưỡng do tập luyện không nhất thiết truyền cho con vì\nA. cơ thể không có tế bào.\nB. mọi đặc điểm đều di truyền.\nC. gene không tồn tại.\nD. biến đổi thu được không làm đổi allele giao tử.","solution":"Đây không phải tiến hóa di truyền của quần thể.","trap":"Không cho rằng đặc điểm thu được trong đời tự động truyền cho con.","extra":[],"exampleQuestionNumber":28},{"title":"Dạng 2. Cơ quan tương đồng và tương tự","tip":"Tương đồng: cùng nguồn gốc, có thể khác chức năng; tương tự: cùng chức năng, nguồn gốc khác.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 4 [NB]. Cơ quan tương đồng là cơ quan\nA. chỉ ở cùng loài.\nB. cùng chức năng nhưng khác nguồn gốc.\nC. không có cấu trúc.\nD. cùng nguồn gốc nhưng có thể khác chức năng.","solution":"Đó là cơ quan tương đồng.","trap":"Không chỉ nhìn chức năng mà bỏ qua nguồn gốc.","extra":[],"exampleQuestionNumber":4},{"title":"Dạng 3. Chọn lọc tự nhiên và nhân tạo","tip":"Môi trường làm cá thể thích nghi hơn sinh sản nhiều → tự nhiên; con người giữ cá thể theo mục tiêu → nhân tạo.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Nông dân giữ hạt từ cây năng suất cao để gieo là\nA. chọn lọc nhân tạo.\nB. trôi dạt gene.\nC. hóa thạch hóa.\nD. chọn lọc tự nhiên duy nhất.","solution":"Đó là chọn lọc nhân tạo.","trap":"Không gọi mọi thay đổi tần số tính trạng là chọn lọc tự nhiên.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 4. Kháng kháng sinh","tip":"Thuốc không tạo kháng có mục đích; biến dị kháng có sẵn sống sót và sinh sản nhiều hơn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Vi khuẩn kháng kháng sinh tăng sau dùng thuốc vì\nA. mọi vi khuẩn đều chết.\nB. thuốc tạo kháng có mục đích ở mọi vi khuẩn.\nC. vi khuẩn kháng sống sót và sinh sản nhiều hơn.\nD. vi khuẩn học cách kháng rồi truyền.","solution":"Giải thích bằng chọn lọc tự nhiên.","trap":"Không nói vi khuẩn “học” cách kháng rồi truyền.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 5. Ba hình thức chọn lọc","tip":"Ổn định ưu tiên trung gian; định hướng ưu tiên một cực; phân hóa ưu tiên hai cực.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 26 [TH]. Một quần thể cá có hai kiểu mỏ phù hợp hai nguồn thức ăn, mỏ trung gian kém hiệu quả. Đây là\nA. chọn lọc ổn định.\nB. chọn lọc phân hóa.\nC. chọn lọc định hướng.\nD. không chọn lọc.","solution":"Chọn lọc phân hóa.","trap":"Không nhầm với chọn lọc ổn định.","extra":[],"exampleQuestionNumber":26},{"title":"Dạng 6. Tính tương đối của thích nghi","tip":"Đặc điểm có lợi hay hại phụ thuộc môi trường.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Một đặc điểm có lợi ở sa mạc nhưng bất lợi ở rừng chứng minh\nA. gene không di truyền.\nB. thích nghi mang tính tương đối.\nC. thích nghi luôn tuyệt đối.\nD. môi trường không tác động chọn lọc.","solution":"Thích nghi mang tính tương đối.","trap":"Không coi một đặc điểm có lợi trong mọi điều kiện.","extra":[],"exampleQuestionNumber":22}],"subjectKey":"biology","shortSubject":"Sinh","slug":"bai-49","summary":"Tiến hóa là biến đổi đặc điểm di truyền của quần thể qua thế hệ, không phải sự lớn lên hay tập luyện của một cá thể.","searchText":"KHÁI NIỆM TIẾN HÓA VÀ CÁC HÌNH THỨC CHỌN LỌC Tiến hóa là biến đổi đặc điểm di truyền của quần thể qua thế hệ, không phải sự lớn lên hay tập luyện của một cá thể. Dạng 1. Phân biệt tiến hóa và biến đổi cá thể Tiến hóa là biến đổi đặc điểm di truyền của quần thể qua thế hệ, không phải sự lớn lên hay tập luyện của một cá thể. Người tập luyện trở nên lực lưỡng. Đây không phải tiến hóa di truyền của quần thể. Không cho rằng đặc điểm thu được trong đời tự động truyền cho con.  Dạng 2. Cơ quan tương đồng và tương tự Tương đồng: cùng nguồn gốc, có thể khác chức năng; tương tự: cùng chức năng, nguồn gốc khác. Hai cơ quan cùng nguồn gốc nhưng đảm nhiệm chức năng khác. Đó là cơ quan tương đồng. Không chỉ nhìn chức năng mà bỏ qua nguồn gốc.  Dạng 3. Chọn lọc tự nhiên và nhân tạo Môi trường làm cá thể thích nghi hơn sinh sản nhiều → tự nhiên; con người giữ cá thể theo mục tiêu → nhân tạo. Nông dân giữ hạt từ cây năng suất cao. Đó là chọn lọc nhân tạo. Không gọi mọi thay đổi tần số tính trạng là chọn lọc tự nhiên.  Dạng 4. Kháng kháng sinh Thuốc không tạo kháng có mục đích; biến dị kháng có sẵn sống sót và sinh sản nhiều hơn. Sau dùng kháng sinh, vi khuẩn kháng tăng. Giải thích bằng chọn lọc tự nhiên. Không nói vi khuẩn “học” cách kháng rồi truyền.  Dạng 5. Ba hình thức chọn lọc Ổn định ưu tiên trung gian; định hướng ưu tiên một cực; phân hóa ưu tiên hai cực. Hai kiểu mỏ cực đoan phù hợp hai nguồn thức ăn, mỏ trung gian kém. Chọn lọc phân hóa. Không nhầm với chọn lọc ổn định.  Dạng 6. Tính tương đối của thích nghi Đặc điểm có lợi hay hại phụ thuộc môi trường. Một đặc điểm có lợi ở sa mạc nhưng bất lợi trong rừng. Thích nghi mang tính tương đối. Không coi một đặc điểm có lợi trong mọi điều kiện. "},{"number":50,"title":"CƠ CHẾ TIẾN HÓA","subject":"Sinh học","intro":[],"forms":[{"title":"Dạng 1. Nhận dạng các nhân tố tiến hóa","tip":"Đột biến tạo allele mới; tái tổ hợp tạo tổ hợp mới; chọn lọc có hướng; trôi dạt ngẫu nhiên; dòng gene do di cư.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 20 [TH]. Một số chim từ đảo A bay sang đảo B và sinh sản. Đây là\nA. mutation.\nB. cách li sinh sản.\nC. thắt cổ chai.\nD. dòng gene.","solution":"Đó là dòng gene.","trap":"Không gọi di cư giữa quần thể là đột biến.","extra":[],"exampleQuestionNumber":20},{"title":"Dạng 2. Trôi dạt di truyền","tip":"Biến động ngẫu nhiên, mạnh ở quần thể nhỏ; có thể làm mất cả allele có lợi.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Một cơn bão ngẫu nhiên giết phần lớn quần thể nhỏ, không phụ thuộc kiểu hình. Đây là\nA. chọn lọc tự nhiên.\nB. dòng gene.\nC. trôi dạt di truyền.\nD. chọn lọc nhân tạo.","solution":"Đây là trôi dạt di truyền.","trap":"Không gọi là chọn lọc nếu sự sống sót không phụ thuộc kiểu hình.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 3. Hiệu ứng thắt cổ chai và người sáng lập","tip":"Giảm mạnh số lượng rồi phục hồi → thắt cổ chai; nhóm nhỏ lập quần thể mới → người sáng lập.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Quần thể mới do 10 cá thể lập nên có tần số allele khác nguồn. Đây là\nA. hiệu ứng người sáng lập.\nB. không tiến hóa.\nC. chọn lọc ổn định.\nD. dòng gene lớn.","solution":"Hiệu ứng người sáng lập.","trap":"Không nhầm với dòng gene lớn liên tục.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 4. Chọn lọc tự nhiên trong quần thể","tip":"Tác nhân môi trường làm cá thể mang allele thích nghi sống và sinh sản nhiều hơn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Thuốc trừ sâu làm côn trùng kháng thuốc tăng tần số. Nhân tố chính là\nA. trôi dạt duy nhất.\nB. chọn lọc tự nhiên.\nC. dòng gene duy nhất.\nD. cách li địa lí.","solution":"Nhân tố chính là chọn lọc tự nhiên.","trap":"Không nói thuốc tạo ra đúng đột biến cần thiết.","extra":[],"exampleQuestionNumber":22},{"title":"Dạng 5. Nhận biết các dạng cách li","tip":"Núi, sông → địa lí; khác mùa → thời gian; cơ quan không phù hợp → cơ học; con lai bất thụ → sau hợp tử.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 27 [TH]. Hai quần thể giao phối khác mùa dù cùng khu vực có\nA. cách li cơ học duy nhất.\nB. cách li địa lí.\nC. cách li thời gian.\nD. không cách li.","solution":"Cách li thời gian.","trap":"Không gọi là cách li địa lí khi cùng khu vực.","extra":[],"exampleQuestionNumber":27},{"title":"Dạng 6. Hình thành loài","tip":"Cách li làm giảm dòng gene; khác biệt di truyền tích lũy đến cách li sinh sản → loài mới.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23 [TH]. Hai quần thể bị núi chia cắt lâu dài, tích lũy khác biệt rồi không giao phối được. Đây là\nA. nguyên phân.\nB. phiên mã.\nC. hình thành loài do cách li địa lí.\nD. chọn lọc nhân tạo.","solution":"Hình thành loài do cách li địa lí.","trap":"Không cho rằng một cá thể thay đổi trong đời là loài mới.","extra":[],"exampleQuestionNumber":23}],"subjectKey":"biology","shortSubject":"Sinh","slug":"bai-50","summary":"Đột biến tạo allele mới; tái tổ hợp tạo tổ hợp mới; chọn lọc có hướng; trôi dạt ngẫu nhiên; dòng gene do di cư.","searchText":"CƠ CHẾ TIẾN HÓA Đột biến tạo allele mới; tái tổ hợp tạo tổ hợp mới; chọn lọc có hướng; trôi dạt ngẫu nhiên; dòng gene do di cư. Dạng 1. Nhận dạng các nhân tố tiến hóa Đột biến tạo allele mới; tái tổ hợp tạo tổ hợp mới; chọn lọc có hướng; trôi dạt ngẫu nhiên; dòng gene do di cư. Một số chim từ đảo A sang đảo B và sinh sản. Đó là dòng gene. Không gọi di cư giữa quần thể là đột biến.  Dạng 2. Trôi dạt di truyền Biến động ngẫu nhiên, mạnh ở quần thể nhỏ; có thể làm mất cả allele có lợi. Bão giết ngẫu nhiên phần lớn quần thể nhỏ. Đây là trôi dạt di truyền. Không gọi là chọn lọc nếu sự sống sót không phụ thuộc kiểu hình.  Dạng 3. Hiệu ứng thắt cổ chai và người sáng lập Giảm mạnh số lượng rồi phục hồi → thắt cổ chai; nhóm nhỏ lập quần thể mới → người sáng lập. Mười cá thể lập quần thể mới có tần số allele khác nguồn. Hiệu ứng người sáng lập. Không nhầm với dòng gene lớn liên tục.  Dạng 4. Chọn lọc tự nhiên trong quần thể Tác nhân môi trường làm cá thể mang allele thích nghi sống và sinh sản nhiều hơn. Thuốc trừ sâu làm côn trùng kháng thuốc tăng tần số. Nhân tố chính là chọn lọc tự nhiên. Không nói thuốc tạo ra đúng đột biến cần thiết.  Dạng 5. Nhận biết các dạng cách li Núi, sông → địa lí; khác mùa → thời gian; cơ quan không phù hợp → cơ học; con lai bất thụ → sau hợp tử. Hai quần thể giao phối khác mùa. Cách li thời gian. Không gọi là cách li địa lí khi cùng khu vực.  Dạng 6. Hình thành loài Cách li làm giảm dòng gene; khác biệt di truyền tích lũy đến cách li sinh sản → loài mới. Hai quần thể bị núi chia cắt lâu, sau đó không giao phối được. Hình thành loài do cách li địa lí. Không cho rằng một cá thể thay đổi trong đời là loài mới. "},{"number":51,"title":"SỰ PHÁT SINH VÀ PHÁT TRIỂN SỰ SỐNG TRÊN TRÁI ĐẤT","subject":"Sinh học","intro":[],"forms":[{"title":"Dạng 1. Ba giai đoạn phát sinh sự sống","tip":"Tiến hóa hóa học → tiền sinh học → sinh học.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 2 [NB]. Tiến hóa hóa học là quá trình\nA. hình thành đá vôi.\nB. hình thành chất hữu cơ từ chất vô cơ trong điều kiện Trái Đất nguyên thủy.\nC. tạo loài mới từ quần thể hiện đại.\nD. phân giải protein.","solution":"Tiến hóa hóa học.","trap":"Không gọi việc tạo amino acid đơn giản là đã tạo tế bào sống.","extra":[],"exampleQuestionNumber":2},{"title":"Dạng 2. Ý nghĩa thí nghiệm Miller–Urey","tip":"Thí nghiệm cho thấy chất hữu cơ đơn giản có thể hình thành trong điều kiện mô phỏng Trái Đất nguyên thủy.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19 [TH]. Thí nghiệm tạo amino acid từ khí vô cơ không chứng minh đã tạo sự sống vì\nA. không có phản ứng hóa học.\nB. sự sống không cần màng.\nC. chỉ tạo phân tử hữu cơ đơn giản, chưa có tế bào tự sao chép.\nD. amino acid là tế bào hoàn chỉnh.","solution":"Kết luận chỉ hỗ trợ tiến hóa hóa học, chưa tạo ra sự sống hoàn chỉnh.","trap":"Không coi amino acid là tế bào tự sao chép.","extra":[],"exampleQuestionNumber":19},{"title":"Dạng 3. Dạng sống đầu tiên và oxygen","tip":"Nguồn nêu dạng sống đầu tiên có khả năng là tế bào đơn giản, nhân sơ, dị dưỡng kị khí; quang hợp về sau làm tăng oxygen.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 9 [NB]. Sự tăng oxygen tạo điều kiện hình thành\nA. tầng ozone và hô hấp hiếu khí.\nB. khí quyển không có bảo vệ.\nC. mọi sinh vật kị khí tăng vô hạn.\nD. không ảnh hưởng tiến hóa.","solution":"Tạo điều kiện cho hô hấp hiếu khí và tầng ozone.","trap":"Không cho rằng khí quyển nguyên thủy giàu oxygen tự do.","extra":[],"exampleQuestionNumber":9},{"title":"Dạng 4. Thuyết nội cộng sinh","tip":"Ti thể và lục lạp có DNA vòng, ribosome riêng và phân chia tương tự vi khuẩn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21 [TH]. Nội cộng sinh được ủng hộ vì ti thể và lục lạp có\nA. DNA vòng và ribosome riêng, phân chia tương tự vi khuẩn.\nB. không có màng.\nC. chỉ protein từ nhân.\nD. không tự phân chia.","solution":"Chọn đặc điểm DNA vòng và ribosome riêng.","trap":"Không dùng sự có mặt của màng tế bào chung làm bằng chứng đặc trưng.","extra":[],"exampleQuestionNumber":21},{"title":"Dạng 5. Xác định tuổi hóa thạch","tip":"Lớp sâu hơn thường cổ hơn nếu không bị đảo lộn; định tuổi phóng xạ dựa tốc độ phân rã isotope.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 22 [TH]. Hóa thạch ở lớp sâu hơn thường\nA. cùng tuổi mọi lớp.\nB. cổ hơn nếu các lớp không bị đảo lộn.\nC. không thể so sánh.\nD. trẻ hơn luôn.
