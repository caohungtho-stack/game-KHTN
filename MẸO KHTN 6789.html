ệt năng 200J, sau khi nung nóng nhiệt năng của nó là 400J. Hỏi nhiệt lượng mà vật nhận được là bao nhiêu?\nA. 600 J\nB. 200 J\nC. 100 J\nD. 400 J Theo đáp án của ngân hàng: chọn B. 200 J Q = 400−200 = 200 J. Phải xét dấu: nhận nhiệt Q dương, tỏa nhiệt Q âm theo quy ước."},{"number":27,"title":"THỰC HÀNH ĐO NĂNG LƯỢNG NHIỆT BẰNG JOULEMETER .","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-27","summary":"Thực hành đo năng lượng nhiệt bằng Joulemeter","intro":["Thực hành đo năng lượng nhiệt bằng Joulemeter"],"forms":[{"title":"Dạng 1. Lắp mạch Joulemeter","tip":"Nối Joulemeter đúng cổng nguồn và tải, chọn chế độ năng lượng, kiểm tra giới hạn đo trước khi bật.","example":"Đề bài thực hành bổ sung:\nHãy nêu thứ tự lắp Joulemeter để đo năng lượng điện cung cấp cho dây đốt nóng.","solution":"Ngắt nguồn → nối nguồn qua Joulemeter đến dây đốt → chọn chế độ J → reset → bật nguồn → đọc năng lượng sau thời gian quy định.","trap":"Không thay đổi dây nối khi đang cấp điện.","extra":[]},{"title":"Dạng 2. Đo nhiệt độ trước và sau","tip":"Khuấy nhẹ để nhiệt độ đồng đều; đo T1 trước và T2 sau khi cấp năng lượng.","example":"Đề bài thực hành bổ sung:\nHãy nêu cách đo nhiệt độ của nước trước và sau khi dùng Joulemeter cấp năng lượng cho dây đốt nóng.","solution":"Đo nhiệt độ ban đầu T1 khi nước đã ổn định; cấp điện trong thời gian quy định, khuấy nhẹ; ngắt nguồn rồi đo T2. Độ tăng nhiệt độ là ΔT = T2 − T1.","trap":"Không để nhiệt kế chạm đáy hoặc thành bình.","extra":[]},{"title":"Dạng 3. Đánh giá hao phí","tip":"So sánh năng lượng điện Joulemeter ghi với nhiệt lượng nước nhận; chênh lệch là hao phí ra bình và môi trường.","example":"Đề bài thực hành bổ sung:\nJoulemeter chỉ 5000 J, nước nhận 4200 J. Tính hiệu suất truyền nhiệt.","solution":"H = 4200/5000×100% = 84%.","trap":"Không mặc định hiệu suất 100%.","extra":[]}],"searchText":"THỰC HÀNH ĐO NĂNG LƯỢNG NHIỆT BẰNG JOULEMETER . Thực hành đo năng lượng nhiệt bằng Joulemeter Dạng 1. Lắp mạch Joulemeter Nối Joulemeter đúng cổng nguồn và tải, chọn chế độ năng lượng, kiểm tra giới hạn đo trước khi bật. Đề bài thực hành bổ sung:\nHãy nêu thứ tự lắp Joulemeter để đo năng lượng điện cung cấp cho dây đốt nóng. Ngắt nguồn → nối nguồn qua Joulemeter đến dây đốt → chọn chế độ J → reset → bật nguồn → đọc năng lượng sau thời gian quy định. Không thay đổi dây nối khi đang cấp điện. Dạng 2. Đo nhiệt độ trước và sau Khuấy nhẹ để nhiệt độ đồng đều; đo T1 trước và T2 sau khi cấp năng lượng. Đề bài thực hành bổ sung:\nHãy nêu cách đo nhiệt độ của nước trước và sau khi dùng Joulemeter cấp năng lượng cho dây đốt nóng. Đo nhiệt độ ban đầu T1 khi nước đã ổn định; cấp điện trong thời gian quy định, khuấy nhẹ; ngắt nguồn rồi đo T2. Độ tăng nhiệt độ là ΔT = T2 − T1. Không để nhiệt kế chạm đáy hoặc thành bình. Dạng 3. Đánh giá hao phí So sánh năng lượng điện Joulemeter ghi với nhiệt lượng nước nhận; chênh lệch là hao phí ra bình và môi trường. Đề bài thực hành bổ sung:\nJoulemeter chỉ 5000 J, nước nhận 4200 J. Tính hiệu suất truyền nhiệt. H = 4200/5000×100% = 84%. Không mặc định hiệu suất 100%."},{"number":28,"title":"SỰ TRUYỀN NHIỆT.","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-28","summary":"Sự truyền nhiệt","intro":["Sự truyền nhiệt"],"forms":[{"title":"Dạng 1. Dẫn nhiệt","tip":"Trong dẫn nhiệt, năng lượng truyền từ vùng nóng sang vùng lạnh mà vật chất không chuyển dời thành dòng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 3: Trong sự dẫn nhiệt, nhiệt được truyền từ vật nào sang vật nào? Chọn câu trả lời đúng nhất.\nA. Từ vật có khối lượng lớn hơn sang vật có khối lượng nhỏ hơn.\nB. Từ vật có nhiệt độ thấp hơn sang vật có nhiệt độ cao hơn.\nC. Từ vật có nhiệt năng lớn hơn sang vật có nhiệt năng nhỏ hơn.\nD. Các phương án trên đều đúng.","solution":"Theo đáp án của ngân hàng: chọn C. Từ vật có nhiệt năng lớn hơn sang vật có nhiệt năng nhỏ hơn. Trong dẫn nhiệt, năng lượng truyền từ vùng nóng sang vùng lạnh mà vật chất không chuyển dời thành dòng.","trap":"Kim loại dẫn nhiệt tốt hơn gỗ nhưng không phải mọi chất rắn dẫn nhiệt như nhau.","extra":[]},{"title":"Dạng 2. Đối lưu","tip":"Đối lưu chủ yếu xảy ra trong chất lỏng và chất khí do các phần vật chất nóng, nhẹ chuyển động lên.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 18: Ngăn đá của tủ lạnh thường đặt ở phía trên ngăn đựng thức ăn, để tận dụng sự truyền nhiệt bằng\nA. bức xạ nhiệt.\nB. đối lưu.\nC. dẫn nhiệt.\nD. bức xạ nhiệt và dẫn nhiệt.","solution":"Theo đáp án của ngân hàng: chọn B. đối lưu. Đối lưu chủ yếu xảy ra trong chất lỏng và chất khí do các phần vật chất nóng, nhẹ chuyển động lên.","trap":"Trong chất rắn không có dòng đối lưu.","extra":[]},{"title":"Dạng 3. Bức xạ nhiệt","tip":"Bức xạ nhiệt truyền được qua chân không; năng lượng Mặt Trời đến Trái Đất bằng bức xạ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 4: Năng lượng Mặt Trời truyền xuống Trái Đất bằng cách nào?\nA. Bằng sự dẫn nhiệt qua không khí.\nB. Bằng sự đối lưu.\nC. Bằng bức xạ nhiệt.\nD. Bằng một hình thức khác.","solution":"Theo đáp án của ngân hàng: chọn C. Bằng bức xạ nhiệt. Bức xạ nhiệt truyền được qua chân không; năng lượng Mặt Trời đến Trái Đất bằng bức xạ.","trap":"Không gọi bức xạ là dẫn nhiệt qua không khí.","extra":[]}],"searchText":"SỰ TRUYỀN NHIỆT. Sự truyền nhiệt Dạng 1. Dẫn nhiệt Trong dẫn nhiệt, năng lượng truyền từ vùng nóng sang vùng lạnh mà vật chất không chuyển dời thành dòng. Đề bài tham khảo từ ngân hàng:\nCâu 3: Trong sự dẫn nhiệt, nhiệt được truyền từ vật nào sang vật nào? Chọn câu trả lời đúng nhất.\nA. Từ vật có khối lượng lớn hơn sang vật có khối lượng nhỏ hơn.\nB. Từ vật có nhiệt độ thấp hơn sang vật có nhiệt độ cao hơn.\nC. Từ vật có nhiệt năng lớn hơn sang vật có nhiệt năng nhỏ hơn.\nD. Các phương án trên đều đúng. Theo đáp án của ngân hàng: chọn C. Từ vật có nhiệt năng lớn hơn sang vật có nhiệt năng nhỏ hơn. Trong dẫn nhiệt, năng lượng truyền từ vùng nóng sang vùng lạnh mà vật chất không chuyển dời thành dòng. Kim loại dẫn nhiệt tốt hơn gỗ nhưng không phải mọi chất rắn dẫn nhiệt như nhau. Dạng 2. Đối lưu Đối lưu chủ yếu xảy ra trong chất lỏng và chất khí do các phần vật chất nóng, nhẹ chuyển động lên. Đề bài tham khảo từ ngân hàng:\nCâu 18: Ngăn đá của tủ lạnh thường đặt ở phía trên ngăn đựng thức ăn, để tận dụng sự truyền nhiệt bằng\nA. bức xạ nhiệt.\nB. đối lưu.\nC. dẫn nhiệt.\nD. bức xạ nhiệt và dẫn nhiệt. Theo đáp án của ngân hàng: chọn B. đối lưu. Đối lưu chủ yếu xảy ra trong chất lỏng và chất khí do các phần vật chất nóng, nhẹ chuyển động lên. Trong chất rắn không có dòng đối lưu. Dạng 3. Bức xạ nhiệt Bức xạ nhiệt truyền được qua chân không; năng lượng Mặt Trời đến Trái Đất bằng bức xạ. Đề bài tham khảo từ ngân hàng:\nCâu 4: Năng lượng Mặt Trời truyền xuống Trái Đất bằng cách nào?\nA. Bằng sự dẫn nhiệt qua không khí.\nB. Bằng sự đối lưu.\nC. Bằng bức xạ nhiệt.\nD. Bằng một hình thức khác. Theo đáp án của ngân hàng: chọn C. Bằng bức xạ nhiệt. Bức xạ nhiệt truyền được qua chân không; năng lượng Mặt Trời đến Trái Đất bằng bức xạ. Không gọi bức xạ là dẫn nhiệt qua không khí."},{"number":29,"title":"SỰ NỞ VÌ NHIỆT.","subject":"Vật lý","subjectKey":"physics","shortSubject":"Lý","slug":"bai-29","summary":"Sự nở vì nhiệt","intro":["Sự nở vì nhiệt"],"forms":[{"title":"Dạng 1. So sánh mức nở của rắn, lỏng, khí","tip":"Thông thường chất khí nở vì nhiệt nhiều hơn chất lỏng, chất lỏng nhiều hơn chất rắn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 2: Chọn từ thích hợp điền vào chỗ trống: Chất khi nở vì nhiệt ... chất lỏng, chất lỏng nở vì nhiệt ... chất rắn\nA. nhiều hơn- ít hơn.\nB. nhiều hơn- nhiều hơn.\nC. ít hơn- nhiều hơn.\nD. ít hơn- ít hơn.","solution":"Theo đáp án của ngân hàng: chọn B. nhiều hơn- nhiều hơn. Thông thường chất khí nở vì nhiệt nhiều hơn chất lỏng, chất lỏng nhiều hơn chất rắn.","trap":"So sánh chỉ có ý nghĩa trong cùng điều kiện tăng nhiệt độ.","extra":[]},{"title":"Dạng 2. Ứng dụng tháo nắp, nút bị kẹt","tip":"Làm nóng phần ngoài để nó nở ra nhiều hơn, giúp nới lỏng chỗ kẹt.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 6: Khi nút thủy tinh của một lọ thủy tinh bị kẹt. Phải mở nút bằng cách nào dưới đây?\nA. Làm nóng nút.\nB. Làm nóng cổ lọ.\nC. Làm lạnh cổ lọ.\nD. Làm lạnh đáy lọ.","solution":"Theo đáp án của ngân hàng: chọn B. Làm nóng cổ lọ. Làm nóng phần ngoài để nó nở ra nhiều hơn, giúp nới lỏng chỗ kẹt.","trap":"Không đun nóng đột ngột thủy tinh dễ gây nứt vỡ.","extra":[]},{"title":"Dạng 3. Khe co giãn và con lăn cầu","tip":"Cầu và đường ray cần chỗ dịch chuyển khi nhiệt độ thay đổi để tránh cong, nứt.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 17: Khi xây cầu, thông thường một đầu cầu người ta cho gối lên các con lăn. Hãy giải thích cách làm đó?\nA. Để dễ dàng tu sửa cầu.\nB. Để tránh tác hại của sự dãn nở vì nhiệt.\nC. Để tạo thẩm mỹ.\nD. Cả 3 lý do trên.","solution":"Theo đáp án của ngân hàng: chọn B. Để tránh tác hại của sự dãn nở vì nhiệt. Cầu và đường ray cần chỗ dịch chuyển khi nhiệt độ thay đổi để tránh cong, nứt.","trap":"Không cố định cứng cả hai đầu của kết cấu dài.","extra":[]}],"searchText":"SỰ NỞ VÌ NHIỆT. Sự nở vì nhiệt Dạng 1. So sánh mức nở của rắn, lỏng, khí Thông thường chất khí nở vì nhiệt nhiều hơn chất lỏng, chất lỏng nhiều hơn chất rắn. Đề bài tham khảo từ ngân hàng:\nCâu 2: Chọn từ thích hợp điền vào chỗ trống: Chất khi nở vì nhiệt ... chất lỏng, chất lỏng nở vì nhiệt ... chất rắn\nA. nhiều hơn- ít hơn.\nB. nhiều hơn- nhiều hơn.\nC. ít hơn- nhiều hơn.\nD. ít hơn- ít hơn. Theo đáp án của ngân hàng: chọn B. nhiều hơn- nhiều hơn. Thông thường chất khí nở vì nhiệt nhiều hơn chất lỏng, chất lỏng nhiều hơn chất rắn. So sánh chỉ có ý nghĩa trong cùng điều kiện tăng nhiệt độ. Dạng 2. Ứng dụng tháo nắp, nút bị kẹt Làm nóng phần ngoài để nó nở ra nhiều hơn, giúp nới lỏng chỗ kẹt. Đề bài tham khảo từ ngân hàng:\nCâu 6: Khi nút thủy tinh của một lọ thủy tinh bị kẹt. Phải mở nút bằng cách nào dưới đây?\nA. Làm nóng nút.\nB. Làm nóng cổ lọ.\nC. Làm lạnh cổ lọ.\nD. Làm lạnh đáy lọ. Theo đáp án của ngân hàng: chọn B. Làm nóng cổ lọ. Làm nóng phần ngoài để nó nở ra nhiều hơn, giúp nới lỏng chỗ kẹt. Không đun nóng đột ngột thủy tinh dễ gây nứt vỡ. Dạng 3. Khe co giãn và con lăn cầu Cầu và đường ray cần chỗ dịch chuyển khi nhiệt độ thay đổi để tránh cong, nứt. Đề bài tham khảo từ ngân hàng:\nCâu 17: Khi xây cầu, thông thường một đầu cầu người ta cho gối lên các con lăn. Hãy giải thích cách làm đó?\nA. Để dễ dàng tu sửa cầu.\nB. Để tránh tác hại của sự dãn nở vì nhiệt.\nC. Để tạo thẩm mỹ.\nD. Cả 3 lý do trên. Theo đáp án của ngân hàng: chọn B. Để tránh tác hại của sự dãn nở vì nhiệt. Cầu và đường ray cần chỗ dịch chuyển khi nhiệt độ thay đổi để tránh cong, nứt. Không cố định cứng cả hai đầu của kết cấu dài."},{"number":30,"title":"KHÁI QUÁT VỀ CƠ THỂ NGƯỜI.","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-30","summary":"Khái quát cơ thể người","intro":["Khái quát cơ thể người"],"forms":[{"title":"Dạng 1. Các phần và khoang cơ thể","tip":"Cơ thể người gồm đầu, thân và các chi; thân có khoang ngực và khoang bụng ngăn bởi cơ hoành.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 4: Cơ thể người được phân chia thành mấy phần ? Đó là những phần nào ?\nA. 3 phần : đầu, thân và chân.\nB. 2 phần : đầu và thân\nC. 3 phần : đầu, thân và các chi.\nD. 3 phần : đầu, cổ và thân","solution":"Theo đáp án của ngân hàng: chọn C. 3 phần : đầu, thân và các chi. Cơ thể người gồm đầu, thân và các chi; thân có khoang ngực và khoang bụng ngăn bởi cơ hoành.","trap":"Không xếp cơ quan theo tên hệ thay vì vị trí khoang.","extra":[]},{"title":"Dạng 2. Các loại mô cơ bản","tip":"Mô liên kết có vai trò nâng đỡ, liên kết và tạo cầu nối giữa các cơ quan.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 10: Trong cơ thể người, loại mô nào có chức năng nâng đỡ và là cầu nối giữa các cơ quan?\nA. Mô cơ.\nB. Mô thần kinh.\nC. Mô biểu bì.\nD. Mô liên kết.","solution":"Theo đáp án của ngân hàng: chọn D. Mô liên kết. Mô liên kết có vai trò nâng đỡ, liên kết và tạo cầu nối giữa các cơ quan.","trap":"Không nhầm mô liên kết với mô cơ hoặc mô thần kinh.","extra":[]},{"title":"Dạng 3. Sự phối hợp giữa các hệ cơ quan","tip":"Hoạt động vận động mạnh cần phối hợp hệ vận động, hô hấp, tuần hoàn, thần kinh và nội tiết.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 8: Khi chạy có những hệ cơ quan nào hoạt động? 1. Hệ tuần hoàn 2. Hệ hô hấp 3. Hệ bài tiết 4. Hệ thần kinh 5. Hệ nội tiết 6. Hệ sinh dục 7. Hệ vận động Chọn câu trả lời đúng trong các câu sau:\nA. 1,2,3,4,5,6\nB. 1, 3,4, 5, 6, 7\nC. 1,2,3,4,5,7\nD. 1,2,3,4,6,7","solution":"Theo đáp án của ngân hàng: chọn C. 1,2,3,4,5,7 Hoạt động vận động mạnh cần phối hợp hệ vận động, hô hấp, tuần hoàn, thần kinh và nội tiết.","trap":"Không xem các hệ cơ quan hoạt động hoàn toàn độc lập.","extra":[]}],"searchText":"KHÁI QUÁT VỀ CƠ THỂ NGƯỜI. Khái quát cơ thể người Dạng 1. Các phần và khoang cơ thể Cơ thể người gồm đầu, thân và các chi; thân có khoang ngực và khoang bụng ngăn bởi cơ hoành. Đề bài tham khảo từ ngân hàng:\nCâu 4: Cơ thể người được phân chia thành mấy phần ? Đó là những phần nào ?\nA. 3 phần : đầu, thân và chân.\nB. 2 phần : đầu và thân\nC. 3 phần : đầu, thân và các chi.\nD. 3 phần : đầu, cổ và thân Theo đáp án của ngân hàng: chọn C. 3 phần : đầu, thân và các chi. Cơ thể người gồm đầu, thân và các chi; thân có khoang ngực và khoang bụng ngăn bởi cơ hoành. Không xếp cơ quan theo tên hệ thay vì vị trí khoang. Dạng 2. Các loại mô cơ bản Mô liên kết có vai trò nâng đỡ, liên kết và tạo cầu nối giữa các cơ quan. Đề bài tham khảo từ ngân hàng:\nCâu 10: Trong cơ thể người, loại mô nào có chức năng nâng đỡ và là cầu nối giữa các cơ quan?\nA. Mô cơ.\nB. Mô thần kinh.\nC. Mô biểu bì.\nD. Mô liên kết. Theo đáp án của ngân hàng: chọn D. Mô liên kết. Mô liên kết có vai trò nâng đỡ, liên kết và tạo cầu nối giữa các cơ quan. Không nhầm mô liên kết với mô cơ hoặc mô thần kinh. Dạng 3. Sự phối hợp giữa các hệ cơ quan Hoạt động vận động mạnh cần phối hợp hệ vận động, hô hấp, tuần hoàn, thần kinh và nội tiết. Đề bài tham khảo từ ngân hàng:\nCâu 8: Khi chạy có những hệ cơ quan nào hoạt động? 1. Hệ tuần hoàn 2. Hệ hô hấp 3. Hệ bài tiết 4. Hệ thần kinh 5. Hệ nội tiết 6. Hệ sinh dục 7. Hệ vận động Chọn câu trả lời đúng trong các câu sau:\nA. 1,2,3,4,5,6\nB. 1, 3,4, 5, 6, 7\nC. 1,2,3,4,5,7\nD. 1,2,3,4,6,7 Theo đáp án của ngân hàng: chọn C. 1,2,3,4,5,7 Hoạt động vận động mạnh cần phối hợp hệ vận động, hô hấp, tuần hoàn, thần kinh và nội tiết. Không xem các hệ cơ quan hoạt động hoàn toàn độc lập."},{"number":31,"title":"HỆ VẬN ĐỘNG Ở NGƯỜI.","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-31","summary":"Hệ vận động ở người","intro":["Hệ vận động ở người"],"forms":[{"title":"Dạng 1. Cấu tạo và tính chất của xương","tip":"Xương gồm chất hữu cơ tạo tính dẻo và muối khoáng tạo độ cứng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 4: Thành phần cấu tạo của xương\nA. Chủ yếu là chất hữu cơ (cốt giao)\nB. Chủ yếu là chất vô cơ (muối khoáng)\nC. Chất hữu cơ (cốt giao) và chất vô cơ (muối khoáng) có tỉ lệ chất cốt giao không đổi\nD. Chất hữu cơ (cốt giao) và chất vô cơ (muối khoáng) có tỉ lệ chất cốt giao thay đổi theo độ tuổi","solution":"Theo đáp án của ngân hàng: chọn D. Chất hữu cơ (cốt giao) và chất vô cơ (muối khoáng) có tỉ lệ chất cốt giao thay đổi theo độ tuổi Xương gồm chất hữu cơ tạo tính dẻo và muối khoáng tạo độ cứng.","trap":"Không nói xương chỉ gồm calcium.","extra":[]},{"title":"Dạng 2. Tính chất và hoạt động của cơ","tip":"Cơ có tính co và dãn; cơ co làm bắp cơ ngắn và to, tạo vận động qua khớp.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 5: Cơ có hai tính chất cơ bản, đó là\nA. co và dãn.\nB. gấp và duỗi.\nC. phồng và xẹp.\nD. kéo và đẩy.","solution":"Theo đáp án của ngân hàng: chọn A. co và dãn. Cơ có tính co và dãn; cơ co làm bắp cơ ngắn và to, tạo vận động qua khớp.","trap":"Không nhầm co cơ với xương tự chuyển động.","extra":[]},{"title":"Dạng 3. Phòng tránh cong vẹo cột sống","tip":"Ngồi, đứng đúng tư thế; mang vác cân đối; bàn ghế phù hợp và luyện tập thường xuyên.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 2: Để chống vẹo cột sống, cần phải làm gì?\nA. Khi ngồi phải ngay ngắn, không nghiêng vẹo.\nB. Mang vác về một bên liên tục\nC. Mang vác quá sức chịu đựng.\nD. Cả ba đáp án trên.","solution":"Theo đáp án của ngân hàng: chọn A. Khi ngồi phải ngay ngắn, không nghiêng vẹo. Ngồi, đứng đúng tư thế; mang vác cân đối; bàn ghế phù hợp và luyện tập thường xuyên.","trap":"Không đeo cặp lệch một bên kéo dài.","extra":[]}],"searchText":"HỆ VẬN ĐỘNG Ở NGƯỜI. Hệ vận động ở người Dạng 1. Cấu tạo và tính chất của xương Xương gồm chất hữu cơ tạo tính dẻo và muối khoáng tạo độ cứng. Đề bài tham khảo từ ngân hàng:\nCâu 4: Thành phần cấu tạo của xương\nA. Chủ yếu là chất hữu cơ (cốt giao)\nB. Chủ yếu là chất vô cơ (muối khoáng)\nC. Chất hữu cơ (cốt giao) và chất vô cơ (muối khoáng) có tỉ lệ chất cốt giao không đổi\nD. Chất hữu cơ (cốt giao) và chất vô cơ (muối khoáng) có tỉ lệ chất cốt giao thay đổi theo độ tuổi Theo đáp án của ngân hàng: chọn D. Chất hữu cơ (cốt giao) và chất vô cơ (muối khoáng) có tỉ lệ chất cốt giao thay đổi theo độ tuổi Xương gồm chất hữu cơ tạo tính dẻo và muối khoáng tạo độ cứng. Không nói xương chỉ gồm calcium. Dạng 2. Tính chất và hoạt động của cơ Cơ có tính co và dãn; cơ co làm bắp cơ ngắn và to, tạo vận động qua khớp. Đề bài tham khảo từ ngân hàng:\nCâu 5: Cơ có hai tính chất cơ bản, đó là\nA. co và dãn.\nB. gấp và duỗi.\nC. phồng và xẹp.\nD. kéo và đẩy. Theo đáp án của ngân hàng: chọn A. co và dãn. Cơ có tính co và dãn; cơ co làm bắp cơ ngắn và to, tạo vận động qua khớp. Không nhầm co cơ với xương tự chuyển động. Dạng 3. Phòng tránh cong vẹo cột sống Ngồi, đứng đúng tư thế; mang vác cân đối; bàn ghế phù hợp và luyện tập thường xuyên. Đề bài tham khảo từ ngân hàng:\nCâu 2: Để chống vẹo cột sống, cần phải làm gì?\nA. Khi ngồi phải ngay ngắn, không nghiêng vẹo.\nB. Mang vác về một bên liên tục\nC. Mang vác quá sức chịu đựng.\nD. Cả ba đáp án trên. Theo đáp án của ngân hàng: chọn A. Khi ngồi phải ngay ngắn, không nghiêng vẹo. Ngồi, đứng đúng tư thế; mang vác cân đối; bàn ghế phù hợp và luyện tập thường xuyên. Không đeo cặp lệch một bên kéo dài."},{"number":32,"title":"DINH DƯỠNG VÀ TIÊU HÓA Ở NGƯỜI.","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-32","summary":"Dinh dưỡng và tiêu hóa ở người","intro":["Dinh dưỡng và tiêu hóa ở người"],"forms":[{"title":"Dạng 1. Các hoạt động của tiêu hóa","tip":"Tiêu hóa gồm biến đổi lí học, biến đổi hóa học, hấp thụ chất dinh dưỡng và thải bã.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1: Quá trình tiêu hóa được thực hiện bởi hoạt động của:\nA. Các tuyến tiêu hóa.\nB. Các cơ quan trong ống tiêu hóa\nC. Hoạt động của các enzyme.\nD. Các cơ quan trong ống tiêu hóa và các tuyến tiêu hóa.","solution":"Theo đáp án của ngân hàng: chọn D. Các cơ quan trong ống tiêu hóa và các tuyến tiêu hóa. Tiêu hóa gồm biến đổi lí học, biến đổi hóa học, hấp thụ chất dinh dưỡng và thải bã.","trap":"Không coi tiêu hóa chỉ là nghiền nhỏ thức ăn.","extra":[]},{"title":"Dạng 2. Vị trí hấp thụ chất dinh dưỡng","tip":"Ruột non có diện tích hấp thụ lớn nhờ nếp gấp, lông ruột và vi nhung mao.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 13: Trong ống tiêu hoá ở người, vai trò hấp thụ chất dinh dưỡng chủ yếu thuộc về cơ quan nào?\nA. Ruột thừa.\nB. Ruột già.\nC. Ruột non.\nD. Dạ dày.","solution":"Theo đáp án của ngân hàng: chọn C. Ruột non. Ruột non có diện tích hấp thụ lớn nhờ nếp gấp, lông ruột và vi nhung mao.","trap":"Không chọn dạ dày là nơi hấp thụ chủ yếu.","extra":[]},{"title":"Dạng 3. Xây dựng khẩu phần hợp lí","tip":"Khẩu phần cần đủ năng lượng, cân đối chất dinh dưỡng, phù hợp tuổi, giới, mức hoạt động và tình trạng cơ thể.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 7: Bữa ăn hợp lý dựa trên nhu cầu dinh dưỡng của cơ thể nhằm đáp ứng được yêu cầu?\nA. Cung cấp cho cơ thể đủ các chất dinh dưỡng theo nhu cầu, lứa tuổi, khả năng lao động, môi trường, khí hậu.\nB. Đảm bảo bữa ăn hàng ngày cân đối, đủ dinh dưỡng để phát triển tốt thể lực và trí lực, có sức khỏe để lao động\nC. Thức ăn phải đảm bảo an toàn vệ sinh, không được là nguồn lây bệnh\nD. Tất cả các đáp án trên","solution":"Theo đáp án của ngân hàng: chọn D. Tất cả các đáp án trên Khẩu phần cần đủ năng lượng, cân đối chất dinh dưỡng, phù hợp tuổi, giới, mức hoạt động và tình trạng cơ thể.","trap":"Không chỉ tính lượng thức ăn mà bỏ chất lượng và tỉ lệ dinh dưỡng.","extra":[]}],"searchText":"DINH DƯỠNG VÀ TIÊU HÓA Ở NGƯỜI. Dinh dưỡng và tiêu hóa ở người Dạng 1. Các hoạt động của tiêu hóa Tiêu hóa gồm biến đổi lí học, biến đổi hóa học, hấp thụ chất dinh dưỡng và thải bã. Đề bài tham khảo từ ngân hàng:\nCâu 1: Quá trình tiêu hóa được thực hiện bởi hoạt động của:\nA. Các tuyến tiêu hóa.\nB. Các cơ quan trong ống tiêu hóa\nC. Hoạt động của các enzyme.\nD. Các cơ quan trong ống tiêu hóa và các tuyến tiêu hóa. Theo đáp án của ngân hàng: chọn D. Các cơ quan trong ống tiêu hóa và các tuyến tiêu hóa. Tiêu hóa gồm biến đổi lí học, biến đổi hóa học, hấp thụ chất dinh dưỡng và thải bã. Không coi tiêu hóa chỉ là nghiền nhỏ thức ăn. Dạng 2. Vị trí hấp thụ chất dinh dưỡng Ruột non có diện tích hấp thụ lớn nhờ nếp gấp, lông ruột và vi nhung mao. Đề bài tham khảo từ ngân hàng:\nCâu 13: Trong ống tiêu hoá ở người, vai trò hấp thụ chất dinh dưỡng chủ yếu thuộc về cơ quan nào?\nA. Ruột thừa.\nB. Ruột già.\nC. Ruột non.\nD. Dạ dày. Theo đáp án của ngân hàng: chọn C. Ruột non. Ruột non có diện tích hấp thụ lớn nhờ nếp gấp, lông ruột và vi nhung mao. Không chọn dạ dày là nơi hấp thụ chủ yếu. Dạng 3. Xây dựng khẩu phần hợp lí Khẩu phần cần đủ năng lượng, cân đối chất dinh dưỡng, phù hợp tuổi, giới, mức hoạt động và tình trạng cơ thể. Đề bài tham khảo từ ngân hàng:\nCâu 7: Bữa ăn hợp lý dựa trên nhu cầu dinh dưỡng của cơ thể nhằm đáp ứng được yêu cầu?\nA. Cung cấp cho cơ thể đủ các chất dinh dưỡng theo nhu cầu, lứa tuổi, khả năng lao động, môi trường, khí hậu.\nB. Đảm bảo bữa ăn hàng ngày cân đối, đủ dinh dưỡng để phát triển tốt thể lực và trí lực, có sức khỏe để lao động\nC. Thức ăn phải đảm bảo an toàn vệ sinh, không được là nguồn lây bệnh\nD. Tất cả các đáp án trên Theo đáp án của ngân hàng: chọn D. Tất cả các đáp án trên Khẩu phần cần đủ năng lượng, cân đối chất dinh dưỡng, phù hợp tuổi, giới, mức hoạt động và tình trạng cơ thể. Không chỉ tính lượng thức ăn mà bỏ chất lượng và tỉ lệ dinh dưỡng."},{"number":33,"title":"MÁU VÀ HỆ TUẦN HOÀN CỦA CƠ THỂ NGƯỜI.","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-33","summary":"Máu và hệ tuần hoàn","intro":["Máu và hệ tuần hoàn"],"forms":[{"title":"Dạng 1. Thành phần và chức năng của máu","tip":"Máu gồm huyết tương và các tế bào máu; tế bào máu gồm hồng cầu, bạch cầu, tiểu cầu.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25: Các tế bào máu ở người được phân chia thành mấy loại chính ?\nA. 5 loại.\nB. 4 loại.\nC. 3 loại.\nD. 2 loại","solution":"Theo đáp án của ngân hàng: chọn C. 3 loại. Máu gồm huyết tương và các tế bào máu; tế bào máu gồm hồng cầu, bạch cầu, tiểu cầu.","trap":"Không xếp huyết tương vào nhóm tế bào máu.","extra":[]},{"title":"Dạng 2. Nguyên tắc nhóm máu ABO","tip":"Nhóm O không có kháng nguyên A, B trên hồng cầu; nhóm AB có cả hai.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 2: Nhóm máu nào dưới đây không tồn tại cả hai loại kháng nguyên A và B trên hồng cầu?\nA. Nhóm máu O.\nB. Nhóm máu A.\nC. Nhóm máu B.\nD. Nhóm máu AB.","solution":"Theo đáp án của ngân hàng: chọn A. Nhóm máu O. Nhóm O không có kháng nguyên A, B trên hồng cầu; nhóm AB có cả hai.","trap":"Truyền máu còn phải xét kháng thể và yếu tố Rh, không chỉ tên nhóm.","extra":[]},{"title":"Dạng 3. Đường đi của máu qua tim","tip":"Tâm thất phải co đẩy máu lên phổi; tâm thất trái co đẩy máu đi toàn cơ thể.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 16: Khi tâm thất phải co, máu được bơm đến bộ phận nào ?\nA. Tĩnh mạch phổi.\nB. Tĩnh mạch chủ.\nC. Động mạch chủ.\nD. Động mạch phổi.","solution":"Theo đáp án của ngân hàng: chọn D. Động mạch phổi. Tâm thất phải co đẩy máu lên phổi; tâm thất trái co đẩy máu đi toàn cơ thể.","trap":"Không nhầm động mạch phổi mang máu giàu oxygen.","extra":[]}],"searchText":"MÁU VÀ HỆ TUẦN HOÀN CỦA CƠ THỂ NGƯỜI. Máu và hệ tuần hoàn Dạng 1. Thành phần và chức năng của máu Máu gồm huyết tương và các tế bào máu; tế bào máu gồm hồng cầu, bạch cầu, tiểu cầu. Đề bài tham khảo từ ngân hàng:\nCâu 25: Các tế bào máu ở người được phân chia thành mấy loại chính ?\nA. 5 loại.\nB. 4 loại.\nC. 3 loại.\nD. 2 loại Theo đáp án của ngân hàng: chọn C. 3 loại. Máu gồm huyết tương và các tế bào máu; tế bào máu gồm hồng cầu, bạch cầu, tiểu cầu. Không xếp huyết tương vào nhóm tế bào máu. Dạng 2. Nguyên tắc nhóm máu ABO Nhóm O không có kháng nguyên A, B trên hồng cầu; nhóm AB có cả hai. Đề bài tham khảo từ ngân hàng:\nCâu 2: Nhóm máu nào dưới đây không tồn tại cả hai loại kháng nguyên A và B trên hồng cầu?\nA. Nhóm máu O.\nB. Nhóm máu A.\nC. Nhóm máu B.\nD. Nhóm máu AB. Theo đáp án của ngân hàng: chọn A. Nhóm máu O. Nhóm O không có kháng nguyên A, B trên hồng cầu; nhóm AB có cả hai. Truyền máu còn phải xét kháng thể và yếu tố Rh, không chỉ tên nhóm. Dạng 3. Đường đi của máu qua tim Tâm thất phải co đẩy máu lên phổi; tâm thất trái co đẩy máu đi toàn cơ thể. Đề bài tham khảo từ ngân hàng:\nCâu 16: Khi tâm thất phải co, máu được bơm đến bộ phận nào ?\nA. Tĩnh mạch phổi.\nB. Tĩnh mạch chủ.\nC. Động mạch chủ.\nD. Động mạch phổi. Theo đáp án của ngân hàng: chọn D. Động mạch phổi. Tâm thất phải co đẩy máu lên phổi; tâm thất trái co đẩy máu đi toàn cơ thể. Không nhầm động mạch phổi mang máu giàu oxygen."},{"number":34,"title":"HỆ HÔ HẤP Ở NGƯỜI.","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-34","summary":"Hệ hô hấp ở người","intro":["Hệ hô hấp ở người"],"forms":[{"title":"Dạng 1. Cơ chế hít vào – thở ra","tip":"Hít vào: cơ hoành và cơ liên sườn ngoài co, thể tích lồng ngực tăng, áp suất giảm.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 7: Khi chúng ta hít vào, cơ liên sườn ngoài và cơ hoành sẽ ở trạng thái nào ?\nA. Cơ liên sườn ngoài dãn còn cơ hoành co.\nB. Cơ liên sườn ngoài và cơ hoành đều dãn\nC. Cơ liên sườn ngoài và cơ hoành đều co\nD. Cơ liên sườn ngoài co còn cơ hoành dãn","solution":"Theo đáp án của ngân hàng: chọn C. Cơ liên sườn ngoài và cơ hoành đều co Hít vào: cơ hoành và cơ liên sườn ngoài co, thể tích lồng ngực tăng, áp suất giảm.","trap":"Không nói phổi tự co cơ vì phổi không có cơ làm nở chủ động.","extra":[]},{"title":"Dạng 2. Trao đổi khí theo khuếch tán","tip":"Khí khuếch tán từ nơi có nồng độ hoặc áp suất riêng phần cao sang thấp qua bề mặt mỏng, ẩm.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 12: Quá trình trao đổi khí ở người diễn ra theo cơ chế\nA. bổ sung.\nB. chủ động.\nC. thẩm thấu.\nD. khuếch tán.","solution":"Theo đáp án của ngân hàng: chọn D. khuếch tán. Khí khuếch tán từ nơi có nồng độ hoặc áp suất riêng phần cao sang thấp qua bề mặt mỏng, ẩm.","trap":"Không cần năng lượng ATP trực tiếp cho khuếch tán khí.","extra":[]},{"title":"Dạng 3. Bảo vệ hệ hô hấp","tip":"Không hút thuốc, tránh bụi khí độc, đeo khẩu trang, giữ vệ sinh và luyện tập phù hợp.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 9: Để bảo vệ phổi và tăng hiệu quả hô hấp, chúng ta cần lưu ý điều nào sau đây ?\nA. Đeo khẩu trang khi tiếp xúc với khói bụi hay môi trường có nhiều hoá chất độc hại\nB. Thường xuyên luyện tập thể dục thể thao, bao gồm cả luyện thở\nC. Nói không với thuốc lá\nD. Tất cả các phương án còn lại","solution":"Theo đáp án của ngân hàng: chọn D. Tất cả các phương án còn lại Không hút thuốc, tránh bụi khí độc, đeo khẩu trang, giữ vệ sinh và luyện tập phù hợp.","trap":"Khói thuốc thụ động cũng gây hại.","extra":[]}],"searchText":"HỆ HÔ HẤP Ở NGƯỜI. Hệ hô hấp ở người Dạng 1. Cơ chế hít vào – thở ra Hít vào: cơ hoành và cơ liên sườn ngoài co, thể tích lồng ngực tăng, áp suất giảm. Đề bài tham khảo từ ngân hàng:\nCâu 7: Khi chúng ta hít vào, cơ liên sườn ngoài và cơ hoành sẽ ở trạng thái nào ?\nA. Cơ liên sườn ngoài dãn còn cơ hoành co.\nB. Cơ liên sườn ngoài và cơ hoành đều dãn\nC. Cơ liên sườn ngoài và cơ hoành đều co\nD. Cơ liên sườn ngoài co còn cơ hoành dãn Theo đáp án của ngân hàng: chọn C. Cơ liên sườn ngoài và cơ hoành đều co Hít vào: cơ hoành và cơ liên sườn ngoài co, thể tích lồng ngực tăng, áp suất giảm. Không nói phổi tự co cơ vì phổi không có cơ làm nở chủ động. Dạng 2. Trao đổi khí theo khuếch tán Khí khuếch tán từ nơi có nồng độ hoặc áp suất riêng phần cao sang thấp qua bề mặt mỏng, ẩm. Đề bài tham khảo từ ngân hàng:\nCâu 12: Quá trình trao đổi khí ở người diễn ra theo cơ chế\nA. bổ sung.\nB. chủ động.\nC. thẩm thấu.\nD. khuếch tán. Theo đáp án của ngân hàng: chọn D. khuếch tán. Khí khuếch tán từ nơi có nồng độ hoặc áp suất riêng phần cao sang thấp qua bề mặt mỏng, ẩm. Không cần năng lượng ATP trực tiếp cho khuếch tán khí. Dạng 3. Bảo vệ hệ hô hấp Không hút thuốc, tránh bụi khí độc, đeo khẩu trang, giữ vệ sinh và luyện tập phù hợp. Đề bài tham khảo từ ngân hàng:\nCâu 9: Để bảo vệ phổi và tăng hiệu quả hô hấp, chúng ta cần lưu ý điều nào sau đây ?\nA. Đeo khẩu trang khi tiếp xúc với khói bụi hay môi trường có nhiều hoá chất độc hại\nB. Thường xuyên luyện tập thể dục thể thao, bao gồm cả luyện thở\nC. Nói không với thuốc lá\nD. Tất cả các phương án còn lại Theo đáp án của ngân hàng: chọn D. Tất cả các phương án còn lại Không hút thuốc, tránh bụi khí độc, đeo khẩu trang, giữ vệ sinh và luyện tập phù hợp. Khói thuốc thụ động cũng gây hại."},{"number":35,"title":"HỆ BÀI TIẾT Ở NGƯỜI.","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-35","summary":"Hệ bài tiết nước tiểu","intro":["Hệ bài tiết nước tiểu"],"forms":[{"title":"Dạng 1. Cấu tạo và đường đi của nước tiểu","tip":"Nước tiểu từ thận qua niệu quản xuống bóng đái rồi ra ngoài qua niệu đạo.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 5: Bộ phận nào có vai trò dẫn nước tiểu từ bể thận xuống bóng đái ?\nA. Ống dẫn nước tiểu.\nB. Ống thận\nC. Ống đái.\nD. Ống góp","solution":"Theo đáp án của ngân hàng: chọn A. Ống dẫn nước tiểu. Nước tiểu từ thận qua niệu quản xuống bóng đái rồi ra ngoài qua niệu đạo.","trap":"Không nhầm niệu quản với niệu đạo.","extra":[]},{"title":"Dạng 2. Các giai đoạn tạo nước tiểu","tip":"Lọc máu ở cầu thận chủ yếu do chênh lệch áp suất; tái hấp thu và bài tiết tiếp sử dụng vận chuyển chọn lọc.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 4: Trong quá trình tạo thành nước tiểu, giai đoạn nào dưới đây không cần đến ATP ?\nA. Bài tiết tiếp.\nB. Hấp thụ lại\nC. Lọc máu.\nD. Tất cả các phương án còn lại","solution":"Theo đáp án của ngân hàng: chọn C. Lọc máu. Lọc máu ở cầu thận chủ yếu do chênh lệch áp suất; tái hấp thu và bài tiết tiếp sử dụng vận chuyển chọn lọc.","trap":"Nước tiểu đầu chưa phải nước tiểu chính thức.","extra":[]},{"title":"Dạng 3. Bảo vệ hệ bài tiết","tip":"Uống đủ nước, không nhịn tiểu, vệ sinh, hạn chế quá nhiều muối và khám khi có dấu hiệu bất thường.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 12: Để bảo vệ hệ bài tiết nước tiểu, chúng ta cần lưu ý điều gì ?\nA. Đi tiểu đúng lúc.\nB. Tất cả các phương án còn lại\nC. Giữ gìn vệ sinh thân thể.\nD. Uống đủ nước","solution":"Theo đáp án của ngân hàng: chọn B. Tất cả các phương án còn lại Uống đủ nước, không nhịn tiểu, vệ sinh, hạn chế quá nhiều muối và khám khi có dấu hiệu bất thường.","trap":"Không tự dùng thuốc kéo dài vì một số thuốc có thể hại thận.","extra":[]}],"searchText":"HỆ BÀI TIẾT Ở NGƯỜI. Hệ bài tiết nước tiểu Dạng 1. Cấu tạo và đường đi của nước tiểu Nước tiểu từ thận qua niệu quản xuống bóng đái rồi ra ngoài qua niệu đạo. Đề bài tham khảo từ ngân hàng:\nCâu 5: Bộ phận nào có vai trò dẫn nước tiểu từ bể thận xuống bóng đái ?\nA. Ống dẫn nước tiểu.\nB. Ống thận\nC. Ống đái.\nD. Ống góp Theo đáp án của ngân hàng: chọn A. Ống dẫn nước tiểu. Nước tiểu từ thận qua niệu quản xuống bóng đái rồi ra ngoài qua niệu đạo. Không nhầm niệu quản với niệu đạo. Dạng 2. Các giai đoạn tạo nước tiểu Lọc máu ở cầu thận chủ yếu do chênh lệch áp suất; tái hấp thu và bài tiết tiếp sử dụng vận chuyển chọn lọc. Đề bài tham khảo từ ngân hàng:\nCâu 4: Trong quá trình tạo thành nước tiểu, giai đoạn nào dưới đây không cần đến ATP ?\nA. Bài tiết tiếp.\nB. Hấp thụ lại\nC. Lọc máu.\nD. Tất cả các phương án còn lại Theo đáp án của ngân hàng: chọn C. Lọc máu. Lọc máu ở cầu thận chủ yếu do chênh lệch áp suất; tái hấp thu và bài tiết tiếp sử dụng vận chuyển chọn lọc. Nước tiểu đầu chưa phải nước tiểu chính thức. Dạng 3. Bảo vệ hệ bài tiết Uống đủ nước, không nhịn tiểu, vệ sinh, hạn chế quá nhiều muối và khám khi có dấu hiệu bất thường. Đề bài tham khảo từ ngân hàng:\nCâu 12: Để bảo vệ hệ bài tiết nước tiểu, chúng ta cần lưu ý điều gì ?\nA. Đi tiểu đúng lúc.\nB. Tất cả các phương án còn lại\nC. Giữ gìn vệ sinh thân thể.\nD. Uống đủ nước Theo đáp án của ngân hàng: chọn B. Tất cả các phương án còn lại Uống đủ nước, không nhịn tiểu, vệ sinh, hạn chế quá nhiều muối và khám khi có dấu hiệu bất thường. Không tự dùng thuốc kéo dài vì một số thuốc có thể hại thận."},{"number":36,"title":"ĐIỀU HÒA MÔI TRƯỜNG TRONG CỦA CƠ THỂ NGƯỜI.","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-36","summary":"Điều hòa môi trường trong cơ thể","intro":["Điều hòa môi trường trong cơ thể"],"forms":[{"title":"Dạng 1. Thành phần môi trường trong","tip":"Môi trường trong gồm máu, nước mô và bạch huyết, giúp tế bào trao đổi chất.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 3: Môi trường trong cơ thể được tạo thành bởi thành phần nào?\nA. Máu.\nB. Nước mô.\nC. Bạch huyết.\nD. Tất cả các đáp án trên.","solution":"Theo đáp án của ngân hàng: chọn D. Tất cả các đáp án trên. Môi trường trong gồm máu, nước mô và bạch huyết, giúp tế bào trao đổi chất.","trap":"Không chỉ tính riêng máu.","extra":[]},{"title":"Dạng 2. Vai trò của huyết tương","tip":"Huyết tương vận chuyển chất dinh dưỡng, hormone, chất thải và duy trì môi trường cho tế bào máu.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 4: Chức năng của huyết tương là gì?\nA. Tham gia vận chuyển các chất dinh dưỡng, hoocmôn, kháng thể và các chất khoáng, các chất thải\nB. Môi trường chuyển hóa của các quá trình trao đổi chất\nC. Tiêu hủy các chất thải, thừa do tế bào đưa ra.\nD. Câu A và B đúng.","solution":"Theo đáp án của ngân hàng: chọn D. Câu A và B đúng. Huyết tương vận chuyển chất dinh dưỡng, hormone, chất thải và duy trì môi trường cho tế bào máu.","trap":"Không nhầm huyết tương với huyết thanh.","extra":[]},{"title":"Dạng 3. Vai trò của hồng cầu","tip":"Hồng cầu chứa hemoglobin, vận chuyển O2 và một phần CO2.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21: Vai trò của hồng cầu là:\nA. Vận chuyển chất dinh dưỡng đi nuôi cơ thể.\nB. Vận chuyển O2 và CO2.\nC. Vận chuyển các chất thải.\nD. Cả A, B, C đều đúng.","solution":"Theo đáp án của ngân hàng: chọn B. Vận chuyển O2 và CO2. Hồng cầu chứa hemoglobin, vận chuyển O2 và một phần CO2.","trap":"Không cho rằng hồng cầu trưởng thành ở người có nhân.","extra":[]}],"searchText":"ĐIỀU HÒA MÔI TRƯỜNG TRONG CỦA CƠ THỂ NGƯỜI. Điều hòa môi trường trong cơ thể Dạng 1. Thành phần môi trường trong Môi trường trong gồm máu, nước mô và bạch huyết, giúp tế bào trao đổi chất. Đề bài tham khảo từ ngân hàng:\nCâu 3: Môi trường trong cơ thể được tạo thành bởi thành phần nào?\nA. Máu.\nB. Nước mô.\nC. Bạch huyết.\nD. Tất cả các đáp án trên. Theo đáp án của ngân hàng: chọn D. Tất cả các đáp án trên. Môi trường trong gồm máu, nước mô và bạch huyết, giúp tế bào trao đổi chất. Không chỉ tính riêng máu. Dạng 2. Vai trò của huyết tương Huyết tương vận chuyển chất dinh dưỡng, hormone, chất thải và duy trì môi trường cho tế bào máu. Đề bài tham khảo từ ngân hàng:\nCâu 4: Chức năng của huyết tương là gì?\nA. Tham gia vận chuyển các chất dinh dưỡng, hoocmôn, kháng thể và các chất khoáng, các chất thải\nB. Môi trường chuyển hóa của các quá trình trao đổi chất\nC. Tiêu hủy các chất thải, thừa do tế bào đưa ra.\nD. Câu A và B đúng. Theo đáp án của ngân hàng: chọn D. Câu A và B đúng. Huyết tương vận chuyển chất dinh dưỡng, hormone, chất thải và duy trì môi trường cho tế bào máu. Không nhầm huyết tương với huyết thanh. Dạng 3. Vai trò của hồng cầu Hồng cầu chứa hemoglobin, vận chuyển O2 và một phần CO2. Đề bài tham khảo từ ngân hàng:\nCâu 21: Vai trò của hồng cầu là:\nA. Vận chuyển chất dinh dưỡng đi nuôi cơ thể.\nB. Vận chuyển O2 và CO2.\nC. Vận chuyển các chất thải.\nD. Cả A, B, C đều đúng. Theo đáp án của ngân hàng: chọn B. Vận chuyển O2 và CO2. Hồng cầu chứa hemoglobin, vận chuyển O2 và một phần CO2. Không cho rằng hồng cầu trưởng thành ở người có nhân."},{"number":37,"title":"HỆ THẦN KINH VÀ GIÁC QUAN Ở NGƯỜI.","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-37","summary":"Hệ thần kinh và giác quan","intro":["Hệ thần kinh và giác quan"],"forms":[{"title":"Dạng 1. Đơn vị cấu tạo hệ thần kinh","tip":"Neuron là đơn vị cấu tạo và chức năng của hệ thần kinh, có thân, sợi nhánh và sợi trục.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 7: Đơn vị cấu tạo nên hệ thần kinh là\nA. hạch thần kinh.\nB. dây thần kinh.\nC. cúc xináp.\nD. nơron.","solution":"Theo đáp án của ngân hàng: chọn D. nơron. Neuron là đơn vị cấu tạo và chức năng của hệ thần kinh, có thân, sợi nhánh và sợi trục.","trap":"Không nhầm neuron với dây thần kinh là bó nhiều sợi.","extra":[]},{"title":"Dạng 2. Cơ quan phân tích thị giác","tip":"Gồm tế bào thụ cảm ở mắt, dây thần kinh thị giác và vùng thị giác ở vỏ não.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 2: Cơ quan phân tích thị giác gồm có 3 thành phần chính, đó là\nA. các tế bào thụ cảm thị giác ở màng lưới, dây thần kinh thị giác và vùng thị giác ở thùy chẩm.\nB. các tế bào thụ cảm thị giác ở màng mạch, dây thần kinh thính giác và vùng thị giác ở thùy đỉnh.\nC. các tế bào thụ cảm thị giác ở màng cứng, dây thần kinh thị giác và vùng thị giác ở thùy trán.\nD. các tế bào thụ cảm thị giác ở màng lưới, dây thần kinh vị giác và vùng vị giác ở thùy chẩm.","solution":"Theo đáp án của ngân hàng: chọn A. các tế bào thụ cảm thị giác ở màng lưới, dây thần kinh thị giác và vùng thị giác ở thùy chẩm. Gồm tế bào thụ cảm ở mắt, dây thần kinh thị giác và vùng thị giác ở vỏ não.","trap":"Mắt chỉ là bộ phận tiếp nhận, cảm giác hoàn chỉnh cần não xử lí.","extra":[]},{"title":"Dạng 3. Vệ sinh thần kinh và giác quan","tip":"Ngủ đủ, tránh chất kích thích, học tập nghỉ ngơi hợp lí và bảo vệ mắt tai.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 9: Để bảo vệ hệ thần kinh, chúng ta cần lưu ý điều nào sau đây ?\nA. Tất cả các phương án còn lại\nB. Giữ cho tâm hồn được thanh thản, tránh suy nghĩ lo âu\nC. Xây dựng một chế độ làm việc và nghỉ ngơi hợp lí\nD. Đảm bảo giấc ngủ hằng ngày để phục hồi chức năng của hệ thần kinh sau thời gian làm việc căng thẳng","solution":"Theo đáp án của ngân hàng: chọn A. Tất cả các phương án còn lại Ngủ đủ, tránh chất kích thích, học tập nghỉ ngơi hợp lí và bảo vệ mắt tai.","trap":"Không nghe âm thanh lớn kéo dài hoặc dùng thiết bị sát mắt trong thời gian dài.","extra":[]}],"searchText":"HỆ THẦN KINH VÀ GIÁC QUAN Ở NGƯỜI. Hệ thần kinh và giác quan Dạng 1. Đơn vị cấu tạo hệ thần kinh Neuron là đơn vị cấu tạo và chức năng của hệ thần kinh, có thân, sợi nhánh và sợi trục. Đề bài tham khảo từ ngân hàng:\nCâu 7: Đơn vị cấu tạo nên hệ thần kinh là\nA. hạch thần kinh.\nB. dây thần kinh.\nC. cúc xináp.\nD. nơron. Theo đáp án của ngân hàng: chọn D. nơron. Neuron là đơn vị cấu tạo và chức năng của hệ thần kinh, có thân, sợi nhánh và sợi trục. Không nhầm neuron với dây thần kinh là bó nhiều sợi. Dạng 2. Cơ quan phân tích thị giác Gồm tế bào thụ cảm ở mắt, dây thần kinh thị giác và vùng thị giác ở vỏ não. Đề bài tham khảo từ ngân hàng:\nCâu 2: Cơ quan phân tích thị giác gồm có 3 thành phần chính, đó là\nA. các tế bào thụ cảm thị giác ở màng lưới, dây thần kinh thị giác và vùng thị giác ở thùy chẩm.\nB. các tế bào thụ cảm thị giác ở màng mạch, dây thần kinh thính giác và vùng thị giác ở thùy đỉnh.\nC. các tế bào thụ cảm thị giác ở màng cứng, dây thần kinh thị giác và vùng thị giác ở thùy trán.\nD. các tế bào thụ cảm thị giác ở màng lưới, dây thần kinh vị giác và vùng vị giác ở thùy chẩm. Theo đáp án của ngân hàng: chọn A. các tế bào thụ cảm thị giác ở màng lưới, dây thần kinh thị giác và vùng thị giác ở thùy chẩm. Gồm tế bào thụ cảm ở mắt, dây thần kinh thị giác và vùng thị giác ở vỏ não. Mắt chỉ là bộ phận tiếp nhận, cảm giác hoàn chỉnh cần não xử lí. Dạng 3. Vệ sinh thần kinh và giác quan Ngủ đủ, tránh chất kích thích, học tập nghỉ ngơi hợp lí và bảo vệ mắt tai. Đề bài tham khảo từ ngân hàng:\nCâu 9: Để bảo vệ hệ thần kinh, chúng ta cần lưu ý điều nào sau đây ?\nA. Tất cả các phương án còn lại\nB. Giữ cho tâm hồn được thanh thản, tránh suy nghĩ lo âu\nC. Xây dựng một chế độ làm việc và nghỉ ngơi hợp lí\nD. Đảm bảo giấc ngủ hằng ngày để phục hồi chức năng của hệ thần kinh sau thời gian làm việc căng thẳng Theo đáp án của ngân hàng: chọn A. Tất cả các phương án còn lại Ngủ đủ, tránh chất kích thích, học tập nghỉ ngơi hợp lí và bảo vệ mắt tai. Không nghe âm thanh lớn kéo dài hoặc dùng thiết bị sát mắt trong thời gian dài."},{"number":38,"title":"HỆ NỘI TIẾT Ở NGƯỜI.","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-38","summary":"Hệ nội tiết ở người","intro":["Hệ nội tiết ở người"],"forms":[{"title":"Dạng 1. Phân biệt tuyến nội tiết và ngoại tiết","tip":"Tuyến nội tiết không có ống dẫn, hormone đi vào máu; tuyến ngoại tiết có ống dẫn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 6: Dịch tiết của tuyến nào dưới đây không đi theo hệ thống dẫn ?\nA. Tuyến nước bọt.\nB. Tuyến sữa.\nC. Tuyến giáp.\nD. Tuyến mồ hôi.","solution":"Theo đáp án của ngân hàng: chọn C. Tuyến giáp. Tuyến nội tiết không có ống dẫn, hormone đi vào máu; tuyến ngoại tiết có ống dẫn.","trap":"Một số tuyến như tụy là tuyến pha, có cả hai chức năng.","extra":[]},{"title":"Dạng 2. Điều hòa đường huyết","tip":"Insulin làm giảm đường huyết; glucagon làm tăng đường huyết.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 2: Hoocmôn insulin do tuyến tuỵ tiết ra có tác dụng sinh lí như thế nào ?\nA. Chuyển glicôgen thành tinh bột dự trữ trong gan và cơ\nB. Chuyển glucôzơ thành tinh bột dự trữ trong gan và cơ\nC. Chuyển glicôgen thành glucôzơ dự trữ trong gan và cơ\nD. Chuyển glucôzơ thành glicôgen dự trữ trong gan và cơ","solution":"Theo đáp án của ngân hàng: chọn D. Chuyển glucôzơ thành glicôgen dự trữ trong gan và cơ Insulin làm giảm đường huyết; glucagon làm tăng đường huyết.","trap":"Không đảo vai trò hai hormone.","extra":[]},{"title":"Dạng 3. Tuyến yên và điều hòa tuyến khác","tip":"Tuyến yên tiết nhiều hormone điều khiển hoạt động của các tuyến nội tiết khác.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 3: Trong cơ thể người, tuyến nội tiết nào đóng vai trò chỉ đạo hoạt động của hầu hết các tuyến nội tiết khác ?\nA. Tuyến sinh dục.\nB. Tuyến yên.\nC. Tuyến giáp.\nD. Tuyến tuỵ.","solution":"Theo đáp án của ngân hàng: chọn B. Tuyến yên. Tuyến yên tiết nhiều hormone điều khiển hoạt động của các tuyến nội tiết khác.","trap":"Không nói tuyến yên thay thế hoàn toàn cơ chế thần kinh và phản hồi hormone.","extra":[]}],"searchText":"HỆ NỘI TIẾT Ở NGƯỜI. Hệ nội tiết ở người Dạng 1. Phân biệt tuyến nội tiết và ngoại tiết Tuyến nội tiết không có ống dẫn, hormone đi vào máu; tuyến ngoại tiết có ống dẫn. Đề bài tham khảo từ ngân hàng:\nCâu 6: Dịch tiết của tuyến nào dưới đây không đi theo hệ thống dẫn ?\nA. Tuyến nước bọt.\nB. Tuyến sữa.\nC. Tuyến giáp.\nD. Tuyến mồ hôi. Theo đáp án của ngân hàng: chọn C. Tuyến giáp. Tuyến nội tiết không có ống dẫn, hormone đi vào máu; tuyến ngoại tiết có ống dẫn. Một số tuyến như tụy là tuyến pha, có cả hai chức năng. Dạng 2. Điều hòa đường huyết Insulin làm giảm đường huyết; glucagon làm tăng đường huyết. Đề bài tham khảo từ ngân hàng:\nCâu 2: Hoocmôn insulin do tuyến tuỵ tiết ra có tác dụng sinh lí như thế nào ?\nA. Chuyển glicôgen thành tinh bột dự trữ trong gan và cơ\nB. Chuyển glucôzơ thành tinh bột dự trữ trong gan và cơ\nC. Chuyển glicôgen thành glucôzơ dự trữ trong gan và cơ\nD. Chuyển glucôzơ thành glicôgen dự trữ trong gan và cơ Theo đáp án của ngân hàng: chọn D. Chuyển glucôzơ thành glicôgen dự trữ trong gan và cơ Insulin làm giảm đường huyết; glucagon làm tăng đường huyết. Không đảo vai trò hai hormone. Dạng 3. Tuyến yên và điều hòa tuyến khác Tuyến yên tiết nhiều hormone điều khiển hoạt động của các tuyến nội tiết khác. Đề bài tham khảo từ ngân hàng:\nCâu 3: Trong cơ thể người, tuyến nội tiết nào đóng vai trò chỉ đạo hoạt động của hầu hết các tuyến nội tiết khác ?\nA. Tuyến sinh dục.\nB. Tuyến yên.\nC. Tuyến giáp.\nD. Tuyến tuỵ. Theo đáp án của ngân hàng: chọn B. Tuyến yên. Tuyến yên tiết nhiều hormone điều khiển hoạt động của các tuyến nội tiết khác. Không nói tuyến yên thay thế hoàn toàn cơ chế thần kinh và phản hồi hormone."},{"number":39,"title":"DA VÀ ĐIỀU HÒA THÂN NHIỆT Ở NGƯỜI.","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-39","summary":"Da và điều hòa thân nhiệt","intro":["Da và điều hòa thân nhiệt"],"forms":[{"title":"Dạng 1. Cấu tạo và chức năng da","tip":"Lớp mỡ dưới da giúp cách nhiệt, dự trữ năng lượng và đệm bảo vệ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 5: Lớp mỡ dưới da có vai trò chủ yếu là gì ?\nA. Dự trữ đường.\nB. Cách nhiệt.\nC. Thu nhận kích thích từ môi trường ngoài.\nD. Vận chuyển chất dinh dưỡng.","solution":"Theo đáp án của ngân hàng: chọn B. Cách nhiệt. Lớp mỡ dưới da giúp cách nhiệt, dự trữ năng lượng và đệm bảo vệ.","trap":"Không nhầm lớp mỡ với lớp biểu bì.","extra":[]},{"title":"Dạng 2. Cơ chế tỏa nhiệt khi nóng","tip":"Khi nóng hoặc lao động nặng: mạch máu dưới da giãn và tăng tiết mồ hôi.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 13: Khi lao động nặng, cơ thể sẽ toả nhiệt bằng cách nào? 1. Dãn mạch máu dưới da. 2. Run. 3. Vã mồ hôi. 4. Sởn gai ốc\nA. 1, 3\nB. 1, 2, 3\nC. 3, 4\nD. 1, 2, 4","solution":"Theo đáp án của ngân hàng: chọn A. 1, 3 Khi nóng hoặc lao động nặng: mạch máu dưới da giãn và tăng tiết mồ hôi.","trap":"Run và co mạch là phản ứng chống lạnh.","extra":[]},{"title":"Dạng 3. Sơ cứu bỏng nhẹ","tip":"Làm mát vùng bỏng dưới nước sạch mát, che phủ sạch và theo dõi.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 11: Khi bị bỏng nhẹ, chúng ta cần phải thực hiện ngay thao tác nào sau đây?\nA. Băng bó vết bỏng bằng bông và gạc sạch.\nB. Bôi kem liền sẹo lên phần da bị bỏng.\nC. Ngâm phần da bị bỏng vào nước lạnh và sạch.\nD. Rửa vết thương trên vòi nước với xà phòng diệt khuẩn.","solution":"Theo đáp án của ngân hàng: chọn C. Ngâm phần da bị bỏng vào nước lạnh và sạch. Làm mát vùng bỏng dưới nước sạch mát, che phủ sạch và theo dõi.","trap":"Không bôi kem đánh răng, dầu hoặc chọc vỡ bóng nước.","extra":[]}],"searchText":"DA VÀ ĐIỀU HÒA THÂN NHIỆT Ở NGƯỜI. Da và điều hòa thân nhiệt Dạng 1. Cấu tạo và chức năng da Lớp mỡ dưới da giúp cách nhiệt, dự trữ năng lượng và đệm bảo vệ. Đề bài tham khảo từ ngân hàng:\nCâu 5: Lớp mỡ dưới da có vai trò chủ yếu là gì ?\nA. Dự trữ đường.\nB. Cách nhiệt.\nC. Thu nhận kích thích từ môi trường ngoài.\nD. Vận chuyển chất dinh dưỡng. Theo đáp án của ngân hàng: chọn B. Cách nhiệt. Lớp mỡ dưới da giúp cách nhiệt, dự trữ năng lượng và đệm bảo vệ. Không nhầm lớp mỡ với lớp biểu bì. Dạng 2. Cơ chế tỏa nhiệt khi nóng Khi nóng hoặc lao động nặng: mạch máu dưới da giãn và tăng tiết mồ hôi. Đề bài tham khảo từ ngân hàng:\nCâu 13: Khi lao động nặng, cơ thể sẽ toả nhiệt bằng cách nào? 1. Dãn mạch máu dưới da. 2. Run. 3. Vã mồ hôi. 4. Sởn gai ốc\nA. 1, 3\nB. 1, 2, 3\nC. 3, 4\nD. 1, 2, 4 Theo đáp án của ngân hàng: chọn A. 1, 3 Khi nóng hoặc lao động nặng: mạch máu dưới da giãn và tăng tiết mồ hôi. Run và co mạch là phản ứng chống lạnh. Dạng 3. Sơ cứu bỏng nhẹ Làm mát vùng bỏng dưới nước sạch mát, che phủ sạch và theo dõi. Đề bài tham khảo từ ngân hàng:\nCâu 11: Khi bị bỏng nhẹ, chúng ta cần phải thực hiện ngay thao tác nào sau đây?\nA. Băng bó vết bỏng bằng bông và gạc sạch.\nB. Bôi kem liền sẹo lên phần da bị bỏng.\nC. Ngâm phần da bị bỏng vào nước lạnh và sạch.\nD. Rửa vết thương trên vòi nước với xà phòng diệt khuẩn. Theo đáp án của ngân hàng: chọn C. Ngâm phần da bị bỏng vào nước lạnh và sạch. Làm mát vùng bỏng dưới nước sạch mát, che phủ sạch và theo dõi. Không bôi kem đánh răng, dầu hoặc chọc vỡ bóng nước."},{"number":40,"title":"SINH SẢN Ở NGƯỜI.","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-40","summary":"Sinh sản ở người","intro":["Sinh sản ở người"],"forms":[{"title":"Dạng 1. Nơi tạo giao tử và thụ tinh","tip":"Trứng tạo ở buồng trứng, tinh trùng tạo ở tinh hoàn; thụ tinh thường xảy ra ở ống dẫn trứng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 2: Trong cơ quan sinh dục nữ, sự thụ tinh thường diễn ra ở đâu ?\nA. Âm đạo.\nB. Ống dẫn trứng.\nC. Buồng trứng.\nD. Tử cung.","solution":"Theo đáp án của ngân hàng: chọn B. Ống dẫn trứng. Trứng tạo ở buồng trứng, tinh trùng tạo ở tinh hoàn; thụ tinh thường xảy ra ở ống dẫn trứng.","trap":"Không nhầm tử cung là nơi thụ tinh thông thường.","extra":[]},{"title":"Dạng 2. Làm tổ và phát triển thai","tip":"Hợp tử phân chia và làm tổ trong niêm mạc tử cung; thai trao đổi chất qua nhau thai.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 19: Ở nữ giới, trứng sau khi thụ tinh thường làm tổ ở đâu ?\nA. Buồng trứng.\nB. Âm đạo.\nC. Ống dẫn trứng.\nD. Tử cung.","solution":"Theo đáp án của ngân hàng: chọn D. Tử cung. Hợp tử phân chia và làm tổ trong niêm mạc tử cung; thai trao đổi chất qua nhau thai.","trap":"Không nói thai lấy chất trực tiếp từ máu mẹ mà không qua nhau thai.","extra":[]},{"title":"Dạng 3. Phòng bệnh lây truyền qua đường tình dục","tip":"HIV có thể lây qua máu, quan hệ tình dục không an toàn và từ mẹ sang con; không lây qua tiếp xúc thông thường.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 25: HIV có thể lây truyền qua con đường nào dưới đây ?\nA. Đường máu.\nB. Từ mẹ sang con\nC. Tất cả các phương án còn lại.\nD. Qua quan hệ tình dục không an toàn","solution":"Theo đáp án của ngân hàng: chọn C. Tất cả các phương án còn lại. HIV có thể lây qua máu, quan hệ tình dục không an toàn và từ mẹ sang con; không lây qua tiếp xúc thông thường.","trap":"Không kì thị người nhiễm HIV.","extra":[]}],"searchText":"SINH SẢN Ở NGƯỜI. Sinh sản ở người Dạng 1. Nơi tạo giao tử và thụ tinh Trứng tạo ở buồng trứng, tinh trùng tạo ở tinh hoàn; thụ tinh thường xảy ra ở ống dẫn trứng. Đề bài tham khảo từ ngân hàng:\nCâu 2: Trong cơ quan sinh dục nữ, sự thụ tinh thường diễn ra ở đâu ?\nA. Âm đạo.\nB. Ống dẫn trứng.\nC. Buồng trứng.\nD. Tử cung. Theo đáp án của ngân hàng: chọn B. Ống dẫn trứng. Trứng tạo ở buồng trứng, tinh trùng tạo ở tinh hoàn; thụ tinh thường xảy ra ở ống dẫn trứng. Không nhầm tử cung là nơi thụ tinh thông thường. Dạng 2. Làm tổ và phát triển thai Hợp tử phân chia và làm tổ trong niêm mạc tử cung; thai trao đổi chất qua nhau thai. Đề bài tham khảo từ ngân hàng:\nCâu 19: Ở nữ giới, trứng sau khi thụ tinh thường làm tổ ở đâu ?\nA. Buồng trứng.\nB. Âm đạo.\nC. Ống dẫn trứng.\nD. Tử cung. Theo đáp án của ngân hàng: chọn D. Tử cung. Hợp tử phân chia và làm tổ trong niêm mạc tử cung; thai trao đổi chất qua nhau thai. Không nói thai lấy chất trực tiếp từ máu mẹ mà không qua nhau thai. Dạng 3. Phòng bệnh lây truyền qua đường tình dục HIV có thể lây qua máu, quan hệ tình dục không an toàn và từ mẹ sang con; không lây qua tiếp xúc thông thường. Đề bài tham khảo từ ngân hàng:\nCâu 25: HIV có thể lây truyền qua con đường nào dưới đây ?\nA. Đường máu.\nB. Từ mẹ sang con\nC. Tất cả các phương án còn lại.\nD. Qua quan hệ tình dục không an toàn Theo đáp án của ngân hàng: chọn C. Tất cả các phương án còn lại. HIV có thể lây qua máu, quan hệ tình dục không an toàn và từ mẹ sang con; không lây qua tiếp xúc thông thường. Không kì thị người nhiễm HIV."},{"number":41,"title":"MÔI TRƯỜNG SỐNG VÀ CÁC NHÂN TỐ SINH THÁI.","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-41","summary":"Môi trường sống và nhân tố sinh thái","intro":["Môi trường sống và nhân tố sinh thái"],"forms":[{"title":"Dạng 1. Phân loại nhân tố sinh thái","tip":"Vô sinh: ánh sáng, nhiệt độ, nước, đất; hữu sinh: sinh vật; con người là nhân tố hữu sinh đặc biệt.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1: Yếu tố nào dưới đây là nhân tố hữu sinh?\nA. Ánh sáng, nhiệt độ, độ ẩm.\nB. Chế độ khí hậu, nước, ánh sáng.\nC. Con người và các sinh vật khác.\nD. Các sinh vật khác và ánh sáng.","solution":"Theo đáp án của ngân hàng: chọn C. Con người và các sinh vật khác. Vô sinh: ánh sáng, nhiệt độ, nước, đất; hữu sinh: sinh vật; con người là nhân tố hữu sinh đặc biệt.","trap":"Không xếp mọi yếu tố do con người tạo ra thành vô sinh.","extra":[]},{"title":"Dạng 2. Giới hạn sinh thái","tip":"Giới hạn sinh thái là khoảng giá trị của một nhân tố mà sinh vật có thể tồn tại; có khoảng thuận lợi và điểm cực thuận.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 9: Giới hạn chịu đựng của cơ thể sinh vật đối với một nhân tố sinh thái nhất định được gọi là gì?\nA. Giới hạn sinh thái.\nB. Tác động sinh thái\nC. Khả năng cơ thể.\nD. Sức bền của cơ thể.","solution":"Theo đáp án của ngân hàng: chọn A. Giới hạn sinh thái. Giới hạn sinh thái là khoảng giá trị của một nhân tố mà sinh vật có thể tồn tại; có khoảng thuận lợi và điểm cực thuận.","trap":"Ra ngoài giới hạn dưới hoặc trên đều có thể gây chết.","extra":[]},{"title":"Dạng 3. So sánh khả năng phân bố","tip":"Loài có giới hạn sinh thái rộng với nhiều nhân tố thường có vùng phân bố rộng hơn.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 14: Những loài có giới hạn sinh thái rộng đối với nhiều nhân tố sinh thái, thì chúng có vùng phân bố như thế nào?\nA. Có vùng phân bố rộng.\nB. Có vùng phân bố hạn chế.\nC. Có vùng phân bố hẹp.\nD. Không xác định được vùng phân bố.","solution":"Theo đáp án của ngân hàng: chọn A. Có vùng phân bố rộng. Loài có giới hạn sinh thái rộng với nhiều nhân tố thường có vùng phân bố rộng hơn.","trap":"Không chỉ xét một nhân tố duy nhất khi dự đoán phân bố thực tế.","extra":[]}],"searchText":"MÔI TRƯỜNG SỐNG VÀ CÁC NHÂN TỐ SINH THÁI. Môi trường sống và nhân tố sinh thái Dạng 1. Phân loại nhân tố sinh thái Vô sinh: ánh sáng, nhiệt độ, nước, đất; hữu sinh: sinh vật; con người là nhân tố hữu sinh đặc biệt. Đề bài tham khảo từ ngân hàng:\nCâu 1: Yếu tố nào dưới đây là nhân tố hữu sinh?\nA. Ánh sáng, nhiệt độ, độ ẩm.\nB. Chế độ khí hậu, nước, ánh sáng.\nC. Con người và các sinh vật khác.\nD. Các sinh vật khác và ánh sáng. Theo đáp án của ngân hàng: chọn C. Con người và các sinh vật khác. Vô sinh: ánh sáng, nhiệt độ, nước, đất; hữu sinh: sinh vật; con người là nhân tố hữu sinh đặc biệt. Không xếp mọi yếu tố do con người tạo ra thành vô sinh. Dạng 2. Giới hạn sinh thái Giới hạn sinh thái là khoảng giá trị của một nhân tố mà sinh vật có thể tồn tại; có khoảng thuận lợi và điểm cực thuận. Đề bài tham khảo từ ngân hàng:\nCâu 9: Giới hạn chịu đựng của cơ thể sinh vật đối với một nhân tố sinh thái nhất định được gọi là gì?\nA. Giới hạn sinh thái.\nB. Tác động sinh thái\nC. Khả năng cơ thể.\nD. Sức bền của cơ thể. Theo đáp án của ngân hàng: chọn A. Giới hạn sinh thái. Giới hạn sinh thái là khoảng giá trị của một nhân tố mà sinh vật có thể tồn tại; có khoảng thuận lợi và điểm cực thuận. Ra ngoài giới hạn dưới hoặc trên đều có thể gây chết. Dạng 3. So sánh khả năng phân bố Loài có giới hạn sinh thái rộng với nhiều nhân tố thường có vùng phân bố rộng hơn. Đề bài tham khảo từ ngân hàng:\nCâu 14: Những loài có giới hạn sinh thái rộng đối với nhiều nhân tố sinh thái, thì chúng có vùng phân bố như thế nào?\nA. Có vùng phân bố rộng.\nB. Có vùng phân bố hạn chế.\nC. Có vùng phân bố hẹp.\nD. Không xác định được vùng phân bố. Theo đáp án của ngân hàng: chọn A. Có vùng phân bố rộng. Loài có giới hạn sinh thái rộng với nhiều nhân tố thường có vùng phân bố rộng hơn. Không chỉ xét một nhân tố duy nhất khi dự đoán phân bố thực tế."},{"number":42,"title":"QUẦN THỂ SINH VẬT.","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-42","summary":"Quần thể sinh vật","intro":["Quần thể sinh vật"],"forms":[{"title":"Dạng 1. Nhận biết quần thể","tip":"Quần thể là các cá thể cùng loài, sống trong khu vực và thời điểm xác định, có khả năng sinh sản tạo thế hệ mới.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 3: Quần thể là\nA. tập hợp những cá thể cùng loài, giống nhau về hình thái, cấu tạo; có thể giao phối tự do với nhau.\nB. tập hợp những cá thể khác loài nhưng có cùng khu phân bố.\nC. tập hợp những cá thể cùng loài, có mật độ, thành phần kiểu gen đặc trưng.\nD. tập hợp những cá thể cùng loài, sống trong một ổ sinh thái, tại một thời điểm nhất định.","solution":"Theo đáp án của ngân hàng: chọn D. tập hợp những cá thể cùng loài, sống trong một ổ sinh thái, tại một thời điểm nhất định. Quần thể là các cá thể cùng loài, sống trong khu vực và thời điểm xác định, có khả năng sinh sản tạo thế hệ mới.","trap":"Tập hợp nhiều loài không phải quần thể.","extra":[]},{"title":"Dạng 2. Mật độ quần thể","tip":"Mật độ = số cá thể trên một đơn vị diện tích hoặc thể tích; thay đổi theo sinh, tử, nhập cư, xuất cư.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 9: Mật độ của quần thể được xác định bằng số lượng cá thể sinh vật có ở\nA. một khu vực nhất định.\nB. một khoảng không gian rộng lớn.\nC. một đơn vị diện tích.\nD. một đơn vị diện tích hay thể tích.","solution":"Theo đáp án của ngân hàng: chọn D. một đơn vị diện tích hay thể tích. Mật độ = số cá thể trên một đơn vị diện tích hoặc thể tích; thay đổi theo sinh, tử, nhập cư, xuất cư.","trap":"Không đồng nhất mật độ với tổng số cá thể.","extra":[]},{"title":"Dạng 3. Cấu trúc nhóm tuổi","tip":"Nhóm tuổi sinh sản quyết định trực tiếp khả năng sinh sản hiện tại; nhóm trước sinh sản thể hiện tiềm năng tương lai.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 5: Nhóm tuổi sinh sản có ý nghĩa\nA. làm tăng trưởng khối lượng và kích thước của quần thể.\nB. quyết định mức sinh sản của quần thể.\nC. không ảnh hưởng đến sự phát triển của quần thể.\nD. làm cho kích thước quần thể giảm sút.","solution":"Theo đáp án của ngân hàng: chọn B. quyết định mức sinh sản của quần thể. Nhóm tuổi sinh sản quyết định trực tiếp khả năng sinh sản hiện tại; nhóm trước sinh sản thể hiện tiềm năng tương lai.","trap":"Không đánh giá xu thế quần thể chỉ từ một nhóm tuổi.","extra":[]}],"searchText":"QUẦN THỂ SINH VẬT. Quần thể sinh vật Dạng 1. Nhận biết quần thể Quần thể là các cá thể cùng loài, sống trong khu vực và thời điểm xác định, có khả năng sinh sản tạo thế hệ mới. Đề bài tham khảo từ ngân hàng:\nCâu 3: Quần thể là\nA. tập hợp những cá thể cùng loài, giống nhau về hình thái, cấu tạo; có thể giao phối tự do với nhau.\nB. tập hợp những cá thể khác loài nhưng có cùng khu phân bố.\nC. tập hợp những cá thể cùng loài, có mật độ, thành phần kiểu gen đặc trưng.\nD. tập hợp những cá thể cùng loài, sống trong một ổ sinh thái, tại một thời điểm nhất định. Theo đáp án của ngân hàng: chọn D. tập hợp những cá thể cùng loài, sống trong một ổ sinh thái, tại một thời điểm nhất định. Quần thể là các cá thể cùng loài, sống trong khu vực và thời điểm xác định, có khả năng sinh sản tạo thế hệ mới. Tập hợp nhiều loài không phải quần thể. Dạng 2. Mật độ quần thể Mật độ = số cá thể trên một đơn vị diện tích hoặc thể tích; thay đổi theo sinh, tử, nhập cư, xuất cư. Đề bài tham khảo từ ngân hàng:\nCâu 9: Mật độ của quần thể được xác định bằng số lượng cá thể sinh vật có ở\nA. một khu vực nhất định.\nB. một khoảng không gian rộng lớn.\nC. một đơn vị diện tích.\nD. một đơn vị diện tích hay thể tích. Theo đáp án của ngân hàng: chọn D. một đơn vị diện tích hay thể tích. Mật độ = số cá thể trên một đơn vị diện tích hoặc thể tích; thay đổi theo sinh, tử, nhập cư, xuất cư. Không đồng nhất mật độ với tổng số cá thể. Dạng 3. Cấu trúc nhóm tuổi Nhóm tuổi sinh sản quyết định trực tiếp khả năng sinh sản hiện tại; nhóm trước sinh sản thể hiện tiềm năng tương lai. Đề bài tham khảo từ ngân hàng:\nCâu 5: Nhóm tuổi sinh sản có ý nghĩa\nA. làm tăng trưởng khối lượng và kích thước của quần thể.\nB. quyết định mức sinh sản của quần thể.\nC. không ảnh hưởng đến sự phát triển của quần thể.\nD. làm cho kích thước quần thể giảm sút. Theo đáp án của ngân hàng: chọn B. quyết định mức sinh sản của quần thể. Nhóm tuổi sinh sản quyết định trực tiếp khả năng sinh sản hiện tại; nhóm trước sinh sản thể hiện tiềm năng tương lai. Không đánh giá xu thế quần thể chỉ từ một nhóm tuổi."},{"number":43,"title":"QUẦN XÃ SINH VẬT.","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-43","summary":"Quần xã sinh vật","intro":["Quần xã sinh vật"],"forms":[{"title":"Dạng 1. Nhận biết quần xã","tip":"Quần xã gồm nhiều quần thể khác loài cùng sống trong một khu vực, có quan hệ với nhau và môi trường.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 2: Quần xã sinh vật là\nA. tập hợp các sinh vật cùng loài.\nB. tập hợp các cá thể sinh vật khác loài.\nC. tập hợp các quần thể sinh vật khác loài.\nD. tập hợp toàn bộ các sinh vật trong tự nhiên.","solution":"Theo đáp án của ngân hàng: chọn C. tập hợp các quần thể sinh vật khác loài. Quần xã gồm nhiều quần thể khác loài cùng sống trong một khu vực, có quan hệ với nhau và môi trường.","trap":"Một đàn cá cùng loài là quần thể, không phải quần xã.","extra":[]},{"title":"Dạng 2. Loài ưu thế và loài đặc trưng","tip":"Loài ưu thế có số lượng hoặc sinh khối lớn, ảnh hưởng mạnh; loài đặc trưng chỉ có hoặc nổi bật ở quần xã đó.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 17: Trong quần xã rừng U Minh, cây tràm được coi là loài\nA. ưu thế.\nB. đặc trưng.\nC. tiên phong.\nD. ổn định.","solution":"Theo đáp án của ngân hàng: chọn B. đặc trưng. Loài ưu thế có số lượng hoặc sinh khối lớn, ảnh hưởng mạnh; loài đặc trưng chỉ có hoặc nổi bật ở quần xã đó.","trap":"Một loài có thể ưu thế nhưng không nhất thiết đặc trưng.","extra":[]},{"title":"Dạng 3. Khống chế sinh học","tip":"Quan hệ sinh vật làm số lượng quần thể được duy trì quanh mức phù hợp với môi trường.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1: Khi sâu bọ phát triển mạnh, số lượng chim sâu cũng tăng theo. Khi số lượng chim sâu tăng quá nhiều, sâu bọ bị quần thể chim sâu tiêu diệt mạnh mẽ hơn nên số lượng sâu bọ lại giảm mạnh đi. Sự hạn chế số lượng sâu là hiện tượng\nA. cơ chế điều hòa mật độ.\nB. sự cân bằng sinh học.\nC. trạng thái cân bằng.\nD. khống chế sinh học.","solution":"Theo đáp án của ngân hàng: chọn D. khống chế sinh học. Quan hệ sinh vật làm số lượng quần thể được duy trì quanh mức phù hợp với môi trường.","trap":"Khống chế sinh học không làm số lượng loài cố định tuyệt đối.","extra":[]}],"searchText":"QUẦN XÃ SINH VẬT. Quần xã sinh vật Dạng 1. Nhận biết quần xã Quần xã gồm nhiều quần thể khác loài cùng sống trong một khu vực, có quan hệ với nhau và môi trường. Đề bài tham khảo từ ngân hàng:\nCâu 2: Quần xã sinh vật là\nA. tập hợp các sinh vật cùng loài.\nB. tập hợp các cá thể sinh vật khác loài.\nC. tập hợp các quần thể sinh vật khác loài.\nD. tập hợp toàn bộ các sinh vật trong tự nhiên. Theo đáp án của ngân hàng: chọn C. tập hợp các quần thể sinh vật khác loài. Quần xã gồm nhiều quần thể khác loài cùng sống trong một khu vực, có quan hệ với nhau và môi trường. Một đàn cá cùng loài là quần thể, không phải quần xã. Dạng 2. Loài ưu thế và loài đặc trưng Loài ưu thế có số lượng hoặc sinh khối lớn, ảnh hưởng mạnh; loài đặc trưng chỉ có hoặc nổi bật ở quần xã đó. Đề bài tham khảo từ ngân hàng:\nCâu 17: Trong quần xã rừng U Minh, cây tràm được coi là loài\nA. ưu thế.\nB. đặc trưng.\nC. tiên phong.\nD. ổn định. Theo đáp án của ngân hàng: chọn B. đặc trưng. Loài ưu thế có số lượng hoặc sinh khối lớn, ảnh hưởng mạnh; loài đặc trưng chỉ có hoặc nổi bật ở quần xã đó. Một loài có thể ưu thế nhưng không nhất thiết đặc trưng. Dạng 3. Khống chế sinh học Quan hệ sinh vật làm số lượng quần thể được duy trì quanh mức phù hợp với môi trường. Đề bài tham khảo từ ngân hàng:\nCâu 1: Khi sâu bọ phát triển mạnh, số lượng chim sâu cũng tăng theo. Khi số lượng chim sâu tăng quá nhiều, sâu bọ bị quần thể chim sâu tiêu diệt mạnh mẽ hơn nên số lượng sâu bọ lại giảm mạnh đi. Sự hạn chế số lượng sâu là hiện tượng\nA. cơ chế điều hòa mật độ.\nB. sự cân bằng sinh học.\nC. trạng thái cân bằng.\nD. khống chế sinh học. Theo đáp án của ngân hàng: chọn D. khống chế sinh học. Quan hệ sinh vật làm số lượng quần thể được duy trì quanh mức phù hợp với môi trường. Khống chế sinh học không làm số lượng loài cố định tuyệt đối."},{"number":44,"title":"HỆ SINH THÁI.","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-44","summary":"Hệ sinh thái, chuỗi và lưới thức ăn","intro":["Hệ sinh thái, chuỗi và lưới thức ăn"],"forms":[{"title":"Dạng 1. Thành phần hệ sinh thái","tip":"Hệ sinh thái gồm quần xã sinh vật và môi trường vô sinh tương tác.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 13: Hệ sinh thái bao gồm các thành phần là\nA. thành phần vô sinh và hữu sinh.\nB. sinh vật sản xuất, sinh vật tiêu thụ.\nC. thành phần vô cơ và hữu cơ.\nD. sinh vật sản xuất, sinh vật phân giải.","solution":"Theo đáp án của ngân hàng: chọn A. thành phần vô sinh và hữu sinh. Hệ sinh thái gồm quần xã sinh vật và môi trường vô sinh tương tác.","trap":"Không chỉ liệt kê sinh vật mà bỏ thành phần vô sinh.","extra":[]},{"title":"Dạng 2. Chuỗi thức ăn","tip":"Chuỗi thức ăn thường bắt đầu bằng sinh vật sản xuất, tiếp đến sinh vật tiêu thụ và phân giải.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 12: Trong chuỗi thức ăn: Cỏ → Hươu → Hổ, thì cỏ là\nA. sinh vật sản xuất.\nB. sinh vật ăn cỏ.\nC. sinh vật tiêu thụ.\nD. sinh vật phân giải.","solution":"Theo đáp án của ngân hàng: chọn A. sinh vật sản xuất. Chuỗi thức ăn thường bắt đầu bằng sinh vật sản xuất, tiếp đến sinh vật tiêu thụ và phân giải.","trap":"Mũi tên biểu thị chiều truyền vật chất và năng lượng từ thức ăn đến sinh vật ăn.","extra":[]},{"title":"Dạng 3. Lưới thức ăn","tip":"Lưới thức ăn là nhiều chuỗi thức ăn có mắt xích chung liên kết với nhau.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 8: Lưới thức ăn gồm\nA. một chuỗi thức ăn.\nB. nhiều loài sinh vật có quan hệ dinh dưỡng với nhau.\nC. các chuỗi thức ăn có nhiều mắt xích chung.\nD. ít nhất là 1 chuỗi thức ăn trở lên.","solution":"Theo đáp án của ngân hàng: chọn C. các chuỗi thức ăn có nhiều mắt xích chung. Lưới thức ăn là nhiều chuỗi thức ăn có mắt xích chung liên kết với nhau.","trap":"Không coi lưới thức ăn là một chuỗi dài duy nhất.","extra":[]}],"searchText":"HỆ SINH THÁI. Hệ sinh thái, chuỗi và lưới thức ăn Dạng 1. Thành phần hệ sinh thái Hệ sinh thái gồm quần xã sinh vật và môi trường vô sinh tương tác. Đề bài tham khảo từ ngân hàng:\nCâu 13: Hệ sinh thái bao gồm các thành phần là\nA. thành phần vô sinh và hữu sinh.\nB. sinh vật sản xuất, sinh vật tiêu thụ.\nC. thành phần vô cơ và hữu cơ.\nD. sinh vật sản xuất, sinh vật phân giải. Theo đáp án của ngân hàng: chọn A. thành phần vô sinh và hữu sinh. Hệ sinh thái gồm quần xã sinh vật và môi trường vô sinh tương tác. Không chỉ liệt kê sinh vật mà bỏ thành phần vô sinh. Dạng 2. Chuỗi thức ăn Chuỗi thức ăn thường bắt đầu bằng sinh vật sản xuất, tiếp đến sinh vật tiêu thụ và phân giải. Đề bài tham khảo từ ngân hàng:\nCâu 12: Trong chuỗi thức ăn: Cỏ → Hươu → Hổ, thì cỏ là\nA. sinh vật sản xuất.\nB. sinh vật ăn cỏ.\nC. sinh vật tiêu thụ.\nD. sinh vật phân giải. Theo đáp án của ngân hàng: chọn A. sinh vật sản xuất. Chuỗi thức ăn thường bắt đầu bằng sinh vật sản xuất, tiếp đến sinh vật tiêu thụ và phân giải. Mũi tên biểu thị chiều truyền vật chất và năng lượng từ thức ăn đến sinh vật ăn. Dạng 3. Lưới thức ăn Lưới thức ăn là nhiều chuỗi thức ăn có mắt xích chung liên kết với nhau. Đề bài tham khảo từ ngân hàng:\nCâu 8: Lưới thức ăn gồm\nA. một chuỗi thức ăn.\nB. nhiều loài sinh vật có quan hệ dinh dưỡng với nhau.\nC. các chuỗi thức ăn có nhiều mắt xích chung.\nD. ít nhất là 1 chuỗi thức ăn trở lên. Theo đáp án của ngân hàng: chọn C. các chuỗi thức ăn có nhiều mắt xích chung. Lưới thức ăn là nhiều chuỗi thức ăn có mắt xích chung liên kết với nhau. Không coi lưới thức ăn là một chuỗi dài duy nhất."},{"number":45,"title":"SINH QUYỂN.","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-45","summary":"Sinh quyển và sự phân bố sinh vật","intro":["Sinh quyển và sự phân bố sinh vật"],"forms":[{"title":"Dạng 1. Khái niệm và giới hạn sinh quyển","tip":"Sinh quyển gồm phần thấp khí quyển, toàn thủy quyển và phần trên thạch quyển có sự sống.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 7: Giới hạn của sinh quyển bao gồm\nA. phần thấp của khí quyển, toàn bộ thuỷ quyển và phần trên của thạch quyển.\nB. phần thấp tầng đối lưu, toàn bộ thuỷ quyển và thổ nhưỡng quyển.\nC. phần trên tầng đối lưu, phần dưới của tầng bình lưu và toàn bộ thuỷ quyển.\nD. phần thấp tầng đối lưu, phần trên tầng bình lưu, đại dương và đất liền.","solution":"Theo đáp án của ngân hàng: chọn A. phần thấp của khí quyển, toàn bộ thuỷ quyển và phần trên của thạch quyển. Sinh quyển gồm phần thấp khí quyển, toàn thủy quyển và phần trên thạch quyển có sự sống.","trap":"Không coi sinh quyển là một lớp riêng tách biệt hoàn toàn khỏi các quyển khác.","extra":[]},{"title":"Dạng 2. Ảnh hưởng của khí hậu","tip":"Nhiệt độ và lượng mưa là các nhân tố lớn chi phối sự phân bố thảm thực vật.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 21: Nhân tố nào sau đây có ảnh hưởng lớn nhất đến sự phân bố các thảm thực vật trên Trái Đất?\nA. Sinh vật.\nB. Địa hình.\nC. Khí hậu.\nD. Thổ nhưỡng.","solution":"Theo đáp án của ngân hàng: chọn C. Khí hậu. Nhiệt độ và lượng mưa là các nhân tố lớn chi phối sự phân bố thảm thực vật.","trap":"Địa hình, đất và sinh vật cũng tác động, không chỉ khí hậu.","extra":[]},{"title":"Dạng 3. Nhận biết thảm thực vật theo đới","tip":"Đới lạnh có đài nguyên; đới nóng có rừng mưa nhiệt đới, savan; đới ôn hòa có rừng lá rộng, thảo nguyên.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 23: Kiểu thảm thực vật nào sau đây thuộc vào môi trường đới lạnh?\nA. Thảo nguyên.\nB. Đài nguyên.\nC. Rừng lá rộng.\nD. Rừng lá kim.","solution":"Theo đáp án của ngân hàng: chọn B. Đài nguyên. Đới lạnh có đài nguyên; đới nóng có rừng mưa nhiệt đới, savan; đới ôn hòa có rừng lá rộng, thảo nguyên.","trap":"Không xếp hoang mạc nóng và đài nguyên vào cùng một đới.","extra":[]}],"searchText":"SINH QUYỂN. Sinh quyển và sự phân bố sinh vật Dạng 1. Khái niệm và giới hạn sinh quyển Sinh quyển gồm phần thấp khí quyển, toàn thủy quyển và phần trên thạch quyển có sự sống. Đề bài tham khảo từ ngân hàng:\nCâu 7: Giới hạn của sinh quyển bao gồm\nA. phần thấp của khí quyển, toàn bộ thuỷ quyển và phần trên của thạch quyển.\nB. phần thấp tầng đối lưu, toàn bộ thuỷ quyển và thổ nhưỡng quyển.\nC. phần trên tầng đối lưu, phần dưới của tầng bình lưu và toàn bộ thuỷ quyển.\nD. phần thấp tầng đối lưu, phần trên tầng bình lưu, đại dương và đất liền. Theo đáp án của ngân hàng: chọn A. phần thấp của khí quyển, toàn bộ thuỷ quyển và phần trên của thạch quyển. Sinh quyển gồm phần thấp khí quyển, toàn thủy quyển và phần trên thạch quyển có sự sống. Không coi sinh quyển là một lớp riêng tách biệt hoàn toàn khỏi các quyển khác. Dạng 2. Ảnh hưởng của khí hậu Nhiệt độ và lượng mưa là các nhân tố lớn chi phối sự phân bố thảm thực vật. Đề bài tham khảo từ ngân hàng:\nCâu 21: Nhân tố nào sau đây có ảnh hưởng lớn nhất đến sự phân bố các thảm thực vật trên Trái Đất?\nA. Sinh vật.\nB. Địa hình.\nC. Khí hậu.\nD. Thổ nhưỡng. Theo đáp án của ngân hàng: chọn C. Khí hậu. Nhiệt độ và lượng mưa là các nhân tố lớn chi phối sự phân bố thảm thực vật. Địa hình, đất và sinh vật cũng tác động, không chỉ khí hậu. Dạng 3. Nhận biết thảm thực vật theo đới Đới lạnh có đài nguyên; đới nóng có rừng mưa nhiệt đới, savan; đới ôn hòa có rừng lá rộng, thảo nguyên. Đề bài tham khảo từ ngân hàng:\nCâu 23: Kiểu thảm thực vật nào sau đây thuộc vào môi trường đới lạnh?\nA. Thảo nguyên.\nB. Đài nguyên.\nC. Rừng lá rộng.\nD. Rừng lá kim. Theo đáp án của ngân hàng: chọn B. Đài nguyên. Đới lạnh có đài nguyên; đới nóng có rừng mưa nhiệt đới, savan; đới ôn hòa có rừng lá rộng, thảo nguyên. Không xếp hoang mạc nóng và đài nguyên vào cùng một đới."},{"number":46,"title":"CÂN BẰNG TỰ NHIÊN.","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-46","summary":"Cân bằng tự nhiên","intro":["Cân bằng tự nhiên"],"forms":[{"title":"Dạng 1. Khống chế sinh học và cân bằng","tip":"Các quan hệ dinh dưỡng, cạnh tranh và điều kiện môi trường giúp số lượng quần thể dao động quanh mức phù hợp.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 3: Số lượng cá thể trong quần xã thay đổi theo những điều kiện của ngoại cảnh. Tuy nhiên, số lượng cá thể luôn luôn được khống chế ở mức độ nhất định phù hợp với khả năng của môi trường. Hiện tượng này được gọi là gì ?\nA. Sự bất biến của quần xã.\nB. Sự phát triển của quần xã.\nC. Sự giảm sút của quần xã.\nD. Sự cân bằng sinh học trong quần xã.","solution":"Theo đáp án của ngân hàng: chọn D. Sự cân bằng sinh học trong quần xã. Các quan hệ dinh dưỡng, cạnh tranh và điều kiện môi trường giúp số lượng quần thể dao động quanh mức phù hợp.","trap":"Cân bằng tự nhiên là cân bằng động, không phải trạng thái không đổi.","extra":[]},{"title":"Dạng 2. Nguyên nhân mất cân bằng","tip":"Khai thác quá mức, ô nhiễm, phá rừng, loài ngoại lai và biến đổi môi trường có thể phá vỡ cân bằng.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 2: Nguyên nhân chủ yếu làm mất cân bằng sinh thái là do:\nA. Hoạt động của con người.\nB. Hoạt động của sinh vật.\nC. Hoạt động của núi lửa.\nD. Cả A và B.","solution":"Theo đáp án của ngân hàng: chọn A. Hoạt động của con người. Khai thác quá mức, ô nhiễm, phá rừng, loài ngoại lai và biến đổi môi trường có thể phá vỡ cân bằng.","trap":"Không quy mọi biến động tự nhiên đều do con người.","extra":[]},{"title":"Dạng 3. Đọc tháp tuổi quần thể","tip":"Đáy rộng, nhóm trước sinh sản lớn thường biểu thị quần thể phát triển; đáy hẹp có xu hướng giảm.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 4: Một quần thể chim sẻ có số lượng cá thể ở các nhóm tuổi như sau: - Nhóm tuổi trước sinh sản: 53 con/ha - Nhóm tuổi sinh sản: 29 con/ha - Nhóm tuổi sau sinh sản: 17 con/ha Biểu đồ tháp tuổi của quần thể này đang ở dạng nào?\nA. Vừa ở dạng ổn định vừa ở dạng phát triển.\nB. Dạng phát triển.\nC. Dạng giảm sút.\nD. Dạng ổn định.","solution":"Theo đáp án của ngân hàng: chọn B. Dạng phát triển. Đáy rộng, nhóm trước sinh sản lớn thường biểu thị quần thể phát triển; đáy hẹp có xu hướng giảm.","trap":"Phải so sánh cả ba nhóm tuổi, không chỉ tổng số cá thể.","extra":[]}],"searchText":"CÂN BẰNG TỰ NHIÊN. Cân bằng tự nhiên Dạng 1. Khống chế sinh học và cân bằng Các quan hệ dinh dưỡng, cạnh tranh và điều kiện môi trường giúp số lượng quần thể dao động quanh mức phù hợp. Đề bài tham khảo từ ngân hàng:\nCâu 3: Số lượng cá thể trong quần xã thay đổi theo những điều kiện của ngoại cảnh. Tuy nhiên, số lượng cá thể luôn luôn được khống chế ở mức độ nhất định phù hợp với khả năng của môi trường. Hiện tượng này được gọi là gì ?\nA. Sự bất biến của quần xã.\nB. Sự phát triển của quần xã.\nC. Sự giảm sút của quần xã.\nD. Sự cân bằng sinh học trong quần xã. Theo đáp án của ngân hàng: chọn D. Sự cân bằng sinh học trong quần xã. Các quan hệ dinh dưỡng, cạnh tranh và điều kiện môi trường giúp số lượng quần thể dao động quanh mức phù hợp. Cân bằng tự nhiên là cân bằng động, không phải trạng thái không đổi. Dạng 2. Nguyên nhân mất cân bằng Khai thác quá mức, ô nhiễm, phá rừng, loài ngoại lai và biến đổi môi trường có thể phá vỡ cân bằng. Đề bài tham khảo từ ngân hàng:\nCâu 2: Nguyên nhân chủ yếu làm mất cân bằng sinh thái là do:\nA. Hoạt động của con người.\nB. Hoạt động của sinh vật.\nC. Hoạt động của núi lửa.\nD. Cả A và B. Theo đáp án của ngân hàng: chọn A. Hoạt động của con người. Khai thác quá mức, ô nhiễm, phá rừng, loài ngoại lai và biến đổi môi trường có thể phá vỡ cân bằng. Không quy mọi biến động tự nhiên đều do con người. Dạng 3. Đọc tháp tuổi quần thể Đáy rộng, nhóm trước sinh sản lớn thường biểu thị quần thể phát triển; đáy hẹp có xu hướng giảm. Đề bài tham khảo từ ngân hàng:\nCâu 4: Một quần thể chim sẻ có số lượng cá thể ở các nhóm tuổi như sau: - Nhóm tuổi trước sinh sản: 53 con/ha - Nhóm tuổi sinh sản: 29 con/ha - Nhóm tuổi sau sinh sản: 17 con/ha Biểu đồ tháp tuổi của quần thể này đang ở dạng nào?\nA. Vừa ở dạng ổn định vừa ở dạng phát triển.\nB. Dạng phát triển.\nC. Dạng giảm sút.\nD. Dạng ổn định. Theo đáp án của ngân hàng: chọn B. Dạng phát triển. Đáy rộng, nhóm trước sinh sản lớn thường biểu thị quần thể phát triển; đáy hẹp có xu hướng giảm. Phải so sánh cả ba nhóm tuổi, không chỉ tổng số cá thể."},{"number":47,"title":"BẢO VỆ MÔI TRƯỜNG.","subject":"Sinh học","subjectKey":"biology","shortSubject":"Sinh","slug":"bai-47","summary":"Bảo vệ môi trường và tài nguyên thiên nhiên","intro":["Bảo vệ môi trường và tài nguyên thiên nhiên"],"forms":[{"title":"Dạng 1. Vai trò của trồng và bảo vệ rừng","tip":"Rừng giữ đất, giữ nước, điều hòa khí hậu, hấp thụ CO2 và bảo vệ đa dạng sinh học.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 1: Trồng rừng có vai trò\nA. tạo nơi ở cho các loài sinh vật.\nB. chống xói mòn đất.\nC. tạo sự cân bằng cho hệ sinh thái.\nD. cả A, B, C đều đúng.","solution":"Theo đáp án của ngân hàng: chọn D. cả A, B, C đều đúng. Rừng giữ đất, giữ nước, điều hòa khí hậu, hấp thụ CO2 và bảo vệ đa dạng sinh học.","trap":"Trồng rừng không thay thế hoàn toàn việc giảm ô nhiễm và khai thác quá mức.","extra":[]},{"title":"Dạng 2. Sử dụng bền vững tài nguyên tái tạo","tip":"Tài nguyên tái tạo có thể phục hồi nếu khai thác dưới khả năng tái tạo và có biện pháp bảo vệ.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 10: Những dạng tài nguyên khi sử dụng hợp lí sẽ có điều kiện phát triển phục hồi gọi là\nA. tài nguyên sinh vật.\nB. tài nguyên tái sinh.\nC. tài nguyên không tái sinh.\nD. tài nguyên năng lượng vĩnh cửu.","solution":"Theo đáp án của ngân hàng: chọn B. tài nguyên tái sinh. Tài nguyên tái tạo có thể phục hồi nếu khai thác dưới khả năng tái tạo và có biện pháp bảo vệ.","trap":"“Có thể tái tạo” không có nghĩa là vô hạn.","extra":[]},{"title":"Dạng 3. Trách nhiệm bảo vệ môi trường","tip":"Bảo vệ môi trường là trách nhiệm của cơ quan, tổ chức, cộng đồng và từng cá nhân.","example":"Đề bài tham khảo từ ngân hàng:\nCâu 17: Chấp hành luật Bảo vệ môi trường là trách nhiệm của ai?\nA. Học sinh.\nB. Tất cả mọi người.\nC. Người cao tuổi.\nD. Giáo viên.","solution":"Theo đáp án của ngân hàng: chọn B. Tất cả mọi người. Bảo vệ môi trường là trách nhiệm của cơ quan, tổ chức, cộng đồng và từng cá nhân.","trap":"Không chỉ giao trách nhiệm cho nhà nước hoặc lực lượng chuyên môn.","extra":[]}],"searchText":"BẢO VỆ MÔI TRƯỜNG. Bảo vệ môi trường và tài nguyên thiên nhiên Dạng 1. Vai trò của trồng và bảo vệ rừng Rừng giữ đất, giữ nước, điều hòa khí hậu, hấp thụ CO2 và bảo vệ đa dạng sinh học. Đề bài tham khảo từ ngân hàng:\nCâu 1: Trồng rừng có vai trò\nA. tạo nơi ở cho các loài sinh vật.\nB. chống xói mòn đất.\nC. tạo sự cân bằng cho hệ sinh thái.\nD. cả A, B, C đều đúng. Theo đáp án của ngân hàng: chọn D. cả A, B, C đều đúng. Rừng giữ đất, giữ nước, điều hòa khí hậu, hấp thụ CO2 và bảo vệ đa dạng sinh học. Trồng rừng không thay thế hoàn toàn việc giảm ô nhiễm và khai thác quá mức. Dạng 2. Sử dụng bền vững tài nguyên tái tạo Tài nguyên tái tạo có thể phục hồi nếu khai thác dưới khả năng tái tạo và có biện pháp bảo vệ. Đề bài tham khảo từ ngân hàng:\nCâu 10: Những dạng tài nguyên khi sử dụng hợp lí sẽ có điều kiện phát triển phục hồi gọi là\nA. tài nguyên sinh vật.\nB. tài nguyên tái sinh.\nC. tài nguyên không tái sinh.\nD. tài nguyên năng lượng vĩnh cửu. Theo đáp án của ngân hàng: chọn B. tài nguyên tái sinh. Tài nguyên tái tạo có thể phục hồi nếu khai thác dưới khả năng tái tạo và có biện pháp bảo vệ. “Có thể tái tạo” không có nghĩa là vô hạn. Dạng 3. Trách nhiệm bảo vệ môi trường Bảo vệ môi trường là trách nhiệm của cơ quan, tổ chức, cộng đồng và từng cá nhân. Đề bài tham khảo từ ngân hàng:\nCâu 17: Chấp hành luật Bảo vệ môi trường là trách nhiệm của ai?\nA. Học sinh.\nB. Tất cả mọi người.\nC. Người c
