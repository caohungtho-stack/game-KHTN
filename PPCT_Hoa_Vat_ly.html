<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b6b57">
  <title>Phân phối chương trình</title>
  <meta name="description" content="Xem nhanh PPCT Hóa 6, Hóa 7, Hóa 8, Hóa 9 và Vật lý 7">
  <style>
    :root{--green:#0b6b57;--green2:#0e8069;--ink:#17332d;--muted:#64756f;--line:#dbe7e3;--paper:#fff;--bg:#edf5f2;--accent:#e5f4ef}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
    header{background:linear-gradient(135deg,#075746,var(--green2));color:#fff;padding:24px 20px 20px}
    header>div,main{width:min(1080px,100%);margin:auto}
    h1{margin:0;font-size:clamp(1.5rem,4vw,2.15rem);letter-spacing:-.02em}
    header p{margin:5px 0 0;color:#d9f4eb}
    nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(17,52,43,.08);backdrop-filter:blur(10px)}
    .tabs{display:flex;gap:8px;width:min(1080px,100%);margin:auto;padding:11px 16px;overflow-x:auto;scrollbar-width:thin}
    button{flex:0 0 auto;border:1px solid #b9cec7;background:#fff;color:var(--green);border-radius:999px;padding:10px 17px;font:700 15px/1 system-ui;cursor:pointer;transition:.18s}
    button:hover{background:var(--accent)}
    button[aria-selected="true"]{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 3px 10px rgba(11,107,87,.24)}
    main{padding:22px 16px 48px}
    .topline{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:14px}
    h2{margin:0;color:var(--green);font-size:1.35rem}
    .summary{margin:3px 0 0;color:var(--muted);font-size:.95rem}
    .count{white-space:nowrap;color:var(--muted);font-size:.9rem}
    .panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 28px rgba(16,65,53,.08)}
    table{width:100%;border-collapse:collapse}
    th{position:sticky;top:60px;z-index:5;background:#dff1eb;color:#075746;text-align:left;padding:13px 14px;font-size:.9rem;border-bottom:1px solid #b9d8cf}
    td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}
    tr:last-child td{border-bottom:0}
    tbody tr:hover{background:#f5faf8}
    th:nth-child(1),td:nth-child(1){width:64px;text-align:center}
    th:nth-child(2),td:nth-child(2){width:155px;text-align:center;font-weight:700;color:#315b50}
    th:nth-child(4),td:nth-child(4){width:90px;text-align:center}
    .empty{padding:30px;text-align:center;color:var(--muted)}
    .to-top{position:fixed;right:18px;bottom:18px;width:46px;height:46px;padding:0;border-radius:50%;background:var(--green);color:#fff;border:0;box-shadow:0 6px 18px rgba(11,107,87,.3);display:none;font-size:20px}
    .to-top.show{display:block}
    @media(max-width:680px){
      header{padding:18px 16px 16px}.tabs{padding:9px 12px}main{padding:16px 10px 40px}.topline{align-items:start}.count{display:none}
      .panel{border-radius:12px;background:transparent;border:0;box-shadow:none;overflow:visible}
      table,thead,tbody,tr,td{display:block}thead{display:none}tbody{display:grid;gap:10px}
      tr{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 13px;box-shadow:0 4px 12px rgba(16,65,53,.06)}
      td{border:0!important;padding:2px 0!important;text-align:left!important;width:auto!important}
      td:nth-child(1){display:inline-block;color:var(--green);font-weight:800;margin-right:9px}
      td:nth-child(1)::before{content:"STT "}
      td:nth-child(2){display:inline-block;font-size:.9rem}
      td:nth-child(2)::before{content:"Tiết PPCT: ";font-weight:500;color:var(--muted)}
      td:nth-child(3){margin-top:7px;font-weight:650;color:var(--ink)}
      td:nth-child(4){margin-top:5px;color:var(--muted);font-size:.9rem}
      td:nth-child(4)::before{content:"Số tiết: "}
    }
  </style>
</head>
<body>
  <header><div><h1>Phân phối chương trình</h1><p>Chọn môn để xem danh sách bài dạy</p></div></header>
  <nav aria-label="Chọn môn học"><div class="tabs" id="tabs"></div></nav>
  <main>
    <div class="topline"><div><h2 id="title"></h2><p class="summary" id="summary"></p></div><span class="count" id="count"></span></div>
    <div class="panel"><table><thead><tr><th>STT</th><th>Tiết PPCT</th><th>Bài học</th><th>Số tiết</th></tr></thead><tbody id="rows"></tbody></table></div>
  </main>
  <button class="to-top" id="toTop" aria-label="Lên đầu trang">↑</button>
  <script>
    const subjects={

      ]},
      hoa7:{label:'Hóa 7',summary:'Cả năm: 32 tiết · Học kỳ I: 18 tiết · Học kỳ II: 14 tiết',rows:[
        ['1','1, 2, 3, 4, 5','Bài 2: Nguyên tử','5'],['2','6, 7, 8, 10','Bài 3: Nguyên tố hóa học','4'],['3','9','Kiểm tra giữa kì I','1'],['4','11, 12, 13, 14, 15','Bài 4: Sơ lược về bảng tuần hoàn các nguyên tố hóa học','5'],['5','16','Ôn tập cuối kì I','1'],['6','17','Kiểm tra cuối kì I','1'],['7','18, 19','Bài 4: Sơ lược về bảng tuần hoàn các nguyên tố hóa học (Tiếp)','2'],['8','20, 21, 22, 23','Bài 5: Phân tử - Đơn chất - Hợp chất','4'],['9','24, 25','Bài 6: Giới thiệu về liên kết hóa học','2'],['10','26','Kiểm tra giữa kì II','1'],['11','27, 28','Bài 6: Giới thiệu về liên kết hóa học (Tiếp)','2'],['12','29, 30, 31','Bài 7: Hóa trị và công thức hóa học','3'],['13','32','Ôn tập cuối kì II','1']
      ]},
      hoa8:{label:'Hóa 8',summary:'Cả năm: 53 tiết · Học kỳ I: 36 tiết · Học kỳ II: 17 tiết',rows:[
        ['1','1, 2, 3','Bài 1: Sử dụng một số hoá chất, thiết bị cơ bản trong phòng thí nghiệm','3'],['2','4, 5, 6','Bài 2. Phản ứng hoá học','3'],['3','7, 8, 9','Bài 3. Mol và tỉ khối chất khí','3'],['4','10, 11, 12, 13','Bài 4. Dung dịch và nồng độ dung dịch','4'],['5','14, 15, 16, 17','Bài 5. Định luật bảo toàn khối lượng và phương trình hoá học','4'],['6','18','Kiểm tra giữa HK I','1'],['7','19, 20, 21, 22','Bài 6. Tính theo phương trình hoá học','4'],['8','23, 24, 25, 26','Bài 7. Tốc độ phản ứng và chất xúc tác','4'],['9','27, 28, 29','Bài 8. Acid','3'],['10','32','Ôn tập cuối kỳ I','1'],['11','33','Kiểm tra giữa HK I','1'],['12','30, 31, 34, 35, 36','Bài 9. Base. Thang pH','5'],['13','37, 38, 39, 40','Bài 10. Oxide','4'],['14','41, 42, 43','Bài 11. Muối','3'],['15','44','Kiểm tra giữa HK II','1'],['16','45, 46, 47','Bài 11. Muối 9 (Tiếp)','3'],['17','47','Ôn tập cuối ký II','1'],['18','49','Kiểm tra cuối HK II','1'],['19','50, 51, 52, 53','Bài 12. Phân bón hoá học','4']
      ]},
      hoa9:{label:'Hóa 9',summary:'Cả năm: 56 tiết · Danh sách trong tệp bắt đầu từ mục 22',rows:[
        ['22','45-47','MỞ ĐẦU (2 tiết) · Bài 1. Nhận biết một số dụng cụ, hóa chất. Thuyết trình một vấn đề khoa học.','3'],['23','48-51','Bài 18. Tính chất chung của kim loại.','4'],['24','52-54','Bài 19. Dãy hoạt động hóa học.','3'],['25','55-57','Bài 20. Tách kim loại và việc sử dụng hợp kim.','3'],['26','58-62','Bài 21. Sự khác nhau cơ bản giữa phi kim và kim loại','5'],['27','63-65','Bài 22. Giới thiệu về hợp chất hữu cơ.','3'],['28','66-68','Bài 23. Alkane.','3'],['29','69-71','Bài 24. Alkene.','3'],['30','72-74','Bài 25. Nguồn nhiên liệu.','3'],['31','75, 76','Bài 26. Ethylic Alcohol.','3'],['32','77','Ôn tập cuối học kỳ I','1'],['33','78','Kiểm tra, đánh giá cuối kỳ I','1'],['34','79','Bài 26. Ethylic Alcohol. (Tiếp)','1'],['35','80-82','Bài 27. Acetic acid.','3'],['36','83-84','Bài 28. Lipid.','2'],['37','85-86','Bài 29. Carbohydrate. Glucose và saccharose.','2'],['38','87-88','Bài 30. Tinh bột và cellulose.','2'],['39','89','Kiểm tra, đánh giá giữa kỳ II','1'],['40','90-91','Bài 31. Protein.','2'],['41','92-93','Bài 32. Polymer.','2'],['42','94-95','Bài 33. Sơ lược về hóa học vỏ trái đất và khai thác tài nguyên từ vỏ trái đất.','2'],['43','96, 98','Bài 34. Khai thác đá vôi. Công nghiệp Silicate.','2'],['44','97','Ôn tập cuối kỳ II','1'],['45','98-99','Bài 35. Khai thác nhiên liệu hóa thạch. Nguồn carbon. Chu trình carbon và sự ấm lên toàn cầu.','2']
      ]},
      ly7:{label:'Vật lý 7',summary:'Cả năm: 49 tiết · Học kỳ I: 29 tiết · Học kỳ II: 20 tiết',rows:[
        ['14','33-37','Bài 1: Phương pháp và kỹ năng học tập môn Khoa học tự nhiên','5'],['15','38-39','Bài 8: Tốc độ chuyển động','2'],['16','40-42','Bài 9: Đo tốc độ','3'],['17','43-44','Bài 10: Đồ thị quãng đường - thời gian','2'],['18','45-48','Bài 11: Thảo luận về ảnh hưởng của tốc độ trong an toàn giao thông','4'],['19','49','Ôn tập cuối kì I','1'],['20','50-52','Bài 12: Sóng âm','3'],['21','53-55','Bài 13: Độ to và độ cao của âm','3'],['22','56-59','Bài 14: Phản xạ âm, chống ô nhiễm tiếng ồn','4'],['23','60-62','Bài 15: Năng lượng ánh sáng. Tia sáng, vùng tối','3'],['24','63-65','Bài 16: Sự phản xạ ánh sáng','3'],['25','66-69','Bài 17: Ảnh của vật qua gương phẳng','4'],['26','70-72','Bài 18: Nam châm','3'],['27','73-75','Bài 19: Từ trường','3'],['28','76','Ôn tập cuối kì II','1'],['29','77','Kiểm tra cuối kì II','1'],['30','78','Bài 19: Từ trường (Tiếp)','1'],['31','79-81','Bài 20: Chế tạo nam châm điện đơn giản','3']
      ]}
    };
    const tabs=document.getElementById('tabs'),rows=document.getElementById('rows');
    Object.entries(subjects).forEach(([key,s],i)=>{const b=document.createElement('button');b.textContent=s.label;b.dataset.key=key;b.setAttribute('aria-selected',i===0?'true':'false');b.onclick=()=>show(key);tabs.appendChild(b)});
    function show(key){const s=subjects[key];document.getElementById('title').textContent=s.label;document.getElementById('summary').textContent=s.summary;document.getElementById('count').textContent=s.rows.length+' nội dung';rows.innerHTML=s.rows.map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('');tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.key===key?'true':'false'));window.scrollTo({top:0,behavior:'smooth'})}
    const topButton=document.getElementById('toTop');addEventListener('scroll',()=>topButton.classList.toggle('show',scrollY>500));topButton.onclick=()=>scrollTo({top:0,behavior:'smooth'});show('hoa6');
  </script>
</body>
</html>
