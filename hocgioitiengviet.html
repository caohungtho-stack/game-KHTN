<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="description" content="Em Viết Đúng - luyện chính tả lớp 5 bằng trắc nghiệm, chấm điểm, pháo hoa và lưu tiến bộ, dùng không cần Internet.">
<title>Em Viết Đúng · Toàn màn hình · Nền xanh đen</title>
<style>
:root{--ink:#213248;--muted:#6a7789;--teal:#0b9d93;--deep:#08776f;--mint:#e5f8f3;--paper:#faf9f4;--white:#fff;--border:#e7e9e7;--amber:#ffb447;--purple:#6c64dc;--danger:#d05a50;--danger-bg:#fff0ed;--shadow:0 9px 25px rgba(36,55,67,.08);--radius:23px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:500 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;min-height:100dvh}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid #66c4f3;outline-offset:2px}
button:disabled{cursor:default;opacity:.52}
.app-shell{max-width:850px;margin:0 auto;padding:0 18px calc(100px + env(safe-area-inset-bottom));min-height:100dvh;position:relative}
.topbar{height:78px;display:flex;justify-content:space-between;align-items:center;gap:14px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:20px;letter-spacing:-.75px;color:var(--ink);background:transparent;border:0;padding:4px 0}
.brand-mark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:#d9f5ee;color:#087f76;font-size:22px;transform:rotate(-7deg)}
.brand span.word-strong{color:var(--deep)}
.profile-trigger{display:flex;gap:7px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:50px;padding:8px 11px;font-size:13px;font-weight:750;max-width:155px;box-shadow:0 2px 7px rgba(0,0,0,.03)}
.profile-trigger span.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{position:relative;z-index:1}
.hero{overflow:hidden;background:linear-gradient(126deg,#0a978b 0%,#119e95 60%,#20b4a6 100%);color:#fff;padding:30px 28px 27px;border-radius:30px;position:relative;box-shadow:0 12px 28px rgba(5,128,118,.2)}
.hero::before{content:"✦";position:absolute;right:25px;top:12px;font-size:66px;color:#ffffff33;transform:rotate(-22deg)}
.hero::after{content:"";position:absolute;right:-35px;bottom:-80px;width:235px;height:235px;border:35px solid #ffffff18;border-radius:50%}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;opacity:.9}
.hero h1{font-size:clamp(27px,6vw,38px);line-height:1.16;letter-spacing:-1.25px;max-width:460px;margin:13px 0 11px;font-weight:900}
.hero p{max-width:475px;margin:0 0 21px;color:#e6fffb;font-size:14.5px}
.hero-bottom{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative;z-index:2}
.btn{border:0;border-radius:16px;min-height:52px;padding:12px 18px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s ease,filter .15s ease}
.btn:active:not(:disabled){transform:scale(.975)}
.btn.primary{background:var(--teal);color:#fff;box-shadow:0 8px 18px rgba(5,121,112,.15)}
.btn.light{background:#fff;color:var(--deep);box-shadow:0 5px 10px #003f3520}
.btn.ghost{background:#ecf8f5;color:var(--deep)}
.btn.outline{background:#fff;color:var(--ink);border:1px solid var(--border)}
.btn.full{width:100%}
.hero-note{font-size:12px;color:#e9fffc;font-weight:650}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0 24px}
.stat{background:#fff;border:1px solid #eceee8;border-radius:20px;padding:15px 10px;text-align:center;box-shadow:0 3px 12px #10203408}
.stat-emoji{display:block;font-size:18px}
.stat-number{display:block;font-size:clamp(20px,5vw,29px);font-weight:900;letter-spacing:-1px;line-height:1.25;margin:4px 0}
.stat-label{font-size:11.5px;color:var(--muted);font-weight:700}
.section-title{font-size:20px;font-weight:900;letter-spacing:-.6px;margin:23px 0 13px}
.tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border-radius:23px;border:1px solid #eceeeb;padding:18px 17px 17px;text-align:left;min-height:163px;box-shadow:0 3px 10px #192b4308;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;gap:7px;transition:transform .15s}
.tile:active{transform:scale(.985)}
.tile .tile-icon{height:43px;width:43px;border-radius:14px;background:#e5f6fd;display:grid;place-items:center;font-size:24px}
.tile.violet .tile-icon{background:#eeeafd}
.tile.orange .tile-icon{background:#fff0d6}
.tile.green .tile-icon{background:#e5f7ed}
.tile strong{font-size:16px;line-height:1.22}
.tile small{font-size:12px;color:var(--muted);line-height:1.4}
.bottom-note{background:#fff8e8;border:1px solid #ffeab8;border-radius:18px;padding:13px 15px;margin-top:17px;font-size:12.5px;color:#735a2e;display:flex;gap:10px;align-items:flex-start}
.bottom-note b{color:#5e4722}
.bottom-nav{z-index:9;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,850px);display:flex;justify-content:space-evenly;gap:2px;padding:8px 13px calc(8px + env(safe-area-inset-bottom));background:#fffffff5;border-top:1px solid #eceee9;box-shadow:0 -8px 20px #2433410a;backdrop-filter:blur(10px)}
.nav-btn{border:0;background:transparent;border-radius:14px;color:#758195;font-size:10px;font-weight:800;display:grid;justify-items:center;gap:3px;min-height:53px;align-content:center;padding:4px 7px;min-width:65px}
.nav-btn .nav-icon{font-size:21px;line-height:1}
.nav-btn.active{background:#e8f8f5;color:#087f76}
.backline{display:flex;align-items:center;justify-content:space-between;gap:9px;margin:3px 0 18px}
.back-btn{background:transparent;border:0;color:var(--muted);padding:9px 0;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center}
.page-title{font-size:clamp(24px,6vw,33px);letter-spacing:-1px;line-height:1.2;margin:6px 0 8px;font-weight:900}
.page-subtitle{font-size:14px;color:var(--muted);margin:0 0 23px}
.quiz-strip{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#fff;padding:12px 14px;border:1px solid var(--border);border-radius:18px;margin:8px 0 16px}
.pill{padding:5px 10px;border-radius:40px;background:#eaf7f5;color:#087c74;font-size:12px;font-weight:900;white-space:nowrap}
.progress-track{width:100%;height:10px;border-radius:100px;background:#e9eeeb;overflow:hidden}
.progress-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,#15a9a0,#8fd6ac);transition:width .32s ease}
.prompt-card{border-radius:25px;background:#fff;box-shadow:var(--shadow);border:1px solid #e9efed;padding:24px 19px 21px;margin:0 0 15px}
.prompt-card h2{font-size:clamp(20px,5.3vw,26px);line-height:1.33;letter-spacing:-.5px;margin:8px 0 16px;font-weight:900}
.badge{background:#f3effe;color:#6252c4;border-radius:20px;font-size:11px;font-weight:900;padding:5px 9px;display:inline-block}
.badge.find{background:#fff0da;color:#a36205}.badge.multi{background:#e5f4ff;color:#26739a}
.sentence{border-radius:17px;background:#f4f8f7;padding:17px 15px;white-space:pre-line;font-size:clamp(17px,4.5vw,20px);font-weight:780;line-height:1.57;letter-spacing:.1px;overflow-wrap:anywhere;color:#203649}
.sentence:empty{display:none}
.sentence .blank{background:#c8f4e9;border-radius:7px;padding:1px 4px}
.choose-label{font-size:12px;font-weight:900;letter-spacing:1px;color:#68778c;text-transform:uppercase;margin:17px 2px 12px}
.choices{display:grid;gap:10px}
.choice{position:relative;display:flex;align-items:center;gap:13px;width:100%;padding:13px 13px;min-height:65px;text-align:left;border-radius:18px;background:#fff;border:2px solid #e8ece9;color:var(--ink);box-shadow:0 3px 8px #28404c08;transition:border-color .12s ease,background .12s ease,transform .12s ease}
.choice:not(:disabled):active{transform:scale(.992)}
.choice-letter{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;background:#f1f4f5;color:#6e7c8a;font-weight:900}
.choice-text{font-size:clamp(16px,4.25vw,19px);line-height:1.3;font-weight:760;flex:1;overflow-wrap:anywhere}
.choice.selected{border-color:#199f96;background:#edf9f5}
.choice.selected .choice-letter{background:#c3eee5;color:#057b70}
.choice.right{border-color:#0f9e7f!important;background:#e9faf1!important;opacity:1!important}
.choice.right .choice-letter{background:#139a7b;color:#fff}
.choice.wrong{border-color:#dc776a!important;background:#fff0ed!important;opacity:1!important}
.choice.wrong .choice-letter{background:#d66559;color:#fff}
.choice:disabled{opacity:.72}
.choice .choice-symbol{font-size:20px;font-weight:900;margin-left:auto}
.choice-note{font-size:12.5px;color:#68778b;margin:12px 2px}
.feedback{border-radius:23px;border:1px solid #bde8d4;background:#edf9f3;padding:18px 18px;margin-top:16px;animation:pop .25s ease}
.feedback.fail{border-color:#f3d6b0;background:#fff8ed}
.feedback-title{font-size:20px;font-weight:950;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.feedback-title.success{color:#077f67}.feedback-title.fail{color:#9b6326}
.feedback .answer-line{font-size:14px;font-weight:780;margin:7px 0;color:var(--ink);overflow-wrap:anywhere}
.feedback .explain{font-size:13px;color:#536174;line-height:1.55}
.feedback .live-stat{border-radius:11px;background:#ffffffa6;padding:10px 12px;font-size:13px;font-weight:800;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:11px 0}
.feedback .btn{margin-top:13px}
@keyframes pop{from{transform:translateY(8px);opacity:.2}to{transform:translateY(0);opacity:1}}
.result-card{text-align:center;background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:30px 20px;margin-top:15px}
.result-symbol{font-size:47px}
.result-ring{width:150px;height:150px;border-radius:100%;background:conic-gradient(#11a999 var(--progress),#e8eeeb 0);display:grid;place-items:center;margin:20px auto}
.result-ring-inner{height:117px;width:117px;border-radius:100%;display:grid;place-items:center;align-content:center;background:white}
.result-ring-inner b{font-size:34px;line-height:1.1}
.result-ring-inner small{font-size:11px;color:var(--muted);font-weight:800}
.result-data{display:flex;justify-content:center;gap:23px;margin:20px 0}
.result-data b{font-size:22px;display:block}.result-data small{font-size:12px;color:var(--muted)}
.result-buttons{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.find-box{border-radius:15px;padding:12px 14px;background:#fff8df;border:1px solid #f3e5ba;color:#73552d;font-size:13px;margin-bottom:10px}
.category-search{width:100%;height:51px;border-radius:16px;border:1.5px solid #dce8e6;padding:0 15px;background:#fff;font-size:15px;margin:0 0 14px;color:var(--ink)}
.category-section{margin:19px 0 12px;font-size:12px;font-weight:950;letter-spacing:1px;text-transform:uppercase;color:#6b7c89}
.group-card{display:flex;align-items:center;gap:13px;text-align:left;background:#fff;border:1px solid var(--border);border-radius:16px;padding:13px 14px;width:100%;margin:8px 0;color:var(--ink);min-height:66px}
.group-initial{width:40px;height:40px;border-radius:13px;background:#e5f7f4;display:grid;place-items:center;color:#04776d;flex:none;font-size:20px;font-weight:900}
.group-card b{font-size:15px;display:block}.group-card small{font-size:11.5px;color:var(--muted);display:block;margin-top:1px}
.group-arrow{margin-left:auto;color:#aab4be;font-weight:bold;font-size:22px}
.note-card{border-radius:18px;padding:16px;background:#fff;border:1px solid var(--border);margin-bottom:12px}
.note-card h3{font-size:15px;margin:0 0 6px}
.note-card p{font-size:13px;color:var(--muted);margin:6px 0}
.note-status{font-size:11px;font-weight:900;color:#a05c13;background:#fff0d5;display:inline-block;border-radius:100px;padding:4px 8px}
.note-status.mastered{background:#e7f8ef;color:#168266}
.history-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #ecefeb}
.history-row:last-child{border:0}
.history-row b{font-size:14px}.history-row small{font-size:12px;color:var(--muted);display:block;margin-top:3px}
.percentage{font-size:20px;font-weight:900;color:#0d9885}
.empty{background:#fff;border:1px dashed #cbd9d4;border-radius:23px;text-align:center;padding:33px 20px;color:var(--muted)}
.empty .icon{font-size:37px;margin-bottom:12px}.empty b{color:var(--ink);display:block;margin:4px}
.empty p{font-size:14px;margin:7px 0 17px}
.side-note{font-size:12px;color:#7b8593;margin-top:20px;line-height:1.5}
.app-dialog{width:min(94vw,430px);max-height:calc(100dvh - 30px);overflow:auto;border:0;border-radius:25px;padding:23px;box-shadow:0 15px 55px #162e3e4d;color:var(--ink)}
.app-dialog::backdrop{background:#0e24367a;backdrop-filter:blur(3px)}
.app-dialog h2{font-size:23px;font-weight:900;margin:5px 0 8px}
.app-dialog p{font-size:13px;color:var(--muted);margin:0 0 15px}
.app-dialog .inputline{width:100%;height:50px;border-radius:13px;border:1px solid #ccd8d4;padding:0 13px;background:#fff;margin-bottom:12px}
.profile-item{background:#f6faf8;border:1px solid #e4eeeb;border-radius:12px;width:100%;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:51px;padding:10px 13px;margin:7px 0;font-weight:800;color:var(--ink)}
.profile-item.active{background:#e6f8f3;border-color:#7ecfc0;color:#087a6e}
.dialog-actions{display:flex;gap:8px;margin-top:13px}
#fireworks-canvas{position:fixed;inset:0;z-index:100;pointer-events:none;opacity:1}
#toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);color:#fff;background:#1d3346;border-radius:13px;padding:10px 15px;font-size:13px;font-weight:750;z-index:110;box-shadow:0 8px 25px #0003;max-width:min(88vw,440px);text-align:center;display:none}
@media(min-width:700px){.app-shell{padding-left:32px;padding-right:32px}.tile-grid{grid-template-columns:repeat(4,1fr)}.hero{padding:34px}.choices{grid-template-columns:1fr 1fr}.choice{min-height:80px}.feedback{padding:22px}.prompt-card{padding:28px}}
@media(max-width:340px){.app-shell{padding-left:12px;padding-right:12px}.hero{padding:23px 18px}.tile{padding:14px 12px}.stat{padding:13px 6px}.brand{font-size:18px}.brand-mark{width:32px;height:32px}.choice{padding:10px;gap:9px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* =====================================
   GIAO DIEN V4: XANH DEN + CHU TRANG
   ===================================== */
:root{
  color-scheme: dark;
  --ink:#f6fbff; --muted:#b4c8df; --teal:#167ac4;
  --deep:#bce6ff; --mint:#102f49; --paper:#06101f;
  --white:#112139; --border:#28435f; --amber:#ffd06c;
  --purple:#b6b1ff; --danger:#ff8c91; --danger-bg:#3e2232;
  --accent:#7edaff; --panel:#0c1b30; --panel-high:#122741;
  --shadow:0 12px 32px rgba(0,0,0,.32);
}
html{background:#06101f;min-height:100%;overscroll-behavior-y:contain}
body{
  color:var(--ink);
  background:radial-gradient(ellipse 950px 560px at 88% -12%,rgba(20,96,173,.31),transparent 73%),
             radial-gradient(ellipse 600px 600px at 0 100%,rgba(9,63,125,.22),transparent 76%),
             linear-gradient(156deg,#08192d 0%,#050f1f 54%,#030a15 100%);
  min-height:100vh;min-height:100dvh; background-attachment:fixed;
}
html:fullscreen,html:-webkit-full-screen{background:#06101f;overflow:auto}
html:fullscreen body,html:-webkit-full-screen body{min-height:100dvh}
.app-shell{max-width:1200px;width:100%;margin:0 auto;min-height:100dvh;padding:env(safe-area-inset-top) clamp(13px,3vw,40px) calc(100px + env(safe-area-inset-bottom))}
.topbar{min-height:78px;height:auto;padding:9px 0 12px;gap:10px}
.brand{color:var(--ink)}
.brand-mark{background:#173654;color:#fff;border:1px solid #346080}
.brand span.word-strong{color:var(--accent)}
.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.fullscreen-trigger{
  border:1px solid #3b6082;border-radius:14px;min-height:42px;padding:8px 12px;
  color:#fff;background:#13304f;display:inline-flex;align-items:center;justify-content:center;
  gap:6px;font-size:12px;font-weight:850;white-space:nowrap;
}
.fullscreen-trigger:active{transform:scale(.97)}
.fullscreen-trigger .fullscreen-icon{font-size:21px;line-height:1}
.fullscreen-trigger:hover{background:#19446c}
.profile-trigger{color:var(--ink);background:#10243d;border:1px solid var(--border);box-shadow:0 3px 9px #0003}
.profile-trigger:active{background:#1b3653}
.hero{background:linear-gradient(124deg,#133e6b 0%,#102b4e 44%,#071b34 100%);color:#fff;border:1px solid #386b91;box-shadow:0 17px 35px rgba(0,0,0,.32)}
.hero::before{color:#b8e9ff33}
.hero::after{border-color:#b5dfff12}
.hero p{color:#d9efff}
.hero-note{color:#e3f3ff}
.btn.primary{background:linear-gradient(110deg,#127dca,#205da7);color:#fff;border:1px solid #4795ca;box-shadow:0 8px 22px #0004}
.btn.light{background:#1375b4;color:#fff;border:1px solid #65b6e8;box-shadow:0 8px 20px #0005}
.btn.ghost{background:#163451;color:#fff;border:1px solid #2e6085}
.btn.outline{background:#10253d;color:#fff;border:1px solid #456481}
button:focus-visible,input:focus-visible{outline:3px solid #8edbff;outline-offset:3px}
.stat,.tile,.prompt-card,.choice,.quiz-strip,.result-card,.group-card,.note-card,.empty{
  background:linear-gradient(148deg,#132944,#0c1c32);color:var(--ink);border-color:var(--border);box-shadow:0 5px 16px #0003;
}
.stat-label,.tile small,.page-subtitle,.choice-note,.note-card p,.side-note{color:var(--muted)}
.tile .tile-icon{background:#1a4568}
.tile.violet .tile-icon{background:#36325f}
.tile.orange .tile-icon{background:#51351e}
.tile.green .tile-icon{background:#16443d}
.bottom-note{background:#2c2742;border-color:#63547d;color:#f1eaff}
.bottom-note b{color:#fff}
.bottom-nav{width:min(100%,1200px);color:var(--ink);background:#07172aea;border-top:1px solid #2b4a6a;box-shadow:0 -10px 25px #0006;backdrop-filter:blur(16px)}
.nav-btn{color:#bdcfe7}
.nav-btn.active{background:#1b4368;color:#fff}
.back-btn{color:#d1e5f9}
.pill{background:#183c5b;border:1px solid #376486;color:#f5fbff}
.progress-track{background:#28415c}
.progress-fill{background:linear-gradient(90deg,#1788d5,#53d4f9)}
.badge{background:#38345e;color:#e5dcff}
.badge.find{background:#50371d;color:#ffe0a5}
.badge.multi{background:#153e61;color:#c4e6ff}
.sentence{background:#0a2542;border:1px solid #245174;color:#fff}
.sentence .blank{background:#255a75;color:#fff}
.choose-label{color:#d3e9fc}
.choice{background:#0e2138;border:2px solid #305476;color:#f7fbff;box-shadow:0 3px 9px #0003}
.choice-letter{background:#1b3d5a;color:#f6fbff;border:1px solid #365f7c}
.choice.selected{background:#183e60;border-color:#71cfff}
.choice.selected .choice-letter{background:#276895;color:#fff}
.choice.right,.choice.right:disabled{background:#124a40!important;border-color:#36d4a4!important;color:#fff!important;opacity:1!important}
.choice.right .choice-letter{background:#147b63;color:#fff;border-color:#36d4a4}
.choice.wrong,.choice.wrong:disabled{background:#50253c!important;border-color:#ff8793!important;color:#fff!important;opacity:1!important}
.choice.wrong .choice-letter{background:#a63f5a;color:#fff;border-color:#ff8793}
.choice:disabled{opacity:.8}
.choice-note{color:#c9dbec}
.feedback{background:#102f38;border:1px solid #2f887f;color:#fff}
.feedback.fail{background:#38283a;border-color:#b27884}
.feedback-title.success{color:#81f1c7}
.feedback-title.fail{color:#ffca8b}
.feedback .answer-line{color:#fff}
.feedback .explain{color:#e0edf9}
.feedback .live-stat{background:#163d4e;color:#fff;border:1px solid #3e6d7b}
.result-ring{background:conic-gradient(#31bfff var(--progress),#274058 0)}
.result-ring-inner{background:#0d2139;color:#fff}
.result-ring-inner small,.result-data small{color:#c5d9ee}
.find-box{background:#41311d;border-color:#92733e;color:#fff0cd}
.category-search{background:#122b45;border:1px solid #456e8e;color:#fff;caret-color:#8edbff}

const BANK=QUIZ_DATA.questions;
const GROUPS=QUIZ_DATA.groups;
const QMAP=new Map(BANK.map(q=>[q.id,q]));
const STORE_KEY='evd_mcq_v3_2026';
const iconTypes={single:'✍️',find:'🔎',multi:'☑️'};
const letters=['A','B','C','D'];
const DEFAULT_PROFILE=()=>({id:'student-default',name:'Bạn nhỏ',points:0,correct:0,answered:0,mistakes:{},history:[],session:null,lastResult:null});
const DEFAULT_DB=()=>({version:3,activeId:'student-default',profiles:[DEFAULT_PROFILE()],audio:false});
let storageNotice=false;
function safeRead(){try{const saved=localStorage.getItem(STORE_KEY);if(!saved)return DEFAULT_DB();const db=JSON.parse(saved);if(!db||db.version!==3||!Array.isArray(db.profiles)||!db.profiles.length)throw Error('Invalid data');return db;}catch(e){return DEFAULT_DB();}}
let db=safeRead();
let page='home';
let selected=[];
let groupSearch='';
let toastTimer;
const app=document.getElementById('app');
function active(){let p=db.profiles.find(p=>p.id===db.activeId);if(!p){p=db.profiles[0];db.activeId=p.id;}return p;}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(db));}catch(e){if(!storageNotice){storageNotice=true;toast('Trình duyệt đang chặn lưu dữ liệu. Điểm có thể mất khi đóng trang.');}}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function num(n){return Number(n||0).toLocaleString('vi-VN');}
function pct(c,n){return n?Math.round(c/n*100):0;}
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function getGroup(id){return GROUPS.find(g=>g.id===id);}
function needsReviewCount(p=active()){return Object.values(p.mistakes||{}).filter(x=>x.needsReview).length;}
function htmlPhrase(s){return esc(s).replace(/_______/g,'<span class="blank">_______</span>').replace(/\n/g,'<br>');}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',3300);}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'});}
function renderNav(){let show=!['quiz'].includes(page);let nav=document.getElementById('bottom-nav');nav.style.display=show?'flex':'none';if(!show)return;
const links=[['home','⌂','Trang chủ'],['categories','▤','Nhóm lỗi'],['notebook','▣','Sổ lỗi'],['progress','▥','Tiến bộ']];
nav.innerHTML=links.map(([id,icon,label])=>`<button type="button" class="nav-btn ${page===id?'active':''}" data-action="nav" data-page="${id}" ${page===id?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${icon}</span>${label}</button>`).join('');}
function renderHome(){let p=active();let acc=pct(p.correct,p.answered);let ses=p.session;
app.innerHTML=`<section class="hero"><div class="eyebrow">🌌 NỀN XANH ĐEN · LỚP 5 · KHÔNG CẦN MẠNG</div><h1>Chào ${esc(p.name)}!<br>Hôm nay mình viết đúng nhé! 🌟</h1><p>Mỗi câu chọn đúng được <strong>10 điểm</strong> và pháo hoa chúc mừng. Không phải gõ bàn phím đâu!</p><div class="hero-bottom"><button class="btn light" data-action="${ses?'resume':'start'}" data-kind="quick">${ses?'▶ Tiếp tục bài đang học':'Bắt đầu 10 câu'} <span aria-hidden="true">→</span></button><span class="hero-note">✨ Chạm nút ⛶ ở góc trên để mở toàn màn hình</span></div></section>
<div class="stats"><div class="stat"><span class="stat-emoji">⭐</span><span class="stat-number" data-testid="points">${num(p.points)}</span><span class="stat-label">Tổng điểm</span></div><div class="stat"><span class="stat-emoji">✅</span><span class="stat-number">${num(p.correct)}/${num(p.answered)}</span><span class="stat-label">Câu làm đúng</span></div><div class="stat"><span class="stat-emoji">🎯</span><span class="stat-number" data-testid="accuracy">${acc}%</span><span class="stat-label">Tỷ lệ đúng</span></div></div>
<h2 class="section-title">Em muốn luyện gì hôm nay?</h2><div class="tile-grid"><button class="tile" data-action="start" data-kind="quick"><span class="tile-icon">🎯</span><strong>Luyện 10 câu</strong><small>Bài hỗn hợp, lựa chọn bằng cách chạm</small></button><button class="tile violet" data-action="nav" data-page="categories"><span class="tile-icon">📚</span><strong>45 nhóm lỗi</strong><small>Chọn phần chính tả em muốn luyện</small></button><button class="tile orange" data-action="start" data-kind="review"><span class="tile-icon">🔁</span><strong>Ôn lại câu sai</strong><small>${needsReviewCount(p)} câu cần luyện tiếp</small></button><button class="tile green" data-action="start" data-kind="notebook"><span class="tile-icon">📝</span><strong>Lỗi từ bài vở</strong><small>Luyện nhầm từ, chép thừa và bỏ sót</small></button></div><div class="bottom-note"><span>💡</span><div><b>Mẹo nhỏ:</b> Em hãy đọc cả câu rồi mới chọn. Tỷ lệ đúng = số câu trả lời đúng ÷ tổng số câu đã trả lời. Kết quả được lưu trên máy.</div></div>`;

function normalizeSearch(s){return s.toLocaleLowerCase('vi-VN').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');}
function renderCategories(){app.innerHTML=`<div class="backline"><button data-action="nav" data-page="home" class="back-btn">← Trang chủ</button><span class="pill">📖 ${GROUPS.length} nhóm lỗi</span></div><h1 class="page-title">Chọn nhóm lỗi em muốn luyện</h1><p class="page-subtitle">Em chạm vào nhóm còn hay nhầm. Mỗi câu đều có bốn lựa chọn.</p><input id="group-search" class="category-search" type="search" placeholder="🔎 Tìm nhóm: s/x, hỏi/ngã, viết hoa…" aria-label="Tìm nhóm lỗi" value="${esc(groupSearch)}"><div id="category-list"></div>`;
paintCategories();}
function paintCategories(){const holder=document.getElementById('category-list');if(!holder)return;let query=normalizeSearch(groupSearch.trim());let arr=GROUPS.filter(g=>normalizeSearch(g.name+' '+g.section+' '+g.description).includes(query));if(!arr.length){holder.innerHTML='<div class="empty"><div class="icon">🔍</div><b>Chưa tìm thấy nhóm lỗi</b><p>Em thử nhập từ khóa khác nhé!</p></div>';return;}
let secs=[...new Set(arr.map(g=>g.section))];holder.innerHTML=secs.map(sec=>`<div class="category-section">${esc(sec)}</div>${arr.filter(g=>g.section===sec).map(g=>{let count=BANK.filter(q=>q.group===g.id).length;return `<button class="group-card" type="button" data-action="start" data-kind="group" data-group="${esc(g.id)}"><span class="group-initial" aria-hidden="true">${esc(g.name.slice(0,1).toUpperCase())}</span><span><b>${esc(g.name)}</b><small>${count} câu trắc nghiệm · ${esc(g.description)}</small></span><span class="group-arrow">›</span></button>`;}).join('')}`).join('');}
function mistakesOrdered(){let p=active();return Object.entries(p.mistakes||{}).filter(([id,m])=>QMAP.has(id)).sort((a,b)=>Number(b[1].needsReview)-Number(a[1].needsReview)||b[1].lastWrong.localeCompare(a[1].lastWrong));}
function renderNotebook(){let all=mistakesOrdered(),pending=all.filter(([id,m])=>m.needsReview);
app.innerHTML=`<div class="backline"><button data-action="nav" data-page="home" class="back-btn">← Trang chủ</button><span class="pill">🔁 ${pending.length} câu cần ôn</span></div><h1 class="page-title">Sổ tay lỗi sai</h1><p class="page-subtitle">Các lỗi em đã mắc sẽ được lưu lại để luyện sau. Một câu cần đúng ở ít nhất hai ngày khác nhau mới đánh dấu đã thuộc.</p>${pending.length?'<button class="btn primary full" data-action="start" data-kind="review">🔁 Ôn '+Math.min(10,pending.length)+' câu sai</button>':''}<h2 class="section-title">${all.length?'Những bài em từng nhầm':'Bắt đầu từ bài luyện đầu tiên nhé!'}</h2>${all.length?all.slice(0,80).map(([id,m])=>{let q=QMAP.get(id);return `<div class="note-card"><h3>${esc(getGroup(q.group)?.name||'Chính tả')}</h3><span class="note-status ${m.needsReview?'':'mastered'}">${m.needsReview?'Cần ôn thêm':'Đã ghi nhớ'}</span><p><b>Đáp án cần nhớ:</b> ${esc(q.answer)}</p><p>Số lần làm sai: <b>${m.wrongCount}</b></p></div>`}).join(''):`<div class="empty"><div class="icon">📒</div><b>Chưa có lỗi nào</b><p>Em làm bài để phần mềm ghi lại các câu cần ôn nhé.</p><button class="btn primary" data-action="start" data-kind="quick">Luyện 10 câu</button></div>`}`;
}
function renderProgress(){let p=active();let acc=pct(p.correct,p.answered);let recent=p.history.slice().reverse().slice(0,12);
app.innerHTML=`<div class="backline"><button class="back-btn" data-action="nav" data-page="home">← Trang chủ</button><span class="pill">📊 Cá nhân</span></div><h1 class="page-title">Tiến bộ của ${esc(p.name)}</h1><p class="page-subtitle">Tất cả số liệu chỉ lưu ở trình duyệt trên thiết bị này.</p><div class="stats"><div class="stat"><span class="stat-emoji">⭐</span><span class="stat-number">${num(p.points)}</span><span class="stat-label">Điểm</span></div><div class="stat"><span class="stat-emoji">✅</span><span class="stat-number">${p.correct}/${p.answered}</span><span class="stat-label">Làm đúng</span></div><div class="stat"><span class="stat-emoji">🎯</span><span class="stat-number">${acc}%</span><span class="stat-label">Tỷ lệ đúng</span></div></div><div class="note-card"><b>Hiểu tỷ lệ đúng</b><p>Tỷ lệ của em = ${p.correct} câu đúng / ${p.answered} câu đã trả lời = <b>${acc}%</b>. Mỗi câu đúng được cộng 10 điểm, câu sai không bị trừ điểm.</p><p>Em có <b>${needsReviewCount(p)}</b> câu cần ôn. Số câu đã làm bao gồm cả các lần ôn lại.</p></div><h2 class="section-title">Các buổi đã học</h2>${recent.length?`<div class="note-card">${recent.map(x=>`<div class="history-row"><div><b>${esc(x.label)}</b><small>${esc(x.date)} · ${x.correct}/${x.total} câu đúng</small></div><div class="percentage">${pct(x.correct,x.total)}%</div></div>`).join('')}</div>`:`<div class="empty"><div class="icon">📈</div><b>Chưa có kết quả</b><p>Hãy hoàn thành bài 10 câu đầu tiên của em!</p><button class="btn primary" data-action="start" data-kind="quick">Bắt đầu học</button></div>`}<div class="side-note">Thông tin chỉ lưu trên máy, có thể mất nếu xóa dữ liệu trình duyệt hoặc dùng chế độ ẩn danh.</div>`;
}
function mixQuestions(p){let used=new Set(),ids=[];
const mistakes=mistakesOrdered().filter(([id,m])=>m.needsReview).map(([id])=>id);
const byType=t=>shuffle(BANK.filter(q=>q.type===t&&(!used.has(q.id))),p.answered+1);
function push(arr,n){for(const q of arr){if(n<=0)break;let id=typeof q==='string'?q:q.id;if(!used.has(id)&&QMAP.has(id)){ids.push(id);used.add(id);n--;}}}
// A balanced ten-item lesson: six single-choice, two find-error and one multi-answer plus one revision question.
push(byType('single'),6);push(byType('find'),2);push(byType('multi'),1);
push(mistakes,1);push(shuffle(BANK,p.answered+23),10-ids.length);
return shuffle(ids,p.answered+4).slice(0,10);
}
function shuffle(items,salt=1){let out=items.slice();let seed=(Math.floor(Date.now()/86400000)*131+Number(salt||1)*347+17)>>>0;for(let i=out.length-1;i>0;i--){seed=(1664525*seed+1013904223)>>>0;let j=seed%(i+1);[out[i],out[j]]=[out[j],out[i]];}return out;}
function start(kind,group){stopFireworks();const p=active();if(p.session){if(!confirm('Em đang có bài chưa hoàn thành. Bắt đầu bài mới sẽ thay thế bài cũ. Em có muốn tiếp tục không?'))return;}
let ids=[],label='Luyện 10 câu';
if(kind==='quick'){ids=mixQuestions(p);label='Luyện hỗn hợp 10 câu';}
if(kind==='group'){ids=shuffle(BANK.filter(x=>x.group===group),p.answered+5).map(x=>x.id).slice(0,10);label=getGroup(group)?.name||'Nhóm chính tả';}
if(kind==='notebook'){ids=shuffle(BANK.filter(x=>x.origin==='notebook_20261012'),p.answered+11).map(x=>x.id).slice(0,10);label='Luyện lỗi từ bài vở';}
if(kind==='review'){ids=mistakesOrdered().filter(([id,m])=>m.needsReview).map(([id])=>id).slice(0,10);label='Ôn câu từng làm sai';}
if(!ids.length){toast(kind==='review'?'Em chưa có câu sai nào cần ôn. Hãy thử bài mới nhé!':'Chưa có bài trong nhóm này.');return;}
p.session={kind,label,ids,index:0,responses:{},startedAt:new Date().toISOString()};selected=[];page='quiz';save();render();scrollTop();}
function showQuestion(){let p=active(),s=p.session;if(!s){page='home';render();return;}let q=QMAP.get(s.ids[s.index]);if(!q){toast('Không mở được câu hỏi.');return;}
let response=s.responses[String(s.index)],answered=!!response;
if(answered)selected=response.selected.slice();
const statText=`${p.correct}/${p.answered} đúng · ${pct(p.correct,p.answered)}%`;
let groupName=getGroup(q.group)?.name||'Tiếng Việt';
app.innerHTML=`<div class="backline"><button type="button" data-action="nav" data-page="home" class="back-btn">← Tạm dừng</button><span class="pill">⭐ ${num(p.points)} điểm</span></div><div class="quiz-strip"><div style="min-width:0;flex:1"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px"><b style="font-size:13px">Câu ${s.index+1}/${s.ids.length}</b><small style="color:var(--muted);font-weight:750">${esc(s.label)}</small></div><div class="progress-track" role="progressbar" aria-valuenow="${s.index+(answered?1:0)}" aria-valuemin="0" aria-valuemax="${s.ids.length}"><div class="progress-fill" style="width:${(s.index+(answered?1:0))/s.ids.length*100}%"></div></div></div><div style="white-space:nowrap;font-weight:900;color:var(--accent);font-size:12px">${statText}</div></div>
<div class="prompt-card"><span class="badge ${q.type}">${iconTypes[q.type]||'✍️'} ${esc(groupName)}</span><h2>${esc(q.prompt)}</h2><div class="sentence">${htmlPhrase(q.stem)}</div></div><div class="choose-label">${q.type==='multi'?'CHỌN CÁC ĐÁP ÁN ĐÚNG':'CHẠM VÀO MỘT ĐÁP ÁN'}</div><div class="choices" id="choice-list">${q.options.map((a,i)=>{let chosen=selected.includes(i);let correct=q.correct.includes(i);let classes=(chosen?' selected':'')+(answered&&correct?' right':'')+(answered&&chosen&&!correct?' wrong':'');return `<button type="button" class="choice${classes}" data-action="choice" data-option="${i}" ${answered?'disabled':''} aria-label="Đáp án ${letters[i]}: ${esc(a)}" aria-pressed="${chosen}"><span class="choice-letter">${letters[i]}</span><span class="choice-text">${esc(a)}</span><span class="choice-symbol" aria-hidden="true">${answered&&correct?'✓':(answered&&chosen?'×':(q.type==='multi'&&chosen?'☑':'') )}</span></button>`}).join('')}</div><div class="choice-note">${q.type==='multi'?'☑ Em có thể chọn nhiều ô rồi bấm Kiểm tra.':'🌼 Em chọn một đáp án. Phần mềm chấm ngay và tính tỷ lệ đúng.'}</div><div id="feedback-area" aria-live="polite">${answered?feedbackHTML(q,response,p):q.type==='multi'?`<button class="btn primary full" data-action="submit-multi" id="check-multi" ${selected.length?'':'disabled'}>Kiểm tra đáp án</button>`:''}</div>`;
}
function feedbackHTML(q,resp,p){let title=resp.ok?'🎆 Chính xác! +10 điểm':'🌱 Chưa đúng, mình cùng học lại nhé!';let ok=resp.ok;
let thisRun=Object.values(p.session?.responses||{}), runCorrect=thisRun.filter(x=>x.ok).length,runRate=pct(runCorrect,thisRun.length);
let answerLabel=q.type==='find'?`Từ sai là “${q.options[q.correct[0]]}”; viết đúng: “${q.answer}”.`:(q.type==='multi'?`Các đáp án đúng: ${q.correct.map(i=>q.options[i]).join(' · ')}`:`Đáp án đúng: ${q.answer}`);
return `<div class="feedback ${ok?'':'fail'}" id="answer-feedback"><div class="feedback-title ${ok?'success':'fail'}">${title}</div><div class="answer-line">${esc(answerLabel)}</div><div class="explain">${esc(q.explanation)} ${esc(q.detail||'')}</div><div class="live-stat"><span>⭐ Tổng: ${num(p.points)} điểm</span><span>🎯 Buổi này: ${runCorrect}/${thisRun.length} · ${runRate}%</span><span style="font-size:11px;color:var(--muted)">Tỷ lệ chung: ${p.correct}/${p.answered} · ${pct(p.correct,p.answered)}%</span></div><button class="btn primary full" data-action="next">${p.session&&p.session.index===p.session.ids.length-1?'Xem kết quả buổi học →':'Câu tiếp theo →'}</button></div>`;}
function pick(ix){const p=active(),s=p.session;if(!s||s.responses[String(s.index)])return;const q=QMAP.get(s.ids[s.index]);if(!q||!q.options[ix])return;
if(q.type==='multi'){
if(selected.includes(ix))selected=selected.filter(i=>i!==ix);else selected=[...selected,ix].sort((a,b)=>a-b);
showQuestion();return;
}
selected=[ix];grade();}
function grade(){let p=active(),s=p.session;if(!s||s.responses[String(s.index)])return;let q=QMAP.get(s.ids[s.index]);if(!q||!selected.length)return;
const selections=[...selected].sort((a,b)=>a-b);const expected=[...q.correct].sort((a,b)=>a-b);const right=selections.join(',')===expected.join(',');
if(!right)stopFireworks();
s.responses[String(s.index)]={selected:selections,ok:right,time:new Date().toISOString()};
p.answered++;if(right){p.correct++;p.points+=10;}
const prev=p.mistakes[q.id];
if(!right){let m=prev||{wrongCount:0,successDays:[],needsReview:true};m.wrongCount++;m.lastWrong=new Date().toISOString();m.lastChoice=selections.map(i=>q.options[i]).join(' · ');m.needsReview=true;m.successDays=[];p.mistakes[q.id]=m;}
else if(prev&&prev.needsReview){if(!Array.isArray(prev.successDays))prev.successDays=[];let d=today();if(!prev.successDays.includes(d))prev.successDays.push(d);if(prev.successDays.length>=2)prev.needsReview=false;}
save();showQuestion();
if(right){fireworks();playSuccessSound();}
setTimeout(()=>{let fb=document.getElementById('answer-feedback');if(fb&&window.innerHeight<900)fb.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'nearest'});},160);
}
function next(){stopFireworks();let p=active(),s=p.session;if(!s||!s.responses[String(s.index)])return;
if(s.index+1>=s.ids.length){finish();return;}
s.index++;selected=[];save();showQuestion();scrollTop();}
function finish(){let p=active(),s=p.session;if(!s)return;let responses=Object.values(s.responses);let count=responses.length,correct=responses.filter(x=>x.ok).length;
let result={label:s.label,kind:s.kind,correct,total:count,points:correct*10,date:new Date().toLocaleDateString('vi-VN'), ids:s.ids.slice(),wrongIds:s.ids.filter((id,i)=>!s.responses[String(i)]?.ok)};
p.history.push({label:result.label,correct,total:count,date:result.date});if(p.history.length>150)p.history=p.history.slice(-150);
p.lastResult=result;p.session=null;page='result';save();render();scrollTop();if(correct===count)fireworks();}
function renderResult(){let p=active(),r=p.lastResult;if(!r){page='home';renderHome();return;}
let percentage=pct(r.correct,r.total),message=percentage===100?'Xuất sắc! Trọn vẹn 10 điểm cho mỗi câu!':percentage>=80?'Rất giỏi! Em đang tiến bộ!':percentage>=60?'Tốt lắm! Tiếp tục luyện nhé!':'Cứ luyện đều, em sẽ viết tốt hơn!';
app.innerHTML=`<div class="backline"><button class="back-btn" data-action="nav" data-page="home">← Trang chủ</button><span class="pill">🏁 Hoàn thành</span></div><div class="result-card"><div class="result-symbol">${percentage===100?'🏆':'🎉'}</div><h1 class="page-title">${esc(message)}</h1><p class="page-subtitle">${esc(r.label)}</p><div class="result-ring" style="--progress:${percentage}%"><div class="result-ring-inner"><b>${percentage}%</b><small>TỶ LỆ LÀM ĐÚNG</small></div></div><div class="result-data"><div><b>${r.correct}/${r.total}</b><small>Câu đúng</small></div><div><b>+${r.points}</b><small>Điểm nhận được</small></div><div><b>${r.wrongIds.length}</b><small>Câu cần ôn</small></div></div><p style="font-size:13px;color:var(--muted)">Điểm và tỷ lệ đã được lưu vào hồ sơ ${esc(p.name)}.</p><div class="result-buttons"><button class="btn primary full" data-action="start" data-kind="quick">🎯 Luyện 10 câu mới</button>${needsReviewCount(p)?'<button class="btn ghost full" data-action="start" data-kind="review">🔁 Ôn lại câu sai</button>':''}<button class="btn outline full" data-action="nav" data-page="home">Về trang chủ</button></div></div>`;
}
function render(){document.getElementById('header-name').textContent=active().name;renderNav();
if(page==='home')renderHome();else if(page==='quiz')showQuestion();else if(page==='categories')renderCategories();else if(page==='notebook')renderNotebook();else if(page==='progress')renderProgress();else if(page==='result')renderResult();else {page='home';renderHome();}}
function goto(dest){page=dest;groupSearch='';selected=[];render();scrollTop();}
function openProfiles(){let dialog=document.getElementById('profiles-dialog');let current=active();document.getElementById('sound-toggle').textContent=db.audio?'🔊 Tắt âm thanh chúc mừng':'🔇 Bật âm thanh chúc mừng';document.getElementById('profiles-list').innerHTML=db.profiles.map(p=>`<button class="profile-item ${p.id===current.id?'active':''}" data-action="switch-profile" data-id="${esc(p.id)}"><span>👤 ${esc(p.name)}</span><span>${p.id===current.id?'Đang học ✓':'Chọn →'}</span></button>`).join('');dialog.showModal();}
function closeProfiles(){document.getElementById('profiles-dialog').close();}
function addProfile(){let input=document.getElementById('new-profile-name');let name=input.value.trim().replace(/\s+/g,' ');if(!name){toast('Em nhập tên học sinh trước nhé!');input.focus();return;}if(db.profiles.length>=20){toast('Thiết bị chỉ cho phép tối đa 20 hồ sơ.');return;}
let id='student-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);db.profiles.push({...DEFAULT_PROFILE(),id,name});db.activeId=id;save();input.value='';closeProfiles();goto('home');}
function switchProfile(id){if(!db.profiles.some(x=>x.id===id))return;db.activeId=id;save();closeProfiles();goto('home');}


// Fullscreen API: Android Chrome requires a direct user tap, so the screen does not
// try to enter fullscreen automatically on loading a local HTML file.
function fullscreenActive(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function syncFullscreenUI(){
 const btn=document.getElementById('fullscreen-toggle');if(!btn)return;
 const on=fullscreenActive();const label=on?'Thoát toàn màn hình':'Bật chế độ toàn màn hình';
 btn.setAttribute('aria-pressed',String(on));btn.setAttribute('aria-label',label);btn.title=label;
 btn.querySelector('.fullscreen-icon').textContent=on?'⤢':'⛶';
 btn.querySelector('.fullscreen-label').textContent=on?'Thu nhỏ':'Toàn màn hình';
}
function toggleFullscreen(){
 if(fullscreenActive()){
  const leave=document.exitFullscreen||document.webkitExitFullscreen;
  if(leave) Promise.resolve(leave.call(document)).catch(()=>toast('Không thể thoát toàn màn hình. Em bấm nút quay lại trên điện thoại nhé.'));
  return;
 }
 const root=document.documentElement;
 const enter=root.requestFullscreen||root.webkitRequestFullscreen;
 if(!enter){toast('Trình duyệt này chưa hỗ trợ. Em hãy mở tệp bằng Chrome trên Android.');return;}
 try{
  const result=(root.requestFullscreen?root.requestFullscreen({navigationUI:'hide'}):root.webkitRequestFullscreen());
  Promise.resolve(result).then(syncFullscreenUI).catch(()=>toast('Không thể bật toàn màn hình ở trình duyệt này. Hãy thử mở bằng Chrome.'));
 }catch(e){toast('Không bật được toàn màn hình. Em hãy thử bằng Chrome trên Android.');}
}
document.addEventListener('fullscreenchange',syncFullscreenUI);
document.addEventListener('webkitfullscreenchange',syncFullscreenUI);

document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;const act=el.dataset.action;
if(act==='fullscreen')return toggleFullscreen();
 if(act==='nav')return goto(el.dataset.page);
if(act==='start')return start(el.dataset.kind,el.dataset.group);
if(act==='resume'){page=active().session?'quiz':'home';render();scrollTop();return;}
if(act==='choice')return pick(Number(el.dataset.option));
if(act==='submit-multi')return grade();
if(act==='next')return next();
if(act==='profiles')return openProfiles();
if(act==='toggle-sound'){db.audio=!db.audio;save();document.getElementById('sound-toggle').textContent=db.audio?'🔊 Tắt âm thanh chúc mừng':'🔇 Bật âm thanh chúc mừng';return;}
if(act==='close-profiles')return closeProfiles();
if(act==='switch-profile')return switchProfile(el.dataset.id);
if(act==='add-profile')return addProfile();
});
document.addEventListener('input',event=>{if(event.target.id==='group-search'){groupSearch=event.target.value;paintCategories();}});
document.getElementById('new-profile-name').addEventListener('keydown',e=>{if(e.key==='Enter')addProfile();});
// Fireworks: generated on-device with canvas, no remote images, scripts or connection needed.
const canvas=document.getElementById('fireworks-canvas');const ctx=canvas.getContext('2d');let particles=[],fxRaf=0,fxUntil=0;
function stopFireworks(){if(fxRaf)cancelAnimationFrame(fxRaf);fxRaf=0;particles=[];if(ctx)ctx.clearRect(0,0,innerWidth,innerHeight);}
function fitCanvas(){let d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);ctx.setTransform(d,0,0,d,0,0);}
function fireworks(){if(!ctx)return;if(matchMedia('(prefers-reduced-motion: reduce)').matches){toast('🎉 Xuất sắc! +10 điểm!');return;}
fitCanvas();const cols=['#ffba42','#27d5ad','#ff708f','#8a81ff','#59baff','#fff0ad','#ff639d'];
for(let z=0;z<5;z++){const x=innerWidth*(.13+Math.random()*.73),y=innerHeight*(.13+Math.random()*.48),n=27;
for(let i=0;i<n;i++){let angle=i/n*Math.PI*2+Math.random()*.09,speed=1.45+Math.random()*4.8;particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,r:1.7+Math.random()*2.9,life:1,decay:.011+Math.random()*.014,color:cols[(i+z)%cols.length],phase:Math.random()*.2});}}
fxUntil=performance.now()+2100;if(!fxRaf)fxRaf=requestAnimationFrame(tickFireworks);}
function tickFireworks(now){ctx.clearRect(0,0,innerWidth,innerHeight);ctx.save();ctx.globalCompositeOperation='lighter';particles=particles.filter(p=>p.life>0);for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy=p.vy*.987+.075;p.life-=p.decay;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
ctx.restore();if(now<fxUntil&&particles.length){fxRaf=requestAnimationFrame(tickFireworks);}else{ctx.clearRect(0,0,innerWidth,innerHeight);particles=[];fxRaf=0;}}
function playSuccessSound(){if(!db.audio)return;try{let Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;let ac=new Audio();[523,659,784].forEach((freq,i)=>{let oscillator=ac.createOscillator(),gain=ac.createGain();oscillator.type='sine';oscillator.frequency.value=freq;gain.gain.setValueAtTime(.001,ac.currentTime+i*.11);gain.gain.exponentialRampToValueAtTime(.09,ac.currentTime+i*.11+.025);gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.11+.15);oscillator.connect(gain);gain.connect(ac.destination);oscillator.start(ac.currentTime+i*.11);oscillator.stop(ac.currentTime+i*.11+.16);});}catch(e){}}
window.addEventListener('resize',()=>{if(fxRaf)fitCanvas();});
// Stable introspection surface, used only for automated regression testing.
window.EVDiagnostics={getData:()=>QUIZ_DATA,getState:()=>JSON.parse(JSON.stringify({page,selected,db})),getCurrent:()=>{let p=active();return p.session?QMAP.get(p.session.ids[p.session.index]):null;},getFxCount:()=>particles.length};
render();
syncFullscreenUI();
</script>
